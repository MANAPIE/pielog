<svg viewBox="0 0 500 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ac">
  <title id="t-ac">가정 검증 카드</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nm-inv { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-bg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .cap-inv { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-bg); opacity: 0.85; }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .tag { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: var(--c-accent-2); }
      .leader { stroke: var(--c-muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ac" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ac-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-accent)" /></marker>
  </defs>


  <rect class="bg" width="500" height="532" />
  <g transform="translate(24 24)">
    <rect width="452" height="140" rx="8" class="card" stroke="var(--c-accent-2)" />
    <text x="20" y="26" class="th">가정</text>
    <text x="20" y="48" class="nm">사용자는 고급 필터를 원한다</text>
    <line x1="20" y1="64" x2="432" y2="64" stroke="var(--c-divider)" stroke-width="1" />
    <text x="20" y="86" class="th">검증 방법</text>
    <text x="20" y="106" class="td">3개월 로그 분석</text>
    <text x="220" y="86" class="th">결과</text>
    <text x="220" y="106" class="td">고급 필터 사용 세션 4%</text>
    <text x="220" y="124" class="td">기본 검색 재시도가 더 많음</text>
    <rect x="380" y="14" width="56" height="20" rx="10" fill="var(--c-accent-2)" />
    <text x="408" y="28" class="lbl" fill="var(--c-card)" text-anchor="middle">기각</text>
  </g>
  <g transform="translate(24 180)">
    <rect width="452" height="140" rx="8" class="card" stroke="var(--c-accent-2)" />
    <text x="20" y="26" class="th">가정</text>
    <text x="20" y="48" class="nm">온보딩 3단계는 건너뛰지 않을 것이다</text>
    <line x1="20" y1="64" x2="432" y2="64" stroke="var(--c-divider)" stroke-width="1" />
    <text x="20" y="86" class="th">검증 방법</text>
    <text x="20" y="106" class="td">사용성 테스트 5명</text>
    <text x="220" y="86" class="th">결과</text>
    <text x="220" y="106" class="td">5명 중 4명이</text>
    <text x="220" y="124" class="td">두 번째 화면에서 건너뛰기를 누름</text>
    <rect x="380" y="14" width="56" height="20" rx="10" fill="var(--c-accent-2)" />
    <text x="408" y="28" class="lbl" fill="var(--c-card)" text-anchor="middle">기각</text>
  </g>
  <g transform="translate(24 336)">
    <rect width="452" height="140" rx="8" class="card" stroke="var(--c-accent)" />
    <text x="20" y="26" class="th">가정</text>
    <text x="20" y="48" class="nm">배송비를 상품 페이지에서 보여주면 결제 이탈이 줄 것이다</text>
    <line x1="20" y1="64" x2="432" y2="64" stroke="var(--c-divider)" stroke-width="1" />
    <text x="20" y="86" class="th">검증 방법</text>
    <text x="20" y="106" class="td">A/B 테스트 2주</text>
    <text x="220" y="86" class="th">결과</text>
    <text x="220" y="106" class="td">결제 단계 이탈 6%p 감소</text>
    <text x="220" y="124" class="td"></text>
    <rect x="380" y="14" width="56" height="20" rx="10" fill="var(--c-accent)" />
    <text x="408" y="28" class="lbl" fill="var(--c-card)" text-anchor="middle">채택</text>
  </g>
  <text x="24" y="500" class="cap">가정을 문장으로 적어야 검증 대상이 됩니다.</text>
  <text x="24" y="518" class="cap">적지 않은 가정은 "누가 확인했는가"라는 질문 자체가 생기지 않습니다.</text>
</svg>
