<svg viewBox="0 0 500 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hcd">
  <title id="t-hcd">ISO 9241-210 인간 중심 설계의 네 활동 순환</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nm-inv { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-bg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .cap-inv { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-bg); opacity: 0.85; }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .tag { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: var(--c-accent-2); }
      .leader { stroke: var(--c-muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-hcd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-hcd-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>


  <rect class="bg" width="500" height="512" />
  <g transform="translate(150 24)">
    <rect width="200" height="40" rx="20" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
    <text x="100" y="25" class="nm" text-anchor="middle">설계 계획</text>
  </g>
  <path d="M250 64 V80 H131 V92" fill="none" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-hcd)" />
  <g transform="translate(24 100)">
    <rect width="214" height="84" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
    <text x="16" y="26" class="ep" style="fill:var(--c-accent-3)">1</text>
    <text x="34" y="26" class="nm">사용 맥락 이해</text>
    <text x="16" y="50" class="cap">사용자 인터뷰 · 현장 관찰</text>
    <text x="16" y="68" class="cap">로그와 CS 기록 분석</text>
  </g>
  <g transform="translate(262 100)">
    <rect width="214" height="84" rx="8" fill="var(--c-soft-4)" stroke="var(--c-accent-4)" stroke-width="1.6" />
    <text x="16" y="26" class="ep" style="fill:var(--c-accent-4)">2</text>
    <text x="34" y="26" class="nm">사용자 요구사항 명시</text>
    <text x="16" y="50" class="cap">페르소나 · 시나리오</text>
    <text x="16" y="68" class="cap">핵심 과업</text>
  </g>
  <g transform="translate(262 300)">
    <rect width="214" height="84" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="16" y="26" class="ep" style="fill:var(--c-accent-2)">3</text>
    <text x="34" y="26" class="nm">설계 해결책 생성</text>
    <text x="16" y="50" class="cap">와이어프레임 · 프로토타입</text>
    <text x="16" y="68" class="cap">대안 비교</text>
  </g>
  <g transform="translate(24 300)">
    <rect width="214" height="84" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
    <text x="16" y="26" class="ep" style="fill:var(--c-accent)">4</text>
    <text x="34" y="26" class="nm">요구사항 대비 평가</text>
    <text x="16" y="50" class="cap">사용성 테스트 · 휴리스틱 평가</text>
    <text x="16" y="68" class="cap">A/B 테스트</text>
  </g>
  <line x1="239" y1="142" x2="254" y2="142" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-hcd)" />
  <line x1="369" y1="185" x2="369" y2="292" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-hcd)" />
  <line x1="261" y1="342" x2="246" y2="342" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-hcd)" />
  <line x1="60" y1="299" x2="60" y2="192" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-hcd)" />

  <path d="M110 299 V192" fill="none" stroke="var(--c-fg)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-hcd-d)" />
  <path d="M200 299 V240 H340 V192" fill="none" stroke="var(--c-fg)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-hcd-d)" />
  <path d="M239 372 H254" fill="none" stroke="var(--c-fg)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-hcd-d)" />
  <g transform="translate(210 250)">
    <rect width="80" height="22" rx="11" fill="var(--c-card)" stroke="var(--c-fg)" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="40" y="15" class="lbl" fill="var(--c-fg)" text-anchor="middle">반복</text>
  </g>

  <line x1="131" y1="385" x2="131" y2="408" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-hcd)" />
  <g transform="translate(24 416)">
    <rect width="214" height="36" rx="18" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
    <text x="107" y="23" class="td" text-anchor="middle">요구사항 충족 시 종료</text>
  </g>
  <text x="24" y="480" class="cap">평가 결과에 따라 어느 활동으로든 돌아갈 수 있습니다.</text>
  <text x="24" y="498" class="cap">출처: ISO 9241-210:2019, Figure 1을 재구성.</text>
</svg>
