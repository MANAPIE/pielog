<svg viewBox="0 0 500 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ck">
  <title id="t-ck">지식의 저주 실험 결과</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nm-inv { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-bg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .cap-inv { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-bg); opacity: 0.85; }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .tag { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: var(--c-accent-2); }
      .leader { stroke: var(--c-muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ck" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ck-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-accent)" /></marker>
  </defs>


  <rect class="bg" width="500" height="310" />
  <text x="24" y="34" class="th">정답률</text>
  <text x="476" y="34" class="cap" text-anchor="end">120곡을 손가락으로 두드려 곡명 맞히기</text>
  <line x1="24" y1="42" x2="476" y2="42" stroke="var(--c-divider)" stroke-width="1" />
  <g transform="translate(24 58)">
    <text x="0" y="16" class="td">두드리는 사람의 예측</text>
    <rect x="140" y="3" width="200" height="20" rx="3" fill="var(--c-accent-3)" />
    <text x="348" y="17" class="val" fill="var(--c-accent-3)">50%</text>
  </g>
  <g transform="translate(24 102)">
    <text x="0" y="16" class="td">실제 정답률</text>
    <rect x="140" y="3" width="10" height="20" rx="3" fill="var(--c-accent-2)" />
    <text x="158" y="17" class="val" fill="var(--c-accent-2)">2.5% (120곡 중 3곡)</text>
  </g>
  <path d="M364 84 V108" fill="none" stroke="var(--c-muted)" stroke-width="1" />
  <path d="M174 108 H364" fill="none" stroke="var(--c-muted)" stroke-width="1" stroke-dasharray="2 3" />
  <text x="372" y="100" class="cap">차이 47.5%p</text>
  <g transform="translate(24 150)">
    <rect width="452" height="104" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="20" y="26" class="ttl">두드리는 쪽과 듣는 쪽</text>
    <text x="20" y="50" class="cap">두드리는 사람의 머릿속에는 멜로디가 흐르지만,</text>
    <text x="20" y="68" class="cap">듣는 사람에게는 박자 없는 소음만 들립니다.</text>
    <text x="20" y="86" class="cap">프로덕트를 만드는 팀은 모두 두드리는 쪽에 서 있습니다.</text>
  </g>
  <text x="24" y="280" class="cap">출처: Newton, E. (1990). Stanford University.</text>
  <text x="24" y="298" class="cap">Heath &amp; Heath (2007) Made to Stick에서 재인용.</text>
</svg>
