<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 486" width="500" height="486" role="img" aria-labelledby="t">
  <title id="t">크기별 피드 화면의 세로 배분</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280; --c-card: #FFFFFF;
        --c-line: #C9CDD3; --c-divider: #E5E7EB;
        --c-soft: #FDEEE4; --c-soft-2: #E6ECFB;
        --c-accent: #C2410C; --c-accent-2: #1D4ED8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0; --c-card: #161B22;
          --c-line: #4A525E; --c-divider: #262D36;
          --c-soft: #2B1C12; --c-soft-2: #15213A;
          --c-accent: #E8681A; --c-accent-2: #3B82F6;
        }
      }
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", sans-serif; }
      .bg { fill: var(--c-bg); }
      .fixed { fill: url(#hatch); stroke: var(--c-line); stroke-width: 1.5; }
      .hatch-line { stroke: var(--c-line); stroke-width: 1.5; }
      .scroll { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 1.5; }
      .scroll-duo { fill: var(--c-soft-2); stroke: var(--c-accent); stroke-width: 2; }
      .backing { fill: var(--c-card); }
      .baseline { stroke: var(--c-muted); stroke-width: 1; }
      .t-fg { fill: var(--c-fg); }
      .t-muted { fill: var(--c-muted); }
      .t-accent { fill: var(--c-accent); }
      .h { font-size: 14px; font-weight: 700; }
      .note { font-size: 12px; }
      .val { font-size: 11px; font-weight: 600; }
      .count { font-size: 12px; font-weight: 700; }
      .size { font-size: 12px; font-weight: 700; }
      .role { font-size: 11.5px; }
    </style>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" style="fill: var(--c-card)"/>
      <line x1="0" y1="0" x2="0" y2="6" class="hatch-line"/>
    </pattern>
  </defs>

  <rect class="bg" x="0" y="0" width="500" height="486"/>

  <text class="t-fg h" x="24" y="28">크기별 피드 화면의 세로 배분</text>
  <text class="t-muted note" x="24" y="48">헤더가 보일 때 기준이고, 축척은 0.3배입니다.</text>

  <!-- 막대 높이 = 뷰포트 높이 × 0.3, 바닥선 y=360. 위 고정 227(68.1), 아래 탭바 66(19.8) -->
  <!-- 열 간격 75.33, 막대 폭 52, 막대 중심 x = 24 + 75.33 × (i + 0.5) -->

  <!-- 320 × 568: 높이 170.4 → 위 189.6 -->
  <rect class="fixed" x="35.7" y="189.6" width="52" height="68.1"/>
  <rect class="scroll" x="35.7" y="257.7" width="52" height="82.5"/>
  <rect class="fixed" x="35.7" y="340.2" width="52" height="19.8"/>
  <rect class="backing" x="47.7" y="214.6" width="28" height="18" rx="3"/>
  <text class="t-fg val" x="61.7" y="227.6" text-anchor="middle">227</text>
  <text class="t-fg count" x="61.7" y="303.0" text-anchor="middle">글 1개</text>
  <rect class="backing" x="50.7" y="341.1" width="22" height="18" rx="3"/>
  <text class="t-fg val" x="61.7" y="354.1" text-anchor="middle">66</text>
  <text class="t-fg size" x="61.7" y="380" text-anchor="middle">320 × 568</text>
  <text class="t-muted role" x="61.7" y="397" text-anchor="middle">하한</text>

  <!-- 382 × 644: 높이 193.2 → 위 166.8 -->
  <rect class="fixed" x="111.0" y="166.8" width="52" height="68.1"/>
  <rect class="scroll" x="111.0" y="234.9" width="52" height="105.3"/>
  <rect class="fixed" x="111.0" y="340.2" width="52" height="19.8"/>
  <rect class="backing" x="123.0" y="191.8" width="28" height="18" rx="3"/>
  <text class="t-fg val" x="137.0" y="204.8" text-anchor="middle">227</text>
  <text class="t-fg count" x="137.0" y="291.6" text-anchor="middle">글 1개</text>
  <rect class="backing" x="126.0" y="341.1" width="22" height="18" rx="3"/>
  <text class="t-fg val" x="137.0" y="354.1" text-anchor="middle">66</text>
  <text class="t-fg size" x="137.0" y="380" text-anchor="middle">382 × 644</text>
  <text class="t-muted role" x="137.0" y="397" text-anchor="middle">접힘 안쪽</text>

  <!-- 390 × 844: 높이 253.2 → 위 106.8 -->
  <rect class="fixed" x="186.3" y="106.8" width="52" height="68.1"/>
  <rect class="scroll" x="186.3" y="174.9" width="52" height="165.3"/>
  <rect class="fixed" x="186.3" y="340.2" width="52" height="19.8"/>
  <rect class="backing" x="198.3" y="131.8" width="28" height="18" rx="3"/>
  <text class="t-fg val" x="212.3" y="144.8" text-anchor="middle">227</text>
  <text class="t-fg count" x="212.3" y="261.6" text-anchor="middle">글 3개</text>
  <rect class="backing" x="201.3" y="341.1" width="22" height="18" rx="3"/>
  <text class="t-fg val" x="212.3" y="354.1" text-anchor="middle">66</text>
  <text class="t-fg size" x="212.3" y="380" text-anchor="middle">390 × 844</text>
  <text class="t-muted role" x="212.3" y="397" text-anchor="middle">일반 아이폰</text>

  <!-- 466 × 678: 높이 203.4 → 위 156.6. 듀오 접힘이라 강조색 테두리 -->
  <rect class="fixed" x="261.7" y="156.6" width="52" height="68.1"/>
  <rect class="scroll-duo" x="261.7" y="224.7" width="52" height="115.5"/>
  <rect class="fixed" x="261.7" y="340.2" width="52" height="19.8"/>
  <rect class="backing" x="273.7" y="181.6" width="28" height="18" rx="3"/>
  <text class="t-fg val" x="287.7" y="194.6" text-anchor="middle">227</text>
  <text class="t-accent count" x="287.7" y="286.5" text-anchor="middle">글 2개</text>
  <rect class="backing" x="276.7" y="341.1" width="22" height="18" rx="3"/>
  <text class="t-fg val" x="287.7" y="354.1" text-anchor="middle">66</text>
  <text class="t-accent size" x="287.7" y="380" text-anchor="middle">466 × 678</text>
  <text class="t-accent role" x="287.7" y="397" text-anchor="middle">듀오 접힘</text>

  <!-- 669 × 951: 높이 285.3 → 위 74.7 -->
  <rect class="fixed" x="337.0" y="74.7" width="52" height="68.1"/>
  <rect class="scroll" x="337.0" y="142.8" width="52" height="197.4"/>
  <rect class="fixed" x="337.0" y="340.2" width="52" height="19.8"/>
  <rect class="backing" x="349.0" y="99.7" width="28" height="18" rx="3"/>
  <text class="t-fg val" x="363.0" y="112.7" text-anchor="middle">227</text>
  <text class="t-fg count" x="363.0" y="245.5" text-anchor="middle">글 4개</text>
  <rect class="backing" x="352.0" y="341.1" width="22" height="18" rx="3"/>
  <text class="t-fg val" x="363.0" y="354.1" text-anchor="middle">66</text>
  <text class="t-fg size" x="363.0" y="380" text-anchor="middle">669 × 951</text>
  <text class="t-muted role" x="363.0" y="397" text-anchor="middle">펼침 세로</text>

  <!-- 951 × 669: 높이 200.7 → 위 159.3 -->
  <rect class="fixed" x="412.3" y="159.3" width="52" height="68.1"/>
  <rect class="scroll" x="412.3" y="227.4" width="52" height="112.8"/>
  <rect class="fixed" x="412.3" y="340.2" width="52" height="19.8"/>
  <rect class="backing" x="424.3" y="184.3" width="28" height="18" rx="3"/>
  <text class="t-fg val" x="438.3" y="197.3" text-anchor="middle">227</text>
  <text class="t-fg count" x="438.3" y="287.8" text-anchor="middle">글 2개</text>
  <rect class="backing" x="427.3" y="341.1" width="22" height="18" rx="3"/>
  <text class="t-fg val" x="438.3" y="354.1" text-anchor="middle">66</text>
  <text class="t-fg size" x="438.3" y="380" text-anchor="middle">951 × 669</text>
  <text class="t-muted role" x="438.3" y="397" text-anchor="middle">펼침 가로</text>

  <line class="baseline" x1="24" y1="360" x2="476" y2="360"/>

  <!-- 범례 -->
  <rect class="fixed" x="24" y="418" width="16" height="12" style="stroke-width: 1"/>
  <text class="t-muted note" x="46" y="428.5">고정 영역(헤더와 카테고리 칩, 탭바)</text>
  <rect class="scroll" x="270" y="418" width="16" height="12"/>
  <text class="t-muted note" x="292" y="428.5">스크롤 영역</text>

  <text class="t-muted note" x="24" y="456">아래로 내리면 헤더가 숨어 고정 영역은 탭바 66만 남습니다.</text>
  <text class="t-muted note" x="24" y="474">쿠랑 테스트 서버를 크롬 기기 에뮬레이션으로 잰 값입니다.</text>
</svg>
