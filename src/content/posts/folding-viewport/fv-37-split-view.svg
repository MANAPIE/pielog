<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 934" width="500" height="934" role="img" aria-labelledby="t">
  <title id="t">스플릿 뷰에서 뒤집히는 레일</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280; --c-card: #FFFFFF;
        --c-line: #C9CDD3; --c-divider: #E5E7EB;
        --c-soft: #FDEEE4; --c-soft-2: #E6ECFB;
        --c-accent: #C2410C; --c-accent-2: #1D4ED8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0; --c-card: #161B22;
          --c-line: #4A525E; --c-divider: #262D36;
          --c-soft: #2B1C12; --c-soft-2: #15213A;
          --c-accent: #E8681A; --c-accent-2: #3B82F6;
        }
      }
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", sans-serif; }
      .bg { fill: var(--c-bg); }
      .screen { fill: var(--c-card); stroke: var(--c-fg); stroke-width: 1.5; }
      .content { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 1; }
      .btn { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1; }
      .btn-on { fill: var(--c-accent); }
      .system { fill: url(#hatch); stroke: var(--c-line); stroke-width: 1; }
      .hatch-line { stroke: var(--c-line); stroke-width: 1.5; }
      .panel { fill: var(--c-divider); }
      .sel { fill: var(--c-divider); }
      .ph { fill: var(--c-line); }
      .seg-box { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1; }
      .seg-on { fill: var(--c-divider); }
      .shadow { fill: var(--c-line); opacity: 0.6; }
      .fold { stroke: var(--c-accent-2); stroke-width: 1.2; stroke-dasharray: 4 3; }
      .problem { fill: none; stroke: var(--c-accent); stroke-width: 1.2; stroke-dasharray: 3 2; }
      .dim { stroke: var(--c-muted); stroke-width: 0.8; }
      .t-fg { fill: var(--c-fg); }
      .t-muted { fill: var(--c-muted); }
      .h { font-size: 14px; font-weight: 700; }
      .seg { font-size: 12px; font-weight: 600; }
      .note { font-size: 12px; }
      .tiny { font-size: 10px; }
      .tiny-b { font-size: 10px; font-weight: 600; }
    </style>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" style="fill: var(--c-card)"/>
      <line x1="0" y1="0" x2="0" y2="5" class="hatch-line"/>
    </pattern>
    <style>
      .ghost { fill: none; stroke: var(--c-muted); stroke-width: 1; stroke-dasharray: 3 2; }
      .arrow { stroke: var(--c-muted); stroke-width: 1.2; fill: none; }
      .arrow-head { fill: var(--c-muted); }
      .layer { fill: var(--c-card); stroke: var(--c-accent); stroke-width: 1.5; }
      .other { fill: var(--c-divider); }
      .gap { fill: var(--c-line); }
    </style>
  </defs>
