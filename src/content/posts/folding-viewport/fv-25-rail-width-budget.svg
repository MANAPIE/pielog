<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 384" width="500" height="384" role="img" aria-labelledby="t">
  <title id="t">아이폰 듀오 접힘 화면 폭 466의 레일 배치별 배분</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280; --c-card: #FFFFFF;
        --c-line: #C9CDD3; --c-divider: #E5E7EB;
        --c-soft: #FDEEE4; --c-soft-2: #E6ECFB;
        --c-accent: #C2410C; --c-accent-2: #1D4ED8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0; --c-card: #161B22;
          --c-line: #4A525E; --c-divider: #262D36;
          --c-soft: #2B1C12; --c-soft-2: #15213A;
          --c-accent: #E8681A; --c-accent-2: #3B82F6;
        }
      }
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", sans-serif; }
      .bg { fill: var(--c-bg); }
      .content { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 1.5; }
      .rail { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.5; }
      .system { fill: url(#hatch); stroke: var(--c-line); stroke-width: 1.5; }
      .hatch-line { stroke: var(--c-line); stroke-width: 1.5; }
      .backing { fill: var(--c-card); }
      .t-fg { fill: var(--c-fg); }
      .t-muted { fill: var(--c-muted); }
      .h { font-size: 14px; font-weight: 700; }
      .title { font-size: 13px; font-weight: 700; }
      .seg { font-size: 12px; font-weight: 600; }
      .note { font-size: 12px; }
    </style>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" style="fill: var(--c-card)"/>
      <line x1="0" y1="0" x2="0" y2="6" class="hatch-line"/>
    </pattern>
  </defs>

  <rect class="bg" x="0" y="0" width="500" height="384"/>

  <text class="t-fg h" x="24" y="28">듀오 접힘 화면 폭 466의 배분</text>
  <text class="t-muted note" x="24" y="48">단위는 pt이고, 레일 폭은 48로 잡았습니다.</text>

  <!-- 1. 열 안에 넣기: 콘텐츠 382 + 시스템 열 84(상태 표시줄과 레일) -->
  <text class="t-fg title" x="24" y="80">열 안에 넣기 (네이티브 탭바도 같은 배치)</text>
  <rect class="content" x="24" y="90" width="369.5" height="44" rx="6"/>
  <rect class="system" x="395.5" y="90" width="80.5" height="44" rx="6"/>
  <text class="t-fg seg" x="208.8" y="116.5" text-anchor="middle">콘텐츠 382</text>
  <rect class="backing" x="401" y="95" width="69.5" height="34" rx="4"/>
  <text class="t-fg seg" x="435.75" y="109" text-anchor="middle">상태 표시줄</text>
  <text class="t-fg seg" x="435.75" y="125" text-anchor="middle">+ 레일 84</text>
  <text class="t-muted note" x="24" y="155">상태 표시줄 높이를 래퍼가 넘겨줘야 합니다.</text>

  <!-- 2. 열 옆에 두기: 콘텐츠 334 + 레일 48 + 시스템 열 84 -->
  <text class="t-fg title" x="24" y="186">열 옆에 두기</text>
  <rect class="content" x="24" y="196" width="322.9" height="44" rx="6"/>
  <rect class="rail" x="348.9" y="196" width="44.6" height="44" rx="6"/>
  <rect class="system" x="395.5" y="196" width="80.5" height="44" rx="6"/>
  <text class="t-fg seg" x="185.5" y="222.5" text-anchor="middle">콘텐츠 334</text>
  <text class="t-fg seg" x="371.2" y="215" text-anchor="middle">레일</text>
  <text class="t-fg seg" x="371.2" y="231" text-anchor="middle">48</text>
  <rect class="backing" x="401" y="201" width="69.5" height="34" rx="4"/>
  <text class="t-fg seg" x="435.75" y="215" text-anchor="middle">시스템 열</text>
  <text class="t-fg seg" x="435.75" y="231" text-anchor="middle">84</text>
  <text class="t-muted note" x="24" y="261">구현은 가장 단순합니다.</text>

  <!-- 3. 왼쪽 레일: 레일 48 + 콘텐츠 334 + 상태 표시줄만 있는 열 84 -->
  <text class="t-fg title" x="24" y="292">왼쪽 레일 (손잡이 설정)</text>
  <rect class="rail" x="24" y="302" width="45.6" height="44" rx="6"/>
  <rect class="content" x="71.6" y="302" width="321.9" height="44" rx="6"/>
  <rect class="system" x="395.5" y="302" width="80.5" height="44" rx="6"/>
  <text class="t-fg seg" x="46.8" y="321" text-anchor="middle">레일</text>
  <text class="t-fg seg" x="46.8" y="337" text-anchor="middle">48</text>
  <text class="t-fg seg" x="232.5" y="328.5" text-anchor="middle">콘텐츠 334</text>
  <rect class="backing" x="401" y="307" width="69.5" height="34" rx="4"/>
  <text class="t-fg seg" x="435.75" y="321" text-anchor="middle">상태 표시줄</text>
  <text class="t-fg seg" x="435.75" y="337" text-anchor="middle">84</text>
  <text class="t-muted note" x="24" y="367">레일이 64면 콘텐츠가 318로 320보다 좁아집니다.</text>
</svg>
