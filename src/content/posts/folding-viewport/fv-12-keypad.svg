  <text class="t-accent note" x="200" y="397">아래 172가 잘림</text>
  <text class="t-fg title" x="24" y="424">높이를 45dvh로 묶으면</text>
  <rect class="screen" x="24" y="438" width="101.4" height="219.44" rx="4"/>
