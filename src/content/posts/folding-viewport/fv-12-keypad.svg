  <rect class="over-fill" x="200" y="280.16" width="212.16" height="44.72"/>
  <rect class="over" x="200" y="280.16" width="212.16" height="44.72"/>
  <text class="t-fg seg" x="200" y="361">폴드 8 메인 816 × 616</text>
