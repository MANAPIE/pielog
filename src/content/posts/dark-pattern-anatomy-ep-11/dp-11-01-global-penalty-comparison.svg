<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>다크패턴 역대 주요 제재 금액 비교</title>
<desc>Amazon Prime 25억달러, Google 3.9억달러, Epic Games 2.45억달러, CNIL Google 1.5억유로 등 주요 제재 사례의 금액을 수평 막대 차트로 비교</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .c-red rect { fill: #FCEBEB; stroke: #F09595; }
  .c-coral rect { fill: #FAECE7; stroke: #F0997B; }
  .c-amber rect { fill: #FAEEDA; stroke: #FAC775; }
  .c-purple rect { fill: #EEEDFE; stroke: #AFA9EC; }
  .c-gray rect { fill: #F1EFE8; stroke: #D3D1C7; }
  .t-red { fill: #791F1F; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #D3D1C7; }
    .ts { fill: #B4B2A9; }
    .c-red rect { fill: #501313; stroke: #A32D2D; }
    .c-coral rect { fill: #3A1A0E; stroke: #A03A1F; }
    .c-amber rect { fill: #412402; stroke: #854F0B; }
    .c-purple rect { fill: #26215C; stroke: #534AB7; }
    .c-gray rect { fill: #2C2C2A; stroke: #444441; }
    .t-red { fill: #F7C1C1; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Y axis labels -->
<text class="ts" x="170" y="68" text-anchor="end" dominant-baseline="central">Amazon Prime (FTC, 2025)</text>
<text class="ts" x="170" y="118" text-anchor="end" dominant-baseline="central">Google Location (US, 2022)</text>
<text class="ts" x="170" y="168" text-anchor="end" dominant-baseline="central">Epic Games (FTC, 2022)</text>
<text class="ts" x="170" y="218" text-anchor="end" dominant-baseline="central">Google Cookies (CNIL, 2022)</text>
<text class="ts" x="170" y="268" text-anchor="end" dominant-baseline="central">LinkedIn (US, 2015)</text>

<!-- Bars -->
<g class="c-red"><rect x="180" y="52" width="440" height="30" rx="4" stroke-width="0.5"/></g>
<text class="ts t-red" x="612" y="68" text-anchor="end" dominant-baseline="central">$2.5B</text>

<g class="c-coral"><rect x="180" y="102" width="69" height="30" rx="4" stroke-width="0.5"/></g>
<text class="ts" x="258" y="118" dominant-baseline="central">$391.5M</text>

<g class="c-amber"><rect x="180" y="152" width="43" height="30" rx="4" stroke-width="0.5"/></g>
<text class="ts" x="232" y="168" dominant-baseline="central">$245M</text>

<g class="c-purple"><rect x="180" y="202" width="26" height="30" rx="4" stroke-width="0.5"/></g>
<text class="ts" x="216" y="218" dominant-baseline="central">€150M</text>

<g class="c-gray"><rect x="180" y="252" width="4" height="30" rx="2" stroke-width="0.5"/></g>
<text class="ts" x="194" y="268" dominant-baseline="central">$13M</text>

<!-- Note -->
<text class="ts" x="340" y="320" text-anchor="middle" dominant-baseline="central">Amazon Prime 합의금은 나머지 4건의 합산보다 크다</text>
<text class="ts" x="340" y="340" text-anchor="middle" dominant-baseline="central">다크패턴 제재의 규모는 매년 기하급수적으로 증가 중</text>
</svg>
