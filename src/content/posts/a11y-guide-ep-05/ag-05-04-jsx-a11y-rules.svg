<svg width="100%" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>eslint-plugin-jsx-a11y 주요 린트 규칙</title>
  <desc>jsx-a11y 플러그인의 자주 사용되는 6개 린트 규칙을 위반 코드와 수정 코드로 비교한 카드</desc>
  <style>
    .title { font: 600 16px/1.4 'Pretendard Variable', system-ui, sans-serif; fill: #2C2C2A; }
    .rule-h { font: 600 11px/1 'JetBrains Mono', monospace; fill: #FFFFFF; }
    .rule-d { font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif; fill: #2C2C2A; }
    .mono { font: 400 11px/1.4 'JetBrains Mono', monospace; }
    .caption { font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif; fill: #6F6E66; }

    .rust-card { fill: #FAECE7; stroke: #993C1D; }
    .rust-head { fill: #993C1D; }
    .bad { fill: #712B13; }
    .good { fill: #085041; }

    @media (prefers-color-scheme: dark) {
      .title { fill: #E8E6DE; }
      .rule-d { fill: #E8E6DE; }
      .caption { fill: #B4B2A9; }

      .rust-card { fill: #3F1A0C; stroke: #993C1D; }
      .rust-head { fill: #993C1D; }
      .bad { fill: #F5BFB1; }
      .good { fill: #9FE1CB; }
    }
  </style>

  <text class="title" x="40" y="32">eslint-plugin-jsx-a11y: 주요 린트 규칙</text>
  <text class="caption" x="40" y="50">CI에서 가장 먼저 접근성 이슈를 잡는 1차 방어선</text>

  <!-- Rule 1 -->
  <g transform="translate(40, 76)">
    <rect class="rust-card" x="0" y="0" width="350" height="86" rx="10" stroke-width="0.5"/>
    <rect class="rust-head" x="0" y="0" width="350" height="22" rx="10"/>
    <rect class="rust-head" x="0" y="12" width="350" height="10"/>
    <text class="rule-h" x="14" y="16">anchor-is-valid</text>

    <text class="rule-d" x="14" y="40">&lt;a&gt;에는 유효한 href가 있어야 함</text>
    <text class="mono bad" x="14" y="60">✗ &lt;a onClick={fn}&gt;</text>
    <text class="mono good" x="14" y="76">✓ &lt;button onClick={fn}&gt;</text>
  </g>

  <g transform="translate(410, 76)">
    <rect class="rust-card" x="0" y="0" width="350" height="86" rx="10" stroke-width="0.5"/>
    <rect class="rust-head" x="0" y="0" width="350" height="22" rx="10"/>
    <rect class="rust-head" x="0" y="12" width="350" height="10"/>
    <text class="rule-h" x="14" y="16">click-events-have-key-events</text>

    <text class="rule-d" x="14" y="40">onClick엔 키 이벤트 핸들러도 필요</text>
    <text class="mono bad" x="14" y="60">✗ &lt;div onClick={fn}&gt;</text>
    <text class="mono good" x="14" y="76">✓ &lt;button onClick={fn}&gt; (자동 처리)</text>
  </g>

  <!-- Rule 3 -->
  <g transform="translate(40, 176)">
    <rect class="rust-card" x="0" y="0" width="350" height="86" rx="10" stroke-width="0.5"/>
    <rect class="rust-head" x="0" y="0" width="350" height="22" rx="10"/>
    <rect class="rust-head" x="0" y="12" width="350" height="10"/>
    <text class="rule-h" x="14" y="16">no-static-element-interactions</text>

    <text class="rule-d" x="14" y="40">비인터랙티브 요소에 핸들러 금지</text>
    <text class="mono bad" x="14" y="60">✗ &lt;p onClick={fn}&gt;</text>
    <text class="mono good" x="14" y="76">✓ &lt;button onClick={fn}&gt;</text>
  </g>

  <g transform="translate(410, 176)">
    <rect class="rust-card" x="0" y="0" width="350" height="86" rx="10" stroke-width="0.5"/>
    <rect class="rust-head" x="0" y="0" width="350" height="22" rx="10"/>
    <rect class="rust-head" x="0" y="12" width="350" height="10"/>
    <text class="rule-h" x="14" y="16">img-redundant-alt</text>

    <text class="rule-d" x="14" y="40">alt에 "이미지"·"사진" 같은 단어 불필요</text>
    <text class="mono bad" x="14" y="60">✗ alt="팀 단체 사진 이미지"</text>
    <text class="mono good" x="14" y="76">✓ alt="팀 단체 사진"</text>
  </g>

  <!-- Rule 5 -->
  <g transform="translate(40, 276)">
    <rect class="rust-card" x="0" y="0" width="350" height="86" rx="10" stroke-width="0.5"/>
    <rect class="rust-head" x="0" y="0" width="350" height="22" rx="10"/>
    <rect class="rust-head" x="0" y="12" width="350" height="10"/>
    <text class="rule-h" x="14" y="16">label-has-associated-control</text>

    <text class="rule-d" x="14" y="40">label은 input과 명시적으로 연결되어야</text>
    <text class="mono bad" x="14" y="60">✗ &lt;label&gt;이메일&lt;/label&gt;</text>
    <text class="mono good" x="14" y="76">✓ &lt;label htmlFor="email"&gt;</text>
  </g>

  <g transform="translate(410, 276)">
    <rect class="rust-card" x="0" y="0" width="350" height="86" rx="10" stroke-width="0.5"/>
    <rect class="rust-head" x="0" y="0" width="350" height="22" rx="10"/>
    <rect class="rust-head" x="0" y="12" width="350" height="10"/>
    <text class="rule-h" x="14" y="16">no-noninteractive-tabindex</text>

    <text class="rule-d" x="14" y="40">비인터랙티브 요소에 tabindex 금지</text>
    <text class="mono bad" x="14" y="60">✗ &lt;div tabIndex="0"&gt; (이유 없이)</text>
    <text class="mono good" x="14" y="76">✓ role 함께 부여 또는 제거</text>
  </g>
</svg>
