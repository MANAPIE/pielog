<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tr">
  <title id="t-tr">같은 요구사항, 세 가지 읽기</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-tr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-tr-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="500" />
  <text x="24" y="36" class="ttl">같은 요구사항, 세 가지 읽기</text>
  <rect x="24" y="52" width="452" height="36" rx="8" fill="var(--c-card)" stroke="var(--c-fg)" stroke-width="1.6" />
  <text x="250" y="75" class="nm" text-anchor="middle">“검색 기능을 개선해 주세요”</text>
  <line x1="250" y1="88" x2="250" y2="101" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-tr)" />
  <rect x="24" y="104" width="452" height="104" rx="8" class="card" stroke="var(--c-accent)" />
  <text x="38" y="128" class="lbl" style="fill:var(--c-accent)">기획자</text>
  <text x="82.5" y="128" class="nm">범위와 우선순위</text>
  <text x="38" y="150" class="cap">키워드·필터·자동완성 중 어디까지인가?</text>
  <text x="38" y="168" class="cap">성과를 검색 성공률로 잴지, 클릭률로 잴지?</text>
  <text x="38" y="192" class="mid"><tspan class="th">산출물</tspan>  요구사항 정의서, 유저 스토리, 수용 기준</text>
  <rect x="24" y="224" width="452" height="104" rx="8" class="card" stroke="var(--c-accent-3)" />
  <text x="38" y="248" class="lbl" style="fill:var(--c-accent-3)">디자이너</text>
  <text x="94.0" y="248" class="nm">상호작용과 경험</text>
  <text x="38" y="270" class="cap">검색창을 상시 노출할지, 아이콘 뒤에 둘지?</text>
  <text x="38" y="288" class="cap">결과가 없을 때 무엇을 보여줄지?</text>
  <text x="38" y="312" class="mid"><tspan class="th">산출물</tspan>  와이어프레임, 인터랙션 명세, 프로토타입</text>
  <rect x="24" y="344" width="452" height="104" rx="8" class="card" stroke="var(--c-accent-2)" />
  <text x="38" y="368" class="lbl" style="fill:var(--c-accent-2)">개발자</text>
  <text x="82.5" y="368" class="nm">시스템과 제약</text>
  <text x="38" y="390" class="cap">LIKE 쿼리로 충분한지, 검색 엔진이 필요한지?</text>
  <text x="38" y="408" class="cap">디바운스·색인 범위·형태소 분석을 어디까지?</text>
  <text x="38" y="432" class="mid"><tspan class="th">산출물</tspan>  기술 설계, API 명세, 성능 기준</text>
  <text x="24" y="476" class="cap">셋 다 같은 요구사항을 읽었지만, 다른 것으로 해석하고 있습니다.</text>
</svg>
