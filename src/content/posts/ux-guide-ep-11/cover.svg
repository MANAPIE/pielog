<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="IT UX 가이드 ep.11 cover">
  <style>
  :root { --c-bg: #F8F3EE; --c-fg: #1A1F2E; --c-muted: #6B7280; --c-accent: #B4502A; --c-accent-2: #C9A227; --c-accent-3: #6E3A78; --c-num: rgba(180,80,42, 0.14); --c-dot: rgba(180,80,42, 0.12); --c-line: rgba(26, 31, 46, 0.14); }
  @media (prefers-color-scheme: dark) { :root { --c-bg: #17120F; --c-fg: #E8E6E1; --c-muted: #8B92A0; --c-accent: #F0956E; --c-accent-2: #E8C45A; --c-accent-3: #C08FE0; --c-num: rgba(240,149,110, 0.16); --c-dot: rgba(240,149,110, 0.12); --c-line: rgba(232, 230, 225, 0.16); } }
  .cover-bg { fill: var(--c-bg); }
  .ep-number { font: 900 240px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-num); letter-spacing: -0.04em; }
  </style>
  <defs>
    <pattern id="dots-ux11" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.4" fill="var(--c-dot)"/></pattern>
    <radialGradient id="halo-ux11a" cx="0.25" cy="0.25" r="0.6"><stop offset="0" stop-color="var(--c-accent-2)" stop-opacity="0.24"/><stop offset="1" stop-color="var(--c-accent-2)" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-ux11b" cx="0.85" cy="0.75" r="0.55"><stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.26"/><stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-ux11)"/>
  <rect width="1200" height="630" fill="url(#halo-ux11a)"/>
  <rect width="1200" height="630" fill="url(#halo-ux11b)"/>
  <circle cx="1120" cy="100" r="320" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <rect x="-160" y="320" width="520" height="520" rx="48" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(12 100 580)"/>

  <!-- 메타포: 문서의 한 줄이 세 갈래로 갈라져 세 가지 다른 도형이 된다 -->
