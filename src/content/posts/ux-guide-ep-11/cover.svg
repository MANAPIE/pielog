    <g stroke="var(--c-fg)" stroke-width="2.5" stroke-linecap="round" opacity="0.3">
      <line x1="40" y1="50" x2="220" y2="50"/><line x1="40" y1="150" x2="180" y2="150"/><line x1="40" y1="190" x2="240" y2="190"/>
    </g>
    <line x1="40" y1="100" x2="260" y2="100" stroke="var(--c-fg)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M 520 300 C 620 300, 640 150, 760 150" stroke="var(--c-accent)"/>
    <path d="M 520 300 C 640 300, 660 300, 760 300" stroke="var(--c-accent-3)"/>
    <path d="M 520 300 C 620 300, 640 450, 760 450" stroke="var(--c-accent-2)"/>
  </g>
  <rect x="790" y="110" width="80" height="80" rx="12" fill="var(--c-accent)" fill-opacity="0.85" transform="rotate(10 830 150)"/>
  <circle cx="830" cy="300" r="42" fill="var(--c-accent-3)" fill-opacity="0.85"/>
  <polygon points="830,405 878,490 782,490" fill="var(--c-accent-2)" fill-opacity="0.85"/>
  <circle cx="830" cy="300" r="62" fill="none" stroke="var(--c-accent-3)" stroke-width="3" stroke-dasharray="5 8"/>

  <g transform="translate(120 110) rotate(8)"><rect width="150" height="12" rx="6" fill="var(--c-accent-3)" fill-opacity="0.7"/><rect y="24" width="96" height="12" rx="6" fill="var(--c-accent)" fill-opacity="0.7"/><rect y="48" width="120" height="12" rx="6" fill="var(--c-accent-2)" fill-opacity="0.7"/></g>
  <g fill="var(--c-accent)"><circle cx="1010" cy="110" r="9"/><circle cx="1040" cy="126" r="6" opacity="0.7"/><circle cx="998" cy="142" r="5" opacity="0.5"/><circle cx="1030" cy="154" r="4" opacity="0.4"/></g>
  <rect x="130" y="470" width="90" height="90" rx="14" fill="none" stroke="var(--c-accent-2)" stroke-width="3" transform="rotate(-10 175 515)"/>
  <path d="M 1010 230 l 14 14 l 30 -32" fill="none" stroke="var(--c-accent-3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ep-number" x="1164" y="594" text-anchor="end">11</text>
</svg>
