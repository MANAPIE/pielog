<svg viewBox="0 0 500 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-em">
  <title id="t-em">관련도순 정렬 스토리의 예시 매핑</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-em" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-em-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="404" />
  <text x="24" y="36" class="ttl">예시 매핑: 관련도순 정렬</text>
  <text x="451.0" y="36" class="cap">질문</text>
  <rect x="435.0" y="27" width="10" height="10" rx="2" fill="var(--c-accent-2)" />
  <text x="398.0" y="36" class="cap">예시</text>
  <rect x="382.0" y="27" width="10" height="10" rx="2" fill="var(--c-accent)" />
  <text x="345.0" y="36" class="cap">규칙</text>
  <rect x="329.0" y="27" width="10" height="10" rx="2" fill="var(--c-accent-3)" />
  <rect x="24" y="52" width="452" height="32" rx="6" fill="var(--c-card)" stroke="var(--c-fg)" stroke-width="1.6" />
  <text x="36" y="73" class="nm">스토리: 검색 결과를 관련도순으로 정렬한다</text>
  <rect x="24" y="100" width="452" height="28" rx="6" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.2" />
  <text x="36" y="118.0" class="mid">규칙 1: 관련도는 키워드 일치 60% + 인기도 30% + 최신순 10%의 가중합이다</text>
  <rect x="48" y="136" width="428" height="26" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.2" />
  <text x="60" y="153.0" class="cap">“떡볶이” 검색 시 이름이 일치하는 상품이 리뷰가 많은 상품보다 앞에 온다</text>
  <rect x="48" y="170" width="428" height="26" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.2" />
  <text x="60" y="187.0" class="cap">점수가 같으면 최근에 등록된 상품이 앞에 온다</text>
  <rect x="24" y="210" width="452" height="28" rx="6" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.2" />
  <text x="36" y="228.0" class="mid">규칙 2: 결과가 없으면 유사 검색어를 제안한다</text>
  <rect x="48" y="246" width="428" height="26" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.2" />
  <text x="60" y="263.0" class="cap">“떡 볶이”로 검색하면 “떡볶이” 결과를 보여준다</text>
  <rect x="24" y="286" width="452" height="28" rx="6" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.2" />
  <text x="36" y="304.0" class="mid">별점이 없는 상품(40%)의 인기도는 어떻게 계산하는가?</text>
  <rect x="24" y="322" width="452" height="28" rx="6" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.2" />
  <text x="36" y="340.0" class="mid">형태소 분석기를 붙이면 2주가 더 드는데 이번 범위인가?</text>
  <text x="24" y="380" class="cap">질문 카드가 많이 남은 스토리는 아직 개발을 시작할 준비가 안 된 것입니다.</text>
</svg>
