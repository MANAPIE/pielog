<svg viewBox="0 0 500 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tl">
  <title id="t-tl">사용자가 느끼는 시간과 측정 기준</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-tl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-tl-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="328" />
  <text x="24" y="36" class="ttl">사용자가 느끼는 시간과 측정 기준</text>
  <text x="24" y="70" class="th">사용자가 느끼는 한계 (Nielsen 1993)</text>
  <line x1="24" y1="150" x2="476" y2="150" stroke="var(--c-fg)" stroke-width="1.4" />
  <line x1="24.0" y1="118" x2="24.0" y2="150" stroke="var(--c-fg)" stroke-width="1.4" />
  <text x="24" y="110" class="mid" text-anchor="start">0.1초 직접 조작의 느낌</text>
  <circle cx="24.0" cy="150" r="4" fill="var(--c-fg)" />
  <line x1="250.0" y1="118" x2="250.0" y2="150" stroke="var(--c-fg)" stroke-width="1.4" />
  <text x="250.0" y="110" class="mid" text-anchor="middle">1초 사고의 흐름</text>
  <circle cx="250.0" cy="150" r="4" fill="var(--c-fg)" />
  <line x1="476.0" y1="118" x2="476.0" y2="150" stroke="var(--c-fg)" stroke-width="1.4" />
  <text x="476.0" y="110" class="mid" text-anchor="end">10초 주의의 한계</text>
  <circle cx="476.0" cy="150" r="4" fill="var(--c-fg)" />
  <line x1="92.03277902005976" y1="150" x2="92.03277902005976" y2="166" stroke="var(--c-accent-3)" stroke-width="1.4" />
  <circle cx="92.03277902005976" cy="150" r="4" fill="var(--c-accent-3)" />
  <text x="92.03277902005976" y="182" class="mid" text-anchor="start" style="fill:var(--c-accent-3)">INP 좋음 0.2초</text>
  <line x1="339.9344419598805" y1="150" x2="339.9344419598805" y2="166" stroke="var(--c-accent-3)" stroke-width="1.4" />
  <circle cx="339.9344419598805" cy="150" r="4" fill="var(--c-accent-3)" />
  <text x="339.9344419598805" y="182" class="mid" text-anchor="middle" style="fill:var(--c-accent-3)">LCP 좋음 2.5초</text>
  <line x1="357.8294035666437" y1="150" x2="357.8294035666437" y2="198" stroke="var(--c-accent-2)" stroke-width="1.4" />
  <circle cx="357.8294035666437" cy="150" r="4" fill="var(--c-accent-2)" />
  <text x="357.8294035666437" y="214" class="mid" text-anchor="middle" style="fill:var(--c-accent-2)">이탈 확률 +32% (3초)</text>
  <line x1="476.0" y1="150" x2="476.0" y2="230" stroke="var(--c-accent-2)" stroke-width="1.4" />
  <circle cx="476.0" cy="150" r="4" fill="var(--c-accent-2)" />
  <text x="476.0" y="246" class="mid" text-anchor="end" style="fill:var(--c-accent-2)">이탈 확률 +123% (10초)</text>
  <text x="24" y="278" class="th">측정 기준 (Core Web Vitals, Google 2017 이탈 모델) · 가로축은 로그 눈금</text>
  <text x="24" y="304" class="cap">사용자의 기준과 측정 기준은 같은 축 위에 있어서, 어느 쪽을 넘겨도 이탈로 이어집니다.</text>
</svg>
