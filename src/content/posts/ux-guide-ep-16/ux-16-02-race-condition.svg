<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-rc">
  <title id="t-rc">경쟁 조건: 마지막 요청의 응답만 반영하기</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-rc" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-rc-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="420" />
  <text x="24" y="36" class="ttl">경쟁 조건: 마지막 요청의 응답만 반영하기</text>
  <rect x="24" y="52" width="218" height="322" rx="8" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.6" />
  <text x="38" y="76" class="nm">취소하지 않을 때</text>
  <rect x="38" y="96" width="190" height="34" rx="6" fill="var(--c-muted-soft)" stroke="none" stroke-width="0" />
  <text x="133" y="118" class="mid" text-anchor="middle">“ap” 입력 → 요청 1</text>
  <line x1="133" y1="130" x2="133" y2="141" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-rc)" />
  <rect x="38" y="142" width="190" height="34" rx="6" fill="var(--c-muted-soft)" stroke="none" stroke-width="0" />
  <text x="133" y="164" class="mid" text-anchor="middle">“app” 입력 → 요청 2</text>
  <line x1="133" y1="176" x2="133" y2="187" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-rc)" />
  <rect x="38" y="188" width="190" height="34" rx="6" fill="var(--c-muted-soft)" stroke="none" stroke-width="0" />
  <text x="133" y="210" class="mid" text-anchor="middle">응답 2 도착: app 결과</text>
  <line x1="133" y1="222" x2="133" y2="233" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-rc)" />
  <rect x="38" y="234" width="190" height="34" rx="6" fill="var(--c-muted-soft)" stroke="none" stroke-width="0" />
  <text x="133" y="256" class="mid" text-anchor="middle">응답 1 도착: ap로 덮임</text>
  <line x1="133" y1="268" x2="133" y2="279" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-rc)" />
  <rect x="38" y="280" width="190" height="34" rx="6" fill="var(--c-soft-2)" stroke="none" stroke-width="0" />
  <text x="133" y="302" class="mid" text-anchor="middle">입력은 app, 화면은 ap</text>
  <text x="38" y="332" class="cap" style="fill:var(--c-accent-2)">마지막 입력과 화면이</text>
  <text x="38" y="348" class="cap" style="fill:var(--c-accent-2)">어긋납니다.</text>
  <rect x="258" y="52" width="218" height="322" rx="8" fill="var(--c-card)" stroke="var(--c-accent)" stroke-width="1.6" />
  <text x="272" y="76" class="nm">이전 요청을 취소할 때</text>
  <rect x="272" y="96" width="190" height="34" rx="6" fill="var(--c-muted-soft)" stroke="none" stroke-width="0" />
  <text x="367" y="118" class="mid" text-anchor="middle">“ap” 입력 → 요청 1</text>
  <line x1="367" y1="130" x2="367" y2="141" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-rc)" />
  <rect x="272" y="142" width="190" height="34" rx="6" fill="var(--c-muted-soft)" stroke="none" stroke-width="0" />
  <text x="367" y="164" class="mid" text-anchor="middle">“app” 입력 → 요청 1 취소</text>
  <line x1="367" y1="176" x2="367" y2="187" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-rc)" />
  <rect x="272" y="188" width="190" height="34" rx="6" fill="var(--c-muted-soft)" stroke="none" stroke-width="0" />
  <text x="367" y="210" class="mid" text-anchor="middle">요청 2 → 응답 2 도착</text>
  <line x1="367" y1="222" x2="367" y2="233" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-rc)" />
  <rect x="272" y="234" width="190" height="34" rx="6" fill="var(--c-soft)" stroke="none" stroke-width="0" />
  <text x="367" y="256" class="mid" text-anchor="middle">입력도 화면도 app</text>
  <text x="272" y="332" class="cap" style="fill:var(--c-accent)">마지막 요청의 응답만</text>
  <text x="272" y="348" class="cap" style="fill:var(--c-accent)">화면에 반영됩니다.</text>
  <text x="24" y="396" class="cap">새 요청을 보낼 때 이전 요청을 취소하거나, 마지막 요청 번호의 응답만 반영합니다.</text>
</svg>
