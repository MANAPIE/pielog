<svg viewBox="0 0 500 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cm">
  <title id="t-cm">세 채널의 제약, 강점, 맞는 과업</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-cm" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-cm-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="472" />
  <text x="24" y="36" class="ttl">세 채널의 제약, 강점, 맞는 과업</text>
  <text x="104" y="64" class="th">제약</text>
  <text x="230" y="64" class="th">강점</text>
  <text x="356" y="64" class="th">맞는 과업</text>
  <text x="24" y="120" class="nm" style="fill:var(--c-accent-3)">모바일</text>
  <rect x="104" y="76" width="120" height="108" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="114" y="100" class="cap" style="fill:var(--c-fg)">작은 화면</text>
  <text x="114" y="118" class="cap" style="fill:var(--c-fg)">손가락의 부정확성</text>
  <text x="114" y="136" class="cap" style="fill:var(--c-fg)">이동 중, 한 손</text>
  <text x="114" y="154" class="cap" style="fill:var(--c-fg)">불안정한 연결</text>
  <rect x="230" y="76" width="120" height="108" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="240" y="100" class="cap" style="fill:var(--c-fg)">항상 손에 있음</text>
  <text x="240" y="118" class="cap" style="fill:var(--c-fg)">카메라·위치·알림</text>
  <rect x="356" y="76" width="120" height="108" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.4" />
  <text x="366" y="100" class="cap" style="fill:var(--c-fg)">확인, 짧은 입력</text>
  <text x="366" y="118" class="cap" style="fill:var(--c-fg)">알림 대응</text>
  <text x="24" y="240" class="nm" style="fill:var(--c-accent)">음성</text>
  <rect x="104" y="196" width="120" height="108" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="114" y="220" class="cap" style="fill:var(--c-fg)">발견성 없음</text>
  <text x="114" y="238" class="cap" style="fill:var(--c-fg)">순차적</text>
  <text x="114" y="256" class="cap" style="fill:var(--c-fg)">공공장소에서 어색</text>
  <text x="114" y="274" class="cap" style="fill:var(--c-fg)">오류 복구 어려움</text>
  <rect x="230" y="196" width="120" height="108" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="240" y="220" class="cap" style="fill:var(--c-fg)">손이 자유로움</text>
  <text x="240" y="238" class="cap" style="fill:var(--c-fg)">자연어로 복잡한</text>
  <text x="240" y="256" class="cap" style="fill:var(--c-fg)">의도 전달</text>
  <rect x="356" y="196" width="120" height="108" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="366" y="220" class="cap" style="fill:var(--c-fg)">타이머, 재생,</text>
  <text x="366" y="238" class="cap" style="fill:var(--c-fg)">간단한 질문처럼</text>
  <text x="366" y="256" class="cap" style="fill:var(--c-fg)">답이 짧은 일</text>
  <text x="24" y="352" class="nm" style="fill:var(--c-accent-2)">공간</text>
  <text x="24" y="370" class="nm" style="fill:var(--c-accent-2)">컴퓨팅</text>
  <rect x="104" y="316" width="120" height="108" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="114" y="340" class="cap" style="fill:var(--c-fg)">깊이 축</text>
  <text x="114" y="358" class="cap" style="fill:var(--c-fg)">시선·손 입력의</text>
  <text x="114" y="376" class="cap" style="fill:var(--c-fg)">정확도와 피로</text>
  <text x="114" y="394" class="cap" style="fill:var(--c-fg)">안전</text>
  <rect x="230" y="316" width="120" height="108" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="240" y="340" class="cap" style="fill:var(--c-fg)">실제 공간과 결합</text>
  <text x="240" y="358" class="cap" style="fill:var(--c-fg)">몰입</text>
  <rect x="356" y="316" width="120" height="108" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.4" />
  <text x="366" y="340" class="cap" style="fill:var(--c-fg)">공간이 뜻을</text>
  <text x="366" y="358" class="cap" style="fill:var(--c-fg)">가지는 일</text>
  <text x="366" y="376" class="cap" style="fill:var(--c-fg)">(설계 검토, 훈련)</text>
  <text x="24" y="448" class="cap">채널마다 맞는 과업이 다르므로, 같은 경험이 아니라 맞는 경험과 자연스러운 이동을 설계합니다.</text>
</svg>
