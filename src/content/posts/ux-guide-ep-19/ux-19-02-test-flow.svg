<svg viewBox="0 0 500 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tf">
  <title id="t-tf">사용성 테스트의 다섯 단계</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-tf" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-tf-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="404" />
  <text x="24" y="36" class="ttl">사용성 테스트의 다섯 단계</text>
  <rect x="24" y="56" width="120" height="52" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="84" y="87" class="nm" text-anchor="middle">목표 정의</text>
  <text x="160" y="87" class="mid">어떤 과업에서 어떤 문제를 예상하고, 결과로 무엇을 결정할지</text>
  <line x1="84" y1="108" x2="84" y2="117" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-tf)" />
  <rect x="24" y="118" width="120" height="52" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="84" y="149" class="nm" text-anchor="middle">모집</text>
  <text x="160" y="149" class="mid">실제 사용자, 내부 직원 제외, 소정의 사례비</text>
  <line x1="84" y1="170" x2="84" y2="179" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-tf)" />
  <rect x="24" y="180" width="120" height="52" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="84" y="211" class="nm" text-anchor="middle">과업 시나리오</text>
  <text x="160" y="211" class="mid">목표만 주고 경로는 주지 않기, 화면의 단어 쓰지 않기</text>
  <line x1="84" y1="232" x2="84" y2="241" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-tf)" />
  <rect x="24" y="242" width="120" height="52" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="84" y="273" class="nm" text-anchor="middle">진행</text>
  <text x="160" y="273" class="mid">돕지 않기, 유도하지 않기, 판단하지 않기</text>
  <line x1="84" y1="294" x2="84" y2="303" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-tf)" />
  <rect x="24" y="304" width="120" height="52" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="84" y="335" class="nm" text-anchor="middle">분석</text>
  <text x="160" y="335" class="mid">패턴 찾기, 심각도 0에서 4로 분류</text>
  <text x="24" y="380" class="cap">5명씩 고치고 다시 테스트하는 반복이 15명 한 번보다 많은 문제를 잡습니다.</text>
</svg>
