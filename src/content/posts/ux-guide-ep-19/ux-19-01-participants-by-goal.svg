<svg viewBox="0 0 500 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-pg">
  <title id="t-pg">테스트 목적에 따른 참가자 수</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-pg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-pg-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="404" />
  <text x="24" y="36" class="ttl">테스트 목적에 따른 참가자 수</text>
  <rect x="24" y="56" width="452" height="92" rx="8" fill="var(--c-card)" stroke="var(--c-accent)" stroke-width="1.6" />
  <rect x="36" y="72" width="108" height="60" rx="6" fill="var(--c-soft)" stroke="none" stroke-width="0" />
  <text x="90" y="111" class="met" text-anchor="middle" style="fill:var(--c-accent)">5명</text>
  <text x="160" y="86" class="nm">문제 찾기 (정성)</text>
  <text x="160" y="106" class="cap" style="fill:var(--c-fg)">발견율 약 85%</text>
  <text x="160" y="122" class="cap" style="fill:var(--c-fg)">고친 뒤 5명씩 반복</text>
  <text x="464" y="138" class="cap" text-anchor="end">Nielsen 2000</text>
  <rect x="24" y="160" width="452" height="92" rx="8" fill="var(--c-card)" stroke="var(--c-accent-3)" stroke-width="1.6" />
  <rect x="36" y="176" width="108" height="60" rx="6" fill="var(--c-soft-3)" stroke="none" stroke-width="0" />
  <text x="90" y="215" class="met" text-anchor="middle" style="fill:var(--c-accent-3)">3~4명</text>
  <text x="160" y="190" class="nm">사용자 집단이 여럿</text>
  <text x="160" y="210" class="cap" style="fill:var(--c-fg)">집단마다 3명에서 4명</text>
  <text x="160" y="226" class="cap" style="fill:var(--c-fg)">둘이면 6명에서 8명, 셋이면 9명</text>
  <text x="464" y="242" class="cap" text-anchor="end">Nielsen 2000</text>
  <rect x="24" y="264" width="452" height="92" rx="8" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.6" />
  <rect x="36" y="280" width="108" height="60" rx="6" fill="var(--c-soft-2)" stroke="none" stroke-width="0" />
  <text x="90" y="319" class="met" text-anchor="middle" style="fill:var(--c-accent-2)">20명</text>
  <text x="160" y="294" class="nm">수치 비교 (정량)</text>
  <text x="160" y="314" class="cap" style="fill:var(--c-fg)">오차 범위 약 ±19% (90% 신뢰 수준)</text>
  <text x="160" y="330" class="cap" style="fill:var(--c-fg)">더 작은 차이는 A/B 테스트로</text>
  <text x="464" y="346" class="cap" text-anchor="end">Nielsen 2006</text>
  <text x="24" y="380" class="cap">인원수보다 먼저 테스트로 무엇을 알아내려 하는지를 정해야 합니다.</text>
</svg>
