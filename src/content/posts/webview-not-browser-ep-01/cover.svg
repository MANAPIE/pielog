<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="웹뷰는 브라우저가 아니다 ep.01 cover">
  <style>
  :root {
    --c-bg: #EEF5F6;
    --c-fg: #10202A;
    --c-muted: #5E7480;
    --c-accent: #0E7490; --c-accent-2: #22B8CF; --c-accent-3: #C98A3B;
    --c-num: rgba(14, 116, 144, 0.14);
    --c-dot: rgba(14, 116, 144, 0.10);
    --c-line: rgba(14, 116, 144, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-bg: #0A161A;
      --c-fg: #DCE8EA;
      --c-muted: #8AA0A8;
      --c-accent: #4DD4EC; --c-accent-2: #0E7490; --c-accent-3: #E0A860;
      --c-num: rgba(77, 212, 236, 0.15);
      --c-dot: rgba(77, 212, 236, 0.10);
      --c-line: rgba(77, 212, 236, 0.20);
    }
  }
  .cover-bg { fill: var(--c-bg); }
  .ep-number {
    font: 900 240px ui-monospace, "SF Mono", Menlo, monospace;
    fill: var(--c-num); letter-spacing: -0.04em;
  }
</style>
  <defs>
    <pattern id="dots-wnb01" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="var(--c-dot)"/>
    </pattern>
    <radialGradient id="halo-wnb01a" cx="0.18" cy="0.82" r="0.58">
      <stop offset="0" stop-color="var(--c-accent)" stop-opacity="0.26"/>
      <stop offset="1" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-wnb01b" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.30"/>
      <stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-wnb01)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb01a)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb01b)"/>

  <!-- 배경 무채 stroke 도형 (오프캔버스) -->
  <rect x="820" y="330" width="560" height="560" rx="50" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(9 1100 610)"/>
  <circle cx="80" cy="20" r="300" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <circle cx="80" cy="20" r="212" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>

  <!-- 한 줄로 용접된 기둥: OS와 엔진이 한 몸으로 올라간다 -->
  <g transform="translate(255 318) rotate(-7)">
    <line x1="-79" y1="-206" x2="-79" y2="174" stroke="var(--c-accent-2)" stroke-width="4" stroke-linecap="round"/>

    <g stroke="var(--c-accent-2)" stroke-width="3" stroke-linecap="round">
      <line x1="-79" y1="-156" x2="-62" y2="-156"/>
      <line x1="-79" y1="-66" x2="-62" y2="-66"/>
      <line x1="-79" y1="24" x2="-62" y2="24"/>
      <line x1="-79" y1="114" x2="-62" y2="114"/>
    </g>

    <rect x="-62" y="-196" width="124" height="80" rx="12" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
    <rect x="-42" y="-174" width="44" height="20" rx="3" fill="var(--c-accent)" opacity="0.55"/>
    <rect x="-42" y="-146" width="66" height="8" rx="4" fill="var(--c-muted)" opacity="0.42"/>

    <rect x="-62" y="-106" width="124" height="80" rx="12" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
    <rect x="-42" y="-84" width="44" height="20" rx="3" fill="var(--c-accent)" opacity="0.55"/>
    <rect x="-42" y="-56" width="66" height="8" rx="4" fill="var(--c-muted)" opacity="0.42"/>

    <rect x="-62" y="-16" width="124" height="80" rx="12" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
    <rect x="-42" y="6" width="44" height="20" rx="3" fill="var(--c-accent)" opacity="0.55"/>
    <rect x="-42" y="34" width="66" height="8" rx="4" fill="var(--c-muted)" opacity="0.42"/>

    <rect x="-62" y="74" width="124" height="80" rx="12" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
    <rect x="-42" y="96" width="44" height="20" rx="3" fill="var(--c-accent)" opacity="0.55"/>
    <rect x="-42" y="124" width="66" height="8" rx="4" fill="var(--c-muted)" opacity="0.42"/>
  </g>

  <!-- 어긋난 두 기둥: 갱신 경로가 갈라져 층이 밀린다 -->
  <g transform="translate(768 312) rotate(6)">
    <line x1="-162" y1="-206" x2="-162" y2="174" stroke="var(--c-accent)" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

    <rect x="-150" y="-196" width="104" height="72" rx="10" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.2"/>
    <rect x="-134" y="-174" width="40" height="16" rx="3" fill="var(--c-accent)" opacity="0.5"/>
    <rect x="-150" y="-112" width="104" height="72" rx="10" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.2"/>
    <rect x="-134" y="-90" width="40" height="16" rx="3" fill="var(--c-accent)" opacity="0.5"/>
    <rect x="-150" y="-28" width="104" height="72" rx="10" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.2"/>
    <rect x="-134" y="-6" width="40" height="16" rx="3" fill="var(--c-accent)" opacity="0.5"/>
    <rect x="-150" y="56" width="104" height="72" rx="10" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.2"/>
    <rect x="-134" y="78" width="40" height="16" rx="3" fill="var(--c-accent)" opacity="0.5"/>

    <line x1="-6" y1="-238" x2="-6" y2="214" stroke="var(--c-accent-3)" stroke-width="3" stroke-dasharray="11 10"/>

    <line x1="34" y1="-176" x2="34" y2="204" stroke="var(--c-accent-3)" stroke-width="3.2" stroke-linecap="round" opacity="0.65"/>
    <rect x="46" y="-166" width="104" height="72" rx="10" fill="none" stroke="var(--c-accent-3)" stroke-width="3" stroke-dasharray="9 8"/>
    <rect x="46" y="-82" width="104" height="72" rx="10" fill="none" stroke="var(--c-accent-3)" stroke-width="3" stroke-dasharray="9 8"/>
    <rect x="46" y="2" width="104" height="72" rx="10" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.2"/>
    <rect x="62" y="24" width="40" height="16" rx="3" fill="var(--c-accent)" opacity="0.5"/>
    <rect x="46" y="86" width="104" height="72" rx="10" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.2"/>
    <rect x="62" y="108" width="40" height="16" rx="3" fill="var(--c-accent)" opacity="0.5"/>
  </g>

  <!-- 한 층을 집어내는 루페 -->
  <g transform="rotate(-130 900 400)">
    <rect x="884" y="498" width="32" height="176" rx="16" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="8"/>
  </g>
  <circle cx="900" cy="400" r="104" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="8"/>
  <circle cx="900" cy="400" r="86" fill="none" stroke="var(--c-accent-2)" stroke-width="2" stroke-dasharray="4 9"/>
  <rect x="836" y="356" width="128" height="54" rx="10" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
  <rect x="854" y="374" width="64" height="9" rx="4.5" fill="var(--c-accent)" opacity="0.55"/>
  <rect x="854" y="389" width="40" height="9" rx="4.5" fill="var(--c-muted)" opacity="0.45"/>
  <rect x="836" y="424" width="86" height="12" rx="6" fill="var(--c-accent-2)" fill-opacity="0.7"/>
  <rect x="836" y="444" width="54" height="12" rx="6" fill="var(--c-accent-3)" fill-opacity="0.7"/>
  <circle cx="944" cy="430" r="7" fill="var(--c-accent-2)"/>
  <circle cx="944" cy="450" r="5" fill="var(--c-accent-3)"/>

  <!-- 흩어진 디테일 -->
  <circle cx="398" cy="140" r="28" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5"/>
  <circle cx="398" cy="140" r="11" fill="var(--c-accent-3)"/>
  <line x1="468" y1="100" x2="440" y2="520" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="7 10" stroke-opacity="0.5"/>
  <rect x="84" y="364" width="76" height="76" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5" transform="rotate(12 122 402)"/>
  <rect x="90" y="506" width="58" height="13" rx="5" fill="var(--c-accent-2)" fill-opacity="0.6"/>
  <rect x="114" y="528" width="34" height="8" rx="4" fill="var(--c-accent-3)" fill-opacity="0.8"/>
  <g transform="translate(332 566)" opacity="0.5">
    <circle r="36" fill="none" stroke="var(--c-accent-2)" stroke-width="1.6"/>
    <circle r="19" fill="none" stroke="var(--c-accent-2)" stroke-width="1.6" opacity="0.65"/>
  </g>
  <polygon points="572,586 622,586 597,540" fill="none" stroke="var(--c-accent-3)" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="1046" cy="112" r="9" fill="var(--c-accent)"/>
  <circle cx="1076" cy="134" r="6" fill="var(--c-accent-2)"/>
  <circle cx="1028" cy="144" r="5" fill="var(--c-accent-3)"/>

  <text class="ep-number" x="1164" y="594" text-anchor="end">01</text>
</svg>
