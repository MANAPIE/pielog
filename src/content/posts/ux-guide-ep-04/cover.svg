    <radialGradient id="halo-ux04b" cx="0.16" cy="0.84" r="0.55"><stop offset="0" stop-color="var(--c-accent-2)" stop-opacity="0.24"/><stop offset="1" stop-color="var(--c-accent-2)" stop-opacity="0"/></radialGradient>
