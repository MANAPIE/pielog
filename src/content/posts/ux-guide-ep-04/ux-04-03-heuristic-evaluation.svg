<svg viewBox="0 0 500 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-he">
  <title id="t-he">휴리스틱 평가의 절차와 심각도 척도</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-he" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-he-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="396" />
  <g transform="translate(24 24)">
    <rect width="104" height="92" rx="8" class="card" stroke="var(--c-divider)" stroke-width="1" />
    <text x="12" y="24" class="ep">1</text>
    <text x="12" y="46" class="nm">체크리스트</text>
    <text x="12" y="62" class="nm"> 준비</text>
    <text x="12" y="82" class="cap">10가지 휴리스틱</text>
  </g>
  <line x1="129" y1="70" x2="135" y2="70" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-he)" />
  <g transform="translate(140 24)">
    <rect width="104" height="92" rx="8" class="card" stroke="var(--c-divider)" stroke-width="1" />
    <text x="12" y="24" class="ep">2</text>
    <text x="12" y="46" class="nm">개별 평가</text>
    <text x="12" y="62" class="nm"></text>
    <text x="12" y="82" class="cap">각자 위반 기록</text>
  </g>
  <line x1="245" y1="70" x2="251" y2="70" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-he)" />
  <g transform="translate(256 24)">
    <rect width="104" height="92" rx="8" class="card" stroke="var(--c-divider)" stroke-width="1" />
    <text x="12" y="24" class="ep">3</text>
    <text x="12" y="46" class="nm">취합과</text>
    <text x="12" y="62" class="nm">심각도 분류</text>
    <text x="12" y="82" class="cap">0~4 척도로 분류</text>
  </g>
  <line x1="361" y1="70" x2="367" y2="70" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-he)" />
  <g transform="translate(372 24)">
    <rect width="104" height="92" rx="8" class="card" stroke="var(--c-divider)" stroke-width="1" />
    <text x="12" y="24" class="ep">4</text>
    <text x="12" y="46" class="nm">우선순위와</text>
    <text x="12" y="62" class="nm"> 개선</text>
    <text x="12" y="82" class="cap">치명적인 것부터</text>
  </g>
  <text x="24" y="140" class="cap">평가자 5명이면 전체 사용성 문제의 약 75%를 발견합니다.</text>
  <text x="24" y="158" class="cap">심각도는 4명의 평균을 내면 실제 값과 0.5점 이내로 일치합니다.</text>
  <line x1="24" y1="176" x2="476" y2="176" stroke="var(--c-divider)" stroke-width="1" />
  <text x="24" y="200" class="th">심각도 척도</text>
  <g transform="translate(24 212)">
    <rect width="84" height="120" rx="6" fill="var(--c-muted-soft)" stroke="var(--c-divider)" stroke-width="1.4" />
    <text x="42" y="34" class="met" text-anchor="middle" style="fill:var(--c-muted)">0</text>
    <text x="42" y="58" class="nm" text-anchor="middle">문제 아님</text>
    <text x="42" y="80" class="cap" text-anchor="middle">-</text>
    <text x="42" y="96" class="cap" text-anchor="middle"></text>
  </g>
  <g transform="translate(116 212)">
    <rect width="84" height="120" rx="6" fill="var(--c-muted-soft)" stroke="var(--c-divider)" stroke-width="1.4" />
    <text x="42" y="34" class="met" text-anchor="middle" style="fill:var(--c-muted)">1</text>
    <text x="42" y="58" class="nm" text-anchor="middle">외관상</text>
    <text x="42" y="80" class="cap" text-anchor="middle">시간 남으면</text>
    <text x="42" y="96" class="cap" text-anchor="middle">수정</text>
  </g>
  <g transform="translate(208 212)">
    <rect width="84" height="120" rx="6" fill="var(--c-muted-soft)" stroke="var(--c-divider)" stroke-width="1.4" />
    <text x="42" y="34" class="met" text-anchor="middle" style="fill:var(--c-muted)">2</text>
    <text x="42" y="58" class="nm" text-anchor="middle">경미</text>
    <text x="42" y="80" class="cap" text-anchor="middle">낮은</text>
    <text x="42" y="96" class="cap" text-anchor="middle">우선순위</text>
  </g>
  <g transform="translate(300 212)">
    <rect width="84" height="120" rx="6" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.4" />
    <text x="42" y="34" class="met" text-anchor="middle" style="fill:var(--c-accent-2)">3</text>
    <text x="42" y="58" class="nm" text-anchor="middle">주요</text>
    <text x="42" y="80" class="cap" text-anchor="middle">높은</text>
    <text x="42" y="96" class="cap" text-anchor="middle">우선순위</text>
  </g>
  <g transform="translate(392 212)">
    <rect width="84" height="120" rx="6" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.4" />
    <text x="42" y="34" class="met" text-anchor="middle" style="fill:var(--c-accent-2)">4</text>
    <text x="42" y="58" class="nm" text-anchor="middle">치명적</text>
    <text x="42" y="80" class="cap" text-anchor="middle">출시 전</text>
    <text x="42" y="96" class="cap" text-anchor="middle">반드시 수정</text>
  </g>
  <text x="24" y="360" class="cap">전문가가 사용자를 대신하는 방법이라 사용자만 겪는 문제는 놓칩니다.</text>
  <text x="24" y="378" class="cap">출처: Nielsen(1992), NN/g 심각도 척도.</text>
</svg>
