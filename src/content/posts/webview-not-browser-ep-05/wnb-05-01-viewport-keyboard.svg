<svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-vpkb">
  <title id="t-vpkb">키보드가 올라올 때 뷰포트가 어떻게 변하는지를 네 가지 환경으로 비교한 다이어그램</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #0E7490;
        --c-accent-2: #B45309;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(14, 116, 144, 0.08);
        --c-soft-2: rgba(180, 83, 9, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #4DD4EC;
          --c-accent-2: #E8A876;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(77, 212, 236, 0.12);
          --c-soft-2: rgba(232, 168, 118, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .sec-ttl {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .col-ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .callout {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .mono {
        font-family: 'Inter', ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        fill: var(--c-fg);
        fill-opacity: 0.72;
      }

      .lg-txt {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        fill: var(--c-fg);
        fill-opacity: 0.85;
      }

      .cap {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        fill: var(--c-fg);
        fill-opacity: 0.74;
      }

      .note {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        fill: var(--c-fg);
        fill-opacity: 0.62;
      }

      .emph {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: var(--c-accent-2);
      }

      .sum {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .screen {
        fill: var(--c-card);
        stroke: var(--c-divider);
        stroke-width: 1.5;
      }

      .lv {
        fill: none;
        stroke: var(--c-accent);
        stroke-width: 2;
      }

      .vv {
        fill: var(--c-accent-2);
        fill-opacity: 0.18;
      }

      .kb-fill {
        fill: var(--c-muted);
        fill-opacity: 0.10;
      }

      .kb-edge {
        fill: none;
        stroke: var(--c-muted);
        stroke-width: 1.2;
      }

      .bar {
        fill: var(--c-fg);
        fill-opacity: 0.82;
      }

      .bar-hidden {
        fill: var(--c-fg);
        fill-opacity: 0.28;
      }

      .lead {
        fill: none;
        stroke: var(--c-fg);
        stroke-opacity: 0.38;
        stroke-width: 1.2;
        stroke-dasharray: 3 3;
      }

      .xmark {
        stroke: var(--c-muted);
        stroke-width: 2;
        stroke-linecap: round;
      }
    </style>
    <pattern id="kb-hatch-05" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="var(--c-muted)" stroke-width="1.3" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <rect class="bg" width="800" height="750" />

  <!-- ================= 공통 기준 상태 ================= -->
  <text x="36" y="32" class="sec-ttl">공통 기준 상태</text>

  <g transform="translate(36 0)">
    <!-- 기기 화면 -->
    <rect x="0" y="50" width="130" height="196" rx="12" class="screen" />
    <!-- 레이아웃 뷰포트 (파란 실선) -->
    <rect x="9" y="59" width="112" height="178" rx="6" class="lv" />
    <!-- 시각 뷰포트 (주황 반투명 채움) — 완전히 겹침 -->
    <rect x="11" y="61" width="108" height="174" rx="5" class="vv" />
    <!-- 하단 고정 버튼 -->
    <rect x="15" y="215" width="100" height="14" rx="4" class="bar" />

    <!-- 콜아웃: 레이아웃 뷰포트 -->
    <circle cx="121" cy="59" r="2.6" fill="var(--c-accent)" />
    <line x1="124" y1="59" x2="158" y2="59" class="lead" />
    <text x="164" y="63" class="callout" fill="var(--c-accent)">레이아웃 뷰포트</text>
    <!-- 콜아웃: 시각 뷰포트 -->
    <circle cx="119" cy="140" r="2.6" fill="var(--c-accent-2)" />
    <line x1="124" y1="140" x2="158" y2="140" class="lead" />
    <text x="164" y="144" class="callout" fill="var(--c-accent-2)">시각 뷰포트</text>
    <!-- 콜아웃: 하단 고정 버튼 -->
    <circle cx="115" cy="222" r="2.6" fill="var(--c-fg)" />
    <line x1="124" y1="222" x2="158" y2="222" class="lead" />
    <text x="164" y="218" class="callout">하단 고정 버튼</text>
    <text x="164" y="235" class="mono">position: fixed</text>
  </g>

  <!-- ================= 범례 ================= -->
  <line x1="36" y1="268" x2="764" y2="268" stroke="var(--c-divider)" stroke-width="1" />

  <g>
    <rect x="36" y="282" width="26" height="16" rx="3" class="lv" />
    <text x="70" y="295" class="lg-txt">레이아웃 뷰포트</text>

    <rect x="200" y="282" width="26" height="16" rx="3" class="vv" />
    <text x="234" y="295" class="lg-txt">시각 뷰포트</text>

    <rect x="340" y="282" width="26" height="16" rx="3" class="kb-fill" />
    <rect x="340" y="282" width="26" height="16" rx="3" fill="url(#kb-hatch-05)" />
    <rect x="340" y="282" width="26" height="16" rx="3" class="kb-edge" />
    <text x="374" y="295" class="lg-txt">온스크린 키보드</text>
  </g>

  <!-- ================= 1. iOS WKWebView ================= -->
  <g transform="translate(36 0)">
    <text x="0" y="340" class="col-ttl">iOS</text>
    <text x="0" y="356" class="col-ttl">WKWebView</text>

    <rect x="0" y="372" width="130" height="196" rx="12" class="screen" />
    <!-- 레이아웃 뷰포트: 키보드 뒤까지 원래 높이 유지 -->
    <rect x="9" y="381" width="112" height="178" rx="6" class="lv" />
    <!-- 시각 뷰포트: 키보드 윗변까지 축소 -->
    <rect x="11" y="383" width="108" height="116" rx="5" class="vv" />
    <!-- 하단 고정 버튼: 원래 위치에 반투명하게 남아 가려짐 -->
    <rect x="15" y="537" width="100" height="14" rx="4" class="bar-hidden" />
    <!-- 온스크린 키보드 -->
    <rect x="13" y="501" width="104" height="54" rx="6" class="kb-fill" />
    <rect x="13" y="501" width="104" height="54" rx="6" fill="url(#kb-hatch-05)" />
    <rect x="13" y="501" width="104" height="54" rx="6" class="kb-edge" />

    <text x="0" y="586" class="cap">
      <tspan x="0" dy="0">레이아웃 뷰포트 유지,</tspan>
      <tspan x="0" dy="14">시각 뷰포트만 축소</tspan>
    </text>
  </g>

  <!-- ================= 2. Android Chrome 108 이상 ================= -->
  <g transform="translate(235 0)">
    <text x="0" y="340" class="col-ttl">Android Chrome</text>
    <text x="0" y="356" class="col-ttl">108 이상</text>

    <rect x="0" y="372" width="130" height="196" rx="12" class="screen" />
    <rect x="9" y="381" width="112" height="178" rx="6" class="lv" />
    <rect x="11" y="383" width="108" height="116" rx="5" class="vv" />
    <rect x="15" y="537" width="100" height="14" rx="4" class="bar-hidden" />
    <rect x="13" y="501" width="104" height="54" rx="6" class="kb-fill" />
    <rect x="13" y="501" width="104" height="54" rx="6" fill="url(#kb-hatch-05)" />
    <rect x="13" y="501" width="104" height="54" rx="6" class="kb-edge" />

    <text x="0" y="586" class="cap">
      <tspan x="0" dy="0">레이아웃 뷰포트 유지,</tspan>
      <tspan x="0" dy="14">시각 뷰포트만 축소.</tspan>
      <tspan x="0" dy="14">뷰포트 상대 단위</tspan>
      <tspan x="0" dy="14">계산값은 그대로.</tspan>
      <tspan x="0" dy="14">position: fixed는</tspan>
      <tspan x="0" dy="14">제자리에 남아 가려짐</tspan>
    </text>
  </g>

  <!-- ================= 3. Android WebView M139 미만 ================= -->
  <g transform="translate(435 0)">
    <text x="0" y="340" class="col-ttl">Android WebView</text>
    <text x="0" y="356" class="col-ttl">M139 미만</text>

    <rect x="0" y="372" width="130" height="196" rx="12" class="screen" />
    <!-- 레이아웃 뷰포트도 함께 축소 — 두 경계선이 겹침 -->
    <rect x="9" y="381" width="112" height="118" rx="6" class="lv" />
    <rect x="11" y="383" width="108" height="114" rx="5" class="vv" />
    <!-- 하단 고정 버튼: 줄어든 영역의 맨 아래로 올라옴 -->
    <rect x="15" y="479" width="100" height="14" rx="4" class="bar" />
    <rect x="13" y="501" width="104" height="54" rx="6" class="kb-fill" />
    <rect x="13" y="501" width="104" height="54" rx="6" fill="url(#kb-hatch-05)" />
    <rect x="13" y="501" width="104" height="54" rx="6" class="kb-edge" />

    <text x="0" y="586" class="cap">
      <tspan x="0" dy="0">레이아웃 뷰포트도</tspan>
      <tspan x="0" dy="14">함께 축소.</tspan>
      <tspan x="0" dy="14">화면 변화는 액티비티의</tspan>
      <tspan x="0" dy="14">windowSoftInputMode가</tspan>
      <tspan x="0" dy="14">결정</tspan>
    </text>
  </g>

  <!-- ================= 4. Android WebView M139 이상 ================= -->
  <g transform="translate(634 0)">
    <text x="0" y="340" class="col-ttl">Android WebView</text>
    <text x="0" y="356" class="col-ttl">M139 이상</text>

    <rect x="0" y="372" width="130" height="196" rx="12" class="screen" />
    <!-- 레이아웃 뷰포트: 원래 높이 유지 -->
    <rect x="9" y="381" width="112" height="178" rx="6" class="lv" />
    <!-- 시각 뷰포트: 키보드 윗변까지 축소 -->
    <rect x="11" y="383" width="108" height="116" rx="5" class="vv" />
    <!-- 하단에만 적용 -->
    <text x="65" y="492" class="emph" text-anchor="middle">하단에만 적용</text>
    <line x1="11" y1="500" x2="119" y2="500" stroke="var(--c-accent-2)" stroke-width="3.5"
      stroke-linecap="round" />
    <rect x="13" y="501" width="104" height="54" rx="6" class="kb-fill" />
    <rect x="13" y="501" width="104" height="54" rx="6" fill="url(#kb-hatch-05)" />
    <rect x="13" y="501" width="104" height="54" rx="6" class="kb-edge" />
    <!-- 좌·우·상단: 리사이즈 없음 -->
    <g class="xmark">
      <line x1="60" y1="376" x2="70" y2="386" />
      <line x1="70" y1="376" x2="60" y2="386" />
      <line x1="4" y1="435" x2="14" y2="445" />
      <line x1="14" y1="435" x2="4" y2="445" />
      <line x1="116" y1="435" x2="126" y2="445" />
      <line x1="126" y1="435" x2="116" y2="445" />
    </g>

    <text x="0" y="586" class="cap">
      <tspan x="0" dy="0">IME가 시각 뷰포트를</tspan>
      <tspan x="0" dy="14">직접 리사이즈</tspan>
    </text>
    <g class="xmark">
      <line x1="0" y1="616" x2="8" y2="624" />
      <line x1="8" y1="616" x2="0" y2="624" />
    </g>
    <text x="14" y="624" class="note">
      <tspan x="14" dy="0">좌·우·상단 오버랩은</tspan>
      <tspan x="14" dy="14">리사이즈 없음</tspan>
    </text>
  </g>

  <!-- ================= 한 줄 요약 띠 ================= -->
  <rect x="36" y="684" width="728" height="42" rx="10" fill="var(--c-soft)" stroke="var(--c-accent)"
    stroke-width="1.2" />
  <text x="400" y="710" class="sum" text-anchor="middle">레이아웃 뷰포트가 줄어드는 경우와 시각 뷰포트만 줄어드는 경우가 갈린다</text>
</svg>
