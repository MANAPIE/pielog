<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">ep.10 — 실험과 통계</title>
  <style>
    :root {
      --c-bg: #fafaf7;
      --c-fg: #1a1a1a;
      --c-muted: #6b6b6b;
      --c-accent: #c97f4a;
      --c-accent-2: #2d4a3e;
      --c-accent-3: #d9a47e;
      --c-num: #c97f4a;
      --c-dot: #1a1a1a;
      --c-line: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e;
        --c-fg: #ededea;
        --c-muted: #999996;
        --c-accent: #e09a6a;
        --c-accent-2: #7fb09a;
        --c-accent-3: #d4a560;
        --c-num: #e09a6a;
        --c-dot: #ededea;
        --c-line: #4a4a47;
      }
    }
  </style>
  <defs>
    <pattern id="dotgrid10" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="var(--c-dot)" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="rg10a" cx="78%" cy="78%" r="60%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg10b" cx="22%" cy="22%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="var(--c-bg)"/>
  <rect width="1200" height="630" fill="url(#dotgrid10)"/>
  <rect width="1200" height="630" fill="url(#rg10a)"/>
  <rect width="1200" height="630" fill="url(#rg10b)"/>

  <!-- 화면 밖 큰 도형 -->
  <rect x="1000" y="400" width="320" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(-8 1160 560)"/>
  <circle cx="-100" cy="-50" r="280" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 메인 메타포: 두 정규분포가 겹치는 그래프 (A/B 테스트) -->
  <g transform="translate(120, 119) scale(1.14)">
    <!-- 베이스라인 -->
    <line x1="0" y1="280" x2="840" y2="280" stroke="var(--c-fg)" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- A 분포 (좌, 옅음) -->
    <path d="M 60 280 Q 120 270 180 240 Q 240 150 300 60 Q 360 150 420 240 Q 480 270 540 280 Z"
      fill="var(--c-accent-3)" fill-opacity="0.55" stroke="var(--c-accent-3)" stroke-width="2"/>

    <!-- B 분포 (우, 진함) -->
    <path d="M 280 280 Q 340 270 400 240 Q 460 150 520 60 Q 580 150 640 240 Q 700 270 760 280 Z"
      fill="var(--c-accent-2)" fill-opacity="0.55" stroke="var(--c-accent-2)" stroke-width="2"/>

    <!-- 겹치는 영역 강조 (포커스 - p-value 영역) -->
    <path d="M 280 280 Q 340 270 400 240 Q 420 220 420 240 Q 400 270 360 280 Z"
      fill="var(--c-accent)" fill-opacity="0.5"/>

    <!-- A 평균 점선 -->
    <line x1="300" y1="60" x2="300" y2="280" stroke="var(--c-accent-3)" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="300" cy="60" r="6" fill="var(--c-accent-3)"/>

    <!-- B 평균 점선 -->
    <line x1="520" y1="60" x2="520" y2="280" stroke="var(--c-accent-2)" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="520" cy="60" r="6" fill="var(--c-accent-2)"/>

    <!-- 차이 화살표 -->
    <g transform="translate(0, 30)">
      <line x1="300" y1="0" x2="520" y2="0" stroke="var(--c-accent)" stroke-width="1.5"/>
      <line x1="300" y1="-6" x2="300" y2="6" stroke="var(--c-accent)" stroke-width="1.5"/>
      <line x1="520" y1="-6" x2="520" y2="6" stroke="var(--c-accent)" stroke-width="1.5"/>
    </g>

    <!-- 미니 바 묶음 (좌하단, 표본 분포 표시) -->
    <g transform="translate(0, 300)" fill="var(--c-accent-2)" fill-opacity="0.7">
      <rect x="0" y="0" width="6" height="8"/>
      <rect x="10" y="0" width="6" height="12"/>
      <rect x="20" y="0" width="6" height="18"/>
      <rect x="30" y="0" width="6" height="24"/>
      <rect x="40" y="0" width="6" height="20"/>
      <rect x="50" y="0" width="6" height="14"/>
      <rect x="60" y="0" width="6" height="10"/>
    </g>

    <!-- 도트 무리 (관측치) -->
    <g fill="var(--c-fg)" opacity="0.5">
      <circle cx="260" cy="296" r="3"/>
      <circle cx="280" cy="294" r="3"/>
      <circle cx="320" cy="292" r="3"/>
      <circle cx="340" cy="296" r="3"/>

      <circle cx="500" cy="294" r="3"/>
      <circle cx="520" cy="292" r="3"/>
      <circle cx="540" cy="296" r="3"/>
    </g>

    <!-- 포커스 링 (B 평균 강조) -->
    <circle cx="520" cy="60" r="28" fill="none" stroke="var(--c-accent)" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- 회전된 사각형 -->
    <rect x="-30" y="20" width="22" height="22" fill="none" stroke="var(--c-accent)" stroke-width="1.5" transform="rotate(15 -19 31)"/>
    <rect x="850" y="200" width="22" height="22" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" transform="rotate(-12 861 211)"/>
  </g>

  <!-- 우하단 시리즈 번호 -->
  <text x="1144" y="600" text-anchor="end"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="220" font-weight="700"
    fill="var(--c-num)" fill-opacity="0.18"
    letter-spacing="-0.04em">10</text>
</svg>
