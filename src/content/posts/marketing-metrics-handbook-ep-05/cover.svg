<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">ep.05 — 유지와 참여</title>
  <style>
    :root {
      --c-bg: #fafaf7;
      --c-fg: #1a1a1a;
      --c-muted: #6b6b6b;
      --c-accent: #c97f4a;
      --c-accent-2: #2d4a3e;
      --c-accent-3: #d9a47e;
      --c-num: #c97f4a;
      --c-dot: #1a1a1a;
      --c-line: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e;
        --c-fg: #ededea;
        --c-muted: #999996;
        --c-accent: #e09a6a;
        --c-accent-2: #7fb09a;
        --c-accent-3: #d4a560;
        --c-num: #e09a6a;
        --c-dot: #ededea;
        --c-line: #4a4a47;
      }
    }
  </style>
  <defs>
    <pattern id="dotgrid05" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="var(--c-dot)" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="rg05a" cx="78%" cy="22%" r="60%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg05b" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="var(--c-bg)"/>
  <rect width="1200" height="630" fill="url(#dotgrid05)"/>
  <rect width="1200" height="630" fill="url(#rg05a)"/>
  <rect width="1200" height="630" fill="url(#rg05b)"/>

  <!-- 화면 밖 큰 도형 -->
  <circle cx="1280" cy="640" r="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="-180" y="-100" width="300" height="300" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(-12 -30 50)"/>

  <!-- 메인 메타포: 동심원 (MAU > WAU > DAU) -->
  <g transform="translate(600, 343) scale(1.16)">
    <!-- MAU 가장 큰 원 -->
    <circle cx="0" cy="0" r="240" fill="var(--c-accent-3)" fill-opacity="0.18" stroke="var(--c-fg)" stroke-width="1.5"/>
    <!-- WAU 중간 원 -->
    <circle cx="0" cy="0" r="160" fill="var(--c-accent)" fill-opacity="0.25" stroke="var(--c-fg)" stroke-width="1.5"/>
    <!-- DAU 가장 작은 원 -->
    <circle cx="0" cy="0" r="80" fill="var(--c-accent-2)" stroke="var(--c-accent-2)" stroke-width="2"/>

    <!-- 가장 작은 중심 (Stickiness 핵심) -->
    <circle cx="0" cy="0" r="14" fill="var(--c-bg)"/>
    <circle cx="0" cy="0" r="6" fill="var(--c-accent-2)"/>

    <!-- 외곽에 도트 무리들 (이탈한 사용자들) -->
    <g fill="var(--c-fg)" opacity="0.4">
      <!-- 위쪽 -->
      <circle cx="-30" cy="-260" r="3"/>
      <circle cx="-12" cy="-268" r="3"/>
      <circle cx="6" cy="-264" r="3"/>
      <circle cx="24" cy="-270" r="3"/>

      <!-- 우상 -->
      <circle cx="220" cy="-180" r="3"/>
      <circle cx="234" cy="-168" r="3"/>
      <circle cx="248" cy="-182" r="3"/>

      <!-- 우하 -->
      <circle cx="240" cy="180" r="3"/>
      <circle cx="252" cy="194" r="3"/>

      <!-- 좌하 -->
      <circle cx="-220" cy="200" r="3"/>
      <circle cx="-234" cy="186" r="3"/>
      <circle cx="-248" cy="208" r="3"/>

      <!-- 좌상 -->
      <circle cx="-230" cy="-180" r="3"/>
      <circle cx="-216" cy="-198" r="3"/>
    </g>

    <!-- 포커스 링 (DAU 강조, 살짝 회전한 점선) -->
    <ellipse cx="0" cy="0" rx="92" ry="88" fill="none" stroke="var(--c-accent)" stroke-width="1.5" stroke-dasharray="4 3" transform="rotate(-12)"/>

    <!-- 회전된 사각형들 -->
    <rect x="-300" y="-220" width="24" height="24" fill="none" stroke="var(--c-accent)" stroke-width="1.5" transform="rotate(15 -288 -208)"/>
    <rect x="280" y="200" width="22" height="22" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" transform="rotate(-10 291 211)"/>
  </g>

  <!-- 우하단 시리즈 번호 -->
  <text x="1144" y="600" text-anchor="end"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="220" font-weight="700"
    fill="var(--c-num)" fill-opacity="0.18"
    letter-spacing="-0.04em">05</text>
</svg>
