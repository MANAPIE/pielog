<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" role="img" aria-labelledby="title-stg00-02">
  <title id="title-stg00-02">사용자 대상 소프트웨어 테스트 가이드 시리즈 도입 로드맵</title>
  <style>
    svg {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-muted: #6B7280;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-accent-3: #B8CCC2;
      --c-card-bg: #F2F0E9;
      --c-card-border: rgba(91, 140, 123, 0.28);
      --c-ep-bg: #E8EEEB;
      --c-arrow: #B8CCC2;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-muted: #94A3B8;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-accent-3: #4A6B5E;
        --c-card-bg: #1F242C;
        --c-card-border: rgba(127, 181, 160, 0.32);
        --c-ep-bg: #232A30;
        --c-arrow: #4A6B5E;
      }
    }
    .bg { fill: var(--c-bg); }
    .group-frame { fill: none; stroke: var(--c-card-border); stroke-width: 1; stroke-dasharray: 4 3; }
    .ep-card { fill: var(--c-ep-bg); stroke: var(--c-card-border); stroke-width: 1; }
    .ep-card-start { fill: var(--c-card-bg); stroke: var(--c-accent); stroke-width: 1.2; }
    .ep-num { fill: var(--c-accent-2); font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.5px; }
    .ep-label { fill: var(--c-fg); font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 13px; font-weight: 500; }
    .group-label { fill: var(--c-accent-2); font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.3px; }
    .group-sub { fill: var(--c-muted); font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 11px; }
    .arrow { stroke: var(--c-arrow); stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ep-num { fill: var(--c-accent-2); }
      .group-label { fill: var(--c-accent-2); }
    }
  </style>
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--c-arrow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="600" height="600"/>

  <!-- ep.00 시작 -->
  <rect class="ep-card-start" x="210" y="20" width="180" height="50" rx="10"/>
  <text class="ep-num" x="300" y="40" text-anchor="middle">EP.00</text>
  <text class="ep-label" x="300" y="58" text-anchor="middle">개요 · 프레임워크</text>

  <!-- 화살표 1: ep.00 → 그룹 1 -->
  <line class="arrow" x1="300" y1="74" x2="300" y2="98" marker-end="url(#arrow-head)"/>

  <!-- 그룹 1: 자동화 기반 -->
  <rect class="group-frame" x="20" y="105" width="560" height="115" rx="14"/>
  <text class="group-label" x="40" y="128">1단계 · 자동화 기반</text>
  <text class="group-sub" x="40" y="145">코드의 안쪽부터 안전망을 만든다</text>
  <rect class="ep-card" x="120" y="155" width="160" height="50" rx="10"/>
  <text class="ep-num" x="200" y="175" text-anchor="middle">EP.01</text>
  <text class="ep-label" x="200" y="193" text-anchor="middle">단위 테스트</text>
  <rect class="ep-card" x="320" y="155" width="160" height="50" rx="10"/>
  <text class="ep-num" x="400" y="175" text-anchor="middle">EP.02</text>
  <text class="ep-label" x="400" y="193" text-anchor="middle">TDD</text>

  <!-- 화살표 2: 그룹 1 → 그룹 2 -->
  <line class="arrow" x1="300" y1="225" x2="300" y2="248" marker-end="url(#arrow-head)"/>

  <!-- 그룹 2: 안쪽에서 바깥쪽으로 -->
  <rect class="group-frame" x="20" y="255" width="560" height="115" rx="14"/>
  <text class="group-label" x="40" y="278">2단계 · 안쪽에서 바깥쪽으로</text>
  <text class="group-sub" x="40" y="295">결합 지점을 차례로 검증한다</text>
  <rect class="ep-card" x="45" y="305" width="150" height="50" rx="10"/>
  <text class="ep-num" x="120" y="325" text-anchor="middle">EP.03</text>
  <text class="ep-label" x="120" y="343" text-anchor="middle">컴포넌트 · 시각 회귀</text>
  <rect class="ep-card" x="225" y="305" width="150" height="50" rx="10"/>
  <text class="ep-num" x="300" y="325" text-anchor="middle">EP.04</text>
  <text class="ep-label" x="300" y="343" text-anchor="middle">통합 테스트</text>
  <rect class="ep-card" x="405" y="305" width="150" height="50" rx="10"/>
  <text class="ep-num" x="480" y="325" text-anchor="middle">EP.05</text>
  <text class="ep-label" x="480" y="343" text-anchor="middle">E2E 테스트</text>

  <!-- 화살표 3: 그룹 2 → 그룹 3 -->
  <line class="arrow" x1="300" y1="375" x2="300" y2="398" marker-end="url(#arrow-head)"/>

  <!-- 그룹 3: 기능에서 경험으로 -->
  <rect class="group-frame" x="20" y="405" width="560" height="115" rx="14"/>
  <text class="group-label" x="40" y="428">3단계 · 기능에서 경험으로</text>
  <text class="group-sub" x="40" y="445">사용자가 느끼는 품질을 채운다</text>
  <rect class="ep-card" x="45" y="455" width="150" height="50" rx="10"/>
  <text class="ep-num" x="120" y="475" text-anchor="middle">EP.06</text>
  <text class="ep-label" x="120" y="493" text-anchor="middle">접근성</text>
  <rect class="ep-card" x="225" y="455" width="150" height="50" rx="10"/>
  <text class="ep-num" x="300" y="475" text-anchor="middle">EP.07</text>
  <text class="ep-label" x="300" y="493" text-anchor="middle">성능</text>
  <rect class="ep-card" x="405" y="455" width="150" height="50" rx="10"/>
  <text class="ep-num" x="480" y="475" text-anchor="middle">EP.08</text>
  <text class="ep-label" x="480" y="493" text-anchor="middle">운영 모니터링</text>

  <!-- 화살표 4: 그룹 3 → ep.09 -->
  <line class="arrow" x1="300" y1="525" x2="300" y2="548" marker-end="url(#arrow-head)"/>

  <!-- ep.09 결산 -->
  <rect class="ep-card-start" x="210" y="555" width="180" height="35" rx="10"/>
  <text class="ep-num" x="245" y="577" text-anchor="middle">EP.09</text>
  <text class="ep-label" x="325" y="577" text-anchor="middle">전략 종합</text>
</svg>
