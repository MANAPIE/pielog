<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="사용자 대상 소프트웨어 테스트 가이드 시리즈 커버 - 개요편">
  <style>
    :root {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-muted: #6B7280;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-accent-3: #B8CCC2;
      --c-num: rgba(91, 140, 123, 0.16);
      --c-dot: #5B8C7B;
      --c-line: #C9D1CC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-muted: #94A3B8;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-accent-3: #4A6B5E;
        --c-num: rgba(127, 181, 160, 0.18);
        --c-dot: #7FB5A0;
        --c-line: #3D434D;
      }
    }
    .bg { fill: var(--c-bg); }
    .dot { fill: var(--c-dot); }
    .line { stroke: var(--c-line); fill: none; }
    .accent-fill { fill: var(--c-accent); }
    .accent2-fill { fill: var(--c-accent-2); }
    .accent3-fill { fill: var(--c-accent-3); }
    .accent-stroke { stroke: var(--c-accent); fill: none; }
    .accent2-stroke { stroke: var(--c-accent-2); fill: none; }
    .num-text { font: 900 240px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-num); letter-spacing: -0.04em; }
  </style>
  <defs>
    <pattern id="dotgrid-00" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.1" class="dot" opacity="0.18"/>
    </pattern>
    <radialGradient id="rg-tl-00" cx="0" cy="0" r="0.55">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-br-00" cx="1" cy="1" r="0.6">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1: bg -->
  <rect class="bg" width="1200" height="630"/>

  <!-- 2: dot grid -->
  <rect width="1200" height="630" fill="url(#dotgrid-00)"/>

  <!-- 3: radial gradients -->
  <rect width="1200" height="630" fill="url(#rg-tl-00)"/>
  <rect width="1200" height="630" fill="url(#rg-br-00)"/>

  <!-- 4: large off-canvas stroke shapes -->
  <circle cx="-100" cy="700" r="380" class="line" stroke-width="1.5"/>
  <rect x="950" y="-180" width="450" height="450" class="line" stroke-width="1.5" transform="rotate(18 1175 45)"/>

  <g transform="translate(600 315) scale(1.3) translate(-600 -315)">
    <!-- Foreground: 동심원 (시작점, 원점 메타포) -->
    <g transform="translate(420 315)">
      <circle r="148" class="accent-stroke" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
      <circle r="98" class="accent2-stroke" stroke-width="1.5" opacity="0.7"/>
      <circle r="52" class="accent-fill" opacity="0.18"/>
      <circle r="18" class="accent2-fill"/>
    </g>

    <!-- 방사형 가지 (3축 메타포) -->
    <g stroke-linecap="round" fill="none">
      <line x1="420" y1="167" x2="420" y2="60" class="accent-stroke" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="420" cy="60" r="6" class="accent-fill"/>
      <line x1="525" y1="210" x2="640" y2="155" class="accent-stroke" stroke-width="1.5"/>
      <rect x="630" y="143" width="22" height="22" class="accent2-fill" opacity="0.85" transform="rotate(12 641 154)"/>
      <line x1="525" y1="420" x2="660" y2="490" class="accent-stroke" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="660" cy="490" r="7" class="accent2-fill"/>
      <circle cx="660" cy="490" r="13" class="accent-stroke" stroke-width="1.2" opacity="0.7"/>
      <line x1="315" y1="420" x2="200" y2="500" class="accent-stroke" stroke-width="1.5"/>
      <circle cx="200" cy="500" r="3" class="accent2-fill"/>
      <circle cx="188" cy="510" r="3" class="accent2-fill"/>
      <circle cx="212" cy="512" r="3" class="accent2-fill"/>
      <line x1="315" y1="210" x2="195" y2="140" class="accent-stroke" stroke-width="1.5" stroke-dasharray="4 4"/>
      <polygon points="195,140 184,148 184,132" class="accent2-fill"/>
    </g>

    <!-- 오른쪽 영역: 미니 바 묶음 (테스트 레벨 메타포) -->
    <g transform="translate(820 220)">
      <rect x="0" y="0" width="6" height="56" class="accent2-fill" opacity="0.85"/>
      <rect x="14" y="14" width="6" height="42" class="accent-fill" opacity="0.7"/>
      <rect x="28" y="28" width="6" height="28" class="accent3-fill" opacity="0.85"/>
      <rect x="42" y="42" width="6" height="14" class="accent3-fill" opacity="0.6"/>
    </g>

    <!-- 오른쪽 중단: 체크 표시 -->
    <g transform="translate(870 400)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="22" class="accent-stroke" stroke-width="1.5" stroke-dasharray="2 4"/>
      <polyline points="-9,1 -3,7 9,-6" class="accent2-stroke" stroke-width="2"/>
    </g>
  </g>

  <!-- 회전된 사각형 (오른쪽 빈 공간, 살짝 잘리게) -->
  <rect x="980" y="80" width="120" height="120" class="line" stroke-width="1.5" fill="none" transform="rotate(-8 1040 140)" opacity="0.6"/>

  <!-- 작은 점 무리 (상단 가운데) -->
  <g class="accent2-fill" opacity="0.7">
    <circle cx="680" cy="80" r="3"/>
    <circle cx="694" cy="92" r="3"/>
    <circle cx="668" cy="95" r="3"/>
  </g>

  <!-- 우하단 시리즈 번호 -->
  <text class="num-text" x="1164" y="594" text-anchor="end">00</text>
</svg>
