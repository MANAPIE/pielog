<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">ep.02 - 광고 효율</title>
  <style>
    :root {
      --c-bg: #fafaf7;
      --c-fg: #1a1a1a;
      --c-muted: #6b6b6b;
      --c-accent: #c97f4a;
      --c-accent-2: #2d4a3e;
      --c-accent-3: #d9a47e;
      --c-num: #c97f4a;
      --c-dot: #1a1a1a;
      --c-line: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e;
        --c-fg: #ededea;
        --c-muted: #999996;
        --c-accent: #e09a6a;
        --c-accent-2: #7fb09a;
        --c-accent-3: #d4a560;
        --c-num: #e09a6a;
        --c-dot: #ededea;
        --c-line: #4a4a47;
      }
    }
  </style>
  <defs>
    <pattern id="dotgrid02" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="var(--c-dot)" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="rg02a" cx="25%" cy="25%" r="60%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg02b" cx="88%" cy="78%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="var(--c-bg)"/>
  <rect width="1200" height="630" fill="url(#dotgrid02)"/>
  <rect width="1200" height="630" fill="url(#rg02a)"/>
  <rect width="1200" height="630" fill="url(#rg02b)"/>

  <!-- 화면 밖 큰 도형 -->
  <rect x="1000" y="-100" width="320" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(10 1160 60)"/>
  <circle cx="-80" cy="680" r="280" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 메인 메타포: ROAS 막대 그래프 (상승 곡선) -->
  <g transform="translate(150, 118) scale(1.28)">
    <!-- X축 기준선 -->
    <line x1="0" y1="280" x2="760" y2="280" stroke="var(--c-fg)" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- 막대들 (점진적 상승) -->
    <!-- 6개 막대, 너비 80, 간격 40 -->
    <g>
      <rect x="0" y="220" width="80" height="60" fill="var(--c-accent-3)" fill-opacity="0.6"/>
      <rect x="120" y="180" width="80" height="100" fill="var(--c-accent-3)" fill-opacity="0.7"/>
      <rect x="240" y="140" width="80" height="140" fill="var(--c-accent)" fill-opacity="0.85"/>
      <rect x="360" y="100" width="80" height="180" fill="var(--c-accent)"/>
      <rect x="480" y="60" width="80" height="220" fill="var(--c-accent-2)" fill-opacity="0.85"/>
      <rect x="600" y="40" width="80" height="240" fill="var(--c-accent-2)"/>
    </g>

    <!-- 막대 위 정점에 도트 -->
    <g fill="var(--c-fg)">
      <circle cx="40" cy="220" r="4"/>
      <circle cx="160" cy="180" r="4"/>
      <circle cx="280" cy="140" r="4"/>
      <circle cx="400" cy="100" r="4"/>
      <circle cx="520" cy="60" r="4"/>
      <circle cx="640" cy="40" r="4"/>
    </g>

    <!-- 정점을 잇는 점선 (효율 곡선) -->
    <path d="M 40 220 L 160 180 L 280 140 L 400 100 L 520 60 L 640 40"
      fill="none" stroke="var(--c-fg)" stroke-width="1.5" stroke-dasharray="5 3" stroke-opacity="0.6"/>

    <!-- 화살표 (상승 트렌드) -->
    <g transform="translate(640, 40)">
      <path d="M 0 0 L 56 -32" stroke="var(--c-accent)" stroke-width="2" stroke-linecap="round"/>
      <path d="M 40 -32 L 60 -36 L 50 -16 Z" fill="var(--c-accent)"/>
    </g>

    <!-- 작은 디테일: 마지막 막대 옆에 포커스 링 -->
    <circle cx="640" cy="40" r="22" fill="none" stroke="var(--c-accent)" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- 회전된 사각형 (장식) -->
    <rect x="-40" y="320" width="20" height="20" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" transform="rotate(15 -30 330)"/>
    <rect x="720" y="-20" width="24" height="24" fill="none" stroke="var(--c-accent)" stroke-width="1.5" transform="rotate(-12 732 -8)"/>
  </g>

  <!-- 좌상단 도트 무리 (작은 디테일) -->
  <g transform="translate(140, 130)" fill="var(--c-accent-2)">
    <circle cx="0" cy="0" r="4"/>
    <circle cx="12" cy="-6" r="4"/>
    <circle cx="6" cy="10" r="4"/>
    <circle cx="20" cy="6" r="4"/>
  </g>

  <!-- 우하단 시리즈 번호 -->
  <text x="1144" y="600" text-anchor="end"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="220" font-weight="700"
    fill="var(--c-num)" fill-opacity="0.18"
    letter-spacing="-0.04em">02</text>
</svg>
