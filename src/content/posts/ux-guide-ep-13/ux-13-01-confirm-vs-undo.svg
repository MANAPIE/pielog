<svg viewBox="0 0 500 426" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cu">
  <title id="t-cu">확인 대화상자와 되돌리기</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-cu" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-cu-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="426" />
  <text x="24" y="36" class="ttl">확인을 묻는 흐름과 되돌릴 길을 두는 흐름</text>
  <rect x="24" y="52" width="218" height="322" rx="8" class="card" stroke="var(--c-accent-2)" />
  <text x="38" y="76" class="nm">확인을 묻는 흐름</text>
  <rect x="38" y="96" width="190" height="30" rx="6" fill="var(--c-muted-soft)" />
  <text x="133.0" y="115" class="mid" text-anchor="middle">삭제 누름</text>
  <line x1="133.0" y1="128" x2="133.0" y2="140" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-cu)" />
  <rect x="38" y="144" width="190" height="30" rx="6" fill="var(--c-soft-2)" />
  <text x="133.0" y="163" class="mid" text-anchor="middle">“정말 삭제하시겠습니까?”</text>
  <line x1="133.0" y1="176" x2="133.0" y2="188" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-cu)" />
  <rect x="38" y="192" width="190" height="30" rx="6" fill="var(--c-muted-soft)" />
  <text x="133.0" y="211" class="mid" text-anchor="middle">습관적으로 “예” 누름</text>
  <line x1="133.0" y1="224" x2="133.0" y2="236" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-cu)" />
  <rect x="38" y="240" width="190" height="30" rx="6" fill="var(--c-muted-soft)" />
  <text x="133.0" y="259" class="mid" text-anchor="middle">삭제됨</text>
  <line x1="133.0" y1="272" x2="133.0" y2="284" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-cu)" />
  <rect x="38" y="288" width="190" height="30" rx="6" fill="var(--c-muted-soft)" />
  <text x="133.0" y="307" class="mid" text-anchor="middle">되돌릴 수 없음</text>
  <text x="38" y="342" class="cap" style="fill:var(--c-accent-2)">결과를 설명하지 않으면</text>
  <text x="38" y="358" class="cap" style="fill:var(--c-accent-2)">보호 효과가 없습니다.</text>
  <rect x="258" y="52" width="218" height="322" rx="8" class="card" stroke="var(--c-accent)" />
  <text x="272" y="76" class="nm">되돌릴 길을 두는 흐름</text>
  <rect x="272" y="96" width="190" height="30" rx="6" fill="var(--c-muted-soft)" />
  <text x="367.0" y="115" class="mid" text-anchor="middle">삭제 누름</text>
  <line x1="367.0" y1="128" x2="367.0" y2="140" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-cu)" />
  <rect x="272" y="144" width="190" height="30" rx="6" fill="var(--c-muted-soft)" />
  <text x="367.0" y="163" class="mid" text-anchor="middle">즉시 삭제됨</text>
  <line x1="367.0" y1="176" x2="367.0" y2="188" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-cu)" />
  <rect x="272" y="192" width="190" height="30" rx="6" fill="var(--c-soft)" />
  <text x="367.0" y="211" class="mid" text-anchor="middle">“삭제했습니다. 되돌리기” 5초</text>
  <line x1="367.0" y1="224" x2="367.0" y2="236" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-cu)" />
  <rect x="272" y="240" width="190" height="30" rx="6" fill="var(--c-muted-soft)" />
  <text x="367.0" y="259" class="mid" text-anchor="middle">되돌리기 누르면 복구</text>
  <text x="272" y="342" class="cap" style="fill:var(--c-accent)">실수한 사람만</text>
  <text x="272" y="358" class="cap" style="fill:var(--c-accent)">비용을 냅니다.</text>
  <text x="24" y="402" class="cap">확인은 되돌릴 수 없는 큰 결과 앞에서만, 구체적인 설명과 함께 씁니다.</text>
</svg>
