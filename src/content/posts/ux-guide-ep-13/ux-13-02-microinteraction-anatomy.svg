<svg viewBox="0 0 500 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-mi">
  <title id="t-mi">좋아요 버튼의 마이크로인터랙션</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-mi" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-mi-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="452" />
  <text x="24" y="36" class="ttl">좋아요 버튼을 네 부분으로 나누면</text>
  <rect x="24" y="52" width="452" height="78" rx="8" class="card" stroke="var(--c-accent)" />
  <text x="38" y="76" class="lbl" style="fill:var(--c-accent)">01</text>
  <text x="62" y="76" class="nm">트리거</text>
  <text x="38" y="98" class="cap">하트를 탭합니다.</text>
  <line x1="60" y1="132" x2="60" y2="144" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-mi)" />
  <rect x="24" y="146" width="452" height="78" rx="8" class="card" stroke="var(--c-accent-4)" stroke-dasharray="6 4" />
  <text x="38" y="170" class="lbl" style="fill:var(--c-accent-4)">02</text>
  <text x="62" y="170" class="nm">규칙</text>
  <text x="38" y="192" class="cap">안 눌림이면 추가, 눌림이면 취소,</text>
  <text x="38" y="209" class="cap">서버에 기록합니다. 사용자에게 보이지 않습니다.</text>
  <line x1="60" y1="226" x2="60" y2="238" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-mi)" />
  <rect x="24" y="240" width="452" height="78" rx="8" class="card" stroke="var(--c-accent-2)" />
  <text x="38" y="264" class="lbl" style="fill:var(--c-accent-2)">03</text>
  <text x="62" y="264" class="nm">피드백</text>
  <text x="38" y="286" class="cap">하트가 커지며 빨갛게 채워지고 숫자가 +1 됩니다.</text>
  <text x="38" y="303" class="cap">0.1초 안에 일어나야 합니다.</text>
  <line x1="60" y1="320" x2="60" y2="332" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-mi)" />
  <rect x="24" y="334" width="452" height="78" rx="8" class="card" stroke="var(--c-accent-3)" />
  <text x="38" y="358" class="lbl" style="fill:var(--c-accent-3)">04</text>
  <text x="62" y="358" class="nm">루프와 모드</text>
  <text x="38" y="380" class="cap">다시 탭하면 취소됩니다.</text>
  <text x="38" y="397" class="cap">오프라인이면 대기열에 넣습니다.</text>
  <text x="24" y="428" class="cap">피드백이 서버 응답 뒤로 미뤄지면 사용자는 버튼을 믿지 못하게 됩니다.</text>
</svg>
