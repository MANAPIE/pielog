<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" role="img" aria-labelledby="title-stg04-02">
  <title id="title-stg04-02">테스트 더블 네 가지의 비교</title>
  <style>
    svg {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-muted: #6B7280;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-accent-3: #B8CCC2;
      --c-card-bg: #F2F0E9;
      --c-card-border: rgba(91, 140, 123, 0.28);
      --c-arrow: #9CA9A4;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-muted: #94A3B8;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-accent-3: #4A6B5E;
        --c-card-bg: #1F242C;
        --c-card-border: rgba(127, 181, 160, 0.32);
        --c-arrow: #5A6670;
      }
    }

    .bg {
      fill: var(--c-bg);
    }

    .card {
      fill: var(--c-card-bg);
      stroke: var(--c-card-border);
      stroke-width: 1;
    }

    .label {
      fill: var(--c-accent-2);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 500;
    }

    .body {
      fill: var(--c-fg);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
    }

    .sub {
      fill: var(--c-muted);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
    }

    .axis-label {
      fill: var(--c-muted);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-style: italic;
    }

    .axis {
      stroke: var(--c-arrow);
      stroke-width: 1;
    }

    @media (prefers-color-scheme: dark) {
      .label {
        fill: var(--c-accent-2);
      }
    }
  </style>
  <defs>
    <marker id="arr04-02" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--c-arrow)" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
  </defs>
  <rect class="bg" width="600" height="340" />

  <!-- 상단 축 라벨 -->
  <text class="axis-label" x="60" y="40">가볍고 단순</text>
  <text class="axis-label" x="540" y="40" text-anchor="end">진짜에 가까움</text>
  <line class="axis" x1="50" y1="50" x2="550" y2="50" marker-end="url(#arr04-02)" />

  <!-- 4개 카드 -->
  <!-- Dummy -->
  <rect class="card" x="30" y="80" width="130" height="180" rx="12" />
  <text class="label" x="95" y="110" text-anchor="middle">Dummy</text>
  <line x1="50" y1="125" x2="140" y2="125" stroke="var(--c-card-border)" stroke-width="0.6" />
  <text class="body" x="40" y="148">자리 채우기용</text>
  <text class="body" x="40" y="166">객체</text>
  <text class="sub" x="40" y="190">호출되지</text>
  <text class="sub" x="40" y="204">않는다는 전제</text>
  <text class="sub" x="40" y="230">파라미터로 필요한데</text>
  <text class="sub" x="40" y="244">실제로 안 쓰일 때</text>

  <!-- Stub -->
  <rect class="card" x="170" y="80" width="130" height="180" rx="12" />
  <text class="label" x="235" y="110" text-anchor="middle">Stub</text>
  <line x1="190" y1="125" x2="280" y2="125" stroke="var(--c-card-border)" stroke-width="0.6" />
  <text class="body" x="180" y="148">정해진 응답을</text>
  <text class="body" x="180" y="166">돌려준다</text>
  <text class="sub" x="180" y="190">호출 자체는</text>
  <text class="sub" x="180" y="204">검증하지 않음</text>
  <text class="sub" x="180" y="230">"API가 이렇게</text>
  <text class="sub" x="180" y="244">응답한다 치고"</text>

  <!-- Mock -->
  <rect class="card" x="310" y="80" width="130" height="180" rx="12" />
  <text class="label" x="375" y="110" text-anchor="middle">Mock</text>
  <line x1="330" y1="125" x2="420" y2="125" stroke="var(--c-card-border)" stroke-width="0.6" />
  <text class="body" x="320" y="148">응답 + 호출</text>
  <text class="body" x="320" y="166">자체도 검증</text>
  <text class="sub" x="320" y="190">"이 함수가</text>
  <text class="sub" x="320" y="204">호출됐는가"</text>
  <text class="sub" x="320" y="230">과하게 쓰면 구현에</text>
  <text class="sub" x="320" y="244">테스트가 묶임</text>

  <!-- Fake -->
  <rect class="card" x="450" y="80" width="130" height="180" rx="12" />
  <text class="label" x="515" y="110" text-anchor="middle">Fake</text>
  <line x1="470" y1="125" x2="560" y2="125" stroke="var(--c-card-border)" stroke-width="0.6" />
  <text class="body" x="460" y="148">진짜에 가까운</text>
  <text class="body" x="460" y="166">가벼운 구현</text>
  <text class="sub" x="460" y="190">예: 인메모리 DB,</text>
  <text class="sub" x="460" y="204">sandbox 인증</text>
  <text class="sub" x="460" y="230">신뢰도가 가장 높음</text>
  <text class="sub" x="460" y="244">단, 만드는 비용이 큼</text>

  <!-- 하단 -->
  <text class="sub" x="300" y="295" text-anchor="middle">가능하면 오른쪽으로: fake나 진짜에 가까울수록 통합 문제를 더 잘 잡습니다</text>
  <text class="sub" x="300" y="315" text-anchor="middle">mock에 너무 의존하면 통합 테스트가 사실상 단위 테스트가 됩니다</text>
</svg>