<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" role="img" aria-labelledby="title-stg04-01">
  <title id="title-stg04-01">통합 테스트가 다루는 결합 지점들</title>
  <style>
    svg {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-muted: #6B7280;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-accent-3: #B8CCC2;
      --c-card-bg: #F2F0E9;
      --c-card-border: rgba(91, 140, 123, 0.28);
      --c-center-bg: #E8EEEB;
      --c-arrow: #9CA9A4;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-muted: #94A3B8;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-accent-3: #4A6B5E;
        --c-card-bg: #1F242C;
        --c-card-border: rgba(127, 181, 160, 0.32);
        --c-center-bg: #232A30;
        --c-arrow: #5A6670;
      }
    }

    .bg {
      fill: var(--c-bg);
    }

    .center-card {
      fill: var(--c-center-bg);
      stroke: var(--c-accent);
      stroke-width: 1.3;
    }

    .ext-card {
      fill: var(--c-card-bg);
      stroke: var(--c-card-border);
      stroke-width: 1;
    }

    .label {
      fill: var(--c-fg);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
    }

    .label-accent {
      fill: var(--c-accent-2);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 500;
    }

    .body {
      fill: var(--c-fg);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
    }

    .sub {
      fill: var(--c-muted);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
    }

    .arrow {
      stroke: var(--c-arrow);
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 4 3;
    }

    .boundary-label {
      fill: var(--c-accent-2);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      .label-accent {
        fill: var(--c-accent-2);
      }

      .boundary-label {
        fill: var(--c-accent-2);
      }
    }
  </style>
  <defs>
    <marker id="arr04-01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--c-arrow)" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
  </defs>
  <rect class="bg" width="600" height="380" />

  <!-- 가운데: 우리 애플리케이션 -->
  <rect class="center-card" x="220" y="150" width="160" height="80" rx="12" />
  <text class="label-accent" x="300" y="180" text-anchor="middle">우리 애플리케이션</text>
  <text class="sub" x="300" y="200" text-anchor="middle">내부 모듈들</text>
  <text class="sub" x="300" y="216" text-anchor="middle">서로 결합되어 동작</text>

  <!-- 상단: 프론트 / 백엔드 API -->
  <rect class="ext-card" x="220" y="30" width="160" height="60" rx="10" />
  <text class="label" x="300" y="55" text-anchor="middle">API 경계</text>
  <text class="sub" x="300" y="73" text-anchor="middle">프론트엔드 ↔ 백엔드</text>

  <!-- 좌측: 데이터베이스 -->
  <rect class="ext-card" x="30" y="160" width="150" height="60" rx="10" />
  <text class="label" x="105" y="185" text-anchor="middle">데이터베이스</text>
  <text class="sub" x="105" y="203" text-anchor="middle">쿼리 · 트랜잭션</text>

  <!-- 우측: 외부 서비스 -->
  <rect class="ext-card" x="420" y="160" width="150" height="60" rx="10" />
  <text class="label" x="495" y="185" text-anchor="middle">외부 서비스</text>
  <text class="sub" x="495" y="203" text-anchor="middle">결제 · 이메일 · 인증</text>

  <!-- 하단: 다른 서비스 (마이크로서비스) -->
  <rect class="ext-card" x="220" y="290" width="160" height="60" rx="10" />
  <text class="label" x="300" y="315" text-anchor="middle">다른 서비스</text>
  <text class="sub" x="300" y="333" text-anchor="middle">메시지 큐 · 마이크로서비스</text>

  <!-- 결합 화살표 (양방향) -->
  <line class="arrow" x1="300" y1="90" x2="300" y2="148" marker-start="url(#arr04-01)" marker-end="url(#arr04-01)" />
  <line class="arrow" x1="180" y1="190" x2="218" y2="190" marker-start="url(#arr04-01)" marker-end="url(#arr04-01)" />
  <line class="arrow" x1="382" y1="190" x2="418" y2="190" marker-start="url(#arr04-01)" marker-end="url(#arr04-01)" />
  <line class="arrow" x1="300" y1="232" x2="300" y2="288" marker-start="url(#arr04-01)" marker-end="url(#arr04-01)" />

  <!-- 경계 라벨 -->
  <text class="boundary-label" x="310" y="122">통합 지점</text>
  <text class="boundary-label" x="219" y="180" text-anchor="end">통합 지점</text>
  <text class="boundary-label" x="382" y="180">통합 지점</text>
  <text class="boundary-label" x="310" y="263">통합 지점</text>
</svg>