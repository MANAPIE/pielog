<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .th {
      font-size: 14px;
      font-weight: 500;
      fill: #2C2C2A;
    }

    .ts {
      font-size: 12px;
      font-weight: 400;
      fill: #5F5E5A;
    }

    .gray-bg {
      fill: #F1EFE8;
      stroke: #D3D1C7;
      stroke-width: 0.5;
    }

    .purple-bg {
      fill: #EEEDFE;
      stroke: #AFA9EC;
      stroke-width: 0.5;
    }

    .purple-th {
      fill: #3C3489;
    }

    .purple-ts {
      fill: #534AB7;
    }

    .teal-bg {
      fill: #E1F5EE;
      stroke: #5DCAA5;
      stroke-width: 0.5;
    }

    .teal-th {
      fill: #085041;
    }

    .teal-ts {
      fill: #0F6E56;
    }

    .amber-bg {
      fill: #FAEEDA;
      stroke: #FAC775;
      stroke-width: 0.5;
    }

    .amber-th {
      fill: #633806;
    }

    .amber-ts {
      fill: #854F0B;
    }

    .line {
      stroke: #B4B2A9;
      stroke-width: 0.5;
    }

    marker path {
      stroke: #B4B2A9;
    }

    @media (prefers-color-scheme: dark) {
      .th {
        fill: #D3D1C7;
      }

      .ts {
        fill: #B4B2A9;
      }

      .gray-bg {
        fill: #2C2C2A;
        stroke: #444441;
      }

      .purple-bg {
        fill: #26215C;
        stroke: #534AB7;
      }

      .purple-th {
        fill: #CECBF6;
      }

      .purple-ts {
        fill: #AFA9EC;
      }

      .teal-bg {
        fill: #04342C;
        stroke: #0F6E56;
      }

      .teal-th {
        fill: #9FE1CB;
      }

      .teal-ts {
        fill: #5DCAA5;
      }

      .amber-bg {
        fill: #412402;
        stroke: #854F0B;
      }

      .amber-th {
        fill: #FAC775;
      }

      .amber-ts {
        fill: #EF9F27;
      }

      .line {
        stroke: #5F5E5A;
      }

      marker path {
        stroke: #5F5E5A;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect class="gray-bg" x="220" y="30" width="240" height="44" rx="22" />
  <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">분류의 목적이 뭔가요?</text>

  <line x1="260" y1="74" x2="120" y2="120" class="line" marker-end="url(#arrow)" />
  <line x1="340" y1="74" x2="340" y2="120" class="line" marker-end="url(#arrow)" />
  <line x1="420" y1="74" x2="560" y2="120" class="line" marker-end="url(#arrow)" />

  <rect class="purple-bg" x="40" y="120" width="160" height="58" rx="8" />
  <text class="th purple-th" x="120" y="140" text-anchor="middle" dominant-baseline="central">교육 · 인식 제고</text>
  <text class="ts purple-ts" x="120" y="158" text-anchor="middle" dominant-baseline="central">팀 교육, 워크숍</text>

  <rect class="teal-bg" x="260" y="120" width="160" height="58" rx="8" />
  <text class="th teal-th" x="340" y="140" text-anchor="middle" dominant-baseline="central">실증 · 분석</text>
  <text class="ts teal-ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">제품 감사, 연구</text>

  <rect class="amber-bg" x="480" y="120" width="160" height="58" rx="8" />
  <text class="th amber-th" x="560" y="140" text-anchor="middle" dominant-baseline="central">규제 · 컴플라이언스</text>
  <text class="ts amber-ts" x="560" y="158" text-anchor="middle" dominant-baseline="central">법적 리스크 점검</text>

  <line x1="122" y1="176" x2="120" y2="220" class="line" marker-end="url(#arrow)" />
  <line x1="342" y1="176" x2="340" y2="220" class="line" marker-end="url(#arrow)" />
  <line x1="562" y1="176" x2="560" y2="220" class="line" marker-end="url(#arrow)" />

  <rect class="purple-bg" x="40" y="220" width="160" height="130" rx="8" />
  <text class="th purple-th" x="120" y="244" text-anchor="middle" dominant-baseline="central">Brignull 12유형</text>
  <text class="ts purple-ts" x="120" y="270" text-anchor="middle" dominant-baseline="central">직관적 명명</text>
  <text class="ts purple-ts" x="120" y="288" text-anchor="middle" dominant-baseline="central">넓은 적용 범위</text>
  <text class="ts purple-ts" x="120" y="306" text-anchor="middle" dominant-baseline="central">커뮤니케이션 용이</text>
  <text class="ts purple-ts" x="120" y="324" text-anchor="middle" dominant-baseline="central">출발점으로 최적</text>

  <rect class="teal-bg" x="260" y="220" width="160" height="130" rx="8" />
  <text class="th teal-th" x="340" y="244" text-anchor="middle" dominant-baseline="central">Mathur 7범주</text>
  <text class="ts teal-ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">실증 데이터 기반</text>
  <text class="ts teal-ts" x="340" y="288" text-anchor="middle" dominant-baseline="central">이커머스 특화</text>
  <text class="ts teal-ts" x="340" y="306" text-anchor="middle" dominant-baseline="central">작동 메커니즘 분류</text>
  <text class="ts teal-ts" x="340" y="324" text-anchor="middle" dominant-baseline="central">심층 분석에 적합</text>

  <rect class="amber-bg" x="480" y="220" width="160" height="130" rx="8" />
  <text class="th amber-th" x="560" y="244" text-anchor="middle" dominant-baseline="central">공정위 6유형</text>
  <text class="ts amber-ts" x="560" y="270" text-anchor="middle" dominant-baseline="central">법적 구속력</text>
  <text class="ts amber-ts" x="560" y="288" text-anchor="middle" dominant-baseline="central">한국 시장 기준</text>
  <text class="ts amber-ts" x="560" y="306" text-anchor="middle" dominant-baseline="central">시정명령 판단 기준</text>
  <text class="ts amber-ts" x="560" y="324" text-anchor="middle" dominant-baseline="central">컴플라이언스 필수</text>

  <rect class="gray-bg" x="40" y="370" width="600" height="36" rx="8" />
  <text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central">실무에서는 하나만 쓰지 않는다: 교육은 Brignull로,
    분석은 Mathur로, 보고는 공정위 기준으로</text>
</svg>