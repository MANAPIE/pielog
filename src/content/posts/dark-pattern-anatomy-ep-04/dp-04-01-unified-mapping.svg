    <text class="chip-teal-tx" x="187" y="116" text-anchor="middle" font-size="9">Sneaking</text>
    <text class="t-secondary" x="156" y="138" font-size="10">Hidden Costs</text>

    <rect class="chip-amber-bg" x="304" y="105" width="100" height="16" rx="3" />
    <text class="chip-amber-tx" x="354" y="116" text-anchor="middle" font-size="9">순차공개 가격책정</text>

    <text class="match-full" x="452" y="116" font-size="10">3자 일치</text>

    <rect class="chip-red-bg" x="562" y="105" width="44" height="14" rx="3" />
    <text class="chip-red-tx" x="584" y="115" text-anchor="middle" font-size="8">법 금지</text>
    <text class="t-tertiary" x="562" y="134" font-size="9">2025.8 단속 시작</text>

    <line class="row-line" x1="20" y1="152" x2="664" y2="152" />
  </g>

  <!-- ============================================
       Row 2: Sneak into basket (y=152~212)
       ============================================ -->
  <g>
    <text class="t-primary" x="28" y="176" font-size="11" font-weight="500">Sneak into basket</text>

    <rect class="chip-teal-bg" x="156" y="165" width="62" height="16" rx="3" />
    <text class="chip-teal-tx" x="187" y="176" text-anchor="middle" font-size="9">Sneaking</text>
