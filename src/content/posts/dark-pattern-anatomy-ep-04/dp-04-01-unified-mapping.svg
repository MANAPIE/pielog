    <rect class="chip-amber-bg" x="304" y="165" width="106" height="16" rx="3" />
    <text class="chip-amber-tx" x="357" y="176" text-anchor="middle" font-size="9">특정옵션 사전선택</text>

    <text class="match-full" x="452" y="176" font-size="10">3자 일치</text>

    <rect class="chip-red-bg" x="562" y="165" width="44" height="14" rx="3" />
    <text class="chip-red-tx" x="584" y="175" text-anchor="middle" font-size="8">법 금지</text>

    <line class="row-line" x1="20" y1="212" x2="664" y2="212" />
  </g>

  <!-- ============================================
       Row 3: Forced continuity (y=212~272)
       ============================================ -->
  <g>
    <text class="t-primary" x="28" y="236" font-size="11" font-weight="500">Forced continuity</text>

    <rect class="chip-teal-bg" x="156" y="225" width="62" height="16" rx="3" />
    <text class="chip-teal-tx" x="187" y="236" text-anchor="middle" font-size="9">Sneaking</text>
    <text class="t-secondary" x="156" y="258" font-size="10">Hidden Subscription</text>

    <rect class="chip-amber-bg" x="304" y="225" width="80" height="16" rx="3" />
    <text class="chip-amber-tx" x="344" y="236" text-anchor="middle" font-size="9">숨은 갱신</text>

