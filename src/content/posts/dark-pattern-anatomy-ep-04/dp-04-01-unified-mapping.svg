    <text class="match-partial" x="452" y="426" font-size="10">일치</text>

    <text class="t-tertiary" x="562" y="416" font-size="9">가이드라인 수준</text>

    <line class="row-line" x1="20" y1="452" x2="664" y2="452" />
  </g>

  <!-- ============================================
       Row 7: Trick questions (y=452~512)
       ============================================ -->
  <g>
    <text class="t-primary" x="28" y="476" font-size="11" font-weight="500">Trick questions</text>

    <rect class="chip-teal-bg" x="156" y="465" width="78" height="16" rx="3" />
    <text class="chip-teal-tx" x="195" y="476" text-anchor="middle" font-size="9">Misdirection</text>
