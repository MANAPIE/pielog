    <text class="match-none" x="452" y="596" font-size="10">Brignull 단독</text>

    <text class="t-tertiary" x="562" y="596" font-size="9">표시광고법 적용</text>

    <line class="row-line" x1="20" y1="632" x2="664" y2="632" />
  </g>

