    <text class="chip-amber-tx" x="353" y="356" text-anchor="middle" font-size="9">잘못된 계층구조</text>

    <text class="match-full" x="452" y="356" font-size="10">3자 일치</text>

    <rect class="chip-red-bg" x="562" y="345" width="44" height="14" rx="3" />
    <text class="chip-red-tx" x="584" y="355" text-anchor="middle" font-size="8">법 금지</text>

    <line class="row-line" x1="20" y1="392" x2="664" y2="392" />
  </g>

