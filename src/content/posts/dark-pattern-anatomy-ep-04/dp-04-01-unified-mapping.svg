<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 870"
  font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Brignull × Mathur × 공정위 통합 매핑표</title>
  <desc>다크패턴 3대 분류 체계(Brignull 12유형, Mathur 7범주 15유형, 공정위 6유형)의 매핑 관계와 규제 상태를 정리한 매트릭스</desc>

  <defs>
    <style>
      .bg {
        fill: #FAFAF7;
      }

      .panel-bg {
        fill: #F1EFE8;
      }

      .t-primary {
        fill: #1F1E1C;
      }

      .t-secondary {
        fill: #5F5E5A;
      }

      .t-tertiary {
        fill: #8B8A85;
      }

      .header-line {
        stroke: #5F5E5A;
        stroke-width: 1.2;
      }

      .row-line {
        stroke: #D3D1C7;
        stroke-width: 0.5;
      }

      /* Chips */
      .chip-purple-bg {
        fill: #EEEDFE;
      }

      .chip-purple-tx {
        fill: #3C3489;
        font-weight: 500;
      }

      .chip-teal-bg {
        fill: #E1F5EE;
      }

      .chip-teal-tx {
        fill: #085041;
        font-weight: 500;
      }

      .chip-amber-bg {
        fill: #FAEEDA;
      }

      .chip-amber-tx {
        fill: #633806;
        font-weight: 500;
      }

      .chip-red-bg {
        fill: #FCEBEB;
      }

      .chip-red-tx {
        fill: #791F1F;
        font-weight: 500;
      }

      /* Match status */
      .match-full {
        fill: #0F6E56;
        font-weight: 500;
      }

      .match-partial {
        fill: #854F0B;
      }

      .match-none {
        fill: #8B8A85;
      }

      @media (prefers-color-scheme: dark) {
        .bg {
          fill: #1A1A18;
        }

        .panel-bg {
          fill: #222220;
        }

        .t-primary {
          fill: #E8E7E2;
        }

        .t-secondary {
          fill: #B4B2A9;
        }

        .t-tertiary {
          fill: #888780;
        }

        .header-line {
          stroke: #B4B2A9;
        }

        .row-line {
          stroke: #444441;
        }

        .chip-purple-bg {
          fill: #26215C;
        }

        .chip-purple-tx {
          fill: #CECBF6;
        }

        .chip-teal-bg {
          fill: #04342C;
        }

        .chip-teal-tx {
          fill: #9FE1CB;
        }

        .chip-amber-bg {
          fill: #412402;
        }

        .chip-amber-tx {
          fill: #FAC775;
        }

        .chip-red-bg {
          fill: #501313;
        }

        .chip-red-tx {
          fill: #F7C1C1;
        }

        .match-full {
          fill: #5DCAA5;
        }

        .match-partial {
          fill: #EF9F27;
        }

        .match-none {
          fill: #888780;
        }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="870" />

  <!-- ============================================
       TITLE & 분류 체계 범례
       ============================================ -->
  <text class="t-primary" x="22" y="18" font-size="13" font-weight="500">Brignull × Mathur × 공정위 통합 매핑</text>

  <g transform="translate(20, 32)">
    <!-- Brignull -->
    <rect class="chip-purple-bg" x="0" y="0" width="62" height="16" rx="3" />
    <text class="chip-purple-tx" x="31" y="11" text-anchor="middle" font-size="9">Brignull</text>
    <text class="t-tertiary" x="68" y="11" font-size="10">12유형 (2010)</text>

    <!-- Mathur -->
    <rect class="chip-teal-bg" x="170" y="0" width="56" height="16" rx="3" />
    <text class="chip-teal-tx" x="198" y="11" text-anchor="middle" font-size="9">Mathur</text>
    <text class="t-tertiary" x="232" y="11" font-size="10">7범주 15유형 (2019)</text>

    <!-- 공정위 -->
    <rect class="chip-amber-bg" x="378" y="0" width="48" height="16" rx="3" />
    <text class="chip-amber-tx" x="402" y="11" text-anchor="middle" font-size="9">공정위</text>
    <text class="t-tertiary" x="432" y="11" font-size="10">6유형 (2025 시행)</text>
  </g>

