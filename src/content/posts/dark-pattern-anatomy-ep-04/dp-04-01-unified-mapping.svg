         Col3 공정위:        x=296, w=148  (right=444)
         Col4 매핑관계:      x=444, w=110  (right=554)
         Col5 규제상태:      x=554, w=110  (right=664)
       Headers at y=82
       Header line at y=92
       Data rows from y=92, height=58 each
       ============================================ -->

  <!-- Headers -->
  <g>
    <text class="t-primary" x="28" y="82" font-size="12" font-weight="500">Brignull 유형</text>
    <text class="t-primary" x="156" y="82" font-size="12" font-weight="500">Mathur 범주/유형</text>
    <text class="t-primary" x="304" y="82" font-size="12" font-weight="500">공정위 유형</text>
    <text class="t-primary" x="452" y="82" font-size="12" font-weight="500">매핑 관계</text>
    <text class="t-primary" x="562" y="82" font-size="12" font-weight="500">규제 상태</text>
    <line class="header-line" x1="20" y1="92" x2="664" y2="92" />
  </g>

  <!-- ============================================
       Row 1: Hidden costs (y=92~152)
