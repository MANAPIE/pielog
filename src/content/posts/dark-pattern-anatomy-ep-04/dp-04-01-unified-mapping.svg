    <text class="t-secondary" x="156" y="558" font-size="10">Forced Enrollment</text>

    <rect class="chip-amber-bg" x="304" y="525" width="106" height="16" rx="3" />
    <text class="chip-amber-tx" x="357" y="536" text-anchor="middle" font-size="9">특정옵션 사전선택</text>
    <text class="t-tertiary" x="304" y="556" font-size="9">(부분)</text>

    <text class="match-partial" x="452" y="536" font-size="10">부분 일치</text>

    <rect class="chip-red-bg" x="562" y="525" width="44" height="14" rx="3" />
    <text class="chip-red-tx" x="584" y="535" text-anchor="middle" font-size="8">법 금지</text>
    <text class="t-tertiary" x="562" y="554" font-size="9">(사전선택 부분)</text>

