    <text class="match-full" x="452" y="296" font-size="10">3자 일치</text>

    <rect class="chip-red-bg" x="562" y="285" width="44" height="14" rx="3" />
    <text class="chip-red-tx" x="584" y="295" text-anchor="middle" font-size="8">법 금지</text>
    <text class="t-tertiary" x="562" y="314" font-size="9">시정명령 최다</text>

