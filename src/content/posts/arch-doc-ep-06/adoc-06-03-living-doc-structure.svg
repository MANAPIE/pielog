<svg viewBox="0 0 760 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="내부 공유용 정의서의 최종 구조와 항목별 출처, CI 검증 게이트">
  <style>
    :root{
      --c-bg:#f5f4ef; --c-fg:#1f1d14; --c-muted:#6b6553; --c-line:#cfccbf;
      --c-accent:#C29A1F; --c-accent-2:#5E6E7E; --c-accent-3:#D9C77E;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --c-bg:#14110a; --c-fg:#eae7dd; --c-muted:#a39f8c; --c-line:#38352a;
        --c-accent:#D6B23A; --c-accent-2:#9AA6B4; --c-accent-3:#6E5F2A;
      }
    }
    text{font-family:'Pretendard',system-ui,sans-serif;fill:var(--c-fg);}
    .hd{font-size:12px;font-weight:700;fill:var(--c-muted);}
    .ix{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;fill:var(--c-accent);}
    .sec{font-size:12.5px;font-weight:700;}
    .pill{font-size:10px;font-weight:700;}
    .lg{font-size:10.5px;fill:var(--c-muted);}
    .ci{font-size:11.5px;}
  </style>
  <rect x="0" y="0" width="760" height="432" fill="var(--c-bg)"/>

  <!-- doc card -->
  <rect x="30" y="20" width="700" height="296" rx="12" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2"/>
  <text class="hd" x="48" y="44">내부 공유용 정의서 · 한 저장소 안에 코드와 함께</text>
  <line x1="48" y1="54" x2="712" y2="54" stroke="var(--c-line)" stroke-width="1"/>

  <!-- rows: y = 78,112,146,180,214,248,282 -->
  <!-- pill helper: 손=accent, 코드그림=accent-3, 생성·링크=accent-2 -->
  <g>
    <text class="ix" x="48" y="84">1</text><text class="sec" x="72" y="84">목표와 드라이버</text>
    <rect x="588" y="70" width="124" height="20" rx="10" fill="var(--c-accent)" fill-opacity="0.16" stroke="var(--c-accent)" stroke-width="1.3"/><text class="pill" x="650" y="84" text-anchor="middle" fill="var(--c-fg)">손 · 안정</text>

    <text class="ix" x="48" y="118">2</text><text class="sec" x="72" y="118">시스템 경계 (C4 L1)</text>
    <rect x="588" y="104" width="124" height="20" rx="10" fill="var(--c-accent)" fill-opacity="0.16" stroke="var(--c-accent)" stroke-width="1.3"/><text class="pill" x="650" y="118" text-anchor="middle" fill="var(--c-fg)">손 · 안정</text>

    <text class="ix" x="48" y="152">3</text><text class="sec" x="72" y="152">컨테이너 · 컴포넌트 뷰</text>
    <rect x="588" y="138" width="124" height="20" rx="10" fill="var(--c-accent-3)" fill-opacity="0.22" stroke="var(--c-accent-3)" stroke-width="1.3"/><text class="pill" x="650" y="152" text-anchor="middle" fill="var(--c-fg)">코드로 그림</text>

    <text class="ix" x="48" y="186">4</text><text class="sec" x="72" y="186">런타임 뷰</text>
    <rect x="588" y="172" width="124" height="20" rx="10" fill="var(--c-accent-3)" fill-opacity="0.22" stroke="var(--c-accent-3)" stroke-width="1.3"/><text class="pill" x="650" y="186" text-anchor="middle" fill="var(--c-fg)">코드로 그림</text>

    <text class="ix" x="48" y="220">5</text><text class="sec" x="72" y="220">결정 로그 (ADR · append-only)</text>
    <rect x="588" y="206" width="124" height="20" rx="10" fill="var(--c-accent-2)" fill-opacity="0.18" stroke="var(--c-accent-2)" stroke-width="1.3"/><text class="pill" x="650" y="220" text-anchor="middle" fill="var(--c-fg)">누적 로그</text>

    <text class="ix" x="48" y="254">6</text><text class="sec" x="72" y="254">횡단 정책</text>
    <rect x="588" y="240" width="124" height="20" rx="10" fill="var(--c-accent)" fill-opacity="0.16" stroke="var(--c-accent)" stroke-width="1.3"/><text class="pill" x="650" y="254" text-anchor="middle" fill="var(--c-fg)">손 · 안정</text>

    <text class="ix" x="48" y="288">7</text><text class="sec" x="72" y="288">휘발 자료 (API · 스키마 · 의존성)</text>
    <rect x="588" y="274" width="124" height="20" rx="10" fill="var(--c-accent-2)" fill-opacity="0.18" stroke="var(--c-accent-2)" stroke-width="1.3"/><text class="pill" x="650" y="288" text-anchor="middle" fill="var(--c-fg)">생성 · 링크</text>
  </g>

  <!-- CI gate -->
  <rect x="30" y="330" width="700" height="62" rx="12" fill="var(--c-accent)" fill-opacity="0.10" stroke="var(--c-accent)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text class="sec" x="48" y="356" fill="var(--c-accent)">CI 검증 게이트 · PR마다 자동 실행</text>
  <g class="ci" fill="var(--c-muted)">
    <text x="48" y="378">다이어그램 빌드 성공</text>
    <text x="230" y="378">· 끊긴 링크 0건</text>
    <text x="372" y="378">· ADR 형식 통과</text>
    <text x="512" y="378">→ 통과해야 머지된다</text>
  </g>

  <!-- legend -->
  <g transform="translate(30,414)">
    <rect x="0" y="-10" width="13" height="13" rx="3" fill="var(--c-accent)"/><text class="lg" x="18" y="1">손 · 안정</text>
    <rect x="120" y="-10" width="13" height="13" rx="3" fill="var(--c-accent-3)"/><text class="lg" x="138" y="1">코드로 그림</text>
    <rect x="260" y="-10" width="13" height="13" rx="3" fill="var(--c-accent-2)"/><text class="lg" x="278" y="1">생성 · 링크 / 누적 로그</text>
  </g>
</svg>
