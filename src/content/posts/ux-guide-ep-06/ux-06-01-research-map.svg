<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-rm">
  <title id="t-rm">리서치 방법의 두 축</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-rm" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-rm-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="420" />
  <text x="266" y="34" class="th" text-anchor="middle">정성 · 왜</text>
  <text x="266" y="376" class="th" text-anchor="middle">정량 · 얼마나</text>
  <text x="40" y="206" class="th" text-anchor="middle" transform="rotate(-90 40 206)">태도 · 말하는 것</text>
  <text x="486" y="206" class="th" text-anchor="middle" transform="rotate(90 486 206)">행동 · 하는 것</text>
  <line x1="266" y1="44" x2="266" y2="366" stroke="var(--c-fg)" stroke-width="1.2" />
  <line x1="56" y1="205" x2="476" y2="205" stroke="var(--c-fg)" stroke-width="1.2" />
  <rect x="60" y="52" width="200" height="145" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
  <rect x="80" y="80" width="160" height="36" rx="6" class="card" stroke="var(--c-accent-3)" />
  <text x="160" y="103" class="nm" text-anchor="middle">심층 인터뷰</text>
  <rect x="80" y="132" width="160" height="36" rx="6" class="card" stroke="var(--c-accent-3)" />
  <text x="160" y="155" class="nm" text-anchor="middle">포커스 그룹</text>
  <rect x="272" y="52" width="200" height="145" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
  <rect x="292" y="80" width="160" height="36" rx="6" class="card" stroke="var(--c-accent)" />
  <text x="372" y="103" class="nm" text-anchor="middle">사용성 테스트</text>
  <rect x="292" y="132" width="160" height="36" rx="6" class="card" stroke="var(--c-accent)" />
  <text x="372" y="155" class="nm" text-anchor="middle">현장 관찰</text>
  <rect x="60" y="213" width="200" height="145" rx="8" fill="var(--c-soft-4)" stroke="var(--c-accent-4)" stroke-width="1.6" />
  <rect x="80" y="241" width="160" height="36" rx="6" class="card" stroke="var(--c-accent-4)" />
  <text x="160" y="264" class="nm" text-anchor="middle">설문 조사</text>
  <rect x="80" y="293" width="160" height="36" rx="6" class="card" stroke="var(--c-accent-4)" />
  <text x="160" y="316" class="nm" text-anchor="middle">카드 소팅</text>
  <rect x="272" y="213" width="200" height="145" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
  <rect x="292" y="241" width="160" height="36" rx="6" class="card" stroke="var(--c-accent-2)" />
  <text x="372" y="264" class="nm" text-anchor="middle">로그 분석</text>
  <rect x="292" y="293" width="160" height="36" rx="6" class="card" stroke="var(--c-accent-2)" />
  <text x="372" y="316" class="nm" text-anchor="middle">A/B 테스트</text>
  <text x="24" y="404" class="cap">출처: Rohrer(2022). 말과 행동은 다를 수 있으므로 태도 방법과 행동 방법을 병행합니다.</text>
</svg>
