<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>한국 다크패턴 규제 타임라인 (2023~2026)</title>
<desc>2023년 가이드라인 제정부터 2025년 법 시행, 첫 제재까지의 국내 다크패턴 규제 발전 과정</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #B4B2A9; stroke-width: 0.5; fill: none; }
  .c-purple rect { fill: #EEEDFE; stroke: #AFA9EC; }
  .c-purple text { fill: #3C3489; }
  .c-teal rect { fill: #E1F5EE; stroke: #5DCAA5; }
  .c-teal text { fill: #085041; }
  .c-red rect { fill: #FCEBEB; stroke: #F09595; }
  .c-red text { fill: #791F1F; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #D3D1C7; }
    .ts { fill: #B4B2A9; }
    .arr { stroke: #5F5E5A; }
    .c-purple rect { fill: #26215C; stroke: #534AB7; }
    .c-purple text { fill: #CECBF6; }
    .c-teal rect { fill: #04342C; stroke: #0F6E56; }
    .c-teal text { fill: #9FE1CB; }
    .c-red rect { fill: #501313; stroke: #A32D2D; }
    .c-red text { fill: #F7C1C1; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Timeline axis -->
<line x1="60" y1="160" x2="620" y2="160" class="arr" marker-end="url(#arrow)"/>

<!-- 2023.4 -->
<circle cx="120" cy="160" r="5" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
<line x1="120" y1="155" x2="120" y2="60" stroke="#AFA9EC" stroke-width="0.5"/>
<g class="c-purple"><rect x="50" y="24" width="140" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="120" y="42" text-anchor="middle" dominant-baseline="central">정책방향 발표</text></g>
<text class="ts" x="120" y="180" text-anchor="middle" dominant-baseline="central">2023.4</text>

<!-- 2023.7 -->
<circle cx="200" cy="160" r="5" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
<line x1="200" y1="165" x2="200" y2="240" stroke="#AFA9EC" stroke-width="0.5"/>
<g class="c-purple"><rect x="120" y="244" width="160" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="200" y="262" text-anchor="middle" dominant-baseline="central">자율관리 가이드라인</text></g>
<text class="ts" x="200" y="180" text-anchor="middle" dominant-baseline="central">2023.7</text>

<!-- 2024.2 -->
<circle cx="300" cy="160" r="5" fill="#5DCAA5" stroke="#0F6E56" stroke-width="1"/>
<line x1="300" y1="155" x2="300" y2="80" stroke="#5DCAA5" stroke-width="0.5"/>
<g class="c-teal"><rect x="225" y="44" width="150" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="300" y="62" text-anchor="middle" dominant-baseline="central">전자상거래법 개정</text></g>
<text class="ts" x="300" y="180" text-anchor="middle" dominant-baseline="central">2024.2</text>

<!-- 2025.2 -->
<circle cx="420" cy="160" r="6" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.5"/>
<line x1="420" y1="165" x2="420" y2="240" stroke="#F09595" stroke-width="0.5"/>
<g class="c-red"><rect x="340" y="244" width="160" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="420" y="262" text-anchor="middle" dominant-baseline="central">6유형 법적 금지 시행</text></g>
<text class="ts" x="420" y="180" text-anchor="middle" dominant-baseline="central">2025.2</text>

<!-- 2025.10 -->
<circle cx="530" cy="160" r="6" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.5"/>
<line x1="530" y1="155" x2="530" y2="80" stroke="#F09595" stroke-width="0.5"/>
<g class="c-red"><rect x="450" y="44" width="160" height="48" rx="6" stroke-width="0.5"/>
<text class="ts" x="530" y="60" text-anchor="middle" dominant-baseline="central">소비자보호 지침 시행</text>
<text class="ts" x="530" y="77" text-anchor="middle" dominant-baseline="central">첫 시정명령 발동</text></g>
<text class="ts" x="530" y="180" text-anchor="middle" dominant-baseline="central">2025.10</text>

<!-- Legend -->
<g class="c-purple"><rect x="60" y="314" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="78" y="320" dominant-baseline="central">가이드라인 (구속력 없음)</text>
<g class="c-teal"><rect x="240" y="314" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="258" y="320" dominant-baseline="central">입법</text>
<g class="c-red"><rect x="360" y="314" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="378" y="320" dominant-baseline="central">법 시행·집행</text>
</svg>
