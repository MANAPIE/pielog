<svg viewBox="0 0 1200 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-fb">
  <title id="title-fb">필터 빌더 UX와 Builder 패턴의 대응</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-line: #1A1F2E;
        --c-card: #FFFFFF; --c-soft: rgba(74,95,217,0.08);
        --c-soft-2: rgba(217,119,87,0.10); --c-divider: rgba(26,31,46,0.15);
        --c-chip: rgba(74,95,217,0.16);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-line: #E8E6E1;
          --c-card: #161B22; --c-soft: rgba(141,160,255,0.14);
          --c-soft-2: rgba(232,147,118,0.14); --c-divider: rgba(232,230,225,0.18);
          --c-chip: rgba(141,160,255,0.22);
        }
      }
      .bg { fill: var(--c-bg); }
      .pane-ux { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 1.2; stroke-dasharray: 4 3; }
      .pane-code { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.2; stroke-dasharray: 4 3; }
      .box { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.3; }
      .chip { fill: var(--c-chip); stroke: var(--c-accent); stroke-width: 1; }
      .line { stroke: var(--c-line); stroke-width: 1.2; fill: none; }
      .line-map { stroke: var(--c-muted); stroke-width: 1.4; fill: none; stroke-dasharray: 2 5; }
      .pane-label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; }
      .pane-title { font-family: 'Inter', system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: var(--c-fg); letter-spacing: -0.01em; }
      .step-num { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.1em; }
      .step-title { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 13px; font-weight: 700; fill: var(--c-fg); }
      .step-desc { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-muted); }
      .call { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; fill: var(--c-fg); font-weight: 600; }
      .call-accent { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; fill: var(--c-accent); font-weight: 700; }
      .chip-text { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-accent); font-weight: 600; }
      .map-label { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; font-weight: 600; fill: var(--c-muted); }
    </style>
    <marker id="arr-fb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-line)"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="580"/>

  <!-- ===== 좌: UX ===== -->
  <g transform="translate(40 30)">
    <rect class="pane-ux" width="540" height="520" rx="8"/>
    <text x="24" y="32" class="pane-label" fill="var(--c-accent-2)">USER INTERFACE</text>
    <text x="24" y="58" class="pane-title">검색 필터의 단계적 조작</text>

    <!-- Step 1: 카테고리 -->
    <g transform="translate(24 90)">
      <rect width="492" height="80" rx="6" class="box"/>
      <text x="16" y="24" class="step-num">STEP 1</text>
      <text x="16" y="44" class="step-title">카테고리 선택</text>
      <text x="16" y="62" class="step-desc">사용자가 칩을 탭하여 카테고리를 고릅니다</text>
      <!-- 칩 -->
      <rect x="320" y="22" width="68" height="22" rx="11" class="chip"/>
      <text x="354" y="37" class="chip-text" text-anchor="middle">의류</text>
      <rect x="394" y="22" width="68" height="22" rx="11" class="chip"/>
      <text x="428" y="37" class="chip-text" text-anchor="middle">가전</text>
    </g>

    <!-- Step 2: 가격 -->
    <g transform="translate(24 184)">
      <rect width="492" height="80" rx="6" class="box"/>
      <text x="16" y="24" class="step-num">STEP 2</text>
      <text x="16" y="44" class="step-title">가격 범위</text>
      <text x="16" y="62" class="step-desc">슬라이더 두 핸들로 최소-최대를 지정합니다</text>
      <!-- 슬라이더 -->
      <line x1="320" y1="38" x2="470" y2="38" stroke="var(--c-divider)" stroke-width="3" stroke-linecap="round"/>
      <line x1="345" y1="38" x2="430" y2="38" stroke="var(--c-accent-2)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="345" cy="38" r="6" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2"/>
      <circle cx="430" cy="38" r="6" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2"/>
    </g>

    <!-- Step 3: 정렬 -->
    <g transform="translate(24 278)">
      <rect width="492" height="80" rx="6" class="box"/>
      <text x="16" y="24" class="step-num">STEP 3</text>
      <text x="16" y="44" class="step-title">정렬 기준</text>
      <text x="16" y="62" class="step-desc">드롭다운으로 정렬 옵션을 변경합니다</text>
      <!-- 드롭다운 -->
      <rect x="320" y="22" width="152" height="28" rx="4" class="box"/>
      <text x="332" y="40" class="step-desc" fill="var(--c-fg)">최신순</text>
      <polyline points="446,32 452,40 458,32" fill="none" stroke="var(--c-muted)" stroke-width="1.5"/>
    </g>

    <!-- Step 4: build() -->
    <g transform="translate(24 372)">
      <rect width="492" height="80" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2"/>
      <text x="16" y="24" class="step-num" fill="var(--c-accent-2)">STEP 4: BUILD</text>
      <text x="16" y="44" class="step-title">결과 보기</text>
      <text x="16" y="62" class="step-desc">버튼을 누르면 최종 쿼리가 만들어집니다</text>
      <!-- 버튼 -->
      <rect x="350" y="22" width="120" height="36" rx="6" fill="var(--c-accent-2)"/>
      <text x="410" y="45" font-family="Inter,system-ui" font-size="13" font-weight="700" fill="var(--c-bg)" text-anchor="middle">결과 보기 →</text>
    </g>

    <!-- 누적 칩 표시 -->
    <g transform="translate(24 488)">
      <text x="0" y="0" class="step-desc">누적 선택:</text>
      <rect x="70" y="-13" width="58" height="20" rx="10" class="chip"/>
      <text x="99" y="1" class="chip-text" text-anchor="middle">의류</text>
      <rect x="134" y="-13" width="96" height="20" rx="10" class="chip"/>
      <text x="182" y="1" class="chip-text" text-anchor="middle">₩10–50K</text>
      <rect x="236" y="-13" width="68" height="20" rx="10" class="chip"/>
      <text x="270" y="1" class="chip-text" text-anchor="middle">최신순</text>
    </g>
  </g>

  <!-- ===== 우: BUILDER ===== -->
  <g transform="translate(620 30)">
    <rect class="pane-code" width="540" height="520" rx="8"/>
    <text x="24" y="32" class="pane-label" fill="var(--c-accent)">QUERY BUILDER</text>
    <text x="24" y="58" class="pane-title">queryBuilder의 set / build</text>

    <!-- Step 1 호출 -->
    <g transform="translate(24 90)">
      <rect width="492" height="80" rx="6" class="box"/>
      <text x="16" y="28" class="call">queryBuilder</text>
      <text x="16" y="50" class="call-accent">  .setCategory(<tspan class="call">'clothing'</tspan>)</text>
      <text x="16" y="70" class="step-desc">→ 카테고리 필드가 채워집니다</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(24 184)">
      <rect width="492" height="80" rx="6" class="box"/>
      <text x="16" y="32" class="call-accent">  .setPriceRange(<tspan class="call">10000, 50000</tspan>)</text>
      <text x="16" y="62" class="step-desc">→ min과 max가 동시에 채워집니다</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(24 278)">
      <rect width="492" height="80" rx="6" class="box"/>
      <text x="16" y="32" class="call-accent">  .setSortBy(<tspan class="call">'createdAt:desc'</tspan>)</text>
      <text x="16" y="62" class="step-desc">→ 정렬 기준 필드가 갱신됩니다</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(24 372)">
      <rect width="492" height="80" rx="6" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2"/>
      <text x="16" y="32" class="call-accent" font-weight="700">  .build()</text>
      <text x="16" y="62" class="step-desc">→ 최종 Query 객체가 반환됩니다</text>
    </g>

    <!-- 최종 Query 객체 -->
    <g transform="translate(24 488)">
      <text x="0" y="0" class="step-desc">최종:</text>
      <text x="42" y="0" class="call" fill="var(--c-accent)">Query {`{`} category, priceRange, sortBy {`}`}</text>
    </g>
  </g>

  <!-- ===== 대응선 ===== -->
  <g>
    <path d="M 580 130 Q 600 130 620 130" class="line-map"/>
    <path d="M 580 224 Q 600 224 620 224" class="line-map"/>
    <path d="M 580 318 Q 600 318 620 318" class="line-map"/>
    <path d="M 580 412 Q 600 412 620 412" class="line-map"/>
  </g>
</svg>
