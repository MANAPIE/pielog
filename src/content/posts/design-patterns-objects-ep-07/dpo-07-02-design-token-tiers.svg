<svg viewBox="0 0 1200 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-tk">
  <title id="title-tk">디자인 토큰의 3계층 — primitive, semantic, component</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(74,95,217,0.08); --c-soft-2: rgba(217,119,87,0.10);
        --c-soft-3: rgba(139,122,184,0.12); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(141,160,255,0.14); --c-soft-2: rgba(232,147,118,0.14);
          --c-soft-3: rgba(176,160,218,0.16); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .col-prim { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.4; stroke-dasharray: 4 3; }
      .col-sem { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 1.4; stroke-dasharray: 4 3; }
      .col-comp { fill: var(--c-soft-3); stroke: var(--c-accent-3); stroke-width: 1.4; stroke-dasharray: 4 3; }
      .token { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.2; }
      .line-ref { stroke: var(--c-line); stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
      .col-num { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; }
      .col-title { font-family: 'Inter',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); letter-spacing: -0.01em; }
      .col-cap { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-muted); }
      .tname { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; fill: var(--c-fg); font-weight: 600; }
      .tval { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10.5px; fill: var(--c-muted); }
      .swatch-stroke { stroke: var(--c-divider); stroke-width: 1; }
    </style>
    <marker id="ar-t" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-line)"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="580"/>

  <!-- 상단 라벨 -->
  <text x="60" y="32" class="col-title">Component → Semantic → Primitive 참조 체인</text>

  <!-- ===== 컬럼 1: Primitive ===== -->
  <g transform="translate(40 70)">
    <rect class="col-prim" width="340" height="440" rx="8"/>
    <text x="20" y="32" class="col-num" fill="var(--c-accent)">TIER 1</text>
    <text x="20" y="54" class="col-title">Primitive</text>
    <text x="20" y="74" class="col-cap">절대값 — 거의 변하지 않음</text>

    <!-- 색 토큰들 -->
    <g transform="translate(20 100)">
      <rect width="300" height="60" rx="4" class="token"/>
      <rect x="12" y="14" width="32" height="32" rx="3" fill="#EFF6FF" class="swatch-stroke"/>
      <text x="56" y="28" class="tname">blue.50</text>
      <text x="56" y="44" class="tval">#EFF6FF</text>
    </g>

    <g transform="translate(20 170)">
      <rect width="300" height="60" rx="4" class="token"/>
      <rect x="12" y="14" width="32" height="32" rx="3" fill="#3B82F6" class="swatch-stroke"/>
      <text x="56" y="28" class="tname">blue.500</text>
      <text x="56" y="44" class="tval">#3B82F6</text>
    </g>

    <g transform="translate(20 240)">
      <rect width="300" height="60" rx="4" class="token"/>
      <rect x="12" y="14" width="32" height="32" rx="3" fill="#1E3A8A" class="swatch-stroke"/>
      <text x="56" y="28" class="tname">blue.900</text>
      <text x="56" y="44" class="tval">#1E3A8A</text>
    </g>

    <!-- spacing 토큰 -->
    <g transform="translate(20 320)">
      <rect width="300" height="50" rx="4" class="token"/>
      <text x="12" y="22" class="tname">spacing.4</text>
      <text x="12" y="38" class="tval">16px</text>
    </g>

    <text x="20" y="410" class="col-cap" font-weight="700" fill="var(--c-fg)">변경 주기: 거의 없음</text>
  </g>

  <!-- ===== 컬럼 2: Semantic ===== -->
  <g transform="translate(420 70)">
    <rect class="col-sem" width="340" height="440" rx="8"/>
    <text x="20" y="32" class="col-num" fill="var(--c-accent-2)">TIER 2</text>
    <text x="20" y="54" class="col-title">Semantic</text>
    <text x="20" y="74" class="col-cap">의미를 가진 별칭 — 가끔 변함</text>

    <g transform="translate(20 100)">
      <rect width="300" height="60" rx="4" class="token"/>
      <text x="12" y="22" class="tname">color.primary</text>
      <text x="12" y="40" class="tval">→ blue.500</text>
      <rect x="220" y="14" width="32" height="32" rx="3" fill="#3B82F6" class="swatch-stroke"/>
    </g>

    <g transform="translate(20 170)">
      <rect width="300" height="60" rx="4" class="token"/>
      <text x="12" y="22" class="tname">color.background</text>
      <text x="12" y="40" class="tval">→ blue.50</text>
      <rect x="220" y="14" width="32" height="32" rx="3" fill="#EFF6FF" class="swatch-stroke"/>
    </g>

    <g transform="translate(20 240)">
      <rect width="300" height="60" rx="4" class="token"/>
      <text x="12" y="22" class="tname">color.text</text>
      <text x="12" y="40" class="tval">→ blue.900</text>
      <rect x="220" y="14" width="32" height="32" rx="3" fill="#1E3A8A" class="swatch-stroke"/>
    </g>

    <g transform="translate(20 320)">
      <rect width="300" height="50" rx="4" class="token"/>
      <text x="12" y="22" class="tname">space.gutter</text>
      <text x="12" y="38" class="tval">→ spacing.4</text>
    </g>

    <text x="20" y="410" class="col-cap" font-weight="700" fill="var(--c-fg)">변경 주기: 디자인 결정 변경 시</text>
  </g>

  <!-- ===== 컬럼 3: Component ===== -->
  <g transform="translate(800 70)">
    <rect class="col-comp" width="340" height="440" rx="8"/>
    <text x="20" y="32" class="col-num" fill="var(--c-accent-3)">TIER 3</text>
    <text x="20" y="54" class="col-title">Component</text>
    <text x="20" y="74" class="col-cap">컴포넌트별 토큰 — 자주 변함</text>

    <g transform="translate(20 100)">
      <rect width="300" height="200" rx="4" class="token"/>
      <text x="12" y="22" class="tname">button.primary</text>

      <line x1="12" y1="36" x2="288" y2="36" stroke="var(--c-divider)" stroke-width="1"/>

      <text x="12" y="58" class="tname">bg</text>
      <text x="12" y="74" class="tval">→ semantic.color.primary</text>

      <text x="12" y="100" class="tname">text</text>
      <text x="12" y="116" class="tval">#FFFFFF</text>

      <text x="12" y="142" class="tname">padding</text>
      <text x="12" y="158" class="tval">→ semantic.space.gutter</text>

      <line x1="12" y1="172" x2="288" y2="172" stroke="var(--c-divider)" stroke-width="1"/>

      <rect x="60" y="180" width="180" height="12" rx="6" fill="#3B82F6"/>
    </g>

    <text x="20" y="410" class="col-cap" font-weight="700" fill="var(--c-fg)">변경 주기: 캠페인, 분기마다</text>
  </g>

  <!-- 참조 화살표 -->
  <line x1="800" y1="160" x2="760" y2="160" class="line-ref" marker-end="url(#ar-t)"/>
  <line x1="420" y1="160" x2="380" y2="160" class="line-ref" marker-end="url(#ar-t)"/>

  <!-- 하단 캡션 -->
  <text x="600" y="555" class="col-cap" text-anchor="middle">한 토큰은 다른 토큰의 참조 — Composite의 가장 자연스러운 사례</text>
</svg>
