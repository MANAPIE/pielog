<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">Composite와 디자인 토큰 계층: ep.07 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="grad1" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="20%" cy="85%" r="40%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- 배경 stroke 도형 -->
  <circle cx="1100" cy="600" r="220" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.13"/>
  <rect x="-100" y="-100" width="500" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12" transform="rotate(7 150 60)"/>

  <!-- 중앙 트리 메타포 -->
  <g transform="translate(600 315)">
    <!-- root (큰 박스) -->
    <g transform="rotate(-2)">
      <rect x="-60" y="-200" width="120" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.5"/>
      <line x1="-40" y1="-180" x2="40" y2="-180" stroke="var(--c-line)" stroke-width="2.5"/>
      <circle cx="-30" cy="-160" r="3" fill="var(--c-accent-2)"/>
      <circle cx="-15" cy="-160" r="3" fill="var(--c-accent-2)"/>
      <circle cx="0" cy="-160" r="3" fill="var(--c-accent-2)"/>
    </g>

    <!-- 가지 -->
    <line x1="-40" y1="-140" x2="-180" y2="-70" stroke="var(--c-line)" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-140" x2="0" y2="-70" stroke="var(--c-line)" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="-140" x2="180" y2="-70" stroke="var(--c-line)" stroke-width="1.5" opacity="0.6"/>

    <!-- 중간 노드들 (composite) -->
    <g transform="translate(-180 -40) rotate(-3)">
      <rect x="-45" y="-25" width="90" height="50" rx="4" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2"/>
      <line x1="-30" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2"/>
      <circle cx="-25" cy="10" r="2.5" fill="var(--c-accent)"/>
      <circle cx="-12" cy="10" r="2.5" fill="var(--c-accent)"/>
    </g>

    <g transform="translate(0 -40) rotate(2)">
      <rect x="-45" y="-25" width="90" height="50" rx="4" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2"/>
      <line x1="-30" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2"/>
      <circle cx="-25" cy="10" r="2.5" fill="var(--c-accent)"/>
      <circle cx="-12" cy="10" r="2.5" fill="var(--c-accent)"/>
    </g>

    <g transform="translate(180 -40) rotate(-2)">
      <rect x="-45" y="-25" width="90" height="50" rx="4" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2"/>
      <line x1="-30" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2"/>
      <circle cx="-25" cy="10" r="2.5" fill="var(--c-accent)"/>
      <circle cx="-12" cy="10" r="2.5" fill="var(--c-accent)"/>
    </g>

    <!-- 두 번째 가지 -->
    <line x1="-180" y1="-15" x2="-220" y2="60" stroke="var(--c-line)" stroke-width="1.5" opacity="0.5"/>
    <line x1="-180" y1="-15" x2="-140" y2="60" stroke="var(--c-line)" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-15" x2="-40" y2="60" stroke="var(--c-line)" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-15" x2="40" y2="60" stroke="var(--c-line)" stroke-width="1.5" opacity="0.5"/>
    <line x1="180" y1="-15" x2="140" y2="60" stroke="var(--c-line)" stroke-width="1.5" opacity="0.5"/>
    <line x1="180" y1="-15" x2="220" y2="60" stroke="var(--c-line)" stroke-width="1.5" opacity="0.5"/>

    <!-- leaf 노드들 (작은 원, 동일한 크기로) -->
    <circle cx="-220" cy="80" r="14" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <circle cx="-220" cy="80" r="4" fill="var(--c-accent-3)"/>

    <circle cx="-140" cy="80" r="14" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <circle cx="-140" cy="80" r="4" fill="var(--c-accent-3)"/>

    <circle cx="-40" cy="80" r="14" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <circle cx="-40" cy="80" r="4" fill="var(--c-accent-3)"/>

    <circle cx="40" cy="80" r="14" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <circle cx="40" cy="80" r="4" fill="var(--c-accent-3)"/>

    <circle cx="140" cy="80" r="14" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <circle cx="140" cy="80" r="4" fill="var(--c-accent-3)"/>

    <circle cx="220" cy="80" r="14" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <circle cx="220" cy="80" r="4" fill="var(--c-accent-3)"/>
  </g>

  <!-- 우상단 동심원 -->
  <g transform="translate(1050 130)" opacity="0.7">
    <circle r="50" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
    <circle r="30" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌상단 작은 점 무리 -->
  <g transform="translate(160 100)">
    <circle r="4" fill="var(--c-accent)"/>
    <circle cx="16" r="4" fill="var(--c-accent)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent)" opacity="0.3"/>
  </g>

  <!-- 좌하단 회전 사각형 -->
  <g transform="translate(160 540) rotate(-15)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
  </g>

  <!-- 우하단 큰 시리즈 번호 -->
  <text x="1130" y="575" class="num" text-anchor="end">07</text>
</svg>
