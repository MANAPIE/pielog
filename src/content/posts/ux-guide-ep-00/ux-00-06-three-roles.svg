<svg viewBox="0 0 500 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-roles">
  <title id="t-roles">기획·디자인·개발 세 직무와 UX의 교집합</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nm-inv { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-bg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .cap-inv { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-bg); opacity: 0.85; }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .tag { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: var(--c-accent-2); }
      .leader { stroke: var(--c-muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-roles" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-roles-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-accent)" /></marker>
  </defs>

  <rect class="bg" width="500" height="552" />
  <circle cx="175" cy="190" r="130" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
  <circle cx="325" cy="190" r="130" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
  <circle cx="250" cy="320" r="130" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />

  <text x="70" y="132" class="lbl" fill="var(--c-accent)">PLANNING</text>
  <text x="70" y="152" class="nm">기획</text>
  <text x="70" y="172" class="cap">무엇을, 왜</text>
  <text x="70" y="190" class="cap">문제 정의 · 우선순위</text>

  <text x="430" y="132" class="lbl" fill="var(--c-accent-3)" text-anchor="end">DESIGN</text>
  <text x="430" y="152" class="nm" text-anchor="end">디자인</text>
  <text x="430" y="172" class="cap" text-anchor="end">보이고 느껴지는 방식</text>
  <text x="430" y="190" class="cap" text-anchor="end">정보 구조 · 인터랙션</text>

  <text x="250" y="340" class="lbl" fill="var(--c-accent-2)" text-anchor="middle">DEVELOPMENT</text>
  <text x="250" y="360" class="nm" text-anchor="middle">개발</text>
  <text x="250" y="380" class="cap" text-anchor="middle">어떻게 작동하는가</text>
  <text x="250" y="398" class="cap" text-anchor="middle">성능 · 상태 · 에러 처리</text>

  <text x="250" y="150" class="mid" text-anchor="middle">와이어프레임</text>
  <text x="250" y="168" class="mid" text-anchor="middle">시나리오</text>
  <text x="178" y="272" class="mid" text-anchor="middle">기술 제약</text>
  <text x="178" y="290" class="mid" text-anchor="middle">수용 기준</text>
  <text x="322" y="272" class="mid" text-anchor="middle">핸드오프</text>
  <text x="322" y="290" class="mid" text-anchor="middle">컴포넌트</text>

  <circle cx="250" cy="238" r="26" fill="var(--c-card)" stroke="var(--c-fg)" stroke-width="1.6" stroke-dasharray="3 3" />
  <text x="250" y="235" class="nm" text-anchor="middle">사용자</text>
  <text x="250" y="250" class="nm" text-anchor="middle">경험</text>

  <g transform="translate(24 470)">
    <rect width="452" height="58" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
    <text x="16" y="24" class="ttl">세 직무 사이의 틈</text>
    <text x="16" y="44" class="cap">UX는 한 직무 안이 아니라 직무와 직무 사이에서 가장 자주 무너집니다</text>
  </g>
</svg>
