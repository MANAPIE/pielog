<svg viewBox="0 0 500 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cx">
  <title id="t-cx">CX, SX, UX, UI의 포함 관계</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nm-inv { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-bg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .cap-inv { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-bg); opacity: 0.85; }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .tag { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: var(--c-accent-2); }
      .leader { stroke: var(--c-muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-cx" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-cx-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-accent)" /></marker>
  </defs>

  <rect class="bg" width="500" height="412" />
  <rect x="24" y="24" width="452" height="364" rx="10" fill="var(--c-soft-4)" stroke="var(--c-accent-4)" stroke-width="1.6" />
  <text x="40" y="48" class="nm">고객 경험</text>
  <text x="460" y="48" class="lbl" fill="var(--c-accent-4)" text-anchor="end">CX</text>
  <text x="40" y="64" class="cap mono">Customer Experience</text>
  <text x="40" y="82" class="cap">브랜드를 어떻게 기억하는가 · 매장 · 콜센터 · 광고 · 청구서 · 프로덕트</text>
  <rect x="40" y="96" width="420" height="276" rx="10" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
  <text x="56" y="120" class="nm">서비스 경험</text>
  <text x="444" y="120" class="lbl" fill="var(--c-accent-2)" text-anchor="end">SX</text>
  <text x="56" y="136" class="cap mono">Service Experience</text>
  <text x="56" y="154" class="cap">뒤에서 무엇이 돌아가는가 · 프론트 + 백스테이지 · 도구: 서비스 블루프린트</text>
  <rect x="56" y="168" width="388" height="188" rx="10" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
  <text x="72" y="192" class="nm">사용자 경험</text>
  <text x="428" y="192" class="lbl" fill="var(--c-accent)" text-anchor="end">UX</text>
  <text x="72" y="208" class="cap mono">User Experience</text>
  <text x="72" y="226" class="cap">어떻게 느껴지는가 · 사용과 사용의 예상 전체 · 기준: ISO 9241-210</text>
  <rect x="72" y="240" width="356" height="100" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
  <text x="88" y="264" class="nm">사용자 인터페이스</text>
  <text x="412" y="264" class="lbl" fill="var(--c-accent-3)" text-anchor="end">UI</text>
  <text x="88" y="280" class="cap mono">User Interface</text>
  <text x="88" y="298" class="cap">무엇이 보이는가 · 버튼 · 폼 · 메뉴 · 타이포그래피 · 색</text>
</svg>
