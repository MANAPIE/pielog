<svg viewBox="0 0 500 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-par">
  <title id="t-par">컴퓨팅 UI 패러다임 세 가지</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nm-inv { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-bg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .cap-inv { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-bg); opacity: 0.85; }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .tag { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: var(--c-accent-2); }
      .leader { stroke: var(--c-muted); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-par" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-par-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-accent)" /></marker>
  </defs>

  <rect class="bg" width="500" height="504" />
  <g transform="translate(24 24)">
    <rect width="452" height="136" rx="8" fill="var(--c-card)" stroke="var(--c-accent-3)" stroke-width="1.6" />
    <text x="20" y="26" class="lbl" fill="var(--c-accent-3)">1945</text>
    <text x="62" y="26" class="nm">배치 처리</text>
    <text x="20" y="44" class="cap mono">batch processing</text>
    <text x="20" y="68" class="cap">사용자가 작업 전체를 미리 적어 제출하고, 결과는 나중에 받습니다.</text>
    <text x="20" y="86" class="cap">천공 카드 묶음이 대표적입니다.</text>
    <line x1="20" y1="100" x2="432" y2="100" stroke="var(--c-divider)" stroke-width="1" />
    <text x="20" y="120" class="th">통제</text>
    <text x="62" y="120" class="td">사용자가 전부 미리 지정</text>
  </g>
  <line x1="250" y1="161" x2="250" y2="170" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-par)" />
  <g transform="translate(24 176)">
    <rect width="452" height="136" rx="8" fill="var(--c-card)" stroke="var(--c-accent-4)" stroke-width="1.6" />
    <text x="20" y="26" class="lbl" fill="var(--c-accent-4)">1964</text>
    <text x="62" y="26" class="nm">명령 기반 상호작용</text>
    <text x="20" y="44" class="cap mono">command-based interaction</text>
    <text x="20" y="68" class="cap">명령을 하나씩 내리고 즉시 결과를 확인하며 고칩니다.</text>
    <text x="20" y="86" class="cap">커맨드라인과 GUI가 모두 여기에 속합니다.</text>
    <line x1="20" y1="100" x2="432" y2="100" stroke="var(--c-divider)" stroke-width="1" />
    <text x="20" y="120" class="th">통제</text>
    <text x="62" y="120" class="td">사용자가 단계마다 통제</text>
  </g>
  <line x1="250" y1="313" x2="250" y2="322" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-par)" />
  <g transform="translate(24 328)">
    <rect width="452" height="136" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
    <text x="20" y="26" class="lbl" fill="var(--c-accent)">2023</text>
    <text x="62" y="26" class="nm">의도 기반 결과 명세</text>
    <text x="20" y="44" class="cap mono">intent-based outcome specification</text>
    <text x="20" y="68" class="cap">원하는 결과를 말하고, 방법은 컴퓨터가 정합니다.</text>
    <text x="20" y="86" class="cap">생성형 AI와 에이전트가 여기에 속합니다.</text>
    <line x1="20" y1="100" x2="432" y2="100" stroke="var(--c-divider)" stroke-width="1" />
    <text x="20" y="120" class="th">통제</text>
    <text x="62" y="120" class="td">결과는 사용자, 방법은 컴퓨터</text>
  </g>
  <text x="24" y="490" class="cap">출처: Nielsen, J. (2023). AI: First New UI Paradigm in 60 Years. NN/g.</text>
</svg>
