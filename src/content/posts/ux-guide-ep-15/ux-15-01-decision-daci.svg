<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-id">
  <title id="t-id">결정권과 입력</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-id" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-id-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="500" />
  <text x="24" y="36" class="ttl">결정마다 승인자는 한 명, 입력은 둘</text>
  <text x="24" y="68" class="th">결정</text>
  <text x="243" y="68" class="th" text-anchor="middle">승인자</text>
  <text x="304" y="68" class="th">기여자의 입력</text>
  <rect x="24" y="80" width="172" height="108" rx="8" class="card" stroke="var(--c-accent-3)" />
  <text x="38" y="104" class="td">경고를</text>
  <text x="38" y="120" class="td">어떻게 보여줄까</text>
  <text x="38" y="140" class="cap">어떻게 보이고 느껴지는가</text>
  <text x="38" y="158" class="cap">드라이버: 디자이너</text>
  <text x="38" y="174" class="cap">참고자: QA</text>
  <rect x="208" y="106" width="70" height="56" rx="6" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
  <text x="243" y="138" class="val" text-anchor="middle" style="fill:var(--c-accent-3)">디자이너</text>
  <rect x="304" y="98" width="172" height="34" rx="6" fill="var(--c-muted-soft)" />
  <text x="312" y="112" class="th">기획자의 입력</text>
  <text x="312" y="126" class="cap" style="fill:var(--c-fg)">경고를 반드시 인지해야 함</text>
  <line x1="302" y1="115" x2="282" y2="115" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-id)" />
  <rect x="304" y="138" width="172" height="34" rx="6" fill="var(--c-muted-soft)" />
  <text x="312" y="152" class="th">개발자의 입력</text>
  <text x="312" y="166" class="cap" style="fill:var(--c-fg)">60fps가 어려움</text>
  <line x1="302" y1="155" x2="282" y2="155" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-id)" />
  <rect x="24" y="200" width="172" height="108" rx="8" class="card" stroke="var(--c-accent)" />
  <text x="38" y="224" class="td">이 기능을</text>
  <text x="38" y="240" class="td">뺄까</text>
  <text x="38" y="260" class="cap">무엇을, 왜</text>
  <text x="38" y="278" class="cap">드라이버: 디자이너</text>
  <text x="38" y="294" class="cap">참고자: 영업</text>
  <rect x="208" y="226" width="70" height="56" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
  <text x="243" y="258" class="val" text-anchor="middle" style="fill:var(--c-accent)">기획자</text>
  <rect x="304" y="218" width="172" height="34" rx="6" fill="var(--c-muted-soft)" />
  <text x="312" y="232" class="th">디자이너의 입력</text>
  <text x="312" y="246" class="cap" style="fill:var(--c-fg)">테스트에서 4명이 막힘</text>
  <line x1="302" y1="235" x2="282" y2="235" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-id)" />
  <rect x="304" y="258" width="172" height="34" rx="6" fill="var(--c-muted-soft)" />
  <text x="312" y="272" class="th">개발자의 입력</text>
  <text x="312" y="286" class="cap" style="fill:var(--c-fg)">이 기능은 2주 더 듦</text>
  <line x1="302" y1="275" x2="282" y2="275" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-id)" />
  <rect x="24" y="320" width="172" height="108" rx="8" class="card" stroke="var(--c-accent-2)" />
  <text x="38" y="344" class="td">애니메이션을</text>
  <text x="38" y="360" class="td">어떻게 구현할까</text>
  <text x="38" y="380" class="cap">어떻게 작동하는가</text>
  <text x="38" y="398" class="cap">드라이버: 개발자</text>
  <text x="38" y="414" class="cap">참고자: QA</text>
  <rect x="208" y="346" width="70" height="56" rx="6" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
  <text x="243" y="378" class="val" text-anchor="middle" style="fill:var(--c-accent-2)">개발자</text>
  <rect x="304" y="338" width="172" height="34" rx="6" fill="var(--c-muted-soft)" />
  <text x="312" y="352" class="th">기획자의 입력</text>
  <text x="312" y="366" class="cap" style="fill:var(--c-fg)">이번 출시에 포함</text>
  <line x1="302" y1="355" x2="282" y2="355" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-id)" />
  <rect x="304" y="378" width="172" height="34" rx="6" fill="var(--c-muted-soft)" />
  <text x="312" y="392" class="th">디자이너의 입력</text>
  <text x="312" y="406" class="cap" style="fill:var(--c-fg)">1px 차이가 보임</text>
  <line x1="302" y1="395" x2="282" y2="395" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-id)" />
  <text x="24" y="460" class="cap">승인자 칸에는 늘 한 명만 들어가고, 입력은 기여자에게서 받습니다.</text>
  <text x="24" y="476" class="cap">같은 세 사람이라도 결정마다 승인자가 바뀝니다.</text>
</svg>
