<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">Decorator와 Wrapper 컴포넌트의 윤리: ep.05 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- 배경 stroke 도형 -->
  <rect x="780" y="-100" width="500" height="380" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12" transform="rotate(6 1030 90)"/>
  <circle cx="100" cy="100" r="200" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.13"/>

  <!-- 양파 껍질: 동심으로 겹쳐진 사각형들 (회전 약간) -->
  <g transform="translate(600 315)">
    <!-- 가장 바깥 (LoggingDecorator) -->
    <g transform="rotate(-3)">
      <rect x="-220" y="-150" width="440" height="300" rx="8" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.5"/>
      <text x="-200" y="-120" font-family="Inter,system-ui" font-size="12" font-weight="700" fill="var(--c-accent-2)" letter-spacing="0.06em">LoggingDecorator</text>
      <!-- 점선 가장자리 -->
      <rect x="-228" y="-158" width="456" height="316" rx="9" fill="none" stroke="var(--c-accent-2)" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
    </g>

    <!-- 두 번째 (CacheDecorator) -->
    <g transform="rotate(2)">
      <rect x="-170" y="-115" width="340" height="230" rx="6" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.2"/>
      <text x="-150" y="-88" font-family="Inter,system-ui" font-size="12" font-weight="700" fill="var(--c-accent)" letter-spacing="0.06em">CacheDecorator</text>
    </g>

    <!-- 세 번째 (AuthDecorator) -->
    <g transform="rotate(-2)">
      <rect x="-120" y="-80" width="240" height="160" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
      <text x="-100" y="-58" font-family="Inter,system-ui" font-size="12" font-weight="700" fill="var(--c-accent-3)" letter-spacing="0.06em">AuthDecorator</text>
    </g>

    <!-- 가장 안쪽 (HttpRequest) -->
    <g>
      <rect x="-70" y="-45" width="140" height="90" rx="4" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>
      <text x="0" y="-22" font-family="Inter,system-ui" font-size="11" font-weight="700" fill="var(--c-fg)" text-anchor="middle">HttpRequest</text>
      <line x1="-50" y1="-8" x2="50" y2="-8" stroke="var(--c-line)" stroke-width="2"/>
      <circle cx="-40" cy="20" r="3.5" fill="var(--c-accent)"/>
      <circle cx="-25" cy="20" r="3.5" fill="var(--c-accent)"/>
      <circle cx="-10" cy="20" r="3.5" fill="var(--c-accent)"/>
      <rect x="10" y="14" width="40" height="10" rx="2" fill="var(--c-accent-2)" opacity="0.7"/>
    </g>
  </g>

  <!-- 좌측 호출 화살표 (바깥에서 안쪽으로) -->
  <g transform="translate(280 315)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="var(--c-line)" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="80,-5 90,0 80,5" fill="var(--c-line)"/>
    <text x="40" y="-12" font-family="Inter,system-ui" font-size="10" font-weight="700" fill="var(--c-muted)" text-anchor="middle" letter-spacing="0.06em">send()</text>
  </g>

  <!-- 우측 응답 화살표 (안쪽에서 바깥으로) -->
  <g transform="translate(830 315)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="var(--c-line)" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="80,-5 90,0 80,5" fill="var(--c-line)"/>
    <text x="40" y="-12" font-family="Inter,system-ui" font-size="10" font-weight="700" fill="var(--c-muted)" text-anchor="middle" letter-spacing="0.06em">response</text>
  </g>

  <!-- 우상단 동심원 -->
  <g transform="translate(1050 130)" opacity="0.7">
    <circle r="50" fill="none" stroke="var(--c-accent)" stroke-width="1.5"/>
    <circle r="30" fill="none" stroke="var(--c-accent)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌상단 작은 점 무리 -->
  <g transform="translate(160 100)">
    <circle r="4" fill="var(--c-accent-3)"/>
    <circle cx="16" r="4" fill="var(--c-accent-3)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent-3)" opacity="0.3"/>
  </g>

  <!-- 좌하단 회전 사각형 -->
  <g transform="translate(110 540) rotate(-12)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent)" stroke-width="1.5"/>
  </g>

  <!-- 우하단 큰 시리즈 번호 -->
  <text x="1130" y="575" class="num" text-anchor="end">05</text>
</svg>
