<svg viewBox="0 0 500 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-jm">
  <title id="t-jm">배달 앱 저녁 주문의 고객 여정 지도</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-jm" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-jm-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="528" />
  <text x="24" y="36" class="ttl">배달 앱 저녁 주문의 여정 지도</text>
  <text x="24" y="58" class="th">페르소나</text><text x="96" y="58" class="cap">급한 출퇴근형</text>
  <text x="24" y="76" class="th">시나리오</text><text x="96" y="76" class="cap">평일 저녁, 퇴근 뒤 집에서 저녁을 주문한다</text>
  <text x="24" y="105" class="th">단계</text>
  <rect x="72.0" y="88" width="78" height="26" rx="5" fill="var(--c-soft)" />
  <text x="111.0" y="105" class="nm" text-anchor="middle">탐색</text>
  <rect x="153.5" y="88" width="78" height="26" rx="5" fill="var(--c-soft)" />
  <text x="192.5" y="105" class="nm" text-anchor="middle">주문·결제</text>
  <rect x="235.0" y="88" width="78" height="26" rx="5" fill="var(--c-soft)" />
  <text x="274.0" y="105" class="nm" text-anchor="middle">대기</text>
  <rect x="316.5" y="88" width="78" height="26" rx="5" fill="var(--c-soft)" />
  <text x="355.5" y="105" class="nm" text-anchor="middle">수령</text>
  <rect x="398.0" y="88" width="78" height="26" rx="5" fill="var(--c-soft)" />
  <text x="437.0" y="105" class="nm" text-anchor="middle">사후</text>
  <text x="24" y="152" class="th">행동</text>
  <text x="111.0" y="144" class="mid" text-anchor="middle">메뉴를</text>
  <text x="111.0" y="161" class="mid" text-anchor="middle">고른다</text>
  <text x="192.5" y="144" class="mid" text-anchor="middle">쿠폰을 찾고</text>
  <text x="192.5" y="161" class="mid" text-anchor="middle">결제한다</text>
  <text x="274.0" y="144" class="mid" text-anchor="middle">추적 화면을</text>
  <text x="274.0" y="161" class="mid" text-anchor="middle">본다</text>
  <text x="355.5" y="144" class="mid" text-anchor="middle">문 앞에서</text>
  <text x="355.5" y="161" class="mid" text-anchor="middle">받는다</text>
  <text x="437.0" y="144" class="mid" text-anchor="middle">리뷰 요청을</text>
  <text x="437.0" y="161" class="mid" text-anchor="middle">받는다</text>
  <text x="24" y="204" class="th">접점</text>
  <text x="111.0" y="196" class="mid" text-anchor="middle">앱 홈</text>
  <text x="192.5" y="196" class="mid" text-anchor="middle">앱, 결제창</text>
  <text x="274.0" y="196" class="mid" text-anchor="middle">추적 화면,</text>
  <text x="274.0" y="213" class="mid" text-anchor="middle">푸시 알림</text>
  <text x="355.5" y="196" class="mid" text-anchor="middle">배달 기사,</text>
  <text x="355.5" y="213" class="mid" text-anchor="middle">문 앞</text>
  <text x="437.0" y="196" class="mid" text-anchor="middle">앱 팝업</text>
  <text x="24" y="256" class="th">생각</text>
  <text x="111.0" y="248" class="mid" text-anchor="middle">“뭘 먹지”</text>
  <text x="192.5" y="248" class="mid" text-anchor="middle">“쿠폰이</text>
  <text x="192.5" y="265" class="mid" text-anchor="middle">있었는데”</text>
  <text x="274.0" y="248" class="mid" text-anchor="middle">“언제 오지,</text>
  <text x="274.0" y="265" class="mid" text-anchor="middle">멈췄나”</text>
  <text x="355.5" y="248" class="mid" text-anchor="middle">“왔다”</text>
  <text x="437.0" y="248" class="mid" text-anchor="middle">“벌써</text>
  <text x="437.0" y="265" class="mid" text-anchor="middle">리뷰를?”</text>
  <line x1="24" y1="278" x2="476" y2="278" stroke="var(--c-divider)" stroke-width="1" />
  <text x="24" y="356.0" class="th">감정</text>
  <line x1="72" y1="352.0" x2="476" y2="352.0" stroke="var(--c-divider)" stroke-width="1" stroke-dasharray="3 3" />
  <path d="M 111.0,338.2 L 192.5,361.2 L 274.0,391.1 L 355.5,319.8 L 437.0,365.8" fill="none" stroke="var(--c-accent)" stroke-width="2.2" stroke-linejoin="round" />
  <circle cx="111.0" cy="338.2" r="4" fill="var(--c-accent)" />
  <circle cx="192.5" cy="361.2" r="4" fill="var(--c-accent)" />
  <circle cx="274.0" cy="391.1" r="4" fill="var(--c-accent-2)" />
  <circle cx="355.5" cy="319.8" r="4" fill="var(--c-accent)" />
  <circle cx="437.0" cy="365.8" r="4" fill="var(--c-accent-2)" />
  <text x="274.0" y="407.1" class="cap" text-anchor="middle" style="fill:var(--c-accent-2)">최저점</text>
  <text x="274.0" y="421.1" class="cap" text-anchor="middle" style="fill:var(--c-accent-2)">기사 위치 멈춤</text>
  <text x="437.0" y="381.8" class="cap" text-anchor="middle" style="fill:var(--c-accent-2)">마지막 인상</text>
  <text x="437.0" y="395.8" class="cap" text-anchor="middle" style="fill:var(--c-accent-2)">리뷰 팝업</text>
  <text x="355.5" y="309.8" class="cap" text-anchor="middle">최고점</text>
  <line x1="24" y1="424" x2="476" y2="424" stroke="var(--c-divider)" stroke-width="1" />
  <text x="24" y="458" class="th">기회</text>
  <text x="111.0" y="450" class="cap" text-anchor="middle">-</text>
  <text x="192.5" y="450" class="mid" text-anchor="middle">쿠폰</text>
  <text x="192.5" y="467" class="mid" text-anchor="middle">자동 적용</text>
  <text x="274.0" y="450" class="mid" text-anchor="middle">위치 갱신</text>
  <text x="274.0" y="467" class="mid" text-anchor="middle">보장</text>
  <text x="355.5" y="450" class="cap" text-anchor="middle">-</text>
  <text x="437.0" y="450" class="mid" text-anchor="middle">리뷰 시점</text>
  <text x="437.0" y="467" class="mid" text-anchor="middle">조정</text>
  <text x="24" y="504" class="cap">최저점과 마지막 지점이 경험의 기억을 결정합니다. 그 둘을 먼저 고칩니다.</text>
</svg>
