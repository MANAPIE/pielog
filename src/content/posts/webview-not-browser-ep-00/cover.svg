<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="웹뷰는 브라우저가 아니다 ep.00 cover">
  <style>
  :root {
    --c-bg: #EEF5F6;
    --c-fg: #10202A;
    --c-muted: #5E7480;
    --c-accent: #0E7490; --c-accent-2: #22B8CF; --c-accent-3: #C98A3B;
    --c-num: rgba(14, 116, 144, 0.14);
    --c-dot: rgba(14, 116, 144, 0.10);
    --c-line: rgba(14, 116, 144, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-bg: #0A161A;
      --c-fg: #DCE8EA;
      --c-muted: #8AA0A8;
      --c-accent: #4DD4EC; --c-accent-2: #0E7490; --c-accent-3: #E0A860;
      --c-num: rgba(77, 212, 236, 0.15);
      --c-dot: rgba(77, 212, 236, 0.10);
      --c-line: rgba(77, 212, 236, 0.20);
    }
  }
  .cover-bg { fill: var(--c-bg); }
  .ep-number {
    font: 900 240px ui-monospace, "SF Mono", Menlo, monospace;
    fill: var(--c-num); letter-spacing: -0.04em;
  }
</style>
  <defs>
    <pattern id="dots-wnb00" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="var(--c-dot)"/>
    </pattern>
    <radialGradient id="halo-wnb00a" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="var(--c-accent)" stop-opacity="0.24"/>
      <stop offset="1" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-wnb00b" cx="0.10" cy="0.90" r="0.55">
      <stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-wnb00)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb00a)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb00b)"/>

  <!-- 배경 무채 stroke 도형 (오프캔버스) -->
  <rect x="880" y="-180" width="560" height="560" rx="48" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(-8 1160 100)"/>
  <circle cx="90" cy="620" r="300" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <circle cx="90" cy="620" r="220" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>

  <!-- 브라우저 창: 결정이 채워진 완성품 -->
  <g transform="translate(350 285) rotate(-6)">
    <rect x="-195" y="-135" width="390" height="270" rx="14" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.6"/>
    <!-- 크롬 바: 면 대신 옅은 톤 + 구분선 -->
    <rect x="-195" y="-135" width="390" height="46" rx="14" fill="var(--c-accent)" fill-opacity="0.10"/>
    <rect x="-195" y="-112" width="390" height="23" fill="var(--c-accent)" fill-opacity="0.10"/>
    <line x1="-195" y1="-89" x2="195" y2="-89" stroke="var(--c-accent)" stroke-width="2"/>
    <circle cx="-173" cy="-112" r="5.5" fill="none" stroke="var(--c-accent)" stroke-width="1.8"/>
    <circle cx="-151" cy="-112" r="5.5" fill="none" stroke="var(--c-accent)" stroke-width="1.8"/>
    <circle cx="-129" cy="-112" r="5.5" fill="none" stroke="var(--c-accent)" stroke-width="1.8"/>
    <rect x="-104" y="-122" width="214" height="20" rx="10" fill="none" stroke="var(--c-accent)" stroke-width="1.6" opacity="0.55"/>
    <!-- 본문: 채워진 칩 하나 + 나머지는 테두리 -->
    <rect x="-165" y="-60" width="86" height="14" rx="7" fill="var(--c-accent)" fill-opacity="0.6"/>
    <rect x="-73" y="-60" width="54" height="14" rx="7" fill="none" stroke="var(--c-accent)" stroke-width="1.5" opacity="0.55"/>
    <rect x="-165" y="-34" width="174" height="14" rx="7" fill="none" stroke="var(--c-accent)" stroke-width="1.5" opacity="0.5"/>
    <rect x="-165" y="-8" width="118" height="14" rx="7" fill="none" stroke="var(--c-accent)" stroke-width="1.5" opacity="0.35"/>
    <!-- 결정 완료 배지 -->
    <circle cx="124" cy="-34" r="27" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.6"/>
    <path d="M 111 -34 l 9 9 l 17 -19" fill="none" stroke="var(--c-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 아래 두 패널: 내용이 들어찬 상태 -->
    <rect x="-165" y="32" width="152" height="78" rx="10" fill="var(--c-accent)" fill-opacity="0.12" stroke="var(--c-accent)" stroke-width="2"/>
    <rect x="9" y="32" width="166" height="78" rx="10" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2.4"/>
    <rect x="25" y="50" width="58" height="12" rx="6" fill="var(--c-accent-3)" fill-opacity="0.6"/>
    <line x1="25" y1="74" x2="145" y2="74" stroke="var(--c-accent-3)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="25" y1="90" x2="112" y2="90" stroke="var(--c-accent-3)" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- 엔진 동심원: 두 프레임이 공유하는 코어 -->
  <circle cx="580" cy="415" r="122" fill="none" stroke="var(--c-accent)" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.35"/>
  <circle cx="580" cy="415" r="86" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="580" cy="415" r="56" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5"/>
  <circle cx="580" cy="415" r="27" fill="var(--c-accent)" fill-opacity="0.75"/>

  <!-- 폰 프레임: 슬롯이 비어 있는 웹뷰 -->
  <g transform="translate(800 330) rotate(8)">
    <rect x="-115" y="-215" width="230" height="430" rx="30" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="4"/>
    <rect x="-99" y="-180" width="198" height="356" rx="18" fill="none" stroke="var(--c-accent)" stroke-width="1.2" opacity="0.35"/>
    <rect x="-30" y="-198" width="60" height="10" rx="5" fill="var(--c-accent)" fill-opacity="0.5"/>
    <rect x="-85" y="-162" width="170" height="62" rx="10" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="-85" y="-82" width="170" height="62" rx="10" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="-93" y="-90" width="186" height="78" rx="14" fill="none" stroke="var(--c-accent-3)" stroke-width="2" stroke-dasharray="3 7"/>
    <rect x="-85" y="-2" width="170" height="62" rx="10" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="-85" y="78" width="170" height="62" rx="10" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="-40" y="190" width="80" height="8" rx="4" fill="var(--c-accent)" fill-opacity="0.4"/>
  </g>

  <!-- 흩어진 디테일 -->
  <rect x="120" y="-26" width="76" height="76" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5" transform="rotate(12 158 12)"/>
  <circle cx="936" cy="118" r="9" fill="var(--c-accent)" fill-opacity="0.85"/>
  <circle cx="964" cy="138" r="6" fill="var(--c-accent-2)"/>
  <circle cx="918" cy="150" r="5" fill="none" stroke="var(--c-accent-3)" stroke-width="1.8"/>
  <polygon points="1058,510 1106,510 1082,468" fill="none" stroke="var(--c-accent-3)" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>
  <line x1="150" y1="130" x2="128" y2="360" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.5"/>
  <g transform="translate(196 528) rotate(-12)" opacity="0.6">
    <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="var(--c-accent-3)" stroke-width="1.8"/>
  </g>
  <rect x="64" y="180" width="44" height="12" rx="4" fill="var(--c-accent-2)" fill-opacity="0.6"/>
  <rect x="88" y="200" width="28" height="6" rx="3" fill="var(--c-accent-3)" fill-opacity="0.8"/>

  <text class="ep-number" x="1164" y="594" text-anchor="end">00</text>
</svg>
