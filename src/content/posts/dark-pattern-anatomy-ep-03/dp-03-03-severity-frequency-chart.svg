<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 680 480"
  font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>12가지 다크패턴 유형의 발견 빈도와 규제 심각도 분포</title>
  <desc>12유형의 발견 빈도(x축)와 규제 심각도(y축)를 버블 차트로 시각화. 고위험·중위험·저위험 3구간 색상 분류.</desc>

  <defs>
    <style>
      .bg {
        fill: #FAFAF7;
      }

      .axis-line {
        stroke: #5F5E5A;
        stroke-width: 1;
        fill: none;
      }

      .grid-line {
        stroke: #5F5E5A;
        stroke-opacity: 0.1;
        stroke-width: 0.5;
      }

      .axis-text {
        fill: #5F5E5A;
        font-size: 10px;
      }

      .axis-title {
        fill: #5F5E5A;
        font-size: 12px;
        font-weight: 500;
      }

      .label-text {
        fill: #5F5E5A;
        font-size: 9px;
      }

      .legend-text {
        fill: #8B8A85;
        font-size: 10px;
      }

      /* 고위험 (y>=70) */
      .bubble-high {
        fill: rgba(226, 75, 74, 0.55);
        stroke: #A32D2D;
        stroke-width: 1;
      }

      /* 중위험 (y>=45) */
      .bubble-mid {
        fill: rgba(186, 117, 23, 0.45);
        stroke: #854F0B;
        stroke-width: 1;
      }

      /* 저위험 */
      .bubble-low {
        fill: rgba(136, 135, 128, 0.35);
        stroke: #5F5E5A;
        stroke-width: 1;
      }

      .legend-high {
        fill: rgba(226, 75, 74, 0.55);
      }

      .legend-mid {
        fill: rgba(186, 117, 23, 0.45);
      }

      .legend-low {
        fill: rgba(136, 135, 128, 0.35);
      }

      @media (prefers-color-scheme: dark) {
        .bg {
          fill: #1A1A18;
        }

        .axis-line {
          stroke: #B4B2A9;
        }

        .grid-line {
          stroke: #B4B2A9;
          stroke-opacity: 0.08;
        }

        .axis-text {
          fill: #B4B2A9;
        }

        .axis-title {
          fill: #B4B2A9;
        }

        .label-text {
          fill: #B4B2A9;
        }

        .legend-text {
          fill: #888780;
        }

        .bubble-high {
          fill: rgba(240, 149, 149, 0.45);
          stroke: #E24B4A;
        }

        .bubble-mid {
          fill: rgba(239, 159, 39, 0.35);
          stroke: #BA7517;
        }

        .bubble-low {
          fill: rgba(180, 178, 169, 0.25);
          stroke: #888780;
        }

        .legend-high {
          fill: rgba(240, 149, 149, 0.45);
        }

        .legend-mid {
          fill: rgba(239, 159, 39, 0.35);
        }

        .legend-low {
          fill: rgba(180, 178, 169, 0.25);
        }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="20" width="680" height="460" />

  <!-- ============================================
       PLOT AREA
       Plot box: x=70~650 (width 580), y=40~370 (height 330)
       X domain: 10~100, Y domain: 15~100
       ============================================ -->

  <!-- Y-axis grid lines (every 20) -->
  <g>
    <!-- y=20 -->
    <line class="grid-line" x1="70" y1="370" x2="650" y2="370" />
    <!-- y=40 -->
    <line class="grid-line" x1="70" y1="292.4" x2="650" y2="292.4" />
    <!-- y=60 -->
    <line class="grid-line" x1="70" y1="214.7" x2="650" y2="214.7" />
    <!-- y=80 -->
    <line class="grid-line" x1="70" y1="137.1" x2="650" y2="137.1" />
    <!-- y=100 -->
    <line class="grid-line" x1="70" y1="60" x2="650" y2="60" />
  </g>

  <!-- X-axis grid lines (every 20) -->
  <g>
    <!-- x=20 -->
    <line class="grid-line" x1="134.4" y1="40" x2="134.4" y2="370" />
    <!-- x=40 -->
    <line class="grid-line" x1="263.3" y1="40" x2="263.3" y2="370" />
    <!-- x=60 -->
    <line class="grid-line" x1="392.2" y1="40" x2="392.2" y2="370" />
    <!-- x=80 -->
    <line class="grid-line" x1="521.1" y1="40" x2="521.1" y2="370" />
    <!-- x=100 -->
    <line class="grid-line" x1="650" y1="40" x2="650" y2="370" />
  </g>

  <!-- Y-axis -->
  <line class="axis-line" x1="70" y1="40" x2="70" y2="370" />
  <!-- X-axis -->
  <line class="axis-line" x1="70" y1="370" x2="650" y2="370" />

  <!-- Y-axis labels -->
  <g>
    <text class="axis-text" x="62" y="373" text-anchor="end">20</text>
    <text class="axis-text" x="62" y="295.4" text-anchor="end">40</text>
    <text class="axis-text" x="62" y="217.7" text-anchor="end">60</text>
    <text class="axis-text" x="62" y="140.1" text-anchor="end">80</text>
    <text class="axis-text" x="62" y="63" text-anchor="end">100</text>
  </g>

  <!-- X-axis labels -->
  <g>
    <text class="axis-text" x="134.4" y="386" text-anchor="middle">20</text>
    <text class="axis-text" x="263.3" y="386" text-anchor="middle">40</text>
    <text class="axis-text" x="392.2" y="386" text-anchor="middle">60</text>
    <text class="axis-text" x="521.1" y="386" text-anchor="middle">80</text>
    <text class="axis-text" x="650" y="386" text-anchor="middle">100</text>
  </g>

  <!-- Axis titles -->
  <text class="axis-title" x="360" y="408" text-anchor="middle">발견 빈도 →</text>
  <text class="axis-title" x="-205" y="22" transform="rotate(-90)" text-anchor="middle">규제 심각도 →</text>

  <!-- ============================================
       BUBBLES
       coord: x_svg = 70 + (x-10)/90*580, y_svg = 40 + (100-y)/85*330
       ============================================ -->

  <!-- 고위험 (y>=70) - 빨강 -->
  <!-- Forced continuity (90, 90, r=14) -->
  <circle class="bubble-high" cx="585.6" cy="98.8" r="14" />
  <text class="label-text" x="585.6" y="78" text-anchor="middle">Forced Continuity</text>

  <!-- Roach motel (85, 80, r=12) -->
  <circle class="bubble-high" cx="553.3" cy="137.6" r="12" />
  <text class="label-text" x="553.3" y="119" text-anchor="middle">Roach Motel</text>

  <!-- Hidden costs (75, 85, r=11) -->
  <circle class="bubble-high" cx="488.9" cy="118.2" r="11" />
  <text class="label-text" x="488.9" y="100" text-anchor="middle">Hidden Costs</text>

  <!-- Sneak into basket (70, 75, r=10) -->
  <circle class="bubble-high" cx="456.7" cy="157.1" r="10" />
  <text class="label-text" x="456.7" y="140" text-anchor="middle">Sneak into Basket</text>

  <!-- Privacy zuckering (80, 70, r=10) -->
  <circle class="bubble-high" cx="521.1" cy="176.5" r="10" />
  <text class="label-text" x="521.1" y="159" text-anchor="middle">Privacy Zuckering</text>

  <!-- 중위험 (45 <= y < 70) - 주황 -->
  <!-- Confirmshaming (65, 50, r=9) -->
  <circle class="bubble-mid" cx="424.4" cy="254.1" r="9" />
  <text class="label-text" x="424.4" y="237" text-anchor="middle">Confirmshaming</text>

  <!-- Misdirection (40, 45, r=8) -->
  <circle class="bubble-mid" cx="263.3" cy="273.5" r="8" />
  <text class="label-text" x="263.3" y="257" text-anchor="middle">Misdirection</text>

  <!-- Trick questions (50, 55, r=8) -->
  <circle class="bubble-mid" cx="327.8" cy="234.7" r="8" />
  <text class="label-text" x="327.8" y="218" text-anchor="middle">Trick Questions</text>

  <!-- Friend spam (25, 55, r=8) -->
  <circle class="bubble-mid" cx="166.7" cy="234.7" r="8" />
  <text class="label-text" x="166.7" y="218" text-anchor="middle">Friend Spam</text>

  <!-- 저위험 - 회색 -->
  <!-- Bait and switch (60, 40, r=7) -->
  <circle class="bubble-low" cx="392.2" cy="292.9" r="7" />
  <text class="label-text" x="392.2" y="277" text-anchor="middle">Bait and Switch</text>

  <!-- Price comparison (30, 30, r=7) -->
  <circle class="bubble-low" cx="198.9" cy="331.8" r="7" />
  <text class="label-text" x="198.9" y="316" text-anchor="middle">Price Comparison</text>

  <!-- Disguised ads (55, 35, r=7) -->
  <circle class="bubble-low" cx="360" cy="312.4" r="7" />
  <text class="label-text" x="360" y="296" text-anchor="middle">Disguised Ads</text>

  <!-- ============================================
       LEGEND
       ============================================ -->
  <g transform="translate(70, 425)">
    <!-- 고위험 -->
    <rect class="legend-high" x="0" y="0" width="10" height="10" rx="2" />
    <text class="legend-text" x="16" y="9">고위험 (규제 대상)</text>

    <!-- 중위험 -->
    <rect class="legend-mid" x="148" y="0" width="10" height="10" rx="2" />
    <text class="legend-text" x="164" y="9">중위험 (회색지대)</text>

    <!-- 저위험 -->
    <rect class="legend-low" x="296" y="0" width="10" height="10" rx="2" />
    <text class="legend-text" x="312" y="9">저위험 (주의 필요)</text>
  </g>

  <!-- Caption -->
  <text x="340" y="472" text-anchor="middle" font-size="11" fill="#8B8A85">▲ 버블 크기 = 상대적 영향 규모, Y축 ≥ 70 구간에 규제 대상 패턴이
    집중</text>
</svg>