<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">시간의 경계와 이벤트 기반 처리: ep.06 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="20%" cy="34%" r="48%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="82%" cy="72%" r="46%">
      <stop offset="0%" stop-color="var(--c-accent-4)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="var(--c-accent-4)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <circle cx="1150" cy="530" r="230" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="-120" y="-130" width="480" height="340" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(-7 120 40)"/>

  <!-- 메타포: 갈라지는 시간선 -->
  <g transform="translate(600 315)">
    <!-- 기준 시간축 -->
    <line x1="-420" y1="0" x2="420" y2="0" stroke="var(--c-line)" stroke-width="2" opacity="0.35"/>
    <!-- 눈금 -->
    <g stroke="var(--c-line)" stroke-width="1.4" opacity="0.3">
      <line x1="-330" y1="-8" x2="-330" y2="8"/>
      <line x1="-180" y1="-8" x2="-180" y2="8"/>
      <line x1="-30" y1="-8" x2="-30" y2="8"/>
      <line x1="120" y1="-8" x2="120" y2="8"/>
      <line x1="270" y1="-8" x2="270" y2="8"/>
    </g>

    <!-- 요청 지점 -->
    <g transform="translate(-330 0)">
      <circle r="16" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="3"/>
      <circle r="6" fill="var(--c-accent-2)"/>
      <circle r="34" fill="none" stroke="var(--c-line)" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.5"/>
    </g>

    <!-- 갈래 1: 응답 (위로, 빠르게 끝남) -->
    <path d="M -330 0 Q -240 -80 -110 -96" fill="none" stroke="var(--c-accent-2)" stroke-width="3.4"/>
    <g transform="translate(-110 -96) rotate(-6)">
      <rect x="-70" y="-32" width="140" height="64" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.6"/>
      <polyline points="-34,4 -16,20 34,-22" fill="none" stroke="var(--c-accent-2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 갈래 2: 큐를 거쳐 나중에 완료 (아래로, 길게) -->
    <path d="M -330 0 Q -250 70 -140 92" fill="none" stroke="var(--c-accent-4)" stroke-width="3"/>
    <!-- 큐 (박스 3개) -->
    <g transform="translate(-40 100) rotate(4)">
      <rect x="-100" y="-30" width="60" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.4"/>
      <rect x="-30" y="-30" width="60" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.4" opacity="0.75"/>
      <rect x="40" y="-30" width="60" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.4" opacity="0.5"/>
      <circle cx="-70" cy="0" r="9" fill="var(--c-accent-4)" opacity="0.8"/>
      <circle cx="0" cy="0" r="9" fill="var(--c-accent-4)" opacity="0.55"/>
      <circle cx="70" cy="0" r="9" fill="var(--c-accent-4)" opacity="0.3"/>
      <rect x="-114" y="-44" width="228" height="88" rx="8" fill="none" stroke="var(--c-accent-4)" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.6"/>
    </g>
    <path d="M 80 106 Q 200 120 300 76" fill="none" stroke="var(--c-accent-4)" stroke-width="3" stroke-dasharray="9 6"/>
    <!-- 완료 지점 -->
    <g transform="translate(330 66) rotate(6)">
      <rect x="-64" y="-30" width="128" height="60" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.6"/>
      <rect x="-44" y="-12" width="88" height="8" rx="4" fill="var(--c-accent-4)" opacity="0.75"/>
      <rect x="-44" y="2" width="56" height="8" rx="4" fill="var(--c-accent-4)" opacity="0.4"/>
    </g>

    <!-- 두 시점 사이 구간 표시 -->
    <g opacity="0.65">
      <line x1="-110" y1="-140" x2="-110" y2="-118" stroke="var(--c-accent-2)" stroke-width="2"/>
      <line x1="330" y1="-140" x2="330" y2="30" stroke="var(--c-accent-4)" stroke-width="1.6" stroke-dasharray="4 5"/>
      <line x1="-110" y1="-140" x2="330" y2="-140" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="6 5"/>
      <circle cx="110" cy="-140" r="7" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.4"/>
    </g>

    <!-- 상단 디테일: 작은 점 무리 -->
    <g transform="translate(-300 -190)">
      <circle r="5" fill="var(--c-accent-3)"/>
      <circle cx="20" r="5" fill="var(--c-accent-3)" opacity="0.6"/>
      <circle cx="40" r="5" fill="var(--c-accent-3)" opacity="0.3"/>
    </g>

    <!-- 하단 디테일: 미니 바 -->
    <g transform="translate(-380 200) rotate(-6)">
      <rect width="90" height="9" rx="4.5" fill="var(--c-accent-2)" opacity="0.75"/>
      <rect y="18" width="60" height="9" rx="4.5" fill="var(--c-accent-2)" opacity="0.45"/>
      <rect y="36" width="74" height="9" rx="4.5" fill="var(--c-accent-2)" opacity="0.22"/>
    </g>
  </g>

  <!-- 디테일 -->
  <g transform="translate(1030 150)" opacity="0.65">
    <circle r="44" fill="none" stroke="var(--c-accent)" stroke-width="1.5"/>
    <circle r="24" fill="none" stroke="var(--c-accent)" stroke-width="1.5" opacity="0.6"/>
  </g>
  <g transform="translate(120 500) rotate(14)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-4)" stroke-width="1.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">06</text>
</svg>
