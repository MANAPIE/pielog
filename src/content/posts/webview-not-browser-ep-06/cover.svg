<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="웹뷰는 브라우저가 아니다 ep.06 cover">
  <style>
  :root {
    --c-bg: #EEF5F6;
    --c-fg: #10202A;
    --c-muted: #5E7480;
    --c-accent: #0E7490; --c-accent-2: #22B8CF; --c-accent-3: #C98A3B;
    --c-num: rgba(14, 116, 144, 0.14);
    --c-dot: rgba(14, 116, 144, 0.10);
    --c-line: rgba(14, 116, 144, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-bg: #0A161A;
      --c-fg: #DCE8EA;
      --c-muted: #8AA0A8;
      --c-accent: #4DD4EC; --c-accent-2: #0E7490; --c-accent-3: #E0A860;
      --c-num: rgba(77, 212, 236, 0.15);
      --c-dot: rgba(77, 212, 236, 0.10);
      --c-line: rgba(77, 212, 236, 0.20);
    }
  }
  .cover-bg { fill: var(--c-bg); }
  .ep-number {
    font: 900 240px ui-monospace, "SF Mono", Menlo, monospace;
    fill: var(--c-num); letter-spacing: -0.04em;
  }
</style>
  <defs>
    <pattern id="dots-wnb06" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="var(--c-dot)"/>
    </pattern>
    <pattern id="hatch-wnb06" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="var(--c-accent-3)" stroke-width="1.3" stroke-opacity="0.3"/>
    </pattern>
    <radialGradient id="halo-wnb06a" cx="0.20" cy="0.80" r="0.58">
      <stop offset="0" stop-color="var(--c-accent)" stop-opacity="0.26"/>
      <stop offset="1" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-wnb06b" cx="0.80" cy="0.16" r="0.60">
      <stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.30"/>
      <stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
    <!-- 앱 레이어가 덮는 영역 -->
    <clipPath id="sheet-clip-wnb06">
      <rect x="-160" y="-340" width="680" height="760" rx="30" transform="translate(660 300) rotate(9)"/>
    </clipPath>
  </defs>

  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-wnb06)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb06a)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb06b)"/>

  <!-- 배경 무채 stroke 도형 (오프캔버스) -->
  <rect x="-250" y="300" width="600" height="600" rx="56" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(-14 50 600)"/>
  <circle cx="1090" cy="-70" r="330" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <circle cx="1090" cy="-70" r="240" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>

  <!-- 우리가 선언한 화면: 색이 온전히 살아 있는 상태 -->
  <g transform="translate(450 320) rotate(-5)">
