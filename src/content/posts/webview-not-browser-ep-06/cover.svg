    <line x1="-196" y1="-63.5" x2="90" y2="-63.5" stroke="var(--c-accent)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.33"/>
    <rect x="-196" y="-30" width="60" height="60" rx="12" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="-120" y="-30" width="60" height="60" rx="12" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-opacity="0.56"/>
    <rect x="-44" y="-30" width="60" height="60" rx="12" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-opacity="0.72"/>
    <rect x="32" y="-30" width="60" height="60" rx="12" fill="var(--c-accent)" fill-opacity="0.22" stroke="var(--c-accent)" stroke-width="2" stroke-opacity="0.86"/>
    <rect x="108" y="-30" width="60" height="60" rx="12" fill="var(--c-accent)" fill-opacity="0.5" stroke="var(--c-accent)" stroke-width="2"/>
    <rect x="-196" y="52" width="180" height="54" rx="27" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.5"/>
    <rect x="-172" y="74" width="90" height="10" rx="5" fill="var(--c-accent)" fill-opacity="0.6"/>
    <rect x="0" y="52" width="168" height="54" rx="27" fill="none" stroke="var(--c-accent)" stroke-width="2.5" stroke-dasharray="9 7"/>
  </g>

