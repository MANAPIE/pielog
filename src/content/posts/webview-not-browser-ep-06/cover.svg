    <rect x="-176" y="-40" width="16" height="80" rx="8" fill="var(--c-accent-3)"/>
  </g>

  <!-- 레이어에 덮인 만큼만 다시 칠해지는 같은 화면 -->
  <g clip-path="url(#sheet-clip-wnb06)">
    <g transform="translate(450 320) rotate(-5)">
      <rect x="-235" y="-165" width="470" height="330" rx="18" fill="var(--c-bg)"/>
      <rect x="-235" y="-165" width="470" height="330" rx="18" fill="var(--c-accent-3)" fill-opacity="0.11"/>
      <rect x="-235" y="-165" width="470" height="330" rx="18" fill="none" stroke="var(--c-accent-3)" stroke-width="3"/>
      <rect x="-223" y="-153" width="446" height="306" rx="12" fill="none" stroke="var(--c-accent-3)" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="-196" y="-128" width="196" height="22" rx="11" fill="none" stroke="var(--c-accent-3)" stroke-width="2.2"/>
      <line x1="-196" y1="-85.5" x2="114" y2="-85.5" stroke="var(--c-accent-3)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
      <line x1="-196" y1="-63.5" x2="90" y2="-63.5" stroke="var(--c-accent-3)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.33"/>
      <rect x="-196" y="-30" width="60" height="60" rx="12" fill="none" stroke="var(--c-accent-3)" stroke-width="2" stroke-opacity="0.4"/>
      <rect x="-120" y="-30" width="60" height="60" rx="12" fill="none" stroke="var(--c-accent-3)" stroke-width="2" stroke-opacity="0.56"/>
      <rect x="-44" y="-30" width="60" height="60" rx="12" fill="none" stroke="var(--c-accent-3)" stroke-width="2" stroke-opacity="0.72"/>
      <rect x="32" y="-30" width="60" height="60" rx="12" fill="var(--c-accent-3)" fill-opacity="0.22" stroke="var(--c-accent-3)" stroke-width="2" stroke-opacity="0.86"/>
      <rect x="108" y="-30" width="60" height="60" rx="12" fill="var(--c-accent-3)" fill-opacity="0.5" stroke="var(--c-accent-3)" stroke-width="2"/>
      <rect x="-196" y="52" width="180" height="54" rx="27" fill="none" stroke="var(--c-accent-3)" stroke-width="2.5"/>
      <rect x="-172" y="74" width="90" height="10" rx="5" fill="var(--c-accent-3)" fill-opacity="0.6"/>
      <rect x="0" y="52" width="168" height="54" rx="27" fill="none" stroke="var(--c-accent-3)" stroke-width="2.5" stroke-dasharray="9 7"/>
    </g>
  </g>

  <!-- 레이어의 경계선 -->
  <g transform="translate(660 300) rotate(9)">
    <rect x="-160" y="-340" width="680" height="760" rx="30" fill="none" stroke="var(--c-accent-3)" stroke-width="3"/>
    <rect x="-130" y="-310" width="620" height="700" rx="22" fill="none" stroke="var(--c-accent-3)" stroke-width="2" stroke-dasharray="10 9" stroke-opacity="0.55"/>
  </g>

  <!-- 흩어진 디테일 -->
  <circle cx="1010" cy="210" r="58" fill="none" stroke="var(--c-accent-3)" stroke-width="2" stroke-dasharray="4 9" stroke-opacity="0.55"/>
  <circle cx="1010" cy="210" r="34" fill="none" stroke="var(--c-accent)" stroke-width="2.5"/>
  <circle cx="1010" cy="210" r="14" fill="var(--c-accent-3)"/>
  <polygon points="296,58 352,58 324,110" fill="none" stroke="var(--c-accent-3)" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="96" y="52" width="86" height="86" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5" transform="rotate(13 139 95)"/>
  <line x1="168" y1="196" x2="146" y2="330" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="6 9" stroke-opacity="0.5"/>
  <circle cx="468" cy="548" r="9" fill="var(--c-accent-3)"/>
  <circle cx="496" cy="570" r="6" fill="var(--c-accent)"/>
  <circle cx="452" cy="578" r="7" fill="none" stroke="var(--c-accent-2)" stroke-width="2"/>
  <rect x="76" y="468" width="58" height="13" rx="5" fill="var(--c-accent-2)" fill-opacity="0.6"/>
  <rect x="104" y="490" width="34" height="8" rx="4" fill="var(--c-accent-3)" fill-opacity="0.8"/>
  <line x1="76" y1="514" x2="170" y2="514" stroke="var(--c-accent-2)" stroke-width="1.6" stroke-dasharray="5 7" stroke-opacity="0.5"/>

  <text class="ep-number" x="1164" y="594" text-anchor="end">06</text>
</svg>
