<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="IT UX 가이드 ep.10 cover">
  <style>
  :root { --c-bg: #F8F3EE; --c-fg: #1A1F2E; --c-muted: #6B7280; --c-accent: #B4502A; --c-accent-2: #C9A227; --c-accent-3: #6E3A78; --c-num: rgba(180,80,42, 0.14); --c-dot: rgba(180,80,42, 0.12); --c-line: rgba(26, 31, 46, 0.14); }
  @media (prefers-color-scheme: dark) { :root { --c-bg: #17120F; --c-fg: #E8E6E1; --c-muted: #8B92A0; --c-accent: #F0956E; --c-accent-2: #E8C45A; --c-accent-3: #C08FE0; --c-num: rgba(240,149,110, 0.16); --c-dot: rgba(240,149,110, 0.12); --c-line: rgba(232, 230, 225, 0.16); } }
  .cover-bg { fill: var(--c-bg); }
  .ep-number { font: 900 240px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-num); letter-spacing: -0.04em; }
  </style>
  <defs>
    <pattern id="dots-ux10" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.4" fill="var(--c-dot)"/></pattern>
    <radialGradient id="halo-ux10a" cx="0.2" cy="0.2" r="0.6"><stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.26"/><stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-ux10b" cx="0.85" cy="0.8" r="0.55"><stop offset="0" stop-color="var(--c-accent)" stop-opacity="0.24"/><stop offset="1" stop-color="var(--c-accent)" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-ux10)"/>
  <rect width="1200" height="630" fill="url(#halo-ux10a)"/>
  <rect width="1200" height="630" fill="url(#halo-ux10b)"/>
  <circle cx="80" cy="80" r="300" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <rect x="760" y="300" width="560" height="560" rx="52" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(-10 1040 580)"/>

  <!-- 메타포: 위계 트리, 한 가지만 짙고 나머지는 흐릿하다. 사용자가 찾는 경로 -->
  <g transform="translate(600 150) rotate(4)">
    <g stroke="var(--c-fg)" stroke-width="3" opacity="0.35">
      <line x1="0" y1="0" x2="-300" y2="120"/><line x1="0" y1="0" x2="-100" y2="120"/><line x1="0" y1="0" x2="100" y2="120"/><line x1="0" y1="0" x2="300" y2="120"/>
      <line x1="-300" y1="120" x2="-380" y2="240"/><line x1="-300" y1="120" x2="-300" y2="240"/><line x1="-300" y1="120" x2="-220" y2="240"/>
      <line x1="-100" y1="120" x2="-140" y2="240"/><line x1="-100" y1="120" x2="-60" y2="240"/>
      <line x1="300" y1="120" x2="220" y2="240"/><line x1="300" y1="120" x2="300" y2="240"/><line x1="300" y1="120" x2="380" y2="240"/>
      <line x1="100" y1="120" x2="60" y2="240"/>
    </g>
    <g stroke="var(--c-accent)" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="100" y2="120"/><line x1="100" y1="120" x2="140" y2="240"/><line x1="140" y1="240" x2="170" y2="360"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="var(--c-fg)"/>
    <g fill="var(--c-fg)" opacity="0.35"><circle cx="-300" cy="120" r="14"/><circle cx="-100" cy="120" r="14"/><circle cx="300" cy="120" r="14"/>
      <circle cx="-380" cy="240" r="10"/><circle cx="-300" cy="240" r="10"/><circle cx="-220" cy="240" r="10"/><circle cx="-140" cy="240" r="10"/><circle cx="-60" cy="240" r="10"/><circle cx="60" cy="240" r="10"/><circle cx="220" cy="240" r="10"/><circle cx="300" cy="240" r="10"/><circle cx="380" cy="240" r="10"/></g>
    <circle cx="100" cy="120" r="18" fill="var(--c-accent)"/>
    <circle cx="140" cy="240" r="14" fill="var(--c-accent)"/>
    <circle cx="170" cy="360" r="26" fill="var(--c-accent-2)"/>
    <circle cx="170" cy="360" r="44" fill="none" stroke="var(--c-accent-2)" stroke-width="3" stroke-dasharray="5 7"/>
  </g>

  <g transform="translate(150 420) rotate(-8)"><rect width="150" height="12" rx="6" fill="var(--c-accent-3)" fill-opacity="0.7"/><rect y="24" width="96" height="12" rx="6" fill="var(--c-accent)" fill-opacity="0.7"/><rect y="48" width="120" height="12" rx="6" fill="var(--c-accent-2)" fill-opacity="0.7"/></g>
  <g fill="var(--c-accent-3)"><circle cx="1000" cy="110" r="9"/><circle cx="1030" cy="126" r="6" opacity="0.7"/><circle cx="988" cy="142" r="5" opacity="0.5"/><circle cx="1020" cy="154" r="4" opacity="0.4"/></g>
  <rect x="120" y="150" width="90" height="90" rx="14" fill="none" stroke="var(--c-accent-2)" stroke-width="3" transform="rotate(-12 165 195)"/>
  <polygon points="1110,60 1156,140 1064,140" fill="var(--c-accent)" fill-opacity="0.5"/>
  <text class="ep-number" x="1164" y="594" text-anchor="end">10</text>
</svg>
