  <circle cx="199.0" cy="128" r="3" fill="var(--c-accent)" opacity="0.7" />
  <text x="38" y="156" class="nm">위계(hierarchy)</text>
  <text x="38" y="176" class="cap">앱과 사이트의 기본 구조입니다.</text>
  <text x="38" y="194" class="cap">깊어지면 위치를 잃기 쉽습니다.</text>
  <rect x="258" y="52" width="218" height="160" rx="8" class="card" stroke="var(--c-divider)" />
  <rect x="290" y="90.0" width="24" height="20" rx="4" fill="var(--c-accent-3)" />
  <line x1="316" y1="100.0" x2="332" y2="100.0" stroke="var(--c-accent-3)" stroke-width="1.4" marker-end="url(#a-fs-c)" />
  <rect x="334" y="90.0" width="24" height="20" rx="4" fill="var(--c-accent-3)" />
  <line x1="360" y1="100.0" x2="376" y2="100.0" stroke="var(--c-accent-3)" stroke-width="1.4" marker-end="url(#a-fs-c)" />
  <rect x="378" y="90.0" width="24" height="20" rx="4" fill="var(--c-accent-3)" />
