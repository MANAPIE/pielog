  <text x="272" y="352" class="cap">위키처럼 자유롭게 연결됩니다.</text>
  <text x="272" y="370" class="cap">혼자 쓰면 길을 잃기 쉽습니다.</text>
  <text x="24" y="416" class="cap">대부분은 위계를 기본으로 두고, 나머지를 보조로 얹습니다.</text>
