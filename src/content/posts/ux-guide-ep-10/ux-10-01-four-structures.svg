  <rect x="160.0" y="293" width="20" height="12" rx="2" fill="var(--c-accent-2)" opacity="0.22" />
  <text x="38" y="332" class="nm">다면(faceted)</text>
  <text x="38" y="352" class="cap">브랜드 × 가격 × 카테고리로 좁힙니다.</text>
  <text x="38" y="370" class="cap">속성이 여럿인 목록에 맞습니다.</text>
