  <rect x="422" y="90.0" width="24" height="20" rx="4" fill="var(--c-accent-3)" />
  <text x="272" y="156" class="nm">순차(sequence)</text>
  <text x="272" y="176" class="cap">가입·결제·온보딩에 맞습니다.</text>
  <text x="272" y="194" class="cap">처음과 끝이 정해진 흐름입니다.</text>
