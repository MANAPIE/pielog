<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title-tw-04-01">
  <title id="title-tw-04-01">레퍼런스 문서의 스펙트럼</title>
  <style>
    svg {
      --c-fg: #1A1A1A;
      --c-muted: #6B6862;
      --c-accent: #2D3E78;
      --c-accent-2: #B8924A;
      --c-accent-3: #9A3B3B;
      --c-line: rgba(0, 0, 0, 0.22);
      --c-card-bg: #FBF8F1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-fg: #F5F1E8;
        --c-muted: #A8A39A;
        --c-accent: #8FA3E8;
        --c-accent-2: #E6C98A;
        --c-accent-3: #D87878;
        --c-line: rgba(255, 255, 255, 0.20);
        --c-card-bg: #232326;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: var(--c-fg); }
    .card { fill: var(--c-card-bg); stroke: var(--c-line); stroke-width: 1; }
    .col-title { font-size: 14px; font-weight: 700; }
    .col-tag { font-size: 10px; font-weight: 600; fill: var(--c-muted); letter-spacing: 0.5px; }
    .col-desc { font-size: 11px; fill: var(--c-muted); }
    .axis-label { font-size: 11px; fill: var(--c-muted); font-weight: 600; letter-spacing: 0.5px; }
    .axis-line { stroke: var(--c-muted); stroke-width: 1.5; fill: none; }
    .gauge-fill { fill: var(--c-accent); }
    .gauge-empty { fill: var(--c-line); }
  </style>

  <!-- 축 라벨 -->
  <text class="axis-label" x="20" y="40" text-anchor="start">← 작성 비용 높음</text>
  <text class="axis-label" x="680" y="40" text-anchor="end">자동 생성 가능 →</text>
  <line class="axis-line" x1="20" y1="50" x2="680" y2="50"/>
  <polygon points="680,50 670,46 670,54" fill="var(--c-muted)"/>

  <!-- 4개 컬럼 -->
  <!-- 1. 사람이 쓴 가이드 -->
  <g transform="translate(20 80)">
    <rect class="card" x="0" y="0" width="155" height="300" rx="6"/>
    <text class="col-tag" x="14" y="22">PROSE</text>
    <text class="col-title" x="14" y="42">개념 가이드</text>
    <text class="col-desc" x="14" y="64">사람이 사람을 위해</text>
    <text class="col-desc" x="14" y="78">쓴 산문.</text>
    <text class="col-desc" x="14" y="110">예) "인증 모델"</text>
    <text class="col-desc" x="14" y="124">"트랜잭션 격리"</text>

    <!-- 자동화 게이지 -->
    <text class="col-tag" x="14" y="180">자동화</text>
    <rect class="gauge-empty" x="14" y="190" width="120" height="6" rx="3"/>
    <rect class="gauge-fill" x="14" y="190" width="10" height="6" rx="3"/>

    <text class="col-tag" x="14" y="220">유지비용</text>
    <text class="col-desc" x="14" y="240">변경 시 수동 갱신</text>
    <text class="col-desc" x="14" y="254">설명 책임 큼</text>
  </g>

  <!-- 2. docstring -->
  <g transform="translate(195 80)">
    <rect class="card" x="0" y="0" width="155" height="300" rx="6"/>
    <text class="col-tag" x="14" y="22">DOCSTRING</text>
    <text class="col-title" x="14" y="42">독스트링</text>
    <text class="col-desc" x="14" y="64">코드 안에 함께</text>
    <text class="col-desc" x="14" y="78">사는 사용 설명.</text>
    <text class="col-desc" x="14" y="110">예) Python 함수</text>
    <text class="col-desc" x="14" y="124">JSDoc, KDoc</text>

    <text class="col-tag" x="14" y="180">자동화</text>
    <rect class="gauge-empty" x="14" y="190" width="120" height="6" rx="3"/>
    <rect class="gauge-fill" x="14" y="190" width="55" height="6" rx="3"/>

    <text class="col-tag" x="14" y="220">유지비용</text>
    <text class="col-desc" x="14" y="240">코드와 함께 수정</text>
    <text class="col-desc" x="14" y="254">자연스러운 동거</text>
  </g>

  <!-- 3. 타입 시그니처 -->
  <g transform="translate(370 80)">
    <rect class="card" x="0" y="0" width="155" height="300" rx="6"/>
    <text class="col-tag" x="14" y="22">SIGNATURE</text>
    <text class="col-title" x="14" y="42">시그니처</text>
    <text class="col-desc" x="14" y="64">타입 시스템이 그</text>
    <text class="col-desc" x="14" y="78">자체로 문서가 됨.</text>
    <text class="col-desc" x="14" y="110">예) TypeScript</text>
    <text class="col-desc" x="14" y="124">Rust traits</text>

    <text class="col-tag" x="14" y="180">자동화</text>
    <rect class="gauge-empty" x="14" y="190" width="120" height="6" rx="3"/>
    <rect class="gauge-fill" x="14" y="190" width="100" height="6" rx="3"/>

    <text class="col-tag" x="14" y="220">유지비용</text>
    <text class="col-desc" x="14" y="240">컴파일러가 강제</text>
    <text class="col-desc" x="14" y="254">거짓말 불가능</text>
  </g>

  <!-- 4. 스펙 -->
  <g transform="translate(545 80)">
    <rect class="card" x="0" y="0" width="135" height="300" rx="6"/>
    <text class="col-tag" x="14" y="22">SPEC</text>
    <text class="col-title" x="14" y="42">스펙</text>
    <text class="col-desc" x="14" y="64">기계가 읽는</text>
    <text class="col-desc" x="14" y="78">스키마.</text>
    <text class="col-desc" x="14" y="110">예) OpenAPI</text>
    <text class="col-desc" x="14" y="124">GraphQL SDL</text>

    <text class="col-tag" x="14" y="180">자동화</text>
    <rect class="gauge-empty" x="14" y="190" width="105" height="6" rx="3"/>
    <rect class="gauge-fill" x="14" y="190" width="105" height="6" rx="3"/>

    <text class="col-tag" x="14" y="220">유지비용</text>
    <text class="col-desc" x="14" y="240">코드로부터</text>
    <text class="col-desc" x="14" y="254">자동 생성</text>
  </g>

  <!-- 화살표 (왼쪽이 사람 → 오른쪽이 기계) -->
  <text class="axis-label" x="20" y="405" text-anchor="start">사람의 손</text>
  <text class="axis-label" x="680" y="405" text-anchor="end">기계의 손</text>
</svg>
