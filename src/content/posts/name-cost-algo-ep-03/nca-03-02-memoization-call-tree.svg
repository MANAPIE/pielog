<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-memo">
  <title id="t-memo">피보나치 재귀 호출 트리에서 중복 계산이 캐시로 사라지는 비교</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(47,125,110,0.16); --c-soft-2: rgba(194,112,61,0.16);
        --c-dim: rgba(107,114,128,0.30); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(111,195,176,0.20); --c-soft-2: rgba(224,154,107,0.20);
          --c-dim: rgba(139,146,160,0.34); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .lg { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .cl { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.1; }
      .t { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.4; }
      .f { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.1; }
      .st { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .m { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .mk { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; font-weight: 700; }
      .ed { stroke: var(--c-line); stroke-width: 1.3; fill: none; opacity: 0.5; }
      .edd { stroke: var(--c-dim); stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; }
      .kl { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)"/></marker>
  </defs>
  <rect class="bg" width="800" height="400"/>
  <text x="24" y="28" class="ttl">같은 부분 문제를 두 번 계산하지 않습니다</text>
  <text x="24" y="48" class="sub">fib(5)를 구할 때의 호출 트리 · 왼쪽은 그냥 재귀, 오른쪽은 캐시를 쓴 재귀</text>
  <g transform="translate(24 62)"><rect width="376" height="280" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent-2)">그냥 재귀 · 호출 15번</text>
    <line x1="188" y1="65" x2="120" y2="83" class="ed"/>
    <line x1="188" y1="65" x2="256" y2="83" class="ed"/>
    <line x1="120" y1="109" x2="72" y2="127" class="ed"/>
    <line x1="120" y1="109" x2="168" y2="127" class="ed"/>
    <line x1="256" y1="109" x2="216" y2="127" class="ed"/>
    <line x1="256" y1="109" x2="300" y2="127" class="ed"/>
    <line x1="72" y1="153" x2="44" y2="171" class="ed"/>
    <line x1="72" y1="153" x2="104" y2="171" class="ed"/>
    <line x1="168" y1="153" x2="148" y2="171" class="ed"/>
    <line x1="216" y1="153" x2="196" y2="171" class="ed"/>
    <line x1="44" y1="197" x2="28" y2="215" class="ed"/>
    <line x1="44" y1="197" x2="64" y2="215" class="ed"/>
    <circle cx="188" cy="52" r="13" class="cl"/><text x="188" y="56" class="n" text-anchor="middle">5</text>
    <circle cx="120" cy="96" r="13" class="cl"/><text x="120" y="100" class="n" text-anchor="middle">4</text>
    <circle cx="256" cy="96" r="13" class="st"/><text x="256" y="100" class="n" text-anchor="middle">3</text>
    <circle cx="72" cy="140" r="13" class="st"/><text x="72" y="144" class="n" text-anchor="middle">3</text>
    <circle cx="168" cy="140" r="13" class="st"/><text x="168" y="144" class="n" text-anchor="middle">2</text>
    <circle cx="216" cy="140" r="13" class="st"/><text x="216" y="144" class="n" text-anchor="middle">2</text>
    <circle cx="300" cy="140" r="13" class="cl"/><text x="300" y="144" class="n" text-anchor="middle">1</text>
    <circle cx="44" cy="184" r="13" class="st"/><text x="44" y="188" class="n" text-anchor="middle">2</text>
    <circle cx="104" cy="184" r="13" class="cl"/><text x="104" y="188" class="n" text-anchor="middle">1</text>
    <circle cx="148" cy="184" r="13" class="cl"/><text x="148" y="188" class="n" text-anchor="middle">1</text>
    <circle cx="196" cy="184" r="13" class="cl"/><text x="196" y="188" class="n" text-anchor="middle">1</text>
    <circle cx="28" cy="228" r="13" class="cl"/><text x="28" y="232" class="n" text-anchor="middle">1</text>
    <circle cx="64" cy="228" r="13" class="cl"/><text x="64" y="232" class="n" text-anchor="middle">0</text>
    <text x="16" y="262" class="lg">주황은 이미 계산한 적 있는 호출입니다. fib(3)이 2번, fib(2)가 3번 반복됩니다.</text>
  </g>
  <g transform="translate(416 62)"><rect width="360" height="280" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent)">캐시를 쓴 재귀 · 호출 9번</text>
    <line x1="180" y1="65" x2="112" y2="83" class="ed"/>
    <line x1="180" y1="65" x2="248" y2="83" class="ed"/>
    <line x1="112" y1="109" x2="64" y2="127" class="ed"/>
    <line x1="112" y1="109" x2="160" y2="127" class="ed"/>
    <line x1="64" y1="153" x2="36" y2="171" class="ed"/>
    <line x1="64" y1="153" x2="96" y2="171" class="ed"/>
    <line x1="36" y1="197" x2="20" y2="215" class="ed"/>
    <line x1="36" y1="197" x2="56" y2="215" class="ed"/>
    <line x1="248" y1="109" x2="248" y2="134" class="edd"/>
    <circle cx="180" cy="52" r="13" class="cl"/><text x="180" y="56" class="n" text-anchor="middle">5</text>
    <circle cx="112" cy="96" r="13" class="cl"/><text x="112" y="100" class="n" text-anchor="middle">4</text>
    <circle cx="248" cy="96" r="13" class="t"/><text x="248" y="100" class="n" text-anchor="middle">3</text>
    <circle cx="64" cy="140" r="13" class="cl"/><text x="64" y="144" class="n" text-anchor="middle">3</text>
    <circle cx="160" cy="140" r="13" class="t"/><text x="160" y="144" class="n" text-anchor="middle">2</text>
    <circle cx="36" cy="184" r="13" class="cl"/><text x="36" y="188" class="n" text-anchor="middle">2</text>
    <circle cx="96" cy="184" r="13" class="cl"/><text x="96" y="188" class="n" text-anchor="middle">1</text>
    <circle cx="20" cy="228" r="13" class="cl"/><text x="20" y="232" class="n" text-anchor="middle">1</text>
    <circle cx="56" cy="228" r="13" class="cl"/><text x="56" y="232" class="n" text-anchor="middle">0</text>
    <text x="248" y="148" class="m" text-anchor="middle">캐시에서 꺼냄</text>
    <text x="16" y="262" class="lg">초록은 캐시에 있어 바로 반환하는 호출입니다. 아래 가지를 펼치지 않습니다.</text>
  </g>
  <text x="24" y="366" class="sub">각 부분 문제를 한 번씩만 계산하므로 호출 수가 N에 비례합니다. 지수 시간이 선형 시간이 되는 지점이 여기입니다.</text>
  <text x="24" y="386" class="sub">메모이제이션은 이 트리를 위에서 아래로 내려가며 채우고, 타뷸레이션은 같은 값을 배열에 아래에서 위로 채웁니다.</text>
</svg>
