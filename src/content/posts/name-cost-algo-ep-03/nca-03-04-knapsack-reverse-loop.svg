<svg viewBox="0 0 800 414" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-knap">
  <title id="t-knap">배낭 문제에서 안쪽 반복을 역순으로 도는 이유를 순방향과 비교</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(47,125,110,0.16); --c-soft-2: rgba(194,112,61,0.16);
        --c-dim: rgba(107,114,128,0.30); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(111,195,176,0.20); --c-soft-2: rgba(224,154,107,0.20);
          --c-dim: rgba(139,146,160,0.34); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .lg { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .cl { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.1; }
      .t { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.4; }
      .f { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.1; }
      .st { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .m { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .mk { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; font-weight: 700; }
      .ed { stroke: var(--c-line); stroke-width: 1.3; fill: none; opacity: 0.5; }
      .edd { stroke: var(--c-dim); stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; }
      .kl { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)"/></marker>
  </defs>
  <rect class="bg" width="800" height="414"/>
  <text x="24" y="28" class="ttl">반복 방향 하나가 문제의 종류를 바꿉니다</text>
  <text x="24" y="48" class="sub">무게 3, 가치 5짜리 물건 하나를 한도 6인 가방에 담을 때 dp 배열의 변화</text>
  <g transform="translate(24 62)"><rect width="752" height="146" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent-2)">순방향 · w를 3에서 6으로</text>
    <text x="16" y="62" class="m">w</text>
    <text x="104" y="62" class="m" text-anchor="middle">0</text><text x="200" y="62" class="m" text-anchor="middle">1</text><text x="296" y="62" class="m" text-anchor="middle">2</text><text x="392" y="62" class="m" text-anchor="middle">3</text><text x="488" y="62" class="m" text-anchor="middle">4</text><text x="584" y="62" class="m" text-anchor="middle">5</text><text x="680" y="62" class="m" text-anchor="middle">6</text>
    <rect x="70" y="72" width="68" height="28" rx="5" class="cl"/><text x="104" y="90" class="n" text-anchor="middle">0</text>
    <rect x="166" y="72" width="68" height="28" rx="5" class="cl"/><text x="200" y="90" class="n" text-anchor="middle">0</text>
    <rect x="262" y="72" width="68" height="28" rx="5" class="cl"/><text x="296" y="90" class="n" text-anchor="middle">0</text>
    <rect x="358" y="72" width="68" height="28" rx="5" class="st"/><text x="392" y="90" class="n" text-anchor="middle">5</text>
    <rect x="454" y="72" width="68" height="28" rx="5" class="cl"/><text x="488" y="90" class="n" text-anchor="middle">5</text>
    <rect x="550" y="72" width="68" height="28" rx="5" class="cl"/><text x="584" y="90" class="n" text-anchor="middle">5</text>
    <rect x="646" y="72" width="68" height="28" rx="5" class="st"/><text x="680" y="90" class="n" text-anchor="middle">10</text>
    <path d="M 172 100 q 150 28 288 0" class="ed" marker-end="url(#ar)"/>
    <text x="330" y="126" class="lg">w=3에서 넣은 5를 w=6에서 다시 참조해 같은 물건을 두 번 담습니다</text>
  </g>
  <g transform="translate(24 224)"><rect width="752" height="146" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent)">역순 · w를 6에서 3으로</text>
    <text x="16" y="62" class="m">w</text>
    <text x="104" y="62" class="m" text-anchor="middle">0</text><text x="200" y="62" class="m" text-anchor="middle">1</text><text x="296" y="62" class="m" text-anchor="middle">2</text><text x="392" y="62" class="m" text-anchor="middle">3</text><text x="488" y="62" class="m" text-anchor="middle">4</text><text x="584" y="62" class="m" text-anchor="middle">5</text><text x="680" y="62" class="m" text-anchor="middle">6</text>
    <rect x="70" y="72" width="68" height="28" rx="5" class="cl"/><text x="104" y="90" class="n" text-anchor="middle">0</text>
    <rect x="166" y="72" width="68" height="28" rx="5" class="cl"/><text x="200" y="90" class="n" text-anchor="middle">0</text>
    <rect x="262" y="72" width="68" height="28" rx="5" class="cl"/><text x="296" y="90" class="n" text-anchor="middle">0</text>
    <rect x="358" y="72" width="68" height="28" rx="5" class="t"/><text x="392" y="90" class="n" text-anchor="middle">5</text>
    <rect x="454" y="72" width="68" height="28" rx="5" class="cl"/><text x="488" y="90" class="n" text-anchor="middle">5</text>
    <rect x="550" y="72" width="68" height="28" rx="5" class="cl"/><text x="584" y="90" class="n" text-anchor="middle">5</text>
    <rect x="646" y="72" width="68" height="28" rx="5" class="t"/><text x="680" y="90" class="n" text-anchor="middle">5</text>
    <path d="M 460 100 q -150 28 -288 0" class="edd" marker-end="url(#ar)"/>
    <text x="300" y="126" class="lg">w=6을 먼저 계산할 때 w=3은 아직 갱신 전이라 물건을 한 번만 담습니다</text>
  </g>
  <text x="24" y="396" class="sub">물건을 한 번씩만 쓰는 0-1 배낭은 역순, 무제한으로 쓰는 변형은 순방향이 맞습니다. 같은 코드에서 반복 방향만 다릅니다.</text>
</svg>
