    <g transform="rotate(-30)"><line x1="90" y1="0" x2="230" y2="0" stroke="var(--c-accent-3)" stroke-width="2.5" stroke-dasharray="10 10"/><circle cx="270" cy="0" r="44" fill="none" stroke="var(--c-accent-3)" stroke-width="2.5"/><circle cx="270" cy="0" r="24" fill="var(--c-accent-3)" fill-opacity="0.35"/><line x1="303" y1="30" x2="340" y2="64" stroke="var(--c-accent-3)" stroke-width="3.5" stroke-linecap="round"/></g>
    <g transform="rotate(90)"><line x1="90" y1="0" x2="230" y2="0" stroke="var(--c-accent-2)" stroke-width="2.5" stroke-dasharray="10 10"/><circle cx="270" cy="0" r="44" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5"/><circle cx="270" cy="0" r="24" fill="var(--c-accent-2)" fill-opacity="0.35"/><line x1="303" y1="30" x2="340" y2="64" stroke="var(--c-accent-2)" stroke-width="3.5" stroke-linecap="round"/></g>
    <circle r="110" fill="none" stroke="var(--c-fg)" stroke-width="2" stroke-dasharray="4 10" opacity="0.5"/>
  </g>

