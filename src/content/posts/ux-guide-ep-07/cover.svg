    <radialGradient id="halo-ux07b" cx="0.16" cy="0.18" r="0.55"><stop offset="0" stop-color="var(--c-accent)" stop-opacity="0.24"/><stop offset="1" stop-color="var(--c-accent)" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="cover-bg" width="1200" height="630"/>
