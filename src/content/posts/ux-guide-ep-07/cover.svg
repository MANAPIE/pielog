  <circle cx="1100" cy="80" r="300" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <rect x="-140" y="360" width="540" height="440" rx="44" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(10 130 580)"/>

