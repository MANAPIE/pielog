<svg viewBox="0 0 500 486" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tl">
  <title id="t-tl">같은 데이터, 세 렌즈</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-tl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-tl-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="486" />
  <g transform="translate(120 24)">
    <rect width="260" height="44" rx="22" fill="var(--c-card)" stroke="var(--c-fg)" stroke-width="1.6" />
    <text x="130" y="27" class="nm" text-anchor="middle">배달 앱 이탈률 상승</text>
  </g>
  <line x1="250" y1="69" x2="250" y2="86" stroke="var(--c-fg)" stroke-width="1.5" />
  <line x1="96" y1="86" x2="404" y2="86" stroke="var(--c-fg)" stroke-width="1.5" />
  <line x1="96" y1="86" x2="96" y2="100" stroke="var(--c-fg)" stroke-width="1.5" marker-end="url(#a-tl-f)" />
  <g transform="translate(24 108)">
    <rect width="144" height="330" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
    <text x="14" y="26" class="nm">기획자</text>
    <text x="14" y="44" class="cap">구조와 흐름</text>
    <line x1="14" y1="58" x2="130" y2="58" stroke="var(--c-divider)" stroke-width="1" />
    <text x="14" y="80" class="th">도구</text>
    <text x="14" y="100" class="cap">퍼널 · 유저 플로우</text>
    <text x="14" y="116" class="cap">지표 매핑</text>
    <text x="14" y="146" class="th">발견</text>
    <text x="14" y="166" class="td">7단계 주문</text>
    <text x="14" y="184" class="td">쿠폰 시점</text>
    <text x="14" y="214" class="th">강점</text>
    <text x="14" y="234" class="td">전체 여정</text>
    <text x="14" y="264" class="th">맹점</text>
    <text x="14" y="284" class="td">화면 디테일</text>
    <text x="14" y="302" class="td">기술 제약</text>
  </g>
  <line x1="250" y1="86" x2="250" y2="100" stroke="var(--c-fg)" stroke-width="1.5" marker-end="url(#a-tl-f)" />
  <g transform="translate(178 108)">
    <rect width="144" height="330" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
    <text x="14" y="26" class="nm">디자이너</text>
    <text x="14" y="44" class="cap">접점과 감정</text>
    <line x1="14" y1="58" x2="130" y2="58" stroke="var(--c-divider)" stroke-width="1" />
    <text x="14" y="80" class="th">도구</text>
    <text x="14" y="100" class="cap">사용성 테스트</text>
    <text x="14" y="116" class="cap">휴리스틱 평가 · 벤치마킹</text>
    <text x="14" y="146" class="th">발견</text>
    <text x="14" y="166" class="td">가려진 결제 버튼</text>
    <text x="14" y="184" class="td">약한 완료 피드백</text>
    <text x="14" y="214" class="th">강점</text>
    <text x="14" y="234" class="td">접점의 마찰</text>
    <text x="14" y="264" class="th">맹점</text>
    <text x="14" y="284" class="td">우선순위</text>
    <text x="14" y="302" class="td">구현 비용</text>
  </g>
  <line x1="404" y1="86" x2="404" y2="100" stroke="var(--c-fg)" stroke-width="1.5" marker-end="url(#a-tl-f)" />
  <g transform="translate(332 108)">
    <rect width="144" height="330" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="14" y="26" class="nm">개발자</text>
    <text x="14" y="44" class="cap">시스템과 데이터</text>
    <line x1="14" y1="58" x2="130" y2="58" stroke="var(--c-divider)" stroke-width="1" />
    <text x="14" y="80" class="th">도구</text>
    <text x="14" y="100" class="cap">APM · 에러 로그</text>
    <text x="14" y="116" class="cap">호환성 데이터</text>
    <text x="14" y="146" class="th">발견</text>
    <text x="14" y="166" class="td">2.3초 API</text>
    <text x="14" y="184" class="td">0.5% 결제 에러</text>
    <text x="14" y="214" class="th">강점</text>
    <text x="14" y="234" class="td">보이지 않는 문제</text>
    <text x="14" y="264" class="th">맹점</text>
    <text x="14" y="284" class="td">사용자 영향의 크기</text>
    <text x="14" y="302" class="td"></text>
  </g>
  <text x="24" y="470" class="cap">세 렌즈는 모두 맞고, 모두 부분적입니다.</text>
</svg>
