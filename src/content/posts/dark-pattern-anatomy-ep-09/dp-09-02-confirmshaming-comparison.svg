<svg width="100%" viewBox="0 0 800 420" role="img" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Confirmshaming — 할인 쿠폰 팝업 Before/After</title>
  <desc>다크패턴: 자기 비하적 거절 카피 / 정직한 설계: 중립적 행동 서술</desc>
  <defs>
    <style>
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
      .title { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .body { font-size: 11px; fill: #5F5E5A; }
      .annot { font-size: 11px; fill: #5F5E5A; }
      .annot-bold { font-size: 11px; font-weight: 600; }
      .pair-label { font-size: 13px; fill: #888780; font-weight: 500; }
      .big-headline { font-size: 18px; font-weight: 700; fill: #2C2C2A; }
      .page-bg { fill: #F9F8F4; }
      .frame-bg { fill: #F1EFE8; }
      .screen-bg { fill: #FFFFFF; stroke: #D3D1C7; stroke-width: 0.5; }
      .red-tag { fill: #FCEBEB; }
      .red-tag-text { fill: #791F1F; }
      .teal-tag { fill: #E1F5EE; }
      .teal-tag-text { fill: #085041; }
      .red-annot-bg { fill: #FCEBEB; }
      .red-annot-text { fill: #791F1F; }
      .teal-annot-bg { fill: #E1F5EE; }
      .teal-annot-text { fill: #085041; }
      .cta-red { fill: #E24B4A; }
      .cta-teal { fill: #1D9E75; }
      .secondary-btn { fill: none; stroke: #D3D1C7; stroke-width: 0.5; }
      .secondary-btn-text { fill: #5F5E5A; }
      .shame-text { fill: #B4B2A9; font-size: 10px; font-style: italic; }
      .vs-divider { stroke: #D3D1C7; stroke-width: 0.5; }
      .vs-circle { fill: #F1EFE8; }
      .vs-text { fill: #888780; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #D3D1C7; }
        .body { fill: #B4B2A9; }
        .annot { fill: #B4B2A9; }
        .pair-label { fill: #888780; }
        .big-headline { fill: #D3D1C7; }
        .page-bg { fill: #1C1B1A; }
        .frame-bg { fill: #2C2C2A; }
        .screen-bg { fill: #1C1B1A; stroke: #444441; }
        .red-tag { fill: #501313; }
        .red-tag-text { fill: #F7C1C1; }
        .teal-tag { fill: #04342C; }
        .teal-tag-text { fill: #9FE1CB; }
        .red-annot-bg { fill: #501313; }
        .red-annot-text { fill: #F7C1C1; }
        .teal-annot-bg { fill: #04342C; }
        .teal-annot-text { fill: #9FE1CB; }
        .secondary-btn { stroke: #5F5E5A; }
        .secondary-btn-text { fill: #B4B2A9; }
        .shame-text { fill: #5F5E5A; }
        .vs-divider { stroke: #444441; }
        .vs-circle { fill: #2C2C2A; }
        .vs-text { fill: #888780; }
      }
    </style>
  </defs>

  <rect class="page-bg" width="800" height="420" rx="16" />
  <text x="400" y="34" text-anchor="middle" class="pair-label">사례. 할인 쿠폰 팝업</text>

  <!-- LEFT: DARK -->
  <rect class="frame-bg" x="48" y="52" width="320" height="320" rx="12" />
  <rect class="red-tag" x="64" y="68" width="50" height="20" rx="4" />
  <text x="89" y="81" text-anchor="middle" class="label red-tag-text">DARK</text>

  <rect class="screen-bg" x="64" y="96" width="288" height="180" rx="8" />
  <text x="208" y="130" text-anchor="middle" class="big-headline">10% 할인 받기</text>

  <text x="208" y="156" text-anchor="middle" class="body">첫 구매 고객만을 위한 특별 혜택!</text>

  <rect class="cta-red" x="84" y="178" width="248" height="40" rx="8" />
  <text x="208" y="202" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">네, 10% 할인 받기 ✨</text>

  <text x="208" y="240" text-anchor="middle" class="shame-text">아니요, 저는 할인이 필요 없습니다 😢</text>

  <rect class="red-annot-bg" x="64" y="288" width="288" height="62" rx="6" />
  <text x="80" y="306" class="annot-bold red-annot-text">Confirmshaming</text>
  <text x="80" y="322" class="annot red-annot-text">거절 카피가 사용자를 "할인이 필요 없는 사람"</text>
  <text x="80" y="338" class="annot red-annot-text">으로 프레이밍. 이모지로 정서적 부담 추가.</text>

  <!-- RIGHT: BRIGHT -->
  <rect class="frame-bg" x="432" y="52" width="320" height="320" rx="12" />
  <rect class="teal-tag" x="448" y="68" width="60" height="20" rx="4" />
  <text x="478" y="81" text-anchor="middle" class="label teal-tag-text">BRIGHT</text>

  <rect class="screen-bg" x="448" y="96" width="288" height="180" rx="8" />
  <text x="592" y="130" text-anchor="middle" class="big-headline">10% 할인 쿠폰</text>

  <text x="592" y="156" text-anchor="middle" class="body">첫 구매 시 사용 가능</text>

  <rect class="cta-teal" x="468" y="178" width="248" height="40" rx="8" />
  <text x="592" y="202" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">쿠폰 받기</text>

  <rect class="secondary-btn" x="468" y="224" width="248" height="36" rx="8" />
  <text x="592" y="246" text-anchor="middle" font-size="13" class="secondary-btn-text">닫기</text>

  <rect class="teal-annot-bg" x="448" y="288" width="288" height="62" rx="6" />
  <text x="464" y="306" class="annot teal-annot-text">거절 카피는 중립적 행동 서술.</text>
  <text x="464" y="322" class="annot teal-annot-text">두 버튼이 동등한 시각 위계.</text>
  <text x="464" y="338" class="annot teal-annot-text">사용자의 동기·가치를 판단하지 않음.</text>

  <line class="vs-divider" x1="400" y1="72" x2="400" y2="372" stroke-dasharray="4 4" />
  <circle class="vs-circle" cx="400" cy="212" r="16" />
  <text x="400" y="217" text-anchor="middle" font-size="11" font-weight="600" class="vs-text">VS</text>
</svg>
