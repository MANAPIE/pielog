<svg viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-lr">
  <title id="t-lr">직무별 학습 로드맵</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-lr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-lr-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="360" />
  <text x="24" y="36" class="ttl">직무별 학습 로드맵</text>
  <text x="54" y="64" class="nm" style="fill:var(--c-accent-3)">기획자</text>
  <rect x="54" y="76" width="138" height="70" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="62" y="96" class="cap" style="fill:var(--c-fg)">리서치 설계와 운영</text>
  <text x="62" y="113" class="cap" style="fill:var(--c-fg)">성숙도 향상 리더십</text>
  <text x="62" y="130" class="cap" style="fill:var(--c-fg)">전략에 인사이트 입력</text>
  <rect x="54" y="154" width="138" height="70" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="62" y="174" class="cap" style="fill:var(--c-fg)">정량 데이터 분석</text>
  <text x="62" y="191" class="cap" style="fill:var(--c-fg)">JTBD·서비스 디자인</text>
  <text x="62" y="208" class="cap" style="fill:var(--c-fg)">A/B 테스트 설계</text>
  <rect x="54" y="232" width="138" height="70" rx="6" fill="var(--c-soft-3)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="62" y="252" class="cap" style="fill:var(--c-fg)">UX 원칙과 방법론</text>
  <text x="62" y="269" class="cap" style="fill:var(--c-fg)">리서치 기법</text>
  <text x="62" y="286" class="cap" style="fill:var(--c-fg)">화면 기획서</text>
  <text x="196" y="64" class="nm" style="fill:var(--c-accent)">디자이너</text>
  <rect x="196" y="76" width="138" height="70" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="204" y="96" class="cap" style="fill:var(--c-fg)">리서치 주도</text>
  <text x="204" y="113" class="cap" style="fill:var(--c-fg)">디자인 전략과 비전</text>
  <text x="204" y="130" class="cap" style="fill:var(--c-fg)">멀티 모달·AI 패턴</text>
  <rect x="196" y="154" width="138" height="70" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="204" y="174" class="cap" style="fill:var(--c-fg)">인터랙션 디자인 심화</text>
  <text x="204" y="191" class="cap" style="fill:var(--c-fg)">디자인 시스템 구축·운영</text>
  <text x="204" y="208" class="cap" style="fill:var(--c-fg)">접근성 심화</text>
  <rect x="196" y="232" width="138" height="70" rx="6" fill="var(--c-soft)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="204" y="252" class="cap" style="fill:var(--c-fg)">UX 원칙과 인지심리학</text>
  <text x="204" y="269" class="cap" style="fill:var(--c-fg)">사용성 테스트 관찰</text>
  <text x="204" y="286" class="cap" style="fill:var(--c-fg)">디자인 시스템 이해</text>
  <text x="338" y="64" class="nm" style="fill:var(--c-accent-2)">개발자</text>
  <rect x="338" y="76" width="138" height="70" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="346" y="96" class="cap" style="fill:var(--c-fg)">디자인 엔지니어링</text>
  <text x="346" y="113" class="cap" style="fill:var(--c-fg)">아키텍처와 UX</text>
  <text x="346" y="130" class="cap" style="fill:var(--c-fg)">새 패러다임 구현</text>
  <rect x="338" y="154" width="138" height="70" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="346" y="174" class="cap" style="fill:var(--c-fg)">성능의 UX 관점</text>
  <text x="346" y="191" class="cap" style="fill:var(--c-fg)">디자인 시스템 코드 구현</text>
  <text x="346" y="208" class="cap" style="fill:var(--c-fg)">마이크로인터랙션 구현</text>
  <rect x="338" y="232" width="138" height="70" rx="6" fill="var(--c-soft-2)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="346" y="252" class="cap" style="fill:var(--c-fg)">UX 원칙</text>
  <text x="346" y="269" class="cap" style="fill:var(--c-fg)">프론트엔드 UX 패턴</text>
  <text x="346" y="286" class="cap" style="fill:var(--c-fg)">접근성 기본 구현</text>
  <text x="24" y="115" class="th">고급</text>
  <text x="24" y="193" class="th">중급</text>
  <text x="24" y="271" class="th">기초</text>
  <rect x="54" y="312" width="422" height="22" rx="6" fill="var(--c-muted-soft)" stroke="none" stroke-width="0" />
  <text x="265" y="327" class="cap" text-anchor="middle">기초 행은 이 시리즈의 범위입니다</text>
</svg>
