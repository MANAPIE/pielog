<svg viewBox="0 0 500 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tm">
  <title id="t-tm">시리즈의 세 문장</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-tm" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-tm-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="230" />
  <text x="24" y="36" class="ttl">시리즈의 세 문장</text>
  <rect x="24" y="56" width="144" height="150" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="36" y="80" class="nm">UX는 특정 직무의</text>
  <text x="36" y="97" class="nm">소유물이 아니다</text>
  <circle cx="82" cy="152" r="20" fill="var(--c-accent-3)" fill-opacity="0.35" />
  <circle cx="110" cy="152" r="20" fill="var(--c-accent)" fill-opacity="0.35" />
  <circle cx="96" cy="174" r="20" fill="var(--c-accent-2)" fill-opacity="0.35" />
  <rect x="178" y="56" width="144" height="150" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="190" y="80" class="nm">사용자의 목표를</text>
  <text x="190" y="97" class="nm">방해하지 않는 것</text>
  <circle cx="250" cy="160" r="24" fill="none" stroke="var(--c-muted)" stroke-width="1.4" stroke-dasharray="3 3" />
  <circle cx="250" cy="136" r="6" fill="var(--c-accent)" />
  <circle cx="274" cy="160" r="6" fill="var(--c-accent-2)" />
  <circle cx="250" cy="184" r="6" fill="var(--c-accent-3)" />
  <circle cx="226" cy="160" r="6" fill="var(--c-accent-4)" />
  <path d="M 267 143 A 24 24 0 0 1 274 156" fill="none" stroke="var(--c-fg)" stroke-width="1.4" marker-end="url(#a-tm-f)" />
  <rect x="332" y="56" width="144" height="150" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="344" y="80" class="nm">완벽한 프로세스보다</text>
  <text x="344" y="97" class="nm">작은 실천</text>
  <rect x="368" y="176" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.35" />
  <rect x="383" y="176" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.35" />
  <rect x="383" y="164" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.47" />
  <rect x="398" y="176" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.35" />
  <rect x="398" y="164" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.47" />
  <rect x="398" y="152" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.59" />
  <rect x="413" y="176" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.35" />
  <rect x="413" y="164" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.47" />
  <rect x="413" y="152" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.59" />
  <rect x="413" y="140" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.71" />
  <rect x="428" y="176" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.35" />
  <rect x="428" y="164" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.47" />
  <rect x="428" y="152" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.59" />
  <rect x="428" y="140" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.71" />
  <rect x="428" y="128" width="11" height="8" rx="2" fill="var(--c-accent)" fill-opacity="0.83" />
</svg>
