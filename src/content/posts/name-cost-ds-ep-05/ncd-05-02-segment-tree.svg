<svg viewBox="0 0 800 688" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-seg">
  <title id="t-seg">세그먼트 트리의 구조와 질의·갱신 연산</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-on: rgba(47,125,110,0.18); --c-on2: rgba(194,112,61,0.20);
        --c-dim: rgba(107,114,128,0.34); --c-divider: rgba(26,31,46,0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-on: rgba(111,195,176,0.22); --c-on2: rgba(224,154,107,0.24);
          --c-dim: rgba(139,146,160,0.36); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .nd { fill: var(--c-card); stroke: var(--c-accent); stroke-width: 1.6; }
      .rg { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 9px; fill: var(--c-muted); }
      .sm { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .ed { stroke: var(--c-divider); stroke-width: 1.5; fill: none; }
      .cell { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.2; }
      .v { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; font-weight: 700; fill: var(--c-fg); }
      .on { fill: var(--c-on); stroke: var(--c-accent); stroke-width: 2.4; }
      .on2 { fill: var(--c-on2); stroke: var(--c-accent-2); stroke-width: 2.4; }
      .off { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.2; }
      .mn { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; font-weight: 700; fill: var(--c-fg); }
      .mnoff { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .mid { fill: var(--c-card); stroke: var(--c-accent); stroke-width: 1.6; stroke-dasharray: 3 2; }
      .bl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; font-weight: 700; }
    </style>
    <marker id="up" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-2)"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="688"/>

  <text x="24" y="28" class="ttl">구간을 미리 접어 두면 구간 질의가 O(log N)이 됩니다</text>
  <text x="24" y="48" class="sub">배열 1 2 3 4 5 · 각 노드는 담당 구간과 그 구간의 합을 들고 있습니다</text>

  <!-- 전체 트리 -->
  <g transform="translate(24 62)">
    <rect width="752" height="298" rx="8" class="pane"/>

    <g transform="translate(40 40)">
      <!-- 간선: 부모 중심 하단 -> 자식 중심 상단 -->
      <g class="ed">
        <line x1="274" y1="42" x2="173" y2="66"/>
        <line x1="274" y1="42" x2="374" y2="66"/>
        <line x1="173" y1="108" x2="112" y2="132"/>
        <line x1="173" y1="108" x2="234" y2="132"/>
        <line x1="112" y1="174" x2="74" y2="198"/>
        <line x1="112" y1="174" x2="150" y2="198"/>
        <line x1="374" y1="108" x2="334" y2="132"/>
        <line x1="374" y1="108" x2="414" y2="132"/>
      </g>

      <g transform="translate(240 0)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[0,4]</text><text x="34" y="33" class="sm" text-anchor="middle">15</text></g>
      <g transform="translate(139 66)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[0,2]</text><text x="34" y="33" class="sm" text-anchor="middle">6</text></g>
      <g transform="translate(340 66)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[3,4]</text><text x="34" y="33" class="sm" text-anchor="middle">9</text></g>
      <g transform="translate(78 132)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[0,1]</text><text x="34" y="33" class="sm" text-anchor="middle">3</text></g>
      <g transform="translate(200 132)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[2,2]</text><text x="34" y="33" class="sm" text-anchor="middle">3</text></g>
      <g transform="translate(300 132)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[3,3]</text><text x="34" y="33" class="sm" text-anchor="middle">4</text></g>
      <g transform="translate(380 132)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[4,4]</text><text x="34" y="33" class="sm" text-anchor="middle">5</text></g>
      <g transform="translate(40 198)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[0,0]</text><text x="34" y="33" class="sm" text-anchor="middle">1</text></g>
      <g transform="translate(116 198)"><rect width="68" height="42" rx="6" class="nd"/><text x="34" y="16" class="rg" text-anchor="middle">[1,1]</text><text x="34" y="33" class="sm" text-anchor="middle">2</text></g>
    </g>

    <g transform="translate(520 44)">
      <text x="0" y="12" class="hd" fill="var(--c-accent)">원본 배열</text>
      <g transform="translate(0 22)">
        <g><rect width="38" height="30" rx="5" class="cell"/><text x="19" y="20" class="v" text-anchor="middle">1</text></g>
        <g transform="translate(42 0)"><rect width="38" height="30" rx="5" class="cell"/><text x="19" y="20" class="v" text-anchor="middle">2</text></g>
        <g transform="translate(84 0)"><rect width="38" height="30" rx="5" class="cell"/><text x="19" y="20" class="v" text-anchor="middle">3</text></g>
        <g transform="translate(126 0)"><rect width="38" height="30" rx="5" class="cell"/><text x="19" y="20" class="v" text-anchor="middle">4</text></g>
        <g transform="translate(168 0)"><rect width="38" height="30" rx="5" class="cell"/><text x="19" y="20" class="v" text-anchor="middle">5</text></g>
      </g>
      <text x="0" y="82" class="sub">잎은 원소 하나, 부모는 두 자식의 합입니다.</text>
      <text x="0" y="102" class="sub">노드 수는 원소 수의 약 네 배로 잡습니다.</text>
      <text x="0" y="122" class="sub">구간 합을 매번 다시 더하면 O(N)입니다.</text>
      <text x="0" y="160" class="sub">미리 접어 두면 갱신도 질의도</text>
      <text x="0" y="180" class="sub">O(log N)이 됩니다.</text>
    </g>
  </g>

  <!-- 질의 -->
  <g transform="translate(24 372)">
    <rect width="366" height="268" rx="8" class="pane"/>
    <text x="20" y="26" class="hd" fill="var(--c-accent)">QUERY · 구간 [1,3]의 합</text>

    <g transform="translate(60 34)">
      <g class="ed">
        <line x1="136" y1="47" x2="86" y2="63"/>
        <line x1="136" y1="47" x2="186" y2="63"/>
        <line x1="86" y1="89" x2="56" y2="105"/>
        <line x1="86" y1="89" x2="116" y2="105"/>
        <line x1="186" y1="89" x2="166" y2="105"/>
        <line x1="186" y1="89" x2="216" y2="105"/>
        <line x1="56" y1="131" x2="36" y2="147"/>
        <line x1="56" y1="131" x2="76" y2="147"/>
      </g>
      <text x="136" y="17" class="rg" text-anchor="middle">[0,4]</text><circle cx="136" cy="34" r="13" class="mid"/><text x="136" y="38" class="mnoff" text-anchor="middle">15</text>
      <text x="86" y="59" class="rg" text-anchor="middle">[0,2]</text><circle cx="86" cy="76" r="13" class="mid"/><text x="86" y="80" class="mnoff" text-anchor="middle">6</text>
      <text x="186" y="59" class="rg" text-anchor="middle">[3,4]</text><circle cx="186" cy="76" r="13" class="mid"/><text x="186" y="80" class="mnoff" text-anchor="middle">9</text>
      <text x="56" y="101" class="rg" text-anchor="middle">[0,1]</text><circle cx="56" cy="118" r="13" class="mid"/><text x="56" y="122" class="mnoff" text-anchor="middle">3</text>
      <text x="116" y="101" class="rg" text-anchor="middle">[2,2]</text><circle cx="116" cy="118" r="13" class="on"/><text x="116" y="122" class="mn" text-anchor="middle">3</text>
      <text x="166" y="101" class="rg" text-anchor="middle">[3,3]</text><circle cx="166" cy="118" r="13" class="on"/><text x="166" y="122" class="mn" text-anchor="middle">4</text>
      <text x="216" y="101" class="rg" text-anchor="middle">[4,4]</text><circle cx="216" cy="118" r="13" class="off"/><text x="216" y="122" class="mnoff" text-anchor="middle">5</text>
      <text x="36" y="143" class="rg" text-anchor="middle">[0,0]</text><circle cx="36" cy="160" r="13" class="off"/><text x="36" y="164" class="mnoff" text-anchor="middle">1</text>
      <text x="76" y="143" class="rg" text-anchor="middle">[1,1]</text><circle cx="76" cy="160" r="13" class="on"/><text x="76" y="164" class="mn" text-anchor="middle">2</text>
    </g>

    <text x="20" y="222" class="bl" fill="var(--c-accent)">2 + 3 + 4 = 9 · 노드 세 개만 봅니다</text>
    <text x="20" y="240" class="sub">색칠: 완전히 포함되어 값을 그대로 씀 · 점선: 걸쳐서 자식으로 내려감</text>
    <text x="20" y="256" class="sub">흐림: 겹치지 않아 무시</text>
  </g>

  <!-- 갱신 -->
  <g transform="translate(410 372)">
    <rect width="366" height="268" rx="8" class="pane"/>
    <text x="20" y="26" class="hd" fill="var(--c-accent-2)">UPDATE · 4번 원소를 5에서 8로</text>

    <g transform="translate(60 34)">
      <g class="ed">
        <line x1="136" y1="47" x2="86" y2="63"/>
        <line x1="86" y1="89" x2="56" y2="105"/>
        <line x1="86" y1="89" x2="116" y2="105"/>
        <line x1="56" y1="131" x2="36" y2="147"/>
        <line x1="56" y1="131" x2="76" y2="147"/>
        <line x1="186" y1="89" x2="166" y2="105"/>
      </g>
      <!-- 갱신 경로: 잎 -> 부모 -> 루트 (노드 바깥에서 끝나도록) -->
      <g stroke="var(--c-accent-2)" stroke-width="2.2" fill="none">
        <line x1="207" y1="106" x2="196" y2="90" marker-end="url(#up)"/>
        <line x1="175" y1="66" x2="149" y2="45" marker-end="url(#up)"/>
      </g>
      <circle cx="136" cy="34" r="13" class="on2"/><text x="136" y="38" class="mn" text-anchor="middle">18</text>
      <circle cx="86" cy="76" r="13" class="off"/><text x="86" y="80" class="mnoff" text-anchor="middle">6</text>
      <circle cx="186" cy="76" r="13" class="on2"/><text x="186" y="80" class="mn" text-anchor="middle">12</text>
      <circle cx="56" cy="118" r="13" class="off"/><text x="56" y="122" class="mnoff" text-anchor="middle">3</text>
      <circle cx="116" cy="118" r="13" class="off"/><text x="116" y="122" class="mnoff" text-anchor="middle">3</text>
      <circle cx="166" cy="118" r="13" class="off"/><text x="166" y="122" class="mnoff" text-anchor="middle">4</text>
      <circle cx="216" cy="118" r="13" class="on2"/><text x="216" y="122" class="mn" text-anchor="middle">8</text>
      <circle cx="36" cy="160" r="13" class="off"/><text x="36" y="164" class="mnoff" text-anchor="middle">1</text>
      <circle cx="76" cy="160" r="13" class="off"/><text x="76" y="164" class="mnoff" text-anchor="middle">2</text>
    </g>

    <text x="20" y="228" class="bl" fill="var(--c-accent-2)">잎에서 루트까지 세 개만 고칩니다</text>
    <text x="20" y="248" class="sub">바뀐 잎의 조상만 다시 계산하면 됩니다</text>
  </g>

  <text x="24" y="666" class="sub">배열은 갱신이 O(1)이지만 구간 합이 O(N)입니다. 누적 합은 반대입니다. 세그먼트 트리는 둘 다 O(log N)으로 맞춥니다.</text>
</svg>
