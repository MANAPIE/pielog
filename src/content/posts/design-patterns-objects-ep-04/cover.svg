<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">Adapter와 레거시 컴포넌트 마이그레이션: ep.04 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="grad1" cx="18%" cy="40%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="82%" cy="60%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- 배경 stroke 도형 -->
  <circle cx="100" cy="600" r="200" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.13"/>
  <rect x="800" y="-100" width="500" height="380" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12" transform="rotate(-7 1050 90)"/>

  <!-- 좌측 객체 (원형) -->
  <g transform="translate(180 315) rotate(-6)">
    <circle r="80" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>
    <!-- 내부 텍스처: 동심원 -->
    <circle r="50" fill="none" stroke="var(--c-line)" stroke-width="1" opacity="0.4"/>
    <circle r="22" fill="var(--c-accent-2)" opacity="0.6"/>
    <!-- 작은 점들 -->
    <circle cx="-50" cy="35" r="3.5" fill="var(--c-line)"/>
    <circle cx="-35" cy="40" r="3.5" fill="var(--c-line)" opacity="0.5"/>
  </g>

  <!-- 우측 객체 (사각형) -->
  <g transform="translate(1020 315) rotate(8)">
    <rect x="-80" y="-70" width="160" height="140" rx="4" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>
    <line x1="-60" y1="-40" x2="60" y2="-40" stroke="var(--c-line)" stroke-width="2.5"/>
    <line x1="-60" y1="-20" x2="40" y2="-20" stroke="var(--c-line)" stroke-width="1.2" opacity="0.5"/>
    <line x1="-60" y1="-4" x2="50" y2="-4" stroke="var(--c-line)" stroke-width="1.2" opacity="0.5"/>
    <!-- 미니 바 -->
    <rect x="-60" y="20" width="40" height="6" rx="2" fill="var(--c-accent)" opacity="0.7"/>
    <rect x="-60" y="34" width="60" height="6" rx="2" fill="var(--c-accent)" opacity="0.4"/>
  </g>

  <!-- 중앙 Adapter (다리 모양) -->
  <g transform="translate(600 315)">
    <!-- 외곽 포커스 링 -->
    <rect x="-130" y="-65" width="260" height="130" rx="9" fill="none" stroke="var(--c-accent-2)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.55"/>
    <!-- 본 박스 -->
    <rect x="-120" y="-55" width="240" height="110" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.5"/>

    <!-- 좌측 입력: 원형 슬롯 -->
    <circle cx="-95" cy="0" r="14" fill="none" stroke="var(--c-line)" stroke-width="1.8"/>
    <!-- 변환 화살표 가로 -->
    <line x1="-75" y1="0" x2="-25" y2="0" stroke="var(--c-line)" stroke-width="1.8" stroke-dasharray="3 3"/>
    <polygon points="-25,-4 -17,0 -25,4" fill="var(--c-line)"/>
    <!-- 중앙 변환 다이아몬드 -->
    <polygon points="0,-16 16,0 0,16 -16,0" fill="var(--c-accent-2)" opacity="0.85"/>
    <!-- 다음 변환 화살표 -->
    <line x1="25" y1="0" x2="75" y2="0" stroke="var(--c-line)" stroke-width="1.8" stroke-dasharray="3 3"/>
    <polygon points="75,-4 83,0 75,4" fill="var(--c-line)"/>
    <!-- 우측 출력: 사각형 슬롯 -->
    <rect x="83" y="-14" width="28" height="28" rx="2" fill="none" stroke="var(--c-line)" stroke-width="1.8"/>

    <!-- 상단 작은 라벨 점들 -->
    <circle cx="-95" cy="-38" r="3" fill="var(--c-line)" opacity="0.5"/>
    <circle cx="0" cy="-38" r="3" fill="var(--c-accent-2)"/>
    <circle cx="97" cy="-38" r="3" fill="var(--c-line)" opacity="0.5"/>
  </g>

  <!-- 좌측 객체 → Adapter 연결 -->
  <line x1="260" y1="315" x2="475" y2="315" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.55"/>
  <!-- Adapter → 우측 객체 연결 -->
  <line x1="725" y1="315" x2="940" y2="315" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.55"/>

  <!-- 우상단 동심원 -->
  <g transform="translate(1050 130)" opacity="0.7">
    <circle r="48" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5"/>
    <circle r="28" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌상단 작은 점 무리 -->
  <g transform="translate(180 110)">
    <circle r="4" fill="var(--c-accent)"/>
    <circle cx="16" r="4" fill="var(--c-accent)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent)" opacity="0.3"/>
  </g>

  <!-- 좌하단 회전 사각형 -->
  <g transform="translate(140 540) rotate(-14)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent)" stroke-width="1.5"/>
  </g>

  <!-- 우하단 큰 시리즈 번호 -->
  <text x="1130" y="575" class="num" text-anchor="end">04</text>
</svg>
