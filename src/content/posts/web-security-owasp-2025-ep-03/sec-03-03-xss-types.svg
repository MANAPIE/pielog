<svg viewBox="0 0 720 528" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="XSS 세 가지 유형 - Stored, Reflected, DOM">
  <style>
    /* sec-theme-vars */
    :root {
      --sec-fg: #0f172a;
      --sec-fg-muted: #64748b;
      --sec-bg: #ffffff;
      --sec-border: #e2e8f0;
      --sec-slate-50: #f8fafc;
      --sec-slate-100: #f1f5f9;
      --sec-slate-200: #e2e8f0;
      --sec-slate-300: #cbd5e1;
      --sec-slate-400: #94a3b8;
      --sec-slate-500: #64748b;
      --sec-slate-700: #334155;
      --sec-blue-50: #eff6ff;
      --sec-blue-200: #bfdbfe;
      --sec-blue-500: #3b82f6;
      --sec-blue-700: #1d4ed8;
      --sec-red-50: #fef2f2;
      --sec-red-100: #fee2e2;
      --sec-red-200: #fecaca;
      --sec-red-500: #ef4444;
      --sec-red-700: #b91c1c;
      --sec-amber-50: #fffbeb;
      --sec-amber-100: #fef3c7;
      --sec-amber-200: #fde68a;
      --sec-amber-500: #f59e0b;
      --sec-amber-700: #b45309;
      --sec-emerald-50: #ecfdf5;
      --sec-emerald-100: #d1fae5;
      --sec-emerald-200: #a7f3d0;
      --sec-emerald-500: #10b981;
      --sec-emerald-700: #047857;
      --sec-violet-50: #f5f3ff;
      --sec-violet-200: #ddd6fe;
      --sec-violet-500: #8b5cf6;
      --sec-violet-700: #6d28d9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --sec-fg: #e2e8f0;
        --sec-fg-muted: #94a3b8;
        --sec-bg: #0f172a;
        --sec-border: #334155;
        --sec-slate-50: #1e293b;
        --sec-slate-100: #334155;
        --sec-slate-200: #475569;
        --sec-slate-300: #64748b;
        --sec-slate-400: #94a3b8;
        --sec-slate-500: #cbd5e1;
        --sec-slate-700: #e2e8f0;
        --sec-blue-50: #172554;
        --sec-blue-200: #1e40af;
        --sec-blue-500: #60a5fa;
        --sec-blue-700: #93c5fd;
        --sec-red-50: #450a0a;
        --sec-red-100: #7f1d1d;
        --sec-red-200: #991b1b;
        --sec-red-500: #f87171;
        --sec-red-700: #fca5a5;
        --sec-amber-50: #451a03;
        --sec-amber-100: #78350f;
        --sec-amber-200: #92400e;
        --sec-amber-500: #fbbf24;
        --sec-amber-700: #fcd34d;
        --sec-emerald-50: #022c22;
        --sec-emerald-100: #064e3b;
        --sec-emerald-200: #065f46;
        --sec-emerald-500: #34d399;
        --sec-emerald-700: #6ee7b7;
        --sec-violet-50: #2e1065;
        --sec-violet-200: #5b21b6;
        --sec-violet-500: #a78bfa;
        --sec-violet-700: #c4b5fd;
      }
    }

    .title {
      font: 600 16px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .caption {
      font: 400 11px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .type-tag {
      font: 700 10px system-ui, sans-serif;
      letter-spacing: 0.06em;
    }

    .type-name {
      font: 600 13px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .severity {
      font: 700 10px system-ui, sans-serif;
    }

    .step {
      font: 500 11px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .desc {
      font: 400 11px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .mono-sm {
      font: 400 10px "SF Mono", ui-monospace, monospace;
    }

    .stored-bg {
      fill: var(--sec-red-50, #fef2f2);
      stroke: var(--sec-red-200, #fecaca);
    }

    .reflected-bg {
      fill: var(--sec-amber-50, #fffbeb);
      stroke: var(--sec-amber-200, #fde68a);
    }

    .dom-bg {
      fill: var(--sec-blue-50, #eff6ff);
      stroke: var(--sec-blue-200, #bfdbfe);
    }

    .stored-t {
      fill: var(--sec-red-700, #b91c1c);
    }

    .reflected-t {
      fill: var(--sec-amber-700, #b45309);
    }

    .dom-t {
      fill: var(--sec-blue-700, #1d4ed8);
    }

    .node-attacker {
      fill: var(--sec-red-500, #ef4444);
    }

    .node-victim {
      fill: var(--sec-blue-500, #3b82f6);
    }

    .node-server {
      fill: var(--sec-slate-500, #64748b);
    }

    .node-text {
      font: 600 10px system-ui, sans-serif;
      fill: #ffffff;
    }

    .arrow {
      stroke: var(--sec-slate-500, #64748b);
      stroke-width: 1.2;
      fill: none;
    }

    .arrow-attack {
      stroke: var(--sec-red-500, #ef4444);
      stroke-width: 1.4;
      fill: none;
    }

    .label-sm {
      font: 400 9px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .severity {
      fill: var(--sec-bg, #ffffff);
    }
  </style>

  <defs>
    <marker id="xarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sec-slate-500, #64748b)" />
    </marker>
    <marker id="xarrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sec-red-500, #ef4444)" />
    </marker>
  </defs>

  <text x="24" y="36" class="title">XSS의 세 가지 유형</text>
  <text x="24" y="56" class="caption">악성 스크립트가 어디에 머물고 어떻게 전달되는가에 따라 구분됩니다.</text>

  <!-- Row 1: Stored XSS -->
  <rect x="24" y="80" width="672" height="132" rx="14" class="stored-bg" stroke-width="1" />
  <text x="93" y="103" class="type-tag stored-t">STORED · 가장 위험</text>
  <rect x="40" y="90" width="44" height="18" rx="9" fill="var(--sec-red-500, #ef4444)" />
  <text x="62" y="103" text-anchor="middle" class="severity">HIGH</text>
  <text x="40" y="124" class="type-name">Stored XSS: 악성 스크립트가 DB에 저장</text>
  <text x="40" y="142" class="desc">댓글, 게시판, 프로필 등 사용자 입력이 저장되는 곳. 모든 방문자가 영향받음.</text>

  <!-- Flow nodes -->
  <circle cx="100" cy="178" r="14" class="node-attacker" />
  <text x="100" y="182" text-anchor="middle" class="node-text">A</text>
  <text x="100" y="203" text-anchor="middle" class="label-sm">공격자</text>

  <rect x="190" y="164" width="160" height="28" rx="6" fill="var(--sec-bg, #ffffff)"
    stroke="var(--sec-slate-200, #e2e8f0)" />
  <text x="270" y="182" text-anchor="middle" class="step">DB에 악성 스크립트 저장</text>

  <rect x="390" y="164" width="160" height="28" rx="6" fill="var(--sec-bg, #ffffff)"
    stroke="var(--sec-slate-200, #e2e8f0)" />
  <text x="470" y="182" text-anchor="middle" class="step">페이지 로드 시 자동 실행</text>

  <circle cx="620" cy="178" r="14" class="node-victim" />
  <text x="620" y="182" text-anchor="middle" class="node-text">V</text>
  <text x="620" y="203" text-anchor="middle" class="label-sm">피해자 다수</text>

  <line x1="116" y1="178" x2="190" y2="178" class="arrow-attack" marker-end="url(#xarrR)" />
  <line x1="350" y1="178" x2="390" y2="178" class="arrow" marker-end="url(#xarr)" />
  <line x1="550" y1="178" x2="606" y2="178" class="arrow-attack" marker-end="url(#xarrR)" />

  <!-- Row 2: Reflected XSS -->
  <rect x="24" y="228" width="672" height="132" rx="14" class="reflected-bg" stroke-width="1" />
  <text x="110" y="251" class="type-tag reflected-t">REFLECTED · 피싱 결합</text>
  <rect x="40" y="238" width="60" height="18" rx="9" fill="var(--sec-amber-500, #f59e0b)" />
  <text x="70" y="251" text-anchor="middle" class="severity">MEDIUM</text>
  <text x="40" y="272" class="type-name">Reflected XSS: URL 파라미터가 응답에 반영</text>
  <text x="40" y="290" class="desc">검색 결과 페이지나 에러 페이지에서 자주 발생. 피싱 링크와 결합해 타겟 공격.</text>

  <circle cx="100" cy="326" r="14" class="node-attacker" />
  <text x="100" y="330" text-anchor="middle" class="node-text">A</text>
  <text x="100" y="351" text-anchor="middle" class="label-sm">공격자</text>

  <rect x="190" y="312" width="160" height="28" rx="6" fill="var(--sec-bg, #ffffff)"
    stroke="var(--sec-slate-200, #e2e8f0)" />
  <text x="270" y="330" text-anchor="middle" class="step">악성 URL을 피해자에게 전송</text>

  <rect x="390" y="312" width="160" height="28" rx="6" fill="var(--sec-bg, #ffffff)"
    stroke="var(--sec-slate-200, #e2e8f0)" />
  <text x="470" y="330" text-anchor="middle" class="step">서버가 그대로 응답에 포함</text>

  <circle cx="620" cy="326" r="14" class="node-victim" />
  <text x="620" y="330" text-anchor="middle" class="node-text">V</text>
  <text x="620" y="351" text-anchor="middle" class="label-sm">피해자 1인</text>

  <line x1="116" y1="326" x2="190" y2="326" class="arrow-attack" marker-end="url(#xarrR)" />
  <line x1="350" y1="326" x2="390" y2="326" class="arrow" marker-end="url(#xarr)" />
  <line x1="550" y1="326" x2="606" y2="326" class="arrow-attack" marker-end="url(#xarrR)" />

  <!-- Row 3: DOM XSS -->
  <rect x="24" y="376" width="672" height="132" rx="14" class="dom-bg" stroke-width="1" />
  <text x="110" y="399" class="type-tag dom-t">DOM-BASED · 클라이언트 사이드</text>
  <rect x="40" y="386" width="60" height="18" rx="9" fill="var(--sec-blue-500, #3b82f6)" />
  <text x="70" y="399" text-anchor="middle" class="severity">MEDIUM</text>
  <text x="40" y="420" class="type-name">DOM XSS: 서버 안 거치고 JS가 직접 처리</text>
  <text x="40" y="438" class="desc">URL fragment(#)나 location 데이터를 innerHTML에 넣을 때. 서버 로그에 흔적 없음.</text>

  <circle cx="100" cy="474" r="14" class="node-attacker" />
  <text x="100" y="478" text-anchor="middle" class="node-text">A</text>

  <rect x="190" y="460" width="160" height="28" rx="6" fill="var(--sec-bg, #ffffff)"
    stroke="var(--sec-slate-200, #e2e8f0)" />
  <text x="270" y="478" text-anchor="middle" class="step">URL #fragment에 페이로드</text>

  <rect x="390" y="460" width="160" height="28" rx="6" fill="var(--sec-bg, #ffffff)"
    stroke="var(--sec-slate-200, #e2e8f0)" />
  <text x="470" y="478" text-anchor="middle" class="step">JS가 innerHTML로 삽입</text>

  <circle cx="620" cy="474" r="14" class="node-victim" />
  <text x="620" y="478" text-anchor="middle" class="node-text">V</text>

  <line x1="116" y1="474" x2="190" y2="474" class="arrow-attack" marker-end="url(#xarrR)" />
  <line x1="350" y1="474" x2="390" y2="474" class="arrow" marker-end="url(#xarr)" />
  <line x1="550" y1="474" x2="606" y2="474" class="arrow-attack" marker-end="url(#xarrR)" />
</svg>