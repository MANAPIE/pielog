<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="SQL Injection - String concat과 Prepared Statement 비교">
  <style>
    /* sec-theme-vars */
    :root {
      --sec-fg: #0f172a;
      --sec-fg-muted: #64748b;
      --sec-bg: #ffffff;
      --sec-border: #e2e8f0;
      --sec-slate-50: #f8fafc;
      --sec-slate-100: #f1f5f9;
      --sec-slate-200: #e2e8f0;
      --sec-slate-300: #cbd5e1;
      --sec-slate-400: #94a3b8;
      --sec-slate-500: #64748b;
      --sec-slate-700: #334155;
      --sec-blue-50: #eff6ff;
      --sec-blue-200: #bfdbfe;
      --sec-blue-500: #3b82f6;
      --sec-blue-700: #1d4ed8;
      --sec-red-50: #fef2f2;
      --sec-red-100: #fee2e2;
      --sec-red-200: #fecaca;
      --sec-red-500: #ef4444;
      --sec-red-700: #b91c1c;
      --sec-amber-50: #fffbeb;
      --sec-amber-100: #fef3c7;
      --sec-amber-200: #fde68a;
      --sec-amber-500: #f59e0b;
      --sec-amber-700: #b45309;
      --sec-emerald-50: #ecfdf5;
      --sec-emerald-100: #d1fae5;
      --sec-emerald-200: #a7f3d0;
      --sec-emerald-500: #10b981;
      --sec-emerald-700: #047857;
      --sec-violet-50: #f5f3ff;
      --sec-violet-200: #ddd6fe;
      --sec-violet-500: #8b5cf6;
      --sec-violet-700: #6d28d9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --sec-fg: #e2e8f0;
        --sec-fg-muted: #94a3b8;
        --sec-bg: #0f172a;
        --sec-border: #334155;
        --sec-slate-50: #1e293b;
        --sec-slate-100: #334155;
        --sec-slate-200: #475569;
        --sec-slate-300: #64748b;
        --sec-slate-400: #94a3b8;
        --sec-slate-500: #cbd5e1;
        --sec-slate-700: #e2e8f0;
        --sec-blue-50: #172554;
        --sec-blue-200: #1e40af;
        --sec-blue-500: #60a5fa;
        --sec-blue-700: #93c5fd;
        --sec-red-50: #450a0a;
        --sec-red-100: #7f1d1d;
        --sec-red-200: #991b1b;
        --sec-red-500: #f87171;
        --sec-red-700: #fca5a5;
        --sec-amber-50: #451a03;
        --sec-amber-100: #78350f;
        --sec-amber-200: #92400e;
        --sec-amber-500: #fbbf24;
        --sec-amber-700: #fcd34d;
        --sec-emerald-50: #022c22;
        --sec-emerald-100: #064e3b;
        --sec-emerald-200: #065f46;
        --sec-emerald-500: #34d399;
        --sec-emerald-700: #6ee7b7;
        --sec-violet-50: #2e1065;
        --sec-violet-200: #5b21b6;
        --sec-violet-500: #a78bfa;
        --sec-violet-700: #c4b5fd;
      }
    }

    .title {
      font: 600 16px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .caption {
      font: 400 11px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .col-tag {
      font: 700 10px system-ui, sans-serif;
      letter-spacing: 0.08em;
    }

    .col-head {
      font: 600 14px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .step-num {
      font: 700 11px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .step-label {
      font: 500 12px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .mono {
      fill: var(--sec-fg, #0f172a);
      font: 400 11px "SF Mono", ui-monospace, monospace;
    }

    .mono-sm {
      fill: var(--sec-fg, #0f172a);
      font: 400 10px "SF Mono", ui-monospace, monospace;
    }

    .note {
      font: 400 11px system-ui, sans-serif;
    }

    .bad-bg {
      fill: var(--sec-red-50, #fef2f2);
      stroke: var(--sec-red-200, #fecaca);
      stroke-width: 1;
    }

    .good-bg {
      fill: var(--sec-emerald-50, #ecfdf5);
      stroke: var(--sec-emerald-200, #a7f3d0);
      stroke-width: 1;
    }

    .bad-t {
      fill: var(--sec-red-700, #b91c1c);
    }

    .good-t {
      fill: var(--sec-emerald-700, #047857);
    }

    .code-bad {
      fill: var(--sec-bg, #ffffff);
      stroke: var(--sec-red-200, #fecaca);
    }

    .code-good {
      fill: var(--sec-bg, #ffffff);
      stroke: var(--sec-emerald-200, #a7f3d0);
    }

    .input-box {
      fill: var(--sec-amber-50, #fffbeb);
      stroke: var(--sec-amber-500, #f59e0b);
    }
  </style>

  <text x="24" y="36" class="title">SQL Injection: 왜 prepared statement가 근본 해결책인가</text>
  <text x="24" y="56" class="caption">"이스케이프 잘 하면 되지 않나" 라는 생각의 한계. 구조와 데이터를 분리해야 합니다.</text>

  <!-- User input -->
  <rect x="24" y="76" width="672" height="46" rx="8" class="input-box" />
  <text x="40" y="96" class="step-label">사용자 입력 (악의적)</text>
  <text x="40" y="112" class="mono" fill="var(--sec-amber-700, #b45309)">email = "' OR '1'='1' --"</text>

  <!-- LEFT: Bad -->
  <rect x="24" y="136" width="328" height="316" rx="14" class="bad-bg" />
  <text x="40" y="160" class="col-tag bad-t">취약 · STRING CONCAT</text>
  <text x="40" y="180" class="col-head">문자열 연결 방식</text>

  <text x="40" y="208" class="step-num">01</text>
  <text x="68" y="208" class="step-label">코드</text>
  <rect x="40" y="218" width="296" height="44" rx="6" class="code-bad" />
  <text x="52" y="236" class="mono-sm">db.query("SELECT * FROM users</text>
  <text x="52" y="252" class="mono-sm"> WHERE email = '" + email + "'");</text>

  <text x="40" y="284" class="step-num">02</text>
  <text x="68" y="284" class="step-label">DB가 받는 최종 쿼리</text>
  <rect x="40" y="294" width="296" height="60" rx="6" class="code-bad" />
  <text x="52" y="312" class="mono-sm">SELECT * FROM users</text>
  <text x="52" y="328" class="mono-sm bad-t">WHERE email = '' OR '1'='1' --</text>
  <text x="52" y="344" class="mono-sm">'</text>

  <text x="40" y="378" class="step-label" fill="var(--sec-red-700, #b91c1c)">결과: 모든 사용자 반환</text>
  <text x="40" y="396" class="note bad-t">'1'='1'은 항상 true. -- 이후는 주석.</text>
  <text x="40" y="412" class="note bad-t">DROP TABLE도 같은 방식으로 가능.</text>
  <text x="40" y="428" class="note bad-t">→ 데이터와 코드의 경계가 무너짐</text>

  <!-- RIGHT: Good -->
  <rect x="368" y="136" width="328" height="316" rx="14" class="good-bg" />
  <text x="384" y="160" class="col-tag good-t">안전 · PREPARED STATEMENT</text>
  <text x="384" y="180" class="col-head">파라미터 바인딩</text>

  <text x="384" y="208" class="step-num">01</text>
  <text x="412" y="208" class="step-label">코드</text>
  <rect x="384" y="218" width="296" height="44" rx="6" class="code-good" />
  <text x="396" y="236" class="mono-sm">db.query("SELECT * FROM users</text>
  <text x="396" y="252" class="mono-sm"> WHERE email = ?", [email]);</text>

  <text x="384" y="284" class="step-num">02</text>
  <text x="412" y="284" class="step-label">DB가 받는 것: 분리 전송</text>
  <rect x="384" y="294" width="296" height="60" rx="6" class="code-good" />
  <text x="396" y="312" class="mono-sm">쿼리 구조: SELECT ... WHERE = ?</text>
  <text x="396" y="328" class="mono-sm good-t">데이터: ['' OR '1'='1' --]</text>
  <text x="396" y="344" class="mono-sm">→ 단순 문자열 값</text>

  <text x="384" y="378" class="step-label" fill="var(--sec-emerald-700, #047857)">결과: 일치하는 사용자 없음</text>
  <text x="384" y="396" class="note good-t">DB가 쿼리 구조를 먼저 파싱한 뒤,</text>
  <text x="384" y="412" class="note good-t">"?"에 단순 값으로만 끼워넣음.</text>
  <text x="384" y="428" class="note good-t">→ 구조와 데이터가 구조적으로 분리</text>
</svg>