    .code-box {
      fill: var(--sec-bg, #ffffff);
    }

    .data-only {
      fill: var(--sec-emerald-100, #d1fae5);
      stroke: var(--sec-emerald-500, #10b981);
    }

    .with-code {
      fill: var(--sec-red-100, #fee2e2);
      stroke: var(--sec-red-500, #ef4444);
    }
  </style>

  <text x="24" y="36" class="title">역직렬화: JSON과 Pickle의 결정적 차이</text>
  <text x="24" y="56" class="caption">"파싱"이라는 같은 단어로 묶여 있지만, 한쪽은 데이터만 복원, 다른 쪽은 코드까지 실행합니다.</text>

  <!-- LEFT: JSON (safe) -->
  <rect x="24" y="80" width="328" height="332" rx="14" class="safe-bg" stroke-width="1" />
  <text x="40" y="104" class="col-tag safe-t">SAFE · DATA ONLY</text>
  <text x="40" y="124" class="col-head">JSON 파싱</text>
  <text x="40" y="142" class="desc">데이터 구조만 복원. 코드 실행 경로 없음.</text>

  <!-- Input -->
  <text x="40" y="172" class="label">입력 (외부에서 받음)</text>
  <rect x="40" y="180" width="296" height="46" rx="6" class="code-box" stroke="var(--sec-slate-200, #e2e8f0)" />
  <text x="52" y="198" class="mono">{ "name": "Alice",</text>
  <text x="52" y="214" class="mono"> "age": 30 }</text>

  <!-- Process -->
  <text x="40" y="244" class="label">처리</text>
  <rect x="40" y="252" width="296" height="28" rx="6" class="code-box" stroke="var(--sec-slate-200, #e2e8f0)" />
  <text x="52" y="270" class="mono">JSON.parse(input)</text>

  <!-- Result -->
  <text x="40" y="304" class="label">결과 (메모리 상태)</text>
  <rect x="40" y="312" width="296" height="68" rx="6" class="data-only" />
  <text x="52" y="332" class="mono safe-t">{ name: "Alice", age: 30 }</text>
  <text x="52" y="350" class="mono-sm safe-t">→ 단순 데이터 객체</text>
  <text x="52" y="364" class="mono-sm safe-t">→ 메소드 없음, 실행 없음</text>

  <text x="40" y="396" class="desc safe-t" font-weight="600">→ 외부 입력에 권장. 안전.</text>

  <!-- RIGHT: Pickle (dangerous) -->
  <rect x="368" y="80" width="328" height="332" rx="14" class="dangerous-bg" stroke-width="1" />
  <text x="384" y="104" class="col-tag dangerous-t">DANGEROUS · CODE EXECUTION</text>
  <text x="384" y="124" class="col-head">Pickle · Java OIS · PHP unserialize</text>
  <text x="384" y="142" class="desc">객체 복원 중 코드 실행 가능. RCE로 직결.</text>

  <!-- Input -->
  <text x="384" y="172" class="label">입력 (조작된 페이로드)</text>
  <rect x="384" y="180" width="296" height="46" rx="6" class="code-box" stroke="var(--sec-red-200, #fecaca)" />
  <text x="396" y="198" class="mono-sm">cos\nsystem\n(S'rm -rf /'\ntR.</text>
  <text x="396" y="214" class="mono-sm dangerous-t">(악의적인 클래스 인스턴스 조작)</text>

  <!-- Process -->
  <text x="384" y="244" class="label">처리</text>
  <rect x="384" y="252" width="296" height="28" rx="6" class="code-box" stroke="var(--sec-red-200, #fecaca)" />
  <text x="396" y="270" class="mono">pickle.loads(input)</text>

  <!-- Result -->
  <text x="384" y="304" class="label">결과 (메모리 상태)</text>
  <rect x="384" y="312" width="296" height="68" rx="6" class="with-code" />
  <text x="396" y="332" class="mono dangerous-t">os.system("rm -rf /") 실행됨</text>
  <text x="396" y="350" class="mono-sm dangerous-t">→ 객체 복원 과정에서 임의 코드</text>
  <text x="396" y="364" class="mono-sm dangerous-t">→ 서버 RCE</text>

  <text x="384" y="396" class="desc dangerous-t" font-weight="600">→ 외부 입력에 절대 사용 금지.</text>
</svg>