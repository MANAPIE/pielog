<svg viewBox="0 0 800 622" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ec">
  <title id="t-ec">Expand-Contract의 다섯 단계</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4A5FD9;
        --c-accent-2: #D97757;
        --c-accent-3: #8B7AB8;
        --c-accent-4: #3D8B7A;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft-2: rgba(217, 119, 87, 0.10);
        --c-soft-4: rgba(61, 139, 122, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #8DA0FF;
          --c-accent-2: #E89376;
          --c-accent-3: #B0A0DA;
          --c-accent-4: #6FBFA8;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft-2: rgba(232, 147, 118, 0.14);
          --c-soft-4: rgba(111, 191, 168, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .panel {
        fill: var(--c-card);
        stroke: var(--c-divider);
        stroke-width: 1;
      }

      .ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .lbl {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .nm {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .cap {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 10.5px;
        fill: var(--c-muted);
      }

      .th {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: var(--c-muted);
        letter-spacing: 0.08em;
      }

      .td {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        fill: var(--c-fg);
      }

      .warn {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        fill: var(--c-accent-2);
      }

      .code {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        fill: var(--c-muted);
      }

      .row {
        fill: var(--c-card);
        stroke: var(--c-divider);
        stroke-width: 1;
      }

      .old {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.5;
      }

      .old-gone {
        fill: none;
        stroke: var(--c-muted);
        stroke-width: 1.3;
        stroke-dasharray: 4 4;
      }

      .new {
        fill: var(--c-card);
        stroke: var(--c-accent-4);
        stroke-width: 2;
      }

      .new-empty {
        fill: var(--c-card);
        stroke: var(--c-accent-4);
        stroke-width: 1.6;
        stroke-dasharray: 4 3;
      }

      .step {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: var(--c-accent-4);
      }

      .col {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10.5px;
        fill: var(--c-fg);
      }

      .ok {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: var(--c-accent-4);
      }

      .mono {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
      }
    </style>
    <marker id="a-w12" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--c-accent-4)" />
    </marker>
  </defs>

  <rect class="bg" width="800" height="622" />
  <text x="24" y="34" class="th">단계</text>
  <text x="150" y="34" class="th">DB 상태</text>
  <text x="430" y="34" class="th">애플리케이션</text>
  <text x="700" y="34" class="th">두 버전 공존</text>
  <line x1="24" y1="42" x2="776" y2="42" stroke="var(--c-divider)" stroke-width="1" />

  <g transform="translate(24 54)">
    <rect width="752" height="76" rx="6" class="row" />
    <text x="16" y="24" class="step">① EXPAND</text>
    <text x="16" y="44" class="nm">새 컬럼 추가</text>
    <text x="16" y="60" class="cap">옛 컬럼은 그대로</text>
    <g transform="translate(126 21)">
      <rect width="120" height="34" rx="5" class="old" />
      <text x="60" y="22" class="col" text-anchor="middle">name</text>
      <rect x="132" width="120" height="34" rx="5" class="new-empty" />
      <text x="192" y="22" class="col" text-anchor="middle" fill="var(--c-accent-4)">full_name</text>
    </g>
    <text x="406" y="42" class="cap">아직 <tspan class="mono">name</tspan>만 씁니다</text>
    <text x="676" y="42" class="ok">가능</text>
  </g>
  <g transform="translate(24 146)">
    <rect width="752" height="76" rx="6" class="row" />
    <text x="16" y="24" class="step">② DUAL WRITE</text>
    <text x="16" y="44" class="nm">양쪽에 씁니다</text>
    <text x="16" y="60" class="cap">읽기는 아직 옛 컬럼</text>
    <g transform="translate(126 21)">
      <rect width="120" height="34" rx="5" class="old" />
      <text x="60" y="22" class="col" text-anchor="middle">name</text>
      <rect x="132" width="120" height="34" rx="5" class="new" />
      <text x="192" y="22" class="col" text-anchor="middle">full_name</text>
    </g>
    <text x="406" y="34" class="cap">write → 둘 다</text>
    <text x="406" y="52" class="cap">read → <tspan class="mono">name</tspan></text>
    <text x="676" y="42" class="ok">가능</text>
  </g>
  <g transform="translate(24 238)">
    <rect width="752" height="76" rx="6" class="row" />
    <text x="16" y="24" class="step">③ BACKFILL</text>
    <text x="16" y="44" class="nm">기존 행 채우기</text>
    <text x="16" y="60" class="cap">배치로 나눠 실행</text>
    <g transform="translate(126 21)">
      <rect width="120" height="34" rx="5" class="old" />
      <text x="60" y="22" class="col" text-anchor="middle">name</text>
      <line x1="122" y1="17" x2="130" y2="17" stroke="var(--c-accent-4)" stroke-width="1.8" marker-end="url(#a-w12)" />
      <rect x="132" width="120" height="34" rx="5" class="new" />
      <text x="192" y="22" class="col" text-anchor="middle">full_name</text>
    </g>
    <text x="406" y="42" class="cap mono">UPDATE ... WHERE full_name IS NULL</text>
    <text x="676" y="42" class="ok">가능</text>
  </g>
  <g transform="translate(24 330)">
    <rect width="752" height="76" rx="6" class="row" />
    <text x="16" y="24" class="step">④ SWITCH READ</text>
    <text x="16" y="44" class="nm">새 컬럼을 읽습니다</text>
    <text x="16" y="60" class="cap">폴백을 잠시 유지</text>
    <g transform="translate(126 21)">
      <rect width="120" height="34" rx="5" class="old" opacity="0.5" />
      <text x="60" y="22" class="col" text-anchor="middle" opacity="0.5">name</text>
      <rect x="132" width="120" height="34" rx="5" class="new" stroke-width="2.4" />
      <text x="192" y="22" class="col" text-anchor="middle">full_name</text>
    </g>
    <text x="406" y="42" class="cap mono">user.full_name ?? user.name</text>
    <text x="676" y="42" class="ok">가능</text>
  </g>
  <g transform="translate(24 422)">
    <rect width="752" height="76" rx="6" class="row" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="16" y="24" class="step" fill="var(--c-accent-2)">⑤ CONTRACT</text>
    <text x="16" y="44" class="nm">옛 컬럼 제거</text>
    <text x="16" y="60" class="cap">가장 어려운 단계</text>
    <g transform="translate(126 21)">
      <rect width="120" height="34" rx="5" class="old-gone" />
      <line x1="46" y1="10" x2="74" y2="24" stroke="var(--c-muted)" stroke-width="1.6" />
      <line x1="74" y1="10" x2="46" y2="24" stroke="var(--c-muted)" stroke-width="1.6" />
      <rect x="132" width="120" height="34" rx="5" class="new" stroke-width="2.4" />
      <text x="192" y="22" class="col" text-anchor="middle">full_name</text>
    </g>
    <text x="406" y="34" class="cap">옛 경로 호출이 0인 것을 확인한 뒤</text>
    <text x="406" y="52" class="cap mono">ALTER TABLE ... DROP COLUMN</text>
    <text x="676" y="42" class="ok">완료</text>
  </g>

  <!-- 핵심 원칙 -->
  <g transform="translate(24 514)">
    <rect width="368" height="84" rx="8" fill="var(--c-soft-4)" stroke="var(--c-accent-4)" stroke-width="1.6" />
    <text x="20" y="26" class="ttl">어느 단계에서도 두 버전이 함께 돕니다</text>
    <text x="20" y="50" class="cap">배포 중에는 옛 코드와 새 코드가 동시에 있습니다.</text>
    <text x="20" y="68" class="cap">한 번에 바꾸면 그 순간 깨집니다.</text>
  </g>
  <g transform="translate(408 514)">
    <rect width="368" height="84" rx="8" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="20" y="26" class="ttl">"아무도 안 쓴다"를 어떻게 확인하는가</text>
    <text x="20" y="50" class="cap">옛 경로에 로그를 심고, 일정 기간 호출이 0인 것을</text>
    <text x="20" y="68" class="cap">확인한 뒤 지웁니다: ep.13 관측 경계와 이어집니다.</text>
  </g>
</svg>