<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">변경 경계와 Strangler Fig: ep.12 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="74%" cy="30%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-4)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent-4)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="22%" cy="74%" r="46%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <circle cx="80" cy="110" r="230" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="880" y="400" width="500" height="350" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(9 1130 575)"/>

  <!-- 메타포: 옛 구조를 감싸며 자라 대체하는 새 구조 -->
  <g transform="translate(600 315)">
    <!-- 옛 구조 (점점 흐려지는 격자 기둥) -->
    <g transform="translate(-150 0)">
      <g opacity="0.9">
        <rect x="-90" y="-200" width="180" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.4"/>
        <rect x="-64" y="-180" width="80" height="9" rx="4.5" fill="var(--c-line)" opacity="0.4"/>
      </g>
      <g opacity="0.6">
        <rect x="-90" y="-125" width="180" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.2"/>
        <rect x="-64" y="-105" width="100" height="9" rx="4.5" fill="var(--c-line)" opacity="0.35"/>
      </g>
      <g opacity="0.4">
        <rect x="-90" y="-50" width="180" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>
        <rect x="-64" y="-30" width="70" height="9" rx="4.5" fill="var(--c-line)" opacity="0.3"/>
      </g>
      <g opacity="0.24">
        <rect x="-90" y="25" width="180" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.8" stroke-dasharray="5 5"/>
      </g>
      <g opacity="0.14">
        <rect x="-90" y="100" width="180" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="4 6"/>
      </g>
    </g>

    <!-- 감싸며 자라는 새 구조 (덩굴 곡선) -->
    <g fill="none" stroke="var(--c-accent-4)" stroke-width="3.4" stroke-linecap="round">
      <path d="M -40 220 Q -20 120 -90 60 Q -170 -10 -100 -90 Q -40 -160 -30 -230"/>
      <path d="M 20 220 Q 60 130 -10 70 Q -90 0 -20 -80 Q 40 -150 40 -230" opacity="0.7"/>
    </g>
    <!-- 덩굴 잎(작은 사각형/원) -->
    <g fill="var(--c-accent-4)">
      <circle cx="-84" cy="52" r="8" opacity="0.85"/>
      <circle cx="-122" cy="-24" r="7" opacity="0.6"/>
      <circle cx="-56" cy="-116" r="7" opacity="0.5"/>
      <circle cx="6" cy="66" r="7" opacity="0.55"/>
      <circle cx="-52" cy="-6" r="6" opacity="0.4"/>
    </g>

    <!-- 새 구조 (선명한 블록들, 우측) -->
    <g transform="translate(230 0)">
      <g transform="rotate(-4)">
        <rect x="-90" y="-190" width="180" height="70" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="3"/>
        <rect x="-64" y="-166" width="90" height="10" rx="5" fill="var(--c-accent-4)" opacity="0.8"/>
        <rect x="-64" y="-148" width="120" height="8" rx="4" fill="var(--c-line)" opacity="0.28"/>
      </g>
      <g transform="rotate(3)">
        <rect x="-90" y="-90" width="180" height="70" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="3"/>
        <rect x="-64" y="-66" width="70" height="10" rx="5" fill="var(--c-accent-4)" opacity="0.7"/>
        <polyline points="30,-52 40,-42 62,-66" fill="none" stroke="var(--c-accent-4)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(-5)">
        <rect x="-90" y="10" width="180" height="70" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="3"/>
        <rect x="-64" y="34" width="106" height="10" rx="5" fill="var(--c-accent-4)" opacity="0.6"/>
        <rect x="-64" y="52" width="66" height="8" rx="4" fill="var(--c-line)" opacity="0.28"/>
      </g>
      <rect x="-110" y="-210" width="220" height="310" rx="10" fill="none" stroke="var(--c-accent-4)" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.6"/>
    </g>

    <!-- 파사드 (앞의 세로 게이트) -->
    <g transform="translate(48 0)">
      <line x1="0" y1="-250" x2="6" y2="250" stroke="var(--c-accent-2)" stroke-width="4.4" stroke-linecap="round"/>
      <circle cx="3" cy="-60" r="12" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="3"/>
      <circle cx="3" cy="70" r="12" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="3"/>
    </g>

    <!-- 좌하단 미니 바 (남은 비중) -->
    <g transform="translate(-400 200) rotate(-6)">
      <rect width="34" height="10" rx="5" fill="var(--c-line)" opacity="0.28"/>
      <rect y="20" width="90" height="10" rx="5" fill="var(--c-accent-4)" opacity="0.75"/>
    </g>
  </g>

  <!-- 디테일 -->
  <g transform="translate(1020 130)">
    <circle r="4" fill="var(--c-accent-2)"/>
    <circle cx="16" r="4" fill="var(--c-accent-2)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent-2)" opacity="0.3"/>
  </g>
  <g transform="translate(140 520)" opacity="0.6">
    <circle r="44" fill="none" stroke="var(--c-accent)" stroke-width="1.5"/>
    <circle r="24" fill="none" stroke="var(--c-accent)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">12</text>
</svg>
