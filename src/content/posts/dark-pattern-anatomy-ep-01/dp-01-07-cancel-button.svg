<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .title {
        font-size: 14px;
        font-weight: 500;
        fill: #2C2C2A;
      }

      .body {
        font-size: 11px;
        fill: #5F5E5A;
      }

      .annot {
        font-size: 11px;
        fill: #5F5E5A;
      }

      .annot-bold {
        font-size: 11px;
        font-weight: 600;
      }

      .pair-label {
        font-size: 13px;
        fill: #888780;
        font-weight: 500;
      }
    </style>
  </defs>

  <rect width="800" height="460" fill="#F9F8F4" rx="16" />

  <!-- Pair label -->
  <text x="400" y="34" text-anchor="middle" class="pair-label">사례 3. 구독 해지</text>

  <!-- ═══════ LEFT: DARK ═══════ -->
  <rect x="48" y="52" width="320" height="340" rx="12" fill="#F1EFE8" />

  <!-- Tag -->
  <rect x="64" y="68" width="50" height="20" rx="4" fill="#FCEBEB" />
  <text x="89" y="81" text-anchor="middle" class="label" fill="#791F1F">DARK</text>

  <!-- Screen -->
  <rect x="64" y="96" width="288" height="220" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5" />

  <!-- Title -->
  <text x="84" y="122" class="title">정말 떠나시겠어요?</text>

  <!-- Body: fear text -->
  <text x="84" y="142" font-size="11" fill="#5F5E5A">구독을 해지하면 12,000원 상당의</text>
  <text x="84" y="156" font-size="11" fill="#5F5E5A">혜택이 사라집니다.</text>
  <text x="84" y="180" font-size="11" fill="#E24B4A">지금 해지하면 저장된 데이터도 삭제됩니다.</text>

  <!-- Primary CTA: green (stay) — misdirection -->
  <rect x="84" y="196" width="248" height="36" rx="8" fill="#1D9E75" />
  <text x="208" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">혜택 유지하기</text>

  <!-- Secondary: tiny cancel -->
  <text x="208" y="250" text-anchor="middle" font-size="10" fill="#B4B2A9">그래도 해지할게요 →</text>

  <!-- Annotation -->
  <rect x="64" y="324" width="288" height="62" rx="6" fill="#FCEBEB" />
  <text x="80" y="342" class="annot-bold" fill="#791F1F">Confirmshaming + Misdirection</text>
  <text x="80" y="358" class="annot" fill="#791F1F">감정·공포 카피, 유지 버튼을 주요 액션으로</text>
  <text x="80" y="374" class="annot" fill="#791F1F">배치. 데이터 삭제 위협으로 압박.</text>

  <!-- ═══════ RIGHT: BRIGHT ═══════ -->
  <rect x="432" y="52" width="320" height="340" rx="12" fill="#F1EFE8" />

  <!-- Tag -->
  <rect x="448" y="68" width="60" height="20" rx="4" fill="#E1F5EE" />
  <text x="478" y="81" text-anchor="middle" class="label" fill="#085041">BRIGHT</text>

  <!-- Screen -->
  <rect x="448" y="96" width="288" height="220" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5" />

  <!-- Title -->
  <text x="468" y="122" class="title">구독 해지</text>

  <!-- Body: factual -->
  <text x="468" y="142" font-size="11" fill="#5F5E5A">구독을 해지하면 다음 결제일부터</text>
  <text x="468" y="156" font-size="11" fill="#5F5E5A">요금이 청구되지 않습니다.</text>
  <text x="468" y="170" font-size="11" fill="#5F5E5A">저장된 데이터는 30일간 보관됩니다.</text>

  <!-- Primary CTA: dark (cancel) — correct action -->
  <rect x="468" y="186" width="248" height="36" rx="8" fill="#2C2C2A" />
  <text x="592" y="208" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">해지하기</text>

  <!-- Secondary: equal weight keep -->
  <rect x="468" y="230" width="248" height="36" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" />
  <text x="592" y="252" text-anchor="middle" font-size="13" fill="#5F5E5A">취소</text>

  <!-- Annotation -->
  <rect x="448" y="324" width="288" height="62" rx="6" fill="#E1F5EE" />
  <text x="464" y="342" class="annot" fill="#085041">사실 기반 안내, 데이터 보관 기간 명시.</text>
  <text x="464" y="358" class="annot" fill="#085041">해지가 주요 액션으로 배치.</text>
  <text x="464" y="374" class="annot" fill="#085041">공포 유발 카피 없음.</text>

  <!-- VS divider -->
  <line x1="400" y1="72" x2="400" y2="392" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4" />
  <circle cx="400" cy="232" r="16" fill="#F1EFE8" />
  <text x="400" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#888780">VS</text>
</svg>