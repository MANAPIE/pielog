<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
      .title { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .body { font-size: 11px; fill: #5F5E5A; }
      .annot { font-size: 11px; fill: #5F5E5A; }
      .annot-bold { font-size: 11px; font-weight: 600; }
      .pair-label { font-size: 13px; fill: #888780; font-weight: 500; }
      .page-bg { fill: #F9F8F4; }
      .frame-bg { fill: #F1EFE8; }
      .screen-bg { fill: #FFFFFF; stroke: #D3D1C7; stroke-width: 0.5; }
      .red-tag { fill: #FCEBEB; }
      .red-tag-text { fill: #791F1F; }
      .teal-tag { fill: #E1F5EE; }
      .teal-tag-text { fill: #085041; }
      .red-annot-bg { fill: #FCEBEB; }
      .red-annot-text { fill: #791F1F; }
      .teal-annot-bg { fill: #E1F5EE; }
      .teal-annot-text { fill: #085041; }
      .red-emph { fill: #E24B4A; }
      .cta-teal { fill: #1D9E75; }
      .cta-dark { fill: #2C2C2A; }
      .cta-dark-text { fill: #FFFFFF; }
      .secondary-btn { fill: none; stroke: #D3D1C7; stroke-width: 0.5; }
      .secondary-btn-text { fill: #5F5E5A; }
      .muted-text { fill: #B4B2A9; }
      .vs-divider { stroke: #D3D1C7; stroke-width: 0.5; }
      .vs-circle { fill: #F1EFE8; }
      .vs-text { fill: #888780; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #D3D1C7; }
        .body { fill: #B4B2A9; }
        .annot { fill: #B4B2A9; }
        .pair-label { fill: #888780; }
        .page-bg { fill: #1C1B1A; }
        .frame-bg { fill: #2C2C2A; }
        .screen-bg { fill: #1C1B1A; stroke: #444441; }
        .red-tag { fill: #501313; }
        .red-tag-text { fill: #F7C1C1; }
        .teal-tag { fill: #04342C; }
        .teal-tag-text { fill: #9FE1CB; }
        .red-annot-bg { fill: #501313; }
        .red-annot-text { fill: #F7C1C1; }
        .teal-annot-bg { fill: #04342C; }
        .teal-annot-text { fill: #9FE1CB; }
        .red-emph { fill: #F09595; }
        .cta-dark { fill: #E5E3DC; }
        .cta-dark-text { fill: #1C1B1A; }
        .secondary-btn { stroke: #5F5E5A; }
        .secondary-btn-text { fill: #B4B2A9; }
        .muted-text { fill: #5F5E5A; }
        .vs-divider { stroke: #444441; }
        .vs-circle { fill: #2C2C2A; }
        .vs-text { fill: #888780; }
      }
    </style>
  </defs>

  <rect class="page-bg" width="800" height="460" rx="16" />

  <!-- Pair label -->
  <text x="400" y="34" text-anchor="middle" class="pair-label">사례 3. 구독 해지</text>

  <!-- ═══════ LEFT: DARK ═══════ -->
  <rect class="frame-bg" x="48" y="52" width="320" height="340" rx="12" />

  <!-- Tag -->
  <rect class="red-tag" x="64" y="68" width="50" height="20" rx="4" />
  <text x="89" y="81" text-anchor="middle" class="label red-tag-text">DARK</text>

  <!-- Screen -->
  <rect class="screen-bg" x="64" y="96" width="288" height="220" rx="8" />

  <!-- Title -->
  <text x="84" y="122" class="title">정말 떠나시겠어요?</text>

  <!-- Body: fear text -->
  <text x="84" y="142" font-size="11" class="body">구독을 해지하면 12,000원 상당의</text>
  <text x="84" y="156" font-size="11" class="body">혜택이 사라집니다.</text>
  <text x="84" y="180" font-size="11" class="red-emph">지금 해지하면 저장된 데이터도 삭제됩니다.</text>

  <!-- Primary CTA: green (stay) — misdirection -->
  <rect class="cta-teal" x="84" y="196" width="248" height="36" rx="8" />
  <text x="208" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">혜택 유지하기</text>

  <!-- Secondary: tiny cancel -->
  <text x="208" y="250" text-anchor="middle" font-size="10" class="muted-text">그래도 해지할게요 →</text>

  <!-- Annotation -->
  <rect class="red-annot-bg" x="64" y="324" width="288" height="62" rx="6" />
  <text x="80" y="342" class="annot-bold red-annot-text">Confirmshaming + Misdirection</text>
  <text x="80" y="358" class="annot red-annot-text">감정·공포 카피, 유지 버튼을 주요 액션으로</text>
  <text x="80" y="374" class="annot red-annot-text">배치. 데이터 삭제 위협으로 압박.</text>

  <!-- ═══════ RIGHT: BRIGHT ═══════ -->
  <rect class="frame-bg" x="432" y="52" width="320" height="340" rx="12" />

  <!-- Tag -->
  <rect class="teal-tag" x="448" y="68" width="60" height="20" rx="4" />
  <text x="478" y="81" text-anchor="middle" class="label teal-tag-text">BRIGHT</text>

  <!-- Screen -->
  <rect class="screen-bg" x="448" y="96" width="288" height="220" rx="8" />

  <!-- Title -->
  <text x="468" y="122" class="title">구독 해지</text>

  <!-- Body: factual -->
  <text x="468" y="142" font-size="11" class="body">구독을 해지하면 다음 결제일부터</text>
  <text x="468" y="156" font-size="11" class="body">요금이 청구되지 않습니다.</text>
  <text x="468" y="170" font-size="11" class="body">저장된 데이터는 30일간 보관됩니다.</text>

  <!-- Primary CTA: dark (cancel) — correct action -->
  <rect class="cta-dark" x="468" y="186" width="248" height="36" rx="8" />
  <text x="592" y="208" text-anchor="middle" font-size="13" font-weight="500" class="cta-dark-text">해지하기</text>

  <!-- Secondary: equal weight keep -->
  <rect class="secondary-btn" x="468" y="230" width="248" height="36" rx="8" />
  <text x="592" y="252" text-anchor="middle" font-size="13" class="secondary-btn-text">취소</text>

  <!-- Annotation -->
  <rect class="teal-annot-bg" x="448" y="324" width="288" height="62" rx="6" />
  <text x="464" y="342" class="annot teal-annot-text">사실 기반 안내, 데이터 보관 기간 명시.</text>
  <text x="464" y="358" class="annot teal-annot-text">해지가 주요 액션으로 배치.</text>
  <text x="464" y="374" class="annot teal-annot-text">공포 유발 카피 없음.</text>

  <!-- VS divider -->
  <line class="vs-divider" x1="400" y1="72" x2="400" y2="392" stroke-dasharray="4 4" />
  <circle class="vs-circle" cx="400" cy="232" r="16" />
  <text x="400" y="237" text-anchor="middle" font-size="11" font-weight="600" class="vs-text">VS</text>
</svg>
