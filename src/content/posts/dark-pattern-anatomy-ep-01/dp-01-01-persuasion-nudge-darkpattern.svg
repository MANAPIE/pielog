<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .teal-bg { fill: #E1F5EE; stroke: #5DCAA5; stroke-width: 0.5; }
  .teal-th { fill: #085041; }
  .teal-ts { fill: #0F6E56; }
  .amber-bg { fill: #FAEEDA; stroke: #FAC775; stroke-width: 0.5; }
  .amber-th { fill: #633806; }
  .amber-ts { fill: #854F0B; }
  .red-bg { fill: #FCEBEB; stroke: #F09595; stroke-width: 0.5; }
  .red-th { fill: #791F1F; }
  .red-ts { fill: #A32D2D; }
  .spec-teal { fill: #5DCAA5; fill-opacity: 0.6; }
  .spec-amber { fill: #FAC775; fill-opacity: 0.6; }
  .spec-red { fill: #F09595; fill-opacity: 0.6; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #D3D1C7; }
    .ts { fill: #B4B2A9; }
    .teal-bg { fill: #04342C; stroke: #0F6E56; }
    .teal-th { fill: #9FE1CB; }
    .teal-ts { fill: #5DCAA5; }
    .amber-bg { fill: #412402; stroke: #854F0B; }
    .amber-th { fill: #FAC775; }
    .amber-ts { fill: #EF9F27; }
    .red-bg { fill: #501313; stroke: #A32D2D; }
    .red-th { fill: #F7C1C1; }
    .red-ts { fill: #E89898; }
    .spec-teal { fill: #0F6E56; fill-opacity: 0.8; }
    .spec-amber { fill: #854F0B; fill-opacity: 0.8; }
    .spec-red { fill: #A32D2D; fill-opacity: 0.8; }
  }
</style>

<!-- Three header boxes -->
<rect class="teal-bg" x="40" y="40" width="180" height="70" rx="12"/>
<text class="th teal-th" x="130" y="66" text-anchor="middle" dominant-baseline="central">설득</text>
<text class="ts teal-ts" x="130" y="86" text-anchor="middle" dominant-baseline="central">Persuasion</text>

<rect class="amber-bg" x="250" y="40" width="180" height="70" rx="12"/>
<text class="th amber-th" x="340" y="66" text-anchor="middle" dominant-baseline="central">넛지</text>
<text class="ts amber-ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">Nudge</text>

<rect class="red-bg" x="460" y="40" width="180" height="70" rx="12"/>
<text class="th red-th" x="550" y="66" text-anchor="middle" dominant-baseline="central">다크패턴</text>
<text class="ts red-ts" x="550" y="86" text-anchor="middle" dominant-baseline="central">Deceptive pattern</text>

<!-- Spectrum bar -->
<rect class="spec-teal" x="40" y="130" width="200" height="8" rx="4"/>
<rect class="spec-amber" x="200" y="130" width="240" height="8"/>
<rect class="spec-red" x="400" y="130" width="240" height="8" rx="4"/>

<!-- Row 1: 투명성 -->
<text class="th" x="40" y="176" dominant-baseline="central">투명성</text>
<text class="ts" x="40" y="194" dominant-baseline="central">의도가 드러나 있는가?</text>
<rect class="teal-bg" x="280" y="164" width="100" height="36" rx="6"/>
<text class="ts teal-th" x="330" y="182" text-anchor="middle" dominant-baseline="central">명시적</text>
<rect class="amber-bg" x="400" y="164" width="100" height="36" rx="6"/>
<text class="ts amber-th" x="450" y="182" text-anchor="middle" dominant-baseline="central">암묵적</text>
<rect class="red-bg" x="520" y="164" width="100" height="36" rx="6"/>
<text class="ts red-th" x="570" y="182" text-anchor="middle" dominant-baseline="central">은폐</text>

<!-- Row 2: 이익 귀속 -->
<text class="th" x="40" y="232" dominant-baseline="central">이익 귀속</text>
<text class="ts" x="40" y="250" dominant-baseline="central">누구에게 유리한가?</text>
<rect class="teal-bg" x="280" y="220" width="100" height="36" rx="6"/>
<text class="ts teal-th" x="330" y="238" text-anchor="middle" dominant-baseline="central">사용자</text>
<rect class="amber-bg" x="400" y="220" width="100" height="36" rx="6"/>
<text class="ts amber-th" x="450" y="238" text-anchor="middle" dominant-baseline="central">양쪽</text>
<rect class="red-bg" x="520" y="220" width="100" height="36" rx="6"/>
<text class="ts red-th" x="570" y="238" text-anchor="middle" dominant-baseline="central">사업자</text>

<!-- Row 3: 동의 가능성 -->
<text class="th" x="40" y="288" dominant-baseline="central">동의 가능성</text>
<text class="ts" x="40" y="306" dominant-baseline="central">거부할 수 있는가?</text>
<rect class="teal-bg" x="280" y="276" width="100" height="36" rx="6"/>
<text class="ts teal-th" x="330" y="294" text-anchor="middle" dominant-baseline="central">자유로움</text>
<rect class="amber-bg" x="400" y="276" width="100" height="36" rx="6"/>
<text class="ts amber-th" x="450" y="294" text-anchor="middle" dominant-baseline="central">가능하나 불편</text>
<rect class="red-bg" x="520" y="276" width="100" height="36" rx="6"/>
<text class="ts red-th" x="570" y="294" text-anchor="middle" dominant-baseline="central">사실상 불가</text>

<!-- Examples -->
<text class="ts" x="130" y="350" text-anchor="middle" dominant-baseline="central">"지금 가입하면 20% 할인"</text>
<text class="ts" x="340" y="350" text-anchor="middle" dominant-baseline="central">"절전 모드가 기본값"</text>
<text class="ts" x="550" y="350" text-anchor="middle" dominant-baseline="central">"해지하려면 전화하세요"</text>
<text class="ts teal-ts" x="130" y="370" text-anchor="middle" dominant-baseline="central">→ 정직한 제안</text>
<text class="ts amber-ts" x="340" y="370" text-anchor="middle" dominant-baseline="central">→ 유도하되 선택 존중</text>
<text class="ts red-ts" x="550" y="370" text-anchor="middle" dominant-baseline="central">→ 기만적 설계</text>
</svg>
