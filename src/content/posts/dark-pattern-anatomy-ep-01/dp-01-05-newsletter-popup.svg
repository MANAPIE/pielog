<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .title {
        font-size: 14px;
        font-weight: 500;
        fill: #2C2C2A;
      }

      .body {
        font-size: 11px;
        fill: #5F5E5A;
      }

      .annot {
        font-size: 11px;
        fill: #5F5E5A;
      }

      .annot-bold {
        font-size: 11px;
        font-weight: 600;
      }

      .caption {
        font-size: 13px;
        fill: #888780;
        font-weight: 500;
      }

      .pair-label {
        font-size: 13px;
        fill: #888780;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" fill="#F9F8F4" rx="16" />

  <!-- Pair label -->
  <text x="400" y="34" text-anchor="middle" class="pair-label">사례 1. 뉴스레터 구독 팝업</text>

  <!-- ═══════ LEFT: DARK ═══════ -->
  <!-- Device frame -->
  <rect x="48" y="52" width="320" height="340" rx="12" fill="#F1EFE8" />

  <!-- Tag: Dark -->
  <rect x="64" y="68" width="50" height="20" rx="4" fill="#FCEBEB" />
  <text x="89" y="81" text-anchor="middle" class="label" fill="#791F1F">DARK</text>

  <!-- Screen -->
  <rect x="64" y="96" width="288" height="210" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5" />

  <!-- Screen title -->
  <text x="84" y="122" class="title">특별 할인 혜택을 받으세요!</text>

  <!-- Screen body -->
  <text x="84" y="142" class="body">지금 가입하면 첫 구매 30% 할인 쿠폰을</text>
  <text x="84" y="157" class="body">드립니다. 이 기회를 놓치지 마세요!</text>

  <!-- Primary button: CTA red -->
  <rect x="84" y="170" width="248" height="36" rx="8" fill="#E24B4A" />
  <text x="208" y="192" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">네, 할인 받을래요!</text>

  <!-- Secondary button: shame text -->
  <text x="208" y="228" text-anchor="middle" font-size="10" fill="#B4B2A9">아니요, 정가로 구매하겠습니다</text>

  <!-- Annotation -->
  <rect x="64" y="314" width="288" height="62" rx="6" fill="#FCEBEB" />
  <text x="80" y="332" class="annot-bold" fill="#791F1F">Confirmshaming</text>
  <text x="80" y="348" class="annot" fill="#791F1F">거절 카피가 사용자를 부정적으로 표현.</text>
  <text x="80" y="364" class="annot" fill="#791F1F">수치심 유도로 클릭 유도.</text>

  <!-- ═══════ RIGHT: BRIGHT ═══════ -->
  <!-- Device frame -->
  <rect x="432" y="52" width="320" height="340" rx="12" fill="#F1EFE8" />

  <!-- Tag: Bright -->
  <rect x="448" y="68" width="60" height="20" rx="4" fill="#E1F5EE" />
  <text x="478" y="81" text-anchor="middle" class="label" fill="#085041">BRIGHT</text>

  <!-- Screen -->
  <rect x="448" y="96" width="288" height="210" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5" />

  <!-- Screen title -->
  <text x="468" y="122" class="title">뉴스레터 구독</text>

  <!-- Screen body -->
  <text x="468" y="142" class="body">신규 할인, 이벤트 소식을 이메일로 보내드립니다.</text>
  <text x="468" y="157" class="body">언제든 해지할 수 있습니다.</text>

  <!-- Primary button: teal -->
  <rect x="468" y="170" width="248" height="36" rx="8" fill="#1D9E75" />
  <text x="592" y="192" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">구독하기</text>

  <!-- Secondary button: equal weight -->
  <rect x="468" y="214" width="248" height="36" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" />
  <text x="592" y="236" text-anchor="middle" font-size="13" fill="#5F5E5A">다음에 할게요</text>

  <!-- Annotation -->
  <rect x="448" y="314" width="288" height="62" rx="6" fill="#E1F5EE" />
  <text x="464" y="332" class="annot" fill="#085041">중립적 카피, 동등한 시각 위계.</text>
  <text x="464" y="348" class="annot" fill="#085041">해지 가능성 명시. 두 버튼의</text>
  <text x="464" y="364" class="annot" fill="#085041">크기·색상이 동등하게 처리.</text>

  <!-- VS divider -->
  <line x1="400" y1="72" x2="400" y2="392" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4" />
  <circle cx="400" cy="232" r="16" fill="#F1EFE8" />
  <text x="400" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#888780">VS</text>
</svg>