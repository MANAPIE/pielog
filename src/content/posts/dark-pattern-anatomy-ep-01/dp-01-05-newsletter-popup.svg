<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
      .title { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .body { font-size: 11px; fill: #5F5E5A; }
      .annot { font-size: 11px; fill: #5F5E5A; }
      .annot-bold { font-size: 11px; font-weight: 600; }
      .caption { font-size: 13px; fill: #888780; font-weight: 500; }
      .pair-label { font-size: 13px; fill: #888780; font-weight: 500; }
      .page-bg { fill: #F9F8F4; }
      .frame-bg { fill: #F1EFE8; }
      .screen-bg { fill: #FFFFFF; stroke: #D3D1C7; stroke-width: 0.5; }
      .red-tag { fill: #FCEBEB; }
      .red-tag-text { fill: #791F1F; }
      .teal-tag { fill: #E1F5EE; }
      .teal-tag-text { fill: #085041; }
      .red-annot-bg { fill: #FCEBEB; }
      .red-annot-text { fill: #791F1F; }
      .teal-annot-bg { fill: #E1F5EE; }
      .teal-annot-text { fill: #085041; }
      .cta-red { fill: #E24B4A; }
      .cta-teal { fill: #1D9E75; }
      .secondary-btn { fill: none; stroke: #D3D1C7; stroke-width: 0.5; }
      .secondary-btn-text { fill: #5F5E5A; }
      .muted-text { fill: #B4B2A9; }
      .vs-divider { stroke: #D3D1C7; stroke-width: 0.5; }
      .vs-circle { fill: #F1EFE8; }
      .vs-text { fill: #888780; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #D3D1C7; }
        .body { fill: #B4B2A9; }
        .annot { fill: #B4B2A9; }
        .caption { fill: #888780; }
        .pair-label { fill: #888780; }
        .page-bg { fill: #1C1B1A; }
        .frame-bg { fill: #2C2C2A; }
        .screen-bg { fill: #1C1B1A; stroke: #444441; }
        .red-tag { fill: #501313; }
        .red-tag-text { fill: #F7C1C1; }
        .teal-tag { fill: #04342C; }
        .teal-tag-text { fill: #9FE1CB; }
        .red-annot-bg { fill: #501313; }
        .red-annot-text { fill: #F7C1C1; }
        .teal-annot-bg { fill: #04342C; }
        .teal-annot-text { fill: #9FE1CB; }
        .secondary-btn { stroke: #5F5E5A; }
        .secondary-btn-text { fill: #B4B2A9; }
        .muted-text { fill: #5F5E5A; }
        .vs-divider { stroke: #444441; }
        .vs-circle { fill: #2C2C2A; }
        .vs-text { fill: #888780; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="page-bg" width="800" height="460" rx="16" />

  <!-- Pair label -->
  <text x="400" y="34" text-anchor="middle" class="pair-label">사례 1. 뉴스레터 구독 팝업</text>

  <!-- ═══════ LEFT: DARK ═══════ -->
  <!-- Device frame -->
  <rect class="frame-bg" x="48" y="52" width="320" height="340" rx="12" />

  <!-- Tag: Dark -->
  <rect class="red-tag" x="64" y="68" width="50" height="20" rx="4" />
  <text x="89" y="81" text-anchor="middle" class="label red-tag-text">DARK</text>

  <!-- Screen -->
  <rect class="screen-bg" x="64" y="96" width="288" height="210" rx="8" />

  <!-- Screen title -->
  <text x="84" y="122" class="title">특별 할인 혜택을 받으세요!</text>

  <!-- Screen body -->
  <text x="84" y="142" class="body">지금 가입하면 첫 구매 30% 할인 쿠폰을</text>
  <text x="84" y="157" class="body">드립니다. 이 기회를 놓치지 마세요!</text>

  <!-- Primary button: CTA red -->
  <rect class="cta-red" x="84" y="170" width="248" height="36" rx="8" />
  <text x="208" y="192" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">네, 할인 받을래요!</text>

  <!-- Secondary button: shame text -->
  <text x="208" y="228" text-anchor="middle" font-size="10" class="muted-text">아니요, 정가로 구매하겠습니다</text>

  <!-- Annotation -->
  <rect class="red-annot-bg" x="64" y="314" width="288" height="62" rx="6" />
  <text x="80" y="332" class="annot-bold red-annot-text">Confirmshaming</text>
  <text x="80" y="348" class="annot red-annot-text">거절 카피가 사용자를 부정적으로 표현.</text>
  <text x="80" y="364" class="annot red-annot-text">수치심 유도로 클릭 유도.</text>

  <!-- ═══════ RIGHT: BRIGHT ═══════ -->
  <!-- Device frame -->
  <rect class="frame-bg" x="432" y="52" width="320" height="340" rx="12" />

  <!-- Tag: Bright -->
  <rect class="teal-tag" x="448" y="68" width="60" height="20" rx="4" />
  <text x="478" y="81" text-anchor="middle" class="label teal-tag-text">BRIGHT</text>

  <!-- Screen -->
  <rect class="screen-bg" x="448" y="96" width="288" height="210" rx="8" />

  <!-- Screen title -->
  <text x="468" y="122" class="title">뉴스레터 구독</text>

  <!-- Screen body -->
  <text x="468" y="142" class="body">신규 할인, 이벤트 소식을 이메일로 보내드립니다.</text>
  <text x="468" y="157" class="body">언제든 해지할 수 있습니다.</text>

  <!-- Primary button: teal -->
  <rect class="cta-teal" x="468" y="170" width="248" height="36" rx="8" />
  <text x="592" y="192" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">구독하기</text>

  <!-- Secondary button: equal weight -->
  <rect class="secondary-btn" x="468" y="214" width="248" height="36" rx="8" />
  <text x="592" y="236" text-anchor="middle" font-size="13" class="secondary-btn-text">다음에 할게요</text>

  <!-- Annotation -->
  <rect class="teal-annot-bg" x="448" y="314" width="288" height="62" rx="6" />
  <text x="464" y="332" class="annot teal-annot-text">중립적 카피, 동등한 시각 위계.</text>
  <text x="464" y="348" class="annot teal-annot-text">해지 가능성 명시. 두 버튼의</text>
  <text x="464" y="364" class="annot teal-annot-text">크기·색상이 동등하게 처리.</text>

  <!-- VS divider -->
  <line class="vs-divider" x1="400" y1="72" x2="400" y2="392" stroke-dasharray="4 4" />
  <circle class="vs-circle" cx="400" cy="232" r="16" />
  <text x="400" y="237" text-anchor="middle" font-size="11" font-weight="600" class="vs-text">VS</text>
</svg>
