<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-labelledby="title desc">
  <title id="title">CPC 광고 클릭 흐름</title>
  <desc id="desc">광고 노출, 클릭, 랜딩 페이지 도착까지의 흐름과 각 단계에서 측정되는 지표.</desc>
  <style>
    :root {
      --c-bg: #fafaf7;
      --c-fg: #1a1a1a;
      --c-muted: #6b6b6b;
      --c-faint: #b3b3b0;
      --c-card: #ffffff;
      --c-card-stroke: #1a1a1a;
      --c-step: #2d4a3e;
      --c-step-fg: #ffffff;
      --c-accent: #c97f4a;
      --c-formula-bg: #ede9df;
      --c-flag: #c97f4a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e;
        --c-fg: #ededea;
        --c-muted: #999996;
        --c-faint: #4a4a47;
        --c-card: #1a1a18;
        --c-card-stroke: #ededea;
        --c-step: #7fb09a;
        --c-step-fg: #0f0f0e;
        --c-accent: #e09a6a;
        --c-formula-bg: #1f1d18;
        --c-flag: #e09a6a;
      }
    }
    .bg { fill: var(--c-bg); }
    .step-circle { fill: var(--c-step); }
    .step-num { font: 700 13px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-step-fg); }
    .card { fill: var(--c-card); stroke: var(--c-card-stroke); stroke-width: 1.25; }
    .label { font: 600 13px ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; fill: var(--c-fg); }
    .sublabel { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: var(--c-muted); }
    .metric { font: 600 11px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-accent); letter-spacing: 0.05em; }
    .arrow { fill: var(--c-faint); }
    .arrow-line { stroke: var(--c-faint); stroke-width: 1.5; fill: none; }
    .title { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: var(--c-fg); }
    .formula { fill: var(--c-formula-bg); }
    .formula-text { font: 500 12px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-fg); }
    .flag { font: 600 10px ui-sans-serif, system-ui, sans-serif; fill: var(--c-flag); }
  </style>
  <rect class="bg" width="600" height="740"/>

  <text class="title" x="40" y="36">노출에서 클릭, 그리고 그 다음</text>

  <!-- Step 1: 노출 -->
  <g transform="translate(40, 60)">
    <circle class="step-circle" cx="20" cy="20" r="18"/>
    <text class="step-num" x="20" y="25" text-anchor="middle">1</text>
    <rect class="card" x="56" y="0" width="464" height="84" rx="2"/>
    <text class="label" x="74" y="26">노출</text>
    <text class="sublabel" x="74" y="46">광고가 사용자 화면에 보여지는 순간</text>
    <line x1="74" y1="58" x2="502" y2="58" stroke="var(--c-faint)" stroke-width="0.5"/>
    <text class="metric" x="74" y="76">→ IMPRESSION</text>
    <text class="metric" x="260" y="76">→ CPM 과금</text>
  </g>

  <!-- 화살표 1→2 -->
  <g transform="translate(60, 148)">
    <line class="arrow-line" x1="0" y1="0" x2="0" y2="22"/>
    <path class="arrow" d="M -5 20 L 5 20 L 0 30 Z"/>
  </g>

  <!-- Step 2: 클릭 -->
  <g transform="translate(40, 190)">
    <circle class="step-circle" cx="20" cy="20" r="18"/>
    <text class="step-num" x="20" y="25" text-anchor="middle">2</text>
    <rect class="card" x="56" y="0" width="464" height="84" rx="2"/>
    <text class="label" x="74" y="26">클릭</text>
    <text class="sublabel" x="74" y="46">사용자가 광고를 탭/클릭하는 순간</text>
    <line x1="74" y1="58" x2="502" y2="58" stroke="var(--c-faint)" stroke-width="0.5"/>
    <text class="metric" x="74" y="76">→ CLICK</text>
    <text class="metric" x="260" y="76">→ CPC 과금 / CTR</text>
  </g>

  <!-- 화살표 2→3 -->
  <g transform="translate(60, 278)">
    <line class="arrow-line" x1="0" y1="0" x2="0" y2="22"/>
    <path class="arrow" d="M -5 20 L 5 20 L 0 30 Z"/>
  </g>

  <!-- Step 3: 랜딩 -->
  <g transform="translate(40, 320)">
    <circle class="step-circle" cx="20" cy="20" r="18"/>
    <text class="step-num" x="20" y="25" text-anchor="middle">3</text>
    <rect class="card" x="56" y="0" width="464" height="84" rx="2"/>
    <text class="label" x="74" y="26">랜딩 페이지 도착</text>
    <text class="sublabel" x="74" y="46">우리 사이트/앱 스토어/앱 첫 화면</text>
    <line x1="74" y1="58" x2="502" y2="58" stroke="var(--c-faint)" stroke-width="0.5"/>
    <text class="metric" x="74" y="76">→ PAGEVIEW</text>
    <text class="metric" x="260" y="76">→ Bounce 측정 시작</text>
  </g>

  <!-- 화살표 3→4 -->
  <g transform="translate(60, 408)">
    <line class="arrow-line" x1="0" y1="0" x2="0" y2="22"/>
    <path class="arrow" d="M -5 20 L 5 20 L 0 30 Z"/>
  </g>

  <!-- Step 4: 전환 -->
  <g transform="translate(40, 450)">
    <circle class="step-circle" cx="20" cy="20" r="18" style="fill: var(--c-accent);"/>
    <text class="step-num" x="20" y="25" text-anchor="middle">4</text>
    <rect class="card" x="56" y="0" width="464" height="84" rx="2" style="stroke: var(--c-accent);"/>
    <text class="label" x="74" y="26">전환</text>
    <text class="sublabel" x="74" y="46">가입/구매/설치 완료</text>
    <line x1="74" y1="58" x2="502" y2="58" stroke="var(--c-faint)" stroke-width="0.5"/>
    <text class="metric" x="74" y="76">→ CVR</text>
    <text class="metric" x="260" y="76">→ CPA</text>
  </g>

  <!-- 누락 표시 -->
  <g transform="translate(40, 570)">
    <text class="flag" x="0" y="0">⚠ 흔한 누락 지점</text>
    <text class="sublabel" x="0" y="18">광고 차단기, 페이지 로딩 지연, 픽셀 발화 타이밍 —</text>
    <text class="sublabel" x="0" y="34">매체 측 클릭 수와 GA 측 페이지뷰가 어긋날 수 있음</text>
  </g>

  <!-- 공식 박스 -->
  <g transform="translate(40, 626)">
    <rect class="formula" width="520" height="64" rx="2"/>
    <text class="formula-text" x="20" y="28">CPC = 광고비 ÷ 클릭 수</text>
    <text class="formula-text" x="20" y="48">실질 CPC 평가 = CPC × (1 ÷ 가입 전환율) = CPA</text>
  </g>
</svg>
