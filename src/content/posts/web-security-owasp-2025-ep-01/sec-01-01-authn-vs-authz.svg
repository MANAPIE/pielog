<svg viewBox="0 0 720 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인증(Authentication)과 인가(Authorization)의 차이">
  <style>
    /* sec-theme-vars */
    :root {
      --sec-fg: #0f172a;
      --sec-fg-muted: #64748b;
      --sec-bg: #ffffff;
      --sec-border: #e2e8f0;
      --sec-slate-50: #f8fafc;
      --sec-slate-100: #f1f5f9;
      --sec-slate-200: #e2e8f0;
      --sec-slate-300: #cbd5e1;
      --sec-slate-400: #94a3b8;
      --sec-slate-500: #64748b;
      --sec-slate-700: #334155;
      --sec-blue-50: #eff6ff;
      --sec-blue-200: #bfdbfe;
      --sec-blue-500: #3b82f6;
      --sec-blue-700: #1d4ed8;
      --sec-red-50: #fef2f2;
      --sec-red-100: #fee2e2;
      --sec-red-200: #fecaca;
      --sec-red-500: #ef4444;
      --sec-red-700: #b91c1c;
      --sec-amber-50: #fffbeb;
      --sec-amber-100: #fef3c7;
      --sec-amber-200: #fde68a;
      --sec-amber-500: #f59e0b;
      --sec-amber-700: #b45309;
      --sec-emerald-50: #ecfdf5;
      --sec-emerald-100: #d1fae5;
      --sec-emerald-200: #a7f3d0;
      --sec-emerald-500: #10b981;
      --sec-emerald-700: #047857;
      --sec-violet-50: #f5f3ff;
      --sec-violet-200: #ddd6fe;
      --sec-violet-500: #8b5cf6;
      --sec-violet-700: #6d28d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sec-fg: #e2e8f0;
        --sec-fg-muted: #94a3b8;
        --sec-bg: #0f172a;
        --sec-border: #334155;
        --sec-slate-50: #1e293b;
        --sec-slate-100: #334155;
        --sec-slate-200: #475569;
        --sec-slate-300: #64748b;
        --sec-slate-400: #94a3b8;
        --sec-slate-500: #cbd5e1;
        --sec-slate-700: #e2e8f0;
        --sec-blue-50: #172554;
        --sec-blue-200: #1e40af;
        --sec-blue-500: #60a5fa;
        --sec-blue-700: #93c5fd;
        --sec-red-50: #450a0a;
        --sec-red-100: #7f1d1d;
        --sec-red-200: #991b1b;
        --sec-red-500: #f87171;
        --sec-red-700: #fca5a5;
        --sec-amber-50: #451a03;
        --sec-amber-100: #78350f;
        --sec-amber-200: #92400e;
        --sec-amber-500: #fbbf24;
        --sec-amber-700: #fcd34d;
        --sec-emerald-50: #022c22;
        --sec-emerald-100: #064e3b;
        --sec-emerald-200: #065f46;
        --sec-emerald-500: #34d399;
        --sec-emerald-700: #6ee7b7;
        --sec-violet-50: #2e1065;
        --sec-violet-200: #5b21b6;
        --sec-violet-500: #a78bfa;
        --sec-violet-700: #c4b5fd;
      }
    }

    .title { font: 600 16px system-ui, sans-serif; fill: var(--sec-fg, #0f172a); }
    .caption { font: 400 11px system-ui, sans-serif; fill: var(--sec-fg-muted, #64748b); }

    .col-tag { font: 700 11px system-ui, sans-serif; letter-spacing: 0.08em; }
    .col-head { font: 700 20px system-ui, sans-serif; fill: var(--sec-fg, #0f172a); }
    .q-text { font: 600 15px system-ui, sans-serif; fill: var(--sec-fg, #0f172a); }
    .band { font: 600 11px system-ui, sans-serif; fill: var(--sec-fg-muted, #64748b); letter-spacing: 0.02em; }
    .item { font: 400 12px system-ui, sans-serif; fill: var(--sec-fg, #0f172a); }

    .authn-box { fill: var(--sec-blue-50, #eff6ff); stroke: var(--sec-blue-200, #bfdbfe); stroke-width: 1; }
    .authz-box { fill: var(--sec-emerald-50, #ecfdf5); stroke: var(--sec-emerald-200, #a7f3d0); stroke-width: 1; }
    .authn-tag { fill: var(--sec-blue-700, #1d4ed8); }
    .authz-tag { fill: var(--sec-emerald-700, #047857); }
    .divider { stroke: var(--sec-slate-200, #e2e8f0); stroke-width: 1; }

    .flow-box { fill: var(--sec-slate-50, #f8fafc); stroke: var(--sec-slate-200, #e2e8f0); stroke-width: 1; }
    .flow-text { font: 500 11px system-ui, sans-serif; fill: var(--sec-fg, #0f172a); }
    .flow-arrow { stroke: var(--sec-slate-500, #64748b); stroke-width: 1.2; fill: none; }
  </style>

  <defs>
    <marker id="farr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sec-slate-500, #64748b)"/>
    </marker>
  </defs>

  <text x="24" y="36" class="title">인증과 인가는 다른 질문에 답합니다</text>
  <text x="24" y="56" class="caption">짝으로 쓰이지만, 해결하는 문제가 다릅니다. 어느 한쪽만 제대로 되어도 사고가 납니다.</text>

  <!-- Authentication column -->
  <rect x="24" y="88" width="320" height="240" rx="14" class="authn-box"/>
  <text x="40" y="114" class="col-tag authn-tag">AUTHENTICATION</text>
  <text x="40" y="142" class="col-head">인증</text>
  <text x="40" y="168" class="q-text">"너 누구야?"</text>

  <line x1="40" y1="184" x2="328" y2="184" class="divider"/>

  <text x="40" y="206" class="band">확인하는 것</text>
  <text x="40" y="226" class="item">· 사용자의 신원</text>
  <text x="40" y="244" class="item">· 제시한 credential의 진위</text>

  <text x="40" y="272" class="band">대표적인 수단</text>
  <text x="40" y="292" class="item">· 비밀번호, OTP, Passkey</text>
  <text x="40" y="310" class="item">· OAuth, SAML, SSO</text>

  <!-- Authorization column -->
  <rect x="376" y="88" width="320" height="240" rx="14" class="authz-box"/>
  <text x="392" y="114" class="col-tag authz-tag">AUTHORIZATION</text>
  <text x="392" y="142" class="col-head">인가</text>
  <text x="392" y="168" class="q-text">"너 이거 해도 돼?"</text>

  <line x1="392" y1="184" x2="680" y2="184" class="divider"/>

  <text x="392" y="206" class="band">확인하는 것</text>
  <text x="392" y="226" class="item">· 리소스 접근 권한</text>
  <text x="392" y="244" class="item">· 수행 가능한 액션 범위</text>

  <text x="392" y="272" class="band">대표적인 수단</text>
  <text x="392" y="292" class="item">· 역할(Role) 기반 (RBAC)</text>
  <text x="392" y="310" class="item">· 소유자 검증, 정책 기반 (ABAC)</text>

  <!-- Flow bottom -->
  <rect x="60" y="356" width="110" height="36" rx="8" class="flow-box"/>
  <text x="115" y="378" text-anchor="middle" class="flow-text">요청 들어옴</text>

  <rect x="212" y="356" width="110" height="36" rx="8" class="authn-box"/>
  <text x="267" y="378" text-anchor="middle" class="flow-text">인증으로 식별</text>

  <rect x="364" y="356" width="110" height="36" rx="8" class="authz-box"/>
  <text x="419" y="378" text-anchor="middle" class="flow-text">인가로 확인</text>

  <rect x="516" y="356" width="110" height="36" rx="8" class="flow-box"/>
  <text x="571" y="378" text-anchor="middle" class="flow-text">응답 반환</text>

  <line x1="170" y1="374" x2="210" y2="374" class="flow-arrow" marker-end="url(#farr)"/>
  <line x1="322" y1="374" x2="362" y2="374" class="flow-arrow" marker-end="url(#farr)"/>
  <line x1="474" y1="374" x2="514" y2="374" class="flow-arrow" marker-end="url(#farr)"/>
</svg>
