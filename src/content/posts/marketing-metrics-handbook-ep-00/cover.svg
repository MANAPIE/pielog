<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">ep.00 - 마케팅 지표 핸드북 개요</title>
  <style>
    :root {
      --c-bg: #fafaf7;
      --c-fg: #1a1a1a;
      --c-muted: #6b6b6b;
      --c-accent: #c97f4a;
      --c-accent-2: #2d4a3e;
      --c-accent-3: #d9a47e;
      --c-num: #c97f4a;
      --c-dot: #1a1a1a;
      --c-line: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e;
        --c-fg: #ededea;
        --c-muted: #999996;
        --c-accent: #e09a6a;
        --c-accent-2: #7fb09a;
        --c-accent-3: #d4a560;
        --c-num: #e09a6a;
        --c-dot: #ededea;
        --c-line: #4a4a47;
      }
    }
  </style>
  <defs>
    <pattern id="dotgrid00" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="var(--c-dot)" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="rg00a" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg00b" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="var(--c-bg)"/>
  <rect width="1200" height="630" fill="url(#dotgrid00)"/>
  <rect width="1200" height="630" fill="url(#rg00a)"/>
  <rect width="1200" height="630" fill="url(#rg00b)"/>

  <!-- 화면 밖으로 빠지는 큰 무채색 도형 1 -->
  <circle cx="-100" cy="700" r="380" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- 큰 도형 2 - 회전된 사각형 -->
  <rect x="950" y="-80" width="320" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(8 1110 80)"/>

  <!-- 메인 메타포: 깔때기 (퍼널) 다섯 단계 -->
  <g transform="translate(600, 315) scale(1.55)">
    <!-- 깔때기 외곽선 (점선) -->
    <path d="M -260 -180 L 260 -180 L 180 180 L -180 180 Z"
      fill="none" stroke="var(--c-fg)" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.4"/>

    <!-- 5단계 가로 라인 (각 단계 구분) -->
    <line x1="-260" y1="-180" x2="260" y2="-180" stroke="var(--c-fg)" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="-244" y1="-108" x2="244" y2="-108" stroke="var(--c-fg)" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="-228" y1="-36" x2="228" y2="-36" stroke="var(--c-fg)" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="-212" y1="36" x2="212" y2="36" stroke="var(--c-fg)" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="-196" y1="108" x2="196" y2="108" stroke="var(--c-fg)" stroke-width="1" stroke-opacity="0.3"/>

    <!-- 단계별 동심원 + 점들 (작은 디테일) -->
    <!-- 1단계 (획득) - 도트 무리 -->
    <g transform="translate(-160, -140)">
      <circle cx="0" cy="0" r="3" fill="var(--c-accent)"/>
      <circle cx="14" cy="-4" r="3" fill="var(--c-accent)"/>
      <circle cx="8" cy="10" r="3" fill="var(--c-accent)"/>
      <circle cx="-8" cy="6" r="3" fill="var(--c-accent)"/>
    </g>
    <g transform="translate(140, -150)">
      <circle cx="0" cy="0" r="3" fill="var(--c-accent)"/>
      <circle cx="14" cy="-4" r="3" fill="var(--c-accent)"/>
      <circle cx="8" cy="10" r="3" fill="var(--c-accent)"/>
    </g>

    <!-- 2단계 (활성화) - 동심원 -->
    <g transform="translate(0, -72)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="var(--c-accent-2)"/>
    </g>

    <!-- 3단계 (유지) - 미니 바 묶음 -->
    <g transform="translate(-100, 0)">
      <rect x="0" y="-12" width="6" height="24" fill="var(--c-accent-2)"/>
      <rect x="10" y="-18" width="6" height="30" fill="var(--c-accent-2)"/>
      <rect x="20" y="-9" width="6" height="21" fill="var(--c-accent-2)"/>
      <rect x="30" y="-15" width="6" height="27" fill="var(--c-accent-2)"/>
    </g>
    <g transform="translate(60, 0)">
      <rect x="0" y="-9" width="6" height="21" fill="var(--c-accent-2)"/>
      <rect x="10" y="-15" width="6" height="27" fill="var(--c-accent-2)"/>
      <rect x="20" y="-12" width="6" height="24" fill="var(--c-accent-2)"/>
    </g>

    <!-- 4단계 (수익) - 체크 표시 -->
    <g transform="translate(0, 72)">
      <path d="M -10 0 L -3 8 L 12 -8" fill="none" stroke="var(--c-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(-80, 80)">
      <path d="M -8 0 L -2 6 L 10 -6" fill="none" stroke="var(--c-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 5단계 (추천) - 화살표 삼각형 -->
    <g transform="translate(0, 144)">
      <path d="M 0 -8 L 14 0 L 0 8 Z" fill="var(--c-accent)"/>
      <path d="M -40 -6 L -26 2 L -40 10 Z" fill="var(--c-accent-3)" opacity="0.7"/>
      <path d="M 40 -6 L 54 2 L 40 10 Z" fill="var(--c-accent-3)" opacity="0.7"/>
    </g>

    <!-- 회전된 사각형 (장식) -->
    <rect x="-280" y="-40" width="20" height="20" fill="none" stroke="var(--c-accent)" stroke-width="1.5" transform="rotate(15 -270 -30)"/>
    <rect x="266" y="50" width="24" height="24" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" transform="rotate(-12 278 62)"/>

    <!-- 포커스 링 (점선 외곽) -->
    <circle cx="0" cy="-72" r="42" fill="none" stroke="var(--c-accent-2)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  </g>

  <!-- 우하단 시리즈 번호 (크게, 반투명) -->
  <text x="1144" y="600" text-anchor="end"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="220" font-weight="700"
    fill="var(--c-num)" fill-opacity="0.18"
    letter-spacing="-0.04em">00</text>
</svg>
