<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SI 납품용으로 변환하기, 화석을 인정하는 문서 커버">
  <style>
    :root{
      --c-bg:#f5f4ef; --c-fg:#1f1d14; --c-muted:#6b6553; --c-line:#cfccbf; --c-dot:#1f1d14;
      --c-accent:#C29A1F; --c-accent-2:#5E6E7E; --c-accent-3:#D9C77E; --c-num:#5E6E7E;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --c-bg:#14110a; --c-fg:#eae7dd; --c-muted:#a39f8c; --c-line:#38352a; --c-dot:#eae7dd;
        --c-accent:#D6B23A; --c-accent-2:#9AA6B4; --c-accent-3:#6E5F2A; --c-num:#9AA6B4;
      }
    }
    .bg{fill:var(--c-bg);}
    .line{stroke:var(--c-line);fill:none;stroke-width:1.5;}
    .num{fill:var(--c-num);}
  </style>
  <defs>
    <pattern id="dots07" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="glowA07" cx="20%" cy="22%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB07" cx="86%" cy="84%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberDrop" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="var(--c-accent-2)" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="630"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots07)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowA07)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowB07)"/>

  <!-- off-canvas strokes -->
  <circle class="line" cx="1110" cy="80" r="240" transform="rotate(-8 1110 80)"/>
  <rect class="line" x="-150" y="430" width="430" height="430" rx="44" transform="rotate(12 65 645)"/>

  <!-- ===== metaphor: a document encased in amber (fossil) ===== -->
  <!-- amber drop -->
  <path d="M430 150 C 300 150, 250 320, 320 450 C 370 540, 490 560, 560 500 C 640 430, 620 230, 540 175 C 510 155, 470 150, 430 150 Z"
        fill="url(#amberDrop)" stroke="var(--c-accent-2)" stroke-width="2.5"/>
  <!-- preserved document inside -->
  <g transform="rotate(-6 440 350)">
    <rect x="356" y="248" width="180" height="230" rx="12" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.5"/>
    <rect x="380" y="278" width="90" height="10" rx="5" fill="var(--c-accent-2)" opacity="0.8"/>
    <rect x="380" y="300" width="130" height="7" rx="3.5" fill="var(--c-accent-2)" opacity="0.45"/>
    <rect x="380" y="316" width="120" height="7" rx="3.5" fill="var(--c-accent-2)" opacity="0.45"/>
    <rect x="380" y="332" width="130" height="7" rx="3.5" fill="var(--c-accent-2)" opacity="0.45"/>
    <!-- sediment strata (fossil layers) -->
    <rect x="356" y="392" width="180" height="14" fill="var(--c-accent-2)" opacity="0.25"/>
    <rect x="356" y="410" width="180" height="20" fill="var(--c-accent-2)" opacity="0.38"/>
    <rect x="356" y="434" width="180" height="44" rx="0" fill="var(--c-accent-2)" opacity="0.5"/>
    <!-- approval seal -->
    <circle cx="486" cy="430" r="22" fill="none" stroke="var(--c-bg)" stroke-width="3"/>
    <circle cx="486" cy="430" r="22" fill="none" stroke="var(--c-accent-2)" stroke-width="2" stroke-dasharray="2 3"/>
    <polyline points="476,430 483,438 497,422" fill="none" stroke="var(--c-bg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- traceability links (req -> design -> test), right side -->
  <g>
    <rect x="700" y="220" width="120" height="40" rx="8" fill="none" stroke="var(--c-accent-2)" stroke-width="2"/>
    <rect x="700" y="300" width="120" height="40" rx="8" fill="none" stroke="var(--c-accent-2)" stroke-width="2"/>
    <rect x="700" y="380" width="120" height="40" rx="8" fill="none" stroke="var(--c-accent-2)" stroke-width="2"/>
    <line x1="760" y1="260" x2="760" y2="300" stroke="var(--c-accent-2)" stroke-width="2"/>
    <polygon points="760,300 754,288 766,288" fill="var(--c-accent-2)"/>
    <line x1="760" y1="340" x2="760" y2="380" stroke="var(--c-accent-2)" stroke-width="2"/>
    <polygon points="760,380 754,368 766,368" fill="var(--c-accent-2)"/>
    <rect x="716" y="234" width="88" height="6" rx="3" fill="var(--c-accent-2)" opacity="0.5"/>
    <rect x="716" y="314" width="88" height="6" rx="3" fill="var(--c-accent-2)" opacity="0.5"/>
    <rect x="716" y="394" width="88" height="6" rx="3" fill="var(--c-accent-2)" opacity="0.5"/>
  </g>

  <!-- seed of rebirth (teal sprout) -->
  <g>
    <path d="M900 470 q 0 -40 24 -54" fill="none" stroke="var(--c-accent)" stroke-width="3"/>
    <path d="M924 416 q -28 4 -34 30 q 26 -2 34 -30 Z" fill="var(--c-accent)" opacity="0.7"/>
    <path d="M924 422 q 24 8 28 32 q -24 0 -28 -32 Z" fill="var(--c-accent)" opacity="0.5"/>
    <line x1="884" y1="470" x2="940" y2="470" stroke="var(--c-accent)" stroke-width="3"/>
  </g>

  <!-- detail vocab -->
  <circle cx="980" cy="150" r="30" fill="none" stroke="var(--c-accent-2)" stroke-width="2" stroke-dasharray="3 7" opacity="0.7"/>
  <circle cx="980" cy="150" r="13" class="line" stroke="var(--c-accent-2)"/>
  <rect x="170" y="470" width="32" height="32" rx="6" fill="none" stroke="var(--c-accent-2)" stroke-width="2" transform="rotate(18 186 486)" opacity="0.8"/>

  <text x="1150" y="600" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="232" font-weight="700" class="num" opacity="0.16">07</text>
</svg>
