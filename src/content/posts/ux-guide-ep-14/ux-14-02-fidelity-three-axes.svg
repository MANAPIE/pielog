<svg viewBox="0 0 500 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fa">
  <title id="t-fa">프로토타입 충실도의 세 차원</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-fa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-fa-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="372" />
  <text x="24" y="36" class="ttl">충실도의 세 차원: 필요한 차원만 올리기</text>
  <text x="24" y="88" class="th">상호작용</text>
  <line x1="120" y1="84" x2="460" y2="84" stroke="var(--c-divider)" stroke-width="2" />
  <text x="120" y="104" class="cap">낮음</text>
  <text x="460" y="104" class="cap" text-anchor="end">높음</text>
  <circle cx="147.2" cy="84" r="6" fill="var(--c-accent)" />
  <circle cx="409.0" cy="84" r="6" fill="var(--c-accent-3)" />
  <circle cx="432.8" cy="84" r="6" fill="var(--c-accent-2)" />
  <text x="24" y="144" class="th">시각</text>
  <line x1="120" y1="140" x2="460" y2="140" stroke="var(--c-divider)" stroke-width="2" />
  <text x="120" y="160" class="cap">낮음</text>
  <text x="460" y="160" class="cap" text-anchor="end">높음</text>
  <circle cx="147.2" cy="140" r="6" fill="var(--c-accent)" />
  <circle cx="171.0" cy="140" r="6" fill="var(--c-accent-3)" />
  <circle cx="432.8" cy="140" r="6" fill="var(--c-accent-2)" />
  <text x="24" y="200" class="th">콘텐츠</text>
  <line x1="120" y1="196" x2="460" y2="196" stroke="var(--c-divider)" stroke-width="2" />
  <text x="120" y="216" class="cap">낮음</text>
  <text x="460" y="216" class="cap" text-anchor="end">높음</text>
  <circle cx="154.0" cy="196" r="6" fill="var(--c-accent)" />
  <circle cx="290.0" cy="196" r="6" fill="var(--c-accent-3)" />
  <circle cx="432.8" cy="196" r="6" fill="var(--c-accent-2)" />
  <circle cx="30" cy="258" r="5" fill="var(--c-accent)" />
  <text x="42" y="262" class="td">종이 스케치</text>
  <circle cx="30" cy="280" r="5" fill="var(--c-accent-3)" />
  <text x="42" y="284" class="td">클릭 가능한 회색 프로토타입</text>
  <circle cx="30" cy="302" r="5" fill="var(--c-accent-2)" />
  <text x="42" y="306" class="td">실제 데이터를 넣은 하이파이</text>
  <text x="290" y="262" class="cap">구조와 흐름을 묻습니다.</text>
  <text x="290" y="284" class="cap">과업 흐름을 시험합니다.</text>
  <text x="290" y="306" class="cap">세부 인터랙션과 승인용입니다.</text>
  <text x="24" y="348" class="cap">검증하려는 것이 있는 차원만 올리고 나머지는 낮게 둡니다.</text>
</svg>
