<svg viewBox="0 0 500 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dl">
  <title id="t-dl">디자인 시스템의 네 층</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-dl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-dl-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

    <rect class="bg" width="500" height="396" />
  <text x="24" y="36" class="ttl">디자인 시스템의 네 층과 그 관계</text>
  <rect x="112" y="56" width="248" height="74" rx="8" fill="var(--c-soft-4)" stroke="var(--c-accent-4)" stroke-width="1.4" />
  <text x="24" y="80" class="nm">패턴</text>
  <text x="24" y="98" class="cap">컴포넌트의</text>
  <text x="24" y="113" class="cap">반복 조합</text>
  <text x="126" y="80" class="mid">폼 = 레이블 + 입력 필드 + 버튼</text>
  <text x="126" y="98" class="mid">검색 = 입력 + 필터 + 결과 목록</text>
  <text x="126" y="116" class="cap">기능 패턴(행동) / 지각 패턴(브랜드)</text>
  <text x="24" y="194" class="nm">컴포넌트</text>
  <text x="24" y="212" class="cap">변형·상태·크기</text>
  <rect x="112" y="170" width="78" height="74" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.4" />
  <text x="151.0" y="203" class="nm" text-anchor="middle">버튼</text>
  <text x="151.0" y="223" class="cap" text-anchor="middle">변형 × 상태</text>
  <rect x="197" y="170" width="78" height="74" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.4" />
  <text x="236.0" y="203" class="nm" text-anchor="middle">입력 필드</text>
  <text x="236.0" y="223" class="cap" text-anchor="middle">변형 × 상태</text>
  <rect x="282" y="170" width="78" height="74" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.4" />
  <text x="321.0" y="203" class="nm" text-anchor="middle">모달</text>
  <text x="321.0" y="223" class="cap" text-anchor="middle">변형 × 상태</text>
  <text x="24" y="308" class="nm">토큰</text>
  <text x="24" y="326" class="cap">참조 → 시스템</text>
  <text x="24" y="341" class="cap">→ 컴포넌트 토큰</text>
  <rect x="112" y="284" width="78" height="56" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="151.0" y="316" class="mid mono" text-anchor="middle" style="font-size:9.5px">color.primary</text>
  <rect x="197" y="284" width="78" height="56" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="236.0" y="316" class="mid mono" text-anchor="middle" style="font-size:9.5px">space.md</text>
  <rect x="282" y="284" width="78" height="56" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="321.0" y="316" class="mid mono" text-anchor="middle" style="font-size:9.5px">radius.sm</text>
  <line x1="151.0" y1="266" x2="321.0" y2="266" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="151.0" y1="284" x2="151.0" y2="266" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="151.0" y1="266" x2="151.0" y2="246" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-dl)" />
  <line x1="236.0" y1="284" x2="236.0" y2="266" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="236.0" y1="266" x2="236.0" y2="246" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-dl)" />
  <line x1="321.0" y1="284" x2="321.0" y2="266" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="321.0" y1="266" x2="321.0" y2="246" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-dl)" />
  <text x="24" y="269" class="cap">값을 참조합니다</text>
  <line x1="151.0" y1="152" x2="321.0" y2="152" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="151.0" y1="170" x2="151.0" y2="152" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="236.0" y1="170" x2="236.0" y2="152" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="321.0" y1="170" x2="321.0" y2="152" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="236.0" y1="152" x2="236.0" y2="132" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-dl)" />
  <text x="24" y="155" class="cap">조합합니다</text>
  <rect x="392" y="56" width="84" height="188" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.4" stroke-dasharray="4 3" />
  <text x="404" y="80" class="nm">가이드라인</text>
  <text x="404" y="100" class="cap">언제 쓰는가를</text>
  <text x="404" y="115" class="cap">정합니다</text>
  <text x="404" y="145" class="cap">언제 모달,</text>
  <text x="404" y="160" class="cap">언제 토스트</text>
  <text x="404" y="190" class="cap">확인은 오른쪽,</text>
  <text x="404" y="205" class="cap">취소는 왼쪽</text>
  <line x1="392" y1="93" x2="364" y2="93" stroke="var(--c-accent-2)" stroke-width="1.4" marker-end="url(#a-dl)" />
  <line x1="392" y1="207" x2="364" y2="207" stroke="var(--c-accent-2)" stroke-width="1.4" marker-end="url(#a-dl)" />
  <text x="24" y="372" class="cap">토큰 하나를 바꾸면 그 토큰을 참조하는 컴포넌트와 패턴이 전부 같이 바뀝니다.</text>
</svg>
