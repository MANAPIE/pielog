<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ap">
  <title id="t-ap">협업 안티패턴 다섯 가지</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ap" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ap-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>
  <rect class="bg" width="500" height="420" />
  <text x="24" y="36" class="ttl">협업 안티패턴 다섯 가지</text>
  <text x="24" y="62" class="th">안티패턴</text>
  <text x="146" y="62" class="th">원인</text>
  <text x="316" y="62" class="th" style="fill:var(--c-accent)">해법</text>
  <line x1="24" y1="70" x2="476" y2="70" stroke="var(--c-divider)" stroke-width="1" />
  <rect x="24" y="78" width="112" height="54" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="34" y="99" class="lbl" style="fill:var(--c-accent-2)">01</text>
  <text x="34" y="117" class="nm">영역 방어</text>
  <rect x="146" y="78" width="160" height="54" rx="6" fill="var(--c-muted-soft)" />
  <rect x="316" y="78" width="160" height="54" rx="6" fill="var(--c-soft)" />
  <text x="156" y="99" class="mid">결정권과 입력권을</text>
  <text x="156" y="116" class="mid">구분하지 않음</text>
  <text x="326" y="99" class="mid">결정 전에 다른 직무의</text>
  <text x="326" y="116" class="mid">의견을 듣는 단계</text>
  <rect x="24" y="140" width="112" height="54" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="34" y="161" class="lbl" style="fill:var(--c-accent-2)">02</text>
  <text x="34" y="179" class="nm">후반부 폭탄</text>
  <rect x="146" y="140" width="160" height="54" rx="6" fill="var(--c-muted-soft)" />
  <rect x="316" y="140" width="160" height="54" rx="6" fill="var(--c-soft)" />
  <text x="156" y="161" class="mid">초기 합의와</text>
  <text x="156" y="178" class="mid">중간 점검 없음</text>
  <text x="326" y="161" class="mid">같은 문서로 킥오프,</text>
  <text x="326" y="178" class="mid">주기적 중간 리뷰</text>
  <rect x="24" y="202" width="112" height="54" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="34" y="223" class="lbl" style="fill:var(--c-accent-2)">03</text>
  <text x="34" y="241" class="nm">무한 수정 루프</text>
  <rect x="146" y="202" width="160" height="54" rx="6" fill="var(--c-muted-soft)" />
  <rect x="316" y="202" width="160" height="54" rx="6" fill="var(--c-soft)" />
  <text x="156" y="223" class="mid">수용 기준 없음</text>
  <text x="326" y="223" class="mid">단계마다 완료 기준을</text>
  <text x="326" y="240" class="mid">사전에 합의</text>
  <rect x="24" y="264" width="112" height="54" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="34" y="285" class="lbl" style="fill:var(--c-accent-2)">04</text>
  <text x="34" y="303" class="nm">암묵적 우선순위</text>
  <rect x="146" y="264" width="160" height="54" rx="6" fill="var(--c-muted-soft)" />
  <rect x="316" y="264" width="160" height="54" rx="6" fill="var(--c-soft)" />
  <text x="156" y="285" class="mid">우선순위가</text>
  <text x="156" y="302" class="mid">머릿속에만 있음</text>
  <text x="326" y="285" class="mid">팀원들이 볼 수 있는 곳에</text>
  <text x="326" y="302" class="mid">명시</text>
  <rect x="24" y="326" width="112" height="54" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="34" y="347" class="lbl" style="fill:var(--c-accent-2)">05</text>
  <text x="34" y="365" class="nm">비난 문화</text>
  <rect x="146" y="326" width="160" height="54" rx="6" fill="var(--c-muted-soft)" />
  <rect x="316" y="326" width="160" height="54" rx="6" fill="var(--c-soft)" />
  <text x="156" y="347" class="mid">문제를 개인의</text>
  <text x="156" y="364" class="mid">실수로만 봄</text>
  <text x="326" y="347" class="mid">프로세스의 어디에서</text>
  <text x="326" y="364" class="mid">놓쳤는지 묻기</text>
  <text x="24" y="406" class="cap">원인은 사람이 아니라 프로세스에 있고, 해법도 프로세스에 둡니다.</text>
</svg>
