<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="접근성 가이드 ep.03 cover">
  <style>
  :root {
    --c-bg: #f1f5f9;
    --c-fg: #0f172a;
