<svg width="100%" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>차트: 색상만으로 구분 vs 패턴+마커+직접 레이블</title>
  <desc>3개 시리즈를 가진 라인 차트에서, 왼쪽은 모든 라인이 동일한 실선과 원형 마커를 쓰고 색상에만 의존해 별도 범례로 시리즈를 매칭해야 하는 경우, 오른쪽은 각 시리즈에 실선·파선·점선과 원·사각·삼각
    마커를 부여하고 라인 끝에 직접 레이블을 붙여 색 없이도 식별 가능한 경우를 비교</desc>
  <style>
    .title {
      font: 600 16px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #2C2C2A;
    }

    .caption {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #6F6E66;
    }

    .col-h {
      font: 600 13px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #FFFFFF;
    }

    .axis {
      stroke: #8C8B83;
      stroke-width: 1;
    }

    .grid {
      stroke: #B8B6AC;
      stroke-width: 0.5;
      stroke-dasharray: 2 3;
    }

    .axis-t {
      font: 400 10px/1 'Pretendard Variable', system-ui, sans-serif;
      fill: #6F6E66;
    }

    .legend-t {
      font: 500 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #2C2C2A;
    }

    .endpoint-t {
      font: 600 11px/1 'Pretendard Variable', system-ui, sans-serif;
      fill: #2C2C2A;
    }

    .bullet {
      font: 400 11px/1.5 'Pretendard Variable', system-ui, sans-serif;
      fill: #5F5E5A;
    }

    .rust-card {
      fill: #FAECE7;
      stroke: #993C1D;
    }

    .rust-head {
      fill: #993C1D;
    }

    .teal-card {
      fill: #E1F5EE;
      stroke: #0F664A;
    }

    .teal-head {
      fill: #0F664A;
    }

    .s1 {
      stroke: #1F4E9C;
      fill: none;
    }

    .s2 {
      stroke: #B85A00;
      fill: none;
    }

    .s3 {
      stroke: #1E7A1E;
      fill: none;
    }

    .m1 {
      fill: #1F4E9C;
    }

    .m2 {
      fill: #B85A00;
    }

    .m3 {
      fill: #1E7A1E;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #E8E6DE;
      }

      .caption {
        fill: #B4B2A9;
      }

      .axis {
        stroke: #6F6E66;
      }

      .grid {
        stroke: #555550;
      }

      .axis-t {
        fill: #B4B2A9;
      }

      .legend-t {
        fill: #E8E6DE;
      }

      .endpoint-t {
        fill: #E8E6DE;
      }

      .bullet {
        fill: #B4B2A9;
      }

      .rust-card {
        fill: #3F1A0C;
        stroke: #993C1D;
      }

      .rust-head {
        fill: #993C1D;
      }

      .teal-card {
        fill: #04342C;
        stroke: #0F6E56;
      }

      .teal-head {
        fill: #0F6E56;
      }

      .s1 {
        stroke: #6BA4E5;
      }

      .s2 {
        stroke: #F0A55C;
      }

      .s3 {
        stroke: #7BC97B;
      }

      .m1 {
        fill: #6BA4E5;
      }

      .m2 {
        fill: #F0A55C;
      }

      .m3 {
        fill: #7BC97B;
      }
    }
  </style>

  <text class="title" x="40" y="32">차트: 색상만으로 구분 vs 패턴 + 마커 + 직접 레이블</text>
  <text class="caption" x="40" y="50">동일 데이터(3개 시리즈) · 인코딩 전략만 다름: WCAG 1.4.1</text>

  <!-- BAD: color-only -->
  <g>
    <rect class="rust-card" x="40" y="76" width="350" height="280" rx="14" stroke-width="0.5" />
    <rect class="rust-head" x="40" y="76" width="350" height="32" rx="14" />
    <rect class="rust-head" x="40" y="96" width="350" height="12" />
    <text class="col-h" x="60" y="98">색상만 사용: 별도 범례 의존</text>

    <!-- grid -->
    <line class="grid" x1="80" y1="160" x2="370" y2="160" />
    <line class="grid" x1="80" y1="190" x2="370" y2="190" />
    <line class="grid" x1="80" y1="220" x2="370" y2="220" />
    <line class="grid" x1="80" y1="250" x2="370" y2="250" />
    <!-- axes -->
    <line class="axis" x1="80" y1="140" x2="80" y2="260" />
    <line class="axis" x1="80" y1="260" x2="370" y2="260" />
    <!-- x labels -->
    <text class="axis-t" x="110" y="275" text-anchor="middle">Q1</text>
    <text class="axis-t" x="180" y="275" text-anchor="middle">Q2</text>
    <text class="axis-t" x="250" y="275" text-anchor="middle">Q3</text>
    <text class="axis-t" x="320" y="275" text-anchor="middle">Q4</text>

    <!-- A: solid line, circle markers -->
    <polyline class="s1" fill="none" stroke-width="2.5" points="110,224 180,200 250,182 320,158" />
    <circle class="m1" cx="110" cy="224" r="3.5" />
    <circle class="m1" cx="180" cy="200" r="3.5" />
    <circle class="m1" cx="250" cy="182" r="3.5" />
    <circle class="m1" cx="320" cy="158" r="3.5" />
    <!-- B: solid line, circle markers (same shape on purpose) -->
    <polyline class="s2" fill="none" stroke-width="2.5" points="110,200 180,212 250,194 320,182" />
    <circle class="m2" cx="110" cy="200" r="3.5" />
    <circle class="m2" cx="180" cy="212" r="3.5" />
    <circle class="m2" cx="250" cy="194" r="3.5" />
    <circle class="m2" cx="320" cy="182" r="3.5" />
    <!-- C: solid line, circle markers (same shape on purpose) -->
    <polyline class="s3" fill="none" stroke-width="2.5" points="110,242 180,230 250,236 320,212" />
    <circle class="m3" cx="110" cy="242" r="3.5" />
    <circle class="m3" cx="180" cy="230" r="3.5" />
    <circle class="m3" cx="250" cy="236" r="3.5" />
    <circle class="m3" cx="320" cy="212" r="3.5" />

    <!-- legend -->
    <g>
      <rect class="m1" x="80" y="294" width="12" height="6" rx="1" />
      <text class="legend-t" x="98" y="301">A 제품</text>
      <rect class="m2" x="160" y="294" width="12" height="6" rx="1" />
      <text class="legend-t" x="178" y="301">B 제품</text>
      <rect class="m3" x="240" y="294" width="12" height="6" rx="1" />
      <text class="legend-t" x="258" y="301">C 제품</text>
    </g>

    <text class="bullet" x="60" y="324">· 적록 색맹: 주황/초록 라인 혼동</text>
    <text class="bullet" x="60" y="342">· 흑백 출력·범례 시선 왕복으로 식별 부담</text>
  </g>

  <!-- GOOD: pattern + marker shape + direct labels -->
  <g>
    <rect class="teal-card" x="410" y="76" width="350" height="280" rx="14" stroke-width="0.5" />
    <rect class="teal-head" x="410" y="76" width="350" height="32" rx="14" />
    <rect class="teal-head" x="410" y="96" width="350" height="12" />
    <text class="col-h" x="430" y="98">패턴 + 마커 + 직접 레이블: 범례 불필요</text>

    <!-- grid -->
    <line class="grid" x1="450" y1="160" x2="690" y2="160" />
    <line class="grid" x1="450" y1="190" x2="690" y2="190" />
    <line class="grid" x1="450" y1="220" x2="690" y2="220" />
    <line class="grid" x1="450" y1="250" x2="690" y2="250" />
    <!-- axes -->
    <line class="axis" x1="450" y1="140" x2="450" y2="260" />
    <line class="axis" x1="450" y1="260" x2="690" y2="260" />
    <!-- x labels -->
    <text class="axis-t" x="480" y="275" text-anchor="middle">Q1</text>
    <text class="axis-t" x="540" y="275" text-anchor="middle">Q2</text>
    <text class="axis-t" x="600" y="275" text-anchor="middle">Q3</text>
    <text class="axis-t" x="660" y="275" text-anchor="middle">Q4</text>

    <!-- A: solid line, circle markers -->
    <polyline class="s1" fill="none" stroke-width="2.5" points="480,224 540,200 600,182 660,158" />
    <circle class="m1" cx="480" cy="224" r="3.5" />
    <circle class="m1" cx="540" cy="200" r="3.5" />
    <circle class="m1" cx="600" cy="182" r="3.5" />
    <circle class="m1" cx="660" cy="158" r="3.5" />
    <text class="endpoint-t" x="670" y="162">A 제품</text>

    <!-- B: dashed line, square markers -->
    <polyline class="s2" fill="none" stroke-width="2.5" stroke-dasharray="7 4"
      points="480,200 540,212 600,194 660,182" />
    <rect class="m2" x="476" y="196" width="8" height="8" rx="0.5" />
    <rect class="m2" x="536" y="208" width="8" height="8" rx="0.5" />
    <rect class="m2" x="596" y="190" width="8" height="8" rx="0.5" />
    <rect class="m2" x="656" y="178" width="8" height="8" rx="0.5" />
    <text class="endpoint-t" x="670" y="186">B 제품</text>

    <!-- C: dotted line, triangle markers -->
    <polyline class="s3" fill="none" stroke-width="2.5" stroke-dasharray="2 3"
      points="480,242 540,230 600,236 660,212" />
    <polygon class="m3" points="480,238 484,244 476,244" />
    <polygon class="m3" points="540,226 544,232 536,232" />
    <polygon class="m3" points="600,232 604,238 596,238" />
    <polygon class="m3" points="660,208 664,214 656,214" />
    <text class="endpoint-t" x="670" y="216">C 제품</text>

    <text class="bullet" x="430" y="304">· 실선·파선·점선으로 색 없이도 시리즈 식별</text>
    <text class="bullet" x="430" y="322">· 원·사각·삼각 마커로 형태 차원에서 한 번 더 차별화</text>
    <text class="bullet" x="430" y="340">· 라인 끝 직접 레이블: 범례 시선 이동 없음</text>
  </g>
</svg>