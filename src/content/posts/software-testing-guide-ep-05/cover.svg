<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E2E 테스트 편 커버">
  <style>
    :root {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-accent-3: #B8CCC2;
      --c-num: rgba(91, 140, 123, 0.16);
      --c-dot: #5B8C7B;
      --c-line: #C9D1CC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-accent-3: #4A6B5E;
        --c-num: rgba(127, 181, 160, 0.18);
        --c-dot: #7FB5A0;
        --c-line: #3D434D;
      }
    }
    .bg { fill: var(--c-bg); }
    .dot { fill: var(--c-dot); }
    .line { stroke: var(--c-line); fill: none; }
    .accent-fill { fill: var(--c-accent); }
    .accent2-fill { fill: var(--c-accent-2); }
    .accent3-fill { fill: var(--c-accent-3); }
    .accent-stroke { stroke: var(--c-accent); fill: none; }
    .accent2-stroke { stroke: var(--c-accent-2); fill: none; }
    .num-text { font: 900 240px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-num); letter-spacing: -0.04em; }
  </style>
  <defs>
    <pattern id="dotgrid-05" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.1" class="dot" opacity="0.18"/>
    </pattern>
    <radialGradient id="rg-tl-05" cx="0" cy="0" r="0.55">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-br-05" cx="1" cy="1" r="0.6">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dotgrid-05)"/>
  <rect width="1200" height="630" fill="url(#rg-tl-05)"/>
  <rect width="1200" height="630" fill="url(#rg-br-05)"/>

  <!-- 화면 밖 stroke 도형 -->
  <circle cx="1280" cy="730" r="380" class="line" stroke-width="1.5"/>
  <rect x="-200" y="-150" width="400" height="400" class="line" stroke-width="1.5" transform="rotate(10 0 50)"/>

  <!-- 포그라운드: 4개의 화면이 가로로 이어지는 흐름 메타포 -->
  <g transform="translate(600 315) scale(1.3) translate(-600 -315) translate(0 240)">
    <!-- 화면 1 -->
    <g transform="translate(180 0) rotate(-3)">
      <rect width="160" height="120" rx="10" class="accent-stroke" stroke-width="1.5" fill="var(--c-bg)"/>
      <rect x="12" y="14" width="60" height="8" rx="2" class="accent3-fill" opacity="0.85"/>
      <rect x="12" y="30" width="100" height="6" rx="2" class="accent3-fill" opacity="0.7"/>
      <rect x="12" y="50" width="80" height="40" rx="6" class="accent-fill" opacity="0.85"/>
    </g>
    <!-- 화살표 1 -->
    <g transform="translate(355 60)">
      <line x1="0" y1="0" x2="40" y2="0" class="accent-stroke" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="40,0 32,-6 32,6" class="accent2-fill"/>
    </g>
    <!-- 화면 2 -->
    <g transform="translate(420 0) rotate(2)">
      <rect width="160" height="120" rx="10" class="accent-stroke" stroke-width="1.5" fill="var(--c-bg)"/>
      <rect x="12" y="14" width="80" height="8" rx="2" class="accent3-fill" opacity="0.85"/>
      <rect x="12" y="34" width="120" height="6" rx="2" class="accent3-fill" opacity="0.6"/>
      <rect x="12" y="46" width="120" height="6" rx="2" class="accent3-fill" opacity="0.6"/>
      <rect x="12" y="58" width="120" height="6" rx="2" class="accent3-fill" opacity="0.6"/>
      <rect x="12" y="80" width="60" height="24" rx="4" class="accent-fill" opacity="0.85"/>
    </g>
    <!-- 화살표 2 -->
    <g transform="translate(595 60)">
      <line x1="0" y1="0" x2="40" y2="0" class="accent-stroke" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="40,0 32,-6 32,6" class="accent2-fill"/>
    </g>
    <!-- 화면 3 -->
    <g transform="translate(660 0) rotate(-2)">
      <rect width="160" height="120" rx="10" class="accent-stroke" stroke-width="1.5" fill="var(--c-bg)"/>
      <rect x="12" y="14" width="70" height="8" rx="2" class="accent3-fill" opacity="0.85"/>
      <!-- 메일 아이콘 추상 -->
      <rect x="40" y="36" width="80" height="50" rx="4" class="accent3-fill" opacity="0.7"/>
      <polyline points="40,36 80,66 120,36" stroke="var(--c-accent)" stroke-width="2" fill="none" opacity="0.8"/>
    </g>
    <!-- 화살표 3 -->
    <g transform="translate(835 60)">
      <line x1="0" y1="0" x2="40" y2="0" class="accent-stroke" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="40,0 32,-6 32,6" class="accent2-fill"/>
    </g>
    <!-- 화면 4 (목표) -->
    <g transform="translate(900 0) rotate(3)">
      <rect width="160" height="120" rx="10" class="accent2-fill" opacity="0.95"/>
      <!-- 체크 -->
      <g transform="translate(80 60)">
        <circle r="28" fill="white" opacity="0.3"/>
        <polyline points="-12,2 -3,11 13,-8" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- 상단 작은 점 무리 -->
  <g class="accent2-fill" opacity="0.7">
    <circle cx="200" cy="120" r="3"/>
    <circle cx="216" cy="132" r="3"/>
    <circle cx="184" cy="134" r="3"/>
  </g>

  <!-- 우상단 회전 사각형 -->
  <rect x="1000" y="80" width="100" height="100" class="line" stroke-width="1.5" fill="none" transform="rotate(-15 1050 130)" opacity="0.6"/>

  <!-- 좌하단 미니 바 -->
  <g transform="translate(120 480)">
    <rect x="0" y="0" width="6" height="50" class="accent-fill" opacity="0.85"/>
    <rect x="12" y="10" width="6" height="40" class="accent-fill" opacity="0.7"/>
    <rect x="24" y="22" width="6" height="28" class="accent3-fill" opacity="0.85"/>
  </g>

  <!-- 좌상단 포커스 링 -->
  <g transform="translate(150 180)">
    <circle r="34" class="accent-stroke" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.55"/>
    <circle r="8" class="accent2-fill"/>
  </g>

  <!-- 우하단 시리즈 번호 -->
  <text class="num-text" x="1164" y="594" text-anchor="end">05</text>
</svg>
