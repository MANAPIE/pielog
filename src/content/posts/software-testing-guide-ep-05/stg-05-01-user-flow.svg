<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" role="img" aria-labelledby="title-stg05-01">
  <title id="title-stg05-01">E2E 테스트가 따라가는 사용자 흐름</title>
  <style>
    svg {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-muted: #6B7280;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-accent-3: #B8CCC2;
      --c-card-bg: #F2F0E9;
      --c-card-border: rgba(91, 140, 123, 0.28);
      --c-step-bg: #E8EEEB;
      --c-arrow: #9CA9A4;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-muted: #94A3B8;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-accent-3: #4A6B5E;
        --c-card-bg: #1F242C;
        --c-card-border: rgba(127, 181, 160, 0.32);
        --c-step-bg: #232A30;
        --c-arrow: #5A6670;
      }
    }

    .bg {
      fill: var(--c-bg);
    }

    .step {
      fill: var(--c-step-bg);
      stroke: var(--c-accent);
      stroke-width: 1.2;
    }

    .step-icon {
      fill: var(--c-accent);
    }

    .label {
      fill: var(--c-fg);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
    }

    .check-label {
      fill: var(--c-accent-2);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 500;
    }

    .sub {
      fill: var(--c-muted);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
    }

    .flow-line {
      stroke: var(--c-accent);
      stroke-width: 2;
      fill: none;
    }

    .e2e-band {
      fill: none;
      stroke: var(--c-accent);
      stroke-width: 1.2;
      stroke-dasharray: 5 4;
    }

    .e2e-label {
      fill: var(--c-accent-2);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      .check-label {
        fill: var(--c-accent-2);
      }

      .e2e-label {
        fill: var(--c-accent-2);
      }
    }
  </style>
  <defs>
    <marker id="arr05-01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
  </defs>
  <rect class="bg" width="600" height="270" />
  <g transform="translate(0, -55)">
    <!-- 4단계의 사용자 흐름 박스 -->
    <!-- 1: 시작 -->
    <rect class="step" x="25" y="120" width="115" height="60" rx="10" />
    <circle cx="55" cy="148" r="6" class="step-icon" />
    <text class="label" x="70" y="152">1</text>
    <text class="sub" x="35" y="172">시작 페이지</text>

    <!-- 2: 가입 양식 -->
    <rect class="step" x="170" y="120" width="115" height="60" rx="10" />
    <circle cx="200" cy="148" r="6" class="step-icon" />
    <text class="label" x="215" y="152">2</text>
    <text class="sub" x="180" y="172">가입 양식 입력</text>

    <!-- 3: 이메일 인증 -->
    <rect class="step" x="315" y="120" width="115" height="60" rx="10" />
    <circle cx="345" cy="148" r="6" class="step-icon" />
    <text class="label" x="360" y="152">3</text>
    <text class="sub" x="325" y="172">이메일 인증</text>

    <!-- 4: 대시보드 -->
    <rect class="step" x="460" y="120" width="115" height="60" rx="10" />
    <circle cx="490" cy="148" r="6" class="step-icon" />
    <text class="label" x="505" y="152">4</text>
    <text class="sub" x="470" y="172">대시보드 진입</text>

    <!-- 연결 화살표 -->
    <line class="flow-line" x1="142" y1="150" x2="166" y2="150" marker-end="url(#arr05-01)" />
    <line class="flow-line" x1="287" y1="150" x2="311" y2="150" marker-end="url(#arr05-01)" />
    <line class="flow-line" x1="432" y1="150" x2="456" y2="150" marker-end="url(#arr05-01)" />

    <!-- 검증 약속 라벨 (각 단계 사이) -->
    <text class="check-label" x="154" y="115" text-anchor="middle">→ 양식 표시</text>
    <text class="check-label" x="299" y="115" text-anchor="middle">→ 메일 발송</text>
    <text class="check-label" x="444" y="115" text-anchor="middle">→ 인증 처리</text>

    <!-- 전체를 감싸는 E2E 범위 표시 -->
    <rect class="e2e-band" x="15" y="78" width="570" height="222" rx="14" />
    <text class="e2e-label" x="300" y="248" text-anchor="middle">E2E 테스트의 영역</text>
    <text class="sub" x="300" y="268" text-anchor="middle">진짜 브라우저에서, 사용자처럼, 처음부터 끝까지</text>

    <!-- 상단 시작 라벨 -->
    <text class="sub" x="40" y="98">사용자 시작점</text>
    <text class="sub" x="560" y="98" text-anchor="end">목표 도달</text>
    <line x1="120" y1="94" x2="180" y2="94" stroke="var(--c-arrow)" stroke-width="0.6" stroke-dasharray="2 3" />
    <line x1="420" y1="94" x2="490" y2="94" stroke="var(--c-arrow)" stroke-width="0.6" stroke-dasharray="2 3" />
  </g>
</svg>