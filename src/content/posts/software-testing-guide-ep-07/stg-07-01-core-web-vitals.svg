<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" role="img" aria-labelledby="title-stg07-01">
  <title id="title-stg07-01">Core Web Vitals 세 지표와 사용자 체감</title>
  <style>
    svg {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-muted: #6B7280;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-accent-3: #B8CCC2;
      --c-card-bg: #F2F0E9;
      --c-card-border: rgba(91, 140, 123, 0.28);
      --c-good-bg: #E0EBE5;
      --c-good: #5B8C7B;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-muted: #94A3B8;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-accent-3: #4A6B5E;
        --c-card-bg: #1F242C;
        --c-card-border: rgba(127, 181, 160, 0.32);
        --c-good-bg: #1F2D28;
        --c-good: #7FB5A0;
      }
    }
    .bg { fill: var(--c-bg); }
    .card { fill: var(--c-card-bg); stroke: var(--c-card-border); stroke-width: 1; }
    .metric-card { fill: var(--c-card-bg); stroke: var(--c-accent); stroke-width: 1.3; }
    .good-badge { fill: var(--c-good-bg); stroke: var(--c-good); stroke-width: 0.8; }
    .metric-name { fill: var(--c-accent-2); font-family: "Helvetica Neue", Inter, system-ui, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
    .metric-full { fill: var(--c-muted); font-family: system-ui, -apple-system, sans-serif; font-size: 10px; }
    .body { fill: var(--c-fg); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    .feel { fill: var(--c-fg); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; }
    .good-text { fill: var(--c-good); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; }
    .sub { fill: var(--c-muted); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    .note { fill: var(--c-muted); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .metric-name { fill: var(--c-accent-2); }
      .good-text { fill: var(--c-good); }
    }
  </style>
  <rect class="bg" width="600" height="360"/>

  <!-- 상단 라벨 -->
  <text class="sub" x="300" y="35" text-anchor="middle">사용자가 느끼는 속도를 세 가지 객관적 지표로</text>

  <!-- LCP -->
  <rect class="metric-card" x="25" y="65" width="175" height="240" rx="14"/>
  <text class="metric-name" x="112" y="100" text-anchor="middle">LCP</text>
  <text class="metric-full" x="112" y="118" text-anchor="middle">Largest Contentful Paint</text>
  <line x1="40" y1="130" x2="184" y2="130" stroke="var(--c-card-border)" stroke-width="0.6"/>
  <text class="feel" x="112" y="158" text-anchor="middle">"페이지가 떴다"</text>
  <text class="body" x="40" y="184">가장 큰 콘텐츠가</text>
  <text class="body" x="40" y="200">그려질 때까지의 시간</text>
  <text class="sub" x="40" y="222">예: 메인 이미지,</text>
  <text class="sub" x="40" y="236">히어로 타이틀</text>
  <rect class="good-badge" x="40" y="258" width="144" height="32" rx="6"/>
  <text class="good-text" x="112" y="279" text-anchor="middle">권장: 2.5초 이내</text>

  <!-- INP -->
  <rect class="metric-card" x="212" y="65" width="175" height="240" rx="14"/>
  <text class="metric-name" x="299" y="100" text-anchor="middle">INP</text>
  <text class="metric-full" x="299" y="118" text-anchor="middle">Interaction to Next Paint</text>
  <line x1="227" y1="130" x2="371" y2="130" stroke="var(--c-card-border)" stroke-width="0.6"/>
  <text class="feel" x="299" y="158" text-anchor="middle">"반응이 빠르다"</text>
  <text class="body" x="227" y="184">상호작용 후 화면이</text>
  <text class="body" x="227" y="200">반응할 때까지</text>
  <text class="sub" x="227" y="222">2024년 FID를</text>
  <text class="sub" x="227" y="236">공식 대체</text>
  <rect class="good-badge" x="227" y="258" width="144" height="32" rx="6"/>
  <text class="good-text" x="299" y="279" text-anchor="middle">권장: 200ms 이내</text>

  <!-- CLS -->
  <rect class="metric-card" x="399" y="65" width="175" height="240" rx="14"/>
  <text class="metric-name" x="486" y="100" text-anchor="middle">CLS</text>
  <text class="metric-full" x="486" y="118" text-anchor="middle">Cumulative Layout Shift</text>
  <line x1="414" y1="130" x2="558" y2="130" stroke="var(--c-card-border)" stroke-width="0.6"/>
  <text class="feel" x="486" y="158" text-anchor="middle">"안정적이다"</text>
  <text class="body" x="414" y="184">화면이 의도치 않게</text>
  <text class="body" x="414" y="200">얼마나 흔들리는가</text>
  <text class="sub" x="414" y="222">광고·폰트·이미지의</text>
  <text class="sub" x="414" y="236">늦은 삽입</text>
  <rect class="good-badge" x="414" y="258" width="144" height="32" rx="6"/>
  <text class="good-text" x="486" y="279" text-anchor="middle">권장: 0.1 이하</text>

  <!-- 하단 -->
  <text class="note" x="300" y="335" text-anchor="middle">세 지표가 함께 만족될 때 사용자는 "빠르다"고 느낍니다</text>
</svg>
