<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-di">
  <title id="t-di">의존성 역전 전후 비교</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4A5FD9;
        --c-accent-2: #D97757;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(74, 95, 217, 0.08);
        --c-soft-2: rgba(217, 119, 87, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #8DA0FF;
          --c-accent-2: #E89376;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(141, 160, 255, 0.14);
          --c-soft-2: rgba(232, 147, 118, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .pane-bad {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 1.2;
        stroke-dasharray: 4 3;
      }

      .pane-good {
        fill: var(--c-soft);
        stroke: var(--c-accent);
        stroke-width: 1.2;
        stroke-dasharray: 4 3;
      }

      .box {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.5;
      }

      .box-port {
        fill: var(--c-card);
        stroke: var(--c-accent);
        stroke-width: 1.8;
        stroke-dasharray: 5 3;
      }

      .box-dom {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 2;
      }

      .lbl {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }

      .nm {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .sub {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10.5px;
        fill: var(--c-muted);
      }

      .cap {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        fill: var(--c-muted);
      }

      .warn {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-accent-2);
      }

      .good {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-accent);
      }
      .mono { font-family: 'JetBrains Mono','SF Mono',monospace; }
    </style>
    <marker id="a-bad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-2)" />
    </marker>
    <marker id="a-good" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent)" />
    </marker>
  </defs>

  <rect class="bg" width="800" height="560" />

  <!-- 상단: 역전 전 -->
  <g transform="translate(24 20)">
    <rect class="pane-bad" width="752" height="228" rx="8" />
    <text x="20" y="26" class="lbl" fill="var(--c-accent-2)">BEFORE</text>
    <text x="20" y="50" class="nm" font-size="15">도메인이 인프라를 직접 앎</text>

    <!-- 도메인 -->
    <g transform="translate(40 76)">
      <rect width="220" height="112" rx="6" class="box-dom" />
      <text x="110" y="30" class="nm mono" text-anchor="middle">OrderService</text>
      <line x1="16" y1="44" x2="204" y2="44" stroke="var(--c-divider)" stroke-width="1" />
      <text x="16" y="66" class="sub">import PrismaClient</text>
      <text x="16" y="82" class="sub">import SendGridClient</text>
      <text x="16" y="98" class="cap">비즈니스 규칙 + 인프라 호출</text>
    </g>

    <!-- 화살표 (도메인 → 인프라) -->
    <line x1="264" y1="118" x2="424" y2="112" stroke="var(--c-accent-2)" stroke-width="2" marker-end="url(#a-bad)" />
    <line x1="264" y1="142" x2="424" y2="164" stroke="var(--c-accent-2)" stroke-width="2" marker-end="url(#a-bad)" />

    <!-- 인프라 -->
    <g transform="translate(436 82)">
      <rect width="140" height="52" rx="5" class="box" />
      <text x="70" y="22" class="nm" text-anchor="middle" font-size="12">Prisma</text>
      <text x="70" y="40" class="sub" text-anchor="middle">DB 라이브러리</text>
    </g>
    <g transform="translate(436 146)">
      <rect width="140" height="52" rx="5" class="box" />
      <text x="70" y="22" class="nm" text-anchor="middle" font-size="12">SendGrid</text>
      <text x="70" y="40" class="sub" text-anchor="middle">메일 서비스</text>
    </g>

    <!-- 경고 -->
    <g transform="translate(600 82)">
      <text x="0" y="16" class="warn">청구되는 것</text>
      <text x="0" y="38" class="cap">인프라가 바뀌면</text>
      <text x="0" y="54" class="cap">도메인이 바뀝니다</text>
      <text x="0" y="80" class="cap">테스트에 DB와</text>
      <text x="0" y="96" class="cap">메일 서버가 필요합니다</text>
    </g>
  </g>

  <!-- 하단: 역전 후 -->
  <g transform="translate(24 268)">
    <rect class="pane-good" width="752" height="264" rx="8" />
    <text x="20" y="26" class="lbl" fill="var(--c-accent)">AFTER - DEPENDENCY INVERSION</text>
    <text x="20" y="50" class="nm" font-size="15">도메인이 모양을 선언하고, 인프라가 구현함</text>

    <!-- 도메인 -->
    <g transform="translate(40 76)">
      <rect width="200" height="92" rx="6" class="box-dom" />
      <text x="100" y="28" class="nm mono" text-anchor="middle">OrderService</text>
      <line x1="16" y1="42" x2="184" y2="42" stroke="var(--c-divider)" stroke-width="1" />
      <text x="16" y="62" class="sub">constructor(repo, notifier)</text>
      <text x="16" y="80" class="cap">비즈니스 규칙만</text>
    </g>

    <!-- 포트 -->
    <g transform="translate(300 68)">
      <rect width="180" height="52" rx="5" class="box-port" />
      <text x="90" y="22" class="nm mono" text-anchor="middle">OrderRepository</text>
      <text x="90" y="40" class="sub" text-anchor="middle">«port» save(order)</text>
    </g>
    <g transform="translate(300 132)">
      <rect width="180" height="52" rx="5" class="box-port" />
      <text x="90" y="22" class="nm mono" text-anchor="middle">Notifier</text>
      <text x="90" y="40" class="sub" text-anchor="middle">«port» notify(...)</text>
    </g>

    <!-- 도메인 → 포트 -->
    <line x1="244" y1="106" x2="292" y2="94" stroke="var(--c-accent)" stroke-width="2" marker-end="url(#a-good)" />
    <line x1="244" y1="130" x2="292" y2="158" stroke="var(--c-accent)" stroke-width="2" marker-end="url(#a-good)" />

    <!-- 인프라 → 포트 (역방향 화살표) -->
    <line x1="600" y1="94" x2="490" y2="94" stroke="var(--c-accent)" stroke-width="2" marker-end="url(#a-good)" />
    <line x1="600" y1="158" x2="490" y2="158" stroke="var(--c-accent)" stroke-width="2" marker-end="url(#a-good)" />

    <!-- 인프라 -->
    <g transform="translate(604 68)">
      <rect width="130" height="52" rx="5" class="box" />
      <text x="65" y="22" class="nm mono" text-anchor="middle">PrismaRepo</text>
      <text x="65" y="40" class="sub" text-anchor="middle">implements</text>
    </g>
    <g transform="translate(604 132)">
      <rect width="130" height="52" rx="5" class="box" />
      <text x="65" y="22" class="nm mono" text-anchor="middle">MailNotifier</text>
      <text x="65" y="40" class="sub" text-anchor="middle">implements</text>
    </g>

    <!-- 결론 배너 -->
    <g transform="translate(40 196)">
      <rect width="694" height="56" rx="5" fill="var(--c-card)" stroke="var(--c-accent)" stroke-width="1.4" />
      <text x="16" y="22" class="good">두 화살표가 모두 포트를 향합니다</text>
      <text x="16" y="42" class="cap">도메인은 인프라를 모릅니다 · 테스트는 가짜 구현 두 개만 있으면 됩니다</text>
    </g>
  </g>
</svg>