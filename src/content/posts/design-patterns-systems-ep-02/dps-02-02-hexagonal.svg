<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hex">
  <title id="t-hex">Hexagonal Architecture: 포트와 어댑터</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-4: #3D8B7A;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(74,95,217,0.08); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-4: #6FBFA8;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(141,160,255,0.14); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .hex { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 2.6; }
      .adapter-in { fill: var(--c-card); stroke: var(--c-accent-2); stroke-width: 1.6; }
      .adapter-out { fill: var(--c-card); stroke: var(--c-accent-4); stroke-width: 1.6; }
      .port { fill: var(--c-bg); stroke: var(--c-accent); stroke-width: 2.2; }
      .lbl { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
      .dom { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 17px; font-weight: 700; fill: var(--c-fg); }
      .dom-sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; fill: var(--c-muted); }
      .ad { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .ad-sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .cap { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12.5px; fill: var(--c-muted); }
      .concl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono','SF Mono',monospace; }
    </style>
    <marker id="a-in" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-2)"/>
    </marker>
    <marker id="a-out" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-4)"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="560"/>

  <!-- 좌우 라벨 -->
  <text x="110" y="30" class="lbl" fill="var(--c-accent-2)">DRIVING ADAPTERS</text>
  <text x="110" y="48" class="cap">바깥이 도메인을 부름</text>
  <text x="690" y="30" class="lbl" fill="var(--c-accent-4)" text-anchor="end">DRIVEN ADAPTERS</text>
  <text x="690" y="48" class="cap" text-anchor="end">도메인이 바깥을 부름</text>

  <!-- 중앙 육각형 -->
  <g transform="translate(400 268)">
    <polygon points="0,-124 108,-62 108,62 0,124 -108,62 -108,-62" class="hex"/>
    <text x="0" y="-14" class="dom" text-anchor="middle">Domain</text>
    <text x="0" y="10" class="dom-sub" text-anchor="middle">주문 규칙 · 가격 계산</text>
    <text x="0" y="30" class="dom-sub" text-anchor="middle">상태 전이 · 불변식</text>

    <!-- 포트 (좌 3개) -->
    <rect x="-116" y="-72" width="16" height="16" rx="3" class="port"/>
    <rect x="-116" y="-8" width="16" height="16" rx="3" class="port"/>
    <rect x="-116" y="56" width="16" height="16" rx="3" class="port"/>
    <!-- 포트 (우 3개) -->
    <rect x="100" y="-72" width="16" height="16" rx="3" class="port"/>
    <rect x="100" y="-8" width="16" height="16" rx="3" class="port"/>
    <rect x="100" y="56" width="16" height="16" rx="3" class="port"/>
  </g>

  <!-- 좌측 어댑터 3개 -->
  <g transform="translate(40 152)">
    <rect width="176" height="52" rx="6" class="adapter-in"/>
    <text x="14" y="22" class="ad">HTTP Controller</text>
    <text x="14" y="40" class="ad-sub mono">POST /orders</text>
  </g>
  <line x1="220" y1="178" x2="280" y2="204" stroke="var(--c-accent-2)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-in)"/>

  <g transform="translate(40 242)">
    <rect width="176" height="52" rx="6" class="adapter-in"/>
    <text x="14" y="22" class="ad">CLI · Batch</text>
    <text x="14" y="40" class="ad-sub">야간 정산 스크립트</text>
  </g>
  <line x1="220" y1="268" x2="280" y2="268" stroke="var(--c-accent-2)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-in)"/>

  <g transform="translate(40 332)">
    <rect width="176" height="52" rx="6" class="adapter-in"/>
    <text x="14" y="22" class="ad">Test Code</text>
    <text x="14" y="40" class="ad-sub">인프라 없이 직접 호출</text>
  </g>
  <line x1="220" y1="358" x2="280" y2="332" stroke="var(--c-accent-2)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-in)"/>

  <!-- 우측 어댑터 3개 -->
  <g transform="translate(584 152)">
    <rect width="176" height="52" rx="6" class="adapter-out"/>
    <text x="14" y="22" class="ad">Prisma Repository</text>
    <text x="14" y="40" class="ad-sub">PostgreSQL</text>
  </g>
  <line x1="580" y1="178" x2="520" y2="204" stroke="var(--c-accent-4)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-out)"/>

  <g transform="translate(584 242)">
    <rect width="176" height="52" rx="6" class="adapter-out"/>
    <text x="14" y="22" class="ad">Mail Notifier</text>
    <text x="14" y="40" class="ad-sub">SendGrid</text>
  </g>
  <line x1="580" y1="268" x2="520" y2="268" stroke="var(--c-accent-4)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-out)"/>

  <g transform="translate(584 332)">
    <rect width="176" height="52" rx="6" class="adapter-out"/>
    <text x="14" y="22" class="ad">Payment Gateway</text>
    <text x="14" y="40" class="ad-sub">외부 결제사</text>
  </g>
  <line x1="580" y1="358" x2="520" y2="332" stroke="var(--c-accent-4)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-out)"/>

  <!-- 하단 결론 -->
  <g transform="translate(24 442)">
    <rect width="752" height="94" rx="8" fill="var(--c-card)" stroke="var(--c-accent)" stroke-width="1.5"/>
    <text x="20" y="28" class="concl">모든 화살표가 안쪽을 향합니다</text>
    <text x="20" y="52" class="cap">바깥은 안쪽을 압니다. 안쪽은 바깥의 어떤 구현도 알지 못합니다.</text>
    <text x="20" y="74" class="cap">육각형이라는 모양에는 의미가 없습니다. 변이 여럿이라는 사실: 여러 종류의 바깥이 붙는다는 것만 표현합니다.</text>
  </g>
</svg>
