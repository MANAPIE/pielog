<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">의존 방향과 Hexagonal Architecture: ep.02 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="16%" cy="84%" r="44%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <circle cx="1120" cy="540" r="240" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="-160" y="-110" width="500" height="360" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(-8 90 70)"/>

  <!-- 중앙: 육각형 + 안쪽을 향하는 화살표들 -->
  <g transform="translate(600 315)">
    <!-- 외곽 포커스 링(점선 육각형) -->
    <polygon points="0,-215 186,-107 186,107 0,215 -186,107 -186,-107"
             fill="none" stroke="var(--c-accent)" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.5"/>

    <!-- 본 육각형 -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"
             fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="3"/>

    <!-- 내부 텍스처 -->
    <line x1="-58" y1="-40" x2="58" y2="-40" stroke="var(--c-line)" stroke-width="3"/>
    <line x1="-58" y1="-18" x2="30" y2="-18" stroke="var(--c-line)" stroke-width="1.4" opacity="0.45"/>
    <line x1="-58" y1="2" x2="44" y2="2" stroke="var(--c-line)" stroke-width="1.4" opacity="0.45"/>
    <circle cx="-44" cy="34" r="5" fill="var(--c-accent)"/>
    <circle cx="-26" cy="34" r="5" fill="var(--c-accent)" opacity="0.6"/>
    <rect x="0" y="28" width="52" height="12" rx="6" fill="var(--c-accent-3)" opacity="0.7"/>

    <!-- 포트 표시 (변 위의 작은 사각형) -->
    <g fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4">
      <rect x="-78" y="-124" width="18" height="18" rx="3" transform="rotate(30 -69 -115)"/>
      <rect x="-139" y="-9" width="18" height="18" rx="3"/>
      <rect x="-78" y="106" width="18" height="18" rx="3" transform="rotate(-30 -69 115)"/>
      <rect x="60" y="-124" width="18" height="18" rx="3" transform="rotate(-30 69 -115)"/>
      <rect x="121" y="-9" width="18" height="18" rx="3"/>
      <rect x="60" y="106" width="18" height="18" rx="3" transform="rotate(30 69 115)"/>
    </g>

    <!-- 바깥 어댑터 6개 (모두 안쪽으로 화살표) -->
    <!-- 좌상 -->
    <g transform="translate(-260 -190) rotate(-6)">
      <rect x="-58" y="-26" width="116" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.8"/>
      <line x1="-38" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="-32" cy="10" r="3.5" fill="var(--c-accent-2)"/>
    </g>
    <line x1="-206" y1="-166" x2="-104" y2="-124" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.6"/>
    <polygon points="-104,-124 -114,-124 -110,-133" fill="var(--c-line)" opacity="0.7" transform="rotate(22 -104 -124)"/>

    <!-- 좌중 -->
    <g transform="translate(-330 0) rotate(4)">
      <rect x="-58" y="-26" width="116" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.8"/>
      <line x1="-38" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="-32" cy="10" r="3.5" fill="var(--c-accent-2)"/>
    </g>
    <line x1="-268" y1="0" x2="-148" y2="0" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.6"/>
    <polygon points="-148,0 -158,-5 -158,5" fill="var(--c-line)" opacity="0.7"/>

    <!-- 좌하 -->
    <g transform="translate(-260 190) rotate(7)">
      <rect x="-58" y="-26" width="116" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.8"/>
      <line x1="-38" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="-32" cy="10" r="3.5" fill="var(--c-accent-2)"/>
    </g>
    <line x1="-206" y1="166" x2="-104" y2="124" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.6"/>
    <polygon points="-104,124 -114,124 -110,133" fill="var(--c-line)" opacity="0.7" transform="rotate(-22 -104 124)"/>

    <!-- 우상 -->
    <g transform="translate(260 -190) rotate(6)">
      <rect x="-58" y="-26" width="116" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.8"/>
      <line x1="-38" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="-32" cy="10" r="3.5" fill="var(--c-accent-4)"/>
    </g>
    <line x1="206" y1="-166" x2="104" y2="-124" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.6"/>
    <polygon points="104,-124 114,-124 110,-133" fill="var(--c-line)" opacity="0.7" transform="rotate(-22 104 -124)"/>

    <!-- 우중 -->
    <g transform="translate(330 0) rotate(-5)">
      <rect x="-58" y="-26" width="116" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.8"/>
      <line x1="-38" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="-32" cy="10" r="3.5" fill="var(--c-accent-4)"/>
    </g>
    <line x1="268" y1="0" x2="148" y2="0" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.6"/>
    <polygon points="148,0 158,-5 158,5" fill="var(--c-line)" opacity="0.7"/>

    <!-- 우하 -->
    <g transform="translate(260 190) rotate(-8)">
      <rect x="-58" y="-26" width="116" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.8"/>
      <line x1="-38" y1="-8" x2="30" y2="-8" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="-32" cy="10" r="3.5" fill="var(--c-accent-4)"/>
    </g>
    <line x1="206" y1="166" x2="104" y2="124" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.6"/>
    <polygon points="104,124 114,124 110,133" fill="var(--c-line)" opacity="0.7" transform="rotate(22 104 124)"/>
  </g>

  <!-- 디테일 -->
  <g transform="translate(140 120)">
    <circle r="4" fill="var(--c-accent-2)"/>
    <circle cx="16" r="4" fill="var(--c-accent-2)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent-2)" opacity="0.3"/>
  </g>
  <g transform="translate(1060 150) rotate(-16)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-4)" stroke-width="1.6"/>
  </g>
  <g transform="translate(120 500)" opacity="0.6">
    <circle r="40" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5"/>
    <circle r="22" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">02</text>
</svg>
