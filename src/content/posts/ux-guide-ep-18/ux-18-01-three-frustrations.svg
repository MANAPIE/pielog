<svg viewBox="0 0 500 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tf">
  <title id="t-tf">핸드오프에서 세 직무가 겪는 좌절</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-tf" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-tf-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="392" />
  <text x="24" y="36" class="ttl">핸드오프에서 세 직무가 겪는 좌절</text>
  <text x="104" y="64" class="th">증상</text>
  <text x="230" y="64" class="th">원인</text>
  <text x="356" y="64" class="th">대응</text>
  <text x="24" y="120" class="nm" style="fill:var(--c-accent-3)">디자이너</text>
  <rect x="104" y="76" width="120" height="80" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.4" />
  <text x="114" y="100" class="mid">내가 만든</text>
  <text x="114" y="117" class="mid">디자인이 아니다</text>
  <rect x="230" y="76" width="120" height="80" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="240" y="100" class="cap">명세 부재,</text>
  <text x="240" y="117" class="cap">동적 상태 미설계,</text>
  <text x="240" y="134" class="cap">반응형 기준 모호</text>
  <rect x="356" y="76" width="120" height="80" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="366" y="100" class="cap">상태와 엣지 케이스를</text>
  <text x="366" y="117" class="cap">적은 명세,</text>
  <text x="366" y="134" class="cap">30분 사전 리뷰</text>
  <text x="24" y="212" class="nm" style="fill:var(--c-accent-2)">개발자</text>
  <rect x="104" y="168" width="120" height="80" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.4" />
  <text x="114" y="192" class="mid">이걸 어떻게</text>
  <text x="114" y="209" class="mid">구현하라는 건지</text>
  <rect x="230" y="168" width="120" height="80" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="240" y="192" class="cap">불가능한 레이아웃,</text>
  <text x="240" y="209" class="cap">실데이터와 괴리,</text>
  <text x="240" y="226" class="cap">상태 누락</text>
  <rect x="356" y="168" width="120" height="80" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="366" y="192" class="cap">질문 채널,</text>
  <text x="366" y="209" class="cap">실데이터로</text>
  <text x="366" y="226" class="cap">시안 검토</text>
  <text x="24" y="304" class="nm" style="fill:var(--c-accent)">기획자</text>
  <rect x="104" y="260" width="120" height="80" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="114" y="284" class="mid">내 의도가</text>
  <text x="114" y="301" class="mid">어디로 갔지</text>
  <rect x="230" y="260" width="120" height="80" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="240" y="284" class="cap">시안 전달 중</text>
  <text x="240" y="301" class="cap">의도 증발</text>
  <rect x="356" y="260" width="120" height="80" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="366" y="284" class="cap">의도를 디자인</text>
  <text x="366" y="301" class="cap">파일에 기록</text>
  <text x="24" y="368" class="cap">세 좌절은 모두 그림으로는 전달되지 않는 정보에서 생깁니다.</text>
</svg>
