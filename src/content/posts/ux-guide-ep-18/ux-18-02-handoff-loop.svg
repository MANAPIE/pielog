<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hl">
  <title id="t-hl">한 번의 전달에서 대화로</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-hl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-hl-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="380" />
  <text x="24" y="36" class="ttl">한 번의 전달에서 대화로</text>
  <text x="24" y="64" class="th" style="fill:var(--c-accent-2)">넘기기</text>
  <rect x="24" y="76" width="120" height="44" rx="8" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.4" />
  <text x="84.0" y="103" class="nm" text-anchor="middle">시안</text>
  <line x1="148" y1="98" x2="186" y2="98" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-hl)" />
  <rect x="190" y="76" width="120" height="44" rx="8" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.4" />
  <text x="250.0" y="103" class="nm" text-anchor="middle">전달</text>
  <line x1="314" y1="98" x2="352" y2="98" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-hl)" />
  <rect x="356" y="76" width="120" height="44" rx="8" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.4" />
  <text x="416.0" y="103" class="nm" text-anchor="middle">구현</text>
  <text x="24" y="142" class="cap" style="fill:var(--c-accent-2)">차이는 출시 뒤에 발견됩니다.</text>
  <text x="24" y="178" class="th" style="fill:var(--c-accent)">대화</text>
  <rect x="24" y="190" width="120" height="44" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="84.0" y="217" class="nm" text-anchor="middle">시안</text>
  <line x1="148" y1="212" x2="186" y2="212" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-hl)" />
  <rect x="190" y="190" width="120" height="44" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="250.0" y="217" class="nm" text-anchor="middle">사전 리뷰 30분</text>
  <line x1="314" y1="212" x2="352" y2="212" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-hl)" />
  <rect x="356" y="190" width="120" height="44" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="416.0" y="217" class="nm" text-anchor="middle">구현</text>
  <line x1="416" y1="234" x2="416" y2="266" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-hl)" />
  <rect x="24" y="270" width="120" height="44" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="84.0" y="297" class="nm" text-anchor="middle">출시</text>
  <rect x="190" y="270" width="120" height="44" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="250.0" y="297" class="nm" text-anchor="middle">디자인 QA</text>
  <line x1="186" y1="292" x2="148" y2="292" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-hl)" />
  <rect x="356" y="270" width="120" height="44" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="416.0" y="297" class="nm" text-anchor="middle">중간 리뷰</text>
  <line x1="352" y1="292" x2="314" y2="292" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-hl)" />
  <text x="24" y="336" class="cap" style="fill:var(--c-accent)">중간 리뷰에서 발견한 차이는 시안과 코드 어느 쪽이든 바로 고칩니다.</text>
  <text x="24" y="356" class="cap">리뷰가 세 번 들어가지만 전부 합쳐도 출시 뒤의 재작업보다 짧습니다.</text>
</svg>
