<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-quad">
  <title id="t-quad">응집도와 결합도의 사분면</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4A5FD9;
        --c-accent-2: #D97757;
        --c-accent-4: #3D8B7A;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft-4: rgba(61, 139, 122, 0.10);
        --c-soft-2: rgba(217, 119, 87, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #8DA0FF;
          --c-accent-2: #E89376;
          --c-accent-4: #6FBFA8;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft-4: rgba(111, 191, 168, 0.14);
          --c-soft-2: rgba(232, 147, 118, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .quad {
        fill: var(--c-card);
        stroke: var(--c-divider);
        stroke-width: 1;
      }

      .quad-good {
        fill: var(--c-soft-4);
        stroke: var(--c-accent-4);
        stroke-width: 1.8;
      }

      .quad-bad {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 1.8;
      }

      .axis {
        stroke: var(--c-line);
        stroke-width: 1.8;
      }

      .node {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.3;
      }

      .lnk {
        stroke: var(--c-line);
        stroke-width: 1.1;
        opacity: 0.55;
      }

      .lnk-hot {
        stroke: var(--c-accent-2);
        stroke-width: 1.3;
        opacity: 0.7;
      }

      .ax-lbl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-muted);
        letter-spacing: 0.08em;
      }

      .q-title {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .q-desc {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        fill: var(--c-muted);
      }

      .tag {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .mono { font-family: 'JetBrains Mono','SF Mono',monospace; }
    </style>
  </defs>

  <rect class="bg" width="800" height="620" />

  <!-- 축 라벨 -->
  <text x="400" y="24" class="ax-lbl" text-anchor="middle">결합도 COUPLING</text>
  <text x="120" y="46" class="ax-lbl" text-anchor="middle">낮음</text>
  <text x="680" y="46" class="ax-lbl" text-anchor="middle">높음</text>

  <g transform="translate(28 320) rotate(-90)">
    <text x="0" y="0" class="ax-lbl" text-anchor="middle">응집도 COHESION</text>
  </g>

  <!-- 사분면 -->
  <!-- 좌상: 목표 -->
  <g transform="translate(60 60)">
    <rect width="340" height="230" rx="8" class="quad-good" />
    <text x="20" y="28" class="tag" fill="var(--c-accent-4)">TARGET</text>
    <text x="20" y="52" class="q-title">기능 단위 모듈</text>
    <text x="20" y="74" class="q-desc">응집 높음 · 결합 낮음</text>

    <g transform="translate(0 -15)">
      <!-- 노드: 두 덩어리, 내부 촘촘, 사이 얇음 -->
      <g transform="translate(80 150)">
        <line x1="0" y1="0" x2="34" y2="-24" class="lnk" />
        <line x1="0" y1="0" x2="30" y2="26" class="lnk" />
        <line x1="34" y1="-24" x2="30" y2="26" class="lnk" />
        <circle cx="0" cy="0" r="11" class="node" />
        <circle cx="34" cy="-24" r="11" class="node" />
        <circle cx="30" cy="26" r="11" class="node" />
      </g>
      <g transform="translate(230 150)">
        <line x1="0" y1="0" x2="34" y2="-24" class="lnk" />
        <line x1="0" y1="0" x2="30" y2="26" class="lnk" />
        <line x1="34" y1="-24" x2="30" y2="26" class="lnk" />
        <circle cx="0" cy="0" r="11" class="node" />
        <circle cx="34" cy="-24" r="11" class="node" />
        <circle cx="30" cy="26" r="11" class="node" />
      </g>
      <line x1="122" y1="150" x2="222" y2="150" stroke="var(--c-accent-4)" stroke-width="1.6" stroke-dasharray="5 4" />
    </g>
    <text x="170" y="218" class="q-desc" text-anchor="middle">삭제 가능 · 탐색 저렴</text>
  </g>

  <!-- 우상: 큰 덩어리 -->
  <g transform="translate(420 60)">
    <rect width="320" height="230" rx="8" class="quad" />
    <text x="20" y="28" class="tag" fill="var(--c-muted)">MONOLITHIC</text>
    <text x="20" y="52" class="q-title">분리되지 않은 덩어리</text>
    <text x="20" y="74" class="q-desc">응집 높음 · 결합 높음</text>

    <g transform="translate(160 152)">
      <g transform="translate(0 -10)">
        <g class="lnk">
          <line x1="-56" y1="-22" x2="0" y2="-34" />
          <line x1="0" y1="-34" x2="56" y2="-20" />
          <line x1="-56" y1="-22" x2="-30" y2="30" />
          <line x1="56" y1="-20" x2="34" y2="32" />
          <line x1="-30" y1="30" x2="34" y2="32" />
          <line x1="-56" y1="-22" x2="34" y2="32" />
          <line x1="0" y1="-34" x2="-30" y2="30" />
        </g>
        <circle cx="-56" cy="-22" r="11" class="node" />
        <circle cx="0" cy="-34" r="11" class="node" />
        <circle cx="56" cy="-20" r="11" class="node" />
        <circle cx="-30" cy="30" r="11" class="node" />
        <circle cx="34" cy="32" r="11" class="node" />
        <rect x="-78" y="-56" width="156" height="112" rx="8" fill="none" stroke="var(--c-line)" stroke-width="1.4"
          stroke-dasharray="4 4" opacity="0.6" />
      </g>
    </g>
    <text x="160" y="218" class="q-desc" text-anchor="middle">작을 때는 문제 없음</text>
  </g>

  <!-- 좌하: 흩어진 유틸 -->
  <g transform="translate(60 310)">
    <rect width="340" height="230" rx="8" class="quad" />
    <text x="20" y="28" class="tag" fill="var(--c-muted)">SCATTERED</text>
    <text x="20" y="52" class="q-title">흩어진 유틸리티</text>
    <text x="20" y="74" class="q-desc">응집 낮음 · 결합 낮음</text>

    <g transform="translate(0 -10)">
      <g transform="translate(170 152)">
        <circle cx="-90" cy="-26" r="11" class="node" />
        <circle cx="-30" cy="24" r="11" class="node" />
        <circle cx="20" cy="-30" r="11" class="node" />
        <circle cx="76" cy="20" r="11" class="node" />
        <circle cx="110" cy="-24" r="11" class="node" />
        <rect x="-116" y="-56" width="250" height="112" rx="8" fill="none" stroke="var(--c-muted)" stroke-width="1.4"
          stroke-dasharray="4 4" opacity="0.6" />
        <text x="0" y="52" class="q-desc mono" text-anchor="middle">utils/</text>
      </g>
    </g>
    <text x="170" y="217" class="q-desc" text-anchor="middle">관련 없는 것들이 한 폴더에</text>
  </g>

  <!-- 우하: 최악 -->
  <g transform="translate(420 310)">
    <rect width="320" height="230" rx="8" class="quad-bad" />
    <text x="20" y="28" class="tag" fill="var(--c-accent-2)">WORST</text>
    <text x="20" y="52" class="q-title">관련 없는데 서로 얽힘</text>
    <text x="20" y="74" class="q-desc">응집 낮음 · 결합 높음</text>

    <g transform="translate(0 -10)">
      <g transform="translate(160 152)">
        <g class="lnk-hot">
          <line x1="-70" y1="-26" x2="66" y2="24" />
          <line x1="-70" y1="-26" x2="10" y2="30" />
          <line x1="66" y1="-24" x2="-30" y2="28" />
          <line x1="66" y1="-24" x2="-70" y2="-26" />
          <line x1="10" y1="30" x2="66" y2="-24" />
          <line x1="-30" y1="28" x2="66" y2="24" />
        </g>
        <circle cx="-70" cy="-26" r="11" class="node" />
        <circle cx="66" cy="-24" r="11" class="node" />
        <circle cx="-30" cy="28" r="11" class="node" />
        <circle cx="10" cy="30" r="11" class="node" />
        <circle cx="66" cy="24" r="11" class="node" />
        <!-- 두 그룹 경계 (의미 없는 분할) -->
        <line x1="-2" y1="-56" x2="-2" y2="56" stroke="var(--c-accent-2)" stroke-width="2" stroke-dasharray="3 4"
          opacity="0.7" />
      </g>
    </g>
    <text x="160" y="217" class="q-desc" text-anchor="middle">경계는 있으나 아무것도 막지 못함</text>
  </g>

  <!-- 축선 -->
  <line x1="410" y1="56" x2="410" y2="546" class="axis" opacity="0.25" />
  <line x1="54" y1="300" x2="746" y2="300" class="axis" opacity="0.25" />

  <!-- 하단 결론 -->
  <text x="400" y="580" class="q-title" text-anchor="middle" font-size="13">같은 이유로 같이 바뀌는 것들이 한 모듈입니다</text>
</svg>