<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" role="img" aria-labelledby="title-stg02-01">
  <title id="title-stg02-01">TDD의 Red-Green-Refactor 사이클</title>
  <style>
    svg {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-muted: #6B7280;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-card-bg: #F2F0E9;
      --c-card-border: rgba(91, 140, 123, 0.28);
      --c-red: #B85450;
      --c-red-bg: #F3E0DE;
      --c-green: #5B8C7B;
      --c-green-bg: #E0EBE5;
      --c-blue: #5B7A8C;
      --c-blue-bg: #E0E7EB;
      --c-arrow: #9CA9A4;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-muted: #94A3B8;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-card-bg: #1F242C;
        --c-card-border: rgba(127, 181, 160, 0.32);
        --c-red: #D4807C;
        --c-red-bg: #2D2120;
        --c-green: #7FB5A0;
        --c-green-bg: #1F2D28;
        --c-blue: #88A5BC;
        --c-blue-bg: #1F262D;
        --c-arrow: #5A6670;
      }
    }
    .bg { fill: var(--c-bg); }
    .card-red { fill: var(--c-red-bg); stroke: var(--c-red); stroke-width: 1.2; }
    .card-green { fill: var(--c-green-bg); stroke: var(--c-green); stroke-width: 1.2; }
    .card-blue { fill: var(--c-blue-bg); stroke: var(--c-blue); stroke-width: 1.2; }
    .label-red { fill: var(--c-red); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; }
    .label-green { fill: var(--c-green); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; }
    .label-blue { fill: var(--c-blue); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; }
    .body { fill: var(--c-fg); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
    .sub { fill: var(--c-muted); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    .arrow { stroke: var(--c-arrow); stroke-width: 1.5; fill: none; }
    .note { fill: var(--c-muted); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-style: italic; }
  </style>
  <defs>
    <marker id="arr02-01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--c-arrow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="600" height="380"/>

  <!-- Red -->
  <rect class="card-red" x="40" y="100" width="160" height="180" rx="12"/>
  <circle cx="68" cy="130" r="8" fill="var(--c-red)"/>
  <text class="label-red" x="86" y="135">Red</text>
  <text class="body" x="60" y="170">실패하는 테스트를</text>
  <text class="body" x="60" y="188">먼저 쓴다</text>
  <line x1="60" y1="205" x2="180" y2="205" stroke="var(--c-card-border)" stroke-width="0.6"/>
  <text class="sub" x="60" y="225">아직 구현이 없으니</text>
  <text class="sub" x="60" y="241">당연히 실패</text>
  <text class="sub" x="60" y="265">"이 기능이 필요하다"</text>

  <!-- Green -->
  <rect class="card-green" x="220" y="100" width="160" height="180" rx="12"/>
  <circle cx="248" cy="130" r="8" fill="var(--c-green)"/>
  <text class="label-green" x="266" y="135">Green</text>
  <text class="body" x="240" y="170">통과시키는</text>
  <text class="body" x="240" y="188">최소한의 코드</text>
  <line x1="240" y1="205" x2="360" y2="205" stroke="var(--c-card-border)" stroke-width="0.6"/>
  <text class="sub" x="240" y="225">우아함은</text>
  <text class="sub" x="240" y="241">다음 단계의 몫</text>
  <text class="sub" x="240" y="265">"일단 동작하게 한다"</text>

  <!-- Refactor -->
  <rect class="card-blue" x="400" y="100" width="160" height="180" rx="12"/>
  <circle cx="428" cy="130" r="8" fill="var(--c-blue)"/>
  <text class="label-blue" x="446" y="135">Refactor</text>
  <text class="body" x="420" y="170">통과를 유지하며</text>
  <text class="body" x="420" y="188">구조를 다듬는다</text>
  <line x1="420" y1="205" x2="540" y2="205" stroke="var(--c-card-border)" stroke-width="0.6"/>
  <text class="sub" x="420" y="225">테스트가</text>
  <text class="sub" x="420" y="241">안전망이 된다</text>
  <text class="sub" x="420" y="265">"코드를 깨끗하게"</text>

  <!-- 화살표 -->
  <line class="arrow" x1="202" y1="190" x2="218" y2="190" marker-end="url(#arr02-01)"/>
  <line class="arrow" x1="382" y1="190" x2="398" y2="190" marker-end="url(#arr02-01)"/>

  <!-- 사이클 복귀 화살표 (Refactor → Red): 매끄러운 U자 곡선 -->
  <path class="arrow" d="M 480 282 C 480 325, 120 325, 120 282" stroke-dasharray="4 3" marker-end="url(#arr02-01)"/>
  <text class="sub" x="300" y="338" text-anchor="middle">다음 사이클로: 짧게, 자주 반복합니다</text>

  <!-- 상단 강조 -->
  <text class="note" x="300" y="40" text-anchor="middle">한 사이클은 5분을 넘기지 않습니다</text>
  <text class="sub" x="300" y="62" text-anchor="middle">길어지면 테스트 단위가 너무 크다는 신호</text>
</svg>
