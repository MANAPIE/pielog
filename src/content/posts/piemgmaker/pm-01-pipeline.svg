<path class="ln" d="M300,556 L300,574" marker-end="url(#ar)"/>
<rect class="card" x="110" y="576" width="380" height="50" rx="8"/>
<text class="tb" x="300" y="598" text-anchor="middle">QA 판정 — 하드 룰 3종</text>
<text class="ts" x="300" y="615" text-anchor="middle">경계 접촉 · 알파 커버리지 · 헤일로 (재질 인지)</text>
</svg>
