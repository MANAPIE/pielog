<text class="ts" x="492" y="186" text-anchor="middle">참조 이미지</text>
<text class="tb mono acc" x="492" y="207" text-anchor="middle" font-size="11">object-gen-styleref</text>
<path class="ln" d="M108,222 L108,238"/>
<path class="ln" d="M300,222 L300,238"/>
<path class="ln" d="M492,222 L492,238"/>
<path class="ln" d="M108,238 L492,238 M300,238 L300,252 M172,252 L428,252"/>
<path class="ln" d="M172,252 L172,266" marker-end="url(#ar)"/>
<path class="ln" d="M428,252 L428,266" marker-end="url(#ar)"/>
<rect class="soft" x="60" y="268" width="224" height="62" rx="8"/>
<text class="ts" x="172" y="287" text-anchor="middle">불투명 (opaque)</text>
<text class="tb mono acc" x="172" y="306" text-anchor="middle" font-size="12">segment</text>
<text class="txs" x="172" y="322" text-anchor="middle">BiRefNet-matting + 전경 정제</text>
<rect class="soft2" x="316" y="268" width="224" height="62" rx="8"/>
<text class="ts" x="428" y="287" text-anchor="middle">반투명 (translucent)</text>
<text class="tb mono acc2" x="428" y="306" text-anchor="middle" font-size="11">native_alpha → trimap</text>
<text class="txs" x="428" y="322" text-anchor="middle">Qwen-Image-Layered · ViTMatte</text>
<path class="ln" d="M172,330 L172,348"/>
<path class="ln" d="M428,330 L428,348"/>
<path class="ln" d="M172,348 L428,348 M300,348 L300,362"/>
<path class="ln" d="M300,362 L300,366" marker-end="url(#ar)"/>
<rect class="card" x="110" y="366" width="380" height="50" rx="8"/>
<text class="tb" x="300" y="388" text-anchor="middle">엔진 submit · poll · fetch</text>
<text class="ts" x="300" y="405" text-anchor="middle">후보 k장 · 카드별 시드 기록</text>
<path class="ln" d="M300,416 L300,434" marker-end="url(#ar)"/>
<rect class="card" x="110" y="436" width="380" height="50" rx="8"/>
