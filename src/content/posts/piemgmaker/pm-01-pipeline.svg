<text class="tb mono acc" x="108" y="207" text-anchor="middle" font-size="11">object-gen</text>
<rect class="soft" x="212" y="166" width="176" height="56" rx="8"/>
<text class="ts" x="300" y="186" text-anchor="middle">자산 있음</text>
