    <g transform="translate(150 150) rotate(-8)"><rect x="0" y="0" width="150" height="10" rx="5" fill="var(--c-accent-3)" fill-opacity="0.7"/><rect x="0" y="22" width="96" height="10" rx="5" fill="var(--c-accent)" fill-opacity="0.7"/><rect x="0" y="44" width="120" height="10" rx="5" fill="var(--c-accent-2)" fill-opacity="0.7"/></g>
