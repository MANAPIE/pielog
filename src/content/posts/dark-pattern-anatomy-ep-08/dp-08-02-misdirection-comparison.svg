<svg width="100%" viewBox="0 0 800 460" role="img" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Misdirection: 위치 권한 모달 Before/After</title>
  <desc>다크패턴: 허용 버튼이 압도적으로 강조 / 정직한 설계: 동등한 시각 위계의 두 선택지</desc>
  <defs>
    <style>
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
      .title { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .body { font-size: 11px; fill: #5F5E5A; }
      .annot { font-size: 11px; fill: #5F5E5A; }
      .annot-bold { font-size: 11px; font-weight: 600; }
      .pair-label { font-size: 13px; fill: #888780; font-weight: 500; }
      .page-bg { fill: #F9F8F4; }
      .frame-bg { fill: #F1EFE8; }
      .screen-bg { fill: #FFFFFF; stroke: #D3D1C7; stroke-width: 0.5; }
      .red-tag { fill: #FCEBEB; }
      .red-tag-text { fill: #791F1F; }
      .teal-tag { fill: #E1F5EE; }
      .teal-tag-text { fill: #085041; }
      .red-annot-bg { fill: #FCEBEB; }
      .red-annot-text { fill: #791F1F; }
      .teal-annot-bg { fill: #E1F5EE; }
      .teal-annot-text { fill: #085041; }
      .cta-blue-strong { fill: #2563EB; }
      .cta-equal-outline { fill: none; stroke: #B4B2A9; stroke-width: 1; }
      .secondary-faint { fill: #B4B2A9; font-size: 9px; }
      .icon-bg { fill: #EEF4FF; }
      .vs-divider { stroke: #D3D1C7; stroke-width: 0.5; }
      .vs-circle { fill: #F1EFE8; }
      .vs-text { fill: #888780; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #D3D1C7; }
        .body { fill: #B4B2A9; }
        .annot { fill: #B4B2A9; }
        .pair-label { fill: #888780; }
        .page-bg { fill: #1C1B1A; }
        .frame-bg { fill: #2C2C2A; }
        .screen-bg { fill: #1C1B1A; stroke: #444441; }
        .red-tag { fill: #501313; }
        .red-tag-text { fill: #F7C1C1; }
        .teal-tag { fill: #04342C; }
        .teal-tag-text { fill: #9FE1CB; }
        .red-annot-bg { fill: #501313; }
        .red-annot-text { fill: #F7C1C1; }
        .teal-annot-bg { fill: #04342C; }
        .teal-annot-text { fill: #9FE1CB; }
        .cta-blue-strong { fill: #3B82F6; }
        .cta-equal-outline { stroke: #5F5E5A; }
        .secondary-faint { fill: #5F5E5A; }
        .icon-bg { fill: #1A2540; }
        .vs-divider { stroke: #444441; }
        .vs-circle { fill: #2C2C2A; }
        .vs-text { fill: #888780; }
      }
    </style>
  </defs>

  <rect class="page-bg" width="800" height="460" rx="16" />
  <text x="400" y="34" text-anchor="middle" class="pair-label">사례. 위치 권한 요청 모달</text>

  <!-- LEFT: DARK -->
  <rect class="frame-bg" x="48" y="52" width="320" height="360" rx="12" />
  <rect class="red-tag" x="64" y="68" width="50" height="20" rx="4" />
  <text x="89" y="81" text-anchor="middle" class="label red-tag-text">DARK</text>

  <rect class="screen-bg" x="64" y="96" width="288" height="220" rx="8" />

  <text x="332" y="116" text-anchor="end" class="secondary-faint">허용 안 함 ✕</text>

  <rect class="icon-bg" x="172" y="130" width="72" height="48" rx="8" />
  <text x="208" y="160" text-anchor="middle" font-size="20">📍</text>

  <text x="208" y="200" text-anchor="middle" class="title">주변 매장을 추천해드릴까요?</text>

  <text x="208" y="222" text-anchor="middle" class="body">위치 정보를 사용하면 더 정확한</text>
  <text x="208" y="238" text-anchor="middle" class="body">추천을 받을 수 있습니다.</text>

  <rect class="cta-blue-strong" x="84" y="252" width="248" height="44" rx="8" />
  <text x="208" y="279" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">위치 정보 허용</text>

  <rect class="red-annot-bg" x="64" y="328" width="288" height="62" rx="6" />
  <text x="80" y="346" class="annot-bold red-annot-text">Misdirection</text>
  <text x="80" y="362" class="annot red-annot-text">"허용"은 화면 중앙의 큰 채움 버튼.</text>
  <text x="80" y="378" class="annot red-annot-text">"허용 안 함"은 우측 상단 9pt 회색 텍스트.</text>

  <!-- RIGHT: BRIGHT -->
  <rect class="frame-bg" x="432" y="52" width="320" height="360" rx="12" />
  <rect class="teal-tag" x="448" y="68" width="60" height="20" rx="4" />
  <text x="478" y="81" text-anchor="middle" class="label teal-tag-text">BRIGHT</text>

  <rect class="screen-bg" x="448" y="96" width="288" height="220" rx="8" />

  <rect class="icon-bg" x="556" y="130" width="72" height="48" rx="8" />
  <text x="592" y="160" text-anchor="middle" font-size="20">📍</text>

  <text x="592" y="200" text-anchor="middle" class="title">주변 매장을 추천해드릴까요?</text>

  <text x="592" y="222" text-anchor="middle" class="body">위치 정보를 사용하면 더 정확한</text>
  <text x="592" y="238" text-anchor="middle" class="body">추천을 받을 수 있습니다.</text>

  <!-- equal weight buttons -->
  <rect class="cta-equal-outline" x="468" y="252" width="120" height="44" rx="8" />
  <text x="528" y="279" text-anchor="middle" font-size="13" fill="#5F5E5A">허용 안 함</text>

  <rect class="cta-blue-strong" x="596" y="252" width="120" height="44" rx="8" />
  <text x="656" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">허용</text>

  <rect class="teal-annot-bg" x="448" y="328" width="288" height="62" rx="6" />
  <text x="464" y="346" class="annot teal-annot-text">두 선택지가 동일한 크기·여백.</text>
  <text x="464" y="362" class="annot teal-annot-text">색상 강조는 1개에만 적용하더라도</text>
  <text x="464" y="378" class="annot teal-annot-text">"허용 안 함"이 동등한 가시성 보장.</text>

  <line class="vs-divider" x1="400" y1="72" x2="400" y2="412" stroke-dasharray="4 4" />
  <circle class="vs-circle" cx="400" cy="232" r="16" />
  <text x="400" y="237" text-anchor="middle" font-size="11" font-weight="600" class="vs-text">VS</text>
</svg>
