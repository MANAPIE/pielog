<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">부록 — 그 외 GoF 객체 패턴들 — ep.11 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--c-muted)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="var(--c-muted)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="85%" cy="15%" r="40%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- 배경 stroke 도형 (은은하게) -->
  <circle cx="120" cy="120" r="220" fill="none" stroke="var(--c-line)" stroke-width="1.2" opacity="0.10"/>
  <rect x="800" y="430" width="500" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.2" opacity="0.10" transform="rotate(7 1050 600)"/>

  <!-- 중앙: 가운데 큰 격자 (수집장 느낌) -->
  <g transform="translate(600 315)">
    <!-- 외곽 포커스 링 -->
    <rect x="-310" y="-150" width="620" height="300" rx="9" fill="none" stroke="var(--c-muted)" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.4"/>

    <!-- 5x3 작은 박스 격자 (남은 패턴들 — 라벨 대신 추상 마크) -->
    <g opacity="0.85">
      <!-- 1행 -->
      <g transform="translate(-280 -120)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="64" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>
      <g transform="translate(-160 -120) rotate(-2)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="72" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>
      <g transform="translate(-40 -120)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="56" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>
      <g transform="translate(80 -120) rotate(2)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="68" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>
      <g transform="translate(200 -120)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="60" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>

      <!-- 2행 (가운데, 약간 강조) -->
      <g transform="translate(-220 -30)">
        <rect width="140" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="1.6" opacity="0.85"/>
        <circle cx="22" cy="23" r="4" fill="var(--c-accent-3)" opacity="0.85"/>
        <line x1="34" y1="23" x2="120" y2="23" stroke="var(--c-accent-3)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
        <line x1="22" y1="39" x2="96" y2="39" stroke="var(--c-accent-3)" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
      </g>
      <g transform="translate(-60 -30) rotate(-1)">
        <rect width="120" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="1.6" opacity="0.85"/>
        <circle cx="20" cy="23" r="4" fill="var(--c-accent-3)" opacity="0.85"/>
        <line x1="32" y1="23" x2="100" y2="23" stroke="var(--c-accent-3)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
        <line x1="20" y1="39" x2="80" y2="39" stroke="var(--c-accent-3)" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
      </g>
      <g transform="translate(80 -30)">
        <rect width="140" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="1.6" opacity="0.85"/>
        <circle cx="22" cy="23" r="4" fill="var(--c-accent-3)" opacity="0.85"/>
        <line x1="34" y1="23" x2="120" y2="23" stroke="var(--c-accent-3)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
        <line x1="22" y1="39" x2="104" y2="39" stroke="var(--c-accent-3)" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
      </g>

      <!-- 3행 -->
      <g transform="translate(-280 60) rotate(2)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="66" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>
      <g transform="translate(-140 60)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="58" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>
      <g transform="translate(-20 60) rotate(-2)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="70" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>
      <g transform="translate(100 60)">
        <rect width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4"/>
        <circle cx="20" cy="23" r="3.5" fill="var(--c-muted)" opacity="0.7"/>
        <line x1="32" y1="23" x2="80" y2="23" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <line x1="20" y1="39" x2="62" y2="39" stroke="var(--c-muted)" stroke-width="4" stroke-linecap="round" opacity="0.17"/>
      </g>
      <g transform="translate(220 60) rotate(2)">
        <rect width="80" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="1.4" stroke-dasharray="3 3"/>
        <circle cx="28" cy="30" r="3" fill="var(--c-muted)" opacity="0.5"/>
        <circle cx="40" cy="30" r="3" fill="var(--c-muted)" opacity="0.35"/>
        <circle cx="52" cy="30" r="3" fill="var(--c-muted)" opacity="0.2"/>
      </g>
    </g>

    <!-- 상단 작은 마커 (라벨 대체) -->
    <g transform="translate(0 -172)" opacity="0.5">
      <line x1="-36" y1="0" x2="-12" y2="0" stroke="var(--c-muted)" stroke-width="2" stroke-linecap="round"/>
      <circle r="3.5" fill="var(--c-muted)"/>
      <line x1="12" y1="0" x2="36" y2="0" stroke="var(--c-muted)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 우상단 동심원 -->
  <g transform="translate(1050 130)" opacity="0.55">
    <circle r="48" fill="none" stroke="var(--c-muted)" stroke-width="1.5"/>
    <circle r="28" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌상단 작은 점 무리 -->
  <g transform="translate(180 100)">
    <circle r="4" fill="var(--c-muted)" opacity="0.65"/>
    <circle cx="16" r="4" fill="var(--c-muted)" opacity="0.4"/>
    <circle cx="32" r="4" fill="var(--c-muted)" opacity="0.2"/>
  </g>

  <!-- 좌하단 회전 사각형 -->
  <g transform="translate(140 540) rotate(-14)" opacity="0.5">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-muted)" stroke-width="1.5"/>
  </g>

  <!-- 우하단 큰 시리즈 번호 -->
  <text x="1130" y="575" class="num" text-anchor="end">11</text>
</svg>
