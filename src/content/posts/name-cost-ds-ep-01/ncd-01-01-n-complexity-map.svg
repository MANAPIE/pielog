  <!-- 허용 경계선 -->
  <path class="bound" d="M760 90 L 760 134 L 668 134 L 668 182 L 484 182 L 484 278 L 392 278 L 392 326 L 300 326 L 300 418"/>

  <text x="24" y="470" class="lg">경계선 왼쪽이 통과 가능한 영역입니다. 입력이 커질수록 쓸 수 있는 복잡도가 빠르게 줄어듭니다.</text>
  <text x="24" y="492" class="sub">N이 10일 때는 무엇을 써도 됩니다. 완전탐색을 버릴 이유가 없습니다.</text>
  <text x="24" y="512" class="sub">N이 10만을 넘으면 O(N log N)이 사실상 상한입니다. 정렬 한 번이 마지노선입니다.</text>
</svg>
