      <g transform="translate(96 6)">
        <rect width="88" height="40" rx="4" class="safe"/><text x="44" y="25" class="sym" fill="var(--c-safe-b)" text-anchor="middle">○</text>
        <g transform="translate(92 0)"><rect width="88" height="40" rx="4" class="safe"/><text x="44" y="25" class="sym" fill="var(--c-safe-b)" text-anchor="middle">○</text></g>
        <g transform="translate(184 0)"><rect width="88" height="40" rx="4" class="safe"/><text x="44" y="25" class="sym" fill="var(--c-safe-b)" text-anchor="middle">○</text></g>
        <g transform="translate(276 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(368 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(460 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(552 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
      </g>
    </g>
    <g transform="translate(0 240)">
      <text x="88" y="30" class="rl" text-anchor="end">1,000,000</text>
      <g transform="translate(96 6)">
        <rect width="88" height="40" rx="4" class="safe"/><text x="44" y="25" class="sym" fill="var(--c-safe-b)" text-anchor="middle">○</text>
        <g transform="translate(92 0)"><rect width="88" height="40" rx="4" class="safe"/><text x="44" y="25" class="sym" fill="var(--c-safe-b)" text-anchor="middle">○</text></g>
        <g transform="translate(184 0)"><rect width="88" height="40" rx="4" class="warn"/><text x="44" y="25" class="sym" fill="var(--c-warn-b)" text-anchor="middle">△</text></g>
        <g transform="translate(276 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(368 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(460 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(552 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
      </g>
    </g>
    <g transform="translate(0 288)">
      <text x="88" y="30" class="rl" text-anchor="end">10,000,000</text>
      <g transform="translate(96 6)">
        <rect width="88" height="40" rx="4" class="safe"/><text x="44" y="25" class="sym" fill="var(--c-safe-b)" text-anchor="middle">○</text>
        <g transform="translate(92 0)"><rect width="88" height="40" rx="4" class="safe"/><text x="44" y="25" class="sym" fill="var(--c-safe-b)" text-anchor="middle">○</text></g>
        <g transform="translate(184 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(276 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(368 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(460 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
        <g transform="translate(552 0)"><rect width="88" height="40" rx="4" class="dang"/><text x="44" y="25" class="sym" fill="var(--c-dang-b)" text-anchor="middle">×</text></g>
      </g>
