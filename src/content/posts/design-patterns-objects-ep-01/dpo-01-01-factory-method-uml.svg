<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-uml">
  <title id="title-uml">Factory Method의 클래스 구조</title>

  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #C02D6E;
        --c-accent-2: #D97757;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(74, 95, 217, 0.08);
        --c-divider: rgba(26, 31, 46, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #EC85B5;
          --c-accent-2: #E89376;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(141, 160, 255, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .box { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.4; }
      .box-soft { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.4; }
      .box-abstract { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.4; stroke-dasharray: 6 3; }
      .line { stroke: var(--c-line); stroke-width: 1.3; fill: none; }
      .line-dashed { stroke: var(--c-line); stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
      .divider { stroke: var(--c-divider); stroke-width: 1; }
      .label-class { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: var(--c-fg); }
      .label-class-abs { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: var(--c-fg); font-style: italic; }
      .label-stereo { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: var(--c-muted); letter-spacing: 0.05em; }
      .label-method { font-family: 'Inter', 'SF Mono', monospace; font-size: 12px; font-weight: 500; fill: var(--c-fg); }
      .label-method-abs { font-family: 'Inter', 'SF Mono', monospace; font-size: 12px; font-weight: 500; fill: var(--c-fg); font-style: italic; }
      .label-edge { font-family: 'Pretendard', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: var(--c-muted); }
    </style>
    <marker id="inherit" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <polygon points="0,0 14,7 0,14" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.4"/>
    </marker>
    <marker id="dep" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="var(--c-line)"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="500"/>

  <!-- 그룹 라벨 -->
  <text x="30" y="40" class="label-stereo">DISPATCHER 계층 — Factory Method</text>
  <text x="1170" y="40" class="label-stereo" text-anchor="end">PRODUCT 계층 — 생성되는 객체</text>

  <!-- ====================== 상속 / 구현 커넥터 ====================== -->
  <!-- 상속: EmailDispatcher → NotificationDispatcher -->
  <line x1="365" y1="150" x2="330" y2="240" class="line" marker-end="url(#inherit)"/>
  <!-- 상속: SmsDispatcher → NotificationDispatcher -->
  <line x1="365" y1="380" x2="330" y2="290" class="line" marker-end="url(#inherit)"/>
  <!-- 구현: EmailNotification ..▷ Notification -->
  <line x1="880" y1="150" x2="930" y2="240" class="line-dashed" marker-end="url(#inherit)"/>
  <!-- 구현: SmsNotification ..▷ Notification -->
  <line x1="880" y1="380" x2="930" y2="290" class="line-dashed" marker-end="url(#inherit)"/>

  <!-- ====================== 의존 (creates) ====================== -->
  <!-- EmailDispatcher ..> EmailNotification -->
  <line x1="595" y1="150" x2="670" y2="150" class="line-dashed" marker-end="url(#dep)" opacity="0.7"/>
  <text x="632" y="141" class="label-edge" text-anchor="middle">creates</text>
  <!-- SmsDispatcher ..> SmsNotification -->
  <line x1="595" y1="380" x2="670" y2="380" class="line-dashed" marker-end="url(#dep)" opacity="0.7"/>
  <text x="632" y="371" class="label-edge" text-anchor="middle">creates</text>

  <!-- ====================== 생성자(Dispatcher) 계층 ====================== -->
  <!-- NotificationDispatcher (추상) -->
  <g transform="translate(30 204)">
    <rect class="box-abstract" width="300" height="122" rx="4"/>
    <text x="150" y="24" class="label-stereo" text-anchor="middle">«abstract»</text>
    <text x="150" y="46" class="label-class-abs" text-anchor="middle">NotificationDispatcher</text>
    <line x1="0" y1="62" x2="300" y2="62" class="divider"/>
    <text x="16" y="84" class="label-method-abs">+ createNotification(): Notification</text>
    <text x="16" y="104" class="label-method">+ dispatch(): void</text>
  </g>

  <!-- EmailDispatcher -->
  <g transform="translate(365 99)">
    <rect class="box" width="230" height="102" rx="4"/>
    <text x="115" y="26" class="label-class" text-anchor="middle">EmailDispatcher</text>
    <line x1="0" y1="42" x2="230" y2="42" class="divider"/>
    <text x="16" y="64" class="label-method">+ createNotification():</text>
    <text x="16" y="84" class="label-method">    new EmailNotification()</text>
  </g>

  <!-- SmsDispatcher -->
  <g transform="translate(365 329)">
    <rect class="box" width="230" height="102" rx="4"/>
    <text x="115" y="26" class="label-class" text-anchor="middle">SmsDispatcher</text>
    <line x1="0" y1="42" x2="230" y2="42" class="divider"/>
    <text x="16" y="64" class="label-method">+ createNotification():</text>
    <text x="16" y="84" class="label-method">    new SmsNotification()</text>
  </g>

  <!-- ====================== 프로덕트(Notification) 계층 ====================== -->
  <!-- Notification (인터페이스) -->
  <g transform="translate(930 214)">
    <rect class="box-abstract" width="240" height="102" rx="4"/>
    <text x="120" y="24" class="label-stereo" text-anchor="middle">«interface»</text>
    <text x="120" y="46" class="label-class-abs" text-anchor="middle">Notification</text>
    <line x1="0" y1="62" x2="240" y2="62" class="divider"/>
    <text x="16" y="84" class="label-method-abs">+ send(): void</text>
  </g>

  <!-- EmailNotification -->
  <g transform="translate(670 109)">
    <rect class="box" width="210" height="82" rx="4"/>
    <text x="105" y="26" class="label-class" text-anchor="middle">EmailNotification</text>
    <line x1="0" y1="42" x2="210" y2="42" class="divider"/>
    <text x="16" y="64" class="label-method">+ send(): void</text>
  </g>

  <!-- SmsNotification -->
  <g transform="translate(670 339)">
    <rect class="box" width="210" height="82" rx="4"/>
    <text x="105" y="26" class="label-class" text-anchor="middle">SmsNotification</text>
    <line x1="0" y1="42" x2="210" y2="42" class="divider"/>
    <text x="16" y="64" class="label-method">+ send(): void</text>
  </g>

  <!-- ====================== 범례 ====================== -->
  <g transform="translate(30 470)">
    <line x1="0" y1="0" x2="40" y2="0" class="line" marker-end="url(#inherit)"/>
    <text x="50" y="4" class="label-edge">상속 / 구현</text>
    <line x1="180" y1="0" x2="220" y2="0" class="line-dashed" marker-end="url(#dep)"/>
    <text x="230" y="4" class="label-edge">의존 (creates)</text>
    <rect x="360" y="-8" width="24" height="16" class="box-abstract" rx="2"/>
    <text x="394" y="4" class="label-edge">추상 / 인터페이스</text>
  </g>
</svg>
