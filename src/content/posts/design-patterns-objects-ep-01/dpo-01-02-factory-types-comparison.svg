<svg viewBox="0 0 1200 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-cmp">
  <title id="title-cmp">세 가지 Factory 패턴 비교</title>

  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #C02D6E;
        --c-accent-2: #D97757;
        --c-accent-3: #A65AA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(74, 95, 217, 0.08);
        --c-divider: rgba(26, 31, 46, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #EC85B5;
          --c-accent-2: #E89376;
          --c-accent-3: #CE9DD2;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(141, 160, 255, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .col-bg { fill: var(--c-card); stroke: var(--c-divider); stroke-width: 1; }
      .box { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.3; }
      .box-abs { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.3; stroke-dasharray: 5 3; }
      .box-accent { fill: var(--c-card); stroke: var(--c-accent); stroke-width: 1.5; }
      .line { stroke: var(--c-line); stroke-width: 1.2; fill: none; }
      .line-dashed { stroke: var(--c-line); stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .col-num { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.14em; }
      .col-title { font-family: 'Inter', system-ui, sans-serif; font-size: 19px; font-weight: 700; fill: var(--c-fg); letter-spacing: -0.01em; }
      .col-caption { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: var(--c-muted); }
      .node-label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: var(--c-fg); }
      .node-label-sm { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: var(--c-fg); }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-line)"/>
    </marker>
    <marker id="tri" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="580"/>

  <!-- ============ 컬럼 1: Simple Factory ============ -->
  <g transform="translate(40 50)">
    <rect class="col-bg" width="360" height="490" rx="6"/>
    <text x="24" y="40" class="col-num">01</text>
    <text x="24" y="68" class="col-title">Simple Factory</text>
    <text x="24" y="92" class="col-caption">정적 메서드 하나가 분기</text>

    <!-- 다이어그램 -->
    <g transform="translate(0 130)">
      <!-- Factory 박스 -->
      <rect x="100" y="0" width="160" height="60" rx="4" class="box-accent"/>
      <text x="180" y="26" class="node-label" text-anchor="middle">NotificationFactory</text>
      <text x="180" y="44" class="node-label-sm" text-anchor="middle" fill="var(--c-muted)">.create(type)</text>

      <!-- 분기 -->
      <line x1="140" y1="60" x2="70" y2="160" class="line" marker-end="url(#arr)"/>
      <line x1="180" y1="60" x2="180" y2="160" class="line" marker-end="url(#arr)"/>
      <line x1="220" y1="60" x2="290" y2="160" class="line" marker-end="url(#arr)"/>

      <!-- 결과물 -->
      <rect x="20" y="170" width="100" height="44" rx="4" class="box"/>
      <text x="70" y="197" class="node-label" text-anchor="middle">Email</text>

      <rect x="130" y="170" width="100" height="44" rx="4" class="box"/>
      <text x="180" y="197" class="node-label" text-anchor="middle">SMS</text>

      <rect x="240" y="170" width="100" height="44" rx="4" class="box"/>
      <text x="290" y="197" class="node-label" text-anchor="middle">Push</text>
    </g>

    <!-- 캡션 박스 -->
    <g transform="translate(24 410)">
      <text x="0" y="0" class="col-caption" font-weight="700" fill="var(--c-fg)">결정의 위치</text>
      <text x="0" y="20" class="col-caption">Factory의 switch문 내부.</text>
      <text x="0" y="38" class="col-caption">종류가 늘면 Factory가 자란다.</text>
    </g>
  </g>

  <!-- ============ 컬럼 2: Factory Method ============ -->
  <g transform="translate(420 50)">
    <rect class="col-bg" width="360" height="490" rx="6"/>
    <text x="24" y="40" class="col-num">02</text>
    <text x="24" y="68" class="col-title">Factory Method</text>
    <text x="24" y="92" class="col-caption">서브클래스가 무엇을 만들지 결정</text>

    <!-- 다이어그램 -->
    <g transform="translate(0 130)">
      <!-- 추상 클래스 -->
      <rect x="100" y="0" width="160" height="60" rx="4" class="box-abs"/>
      <text x="180" y="26" class="node-label" text-anchor="middle" font-style="italic">Dispatcher</text>
      <text x="180" y="44" class="node-label-sm" text-anchor="middle" fill="var(--c-muted)" font-style="italic">createNotification()</text>

      <!-- 상속 -->
      <line x1="140" y1="120" x2="180" y2="60" class="line" marker-end="url(#tri)"/>
      <line x1="220" y1="120" x2="180" y2="60" class="line" marker-end="url(#tri)"/>

      <!-- 구체 클래스 -->
      <rect x="40" y="120" width="120" height="50" rx="4" class="box"/>
      <text x="100" y="142" class="node-label" text-anchor="middle">EmailDispatcher</text>
      <text x="100" y="158" class="node-label-sm" text-anchor="middle" fill="var(--c-muted)">→ Email</text>

      <rect x="200" y="120" width="120" height="50" rx="4" class="box"/>
      <text x="260" y="142" class="node-label" text-anchor="middle">SmsDispatcher</text>
      <text x="260" y="158" class="node-label-sm" text-anchor="middle" fill="var(--c-muted)">→ SMS</text>

      <!-- 점선 의존 -->
      <line x1="100" y1="170" x2="100" y2="210" class="line-dashed" marker-end="url(#arr)"/>
      <line x1="260" y1="170" x2="260" y2="210" class="line-dashed" marker-end="url(#arr)"/>

      <rect x="50" y="212" width="100" height="36" rx="4" class="box"/>
      <text x="100" y="234" class="node-label" text-anchor="middle">Email</text>

      <rect x="210" y="212" width="100" height="36" rx="4" class="box"/>
      <text x="260" y="234" class="node-label" text-anchor="middle">SMS</text>
    </g>

    <!-- 캡션 -->
    <g transform="translate(24 410)">
      <text x="0" y="0" class="col-caption" font-weight="700" fill="var(--c-fg)">결정의 위치</text>
      <text x="0" y="20" class="col-caption">각 서브클래스의 메서드 안.</text>
      <text x="0" y="38" class="col-caption">새 종류는 새 클래스로 추가한다.</text>
    </g>
  </g>

  <!-- ============ 컬럼 3: Abstract Factory ============ -->
  <g transform="translate(800 50)">
    <rect class="col-bg" width="360" height="490" rx="6"/>
    <text x="24" y="40" class="col-num">03</text>
    <text x="24" y="68" class="col-title">Abstract Factory</text>
    <text x="24" y="92" class="col-caption">객체 군(family) 전체를 묶음으로</text>

    <!-- 다이어그램 -->
    <g transform="translate(0 130)">
      <!-- 인터페이스 -->
      <rect x="100" y="0" width="160" height="60" rx="4" class="box-abs"/>
      <text x="180" y="26" class="node-label" text-anchor="middle" font-style="italic">UIFactory</text>
      <text x="180" y="44" class="node-label-sm" text-anchor="middle" fill="var(--c-muted)" font-style="italic">createButton/Input/Card</text>

      <!-- 두 구체 Factory -->
      <line x1="140" y1="100" x2="180" y2="60" class="line" marker-end="url(#tri)"/>
      <line x1="220" y1="100" x2="180" y2="60" class="line" marker-end="url(#tri)"/>

      <rect x="40" y="100" width="120" height="40" rx="4" class="box"/>
      <text x="100" y="125" class="node-label" text-anchor="middle">LightUIFactory</text>

      <rect x="200" y="100" width="120" height="40" rx="4" class="box"/>
      <text x="260" y="125" class="node-label" text-anchor="middle">DarkUIFactory</text>

      <!-- 객체 군 -->
      <line x1="100" y1="140" x2="100" y2="170" class="line-dashed"/>
      <line x1="260" y1="140" x2="260" y2="170" class="line-dashed"/>

      <!-- Light 군 -->
      <rect x="20" y="170" width="160" height="100" rx="4" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="100" y="190" class="node-label-sm" text-anchor="middle" fill="var(--c-accent)" font-weight="700">Light family</text>
      <text x="100" y="212" class="node-label-sm" text-anchor="middle">LightButton</text>
      <text x="100" y="232" class="node-label-sm" text-anchor="middle">LightInput</text>
      <text x="100" y="252" class="node-label-sm" text-anchor="middle">LightCard</text>

      <!-- Dark 군 -->
      <rect x="180" y="170" width="160" height="100" rx="4" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="260" y="190" class="node-label-sm" text-anchor="middle" fill="var(--c-accent)" font-weight="700">Dark family</text>
      <text x="260" y="212" class="node-label-sm" text-anchor="middle">DarkButton</text>
      <text x="260" y="232" class="node-label-sm" text-anchor="middle">DarkInput</text>
      <text x="260" y="252" class="node-label-sm" text-anchor="middle">DarkCard</text>
    </g>

    <!-- 캡션 -->
    <g transform="translate(24 430)">
      <text x="0" y="0" class="col-caption" font-weight="700" fill="var(--c-fg)">결정의 위치</text>
      <text x="0" y="20" class="col-caption">어떤 Factory를 고를지의 한 순간.</text>
      <text x="0" y="38" class="col-caption">군을 통째로 갈아 끼울 수 있다.</text>
    </g>
  </g>
</svg>
