<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="리더를 위한 1:1 가이드 ep.07 cover">
  <style>
  :root {
    --c-bg: #FBF1F3;
    --c-fg: #24141A;
    --c-muted: #7A6268;
    --c-accent: #8F1F3F; --c-accent-2: #B5791F; --c-accent-3: #2F6B74;
    --c-num: rgba(143, 31, 63, 0.14);
    --c-dot: rgba(143, 31, 63, 0.12);
    --c-line: rgba(36, 20, 26, 0.14);
  }
  @media (prefers-color-scheme: dark) {
