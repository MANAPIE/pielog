      --c-bg: #190D11;
      --c-fg: #EFE4E6;
      --c-muted: #A8929A;
      --c-accent: #FF8FA3; --c-accent-2: #E6B866; --c-accent-3: #7CC0C9;
      --c-num: rgba(255, 143, 163, 0.22);
      --c-dot: rgba(255, 143, 163, 0.12);
      --c-line: rgba(239, 228, 230, 0.16);
