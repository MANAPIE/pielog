    <circle cx="130" cy="130" r="9" fill="var(--c-accent-3)" opacity="1"/><circle cx="158" cy="146" r="6" fill="var(--c-accent-3)" opacity="0.7"/><circle cx="116" cy="160" r="5" fill="var(--c-accent-3)" opacity="0.5"/><circle cx="150" cy="172" r="4" fill="var(--c-accent-3)" opacity="0.4"/>
