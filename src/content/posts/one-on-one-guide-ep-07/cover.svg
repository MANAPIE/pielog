  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-oo07)"/>
  <rect width="1200" height="630" fill="url(#halo-oo07a)"/>
  <rect width="1200" height="630" fill="url(#halo-oo07b)"/>

