      fill: #fff;
      font-size: 9px;
      font-weight: 700
    }

    .desc-title {
      fill: #1f2937;
      font-size: 11px;
      font-weight: 700
    }

    .desc-body {
      fill: #4b5563;
      font-size: 10px
    }

    .section-title {
      fill: #1f2937;
      font-size: 12px;
      font-weight: 700
    }

    .divider {
      stroke: #f3f4f6;
      stroke-width: 1
    }

    .caption {
      fill: #6b7280;
      font-size: 10px;
      font-style: italic
    }

    @media(prefers-color-scheme:dark) {
      .panel {
        fill: #1a1a1a;
        stroke: #2a2a2a
      }

      .header {
        fill: #404040
      }

      .header-text {
        fill: #f5f5f5
      }

      .meta-bg {
        fill: #262626
      }

      .meta-text {
        fill: #a3a3a3
      }

      .meta-bold {
        fill: #e5e5e5
      }

      .card {
        fill: #171717;
        stroke: #404040
      }

      .placeholder {
        fill: #2a2a2a
      }

      .placeholder-text {
        fill: #737373
      }

      .input {
        fill: #171717;
        stroke: #404040
      }

      .btn {
        fill: #3b82f6
      }

      .num {
        fill: #f87171
      }

      .desc-title {
        fill: #f5f5f5
      }

      .desc-body {
        fill: #a3a3a3
      }

      .section-title {
        fill: #f5f5f5
      }

      .divider {
        stroke: #2a2a2a
      }

      .caption {
        fill: #737373
      }
