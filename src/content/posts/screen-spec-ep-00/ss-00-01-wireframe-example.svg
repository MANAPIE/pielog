  <rect x="20" y="20" width="760" height="480" class="panel" rx="6" />
  <rect x="20" y="20" width="760" height="40" class="header" rx="6 6 0 0" />
  <text x="40" y="44" class="header-text">화면 ID: LGN-001</text>
  <text x="220" y="44" class="header-text">화면명: 로그인</text>
  <text x="390" y="44" class="header-text">버전: v1.2</text>
  <text x="530" y="44" class="header-text">작성: 홍기획</text>
  <text x="700" y="44" class="header-text">2026.05.08</text>
  <rect x="20" y="60" width="760" height="28" class="meta-bg" />
  <text x="40" y="78" class="meta-bold">진입 경로:</text>
  <text x="105" y="78" class="meta-text">(1) 앱 최초 실행 · (2) 로그아웃 후 · (3) 인증 필요 화면 접근 · (4) 세션 만료 시</text>

  <text x="40" y="110" class="section-title">화면 레이아웃</text>
