<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg"
  font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <style>
    .panel {
      fill: #fafafa;
      stroke: #e5e7eb;
      stroke-width: 1
    }

    .header {
      fill: #1f2937
    }

    .header-text {
      fill: #fff;
      font-size: 11px;
      font-weight: 600
    }

    .meta-bg {
      fill: #f3f4f6
    }

    .meta-text {
      fill: #4b5563;
      font-size: 10px
    }

    .meta-bold {
      fill: #1f2937;
      font-size: 10px;
      font-weight: 600
    }

    .card {
      fill: #fff;
      stroke: #d1d5db;
      stroke-width: 1
    }

    .placeholder {
      fill: #e5e7eb
    }

    .placeholder-text {
      fill: #9ca3af;
      font-size: 10px
    }

    .input {
      fill: #fff;
      stroke: #d1d5db;
      stroke-width: 1
    }

    .btn {
      fill: #3b82f6
    }

    .btn-text {
      fill: #fff;
