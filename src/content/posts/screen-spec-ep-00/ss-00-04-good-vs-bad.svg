<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <style>
    .title{fill:#111827;font-size:15px;font-weight:700}
    .panel{stroke-width:2}
    .bad{fill:#fef2f2;stroke:#ef4444}.good{fill:#f0fdf4;stroke:#10b981}
    .label-bad{fill:#991b1b;font-size:14px;font-weight:700}
    .label-good{fill:#065f46;font-size:14px;font-weight:700}
    .header{fill:#1f2937}.header-text{fill:#fff;font-size:10px;font-weight:600}
    .card{fill:#fff;stroke:#d1d5db;stroke-width:1}
    .placeholder{fill:#e5e7eb}
    .ph-text{fill:#9ca3af;font-size:9px}
    .num{fill:#3b82f6}.num-text{fill:#fff;font-size:8px;font-weight:700;text-anchor:middle}
    .desc{fill:#1f2937;font-size:10px}
    .desc-bold{fill:#1f2937;font-size:10px;font-weight:700}
    .desc-faint{fill:#9ca3af;font-size:10px;font-style:italic}
    .check{fill:#10b981;font-size:11px;font-weight:700}
    .x{fill:#ef4444;font-size:11px;font-weight:700}
    @media(prefers-color-scheme:dark){
      .title{fill:#f5f5f5}
      .bad{fill:#1f0a0a;stroke:#ef4444}.good{fill:#0a1f12;stroke:#10b981}
      .label-bad{fill:#fca5a5}.label-good{fill:#6ee7b7}
      .header{fill:#404040}.card{fill:#171717;stroke:#404040}
      .placeholder{fill:#2a2a2a}.ph-text{fill:#737373}
      .desc{fill:#e5e5e5}.desc-bold{fill:#f5f5f5}
      .desc-faint{fill:#737373}
    }
  </style>
  <text x="400" y="32" text-anchor="middle" class="title">Bad vs Good: 검색 결과 화면 디스크립션</text>

  <!-- BAD panel (left) -->
  <rect x="20" y="55" width="380" height="525" class="panel bad" rx="8"/>
  <text x="40" y="85" class="label-bad">✕ Bad: 빠진 게 많은 설계서</text>

  <rect x="40" y="100" width="340" height="20" class="header" rx="3"/>
  <text x="50" y="114" class="header-text">SRC-001 · 검색 결과</text>
  <rect x="40" y="125" width="340" height="180" class="card" rx="3"/>
  <rect x="60" y="145" width="80" height="60" class="placeholder" rx="2"/>
  <rect x="150" y="145" width="200" height="14" class="placeholder" rx="2"/>
  <rect x="150" y="166" width="120" height="10" class="placeholder" rx="2"/>
  <rect x="60" y="220" width="80" height="60" class="placeholder" rx="2"/>
  <rect x="150" y="220" width="180" height="14" class="placeholder" rx="2"/>
  <rect x="150" y="241" width="100" height="10" class="placeholder" rx="2"/>

  <text x="40" y="335" class="desc-bold">[Description]</text>
  <text x="40" y="358" class="desc">- 검색 결과를 리스트로 노출한다</text>
  <text x="40" y="378" class="desc">- 아이템 탭 시 상세 화면으로 이동</text>
  <text x="40" y="398" class="desc">- 상단에 검색어 표시</text>
  <text x="40" y="430" class="desc-faint">(빈 상태? 정렬? 페이징? 로딩? 에러?)</text>

  <text x="40" y="475" class="x">✕ Empty State 미정의</text>
  <text x="40" y="495" class="x">✕ 정렬 기준 미정의</text>
  <text x="40" y="515" class="x">✕ 페이징 방식 미정의</text>
  <text x="40" y="535" class="x">✕ Loading / Error 미정의</text>
  <text x="40" y="555" class="x">✕ 검색어 하이라이트 미정의</text>

  <!-- GOOD panel (right) -->
  <rect x="400" y="55" width="380" height="525" class="panel good" rx="8"/>
  <text x="420" y="85" class="label-good">✓ Good: 빈틈없는 설계서</text>

  <rect x="420" y="100" width="340" height="20" class="header" rx="3"/>
  <text x="430" y="114" class="header-text">SRC-001 · 검색 결과</text>
  <rect x="420" y="125" width="340" height="180" class="card" rx="3"/>
  <rect x="440" y="145" width="80" height="60" class="placeholder" rx="2"/>
  <rect x="530" y="145" width="200" height="14" class="placeholder" rx="2"/>
  <rect x="530" y="166" width="120" height="10" class="placeholder" rx="2"/>
  <circle cx="440" cy="135" r="7" class="num"/><text x="440" y="138" class="num-text">1</text>
  <circle cx="440" cy="216" r="7" class="num"/><text x="440" y="219" class="num-text">2</text>
  <circle cx="730" cy="298" r="7" class="num"/><text x="730" y="301" class="num-text">3</text>
  <rect x="440" y="220" width="80" height="60" class="placeholder" rx="2"/>
  <rect x="530" y="220" width="180" height="14" class="placeholder" rx="2"/>
  <rect x="530" y="241" width="100" height="10" class="placeholder" rx="2"/>

  <text x="420" y="335" class="desc-bold">[Description]</text>
  <text x="420" y="358" class="desc">① 결과 리스트: 무한스크롤 20건 단위, 마지막 3개 전 추가 로딩</text>
  <text x="420" y="378" class="desc">② 정렬: 기본 정확도순 / 옵션: 최신·인기·가격</text>
  <text x="420" y="398" class="desc">③ 검색어 일치 텍스트 볼드 처리</text>

  <text x="420" y="430" class="desc-bold">[State]</text>
  <text x="420" y="450" class="desc">- Loading: 스켈레톤 3개</text>
  <text x="420" y="466" class="desc">- Empty: "검색 결과가 없습니다" + 검색어 변경 안내</text>
  <text x="420" y="482" class="desc">- Error: "다시 시도" 버튼</text>

  <text x="420" y="515" class="check">✓ 모든 상태 정의</text>
  <text x="420" y="535" class="check">✓ 정렬·페이징·하이라이트 명시</text>
  <text x="420" y="555" class="check">✓ 개발자 추가 질문 없음</text>
</svg>
