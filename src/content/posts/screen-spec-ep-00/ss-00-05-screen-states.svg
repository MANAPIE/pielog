<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg"
  font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <style>
    .title {
      fill: #111827;
      font-size: 15px;
      font-weight: 700
    }

    .phone {
      fill: #fafafa;
      stroke: #d1d5db;
      stroke-width: 1.5
    }

    .statusbar {
      fill: #d1d5db
    }

    .item {
      fill: #cbd5e1
    }

    .skel {
      fill: #dfe4f0
    }

    .err {
      fill: #fee2e2;
      stroke: #ef4444;
      stroke-width: 1.5
    }

    .ok {
      fill: #d1fae5;
      stroke: #10b981;
      stroke-width: 1.5
    }

    .lock {
      fill: #f3f4f6;
      stroke: #9ca3af;
      stroke-width: 1.5
    }

    .label {
      fill: #1f2937;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle
    }

    .sub {
      fill: #6b7280;
      font-size: 10px;
      text-anchor: middle
    }

    .badge {
      fill: #3b82f6
    }

    .badge-text {
      fill: #fff;
      font-size: 9px;
      font-weight: 600;
      text-anchor: middle
    }

    .err-text {
      fill: #991b1b;
      font-size: 9px;
      text-anchor: middle
    }

    .err-icon {
      fill: #ef4444;
      font-size: 22px;
      text-anchor: middle
    }

    .ok-text {
      fill: #065f46;
      font-size: 9px;
      text-anchor: middle
    }

    .ok-icon {
      fill: #10b981;
      font-size: 22px;
      text-anchor: middle;
      font-weight: 700
    }

    .empty-text {
      fill: #6b7280;
      font-size: 9px;
      text-anchor: middle
    }

    .lock-text {
      fill: #374151;
      font-size: 9px;
      text-anchor: middle
    }

    .lock-icon {
      fill: #6b7280;
      font-size: 22px;
      text-anchor: middle
    }

    @media(prefers-color-scheme:dark) {
      .title {
        fill: #f5f5f5
      }

      .phone {
        fill: #1a1a1a;
        stroke: #404040
      }

      .statusbar {
        fill: #404040
      }

      .item {
        fill: #525252
      }

      .skel {
        fill: #202023
      }

      .err {
        fill: #450a0a;
        stroke: #ef4444
      }

      .ok {
        fill: #064e3b;
        stroke: #10b981
      }

      .lock {
        fill: #262626;
        stroke: #525252
      }

      .label {
        fill: #f5f5f5
      }

      .sub {
        fill: #a3a3a3
      }

      .err-text {
        fill: #fca5a5
      }

      .ok-text {
        fill: #6ee7b7
      }

      .empty-text {
        fill: #a3a3a3
      }

      .lock-text {
        fill: #d4d4d4
      }

      .lock-icon {
        fill: #a3a3a3
      }
    }
  </style>
  <defs>
    <clipPath id="phone-clip-180">
      <rect width="120" height="180" rx="12" />
    </clipPath>
    <clipPath id="phone-clip-140">
      <rect width="120" height="140" rx="12" />
    </clipPath>
  </defs>
  <text x="400" y="32" text-anchor="middle" class="title">화면의 6가지 기본 상태</text>

  <g transform="translate(0,-6)">
    <!-- Row 1 -->
    <!-- Default (col 1) -->
    <g transform="translate(140,60)">
      <rect width="120" height="180" class="phone" rx="12" />
      <g clip-path="url(#phone-clip-180)">
        <rect width="120" height="16" class="statusbar" />
      </g>
      <g transform="translate(0,-5)">
        <rect x="12" y="32" width="96" height="22" class="item" rx="3" />
        <rect x="12" y="62" width="96" height="22" class="item" rx="3" />
        <rect x="12" y="92" width="96" height="22" class="item" rx="3" />
        <rect x="12" y="122" width="96" height="22" class="item" rx="3" />
        <rect x="12" y="152" width="96" height="22" class="item" rx="3" />
      </g>
    </g>
    <text x="200" y="262" class="label">Default</text>
    <text x="200" y="280" class="sub">정상 데이터 표시</text>

    <!-- Loading (col 2) -->
    <g transform="translate(340,60)">
      <rect width="120" height="180" class="phone" rx="12" />
      <g clip-path="url(#phone-clip-180)">
        <rect width="120" height="16" class="statusbar" />
      </g>
      <g transform="translate(0,-5)">
        <rect x="12" y="32" width="96" height="22" class="skel" rx="3" />
        <rect x="12" y="62" width="70" height="22" class="skel" rx="3" />
        <rect x="12" y="92" width="86" height="22" class="skel" rx="3" />
        <rect x="12" y="122" width="55" height="22" class="skel" rx="3" />
        <rect x="12" y="152" width="80" height="22" class="skel" rx="3" />
      </g>
    </g>
    <text x="400" y="262" class="label">Loading</text>
    <text x="400" y="280" class="sub">스켈레톤 / 스피너</text>

    <!-- Empty (col 3) -->
    <g transform="translate(540,60)">
      <rect width="120" height="180" class="phone" rx="12" />
      <g clip-path="url(#phone-clip-180)">
        <rect width="120" height="16" class="statusbar" />
      </g>
      <circle cx="60" cy="80" r="22" class="item" />
      <text x="60" y="86" text-anchor="middle" style="font-size:18px;fill:#9ca3af">📭</text>
      <text x="60" y="120" class="empty-text">아직 데이터가</text>
      <text x="60" y="134" class="empty-text">없습니다</text>
      <rect x="30" y="148" width="60" height="20" class="badge" rx="3" />
      <text x="60" y="162" class="badge-text">시작하기</text>
    </g>
    <text x="600" y="262" class="label">Empty</text>
    <text x="600" y="280" class="sub">데이터 0건</text>

    <!-- Row 2 -->
    <!-- Error (col 1) -->
    <g transform="translate(140,300)">
      <rect width="120" height="140" class="phone err" rx="12" />
      <g clip-path="url(#phone-clip-140)">
        <rect width="120" height="16" class="statusbar" />
      </g>
      <text x="60" y="60" class="err-icon">⚠</text>
      <text x="60" y="80" class="err-text">연결에 실패했습니다</text>
      <text x="60" y="94" class="err-text">다시 시도해주세요</text>
      <rect x="30" y="108" width="60" height="20" class="badge" rx="3" />
      <text x="60" y="122" class="badge-text">재시도</text>
    </g>
    <text x="200" y="462" class="label">Error</text>
    <text x="200" y="480" class="sub">오류</text>

    <!-- Success (col 2) -->
    <g transform="translate(340,300)">
      <rect width="120" height="140" class="phone ok" rx="12" />
      <g clip-path="url(#phone-clip-140)">
        <rect width="120" height="16" class="statusbar" />
      </g>
      <circle cx="60" cy="58" r="18" class="ok" />
      <text x="60" y="65" class="ok-icon">✓</text>
      <text x="60" y="92" class="ok-text">완료되었습니다</text>
      <rect x="30" y="108" width="60" height="20" class="badge" rx="3" />
      <text x="60" y="122" class="badge-text">확인</text>
    </g>
    <text x="400" y="462" class="label">Success</text>
    <text x="400" y="480" class="sub">완료</text>

    <!-- No Permission (col 3) -->
    <g transform="translate(540,300)">
      <rect width="120" height="140" class="phone lock" rx="12" />
      <g clip-path="url(#phone-clip-140)">
        <rect width="120" height="16" class="statusbar" />
      </g>
      <text x="60" y="62" class="lock-icon">🔒</text>
      <text x="60" y="86" class="lock-text">접근 권한이</text>
      <text x="60" y="100" class="lock-text">없습니다</text>
      <rect x="30" y="108" width="60" height="20" class="badge" rx="3" />
      <text x="60" y="122" class="badge-text">로그인</text>
    </g>
    <text x="600" y="462" class="label">No Permission</text>
    <text x="600" y="480" class="sub">권한 없음</text>
  </g>
</svg>