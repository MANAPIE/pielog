<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg"
  font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <style>
    .box {
      fill: #f3f4f6;
      stroke: #d1d5db;
      stroke-width: 1
    }

    .box-active {
      fill: #3b82f6;
      stroke: #2563eb;
      stroke-width: 2
    }

    .box-after {
      fill: #fef3c7;
      stroke: #fbbf24;
      stroke-width: 1
    }

    .label {
      fill: #1f2937;
      font-size: 13px;
      font-weight: 600
    }

    .label-active {
      fill: #fff;
      font-size: 14px;
      font-weight: 700
    }

    .label-after {
      fill: #92400e;
      font-size: 13px;
      font-weight: 600
    }

    .sub {
      fill: #6b7280;
      font-size: 10px
    }

    .sub-active {
      fill: #dbeafe;
      font-size: 10px
    }

    .sub-after {
      fill: #92400e;
      font-size: 10px
    }

    .arrow {
      stroke: #9ca3af;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arr)
    }

    .title {
      fill: #111827;
      font-size: 15px;
      font-weight: 700
    }

    .caption {
      fill: #6b7280;
      font-size: 11px;
      font-style: italic
    }

    @media(prefers-color-scheme:dark) {
      .box {
        fill: #262626;
        stroke: #404040
      }

      .box-active {
        fill: #3b82f6;
        stroke: #60a5fa
      }

      .box-after {
        fill: #451a03;
        stroke: #f59e0b
      }

      .label {
        fill: #f5f5f5
      }

      .label-after {
        fill: #fcd34d
      }

      .sub {
        fill: #a3a3a3
      }

      .sub-after {
        fill: #fcd34d
      }

      .arrow {
        stroke: #737373
      }

      .title {
        fill: #f5f5f5
      }

      .caption {
        fill: #737373
      }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>
  <text x="400" y="35" text-anchor="middle" class="title">기획 프로세스에서의 위치</text>
  <!-- 5 stages horizontally -->
  <g>
    <rect x="40" y="100" width="120" height="80" class="box" rx="6" />
    <text x="100" y="135" text-anchor="middle" class="label">요구사항 정의</text>
    <text x="100" y="155" text-anchor="middle" class="sub">RFP / 인터뷰</text>
  </g>
  <g>
    <rect x="180" y="100" width="120" height="80" class="box" rx="6" />
    <text x="240" y="135" text-anchor="middle" class="label">기능 정의</text>
    <text x="240" y="155" text-anchor="middle" class="sub">Feature List</text>
  </g>
  <g>
    <rect x="320" y="100" width="120" height="80" class="box" rx="6" />
    <text x="380" y="135" text-anchor="middle" class="label">정보구조 (IA)</text>
    <text x="380" y="155" text-anchor="middle" class="sub">Site Map</text>
  </g>
  <g>
    <rect x="460" y="92" width="140" height="96" class="box-active" rx="6" />
    <text x="530" y="125" text-anchor="middle" class="label-active">화면설계서</text>
    <text x="530" y="145" text-anchor="middle" class="sub-active">Wireframe + Description</text>
    <text x="530" y="165" text-anchor="middle" class="sub-active">★ 이 시리즈의 주제</text>
  </g>
  <g>
    <rect x="620" y="100" width="140" height="80" class="box-after" rx="6" />
    <text x="690" y="128" text-anchor="middle" class="label-after">디자인 / 개발 / QA</text>
    <text x="690" y="150" text-anchor="middle" class="sub-after">UI Design</text>
    <text x="690" y="163" text-anchor="middle" class="sub-after">Implementation / Test</text>
  </g>
  <line x1="160" y1="140" x2="178" y2="140" class="arrow" />
  <line x1="300" y1="140" x2="318" y2="140" class="arrow" />
  <line x1="440" y1="140" x2="458" y2="140" class="arrow" />
  <line x1="600" y1="140" x2="618" y2="140" class="arrow" />
  <text x="400" y="240" text-anchor="middle" class="caption">화면설계서는 IA 다음 단계에서 작성되며, 디자인·개발·QA의 출발점이 됩니다.</text>
  <text x="400" y="280" text-anchor="middle" class="sub">앞 단계가 충실할수록 화면설계 작성이 수월해집니다.</text>
</svg>