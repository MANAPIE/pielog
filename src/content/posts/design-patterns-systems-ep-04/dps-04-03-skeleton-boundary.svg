<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-skel">
  <title id="t-skel">확정 영역과 지연 영역: 스켈레톤 경계의 설계</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4A5FD9;
        --c-accent-2: #D97757;
        --c-accent-4: #3D8B7A;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft-2: rgba(217, 119, 87, 0.10);
        --c-soft-4: rgba(61, 139, 122, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
        --c-skel: rgba(107, 114, 128, 0.22);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #8DA0FF;
          --c-accent-2: #E89376;
          --c-accent-4: #6FBFA8;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft-2: rgba(232, 147, 118, 0.14);
          --c-soft-4: rgba(111, 191, 168, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
          --c-skel: rgba(139, 146, 160, 0.28);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .screen {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.6;
      }

      .fixed {
        fill: var(--c-soft-4);
        stroke: var(--c-accent-4);
        stroke-width: 1.6;
      }

      .defer {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 1.6;
        stroke-dasharray: 5 4;
      }

      .skel {
        fill: var(--c-skel);
      }

      .lbl {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }

      .ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .cap {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        fill: var(--c-muted);
      }

      .code {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 11px;
        fill: var(--c-fg);
      }

      .code-mute {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 11px;
        fill: var(--c-muted);
      }

      .warn {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        fill: var(--c-accent-2);
      }
    </style>
    <marker id="a-sk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-2)" />
    </marker>
  </defs>

  <rect class="bg" width="800" height="560" />

  <text x="24" y="28" class="lbl" fill="var(--c-accent-4)">확정 영역</text>
  <text x="24" y="46" class="cap">첫 HTML에 포함 · 서버에서 완성</text>
  <text x="420" y="28" class="lbl" fill="var(--c-accent-2)">지연 영역</text>
  <text x="420" y="46" class="cap">스켈레톤을 두고 나중에 채움</text>

  <!-- 화면 목업 -->
  <g transform="translate(24 62)">
    <rect width="360" height="330" rx="8" class="screen" />

    <!-- 헤더 (확정) -->
    <g transform="translate(12 12)">
      <rect width="336" height="34" rx="4" class="fixed" />
      <text x="12" y="22" class="cap" fill="var(--c-fg)" font-weight="700">헤더 · 네비게이션</text>
    </g>

    <!-- 이미지 + 정보 (확정) -->
    <g transform="translate(12 56)">
      <rect width="140" height="110" rx="4" class="fixed" />
      <text x="70" y="60" class="cap" text-anchor="middle" fill="var(--c-fg)">상품 이미지</text>
    </g>
    <g transform="translate(160 56)">
      <rect width="188" height="110" rx="4" class="fixed" />
      <text x="12" y="24" class="cap" fill="var(--c-fg)" font-weight="700">상품 이름</text>
      <text x="12" y="46" class="cap" fill="var(--c-fg)">₩45,000</text>
      <text x="12" y="70" class="cap">브랜드 · 카테고리</text>
    </g>

    <!-- 재고 (지연) -->
    <g transform="translate(12 176)">
      <rect width="336" height="34" rx="4" class="defer" />
      <rect x="12" y="11" width="90" height="12" rx="6" class="skel" />
      <text x="200" y="22" class="cap">재고 수량: 스켈레톤</text>
    </g>

    <!-- 리뷰 (지연) -->
    <g transform="translate(12 220)">
      <rect width="336" height="46" rx="4" class="defer" />
      <rect x="12" y="12" width="240" height="10" rx="5" class="skel" />
      <rect x="12" y="28" width="180" height="10" rx="5" class="skel" />
      <text x="270" y="28" class="cap">리뷰 요약</text>
    </g>

    <!-- 추천 (지연) -->
    <g transform="translate(12 276)">
      <rect width="336" height="42" rx="4" class="defer" />
      <rect x="12" y="10" width="60" height="22" rx="4" class="skel" />
      <rect x="80" y="10" width="60" height="22" rx="4" class="skel" />
      <rect x="148" y="10" width="60" height="22" rx="4" class="skel" />
      <text x="240" y="26" class="cap">개인화 추천</text>
    </g>
  </g>

  <!-- 우측: Suspense 코드 대응 -->
  <g transform="translate(408 62)">
    <rect width="368" height="330" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
    <text x="16" y="26" class="ttl">Suspense 경계 = 스켈레톤 경계</text>

    <g transform="translate(16 44)">
      <text x="0" y="14" class="code-mute">&lt;ProductHeader /&gt;</text>
      <text x="0" y="30" class="cap">즉시 렌더 · 첫 HTML에 포함</text>

      <text x="0" y="62" class="code">&lt;Suspense fallback={&lt;ReviewSkeleton /&gt;}&gt;</text>
      <text x="0" y="78" class="code-mute"> &lt;ReviewSummary /&gt;</text>
      <text x="0" y="94" class="code">&lt;/Suspense&gt;</text>

      <text x="0" y="126" class="code">&lt;Suspense fallback={&lt;RecommendSkeleton /&gt;}&gt;</text>
      <text x="0" y="142" class="code-mute"> &lt;Recommendations /&gt;</text>
      <text x="0" y="158" class="code">&lt;/Suspense&gt;</text>
    </g>

    <line x1="16" y1="232" x2="352" y2="232" stroke="var(--c-divider)" stroke-width="1" />

    <g transform="translate(16 262)">
      <text x="0" y="0" class="ttl" font-size="12.5">이 경계는 개발자가 임의로 정하지 않습니다</text>
      <text x="0" y="22" class="cap">무엇을 첫 화면에 확정해 보여줄지는</text>
      <text x="0" y="40" class="cap">화면 설계에서 나와야 하는 선입니다</text>
    </g>
  </g>

  <!-- 하단: 레이아웃 시프트 -->
  <g transform="translate(24 410)">
    <rect width="752" height="118" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.2"
      stroke-dasharray="4 3" />
    <text x="20" y="28" class="warn">스켈레톤은 실제 콘텐츠와 같은 크기여야 합니다</text>

    <g transform="translate(20 42)">
      <rect width="150" height="60" rx="4" fill="var(--c-card)" stroke="var(--c-line)" stroke-width="1.2" />
      <rect x="12" y="12" width="110" height="10" rx="5" class="skel" />
      <text x="12" y="42" class="cap">스켈레톤 1줄</text>
    </g>
    <line x1="180" y1="72" x2="220" y2="72" stroke="var(--c-accent-2)" stroke-width="2" marker-end="url(#a-sk)" />
    <g transform="translate(228 42)">
      <rect width="150" height="60" rx="4" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.4" />
      <text x="12" y="22" class="cap" fill="var(--c-fg)">실제 3줄 도착</text>
      <text x="12" y="42" class="warn" font-size="11">아래가 밀림</text>
    </g>

    <g transform="translate(410 40)">
      <text x="0" y="16" class="ttl" font-size="12.5">디자인 결정이 데이터 계약이 되는 자리</text>
      <text x="0" y="38" class="cap">"리뷰 요약은 최대 두 줄"이라는 디자인 결정이</text>
      <text x="0" y="56" class="cap">API 응답의 제약이 됩니다</text>
    </g>
  </g>
</svg>