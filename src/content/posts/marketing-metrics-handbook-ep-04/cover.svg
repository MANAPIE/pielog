<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">ep.04 — 활성화와 온보딩</title>
  <style>
    :root {
      --c-bg: #fafaf7;
      --c-fg: #1a1a1a;
      --c-muted: #6b6b6b;
      --c-accent: #c97f4a;
      --c-accent-2: #2d4a3e;
      --c-accent-3: #d9a47e;
      --c-num: #c97f4a;
      --c-dot: #1a1a1a;
      --c-line: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e;
        --c-fg: #ededea;
        --c-muted: #999996;
        --c-accent: #e09a6a;
        --c-accent-2: #7fb09a;
        --c-accent-3: #d4a560;
        --c-num: #e09a6a;
        --c-dot: #ededea;
        --c-line: #4a4a47;
      }
    }
  </style>
  <defs>
    <pattern id="dotgrid04" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="var(--c-dot)" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="rg04a" cx="22%" cy="22%" r="60%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg04b" cx="82%" cy="82%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="var(--c-bg)"/>
  <rect width="1200" height="630" fill="url(#dotgrid04)"/>
  <rect width="1200" height="630" fill="url(#rg04a)"/>
  <rect width="1200" height="630" fill="url(#rg04b)"/>

  <!-- 화면 밖 큰 도형 -->
  <rect x="-150" y="450" width="320" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(10 10 610)"/>
  <circle cx="1250" cy="-50" r="280" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 메타포 전체를 중심 기준으로 확대 -->
  <g transform="translate(600, 315) scale(1.12) translate(-600, -315)">
  <!-- 메인 메타포: 체크리스트 카드 (활성화 단계) -->
  <g transform="translate(220, 130)">
    <!-- 큰 카드 외곽 -->
    <rect x="0" y="0" width="500" height="340" fill="var(--c-bg)" stroke="var(--c-fg)" stroke-width="2" rx="2"/>

    <!-- 5개의 체크 항목 -->
    <!-- 항목 1: 체크됨 -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="28" height="28" fill="var(--c-accent-2)" stroke="var(--c-accent-2)" stroke-width="2" rx="2"/>
      <path d="M 6 14 L 12 20 L 22 8" fill="none" stroke="var(--c-bg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="8" width="280" height="12" fill="var(--c-accent-2)" fill-opacity="0.3"/>
    </g>

    <!-- 항목 2: 체크됨 -->
    <g transform="translate(40, 105)">
      <rect x="0" y="0" width="28" height="28" fill="var(--c-accent-2)" stroke="var(--c-accent-2)" stroke-width="2" rx="2"/>
      <path d="M 6 14 L 12 20 L 22 8" fill="none" stroke="var(--c-bg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="8" width="320" height="12" fill="var(--c-accent-2)" fill-opacity="0.3"/>
    </g>

    <!-- 항목 3: 체크됨 + 강조 (Aha moment) -->
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="28" height="28" fill="var(--c-accent)" stroke="var(--c-accent)" stroke-width="2" rx="2"/>
      <path d="M 6 14 L 12 20 L 22 8" fill="none" stroke="var(--c-bg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="8" width="260" height="12" fill="var(--c-accent)" fill-opacity="0.5"/>
      <!-- 포커스 링 (Aha moment 강조) -->
      <circle cx="14" cy="14" r="26" fill="none" stroke="var(--c-accent)" stroke-width="1.5" stroke-dasharray="3 2"/>
    </g>

    <!-- 항목 4: 미체크 -->
    <g transform="translate(40, 215)">
      <rect x="0" y="0" width="28" height="28" fill="none" stroke="var(--c-fg)" stroke-width="2" rx="2"/>
      <rect x="48" y="8" width="240" height="12" fill="var(--c-fg)" fill-opacity="0.15"/>
    </g>

    <!-- 항목 5: 미체크 -->
    <g transform="translate(40, 270)">
      <rect x="0" y="0" width="28" height="28" fill="none" stroke="var(--c-fg)" stroke-width="2" rx="2"/>
      <rect x="48" y="8" width="200" height="12" fill="var(--c-fg)" fill-opacity="0.15"/>
    </g>
  </g>

  <!-- 우측에 활성화 곡선 (작은 차트) -->
  <g transform="translate(780, 180)">
    <!-- 배경 카드 -->
    <rect x="0" y="0" width="300" height="240" fill="var(--c-bg)" stroke="var(--c-fg)" stroke-width="1.5" rx="2"/>

    <!-- X축 라인 -->
    <line x1="20" y1="200" x2="280" y2="200" stroke="var(--c-fg)" stroke-width="1" stroke-opacity="0.4"/>

    <!-- 활성화 곡선 (가파르게 상승 후 평탄) -->
    <path d="M 20 180 Q 60 160 80 130 Q 100 100 140 70 Q 180 50 280 40"
      fill="none" stroke="var(--c-accent)" stroke-width="3"/>

    <!-- 곡선 위 도트 -->
    <circle cx="80" cy="130" r="5" fill="var(--c-accent-2)"/>
    <circle cx="140" cy="70" r="6" fill="var(--c-accent)"/>
    <circle cx="200" cy="50" r="5" fill="var(--c-accent-2)"/>

    <!-- Aha moment 마커 (포커스 링) -->
    <circle cx="140" cy="70" r="22" fill="none" stroke="var(--c-accent)" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- 미니 바 묶음 (좌측 하단) -->
    <g transform="translate(28, 158)" fill="var(--c-accent-3)">
      <rect x="0" y="14" width="6" height="20"/>
      <rect x="10" y="8" width="6" height="26"/>
      <rect x="20" y="2" width="6" height="32"/>
    </g>
  </g>

  <!-- 도트 무리 (장식) -->
  <g transform="translate(160, 480)" fill="var(--c-accent-2)">
    <circle cx="0" cy="0" r="4"/>
    <circle cx="14" cy="-6" r="4"/>
    <circle cx="8" cy="10" r="4"/>
    <circle cx="-10" cy="8" r="4"/>
  </g>

  <!-- 회전된 사각형 (장식) -->
  <rect x="800" y="100" width="22" height="22" fill="none" stroke="var(--c-accent)" stroke-width="1.5" transform="rotate(15 811 111)"/>
  <rect x="180" y="100" width="20" height="20" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" transform="rotate(-10 190 110)"/>

  </g>

  <!-- 우하단 시리즈 번호 -->
  <text x="1144" y="600" text-anchor="end"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="220" font-weight="700"
    fill="var(--c-num)" fill-opacity="0.18"
    letter-spacing="-0.04em">04</text>
</svg>
