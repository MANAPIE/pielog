<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 712" role="img" aria-labelledby="title desc">
  <title id="title">가입에서 활성화까지의 깔때기</title>
  <desc id="desc">광고 클릭부터 D7 활성화까지 6단계 통과율과 누수 지점.</desc>
  <style>
    :root {
      --c-bg: #fafaf7; --c-fg: #1a1a1a; --c-muted: #6b6b6b; --c-faint: #b3b3b0;
      --c-card: #ffffff; --c-card-stroke: #d4d4d0;
      --c-stage: #2d4a3e; --c-drop: #c97f4a;
      --c-active: #c97f4a; --c-active-bg: #f8efe6;
      --c-grid: #ede9df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e; --c-fg: #ededea; --c-muted: #999996; --c-faint: #4a4a47;
        --c-card: #1a1a18; --c-card-stroke: #3a3a37;
        --c-stage: #7fb09a; --c-drop: #e09a6a;
        --c-active: #e09a6a; --c-active-bg: #2a1f15;
        --c-grid: #2a2823;
      }
    }
    .bg { fill: var(--c-bg); }
    .title { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: var(--c-fg); }
    .sub { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: var(--c-muted); }
    .stage-name { font: 600 12px ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; fill: var(--c-fg); }
    .stage-num { font: 700 14px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-fg); }
    .cvr { font: 600 11px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-stage); }
    .drop { font: 600 11px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-drop); }
    .note { font: 400 10px ui-sans-serif, system-ui, sans-serif; fill: var(--c-muted); }
    .anno-bold { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: var(--c-active); }
  </style>
  <rect class="bg" width="600" height="712"/>

  <text class="title" x="40" y="36">광고 클릭에서 D7 활성화까지</text>
  <text class="sub" x="40" y="54">센티 시나리오: 광고 클릭 10,000명에서 시작</text>

  <!-- 깔때기 단계들: 단계 라벨 위, 점점 좁아지는 막대 아래, drop 주석 사이 -->
  <g transform="translate(40, 84)">
    <!-- Stage 1: 광고 클릭 -->
    <text class="stage-name" x="0" y="12">① 광고 클릭</text>
    <rect fill="var(--c-stage)" x="0" y="20" width="520" height="34" rx="2"/>
    <text class="stage-num" x="14" y="42" style="fill: white;">10,000</text>

    <!-- drop annotation 1→2 -->
    <text class="drop" x="0" y="78">Drop 32% · 랜딩 Bounce</text>

    <!-- Stage 2: 랜딩 진입 -->
    <text class="stage-name" x="0" y="104">② 랜딩 진입 후 잔존</text>
    <rect fill="var(--c-stage)" x="0" y="112" width="354" height="34" rx="2"/>
    <text class="stage-num" x="14" y="134" style="fill: white;">6,800</text>
    <text class="cvr" x="370" y="134">68% 통과</text>

    <text class="drop" x="0" y="170">Drop 89% · 가입 시작 안 함</text>

    <!-- Stage 3: 가입 시작 -->
    <text class="stage-name" x="0" y="196">③ 가입 시작</text>
    <rect fill="var(--c-stage)" x="0" y="204" width="40" height="34" rx="2"/>
    <text class="stage-num" x="48" y="226" style="fill: var(--c-fg);">748</text>
    <text class="cvr" x="100" y="226">11% 통과</text>

    <text class="drop" x="0" y="262">Drop 9%</text>

    <!-- Stage 4: 가입 완료 -->
    <text class="stage-name" x="0" y="288">④ 가입 완료</text>
    <rect fill="var(--c-stage)" x="0" y="296" width="36" height="34" rx="2"/>
    <text class="stage-num" x="44" y="318">680</text>
    <text class="cvr" x="92" y="318">91% 통과</text>

    <text class="drop" x="0" y="354">Drop 22%</text>

    <!-- Stage 5: 계좌 연동 -->
    <text class="stage-name" x="0" y="380">⑤ 계좌 연동 완료</text>
    <rect fill="var(--c-stage)" x="0" y="388" width="28" height="34" rx="2"/>
    <text class="stage-num" x="36" y="410">530</text>
    <text class="cvr" x="84" y="410">78% 통과</text>

    <text class="drop" x="0" y="446">Drop 13%</text>

    <!-- Stage 6: 첫 분류 (활성화) -->
    <text class="stage-name" x="0" y="472">⑥ D7 첫 분류 = 활성화</text>
    <rect fill="var(--c-active)" x="0" y="480" width="24" height="34" rx="2"/>
    <text class="stage-num" x="32" y="502" style="fill: var(--c-active);">461</text>
    <text class="cvr" x="84" y="502">87% 통과</text>
  </g>

  <!-- 최종 박스 -->
  <g transform="translate(40, 632)">
    <text class="anno-bold" x="0" y="0">전체 통과율 4.6%: 광고 클릭 10,000명에서</text>
    <text class="anno-bold" x="0" y="20">활성화 461명. 가장 큰 누수는 ②→③ 가입</text>
    <text class="anno-bold" x="0" y="40">시작 단계 89%.</text>
  </g>
</svg>
