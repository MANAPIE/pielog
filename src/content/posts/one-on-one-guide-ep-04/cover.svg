  </g>
  <!-- 디테일 어휘 -->
  <g>
    <g transform="translate(760 330) rotate(-6)"><rect x="0" y="-60" width="30" height="60" rx="6" fill="var(--c-accent-3)" fill-opacity="0.16" stroke="var(--c-accent-3)" stroke-width="2"/><rect x="46" y="-96" width="30" height="96" rx="6" fill="var(--c-accent-3)" fill-opacity="0.16" stroke="var(--c-accent-3)" stroke-width="2"/><rect x="92" y="-78" width="30" height="78" rx="6" fill="var(--c-accent-2)" fill-opacity="0.16" stroke="var(--c-accent-2)" stroke-width="2"/><rect x="138" y="-132" width="30" height="132" rx="6" fill="var(--c-accent)" fill-opacity="0.16" stroke="var(--c-accent)" stroke-width="2"/><line x1="-14" y1="8" x2="186" y2="8" stroke="var(--c-line)" stroke-width="2" stroke-linecap="round"/></g>
    <circle cx="880" cy="130" r="52" fill="none" stroke="var(--c-accent-2)" stroke-width="2"/><circle cx="880" cy="130" r="32" fill="none" stroke="var(--c-accent-2)" stroke-width="2" opacity="0.6"/><circle cx="880" cy="130" r="12" fill="var(--c-accent-2)"/>
    <circle cx="700" cy="470" r="9" fill="var(--c-accent-3)" opacity="1"/><circle cx="728" cy="486" r="6" fill="var(--c-accent-3)" opacity="0.7"/><circle cx="686" cy="500" r="5" fill="var(--c-accent-3)" opacity="0.5"/><circle cx="720" cy="512" r="4" fill="var(--c-accent-3)" opacity="0.4"/>
