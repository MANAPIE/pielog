    <g transform="translate(244 364) rotate(-1 170 23)"><rect width="340" height="46" rx="12" fill="var(--c-bg)" fill-opacity="0.92"/><rect width="340" height="46" rx="12" fill="var(--c-accent-3)" fill-opacity="0.08" stroke="var(--c-accent-3)" stroke-width="2"/><rect x="20" y="19" width="142.8" height="8" rx="4" fill="var(--c-accent-3)" fill-opacity="0.8"/><rect x="178.8" y="19" width="68" height="8" rx="4" fill="var(--c-accent-3)" fill-opacity="0.45"/><circle cx="314" cy="23" r="6" fill="var(--c-accent-3)"/></g>
