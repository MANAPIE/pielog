<svg viewBox="0 0 500 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ef">
  <title id="t-ef">평가 근거가 쌓이는 흐름</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #8F1F3F;
        --c-accent-2: #2F6B74;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(143, 31, 63, 0.10);
        --c-soft-2: rgba(47, 107, 116, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #FF8FA3;
          --c-accent-2: #7CC0C9;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(255, 143, 163, 0.14);
          --c-soft-2: rgba(124, 192, 201, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .th { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
    </style>
    <marker id="a-ef" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
  </defs>

  <rect class="bg" width="500" height="272" />
  <text x="24" y="36" class="ttl">평가 근거가 쌓이는 흐름</text>
  <text x="24" y="62" class="th">평가 기간 동안 쌓이는 기록</text>

  <rect x="24" y="72" width="150" height="52" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="36" y="94" class="nm">리더의 장면 기록</text>
  <text x="36" y="112" class="cap">인정할 일과 고칠 일</text>

  <rect x="24" y="134" width="150" height="52" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="36" y="156" class="nm">1:1 문서</text>
  <text x="36" y="174" class="cap">매번 적은 안건과 약속</text>

  <rect x="24" y="196" width="150" height="52" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="36" y="218" class="nm">구성원의 자기 기록</text>
  <text x="36" y="236" class="cap">달마다 한 일과 다음 계획</text>

  <line x1="174" y1="98" x2="192" y2="98" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="174" y1="222" x2="192" y2="222" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="192" y1="98" x2="192" y2="222" stroke="var(--c-muted)" stroke-width="1.4" />
  <line x1="174" y1="160" x2="209" y2="160" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-ef)" />

  <rect x="210" y="134" width="110" height="52" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="265" y="164" class="nm" text-anchor="middle">중간 점검</text>
  <text x="265" y="206" class="cap" text-anchor="middle">기록을 같이 보고</text>
  <text x="265" y="222" class="cap" text-anchor="middle">지금 수준 알리기</text>

  <line x1="320" y1="160" x2="355" y2="160" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-ef)" />

  <rect x="356" y="134" width="120" height="52" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.4" />
  <text x="416" y="164" class="nm" text-anchor="middle">평가 면담</text>
  <text x="416" y="206" class="val" text-anchor="middle" fill="var(--c-accent-2)">처음 듣는 이야기 없음</text>
</svg>
