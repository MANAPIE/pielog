  <line x1="360" y1="94" x2="376" y2="94" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sf)" />
  <rect x="378" y="66" width="98" height="56" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="427.0" y="91" class="mid" text-anchor="middle">소리 끄고 보는</text>
  <text x="427.0" y="108" class="mid" text-anchor="middle">사람 69%</text>
  <rect x="24" y="146" width="98" height="56" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="73.0" y="179" class="mid" text-anchor="middle">음성 명령</text>
  <line x1="124" y1="174" x2="140" y2="174" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sf)" />
  <rect x="142" y="146" width="98" height="56" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="191.0" y="179" class="mid" text-anchor="middle">시각 장애인</text>
  <line x1="242" y1="174" x2="258" y2="174" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sf)" />
  <rect x="260" y="146" width="98" height="56" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="309.0" y="179" class="mid" text-anchor="middle">운전 중</text>
  <line x1="360" y1="174" x2="376" y2="174" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sf)" />
  <rect x="378" y="146" width="98" height="56" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="427.0" y="179" class="mid" text-anchor="middle">요리 중</text>
  <rect x="24" y="226" width="98" height="56" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="73.0" y="259" class="mid" text-anchor="middle">큰 글씨 옵션</text>
  <line x1="124" y1="254" x2="140" y2="254" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sf)" />
  <rect x="142" y="226" width="98" height="56" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="191.0" y="259" class="mid" text-anchor="middle">저시력자</text>
  <line x1="242" y1="254" x2="258" y2="254" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sf)" />
  <rect x="260" y="226" width="98" height="56" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="309.0" y="259" class="mid" text-anchor="middle">노안</text>
  <line x1="360" y1="254" x2="376" y2="254" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sf)" />
  <rect x="378" y="226" width="98" height="56" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="427.0" y="251" class="mid" text-anchor="middle">멀리서</text>
  <text x="427.0" y="268" class="mid" text-anchor="middle">화면 보는 사람</text>
  <text x="24" y="308" class="cap">처음 한 사람을 위해 만든 기능이 상황적 제약을 겪는 모든 사용자에게 확장됩니다.</text>
</svg>
