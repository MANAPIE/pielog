<svg viewBox="0 0 500 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ps">
  <title id="t-ps">페르소나 스펙트럼: 영구적·일시적·상황적</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ps" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ps-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="372" />
  <text x="24" y="36" class="ttl">페르소나 스펙트럼: 영구적·일시적·상황적</text>
  <text x="175.0" y="64" class="th" text-anchor="middle">영구적</text>
  <text x="297.0" y="64" class="th" text-anchor="middle">일시적</text>
  <text x="419.0" y="64" class="th" text-anchor="middle">상황적</text>
  <text x="24" y="109" class="nm">시각</text>
  <rect x="118" y="76" width="114" height="48" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="175.0" y="105" class="mid" text-anchor="middle">시각 장애</text>
  <rect x="240" y="76" width="114" height="48" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="297.0" y="105" class="mid" text-anchor="middle">백내장 수술 직후</text>
  <rect x="362" y="76" width="114" height="48" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="419.0" y="105" class="mid" text-anchor="middle">햇빛이 눈부신 야외</text>
  <text x="24" y="165" class="nm">청각</text>
  <rect x="118" y="132" width="114" height="48" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="175.0" y="161" class="mid" text-anchor="middle">청각 장애</text>
  <rect x="240" y="132" width="114" height="48" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="297.0" y="161" class="mid" text-anchor="middle">귀 감염</text>
  <rect x="362" y="132" width="114" height="48" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="419.0" y="161" class="mid" text-anchor="middle">시끄러운 카페</text>
  <text x="24" y="221" class="nm">운동</text>
  <rect x="118" y="188" width="114" height="48" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="175.0" y="209" class="mid" text-anchor="middle">한 팔</text>
  <text x="175.0" y="226" class="cap" text-anchor="middle">2만 6천 명</text>
  <rect x="240" y="188" width="114" height="48" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="297.0" y="209" class="mid" text-anchor="middle">팔 깁스</text>
  <text x="297.0" y="226" class="cap" text-anchor="middle">1,300만 명</text>
  <rect x="362" y="188" width="114" height="48" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="419.0" y="209" class="mid" text-anchor="middle">아기를 안은 부모</text>
  <text x="419.0" y="226" class="cap" text-anchor="middle">800만 명</text>
  <text x="24" y="277" class="nm">인지</text>
  <rect x="118" y="244" width="114" height="48" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="175.0" y="273" class="mid" text-anchor="middle">자폐 스펙트럼</text>
  <rect x="240" y="244" width="114" height="48" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="297.0" y="273" class="mid" text-anchor="middle">뇌진탕</text>
  <rect x="362" y="244" width="114" height="48" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="419.0" y="273" class="mid" text-anchor="middle">운전 중 주의 분산</text>
  <text x="24" y="332" class="cap">영구적 장애를 위해 설계하면 나머지 두 열의 사용자가 함께 혜택을 받습니다.</text>
  <text x="24" y="348" class="cap">운동 행의 인원은 Microsoft 포용적 디자인 툴킷의 미국 기준 수치입니다.</text>
</svg>
