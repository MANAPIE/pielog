<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"
  font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <style>
    .title {
      fill: #111827;
      font-size: 15px;
      font-weight: 700
    }

    .center {
      fill: #1f2937;
      stroke: #1f2937
    }

    .center-text {
      fill: #fff;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle
    }

    .center-sub {
      fill: #9ca3af;
      font-size: 10px;
      text-anchor: middle
    }

    .card {
      stroke-width: 2
    }

    .c1 {
      fill: #cffafe;
      stroke: #06b6d4
    }

    .c2 {
      fill: #eff6ff;
      stroke: #3b82f6
    }

    .c3 {
      fill: #fef3c7;
      stroke: #f59e0b
    }

    .c4 {
      fill: #f3e8ff;
      stroke: #a855f7
    }

    .c5 {
      fill: #d1fae5;
      stroke: #10b981
    }

    .c6 {
      fill: #fce7f3;
      stroke: #ec4899
    }

    .h {
      font-size: 12px;
      font-weight: 700;
      text-anchor: middle
    }

    .h1 {
      fill: #155e75
    }

    .h2 {
      fill: #1e3a8a
    }

    .h3 {
      fill: #92400e
    }

    .h4 {
      fill: #581c87
    }

    .h5 {
      fill: #065f46
    }

    .h6 {
      fill: #9d174d
    }

    .b {
      font-size: 9.5px;
      text-anchor: middle
    }

    .b1 {
      fill: #0e7490
    }

    .b2 {
      fill: #1e40af
    }

    .b3 {
      fill: #92400e
    }

    .b4 {
      fill: #6b21a8
    }

    .b5 {
      fill: #047857
    }

    .b6 {
      fill: #be185d
    }

    .arrow {
      stroke: #d1d5db;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 3 3
    }

    @media(prefers-color-scheme:dark) {
      .title {
        fill: #f5f5f5
      }

      .center {
        fill: #404040;
        stroke: #525252
      }

      .center-sub {
        fill: #a3a3a3
      }

      .c1 {
        fill: #0a2a3a;
        stroke: #06b6d4
      }

      .c2 {
        fill: #0f1f3a;
        stroke: #3b82f6
      }

      .c3 {
        fill: #3a2a0a;
        stroke: #f59e0b
      }

      .c4 {
        fill: #2a103a;
        stroke: #a855f7
      }

      .c5 {
        fill: #0a3022;
        stroke: #10b981
      }

      .c6 {
        fill: #3a0a22;
        stroke: #ec4899
      }

      .h1 {
        fill: #67e8f7
      }

      .h2 {
        fill: #93c5fd
      }

      .h3 {
        fill: #fcd34d
      }

      .h4 {
        fill: #d8b4fe
      }

      .h5 {
        fill: #6ee7b7
      }

      .h6 {
        fill: #fbcfe8
      }

      .b1 {
        fill: #a5f3fc
      }

      .b2 {
        fill: #bfdbfe
      }

      .b3 {
        fill: #fde68a
      }

      .b4 {
        fill: #e9d5ff
      }

      .b5 {
        fill: #a7f3d0
      }

      .b6 {
        fill: #fbcfe8
      }

      .arrow {
        stroke: #525252
      }
    }
  </style>
  <text x="400" y="32" text-anchor="middle" class="title">공통 가이드 6가지 항목</text>

  <!-- Connecting lines (radial) -->
  <line x1="357" y1="232" x2="220" y2="146" class="arrow" />
  <line x1="400" y1="200" x2="400" y2="146" class="arrow" />
  <line x1="443" y1="232" x2="580" y2="146" class="arrow" />
  <line x1="357" y1="288" x2="220" y2="370" class="arrow" />
  <line x1="400" y1="320" x2="400" y2="370" class="arrow" />
  <line x1="443" y1="288" x2="580" y2="370" class="arrow" />

  <!-- Center -->
  <circle cx="400" cy="260" r="60" class="center" />
  <text x="400" y="247" class="center-text">공통</text>
  <text x="400" y="267" class="center-text">가이드</text>
  <text x="400" y="285" class="center-sub">6 categories</text>

  <!-- Top-left: ① Common component rules -->
  <g transform="translate(20,70)">
    <rect width="200" height="76" class="card c1" rx="8" />
    <text x="100" y="28" class="h h1">① 공통 컴포넌트 규칙</text>
    <text x="100" y="46" class="b b1">마스터/심볼, 네이밍</text>
    <text x="100" y="60" class="b b1">표준 사이즈, 변형·상태</text>
  </g>
  <!-- Top-center: ② Navigation -->
  <g transform="translate(300,70)">
    <rect width="200" height="76" class="card c2" rx="8" />
    <text x="100" y="28" class="h h2">② 네비게이션 규칙</text>
    <text x="100" y="46" class="b b2">GNB 구성, Depth</text>
    <text x="100" y="60" class="b b2">뒤로가기 동작</text>
  </g>
  <!-- Top-right: ③ Popup -->
  <g transform="translate(580,70)">
    <rect width="200" height="76" class="card c3" rx="8" />
    <text x="100" y="28" class="h h3">③ 팝업/알럿 유형</text>
    <text x="100" y="46" class="b b3">모달 / 바텀시트 / 토스트</text>
    <text x="100" y="60" class="b b3">스낵바 / 시스템 알럿</text>
  </g>
  <!-- Bottom-left: ④ Interaction -->
  <g transform="translate(20,370)">
    <rect width="200" height="76" class="card c4" rx="8" />
    <text x="100" y="28" class="h h4">④ 공통 인터랙션</text>
    <text x="100" y="46" class="b b4">SNS 공유, Pull-to-Refresh</text>
    <text x="100" y="60" class="b b4">정렬, 무한스크롤</text>
  </g>
  <!-- Bottom-center: ⑤ Mobile gesture -->
  <g transform="translate(300,370)">
    <rect width="200" height="76" class="card c5" rx="8" />
    <text x="100" y="28" class="h h5">⑤ 모바일 제스처</text>
    <text x="100" y="46" class="b b5">탭 / 롱프레스 / 스와이프</text>
    <text x="100" y="60" class="b b5">핀치 줌 / 드래그</text>
  </g>
  <!-- Bottom-right: ⑥ Common error -->
  <g transform="translate(580,370)">
    <rect width="200" height="76" class="card c6" rx="8" />
    <text x="100" y="28" class="h h6">⑥ 공통 에러 처리</text>
    <text x="100" y="46" class="b b6">네트워크 / 세션 만료</text>
    <text x="100" y="60" class="b b6">서버 점검</text>
  </g>

  <text x="400" y="478" text-anchor="middle" style="fill:#6b7280;font-size:11px;font-style:italic">반복 적용되는 규칙을 한 곳에 모아
    정의 — 각 화면에서는 "공통 가이드 참조"로 처리</text>
</svg>