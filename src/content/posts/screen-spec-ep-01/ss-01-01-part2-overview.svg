<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <style>
    .title{fill:#111827;font-size:16px;font-weight:700}
    .sub{fill:#6b7280;font-size:11px}
    .card{stroke-width:2;rx:10}
    .c1{fill:#eff6ff;stroke:#3b82f6}.c2{fill:#fef3c7;stroke:#f59e0b}
    .c3{fill:#f3e8ff;stroke:#a855f7}.c4{fill:#d1fae5;stroke:#10b981}
    .c5{fill:#fce7f3;stroke:#ec4899}
    .icon{font-size:22px;text-anchor:middle}
    .num{font-size:11px;font-weight:700;text-anchor:middle}
    .n1{fill:#3b82f6}.n2{fill:#f59e0b}.n3{fill:#a855f7}
    .n4{fill:#10b981}.n5{fill:#ec4899}
    .h{font-size:13px;font-weight:700;text-anchor:middle}
    .h1{fill:#1e3a8a}.h2{fill:#92400e}.h3{fill:#581c87}
    .h4{fill:#065f46}.h5{fill:#9d174d}
    .b{font-size:10px;text-anchor:middle}
    .b1{fill:#1e40af}.b2{fill:#92400e}.b3{fill:#6b21a8}
    .b4{fill:#047857}.b5{fill:#be185d}
    @media(prefers-color-scheme:dark){
      .title{fill:#f5f5f5}.sub{fill:#a3a3a3}
      .c1{fill:#0f1f3a;stroke:#3b82f6}.c2{fill:#3a2a0a;stroke:#f59e0b}
      .c3{fill:#2a103a;stroke:#a855f7}.c4{fill:#0a3022;stroke:#10b981}
      .c5{fill:#3a0a22;stroke:#ec4899}
      .h1{fill:#93c5fd}.h2{fill:#fcd34d}.h3{fill:#d8b4fe}
      .h4{fill:#6ee7b7}.h5{fill:#fbcfe8}
      .b1{fill:#bfdbfe}.b2{fill:#fde68a}.b3{fill:#e9d5ff}
      .b4{fill:#a7f3d0}.b5{fill:#fbcfe8}
    }
  </style>
  <text x="400" y="40" text-anchor="middle" class="title">설계 전 준비 5가지</text>
  <text x="400" y="60" text-anchor="middle" class="sub">미리 30분을 투자하면 나중에 3시간을 아낍니다.</text>

  <!-- 5 cards -->
  <g transform="translate(30,100)">
    <rect width="140" height="200" class="card c1" rx="10"/>
    <circle cx="70" cy="38" r="22" class="c1" stroke-width="2"/>
    <text x="70" y="46" class="icon">📐</text>
    <text x="70" y="92" class="num n1">01</text>
    <text x="70" y="116" class="h h1">정보구조</text>
    <text x="70" y="132" class="h h1">(IA)</text>
    <text x="70" y="160" class="b b1">화면 목록과</text>
    <text x="70" y="176" class="b b1">계층 관계 정리</text>
  </g>
  <g transform="translate(185,100)">
    <rect width="140" height="200" class="card c2" rx="10"/>
    <circle cx="70" cy="38" r="22" class="c2" stroke-width="2"/>
    <text x="70" y="46" class="icon">🏷</text>
    <text x="70" y="92" class="num n2">02</text>
    <text x="70" y="116" class="h h2">화면 ID</text>
    <text x="70" y="132" class="h h2">체계</text>
    <text x="70" y="160" class="b b2">고유 식별자로</text>
    <text x="70" y="176" class="b b2">정확한 지칭</text>
  </g>
  <g transform="translate(340,100)">
    <rect width="140" height="200" class="card c3" rx="10"/>
    <circle cx="70" cy="38" r="22" class="c3" stroke-width="2"/>
    <text x="70" y="46" class="icon">📁</text>
    <text x="70" y="92" class="num n3">03</text>
    <text x="70" y="116" class="h h3">파일명/버전</text>
    <text x="70" y="132" class="h h3">규칙</text>
    <text x="70" y="160" class="b b3">변경 추적과</text>
    <text x="70" y="176" class="b b3">버전 관리</text>
  </g>
  <g transform="translate(495,100)">
    <rect width="140" height="200" class="card c4" rx="10"/>
    <circle cx="70" cy="38" r="22" class="c4" stroke-width="2"/>
    <text x="70" y="46" class="icon">📖</text>
    <text x="70" y="92" class="num n4">04</text>
    <text x="70" y="116" class="h h4">프로젝트</text>
    <text x="70" y="132" class="h h4">용어집</text>
    <text x="70" y="160" class="b b4">"찜" vs "위시"</text>
    <text x="70" y="176" class="b b4">용어 합의</text>
  </g>
  <g transform="translate(650,100)">
    <rect width="140" height="200" class="card c5" rx="10"/>
    <circle cx="70" cy="38" r="22" class="c5" stroke-width="2"/>
    <text x="70" y="46" class="icon">📋</text>
    <text x="70" y="92" class="num n5">05</text>
    <text x="70" y="116" class="h h5">공통 가이드</text>
    <text x="70" y="132" class="h h5">정의</text>
    <text x="70" y="160" class="b b5">반복 규칙을</text>
    <text x="70" y="176" class="b b5">한 곳에 모음</text>
  </g>
</svg>
