<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"
  font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <style>
    .title {
      fill: #111827;
      font-size: 15px;
      font-weight: 700
    }

    .sub-title {
      fill: #374151;
      font-size: 12px;
      font-weight: 600
    }

    .id-bg {
      fill: #f9fafb;
      stroke: #e5e7eb;
      stroke-width: 1
    }

    .area {
      fill: #3b82f6
    }

    .area-text {
      fill: #fff;
      font-size: 24px;
      font-weight: 700;
      text-anchor: middle;
      font-family: 'Menlo', monospace
    }

    .seq {
      fill: #10b981
    }

    .seq-text {
      fill: #fff;
      font-size: 24px;
      font-weight: 700;
      text-anchor: middle;
      font-family: 'Menlo', monospace
    }

    .sep-text {
      fill: #1f2937;
      font-size: 24px;
      font-weight: 700;
      text-anchor: middle;
      font-family: 'Menlo', monospace
    }

    .badge-area {
      fill: #3b82f6
    }

    .badge-seq {
      fill: #10b981
    }

    .badge-text {
      fill: #fff;
      font-size: 10px;
      font-weight: 600;
      text-anchor: middle
    }

    .arrow {
      stroke: #9ca3af;
      stroke-width: 1.5;
      fill: none
    }

    .desc-bold {
      fill: #1f2937;
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle
    }

    .desc {
      fill: #6b7280;
      font-size: 10px;
      text-anchor: middle
    }

    .ex-card {
      fill: #f9fafb;
      stroke: #e5e7eb;
      stroke-width: 1
    }

    .ex-id {
      fill: #1f2937;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Menlo', monospace
    }

    .ex-name {
      fill: #6b7280;
      font-size: 10px
    }

    @media(prefers-color-scheme:dark) {
      .title {
        fill: #f5f5f5
      }

      .sub-title {
        fill: #d4d4d4
      }

      .id-bg {
        fill: #1a1a1a;
        stroke: #404040
      }

      .sep-text {
        fill: #f5f5f5
      }

      .desc-bold {
        fill: #f5f5f5
      }

      .desc {
        fill: #a3a3a3
      }

      .ex-card {
        fill: #1a1a1a;
        stroke: #404040
      }

      .ex-id {
        fill: #f5f5f5
      }

      .ex-name {
        fill: #a3a3a3
      }

      .arrow {
        stroke: #737373
      }
    }
  </style>
  <text x="400" y="35" text-anchor="middle" class="title">화면 ID 체계 — 영역 약어 + 일련번호</text>

  <!-- Big ID example -->
  <rect x="240" y="70" width="320" height="100" class="id-bg" rx="8" />
  <rect x="265" y="92" width="100" height="56" class="area" rx="4" />
  <text x="315" y="129" class="area-text">PRD</text>
  <text x="380" y="129" class="sep-text">-</text>
  <rect x="395" y="92" width="135" height="56" class="seq" rx="4" />
  <text x="462" y="129" class="seq-text">002</text>

  <!-- Labels with arrows -->
  <line x1="315" y1="92" x2="315" y2="78" class="arrow" />
  <line x1="200" y1="78" x2="315" y2="78" class="arrow" />
  <rect x="120" y="62" width="80" height="22" class="badge-area" rx="11" />
  <text x="160" y="76" class="badge-text">영역 약어</text>

  <line x1="462" y1="148" x2="462" y2="180" class="arrow" />
  <line x1="462" y1="180" x2="600" y2="180" class="arrow" />
  <rect x="600" y="170" width="80" height="22" class="badge-seq" rx="11" />
  <text x="640" y="184" class="badge-text">일련번호</text>

  <text x="160" y="105" class="desc-bold">영역 (Domain)</text>
  <text x="160" y="120" class="desc">PRD = Product</text>
  <text x="160" y="134" class="desc">상품 영역</text>

  <text x="640" y="218" class="desc-bold">일련번호 3자리</text>
  <text x="640" y="233" class="desc">001부터 시작</text>

  <!-- Examples -->
  <text x="50" y="260" class="sub-title">자주 쓰이는 영역 약어</text>
  <g transform="translate(50,275)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">LGN-001</text>
    <text x="14" y="40" class="ex-name">로그인</text>
  </g>
  <g transform="translate(200,275)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">REG-001</text>
    <text x="14" y="40" class="ex-name">회원가입 (Registration)</text>
  </g>
  <g transform="translate(350,275)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">HOME-001</text>
    <text x="14" y="40" class="ex-name">홈 메인</text>
  </g>
  <g transform="translate(500,275)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">PRD-001</text>
    <text x="14" y="40" class="ex-name">상품 목록 (Product)</text>
  </g>
  <g transform="translate(650,275)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">ORD-001</text>
    <text x="14" y="40" class="ex-name">주문 (Order)</text>
  </g>
  <g transform="translate(50,335)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">MY-001</text>
    <text x="14" y="40" class="ex-name">마이페이지</text>
  </g>
  <g transform="translate(200,335)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">SET-001</text>
    <text x="14" y="40" class="ex-name">설정 (Settings)</text>
  </g>
  <g transform="translate(350,335)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">ADM-001</text>
    <text x="14" y="40" class="ex-name">관리자 (Admin)</text>
  </g>
  <g transform="translate(500,335)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">SRC-001</text>
    <text x="14" y="40" class="ex-name">검색 (Search)</text>
  </g>
  <g transform="translate(650,335)">
    <rect width="140" height="50" class="ex-card" rx="4" />
    <text x="14" y="22" class="ex-id">CRT-001</text>
    <text x="14" y="40" class="ex-name">장바구니 (Cart)</text>
  </g>

  <text x="400" y="425" class="desc">절대적인 표준은 없습니다. 프로젝트 초반에 규칙을 정하고 전체 문서에 일관되게 적용합니다.</text>
</svg>