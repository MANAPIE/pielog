<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-lw">
  <title id="t-lw">대기 시간에 따른 로딩 표시</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-lw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-lw-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="300" />
  <text x="24" y="36" class="ttl">예상 대기 시간에 따른 로딩 표시</text>
  <line x1="24" y1="84" x2="476" y2="84" stroke="var(--c-fg)" stroke-width="1.6" marker-end="url(#a-lw-f)" />
  <line x1="24" y1="76" x2="24" y2="92" stroke="var(--c-fg)" stroke-width="1.6" />
  <text x="24" y="110" class="val" text-anchor="middle" style="fill:var(--c-fg)">0</text>
  <line x1="134" y1="76" x2="134" y2="92" stroke="var(--c-fg)" stroke-width="1.6" />
  <text x="134" y="110" class="val" text-anchor="middle" style="fill:var(--c-fg)">0.1초</text>
  <line x1="252" y1="76" x2="252" y2="92" stroke="var(--c-fg)" stroke-width="1.6" />
  <text x="252" y="110" class="val" text-anchor="middle" style="fill:var(--c-fg)">1초</text>
  <line x1="380" y1="76" x2="380" y2="92" stroke="var(--c-fg)" stroke-width="1.6" />
  <text x="380" y="110" class="val" text-anchor="middle" style="fill:var(--c-fg)">10초</text>
  <rect x="24" y="78" width="110" height="12" fill="var(--c-accent)" opacity="0.35" />
  <line x1="79.0" y1="94" x2="79.0" y2="110" stroke="var(--c-accent)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="24" y="128" class="nm" text-anchor="start" style="fill:var(--c-accent)">즉시 반응으로 느낌</text>
  <text x="24" y="146" class="cap" text-anchor="start">결과만 보여줍니다.</text>
  <rect x="134" y="78" width="118" height="12" fill="var(--c-accent-3)" opacity="0.35" />
  <line x1="193.0" y1="94" x2="193.0" y2="170" stroke="var(--c-accent-3)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="193.0" y="188" class="nm" text-anchor="middle" style="fill:var(--c-accent-3)">지연은 느끼지만 흐름 유지</text>
  <text x="193.0" y="206" class="cap" text-anchor="middle">표시 없어도 됩니다.</text>
  <rect x="252" y="78" width="128" height="12" fill="var(--c-accent-4)" opacity="0.35" />
  <line x1="316.0" y1="94" x2="316.0" y2="110" stroke="var(--c-accent-4)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="316.0" y="128" class="nm" text-anchor="middle" style="fill:var(--c-accent-4)">주의가 흩어지기 시작</text>
  <text x="316.0" y="146" class="cap" text-anchor="middle">스켈레톤 또는 스피너를 둡니다.</text>
  <rect x="380" y="78" width="96" height="12" fill="var(--c-accent-2)" opacity="0.35" />
  <line x1="428.0" y1="94" x2="428.0" y2="170" stroke="var(--c-accent-2)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="476" y="188" class="nm" text-anchor="end" style="fill:var(--c-accent-2)">다른 일을 하러 감</text>
  <text x="476" y="206" class="cap" text-anchor="end">진행률과 예상 시간을 보여줍니다.</text>
  <text x="24" y="258" class="cap">기준은 Nielsen(1993)의 0.1초·1초·10초입니다.</text>
  <text x="24" y="276" class="cap">표시기 권고는 NN/g의 스켈레톤·스피너·진행률 지침을 합친 것입니다.</text>
</svg>
