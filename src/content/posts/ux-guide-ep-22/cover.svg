    <radialGradient id="halo-ux22b" cx="0.15" cy="0.85" r="0.55"><stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.24"/><stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-ux22)"/>
  <rect width="1200" height="630" fill="url(#halo-ux22a)"/>
  <rect width="1200" height="630" fill="url(#halo-ux22b)"/>
  <circle cx="1080" cy="560" r="300" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <rect x="-140" y="-120" width="520" height="520" rx="48" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(-8 120 140)"/>
