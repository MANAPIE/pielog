<svg viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ct">
  <title id="t-ct">적정 신뢰: 시스템의 능력에 맞는 신뢰</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ct" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ct-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="360" />
  <text x="24" y="36" class="ttl">적정 신뢰: 시스템의 능력에 맞는 신뢰</text>
  <polygon points="70,300 160,300 476,100 476,60 386,60 70,260" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <line x1="70" y1="300" x2="476" y2="300" stroke="var(--c-fg)" stroke-width="1.4" marker-end="url(#a-ct)" />
  <line x1="70" y1="300" x2="70" y2="60" stroke="var(--c-fg)" stroke-width="1.4" marker-end="url(#a-ct)" />
  <text x="466" y="318" class="cap" text-anchor="end">시스템의 실제 능력 →</text>
  <text x="78" y="52" class="cap">↑ 사용자의 신뢰</text>
  <text x="273" y="186" class="nm" text-anchor="middle" transform="rotate(-33 273 186)" style="fill:var(--c-accent)">적정 신뢰</text>
  <text x="90" y="96" class="nm" style="fill:var(--c-accent-2)">과신</text>
  <text x="90" y="114" class="cap">틀린 결과를 그대로 수용</text>
  <text x="466" y="262" class="nm" text-anchor="end" style="fill:var(--c-accent-3)">불신</text>
  <text x="466" y="280" class="cap" text-anchor="end">쓸 수 있는 결과도 버림</text>
  <text x="24" y="336" class="cap">설계의 목표는 신뢰를 높이는 것이 아니라 실제 능력에 맞추는 것입니다 (Lee &amp; See 2004).</text>
</svg>
