<svg viewBox="0 0 500 494" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-hx">
  <title id="t-hx">인간-AI 상호작용 지침 18가지</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-hx" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-hx-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="494" />
  <text x="24" y="36" class="ttl">인간-AI 상호작용 지침 18가지</text>
  <text x="24" y="64" class="th" style="fill:var(--c-accent-3)">처음</text>
  <rect x="24" y="76" width="104" height="46" rx="6" fill="var(--c-soft-3)" stroke="none" stroke-width="0" />
  <text x="32" y="92" class="th" style="fill:var(--c-accent-3)">1</text>
  <text x="48" y="93" class="cap" style="fill:var(--c-fg)">할 수 있는 일</text>
  <text x="48" y="112" class="cap" style="fill:var(--c-fg)">분명히 하기</text>
  <rect x="24" y="130" width="104" height="46" rx="6" fill="var(--c-soft-3)" stroke="none" stroke-width="0" />
  <text x="32" y="146" class="th" style="fill:var(--c-accent-3)">2</text>
  <text x="48" y="147" class="cap" style="fill:var(--c-fg)">얼마나 잘하는지</text>
  <text x="48" y="166" class="cap" style="fill:var(--c-fg)">분명히 하기</text>
  <text x="140" y="64" class="th" style="fill:var(--c-accent-2)">사용 중</text>
  <rect x="140" y="76" width="104" height="46" rx="6" fill="var(--c-soft-2)" stroke="none" stroke-width="0" />
  <text x="148" y="92" class="th" style="fill:var(--c-accent-2)">3</text>
  <text x="164" y="93" class="cap" style="fill:var(--c-fg)">맥락에 맞춰</text>
  <text x="164" y="112" class="cap" style="fill:var(--c-fg)">시점 정하기</text>
  <rect x="140" y="130" width="104" height="46" rx="6" fill="var(--c-soft-2)" stroke="none" stroke-width="0" />
  <text x="148" y="146" class="th" style="fill:var(--c-accent-2)">4</text>
  <text x="164" y="147" class="cap" style="fill:var(--c-fg)">맥락에 맞는</text>
  <text x="164" y="166" class="cap" style="fill:var(--c-fg)">정보 보여주기</text>
  <rect x="140" y="184" width="104" height="46" rx="6" fill="var(--c-soft-2)" stroke="none" stroke-width="0" />
  <text x="148" y="200" class="th" style="fill:var(--c-accent-2)">5</text>
  <text x="164" y="201" class="cap" style="fill:var(--c-fg)">사회적 규범에</text>
  <text x="164" y="220" class="cap" style="fill:var(--c-fg)">맞추기</text>
  <rect x="140" y="238" width="104" height="46" rx="6" fill="var(--c-soft-2)" stroke="none" stroke-width="0" />
  <text x="148" y="254" class="th" style="fill:var(--c-accent-2)">6</text>
  <text x="164" y="255" class="cap" style="fill:var(--c-fg)">사회적 편향</text>
  <text x="164" y="274" class="cap" style="fill:var(--c-fg)">줄이기</text>
  <text x="256" y="64" class="th" style="fill:var(--c-accent)">틀렸을 때</text>
  <rect x="256" y="76" width="104" height="46" rx="6" fill="var(--c-soft)" stroke="none" stroke-width="0" />
  <text x="264" y="92" class="th" style="fill:var(--c-accent)">7</text>
  <text x="280" y="93" class="cap" style="fill:var(--c-fg)">쉽게 호출하기</text>
  <rect x="256" y="130" width="104" height="46" rx="6" fill="var(--c-soft)" stroke="none" stroke-width="0" />
  <text x="264" y="146" class="th" style="fill:var(--c-accent)">8</text>
  <text x="280" y="147" class="cap" style="fill:var(--c-fg)">쉽게 물리기</text>
  <rect x="256" y="184" width="104" height="46" rx="6" fill="var(--c-soft)" stroke="none" stroke-width="0" />
  <text x="264" y="200" class="th" style="fill:var(--c-accent)">9</text>
  <text x="280" y="201" class="cap" style="fill:var(--c-fg)">쉽게 고치기</text>
  <rect x="256" y="238" width="104" height="46" rx="6" fill="var(--c-soft)" stroke="none" stroke-width="0" />
  <text x="264" y="254" class="th" style="fill:var(--c-accent)">10</text>
  <text x="280" y="255" class="cap" style="fill:var(--c-fg)">확실하지 않으면</text>
  <text x="280" y="274" class="cap" style="fill:var(--c-fg)">범위 좁히기</text>
  <rect x="256" y="292" width="104" height="46" rx="6" fill="var(--c-soft)" stroke="none" stroke-width="0" />
  <text x="264" y="308" class="th" style="fill:var(--c-accent)">11</text>
  <text x="280" y="309" class="cap" style="fill:var(--c-fg)">왜 그렇게 했는지</text>
  <text x="280" y="328" class="cap" style="fill:var(--c-fg)">분명히 하기</text>
  <text x="372" y="64" class="th" style="fill:var(--c-accent-4)">시간이 지나며</text>
  <rect x="372" y="76" width="104" height="46" rx="6" fill="var(--c-soft-4)" stroke="none" stroke-width="0" />
  <text x="380" y="92" class="th" style="fill:var(--c-accent-4)">12</text>
  <text x="396" y="93" class="cap" style="fill:var(--c-fg)">최근 상호작용</text>
  <text x="396" y="112" class="cap" style="fill:var(--c-fg)">기억하기</text>
  <rect x="372" y="130" width="104" height="46" rx="6" fill="var(--c-soft-4)" stroke="none" stroke-width="0" />
  <text x="380" y="146" class="th" style="fill:var(--c-accent-4)">13</text>
  <text x="396" y="147" class="cap" style="fill:var(--c-fg)">사용자 행동에서</text>
  <text x="396" y="166" class="cap" style="fill:var(--c-fg)">배우기</text>
  <rect x="372" y="184" width="104" height="46" rx="6" fill="var(--c-soft-4)" stroke="none" stroke-width="0" />
  <text x="380" y="200" class="th" style="fill:var(--c-accent-4)">14</text>
  <text x="396" y="201" class="cap" style="fill:var(--c-fg)">신중하게</text>
  <text x="396" y="220" class="cap" style="fill:var(--c-fg)">갱신·적응하기</text>
  <rect x="372" y="238" width="104" height="46" rx="6" fill="var(--c-soft-4)" stroke="none" stroke-width="0" />
  <text x="380" y="254" class="th" style="fill:var(--c-accent-4)">15</text>
  <text x="396" y="255" class="cap" style="fill:var(--c-fg)">세밀한 피드백</text>
  <text x="396" y="274" class="cap" style="fill:var(--c-fg)">받기</text>
  <rect x="372" y="292" width="104" height="46" rx="6" fill="var(--c-soft-4)" stroke="none" stroke-width="0" />
  <text x="380" y="308" class="th" style="fill:var(--c-accent-4)">16</text>
  <text x="396" y="309" class="cap" style="fill:var(--c-fg)">행동의 결과</text>
  <text x="396" y="328" class="cap" style="fill:var(--c-fg)">알리기</text>
  <rect x="372" y="346" width="104" height="46" rx="6" fill="var(--c-soft-4)" stroke="none" stroke-width="0" />
  <text x="380" y="362" class="th" style="fill:var(--c-accent-4)">17</text>
  <text x="396" y="363" class="cap" style="fill:var(--c-fg)">전역 제어</text>
  <text x="396" y="382" class="cap" style="fill:var(--c-fg)">제공하기</text>
  <rect x="372" y="400" width="104" height="46" rx="6" fill="var(--c-soft-4)" stroke="none" stroke-width="0" />
  <text x="380" y="416" class="th" style="fill:var(--c-accent-4)">18</text>
  <text x="396" y="417" class="cap" style="fill:var(--c-fg)">변경 사항</text>
  <text x="396" y="436" class="cap" style="fill:var(--c-fg)">알리기</text>
  <text x="24" y="470" class="cap">네 시점은 처음 만날 때부터 오래 쓰는 동안까지의 시간 순서입니다 (Amershi 외 2019).</text>
</svg>
