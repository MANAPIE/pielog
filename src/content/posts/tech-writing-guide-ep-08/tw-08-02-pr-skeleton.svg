<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-labelledby="title-tw-08-02">
  <title id="title-tw-08-02">PR의 골격</title>
  <style>
    svg {
      --c-fg: #1A1A1A;
      --c-muted: #6B6862;
      --c-accent: #2D3E78;
      --c-accent-2: #B8924A;
      --c-accent-3: #9A3B3B;
      --c-line: rgba(0, 0, 0, 0.22);
      --c-card-bg: #FBF8F1;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --c-fg: #F5F1E8;
        --c-muted: #A8A39A;
        --c-accent: #8FA3E8;
        --c-accent-2: #E6C98A;
        --c-accent-3: #D87878;
        --c-line: rgba(255, 255, 255, 0.20);
        --c-card-bg: #232326;
      }
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      fill: var(--c-fg);
    }

    .card {
      fill: var(--c-card-bg);
      stroke: var(--c-line);
      stroke-width: 1;
    }

    .pr-line {
      font-size: 12px;
    }

    .pr-label {
      font-size: 10px;
      font-weight: 700;
      fill: var(--c-muted);
      letter-spacing: 0.5px;
    }
  </style>

  <g transform="translate(20 20)">
    <rect class="card" x="0" y="0" width="660" height="230" rx="6" />

    <text class="pr-label" x="20" y="26">TITLE</text>
    <text class="pr-line" x="20" y="44">[type] 한 줄로 무엇을 하는 PR인지: 영문/한글 일관성 유지</text>

    <line x1="20" y1="60" x2="640" y2="60" stroke="var(--c-line)" stroke-width="0.5" />

    <text class="pr-label" x="20" y="80">WHY · 이 PR이 필요한 이유</text>
    <text class="pr-line" x="20" y="98">어떤 문제/요구가 있었나. 관련 이슈·ADR·인시던트 링크.</text>

    <text class="pr-label" x="20" y="122">WHAT · 무엇을 했는가</text>
    <text class="pr-line" x="20" y="140">변경의 핵심을 <tspan font-weight="700">문장으로</tspan>. 파일 목록은 git이 보여준다.</text>

    <text class="pr-label" x="20" y="164">HOW TO TEST · 리뷰어 시점의 검증</text>
    <text class="pr-line" x="20" y="182">로컬에서 어떻게 돌려보는지. 자동 테스트 외의 수동 검증 절차.</text>

    <text class="pr-label" x="20" y="206">SCREENSHOTS · UI 변경이면 필수</text>
  </g>
</svg>