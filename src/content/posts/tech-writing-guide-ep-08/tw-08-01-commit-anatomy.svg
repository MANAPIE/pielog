<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="title-tw-08-01">
  <title id="title-tw-08-01">좋은 커밋 메시지의 구조</title>
  <style>
    svg {
      --c-fg: #1A1A1A;
      --c-muted: #6B6862;
      --c-accent: #2D3E78;
      --c-accent-2: #B8924A;
      --c-accent-3: #9A3B3B;
      --c-line: rgba(0, 0, 0, 0.22);
      --c-card-bg: #FBF8F1;
      --c-code-bg: rgba(45, 62, 120, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-fg: #F5F1E8;
        --c-muted: #A8A39A;
        --c-accent: #8FA3E8;
        --c-accent-2: #E6C98A;
        --c-accent-3: #D87878;
        --c-line: rgba(255, 255, 255, 0.20);
        --c-card-bg: #232326;
        --c-code-bg: rgba(143, 163, 232, 0.10);
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: var(--c-fg); }
    .mono { font-family: 'Menlo', 'Consolas', monospace; }
    .card { fill: var(--c-card-bg); stroke: var(--c-line); stroke-width: 1; }
    .code-area { fill: var(--c-code-bg); stroke: var(--c-line); stroke-width: 0.5; }
    .label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; fill: var(--c-accent); }
    .annot { font-size: 11px; fill: var(--c-accent-2); font-style: italic; }
    .code-text { font-size: 12px; }
    .code-text-muted { font-size: 12px; fill: var(--c-muted); }
    .pointer { stroke: var(--c-accent-2); fill: none; stroke-width: 1; }
    .rule { font-size: 11px; fill: var(--c-muted); }
  </style>

  <!-- 좌측: 구조도 -->
  <g transform="translate(30 40)">
    <rect class="card" x="0" y="0" width="340" height="490" rx="6"/>
    <text class="label" x="20" y="26">STRUCTURE</text>

    <!-- 제목 영역 -->
    <rect class="code-area" x="20" y="48" width="300" height="40" rx="3"/>
    <text class="code-text mono" x="32" y="72">feat(payment): add idempotency key</text>

    <text class="annot" x="20" y="104">↑ 제목 (50자 이내)</text>
    <text class="rule" x="32" y="120">type(scope): summary 형식</text>
    <text class="rule" x="32" y="134">동사 원형으로 시작 (add/fix/refactor)</text>
    <text class="rule" x="32" y="148">끝에 마침표 없음, 첫 글자 소문자</text>

    <!-- 빈 줄 -->
    <line x1="20" y1="172" x2="320" y2="172" stroke="var(--c-line)" stroke-dasharray="3 3"/>
    <text class="rule" x="20" y="188" font-style="italic">— blank line —</text>

    <!-- 본문 영역 -->
    <rect class="code-area" x="20" y="204" width="300" height="100" rx="3"/>
    <text class="code-text mono" x="32" y="222">Why:</text>
    <text class="code-text-muted mono" x="32" y="236">Duplicate POST /charge requests</text>
    <text class="code-text-muted mono" x="32" y="250">caused double-charging in 0.3% of</text>
    <text class="code-text-muted mono" x="32" y="264">retry scenarios (incident #1247).</text>
    <text class="code-text mono" x="32" y="284">What:</text>
    <text class="code-text-muted mono" x="32" y="298">Accept Idempotency-Key header...</text>

    <text class="annot" x="20" y="324">↑ 본문 (한 줄 72자)</text>
    <text class="rule" x="32" y="340">왜(Why) — 변경이 필요한 이유</text>
    <text class="rule" x="32" y="354">무엇(What) — 어떻게 푸는가</text>
    <text class="rule" x="32" y="368">대안 — 왜 다른 방법은 안 했는지</text>

    <!-- 빈 줄 -->
    <line x1="20" y1="416" x2="320" y2="416" stroke="var(--c-line)" stroke-dasharray="3 3"/>

    <!-- 푸터 -->
    <rect class="code-area" x="20" y="430" width="300" height="40" rx="3"/>
    <text class="code-text mono" x="32" y="448">Refs: #1247</text>
    <text class="code-text mono" x="32" y="462">Co-authored-by: ...</text>
  </g>

  <!-- 우측: 비교 -->
  <g transform="translate(400 40)">
    <text class="label" x="0" y="26">BAD vs GOOD</text>

    <!-- BAD -->
    <rect class="card" x="0" y="48" width="270" height="168" rx="6" stroke="var(--c-accent-3)"/>
    <text class="annot" x="20" y="68" fill="var(--c-accent-3)">BAD</text>
    <rect class="code-area" x="20" y="76" width="230" height="120" rx="3"/>
    <text class="code-text mono" x="28" y="94">fix bug</text>
    <text class="code-text mono" x="28" y="112">update</text>
    <text class="code-text mono" x="28" y="130">WIP</text>
    <text class="code-text mono" x="28" y="148">.</text>
    <text class="code-text mono" x="28" y="166">final final v2</text>
    <text class="code-text mono" x="28" y="184">최종 수정</text>
  </g>

  <g transform="translate(400 266)">
    <rect class="card" x="0" y="0" width="270" height="264" rx="6" stroke="var(--c-accent)"/>
    <text class="annot" x="20" y="20" fill="var(--c-accent)">GOOD</text>
    <rect class="code-area" x="20" y="28" width="230" height="216" rx="3"/>
    <text class="code-text mono" x="28" y="46">refactor(payment): extract</text>
    <text class="code-text mono" x="28" y="62">  retry policy into separate</text>
    <text class="code-text mono" x="28" y="78">  module</text>
    <text class="code-text-muted mono" x="28" y="100">Why:</text>
    <text class="code-text-muted mono" x="28" y="114">Retry logic was duplicated</text>
    <text class="code-text-muted mono" x="28" y="128">in 3 services. Centralizing</text>
    <text class="code-text-muted mono" x="28" y="142">enables consistent backoff.</text>
    <text class="code-text-muted mono" x="28" y="164">What:</text>
    <text class="code-text-muted mono" x="28" y="178">- New: RetryPolicy class</text>
    <text class="code-text-muted mono" x="28" y="192">- Tests added for backoff</text>
    <text class="code-text-muted mono" x="28" y="206">- No behavior change</text>
    <text class="code-text-muted mono" x="28" y="228">Refs: ADR-024</text>
  </g>
</svg>
