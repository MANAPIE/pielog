<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-lr">
  <title id="t-lr">로컬 호출과 원격 호출의 실패 모드</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4A5FD9;
        --c-accent-2: #D97757;
        --c-accent-4: #3D8B7A;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft-2: rgba(217, 119, 87, 0.10);
        --c-soft-4: rgba(61, 139, 122, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #8DA0FF;
          --c-accent-2: #E89376;
          --c-accent-4: #6FBFA8;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft-2: rgba(232, 147, 118, 0.14);
          --c-soft-4: rgba(111, 191, 168, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .pane-l {
        fill: var(--c-soft-4);
        stroke: var(--c-accent-4);
        stroke-width: 1.2;
        stroke-dasharray: 4 3;
      }

      .pane-r {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 1.2;
        stroke-dasharray: 4 3;
      }

      .node {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.6;
      }

      .out-ok {
        fill: var(--c-card);
        stroke: var(--c-accent-4);
        stroke-width: 1.6;
      }

      .out-err {
        fill: var(--c-card);
        stroke: var(--c-accent-2);
        stroke-width: 1.6;
      }

      .out-unk {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 2.2;
        stroke-dasharray: 5 4;
      }

      .lbl {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }

      .nm {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .cap {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        fill: var(--c-muted);
      }

      .fail {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 10.5px;
        fill: var(--c-accent-2);
      }

      .ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .time {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: var(--c-fg);
      }
    </style>
    <marker id="a-l5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-line)" />
    </marker>
    <marker id="a-e5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-2)" />
    </marker>
  </defs>

  <rect class="bg" width="800" height="520" />

  <!-- 좌: 로컬 -->
  <g transform="translate(24 24)">
    <rect class="pane-l" width="368" height="320" rx="8" />
    <text x="20" y="26" class="lbl" fill="var(--c-accent-4)">LOCAL CALL</text>
    <text x="20" y="50" class="nm" font-size="14">같은 프로세스 안</text>

    <g transform="translate(20 68)">
      <rect width="100" height="44" rx="5" class="node" />
      <text x="50" y="27" class="nm" text-anchor="middle">호출자</text>
    </g>
    <line x1="128" y1="90" x2="240" y2="90" stroke="var(--c-line)" stroke-width="2" marker-end="url(#a-l5)" />
    <g transform="translate(248 68)">
      <rect width="100" height="44" rx="5" class="node" />
      <text x="50" y="27" class="nm" text-anchor="middle">함수</text>
    </g>

    <!-- 실패 지점: 하나 -->
    <g stroke="var(--c-accent-2)" stroke-width="1.2" opacity="0.5">
      <line x1="298" y1="116" x2="298" y2="128" />
    </g>
    <text x="298" y="142" class="fail" text-anchor="middle">함수 내부 예외</text>

    <text x="20" y="170" class="cap">결과는 두 가지</text>
    <g transform="translate(20 180)">
      <rect width="156" height="40" rx="5" class="out-ok" />
      <text x="78" y="25" class="nm" text-anchor="middle" font-size="11.5">성공</text>
    </g>
    <g transform="translate(192 180)">
      <rect width="156" height="40" rx="5" class="out-err" />
      <text x="78" y="25" class="nm" text-anchor="middle" font-size="11.5">예외</text>
    </g>

    <line x1="20" y1="240" x2="348" y2="240" stroke="var(--c-divider)" stroke-width="1" />
    <text x="20" y="262" class="time">소요: 나노초 단위</text>
    <text x="20" y="282" class="cap">호출하면 반드시 돌아옵니다</text>
    <text x="20" y="300" class="cap">성공이든 예외든, 결과를 모르는 경우는 없습니다</text>
  </g>

  <!-- 우: 원격 -->
  <g transform="translate(408 24)">
    <rect class="pane-r" width="368" height="320" rx="8" />
    <text x="20" y="26" class="lbl" fill="var(--c-accent-2)">REMOTE CALL</text>
    <text x="20" y="50" class="nm" font-size="14">네트워크를 건넘</text>

    <g transform="translate(20 68)">
      <rect width="100" height="44" rx="5" class="node" />
      <text x="50" y="27" class="nm" text-anchor="middle">호출자</text>
    </g>
    <line x1="128" y1="90" x2="240" y2="90" stroke="var(--c-accent-2)" stroke-width="2" stroke-dasharray="6 4"
      marker-end="url(#a-e5)" />
    <g transform="translate(248 68)">
      <rect width="100" height="44" rx="5" class="node" />
      <text x="50" y="27" class="nm" text-anchor="middle">서버</text>
    </g>

    <!-- 실패 지점: 다섯 -->
    <g stroke="var(--c-accent-2)" stroke-width="1.2" opacity="0.5">
      <line x1="42" y1="116" x2="42" y2="128" />
      <line x1="113" y1="116" x2="113" y2="128" />
      <line x1="184" y1="116" x2="184" y2="128" />
      <line x1="255" y1="116" x2="255" y2="128" />
      <line x1="326" y1="116" x2="326" y2="128" />
    </g>
    <text x="42" y="142" class="fail" text-anchor="middle">DNS 실패</text>
    <text x="113" y="142" class="fail" text-anchor="middle">연결 거부</text>
    <text x="184" y="142" class="fail" text-anchor="middle">타임아웃</text>
    <text x="255" y="142" class="fail" text-anchor="middle">서버 에러</text>
    <text x="326" y="142" class="fail" text-anchor="middle">응답 유실</text>

    <text x="20" y="170" class="cap">결과는 세 가지</text>
    <g transform="translate(20 180)">
      <rect width="102" height="40" rx="5" class="out-ok" />
      <text x="51" y="25" class="nm" text-anchor="middle" font-size="11.5">성공</text>
    </g>
    <g transform="translate(133 180)">
      <rect width="102" height="40" rx="5" class="out-err" />
      <text x="51" y="25" class="nm" text-anchor="middle" font-size="11.5">실패</text>
    </g>
    <g transform="translate(246 180)">
      <rect width="102" height="40" rx="5" class="out-unk" />
      <text x="51" y="25" class="nm" text-anchor="middle" font-size="11.5">알 수 없음</text>
    </g>

    <line x1="20" y1="240" x2="348" y2="240" stroke="var(--c-divider)" stroke-width="1" />
    <text x="20" y="262" class="time">소요: 밀리초 ~ 수백 밀리초</text>
    <text x="20" y="282" class="cap">요청은 도착했는데 응답만 유실될 수 있습니다</text>
    <text x="20" y="300" class="cap">그러면 호출한 쪽은 수행 여부를 알 수 없습니다</text>
  </g>

  <!-- 하단: 알 수 없음 강조 -->
  <g transform="translate(24 360)">
    <rect width="752" height="112" rx="8" fill="var(--c-card)" stroke="var(--c-line)" stroke-width="1.8" />
    <text x="20" y="30" class="ttl">원격 호출의 결과는 '성공'과 '실패' 두 가지에 더해 '알 수 없음'까지 세 가지입니다</text>
    <text x="20" y="56" class="cap">"결제 요청을 보냈는데 응답이 오지 않았다": 결제가 되었는지 안 되었는지 알 수 없습니다</text>
    <text x="20" y="76" class="cap">재시도하면 두 번 결제될 수 있고, 재시도하지 않으면 결제가 안 되어 있을 수 있습니다</text>
    <text x="20" y="96" class="cap">이 문제의 해법인 멱등성은 ep.06에서 다룹니다</text>
  </g>

  <text x="400" y="496" class="cap" text-anchor="middle">타임아웃 없는 호출은 무한히 기다릴 수 있는 호출입니다</text>
</svg>