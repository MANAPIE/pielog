<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">네트워크 경계와 회복 탄력성: ep.05 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="24%" cy="70%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="78%" cy="26%" r="48%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <circle cx="70" cy="80" r="220" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="900" y="420" width="500" height="340" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(10 1150 590)"/>

  <!-- 메타포: 끊긴 선과 회로 차단기 -->
  <g transform="translate(600 315)">
    <!-- 왼쪽 발신 노드 -->
    <g transform="translate(-380 0)">
      <circle r="46" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.6"/>
      <circle r="20" fill="var(--c-accent-2)" opacity="0.7"/>
      <circle r="66" fill="none" stroke="var(--c-line)" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.5"/>
    </g>

    <!-- 오른쪽 수신 노드 -->
    <g transform="translate(380 0)">
      <circle r="46" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.6"/>
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="var(--c-accent)" opacity="0.65"/>
    </g>

    <!-- 전송선 1: 통과 (실선) -->
    <path d="M -330 -110 Q -80 -160 330 -118" fill="none" stroke="var(--c-line)" stroke-width="2.4" opacity="0.75"/>
    <circle cx="-40" cy="-141" r="6" fill="var(--c-accent-4)"/>

    <!-- 전송선 2: 지연 (점선, 느림 표시) -->
    <path d="M -332 -24 Q -60 -48 332 -30" fill="none" stroke="var(--c-line)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
    <g transform="translate(-30 -40)">
      <circle r="5" fill="var(--c-line)" opacity="0.6"/>
      <circle cx="18" r="5" fill="var(--c-line)" opacity="0.4"/>
      <circle cx="36" r="5" fill="var(--c-line)" opacity="0.2"/>
    </g>

    <!-- 전송선 3: 끊김 (중간에 X) -->
    <path d="M -330 60 Q -180 78 -70 84" fill="none" stroke="var(--c-accent-2)" stroke-width="2.6"/>
    <path d="M 70 88 Q 200 92 330 74" fill="none" stroke="var(--c-accent-2)" stroke-width="2.6" stroke-dasharray="4 6" opacity="0.5"/>
    <g transform="translate(0 86) rotate(12)">
      <circle r="30" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.6"/>
      <line x1="-13" y1="-13" x2="13" y2="13" stroke="var(--c-accent-2)" stroke-width="3.4"/>
      <line x1="13" y1="-13" x2="-13" y2="13" stroke="var(--c-accent-2)" stroke-width="3.4"/>
      <circle r="44" fill="none" stroke="var(--c-accent-2)" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.6"/>
    </g>

    <!-- 전송선 4: 알 수 없음 (물음 형태 — 반쯤 페이드) -->
    <path d="M -328 150 Q -120 190 40 176" fill="none" stroke="var(--c-line)" stroke-width="2.2" opacity="0.7"/>
    <path d="M 40 176 Q 180 168 328 140" fill="none" stroke="var(--c-line)" stroke-width="2.2" opacity="0.18"/>
    <circle cx="40" cy="176" r="8" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.4"/>

    <!-- 중앙 회로 차단기 (레버) -->
    <g transform="translate(-152 -220) rotate(-8)">
      <rect x="-56" y="-40" width="112" height="80" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.8"/>
      <!-- 열린 레버 -->
      <circle cx="-24" cy="14" r="6" fill="var(--c-accent-2)"/>
      <line x1="-24" y1="14" x2="22" y2="-18" stroke="var(--c-accent-2)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="26" cy="14" r="6" fill="none" stroke="var(--c-line)" stroke-width="2.4"/>
      <rect x="-36" y="-28" width="72" height="7" rx="3.5" fill="var(--c-line)" opacity="0.3"/>
    </g>

    <!-- 우상단 재시도 곡선 화살표 -->
    <g transform="translate(216 -222)" opacity="0.85">
      <path d="M -40 12 A 40 40 0 1 1 -12 40" fill="none" stroke="var(--c-accent-4)" stroke-width="3" stroke-linecap="round"/>
      <polygon points="-12,40 -24,36 -18,50" fill="var(--c-accent-4)"/>
      <!-- 백오프 간격 표시 -->
      <rect x="-58" y="62" width="14" height="8" rx="4" fill="var(--c-accent-4)" opacity="0.8"/>
      <rect x="-36" y="62" width="24" height="8" rx="4" fill="var(--c-accent-4)" opacity="0.55"/>
      <rect x="-4" y="62" width="40" height="8" rx="4" fill="var(--c-accent-4)" opacity="0.3"/>
    </g>
  </g>

  <!-- 디테일 -->
  <g transform="translate(140 540)">
    <circle r="4" fill="var(--c-accent)"/>
    <circle cx="16" r="4" fill="var(--c-accent)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent)" opacity="0.3"/>
  </g>
  <g transform="translate(1050 160) rotate(-12)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">05</text>
</svg>
