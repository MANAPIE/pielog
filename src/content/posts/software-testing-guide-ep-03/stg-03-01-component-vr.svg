<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" role="img" aria-labelledby="title-stg03-01">
  <title id="title-stg03-01">컴포넌트 테스트와 시각 회귀 테스트가 Storybook을 공유하는 구조</title>
  <style>
    svg {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-muted: #6B7280;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-card-bg: #F2F0E9;
      --c-card-border: rgba(91, 140, 123, 0.28);
      --c-center-bg: #E8EEEB;
      --c-arrow: #9CA9A4;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-muted: #94A3B8;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-card-bg: #1F242C;
        --c-card-border: rgba(127, 181, 160, 0.32);
        --c-center-bg: #232A30;
        --c-arrow: #5A6670;
      }
    }
    .bg { fill: var(--c-bg); }
    .card { fill: var(--c-card-bg); stroke: var(--c-card-border); stroke-width: 1; }
    .center-card { fill: var(--c-center-bg); stroke: var(--c-accent); stroke-width: 1.3; }
    .label { fill: var(--c-fg); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; }
    .label-accent { fill: var(--c-accent-2); font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; }
    .body { fill: var(--c-fg); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    .sub { fill: var(--c-muted); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    .arrow { stroke: var(--c-arrow); stroke-width: 1.5; fill: none; }
    .note { fill: var(--c-muted); font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .label-accent { fill: var(--c-accent-2); }
    }
  </style>
  <defs>
    <marker id="arr03-01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--c-arrow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="600" height="360"/>

  <!-- 가운데: Storybook 스토리 -->
  <rect class="center-card" x="220" y="135" width="160" height="90" rx="12"/>
  <text class="label-accent" x="300" y="165" text-anchor="middle">Storybook 스토리</text>
  <text class="sub" x="300" y="184" text-anchor="middle">컴포넌트 + variants</text>
  <text class="sub" x="300" y="202" text-anchor="middle">한 번 작성, 두 곳에서 활용</text>

  <!-- 위쪽: 컴포넌트 테스트 -->
  <rect class="card" x="160" y="30" width="280" height="80" rx="12"/>
  <text class="label" x="300" y="55" text-anchor="middle">컴포넌트 테스트</text>
  <text class="body" x="300" y="76" text-anchor="middle">렌더링과 상호작용을 검증한다</text>
  <text class="sub" x="300" y="94" text-anchor="middle">클릭, 입력, 상태 전이</text>

  <!-- 아래쪽: 시각 회귀 -->
  <rect class="card" x="160" y="250" width="280" height="80" rx="12"/>
  <text class="label" x="300" y="275" text-anchor="middle">시각 회귀 테스트</text>
  <text class="body" x="300" y="296" text-anchor="middle">픽셀 단위로 baseline과 비교한다</text>
  <text class="sub" x="300" y="314" text-anchor="middle">렌더링 결과의 변화 감지</text>

  <!-- 화살표 -->
  <line class="arrow" x1="300" y1="115" x2="300" y2="130" marker-end="url(#arr03-01)"/>
  <line class="arrow" x1="300" y1="230" x2="300" y2="245" marker-end="url(#arr03-01)"/>

  <!-- 좌우 보조 라벨 -->
  <text class="sub" x="50" y="68">동작</text>
  <text class="sub" x="50" y="290">픽셀</text>
  <line x1="80" y1="64" x2="158" y2="64" stroke="var(--c-card-border)" stroke-width="0.6" stroke-dasharray="2 3"/>
  <line x1="80" y1="286" x2="158" y2="286" stroke="var(--c-card-border)" stroke-width="0.6" stroke-dasharray="2 3"/>
</svg>
