<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="컴포넌트와 시각 회귀 편 커버">
  <style>
    :root {
      --c-bg: #FAFAF7;
      --c-fg: #1F2A37;
      --c-accent: #5B8C7B;
      --c-accent-2: #3D6B5B;
      --c-accent-3: #B8CCC2;
      --c-num: rgba(91, 140, 123, 0.16);
      --c-dot: #5B8C7B;
      --c-line: #C9D1CC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #15191F;
        --c-fg: #E6E8EB;
        --c-accent: #7FB5A0;
        --c-accent-2: #A8D0C0;
        --c-accent-3: #4A6B5E;
        --c-num: rgba(127, 181, 160, 0.18);
        --c-dot: #7FB5A0;
        --c-line: #3D434D;
      }
    }
    .bg { fill: var(--c-bg); }
    .dot { fill: var(--c-dot); }
    .line { stroke: var(--c-line); fill: none; }
    .accent-fill { fill: var(--c-accent); }
    .accent2-fill { fill: var(--c-accent-2); }
    .accent3-fill { fill: var(--c-accent-3); }
    .accent-stroke { stroke: var(--c-accent); fill: none; }
    .accent2-stroke { stroke: var(--c-accent-2); fill: none; }
    .num-text { font: 900 240px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-num); letter-spacing: -0.04em; }
  </style>
  <defs>
    <pattern id="dotgrid-03" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.1" class="dot" opacity="0.18"/>
    </pattern>
    <radialGradient id="rg-tl-03" cx="0" cy="0" r="0.55">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-br-03" cx="1" cy="1" r="0.6">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dotgrid-03)"/>
  <rect width="1200" height="630" fill="url(#rg-tl-03)"/>
  <rect width="1200" height="630" fill="url(#rg-br-03)"/>

  <!-- 화면 밖 stroke 도형 -->
  <rect x="-200" y="-100" width="400" height="400" class="line" stroke-width="1.5" transform="rotate(-10 0 100)"/>
  <circle cx="1300" cy="600" r="350" class="line" stroke-width="1.5"/>

  <!-- 포그라운드: 두 개의 UI 미니어처 (baseline vs PR), 가운데 diff -->
  <g transform="translate(600 315) scale(1.4) translate(-600 -315)">
    <!-- baseline (좌측) -->
    <g transform="translate(280 240) rotate(-4)">
      <rect x="0" y="0" width="200" height="140" rx="10" class="accent-stroke" stroke-width="1.5" fill="var(--c-bg)"/>
      <rect x="14" y="16" width="80" height="10" rx="2" class="accent2-fill" opacity="0.8"/>
      <rect x="14" y="34" width="140" height="6" rx="2" class="accent3-fill" opacity="0.85"/>
      <rect x="14" y="48" width="120" height="6" rx="2" class="accent3-fill" opacity="0.85"/>
      <rect x="14" y="70" width="80" height="50" rx="6" class="accent-fill" opacity="0.85"/>
      <rect x="104" y="70" width="80" height="50" rx="6" class="accent3-fill" opacity="0.7"/>
    </g>

    <!-- PR (우측) -->
    <g transform="translate(720 240) rotate(4)">
      <rect x="0" y="0" width="200" height="140" rx="10" class="accent-stroke" stroke-width="1.5" fill="var(--c-bg)"/>
      <rect x="14" y="16" width="80" height="10" rx="2" class="accent2-fill" opacity="0.8"/>
      <rect x="14" y="34" width="140" height="6" rx="2" class="accent3-fill" opacity="0.85"/>
      <rect x="14" y="48" width="120" height="6" rx="2" class="accent3-fill" opacity="0.85"/>
      <rect x="14" y="70" width="74" height="50" rx="6" class="accent2-fill" opacity="0.85"/>
      <rect x="98" y="70" width="86" height="50" rx="6" class="accent3-fill" opacity="0.7"/>
      <rect x="10" y="66" width="82" height="58" rx="8" fill="none" stroke="var(--c-accent-2)" stroke-width="2" stroke-dasharray="4 3"/>
    </g>

    <!-- 가운데 diff 표시 -->
    <g transform="translate(600 310)">
      <circle r="38" class="accent-stroke" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
      <circle r="20" class="accent-fill" opacity="0.85"/>
      <line x1="-9" y1="0" x2="9" y2="0" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="-9" x2="0" y2="9" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 비교 화살표 -->
    <g class="accent-stroke" stroke-width="1.5" fill="none" stroke-linecap="round">
      <line x1="490" y1="310" x2="555" y2="310" stroke-dasharray="4 4"/>
      <line x1="650" y1="310" x2="715" y2="310" stroke-dasharray="4 4"/>
    </g>
  </g>

  <!-- 상단 grid alignment 도트 무리 -->
  <g class="accent2-fill" opacity="0.7">
    <circle cx="200" cy="120" r="3"/>
    <circle cx="214" cy="130" r="3"/>
    <circle cx="186" cy="132" r="3"/>
    <circle cx="200" cy="148" r="3"/>
  </g>

  <!-- 우상단 회전 사각형 -->
  <rect x="980" y="80" width="120" height="120" class="line" stroke-width="1.5" fill="none" transform="rotate(-12 1040 140)" opacity="0.6"/>

  <!-- 좌하단 미니 바 -->
  <g transform="translate(150 480)">
    <rect x="0" y="0" width="6" height="40" class="accent2-fill" opacity="0.85"/>
    <rect x="12" y="10" width="6" height="30" class="accent-fill" opacity="0.75"/>
    <rect x="24" y="18" width="6" height="22" class="accent3-fill" opacity="0.85"/>
  </g>

  <!-- 좌상단 포커스 링 -->
  <g transform="translate(170 250)">
    <circle r="32" class="accent-stroke" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.5"/>
    <circle r="6" class="accent2-fill"/>
  </g>

  <!-- 우하단 시리즈 번호 -->
  <text class="num-text" x="1164" y="594" text-anchor="end">03</text>
</svg>
