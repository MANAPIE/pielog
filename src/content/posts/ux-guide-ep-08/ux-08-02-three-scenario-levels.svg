<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-scn">
  <title id="t-scn">시나리오의 세 수준과 산출물</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-scn" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-scn-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="400" />
  <text x="24" y="36" class="ttl">시나리오의 세 수준과 산출물</text>
  <rect x="24" y="52" width="312" height="88" rx="8" class="card" stroke="var(--c-accent)" />
  <text x="38" y="76" class="lbl" style="fill:var(--c-accent)">01</text>
  <text x="60" y="76" class="nm">컨텍스트 시나리오</text>
  <text x="38" y="98" class="cap">설계 전, 화면 언급 없이 하루를 서술합니다.</text>
  <text x="38" y="118" class="mid">“토요일 오전, 마트별 가격을 비교한다”</text>
  <line x1="340" y1="96.0" x2="358" y2="96.0" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-scn)" />
  <rect x="360" y="52" width="116" height="88" rx="8" fill="var(--c-soft)" stroke="none" />
  <text x="418.0" y="100.0" class="val" text-anchor="middle" style="fill:var(--c-accent)">요구사항</text>
  <line x1="64" y1="142" x2="64" y2="154" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-scn)" />
  <rect x="24" y="156" width="312" height="88" rx="8" class="card" stroke="var(--c-accent-3)" />
  <text x="38" y="180" class="lbl" style="fill:var(--c-accent-3)">02</text>
  <text x="60" y="180" class="nm">키 패스 시나리오</text>
  <text x="38" y="202" class="cap">설계 중, 화면 어휘로 과업을 단계별로 적습니다.</text>
  <text x="38" y="222" class="mid">“장보기 탭, 재료 검색, 가격 비교, 결제”</text>
  <line x1="340" y1="200.0" x2="358" y2="200.0" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-scn)" />
  <rect x="360" y="156" width="116" height="88" rx="8" fill="var(--c-soft-3)" stroke="none" />
  <text x="418.0" y="195.0" class="val" text-anchor="middle" style="fill:var(--c-accent-3)">화면 흐름</text>
  <text x="418.0" y="213.0" class="val" text-anchor="middle" style="fill:var(--c-accent-3)">와이어프레임</text>
  <line x1="64" y1="246" x2="64" y2="258" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-scn)" />
  <rect x="24" y="260" width="312" height="88" rx="8" class="card" stroke="var(--c-accent-2)" />
  <text x="38" y="284" class="lbl" style="fill:var(--c-accent-2)">03</text>
  <text x="60" y="284" class="nm">검증 시나리오</text>
  <text x="38" y="306" class="cap">설계 후, “만약 이렇다면”이라는 질문을 던집니다.</text>
  <text x="38" y="326" class="mid">“토마토 품절 연락이 오면, 알림을 늦게 보면”</text>
  <line x1="340" y1="304.0" x2="358" y2="304.0" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-scn)" />
  <rect x="360" y="260" width="116" height="88" rx="8" fill="var(--c-soft-2)" stroke="none" />
  <text x="418.0" y="299.0" class="val" text-anchor="middle" style="fill:var(--c-accent-2)">예외 흐름</text>
  <text x="418.0" y="317.0" class="val" text-anchor="middle" style="fill:var(--c-accent-2)">상태 설계</text>
  <text x="24" y="376" class="cap">컨텍스트에서 키 패스로, 키 패스에서 검증으로 구체화됩니다.</text>
</svg>
