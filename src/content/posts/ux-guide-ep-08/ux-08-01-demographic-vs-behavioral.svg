<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dvb">
  <title id="t-dvb">인구통계 페르소나와 행동 기반 페르소나</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-dvb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-dvb-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="400" />
  <text x="24" y="36" class="ttl">같은 사람, 두 가지 페르소나</text>
  <rect x="24" y="52" width="218" height="296" rx="8" class="card" stroke="var(--c-divider)" />
  <text x="38" y="74" class="nm">쓰이지 않는 페르소나</text>
  <circle cx="43" cy="96" r="2.2" fill="var(--c-muted)" />
  <text x="52" y="100" class="td">김민수, 32세</text>
  <circle cx="43" cy="118" r="2.2" fill="var(--c-muted)" />
  <text x="52" y="122" class="td">마케팅 담당자</text>
  <circle cx="43" cy="140" r="2.2" fill="var(--c-muted)" />
  <text x="52" y="144" class="td">취미는 등산</text>
  <circle cx="43" cy="162" r="2.2" fill="var(--c-muted)" />
  <text x="52" y="166" class="td">MBTI는 ENFP</text>
  <circle cx="43" cy="184" r="2.2" fill="var(--c-muted)" />
  <text x="52" y="188" class="td">서울 거주</text>
  <line x1="38" y1="218" x2="228" y2="218" stroke="var(--c-divider)" stroke-width="1" />
  <text x="38" y="242" class="cap" style="fill:var(--c-accent-2)">버튼 위치를 어디에 둘지</text>
  <text x="38" y="260" class="cap" style="fill:var(--c-accent-2)">답하지 못합니다.</text>
  <rect x="258" y="52" width="218" height="296" rx="8" class="card" stroke="var(--c-accent)" />
  <text x="272" y="74" class="nm">결정에 쓰이는 페르소나</text>
  <text x="272" y="98" class="th" style="fill:var(--c-accent)">별칭</text>
  <text x="272" y="113" class="td">급한 출퇴근형</text>
  <text x="272" y="132" class="th" style="fill:var(--c-accent)">사용 맥락</text>
  <text x="272" y="147" class="td">지하철, 한 손, 3분 안에</text>
  <text x="272" y="166" class="th" style="fill:var(--c-accent)">핵심 목표</text>
  <text x="272" y="181" class="td">어제 산 것을 다시 사기</text>
  <text x="272" y="200" class="th" style="fill:var(--c-accent)">좌절 지점</text>
  <text x="272" y="215" class="td">검색 뒤 필터 네 번</text>
  <text x="272" y="234" class="th" style="fill:var(--c-accent)">판단 기준</text>
  <text x="272" y="249" class="td">속도가 가격보다 우선</text>
  <text x="272" y="268" class="th" style="fill:var(--c-accent)">설계 시사점</text>
  <text x="272" y="283" class="td">첫 화면에 재주문, 한 손 조작</text>
  <text x="24" y="376" class="cap">인구통계는 사람을 그리고, 행동은 화면을 정합니다.</text>
</svg>
