<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="탐지부터 대응까지의 시간 흐름과 핵심 지표">
  <style>
    /* sec-theme-vars */
    :root {
      --sec-fg: #0f172a;
      --sec-fg-muted: #64748b;
      --sec-bg: #ffffff;
      --sec-border: #e2e8f0;
      --sec-slate-50: #f8fafc;
      --sec-slate-100: #f1f5f9;
      --sec-slate-200: #e2e8f0;
      --sec-slate-300: #cbd5e1;
      --sec-slate-400: #94a3b8;
      --sec-slate-500: #64748b;
      --sec-slate-700: #334155;
      --sec-blue-50: #eff6ff;
      --sec-blue-200: #bfdbfe;
      --sec-blue-500: #3b82f6;
      --sec-blue-700: #1d4ed8;
      --sec-red-50: #fef2f2;
      --sec-red-100: #fee2e2;
      --sec-red-200: #fecaca;
      --sec-red-500: #ef4444;
      --sec-red-700: #b91c1c;
      --sec-amber-50: #fffbeb;
      --sec-amber-100: #fef3c7;
      --sec-amber-200: #fde68a;
      --sec-amber-500: #f59e0b;
      --sec-amber-700: #b45309;
      --sec-emerald-50: #ecfdf5;
      --sec-emerald-100: #d1fae5;
      --sec-emerald-200: #a7f3d0;
      --sec-emerald-500: #10b981;
      --sec-emerald-700: #047857;
      --sec-violet-50: #f5f3ff;
      --sec-violet-200: #ddd6fe;
      --sec-violet-500: #8b5cf6;
      --sec-violet-700: #6d28d9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --sec-fg: #e2e8f0;
        --sec-fg-muted: #94a3b8;
        --sec-bg: #0f172a;
        --sec-border: #334155;
        --sec-slate-50: #1e293b;
        --sec-slate-100: #334155;
        --sec-slate-200: #475569;
        --sec-slate-300: #64748b;
        --sec-slate-400: #94a3b8;
        --sec-slate-500: #cbd5e1;
        --sec-slate-700: #e2e8f0;
        --sec-blue-50: #172554;
        --sec-blue-200: #1e40af;
        --sec-blue-500: #60a5fa;
        --sec-blue-700: #93c5fd;
        --sec-red-50: #450a0a;
        --sec-red-100: #7f1d1d;
        --sec-red-200: #991b1b;
        --sec-red-500: #f87171;
        --sec-red-700: #fca5a5;
        --sec-amber-50: #451a03;
        --sec-amber-100: #78350f;
        --sec-amber-200: #92400e;
        --sec-amber-500: #fbbf24;
        --sec-amber-700: #fcd34d;
        --sec-emerald-50: #022c22;
        --sec-emerald-100: #064e3b;
        --sec-emerald-200: #065f46;
        --sec-emerald-500: #34d399;
        --sec-emerald-700: #6ee7b7;
        --sec-violet-50: #2e1065;
        --sec-violet-200: #5b21b6;
        --sec-violet-500: #a78bfa;
        --sec-violet-700: #c4b5fd;
      }
    }

    .title {
      font: 600 16px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .caption {
      font: 400 11px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .stage-name {
      font: 600 13px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .stage-time {
      font: 500 10px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .desc {
      font: 400 11px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .label {
      fill: var(--sec-fg, #0f172a);
      font: 500 11px system-ui, sans-serif;
    }

    .metric-name {
      font: 700 11px system-ui, sans-serif;
    }

    .target {
      font: 600 11px system-ui, sans-serif;
      fill: var(--sec-emerald-700, #047857);
    }

    .timeline {
      stroke: var(--sec-slate-300, #cbd5e1);
      stroke-width: 2;
    }

    .stage-circle {
      fill: var(--sec-bg, #ffffff);
      stroke-width: 2.5;
    }

    .stage-incident {
      stroke: var(--sec-red-500, #ef4444);
    }

    .stage-detect {
      stroke: var(--sec-amber-500, #f59e0b);
    }

    .stage-respond {
      stroke: var(--sec-blue-500, #3b82f6);
    }

    .stage-recover {
      stroke: var(--sec-emerald-500, #10b981);
    }

    .metric-box {
      fill: var(--sec-slate-50, #f8fafc);
      stroke: var(--sec-slate-200, #e2e8f0);
    }
  </style>

  <text x="24" y="36" class="title">탐지에서 복구까지: 시간이 곧 피해 규모</text>
  <text x="24" y="56" class="caption">사고 발생 후 각 단계까지의 시간을 측정해야 어디가 약한지 압니다.</text>

  <!-- Timeline -->
  <line x1="80" y1="160" x2="640" y2="160" class="timeline" />

  <g transform="translate(-14, 0)">
    <!-- Stage 1: Incident -->
    <circle cx="100" cy="160" r="20" class="stage-circle stage-incident" />
    <text x="100" y="164" text-anchor="middle" class="metric-name" fill="var(--sec-red-700, #b91c1c)">!</text>
    <text x="100" y="118" text-anchor="middle" class="stage-name">사고 발생</text>
    <text x="100" y="200" text-anchor="middle" class="stage-time">T = 0</text>
    <text x="100" y="218" text-anchor="middle" class="desc">초기 침투</text>
    <text x="100" y="232" text-anchor="middle" class="desc">또는 이상 행동</text>

    <!-- Stage 2: Detect -->
    <circle cx="280" cy="160" r="20" class="stage-circle stage-detect" />
    <text x="280" y="164" text-anchor="middle" class="metric-name" fill="var(--sec-amber-700, #b45309)">D</text>
    <text x="280" y="118" text-anchor="middle" class="stage-name">탐지</text>
    <text x="280" y="200" text-anchor="middle" class="stage-time">+ MTTD</text>
    <text x="280" y="218" text-anchor="middle" class="desc">알림 발생</text>
    <text x="280" y="232" text-anchor="middle" class="desc">SIEM·로그·온콜</text>

    <!-- Stage 3: Respond -->
    <circle cx="460" cy="160" r="20" class="stage-circle stage-respond" />
    <text x="460" y="164" text-anchor="middle" class="metric-name" fill="var(--sec-blue-700, #1d4ed8)">R</text>
    <text x="460" y="118" text-anchor="middle" class="stage-name">대응 시작</text>
    <text x="460" y="200" text-anchor="middle" class="stage-time">+ MTTR</text>
    <text x="460" y="218" text-anchor="middle" class="desc">분석 시작</text>
    <text x="460" y="232" text-anchor="middle" class="desc">차단·격리</text>

    <!-- Stage 4: Recover -->
    <circle cx="640" cy="160" r="20" class="stage-circle stage-recover" />
    <text x="640" y="164" text-anchor="middle" class="metric-name" fill="var(--sec-emerald-700, #047857)">✓</text>
    <text x="640" y="118" text-anchor="middle" class="stage-name">복구</text>
    <text x="640" y="200" text-anchor="middle" class="stage-time">+ MTTR (full)</text>
    <text x="640" y="218" text-anchor="middle" class="desc">정상 복구 +</text>
    <text x="640" y="232" text-anchor="middle" class="desc">post-mortem</text>
  </g>

  <!-- Metrics -->
  <rect x="24" y="270" width="216" height="130" rx="10" class="metric-box" />
  <text x="40" y="294" class="metric-name" fill="var(--sec-amber-700, #b45309)">MTTD — Mean Time to Detect</text>
  <text x="40" y="312" class="desc">사고 발생부터 탐지까지 평균</text>
  <text x="40" y="334" class="label">대표 원인</text>
  <text x="40" y="350" class="desc">로그 미수집, 알림 임계 부적절,</text>
  <text x="40" y="364" class="desc">알림 피로로 무시됨</text>
  <text x="40" y="384" class="target">목표: &lt; 15분 (성숙 조직)</text>

  <rect x="252" y="270" width="216" height="130" rx="10" class="metric-box" />
  <text x="268" y="294" class="metric-name" fill="var(--sec-blue-700, #1d4ed8)">MTTR — Mean Time to Respond</text>
  <text x="268" y="312" class="desc">탐지부터 차단·격리까지 평균</text>
  <text x="268" y="334" class="label">대표 원인</text>
  <text x="268" y="350" class="desc">Playbook 없음, 권한 부재,</text>
  <text x="268" y="364" class="desc">의사결정 라인 미정의</text>
  <text x="268" y="384" class="target">목표: &lt; 1시간</text>

  <rect x="480" y="270" width="216" height="130" rx="10" class="metric-box" />
  <text x="496" y="294" class="metric-name" fill="var(--sec-emerald-700, #047857)">Dwell Time — 체류 시간</text>
  <text x="496" y="312" class="desc">공격자가 시스템 내 머문 총 시간</text>
  <text x="496" y="334" class="label">업계 평균 (2024)</text>
  <text x="496" y="350" class="desc">전 세계 약 10일</text>
  <text x="496" y="364" class="desc">국내 평균은 더 길게 보고됨</text>
  <text x="496" y="384" class="target">목표: 짧을수록 좋음</text>
</svg>