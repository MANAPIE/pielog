<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" role="img" aria-labelledby="title-tw-07-02">
  <title id="title-tw-07-02">포스트모템의 타임라인과 5 Whys</title>
  <style>
    svg {
      --c-fg: #1A1A1A;
      --c-muted: #6B6862;
      --c-accent: #2D3E78;
      --c-accent-2: #B8924A;
      --c-accent-3: #9A3B3B;
      --c-line: rgba(0, 0, 0, 0.22);
      --c-card-bg: #FBF8F1;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --c-fg: #F5F1E8;
        --c-muted: #A8A39A;
        --c-accent: #8FA3E8;
        --c-accent-2: #E6C98A;
        --c-accent-3: #D87878;
        --c-line: rgba(255, 255, 255, 0.20);
        --c-card-bg: #232326;
      }
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      fill: var(--c-fg);
    }

    .mono {
      font-family: 'Menlo', 'Consolas', monospace;
    }

    .card {
      fill: var(--c-card-bg);
      stroke: var(--c-line);
      stroke-width: 1;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: var(--c-muted);
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      fill: var(--c-accent);
    }

    .time {
      font-size: 11px;
      font-weight: 700;
      font-family: 'Menlo', monospace;
      fill: var(--c-accent);
    }

    .event {
      font-size: 12px;
    }

    .event-meta {
      font-size: 11px;
      fill: var(--c-muted);
      font-style: italic;
    }

    .tl-line {
      stroke: var(--c-muted);
      stroke-width: 1.5;
      fill: none;
    }

    .why-q {
      font-size: 12px;
      font-weight: 700;
      fill: var(--c-accent-3);
    }

    .why-a {
      font-size: 12px;
    }

    .why-line {
      stroke: var(--c-accent-3);
      fill: none;
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }

    .why-arrow {
      fill: var(--c-accent-3);
    }
  </style>

  <!-- 타임라인 섹션 -->
  <g transform="translate(20 30)">
    <text class="section-title" x="0" y="0">TIMELINE — 무엇이 일어났는가</text>
    <text class="label" x="0" y="20">감정 없이, 사실만. 시간순으로.</text>
  </g>

  <!-- 타임라인 라인 -->
  <line class="tl-line" x1="80" y1="80" x2="80" y2="290" />

  <!-- 타임라인 이벤트들 -->
  <g transform="translate(30 80)">
    <circle cx="50" cy="0" r="5" fill="var(--c-accent)" />
    <text class="time" x="-10" y="4" text-anchor="start">14:23</text>
    <text class="event" x="70" y="4">결제 서비스에 새 버전 v2.34.0 배포</text>
    <text class="event-meta" x="70" y="20">PR #4521 · 14:21 머지</text>
  </g>

  <g transform="translate(30 130)">
    <circle cx="50" cy="0" r="5" fill="var(--c-accent-3)" />
    <text class="time" x="-10" y="4" text-anchor="start">4:31</text>
    <text class="event" x="70" y="4">5xx 에러율 임계치 초과 (5%)</text>
    <text class="event-meta" x="70" y="20">PagerDuty 알람 발생, on-call 호출</text>
  </g>

  <g transform="translate(30 180)">
    <circle cx="50" cy="0" r="5" fill="var(--c-muted)" />
    <text class="time" x="-10" y="4" text-anchor="start">14:34</text>
    <text class="event" x="70" y="4">on-call 응답, 런북 절차 시작</text>
  </g>

  <g transform="translate(30 230)">
    <circle cx="50" cy="0" r="5" fill="var(--c-accent-2)" />
    <text class="time" x="-10" y="4" text-anchor="start">14:38</text>
    <text class="event" x="70" y="4">롤백 실행 (kubectl rollout undo)</text>
    <text class="event-meta" x="70" y="20">v2.33.5로 복원</text>
  </g>

  <g transform="translate(30 280)">
    <circle cx="50" cy="0" r="5" fill="var(--c-accent)" />
    <text class="time" x="-10" y="4" text-anchor="start">14:42</text>
    <text class="event" x="70" y="4">에러율 정상 복귀 (&lt; 0.1%)</text>
    <text class="event-meta" x="70" y="20">총 인시던트 시간: 11분</text>
  </g>

  <!-- 5 Whys 섹션 -->
  <line x1="20" y1="330" x2="680" y2="330" stroke="var(--c-line)" stroke-width="0.5" />

  <g transform="translate(20 360)">
    <text class="section-title" x="0" y="0">5 WHYS — 왜가 다섯 번</text>
    <text class="label" x="0" y="20">증상에서 시작해 시스템의 근원까지 거슬러 간다.</text>
  </g>

  <g transform="translate(40 410)">
    <text class="why-q" x="0" y="0">Q1.</text>
    <text class="why-a" x="32" y="0">왜 결제가 실패했나?</text>
    <text class="event-meta" x="32" y="16">→ 새 버전에서 DB 풀 사이즈가 작게 설정되어 있었음</text>
  </g>

  <g transform="translate(50 450)">
    <text class="why-q" x="0" y="0">Q2.</text>
    <text class="why-a" x="32" y="0">왜 작게 설정되어 있었나?</text>
    <text class="event-meta" x="32" y="16">→ config 변경 PR에서 환경 변수의 단위(개/MB)를 혼동</text>
  </g>

  <g transform="translate(60 490)">
    <text class="why-q" x="0" y="0">Q3.</text>
    <text class="why-a" x="32" y="0">왜 리뷰에서 못 잡았나?</text>
    <text class="event-meta" x="32" y="16">→ 단위가 변수명에 명시되지 않았고, 단위 검증 테스트가 없었음</text>
  </g>

  <g transform="translate(70 530)">
    <text class="why-q" x="0" y="0">Q4.</text>
    <text class="why-a" x="32" y="0">왜 배포 후 5xx까지 8분이 걸렸나?</text>
    <text class="event-meta" x="32" y="16">→ 카나리 배포 단계가 없고 100%로 전환되었음</text>
  </g>

  <g transform="translate(80 570)">
    <text class="why-q" x="0" y="0">Q5.</text>
    <text class="why-a" x="32" y="0">왜 카나리가 없었나?</text>
    <text class="event-meta" x="32" y="16">→ 배포 시스템 도입 시 결제 서비스가 누락. 정책 문서 없음 ← 근원</text>
  </g>
</svg>