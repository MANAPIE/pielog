<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-adj">
  <title id="t-adj">같은 그래프를 인접 리스트와 인접 행렬로 표현한 비교</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(47,125,110,0.16); --c-soft-2: rgba(194,112,61,0.16);
        --c-dim: rgba(107,114,128,0.30); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(111,195,176,0.20); --c-soft-2: rgba(224,154,107,0.20);
          --c-dim: rgba(139,146,160,0.34); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .lg { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .nd { fill: var(--c-card); stroke: var(--c-accent); stroke-width: 1.6; }
      .ndh { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .ed { stroke: var(--c-muted); stroke-width: 1.4; fill: none; }
      .edh { stroke: var(--c-accent-2); stroke-width: 2.4; fill: none; }
      .cl { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.1; }
      .wall { fill: var(--c-dim); stroke: var(--c-line); stroke-width: 1.1; }
      .st { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .m { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .kl { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
    </style>
  </defs>
  <rect class="bg" width="800" height="400"/>
  <text x="24" y="28" class="ttl">같은 그래프, 두 가지 표현</text>
  <text x="24" y="48" class="sub">정점 4개, 간선 4개(0-1, 0-2, 1-2, 2-3)인 무방향 그래프 · 간선 2-3을 색으로 따라가 봅니다</text>

  <!-- 그래프 -->
  <g transform="translate(24 62)">
    <rect width="220" height="250" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent)">그래프</text>
    <g class="ed">
      <line x1="78" y1="80" x2="142" y2="80"/>
      <line x1="60" y1="98" x2="60" y2="162"/>
      <line x1="147" y1="93" x2="73" y2="167"/>
    </g>
    <line x1="78" y1="180" x2="142" y2="180" class="edh"/>
    <circle cx="60" cy="80" r="16" class="nd"/><text x="60" y="84" class="n" text-anchor="middle">0</text>
    <circle cx="160" cy="80" r="16" class="nd"/><text x="160" y="84" class="n" text-anchor="middle">1</text>
    <circle cx="60" cy="180" r="16" class="ndh"/><text x="60" y="184" class="n" text-anchor="middle">2</text>
    <circle cx="160" cy="180" r="16" class="ndh"/><text x="160" y="184" class="n" text-anchor="middle">3</text>
    <text x="16" y="230" class="sub">간선 하나가 양쪽에 기록됩니다</text>
  </g>

  <!-- 인접 리스트 -->
  <g transform="translate(260 62)">
    <rect width="250" height="250" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent)">인접 리스트 · O(V + E)</text>
    <g transform="translate(24 44)">
      <g><rect width="26" height="26" rx="5" class="cl"/><text x="13" y="17" class="n" text-anchor="middle">0</text><text x="36" y="17" class="m">→</text><rect x="52" width="26" height="26" rx="5" class="cl"/><text x="65" y="17" class="n" text-anchor="middle">1</text><rect x="84" width="26" height="26" rx="5" class="cl"/><text x="97" y="17" class="n" text-anchor="middle">2</text></g>
      <g transform="translate(0 38)"><rect width="26" height="26" rx="5" class="cl"/><text x="13" y="17" class="n" text-anchor="middle">1</text><text x="36" y="17" class="m">→</text><rect x="52" width="26" height="26" rx="5" class="cl"/><text x="65" y="17" class="n" text-anchor="middle">0</text><rect x="84" width="26" height="26" rx="5" class="cl"/><text x="97" y="17" class="n" text-anchor="middle">2</text></g>
      <g transform="translate(0 76)"><rect width="26" height="26" rx="5" class="cl"/><text x="13" y="17" class="n" text-anchor="middle">2</text><text x="36" y="17" class="m">→</text><rect x="52" width="26" height="26" rx="5" class="cl"/><text x="65" y="17" class="n" text-anchor="middle">0</text><rect x="84" width="26" height="26" rx="5" class="cl"/><text x="97" y="17" class="n" text-anchor="middle">1</text><rect x="116" width="26" height="26" rx="5" class="st"/><text x="129" y="17" class="n" text-anchor="middle">3</text></g>
      <g transform="translate(0 114)"><rect width="26" height="26" rx="5" class="cl"/><text x="13" y="17" class="n" text-anchor="middle">3</text><text x="36" y="17" class="m">→</text><rect x="52" width="26" height="26" rx="5" class="st"/><text x="65" y="17" class="n" text-anchor="middle">2</text></g>
    </g>
    <text x="16" y="206" class="lg">정점마다 이어진 정점만 적습니다</text>
    <text x="16" y="230" class="sub">칸 수 = 간선 수 × 2 = 8</text>
  </g>

  <!-- 인접 행렬 -->
  <g transform="translate(526 62)">
    <rect width="250" height="250" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent)">인접 행렬 · O(V²)</text>
    <g transform="translate(60 44)">
      <text x="15" y="-6" class="m" text-anchor="middle">0</text><text x="47" y="-6" class="m" text-anchor="middle">1</text><text x="79" y="-6" class="m" text-anchor="middle">2</text><text x="111" y="-6" class="m" text-anchor="middle">3</text>
      <text x="-10" y="20" class="m" text-anchor="end">0</text><text x="-10" y="52" class="m" text-anchor="end">1</text><text x="-10" y="84" class="m" text-anchor="end">2</text><text x="-10" y="116" class="m" text-anchor="end">3</text>
      <g>
        <rect x="0" y="0" width="30" height="30" rx="4" class="cl"/><text x="15" y="20" class="n" text-anchor="middle">0</text>
        <rect x="32" y="0" width="30" height="30" rx="4" class="cl"/><text x="47" y="20" class="n" text-anchor="middle">1</text>
        <rect x="64" y="0" width="30" height="30" rx="4" class="cl"/><text x="79" y="20" class="n" text-anchor="middle">1</text>
        <rect x="96" y="0" width="30" height="30" rx="4" class="cl"/><text x="111" y="20" class="n" text-anchor="middle">0</text>
        <rect x="0" y="32" width="30" height="30" rx="4" class="cl"/><text x="15" y="52" class="n" text-anchor="middle">1</text>
        <rect x="32" y="32" width="30" height="30" rx="4" class="cl"/><text x="47" y="52" class="n" text-anchor="middle">0</text>
        <rect x="64" y="32" width="30" height="30" rx="4" class="cl"/><text x="79" y="52" class="n" text-anchor="middle">1</text>
        <rect x="96" y="32" width="30" height="30" rx="4" class="cl"/><text x="111" y="52" class="n" text-anchor="middle">0</text>
        <rect x="0" y="64" width="30" height="30" rx="4" class="cl"/><text x="15" y="84" class="n" text-anchor="middle">1</text>
        <rect x="32" y="64" width="30" height="30" rx="4" class="cl"/><text x="47" y="84" class="n" text-anchor="middle">1</text>
        <rect x="64" y="64" width="30" height="30" rx="4" class="cl"/><text x="79" y="84" class="n" text-anchor="middle">0</text>
        <rect x="96" y="64" width="30" height="30" rx="4" class="st"/><text x="111" y="84" class="n" text-anchor="middle">1</text>
        <rect x="0" y="96" width="30" height="30" rx="4" class="cl"/><text x="15" y="116" class="n" text-anchor="middle">0</text>
        <rect x="32" y="96" width="30" height="30" rx="4" class="cl"/><text x="47" y="116" class="n" text-anchor="middle">0</text>
        <rect x="64" y="96" width="30" height="30" rx="4" class="st"/><text x="79" y="116" class="n" text-anchor="middle">1</text>
        <rect x="96" y="96" width="30" height="30" rx="4" class="cl"/><text x="111" y="116" class="n" text-anchor="middle">0</text>
      </g>
    </g>
    <text x="16" y="206" class="lg">모든 정점 쌍에 칸이 있습니다</text>
    <text x="16" y="230" class="sub">칸 수 = 정점 수² = 16, 대부분 0</text>
  </g>

  <text x="24" y="344" class="sub">리스트는 이어진 것만 저장하고, 행렬은 모든 쌍을 칸으로 가집니다. 정점이 십만 개면 행렬은 백억 칸입니다.</text>
  <text x="24" y="364" class="sub">두 정점이 이어졌는지 확인하는 비용은 행렬이 O(1), 리스트가 O(차수)입니다. 밀도가 선택을 정합니다.</text>
</svg>
