<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-dfsbfs">
  <title id="t-dfsbfs">같은 격자에서 깊이 우선 탐색과 너비 우선 탐색의 방문 순서 비교</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-l0: rgba(47,125,110,0.42); --c-l1: rgba(47,125,110,0.30);
        --c-l2: rgba(47,125,110,0.20); --c-l3: rgba(47,125,110,0.10);
        --c-soft-2: rgba(194,112,61,0.14); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-l0: rgba(111,195,176,0.46); --c-l1: rgba(111,195,176,0.32);
          --c-l2: rgba(111,195,176,0.22); --c-l3: rgba(111,195,176,0.12);
          --c-soft-2: rgba(224,154,107,0.18); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .cl { fill: var(--c-card); fill-opacity: 0.55; stroke: var(--c-line); stroke-width: 1.1; }
      .st { fill: var(--c-soft-2); fill-opacity: 0.7; stroke: var(--c-accent-2); stroke-width: 2; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .path { stroke: var(--c-accent-2); stroke-width: 2; fill: none; stroke-linejoin: round; }
      .lg { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .cap { font-family: 'Inter',system-ui,sans-serif; font-size: 10px; font-weight: 700; fill: var(--c-muted); }
    </style>
    <marker id="d-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-2)"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="520"/>

  <text x="24" y="28" class="ttl">같은 격자, 같은 시작점인데 순서만 다릅니다</text>
  <text x="24" y="48" class="sub">둘 다 모든 칸을 한 번씩 봅니다. 무엇을 보장하느냐가 다릅니다.</text>

  <!-- DFS -->
  <g transform="translate(24 66)">
    <rect width="366" height="318" rx="8" class="pane"/>
    <text x="18" y="26" class="hd" fill="var(--c-accent-2)">DFS · 한 방향으로 끝까지</text>

    <g transform="translate(91 46)">
      <rect width="46" height="46" rx="4" class="st"/>
      <rect y="46" width="46" height="46" rx="4" class="cl"/>
      <rect y="92" width="46" height="46" rx="4" class="cl"/>
      <rect y="138" width="46" height="46" rx="4" class="cl"/>
      <rect x="46" y="138" width="46" height="46" rx="4" class="cl"/>
      <rect x="46" y="92" width="46" height="46" rx="4" class="cl"/>
      <rect x="46" y="46" width="46" height="46" rx="4" class="cl"/>
      <rect x="46" width="46" height="46" rx="4" class="cl"/>
      <rect x="92" width="46" height="46" rx="4" class="cl"/>
      <rect x="92" y="46" width="46" height="46" rx="4" class="cl"/>
      <rect x="92" y="92" width="46" height="46" rx="4" class="cl"/>
      <rect x="92" y="138" width="46" height="46" rx="4" class="cl"/>
      <rect x="138" y="138" width="46" height="46" rx="4" class="cl"/>
      <rect x="138" y="92" width="46" height="46" rx="4" class="cl"/>
      <rect x="138" y="46" width="46" height="46" rx="4" class="cl"/>
      <rect x="138" width="46" height="46" rx="4" class="cl"/>
      <path class="path" d="M23 46 L 23 161 L 69 161 L 69 23 L 115 23 L 115 161 L 161 161 L 161 46" marker-end="url(#d-a)"/>
      <text x="23" y="28" class="n" text-anchor="middle">1</text>
      <text x="23" y="74" class="n" text-anchor="middle">2</text>
      <text x="23" y="120" class="n" text-anchor="middle">3</text>
      <text x="23" y="166" class="n" text-anchor="middle">4</text>
      <text x="69" y="166" class="n" text-anchor="middle">5</text>
      <text x="69" y="120" class="n" text-anchor="middle">6</text>
      <text x="69" y="74" class="n" text-anchor="middle">7</text>
      <text x="69" y="28" class="n" text-anchor="middle">8</text>
      <text x="115" y="28" class="n" text-anchor="middle">9</text>
      <text x="115" y="74" class="n" text-anchor="middle">10</text>
      <text x="115" y="120" class="n" text-anchor="middle">11</text>
      <text x="115" y="166" class="n" text-anchor="middle">12</text>
      <text x="161" y="166" class="n" text-anchor="middle">13</text>
      <text x="161" y="120" class="n" text-anchor="middle">14</text>
      <text x="161" y="74" class="n" text-anchor="middle">15</text>
      <text x="161" y="28" class="n" text-anchor="middle">16</text>
    </g>
    <text x="18" y="266" class="cap">되돌아오는 지점이 생깁니다</text>
    <text x="18" y="292" class="lg">경로가 있는지, 몇 덩어리인지 판별할 때</text>
  </g>

  <!-- BFS -->
  <g transform="translate(410 66)">
    <rect width="366" height="318" rx="8" class="pane"/>
    <text x="18" y="26" class="hd" fill="var(--c-accent)">BFS · 가까운 곳부터 층으로</text>

    <g transform="translate(91 46)">
      <g><rect width="46" height="46" rx="4" class="st"/><text x="23" y="28" class="n" text-anchor="middle">0</text></g>
      <g transform="translate(46 0)"><rect width="46" height="46" rx="4" fill="var(--c-l0)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">1</text></g>
      <g transform="translate(0 46)"><rect width="46" height="46" rx="4" fill="var(--c-l0)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">1</text></g>

      <g transform="translate(92 0)"><rect width="46" height="46" rx="4" fill="var(--c-l1)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">2</text></g>
      <g transform="translate(46 46)"><rect width="46" height="46" rx="4" fill="var(--c-l1)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">2</text></g>
      <g transform="translate(0 92)"><rect width="46" height="46" rx="4" fill="var(--c-l1)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">2</text></g>

      <g transform="translate(138 0)"><rect width="46" height="46" rx="4" fill="var(--c-l2)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">3</text></g>
      <g transform="translate(92 46)"><rect width="46" height="46" rx="4" fill="var(--c-l2)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">3</text></g>
      <g transform="translate(46 92)"><rect width="46" height="46" rx="4" fill="var(--c-l2)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">3</text></g>
      <g transform="translate(0 138)"><rect width="46" height="46" rx="4" fill="var(--c-l2)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">3</text></g>

      <g transform="translate(138 46)"><rect width="46" height="46" rx="4" fill="var(--c-l3)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">4</text></g>
      <g transform="translate(92 92)"><rect width="46" height="46" rx="4" fill="var(--c-l3)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">4</text></g>
      <g transform="translate(46 138)"><rect width="46" height="46" rx="4" fill="var(--c-l3)" stroke="var(--c-accent)" stroke-width="1.1"/><text x="23" y="28" class="n" text-anchor="middle">4</text></g>

      <g transform="translate(138 92)"><rect width="46" height="46" rx="4" class="cl"/><text x="23" y="28" class="n" text-anchor="middle">5</text></g>
      <g transform="translate(92 138)"><rect width="46" height="46" rx="4" class="cl"/><text x="23" y="28" class="n" text-anchor="middle">5</text></g>

      <g transform="translate(138 138)"><rect width="46" height="46" rx="4" class="cl"/><text x="23" y="28" class="n" text-anchor="middle">6</text></g>
    </g>
    <text x="18" y="266" class="cap">숫자는 시작점으로부터의 거리입니다</text>
    <text x="18" y="292" class="lg">최단 거리를 물을 때, 단 간선 비용이 모두 같을 때만</text>
  </g>

  <g transform="translate(24 400)">
    <rect width="752" height="84" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="20" y="30" class="ttl" font-size="13">무엇을 보장받아야 하는지로 고릅니다</text>
    <text x="20" y="54" class="sub">DFS는 재귀로 짧게 쓰지만 깊이가 깊으면 스택이 넘칩니다. 방문 순서에 의미가 없습니다.</text>
    <text x="20" y="74" class="sub">BFS는 큐가 필요해 메모리를 더 쓰지만, 먼저 도착한 경로가 최단이라는 것을 보장합니다.</text>
  </g>
</svg>
