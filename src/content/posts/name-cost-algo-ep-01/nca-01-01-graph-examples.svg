<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-gex">
  <title id="t-gex">미로 격자, 작업 의존성, 숫자 상태 공간을 그래프로 읽는 세 가지 예</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(47,125,110,0.16); --c-soft-2: rgba(194,112,61,0.16);
        --c-dim: rgba(107,114,128,0.30); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(111,195,176,0.20); --c-soft-2: rgba(224,154,107,0.20);
          --c-dim: rgba(139,146,160,0.34); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .lg { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .nd { fill: var(--c-card); stroke: var(--c-accent); stroke-width: 1.6; }
      .ndh { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .ed { stroke: var(--c-muted); stroke-width: 1.4; fill: none; }
      .edh { stroke: var(--c-accent-2); stroke-width: 2.4; fill: none; }
      .cl { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.1; }
      .wall { fill: var(--c-dim); stroke: var(--c-line); stroke-width: 1.1; }
      .st { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .m { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .kl { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
    </style>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)"/></marker>
    <marker id="arh" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-2)"/></marker>
  </defs>
  <rect class="bg" width="800" height="380"/>
  <text x="24" y="28" class="ttl">관계가 있으면 그래프입니다</text>
  <text x="24" y="48" class="sub">서로 다른 세 문제를 정점과 간선으로 읽습니다</text>

  <!-- A. 미로 격자 -->
  <g transform="translate(24 62)">
    <rect width="236" height="262" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent)">미로 격자</text>
    <g transform="translate(54 44)">
      <rect x="0" y="0" width="40" height="40" rx="4" class="cl"/><rect x="44" y="0" width="40" height="40" rx="4" class="cl"/><rect x="88" y="0" width="40" height="40" rx="4" class="cl"/>
      <rect x="0" y="44" width="40" height="40" rx="4" class="cl"/><rect x="44" y="44" width="40" height="40" rx="4" class="wall"/><rect x="88" y="44" width="40" height="40" rx="4" class="cl"/>
      <rect x="0" y="88" width="40" height="40" rx="4" class="cl"/><rect x="44" y="88" width="40" height="40" rx="4" class="cl"/><rect x="88" y="88" width="40" height="40" rx="4" class="cl"/>
      <g class="ed">
        <line x1="20" y1="20" x2="64" y2="20"/><line x1="64" y1="20" x2="108" y2="20"/>
        <line x1="20" y1="20" x2="20" y2="64"/><line x1="108" y1="20" x2="108" y2="64"/>
        <line x1="20" y1="64" x2="20" y2="108"/><line x1="108" y1="64" x2="108" y2="108"/>
        <line x1="20" y1="108" x2="64" y2="108"/><line x1="64" y1="108" x2="108" y2="108"/>
      </g>
      <circle cx="20" cy="20" r="5" class="nd"/><circle cx="64" cy="20" r="5" class="nd"/><circle cx="108" cy="20" r="5" class="nd"/>
      <circle cx="20" cy="64" r="5" class="nd"/><circle cx="108" cy="64" r="5" class="nd"/>
      <circle cx="20" cy="108" r="5" class="nd"/><circle cx="64" cy="108" r="5" class="nd"/><circle cx="108" cy="108" r="5" class="nd"/>
      <text x="64" y="68" class="m" text-anchor="middle">벽</text>
    </g>
    <text x="16" y="206" class="lg">칸이 정점,</text>
    <text x="16" y="224" class="lg">이동 가능한 인접 칸이 간선</text>
    <text x="16" y="244" class="sub">벽은 정점이 없고 간선도 없습니다</text>
  </g>

  <!-- B. 작업 의존성 -->
  <g transform="translate(276 62)">
    <rect width="236" height="262" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent)">작업 의존성</text>
    <g class="ed" marker-end="url(#ar)">
      <line x1="105" y1="74" x2="72" y2="107"/>
      <line x1="131" y1="74" x2="164" y2="107"/>
      <line x1="71" y1="134" x2="104" y2="167"/>
      <line x1="165" y1="134" x2="132" y2="167"/>
    </g>
    <g><rect x="90" y="48" width="56" height="26" rx="6" class="nd"/><text x="118" y="65" class="kl" text-anchor="middle">스키마</text></g>
    <g><rect x="30" y="108" width="56" height="26" rx="6" class="nd"/><text x="58" y="125" class="kl" text-anchor="middle">API</text></g>
    <g><rect x="150" y="108" width="56" height="26" rx="6" class="nd"/><text x="178" y="125" class="kl" text-anchor="middle">화면</text></g>
    <g><rect x="90" y="168" width="56" height="26" rx="6" class="nd"/><text x="118" y="185" class="kl" text-anchor="middle">배포</text></g>
    <text x="16" y="206" class="lg">작업이 정점,</text>
    <text x="16" y="224" class="lg">선행 조건이 방향 간선</text>
    <text x="16" y="244" class="sub">화살표 방향이 순서를 정합니다</text>
  </g>

  <!-- C. 숫자 상태 공간 -->
  <g transform="translate(528 62)">
    <rect width="236" height="262" rx="8" class="pane"/>
    <text x="16" y="24" class="hd" fill="var(--c-accent)">숫자 상태 공간</text>
    <text x="220" y="24" class="m" text-anchor="end">시작 2 · 목표 6</text>
    <g class="ed" marker-end="url(#ar)">
      <line x1="128" y1="66" x2="167" y2="102"/>
      <line x1="178" y1="126" x2="178" y2="153"/>
    </g>
    <g class="edh" marker-end="url(#arh)">
      <line x1="108" y1="66" x2="69" y2="102"/>
      <line x1="58" y1="126" x2="58" y2="153"/>
    </g>
    <circle cx="118" cy="56" r="14" class="nd"/><text x="118" y="60" class="n" text-anchor="middle">2</text>
    <circle cx="58" cy="112" r="14" class="ndh"/><text x="58" y="116" class="n" text-anchor="middle">3</text>
    <circle cx="178" cy="112" r="14" class="nd"/><text x="178" y="116" class="n" text-anchor="middle">4</text>
    <circle cx="58" cy="168" r="14" class="ndh"/><text x="58" y="172" class="n" text-anchor="middle">6</text>
    <circle cx="178" cy="168" r="14" class="nd"/><text x="178" y="172" class="n" text-anchor="middle">5</text>
    <text x="72" y="82" class="m" text-anchor="end">+1</text>
    <text x="164" y="82" class="m">×2</text>
    <text x="70" y="144" class="m">×2</text>
    <text x="190" y="144" class="m">+1</text>
    <text x="16" y="206" class="lg">숫자가 정점,</text>
    <text x="16" y="224" class="lg">연산 한 번이 간선</text>
    <text x="16" y="244" class="sub">2에서 6까지 최소 두 번의 연산입니다</text>
  </g>

  <text x="24" y="354" class="sub">무엇을 정점으로 두고 무엇을 간선으로 볼지는 문제를 읽는 사람이 정합니다. 그래프로 읽는 순간 같은 탐색 도구를 쓸 수 있습니다.</text>
</svg>
