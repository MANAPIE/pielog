<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" width="500" height="460" role="img" aria-labelledby="title">
<title id="title">문자열이 객체로 되살아나 명령까지 가는 과정</title>
<defs><style>
:root{--c-bg:#FAFAF7;--c-fg:#1A1F2E;--c-muted:#6B7280;--c-accent:#B42318;--c-accent-2:#1D4ED8;--c-line:#C9CDD3;--c-card:#FFFFFF;--c-soft:#FEF3F2;--c-soft-2:#EFF6FF;--c-divider:#E5E7EB}
@media (prefers-color-scheme: dark){:root{--c-bg:#0F1419;--c-fg:#E8E6E1;--c-muted:#8B92A0;--c-accent:#EF6A5E;--c-accent-2:#5B9CF6;--c-line:#3A4250;--c-card:#161B22;--c-soft:#2A1514;--c-soft-2:#14213D;--c-divider:#273041}}
text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;fill:var(--c-fg)}
.mono{font-family:'JetBrains Mono',Menlo,Consolas,'Noto Sans Mono CJK KR',monospace}
.t{font-size:15px;font-weight:700}
.h{font-size:13px;font-weight:700}
.l{font-size:12.5px}
.s{font-size:11.5px;fill:var(--c-muted)}
.b{font-weight:700}
.fa{fill:var(--c-accent)}
.fa2{fill:var(--c-accent-2)}
.fm{fill:var(--c-muted)}
.bg{fill:var(--c-bg)}
.card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1}
.soft{fill:var(--c-soft);stroke:var(--c-accent);stroke-width:1.2}
.soft2{fill:var(--c-soft-2);stroke:var(--c-accent-2);stroke-width:1.2}
.plain{fill:none;stroke:var(--c-line);stroke-width:1}
.ln{stroke:var(--c-fg);stroke-width:1.4;fill:none}
.lnm{stroke:var(--c-muted);stroke-width:1.2;fill:none}
.lna{stroke:var(--c-accent);stroke-width:1.6;fill:none}
.lna2{stroke:var(--c-accent-2);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:4 3}
.grid{stroke:var(--c-divider);stroke-width:1}
.bar{fill:var(--c-accent)}
.mk{fill:var(--c-fg)}
.mkm{fill:var(--c-muted)}
.mka{fill:var(--c-accent)}
.mka2{fill:var(--c-accent-2)}
</style><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker><marker id="mkm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkm"/></marker><marker id="mka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka"/></marker><marker id="mka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka2"/></marker></defs>
<rect class="bg" x="0" y="0" width="500" height="460"/>
<text class="t" x="24" y="38">문자열이 객체로 되살아나 명령까지 가는 과정</text>
<g class="box"><rect class="card" x="24" y="60" width="140" height="48" rx="8"/>
<text class="l b" x="94" y="80" text-anchor="middle">React Flight 요청</text>
<text class="s" x="94" y="97" text-anchor="middle">React2Shell</text></g><g class="box"><rect class="card" x="180" y="60" width="140" height="48" rx="8"/>
<text class="l b" x="250" y="80" text-anchor="middle">Livewire 상태 업데이트</text>
<text class="s" x="250" y="97" text-anchor="middle">CVE-2025-54068</text></g><g class="box"><rect class="card" x="336" y="60" width="140" height="48" rx="8"/>
<text class="l b" x="406" y="80" text-anchor="middle">Reverb Redis 메시지</text>
<text class="s" x="406" y="97" text-anchor="middle">CVE-2026-23524</text></g><line class="ln" x1="94" y1="108" x2="203.2" y2="134" marker-end="url(#mk)"/><line class="ln" x1="250" y1="108" x2="250" y2="134" marker-end="url(#mk)"/><line class="ln" x1="406" y1="108" x2="296.8" y2="134" marker-end="url(#mk)"/><g class="box"><rect class="card" x="24" y="136" width="452" height="44" rx="8"/>
<text class="l b" x="250" y="162.5" text-anchor="middle">역직렬화: 밖에서 온 문자열을 객체로 되살림</text></g><line class="ln" x1="250" y1="180" x2="250" y2="204" marker-end="url(#mk)"/><g class="box"><rect class="card" x="24" y="206" width="452" height="64" rx="8"/>
<text class="l b" x="250" y="225.5" text-anchor="middle">되살리는 도중 자동으로 불리는 코드</text>
<text class="s" x="250" y="242.5" text-anchor="middle">PHP: __wakeup·__destruct 같은 매직 메서드</text>
<text class="s" x="250" y="259.5" text-anchor="middle">JavaScript: 프로토타입 체인을 따라 닿는 생성자</text></g><line class="ln" x1="250" y1="270" x2="250" y2="294" marker-end="url(#mk)"/><text class="s" x="24" y="310" text-anchor="start">가젯 체인: 원래는 무해한 코드 조각을 이어 붙인 연쇄</text><g class="box"><rect class="card" x="24" y="320" width="94" height="40" rx="8"/>
<text class="l" x="71" y="344.5" text-anchor="middle">조각 1</text></g><line class="ln" x1="118" y1="340" x2="132" y2="340" marker-end="url(#mk)"/><g class="box"><rect class="card" x="134" y="320" width="94" height="40" rx="8"/>
<text class="l" x="181" y="344.5" text-anchor="middle">조각 2</text></g><line class="ln" x1="228" y1="340" x2="242" y2="340" marker-end="url(#mk)"/><g class="box"><rect class="card" x="244" y="320" width="94" height="40" rx="8"/>
<text class="l" x="291" y="344.5" text-anchor="middle">조각 3</text></g><line class="ln" x1="338" y1="340" x2="352" y2="340" marker-end="url(#mk)"/><g class="box"><rect class="soft" x="354" y="320" width="122" height="40" rx="8"/>
<text class="l b fa" x="415" y="344.5" text-anchor="middle">시스템 명령 실행</text></g><g class="box"><rect class="soft2" x="24" y="384" width="452" height="56" rx="8"/>
<text class="l" x="250" y="408" text-anchor="middle">JSON.parse·json_decode는 문자열·숫자·배열 같은 값만 만들고</text>
<text class="l" x="250" y="425" text-anchor="middle">코드를 부르지 않아 이 연쇄가 시작되지 않음</text></g>
</svg>
