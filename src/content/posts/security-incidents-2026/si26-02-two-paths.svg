<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 484" width="500" height="484" role="img" aria-labelledby="title">
<title id="title">공격이 들어오는 두 갈래 길</title>
<defs><style>
:root{--c-bg:#FAFAF7;--c-fg:#1A1F2E;--c-muted:#6B7280;--c-accent:#B42318;--c-accent-2:#1D4ED8;--c-line:#C9CDD3;--c-card:#FFFFFF;--c-soft:#FEF3F2;--c-soft-2:#EFF6FF;--c-divider:#E5E7EB}
@media (prefers-color-scheme: dark){:root{--c-bg:#0F1419;--c-fg:#E8E6E1;--c-muted:#8B92A0;--c-accent:#EF6A5E;--c-accent-2:#5B9CF6;--c-line:#3A4250;--c-card:#161B22;--c-soft:#2A1514;--c-soft-2:#14213D;--c-divider:#273041}}
text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;fill:var(--c-fg)}
.mono{font-family:'JetBrains Mono',Menlo,Consolas,'Noto Sans Mono CJK KR',monospace}
.t{font-size:15px;font-weight:700}
.h{font-size:13px;font-weight:700}
.l{font-size:12.5px}
.s{font-size:11.5px;fill:var(--c-muted)}
.b{font-weight:700}
.fa{fill:var(--c-accent)}
.fa2{fill:var(--c-accent-2)}
.fm{fill:var(--c-muted)}
.bg{fill:var(--c-bg)}
.card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1}
.soft{fill:var(--c-soft);stroke:var(--c-accent);stroke-width:1.2}
.soft2{fill:var(--c-soft-2);stroke:var(--c-accent-2);stroke-width:1.2}
.plain{fill:none;stroke:var(--c-line);stroke-width:1}
.ln{stroke:var(--c-fg);stroke-width:1.4;fill:none}
.lnm{stroke:var(--c-muted);stroke-width:1.2;fill:none}
.lna{stroke:var(--c-accent);stroke-width:1.6;fill:none}
.lna2{stroke:var(--c-accent-2);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:4 3}
.grid{stroke:var(--c-divider);stroke-width:1}
.bar{fill:var(--c-accent)}
.mk{fill:var(--c-fg)}
.mkm{fill:var(--c-muted)}
.mka{fill:var(--c-accent)}
.mka2{fill:var(--c-accent-2)}
</style><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker><marker id="mkm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkm"/></marker><marker id="mka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka"/></marker><marker id="mka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka2"/></marker></defs>
<rect class="bg" x="0" y="0" width="500" height="484"/>
<text class="t" x="24" y="38">공격이 들어오는 두 갈래 길</text>
<text class="h" x="131" y="66" text-anchor="middle">운영 중인 서비스로</text>
<text class="h" x="131" y="84" text-anchor="middle">들어오는 요청</text><text class="h" x="369" y="66" text-anchor="middle">서비스를 만드는 과정으로</text>
<text class="h" x="369" y="84" text-anchor="middle">들어오는 코드</text><g class="box"><rect class="card" x="24" y="104" width="214" height="66" rx="8"/>
<text class="s b fm" x="131" y="124.5" text-anchor="middle">입구</text>
<text class="l b" x="131" y="141.5" text-anchor="middle">사용자 요청</text>
<text class="s" x="131" y="158.5" text-anchor="middle">본문·헤더·업로드 파일</text></g><g class="box"><rect class="card" x="24" y="192" width="214" height="66" rx="8"/>
<text class="s b fa" x="131" y="212.5" text-anchor="middle">런타임 층</text>
<text class="l b" x="131" y="229.5" text-anchor="middle">PHP 엔진·Node.js</text>
<text class="s" x="131" y="246.5" text-anchor="middle">PHP2Shell, Brotli 디코더</text></g><g class="box"><rect class="card" x="24" y="280" width="214" height="66" rx="8"/>
<text class="s b fa" x="131" y="300.5" text-anchor="middle">프레임워크·라이브러리 층</text>
<text class="l b" x="131" y="317.5" text-anchor="middle">React·Laravel·Nuxt·플러그인</text>
<text class="s" x="131" y="334.5" text-anchor="middle">역직렬화, 템플릿 실행, 인증 우회</text></g><g class="box"><rect class="card" x="24" y="368" width="214" height="66" rx="8"/>
<text class="s b fm" x="131" y="388.5" text-anchor="middle">도착점</text>
<text class="l b" x="131" y="405.5" text-anchor="middle">애플리케이션 코드·데이터</text>
<text class="s" x="131" y="422.5" text-anchor="middle">DB, 세션, 비밀값</text></g><g class="box"><rect class="card" x="262" y="104" width="214" height="66" rx="8"/>
<text class="s b fa" x="369" y="124.5" text-anchor="middle">공급망 층</text>
<text class="l b" x="369" y="141.5" text-anchor="middle">패키지 저장소</text>
<text class="s" x="369" y="158.5" text-anchor="middle">npm, Packagist, GitHub</text></g><g class="box"><rect class="card" x="262" y="192" width="214" height="66" rx="8"/>
<text class="s b fa" x="369" y="212.5" text-anchor="middle">작업 환경·AI 층</text>
<text class="l b" x="369" y="229.5" text-anchor="middle">개발자 PC와 AI 도구</text>
<text class="s" x="369" y="246.5" text-anchor="middle">토큰, SSH 키, 에이전트</text></g><g class="box"><rect class="card" x="262" y="280" width="214" height="66" rx="8"/>
<text class="s b fa" x="369" y="300.5" text-anchor="middle">작업 환경 층</text>
<text class="l b" x="369" y="317.5" text-anchor="middle">CI 빌드 서버</text>
<text class="s" x="369" y="334.5" text-anchor="middle">배포 토큰, 클라우드 키</text></g><g class="box"><rect class="card" x="262" y="368" width="214" height="66" rx="8"/>
<text class="s b fa" x="369" y="388.5" text-anchor="middle">작업 환경 층</text>
<text class="l b" x="369" y="405.5" text-anchor="middle">배포 산출물</text>
<text class="s" x="369" y="422.5" text-anchor="middle">개발용 파일, 설정값</text></g><line class="ln" x1="131" y1="170" x2="131" y2="190" marker-end="url(#mk)"/><line class="ln" x1="369" y1="170" x2="369" y2="190" marker-end="url(#mk)"/><line class="ln" x1="131" y1="258" x2="131" y2="278" marker-end="url(#mk)"/><line class="ln" x1="369" y1="258" x2="369" y2="278" marker-end="url(#mk)"/><line class="ln" x1="131" y1="346" x2="131" y2="366" marker-end="url(#mk)"/><line class="ln" x1="369" y1="346" x2="369" y2="366" marker-end="url(#mk)"/><line class="ln" x1="262" y1="401" x2="240" y2="401" marker-end="url(#mk)"/><text class="s" x="250" y="466" text-anchor="middle">배포된 코드는 운영 서비스의 일부가 되고, 두 길은 같은 서버에서 만납니다</text>
</svg>
