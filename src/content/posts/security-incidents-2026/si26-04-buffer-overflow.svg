<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 410" width="500" height="410" role="img" aria-labelledby="title">
<title id="title">정해진 칸을 넘어 써지는 압축 해제</title>
<defs><style>
:root{--c-bg:#FAFAF7;--c-fg:#1A1F2E;--c-muted:#6B7280;--c-accent:#B42318;--c-accent-2:#1D4ED8;--c-line:#C9CDD3;--c-card:#FFFFFF;--c-soft:#FEF3F2;--c-soft-2:#EFF6FF;--c-divider:#E5E7EB}
@media (prefers-color-scheme: dark){:root{--c-bg:#0F1419;--c-fg:#E8E6E1;--c-muted:#8B92A0;--c-accent:#EF6A5E;--c-accent-2:#5B9CF6;--c-line:#3A4250;--c-card:#161B22;--c-soft:#2A1514;--c-soft-2:#14213D;--c-divider:#273041}}
text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;fill:var(--c-fg)}
.mono{font-family:'JetBrains Mono',Menlo,Consolas,'Noto Sans Mono CJK KR',monospace}
.t{font-size:15px;font-weight:700}
.h{font-size:13px;font-weight:700}
.l{font-size:12.5px}
.s{font-size:11.5px;fill:var(--c-muted)}
.b{font-weight:700}
.fa{fill:var(--c-accent)}
.fa2{fill:var(--c-accent-2)}
.fm{fill:var(--c-muted)}
.bg{fill:var(--c-bg)}
.card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1}
.soft{fill:var(--c-soft);stroke:var(--c-accent);stroke-width:1.2}
.soft2{fill:var(--c-soft-2);stroke:var(--c-accent-2);stroke-width:1.2}
.plain{fill:none;stroke:var(--c-line);stroke-width:1}
.ln{stroke:var(--c-fg);stroke-width:1.4;fill:none}
.lnm{stroke:var(--c-muted);stroke-width:1.2;fill:none}
.lna{stroke:var(--c-accent);stroke-width:1.6;fill:none}
.lna2{stroke:var(--c-accent-2);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:4 3}
.grid{stroke:var(--c-divider);stroke-width:1}
.bar{fill:var(--c-accent)}
.mk{fill:var(--c-fg)}
.mkm{fill:var(--c-muted)}
.mka{fill:var(--c-accent)}
.mka2{fill:var(--c-accent-2)}
</style><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker><marker id="mkm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkm"/></marker><marker id="mka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka"/></marker><marker id="mka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka2"/></marker></defs>
<rect class="bg" x="0" y="0" width="500" height="410"/>
<text class="t" x="24" y="38">정해진 칸을 넘어 써지는 압축 해제</text>
<g class="box"><rect class="card" x="24" y="60" width="452" height="40" rx="8"/>
<text class="l" x="250" y="84.5" text-anchor="middle">공격자가 만든 Brotli 압축 데이터 (요청 본문, 받아 온 응답, 파일)</text></g><line class="ln" x1="250" y1="100" x2="250" y2="122" marker-end="url(#mk)"/><g class="box"><rect class="card" x="24" y="124" width="452" height="52" rx="8"/>
<text class="l b" x="250" y="146" text-anchor="middle">Node.js에 내장된 Brotli 디코더</text>
<text class="s" x="250" y="163" text-anchor="middle">잘못된 블록 전환을 형식 오류가 아닌 "입력 대기"로 처리하고 계속 씀</text></g><line class="ln" x1="250" y1="176" x2="250" y2="196" marker-end="url(#mk)"/><text class="s" x="40" y="204" text-anchor="start">작은 버퍼 (8바이트)</text><text class="s b fa" x="376" y="204" text-anchor="start">바로 옆 메모리</text><g class="box"><rect class="card" x="40" y="214" width="38" height="40" rx="4"/><text class="s" x="59" y="239" text-anchor="middle">1</text></g><g class="box"><rect class="card" x="82" y="214" width="38" height="40" rx="4"/><text class="s" x="101" y="239" text-anchor="middle">2</text></g><g class="box"><rect class="card" x="124" y="214" width="38" height="40" rx="4"/><text class="s" x="143" y="239" text-anchor="middle">3</text></g><g class="box"><rect class="card" x="166" y="214" width="38" height="40" rx="4"/><text class="s" x="185" y="239" text-anchor="middle">4</text></g><g class="box"><rect class="card" x="208" y="214" width="38" height="40" rx="4"/><text class="s" x="227" y="239" text-anchor="middle">5</text></g><g class="box"><rect class="card" x="250" y="214" width="38" height="40" rx="4"/><text class="s" x="269" y="239" text-anchor="middle">6</text></g><g class="box"><rect class="card" x="292" y="214" width="38" height="40" rx="4"/><text class="s" x="311" y="239" text-anchor="middle">7</text></g><g class="box"><rect class="card" x="334" y="214" width="38" height="40" rx="4"/><text class="s" x="353" y="239" text-anchor="middle">8</text></g><g class="box"><rect class="soft" x="376" y="214" width="38" height="40" rx="4"/><text class="l b fa" x="395" y="239" text-anchor="middle">×</text></g><g class="box"><rect class="soft" x="418" y="214" width="38" height="40" rx="4"/><text class="l b fa" x="437" y="239" text-anchor="middle">×</text></g><line class="lna dash" x1="374" y1="210" x2="374" y2="258"/><text class="s" x="370" y="272" text-anchor="end">버퍼 경계</text><text class="s b fa" x="378" y="272" text-anchor="start">덮어써짐</text><text class="l" x="250" y="300" text-anchor="middle">경계를 확인하지 않고 쓰면 버퍼 뒤의 데이터가 공격자가 만든 값으로 바뀜</text><line class="lna" x1="150" y1="312" x2="150" y2="334" marker-end="url(#mka)"/><line class="lna" x1="350" y1="312" x2="350" y2="334" marker-end="url(#mka)"/><g class="box"><rect class="soft" x="24" y="336" width="214" height="52" rx="8"/>
<text class="l b" x="131" y="358" text-anchor="middle">프로세스 충돌</text>
<text class="s" x="131" y="375" text-anchor="middle">서비스 중단(DoS)</text></g><g class="box"><rect class="soft" x="262" y="336" width="214" height="52" rx="8"/>
<text class="l b" x="369" y="358" text-anchor="middle">조건이 맞으면</text>
<text class="s" x="369" y="375" text-anchor="middle">원격 코드 실행(RCE)</text></g>
</svg>
