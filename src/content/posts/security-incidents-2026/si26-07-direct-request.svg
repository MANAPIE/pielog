<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" width="500" height="470" role="img" aria-labelledby="title">
<title id="title">직원용 출입문을 밖에서 여는 요청</title>
<defs><style>
:root{--c-bg:#FAFAF7;--c-fg:#1A1F2E;--c-muted:#6B7280;--c-accent:#B42318;--c-accent-2:#1D4ED8;--c-line:#C9CDD3;--c-card:#FFFFFF;--c-soft:#FEF3F2;--c-soft-2:#EFF6FF;--c-divider:#E5E7EB}
@media (prefers-color-scheme: dark){:root{--c-bg:#0F1419;--c-fg:#E8E6E1;--c-muted:#8B92A0;--c-accent:#EF6A5E;--c-accent-2:#5B9CF6;--c-line:#3A4250;--c-card:#161B22;--c-soft:#2A1514;--c-soft-2:#14213D;--c-divider:#273041}}
text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;fill:var(--c-fg)}
.mono{font-family:'JetBrains Mono',Menlo,Consolas,'Noto Sans Mono CJK KR',monospace}
.t{font-size:15px;font-weight:700}
.h{font-size:13px;font-weight:700}
.l{font-size:12.5px}
.s{font-size:11.5px;fill:var(--c-muted)}
.b{font-weight:700}
.fa{fill:var(--c-accent)}
.fa2{fill:var(--c-accent-2)}
.fm{fill:var(--c-muted)}
.bg{fill:var(--c-bg)}
.card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1}
.soft{fill:var(--c-soft);stroke:var(--c-accent);stroke-width:1.2}
.soft2{fill:var(--c-soft-2);stroke:var(--c-accent-2);stroke-width:1.2}
.plain{fill:none;stroke:var(--c-line);stroke-width:1}
.ln{stroke:var(--c-fg);stroke-width:1.4;fill:none}
.lnm{stroke:var(--c-muted);stroke-width:1.2;fill:none}
.lna{stroke:var(--c-accent);stroke-width:1.6;fill:none}
.lna2{stroke:var(--c-accent-2);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:4 3}
.grid{stroke:var(--c-divider);stroke-width:1}
.bar{fill:var(--c-accent)}
.mk{fill:var(--c-fg)}
.mkm{fill:var(--c-muted)}
.mka{fill:var(--c-accent)}
.mka2{fill:var(--c-accent-2)}
</style><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker><marker id="mkm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkm"/></marker><marker id="mka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka"/></marker><marker id="mka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka2"/></marker></defs>
<rect class="bg" x="0" y="0" width="500" height="470"/>
<text class="t" x="24" y="38">직원용 출입문을 밖에서 여는 요청</text>
<text class="h" x="131" y="70" text-anchor="middle">정상: Modular 관리 서비스</text><text class="h fa" x="369" y="70" text-anchor="middle">공격: 아무나 보낸 요청</text><g class="box"><rect class="card" x="24" y="84" width="214" height="58" rx="8"/>
<text class="l" x="131" y="109" text-anchor="middle">연결된 사이트에</text>
<text class="l" x="131" y="126" text-anchor="middle">관리 작업 요청</text></g><g class="box"><rect class="card" x="24" y="160" width="214" height="58" rx="8"/>
<text class="s mono" x="131" y="184.6" text-anchor="middle">/api/modular-connector/…</text>
<text class="s" x="131" y="201.6" text-anchor="middle">플러그인 전용 경로</text></g><g class="box"><rect class="card" x="24" y="236" width="214" height="58" rx="8"/>
<text class="l b" x="131" y="261" text-anchor="middle">인증 미들웨어</text>
<text class="s" x="131" y="278" text-anchor="middle">사이트가 Modular에 연결됐는지 확인</text></g><g class="box"><rect class="card" x="24" y="312" width="214" height="58" rx="8"/>
<text class="l" x="131" y="345.5" text-anchor="middle">요청한 관리 작업 수행</text></g><g class="box"><rect class="card" x="262" y="84" width="214" height="58" rx="8"/>
<text class="s mono" x="369" y="108.6" text-anchor="middle">GET /api/modular-connector/</text>
<text class="s mono" x="369" y="125.6" text-anchor="middle">login/?origin=mo&amp;type=foo</text></g><g class="box"><rect class="soft" x="262" y="160" width="214" height="58" rx="8"/>
<text class="l b fa" x="369" y="185" text-anchor="middle">origin·type만 보고 직접 요청 판정</text>
<text class="s" x="369" y="202" text-anchor="middle">서명·비밀값 확인 없음</text></g><g class="box"><rect class="card" x="262" y="236" width="214" height="58" rx="8"/>
<text class="l b" x="369" y="261" text-anchor="middle">인증 미들웨어 통과</text>
<text class="s" x="369" y="278" text-anchor="middle">연결 여부만 확인하므로</text></g><g class="box"><rect class="soft" x="262" y="312" width="214" height="58" rx="8"/>
<text class="l b fa" x="369" y="337" text-anchor="middle">사용자 ID가 없으면</text>
<text class="l b fa" x="369" y="354" text-anchor="middle">관리자 계정으로 자동 로그인</text></g><line class="lnm" x1="131" y1="142" x2="131" y2="158" marker-end="url(#mkm)"/><line class="ln" x1="369" y1="142" x2="369" y2="158" marker-end="url(#mk)"/><line class="lnm" x1="131" y1="218" x2="131" y2="234" marker-end="url(#mkm)"/><line class="ln" x1="369" y1="218" x2="369" y2="234" marker-end="url(#mk)"/><line class="lnm" x1="131" y1="294" x2="131" y2="310" marker-end="url(#mkm)"/><line class="lna" x1="369" y1="294" x2="369" y2="310" marker-end="url(#mka)"/><line class="lna" x1="369" y1="370" x2="369" y2="402" marker-end="url(#mka)"/><g class="box"><rect class="soft" x="262" y="404" width="214" height="44" rx="8"/>
<text class="l b" x="369" y="430.5" text-anchor="middle">관리자 쿠키 발급, 새 관리자 생성</text></g><text class="s" x="24" y="420" text-anchor="start">내부용 경로라는 이유로 요청 출처를</text>
<text class="s" x="24" y="436" text-anchor="start">확인하지 않은 것이 결함의 출발점</text>
</svg>
