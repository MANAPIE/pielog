<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 548" width="500" height="548" role="img" aria-labelledby="title">
<title id="title">Axios 악성 버전이 열려 있던 3시간</title>
<defs><style>
:root{--c-bg:#FAFAF7;--c-fg:#1A1F2E;--c-muted:#6B7280;--c-accent:#B42318;--c-accent-2:#1D4ED8;--c-line:#C9CDD3;--c-card:#FFFFFF;--c-soft:#FEF3F2;--c-soft-2:#EFF6FF;--c-divider:#E5E7EB}
@media (prefers-color-scheme: dark){:root{--c-bg:#0F1419;--c-fg:#E8E6E1;--c-muted:#8B92A0;--c-accent:#EF6A5E;--c-accent-2:#5B9CF6;--c-line:#3A4250;--c-card:#161B22;--c-soft:#2A1514;--c-soft-2:#14213D;--c-divider:#273041}}
text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;fill:var(--c-fg)}
.mono{font-family:'JetBrains Mono',Menlo,Consolas,'Noto Sans Mono CJK KR',monospace}
.t{font-size:15px;font-weight:700}
.h{font-size:13px;font-weight:700}
.l{font-size:12.5px}
.s{font-size:11.5px;fill:var(--c-muted)}
.b{font-weight:700}
.fa{fill:var(--c-accent)}
.fa2{fill:var(--c-accent-2)}
.fm{fill:var(--c-muted)}
.bg{fill:var(--c-bg)}
.card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1}
.soft{fill:var(--c-soft);stroke:var(--c-accent);stroke-width:1.2}
.soft2{fill:var(--c-soft-2);stroke:var(--c-accent-2);stroke-width:1.2}
.plain{fill:none;stroke:var(--c-line);stroke-width:1}
.ln{stroke:var(--c-fg);stroke-width:1.4;fill:none}
.lnm{stroke:var(--c-muted);stroke-width:1.2;fill:none}
.lna{stroke:var(--c-accent);stroke-width:1.6;fill:none}
.lna2{stroke:var(--c-accent-2);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:4 3}
.grid{stroke:var(--c-divider);stroke-width:1}
.bar{fill:var(--c-accent)}
.mk{fill:var(--c-fg)}
.mkm{fill:var(--c-muted)}
.mka{fill:var(--c-accent)}
.mka2{fill:var(--c-accent-2)}
</style><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker><marker id="mkm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkm"/></marker><marker id="mka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka"/></marker><marker id="mka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka2"/></marker></defs>
<rect class="bg" x="0" y="0" width="500" height="548"/>
<text class="t" x="24" y="38">Axios 악성 버전이 열려 있던 3시간</text>
<text class="s" x="24" y="58" text-anchor="start">한국 시간 기준 (UTC+9)</text><text class="h" x="24" y="86" text-anchor="start">게시와 삭제</text><line class="lnm" x1="32" y1="112" x2="32" y2="460"/><line class="lna dash" x1="32" y1="228" x2="32" y2="402" style="stroke-width:3"/><circle cx="32" cy="112" r="4.5" class="mk"/><text class="l b" x="48" y="116" text-anchor="start">3월 30일 14:57</text><text class="s" x="48" y="133" text-anchor="start">plain-crypto-js 4.2.0 게시</text>
<text class="s" x="48" y="148" text-anchor="start">정상 코드만 담은 미끼 버전</text><circle cx="32" cy="170" r="4.5" class="mk"/><text class="l b" x="48" y="174" text-anchor="start">3월 31일 08:59</text><text class="s" x="48" y="191" text-anchor="start">plain-crypto-js 4.2.1 게시</text>
<text class="s" x="48" y="206" text-anchor="start">악성 설치 스크립트 추가</text><circle cx="32" cy="228" r="5.5" class="mka"/><text class="l b fa" x="48" y="232" text-anchor="start">09:21</text><text class="s" x="48" y="249" text-anchor="start">axios 1.14.1 게시</text>
<text class="s" x="48" y="264" text-anchor="start">의존성에 plain-crypto-js 추가</text><circle cx="32" cy="286" r="5.5" class="mka"/><text class="l b fa" x="48" y="290" text-anchor="start">10:00</text><text class="s" x="48" y="307" text-anchor="start">axios 0.30.4 게시</text>
<text class="s" x="48" y="322" text-anchor="start">0.x 사용자도 대상</text><circle cx="32" cy="344" r="4.5" class="mk"/><text class="l b" x="48" y="348" text-anchor="start">10:38</text><text class="s" x="48" y="365" text-anchor="start">협업자가 npm에 신고</text>
<text class="s" x="48" y="380" text-anchor="start">사용 중단 요청과 함께 연락</text><circle cx="32" cy="402" r="4.5" class="mk"/><text class="l b" x="48" y="406" text-anchor="start">12:15</text><text class="s" x="48" y="423" text-anchor="start">axios 악성 버전 삭제</text><circle cx="32" cy="460" r="4.5" class="mk"/><text class="l b" x="48" y="464" text-anchor="start">12:29</text><text class="s" x="48" y="481" text-anchor="start">plain-crypto-js 삭제</text><text class="s b" x="24" y="504" text-anchor="start">굵은 점선 구간: 악성 버전이</text>
<text class="s b" x="24" y="519" text-anchor="start">설치될 수 있던 약 3시간</text><line class="grid" x1="246" y1="74" x2="246" y2="520"/><text class="h" x="262" y="86" text-anchor="start">설치하면 일어난 일</text><g class="box"><rect class="card" x="262" y="100" width="214" height="50" rx="8"/>
<text class="l b mono" x="369" y="120.5" text-anchor="middle">npm install</text>
<text class="s" x="369" y="138.5" text-anchor="middle">^1.14.0 범위를 새로 풀면 1.14.1</text></g><line class="lnm" x1="369" y1="150" x2="369" y2="168" marker-end="url(#mkm)"/><g class="box"><rect class="card" x="262" y="170" width="214" height="50" rx="8"/>
<text class="l b" x="369" y="190.5" text-anchor="middle">plain-crypto-js 4.2.1 설치</text>
<text class="s" x="369" y="208.5" text-anchor="middle">axios가 끌어온 새 의존성</text></g><line class="lnm" x1="369" y1="220" x2="369" y2="238" marker-end="url(#mkm)"/><g class="box"><rect class="soft" x="262" y="240" width="214" height="50" rx="8"/>
<text class="l b mono fa" x="369" y="260.5" text-anchor="middle">postinstall: node setup.js</text>
<text class="s" x="369" y="278.5" text-anchor="middle">설치 직후 자동 실행</text></g><line class="lnm" x1="369" y1="290" x2="369" y2="308" marker-end="url(#mkm)"/><g class="box"><rect class="card" x="262" y="310" width="214" height="50" rx="8"/>
<text class="l b" x="369" y="330.5" text-anchor="middle">공격자 서버에 접속</text>
<text class="s" x="369" y="348.5" text-anchor="middle">macOS·Windows·Linux별 2단계</text></g><line class="lnm" x1="369" y1="360" x2="369" y2="378" marker-end="url(#mkm)"/><g class="box"><rect class="soft" x="262" y="380" width="214" height="50" rx="8"/>
<text class="l b fa" x="369" y="400.5" text-anchor="middle">원격 조종 프로그램 실행</text>
<text class="s" x="369" y="418.5" text-anchor="middle">60초마다 명령 확인</text></g><line class="lnm" x1="369" y1="430" x2="369" y2="448" marker-end="url(#mkm)"/><g class="box"><rect class="card" x="262" y="450" width="214" height="50" rx="8"/>
<text class="l b" x="369" y="470.5" text-anchor="middle">흔적 지우기</text>
<text class="s" x="369" y="488.5" text-anchor="middle">setup.js 삭제, 4.2.0 정보로 교체</text></g><text class="s" x="262" y="524" text-anchor="start">npm list에는 4.2.0으로 보이므로</text>
<text class="s" x="262" y="539" text-anchor="start">node_modules/plain-crypto-js 폴더로 확인</text>
</svg>
