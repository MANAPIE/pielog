<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 404" width="500" height="404" role="img" aria-labelledby="title">
<title id="title">입력 길이에 따라 늘어나는 정규식 실행 시간</title>
<defs><style>
:root{--c-bg:#FAFAF7;--c-fg:#1A1F2E;--c-muted:#6B7280;--c-accent:#B42318;--c-accent-2:#1D4ED8;--c-line:#C9CDD3;--c-card:#FFFFFF;--c-soft:#FEF3F2;--c-soft-2:#EFF6FF;--c-divider:#E5E7EB}
@media (prefers-color-scheme: dark){:root{--c-bg:#0F1419;--c-fg:#E8E6E1;--c-muted:#8B92A0;--c-accent:#EF6A5E;--c-accent-2:#5B9CF6;--c-line:#3A4250;--c-card:#161B22;--c-soft:#2A1514;--c-soft-2:#14213D;--c-divider:#273041}}
text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;fill:var(--c-fg)}
.mono{font-family:'JetBrains Mono',Menlo,Consolas,'Noto Sans Mono CJK KR',monospace}
.t{font-size:15px;font-weight:700}
.h{font-size:13px;font-weight:700}
.l{font-size:12.5px}
.s{font-size:11.5px;fill:var(--c-muted)}
.b{font-weight:700}
.fa{fill:var(--c-accent)}
.fa2{fill:var(--c-accent-2)}
.fm{fill:var(--c-muted)}
.bg{fill:var(--c-bg)}
.card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1}
.soft{fill:var(--c-soft);stroke:var(--c-accent);stroke-width:1.2}
.soft2{fill:var(--c-soft-2);stroke:var(--c-accent-2);stroke-width:1.2}
.plain{fill:none;stroke:var(--c-line);stroke-width:1}
.ln{stroke:var(--c-fg);stroke-width:1.4;fill:none}
.lnm{stroke:var(--c-muted);stroke-width:1.2;fill:none}
.lna{stroke:var(--c-accent);stroke-width:1.6;fill:none}
.lna2{stroke:var(--c-accent-2);stroke-width:1.6;fill:none}
.dash{stroke-dasharray:4 3}
.grid{stroke:var(--c-divider);stroke-width:1}
.bar{fill:var(--c-accent)}
.mk{fill:var(--c-fg)}
.mkm{fill:var(--c-muted)}
.mka{fill:var(--c-accent)}
.mka2{fill:var(--c-accent-2)}
</style><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker><marker id="mkm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkm"/></marker><marker id="mka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka"/></marker><marker id="mka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mka2"/></marker></defs>
<rect class="bg" x="0" y="0" width="500" height="404"/>
<text class="t" x="24" y="38">입력 길이에 따라 늘어나는 정규식 실행 시간</text>
<text class="s" x="24" y="58" text-anchor="start">정규식 /^(a+)+$/에 a를 n개 넣고 끝에 !를 붙인 입력, Node.js 22.23.4 측정</text><line class="grid" x1="70" y1="320" x2="476" y2="320"/><text class="s" x="62" y="324" text-anchor="end">0</text><line class="grid" x1="70" y1="256" x2="476" y2="256"/><text class="s" x="62" y="260" text-anchor="end">2초</text><line class="grid" x1="70" y1="192" x2="476" y2="192"/><text class="s" x="62" y="196" text-anchor="end">4초</text><line class="grid" x1="70" y1="128" x2="476" y2="128"/><text class="s" x="62" y="132" text-anchor="end">6초</text><path class="bar" d="M85.83333333333333,320 V319.25 Q85.83333333333333,318.5 86.58333333333333,318.5 H121.08333333333333 Q121.83333333333333,318.5 121.83333333333333,319.25 V320 Z"/><text class="s b" x="103.83333333333333" y="310.5" text-anchor="middle">6ms</text><text class="s" x="103.83333333333333" y="338" text-anchor="middle">20개</text><path class="bar" d="M153.5,320 V319.25 Q153.5,318.5 154.25,318.5 H188.75 Q189.5,318.5 189.5,319.25 V320 Z"/><text class="s b" x="171.5" y="310.5" text-anchor="middle">24ms</text><text class="s" x="171.5" y="338" text-anchor="middle">22개</text><path class="bar" d="M221.16666666666669,320 V318.496 Q221.16666666666669,316.992 222.67066666666668,316.992 H255.6626666666667 Q257.1666666666667,316.992 257.1666666666667,318.496 V320 Z"/><text class="s b" x="239.16666666666669" y="308.992" text-anchor="middle">94ms</text><text class="s" x="239.16666666666669" y="338" text-anchor="middle">24개</text><path class="bar" d="M288.8333333333333,320 V311.712 Q288.8333333333333,307.712 292.8333333333333,307.712 H320.8333333333333 Q324.8333333333333,307.712 324.8333333333333,311.712 V320 Z"/><text class="s b" x="306.8333333333333" y="299.712" text-anchor="middle">384ms</text><text class="s" x="306.8333333333333" y="338" text-anchor="middle">26개</text><path class="bar" d="M356.5,320 V274.944 Q356.5,270.944 360.5,270.944 H388.5 Q392.5,270.944 392.5,274.944 V320 Z"/><text class="s b" x="374.5" y="262.944" text-anchor="middle">1.5초</text><text class="s" x="374.5" y="338" text-anchor="middle">28개</text><path class="bar" d="M424.1666666666667,320 V126.112 Q424.1666666666667,122.112 428.1666666666667,122.112 H456.1666666666667 Q460.1666666666667,122.112 460.1666666666667,126.112 V320 Z"/><text class="s b" x="442.1666666666667" y="114.112" text-anchor="middle">6.2초</text><text class="s" x="442.1666666666667" y="338" text-anchor="middle">30개</text><line class="lnm" x1="70" y1="320" x2="476" y2="320"/><text class="s" x="273" y="358" text-anchor="middle">입력에 들어간 a의 개수</text><text class="l" x="24" y="386" text-anchor="start">글자 2개가 늘 때마다 약 4배씩 늘어남. 같은 입력에 /^a+$/는 0.05ms</text>
</svg>
