<svg viewBox="0 0 800 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-gtree">
  <title id="t-gtree">그래프 문제의 신호에서 알고리즘을 고르는 선택 트리</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #2F7D6E;
        --c-accent-2: #C2703D;
        --c-accent-3: #6366A8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(47, 125, 110, 0.12);
        --c-soft-2: rgba(194, 112, 61, 0.14);
        --c-soft-3: rgba(99, 102, 168, 0.12);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #6FC3B0;
          --c-accent-2: #E09A6B;
          --c-accent-3: #9598D4;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(111, 195, 176, 0.16);
          --c-soft-2: rgba(224, 154, 107, 0.18);
          --c-soft-3: rgba(149, 152, 212, 0.16);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .sub {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        fill: var(--c-muted);
      }

      .hd {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      .root {
        fill: var(--c-soft-3);
        stroke: var(--c-accent-3);
        stroke-width: 2;
      }

      .col {
        fill: none;
        stroke: var(--c-divider);
        stroke-width: 1.2;
      }

      .q {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.2;
      }

      .alg {
        fill: var(--c-soft);
        stroke: var(--c-accent);
        stroke-width: 1.8;
      }

      .qt {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        fill: var(--c-fg);
      }

      .an {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .cx {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 9px;
        fill: var(--c-muted);
      }

      .ed {
        stroke: var(--c-muted);
        stroke-width: 1.3;
        fill: none;
      }

      .yn {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        fill: var(--c-muted);
      }
    </style>
    <marker id="g-a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="var(--c-muted)" />
    </marker>
  </defs>

  <rect class="bg" width="800" height="596" />

  <text x="24" y="28" class="ttl">그래프라는 것을 알아도, 무엇을 묻는지가 남습니다</text>
  <text x="24" y="48" class="sub">자료구조는 하나인데 알고리즘은 여럿입니다. 질문이 갈래를 정합니다.</text>

  <g transform="translate(300 66)">
    <rect width="200" height="42" rx="6" class="root" />
    <text x="100" y="26" class="an" text-anchor="middle">무엇을 묻는가</text>
  </g>
  <path class="ed" d="M400 108 L 400 122" />
  <path class="ed" d="M140 122 L 660 122" />
  <path class="ed" d="M140 122 L 140 140" marker-end="url(#g-a)" />
  <path class="ed" d="M400 122 L 400 140" marker-end="url(#g-a)" />
  <path class="ed" d="M660 122 L 660 140" marker-end="url(#g-a)" />

  <!-- 최단 경로 -->
  <g transform="translate(24 146)">
    <rect width="232" height="406" rx="8" class="col" />
    <text x="116" y="24" class="hd" fill="var(--c-accent-3)" text-anchor="middle">최단 경로</text>
    <g transform="translate(16 36)">
      <rect width="200" height="44" rx="5" class="q" />
      <text x="12" y="17" class="qt">간선 비용이</text>
      <text x="12" y="32" class="qt">모두 같은가</text>
    </g>
    <text x="30" y="94" class="yn">예</text>
    <path class="ed" d="M50 81 L 50 98" marker-end="url(#g-a)" />
    <g transform="translate(16 100)">
      <rect width="164" height="46" rx="5" class="alg" />
      <text x="12" y="19" class="an">BFS</text>
      <text x="12" y="35" class="cx">O(V + E)</text>
    </g>
    <text x="160" y="94" class="yn">아니오</text>
    <path class="ed" d="M196 81 L 196 158" marker-end="url(#g-a)" />
    <g transform="translate(16 160)">
      <rect width="200" height="44" rx="5" class="q" />
      <text x="12" y="17" class="qt">음수 간선이</text>
      <text x="12" y="32" class="qt">있는가</text>
    </g>
    <text x="24" y="218" class="yn">없음</text>
    <path class="ed" d="M50 205 L 50 222" marker-end="url(#g-a)" />
    <g transform="translate(16 224)">
      <rect width="94" height="46" rx="5" class="alg" />
      <text x="12" y="19" class="an">다익스트라</text>
      <text x="12" y="35" class="cx">O(E log V)</text>
    </g>
    <text x="152" y="218" class="yn">있음</text>
    <path class="ed" d="M180 205 L 180 222" marker-end="url(#g-a)" />
    <g transform="translate(122 224)">
      <rect width="94" height="46" rx="5" class="alg" />
      <text x="12" y="19" class="an">벨만포드</text>
      <text x="12" y="35" class="cx">O(V × E)</text>
    </g>
    <g transform="translate(16 284)">
      <rect width="200" height="44" rx="5" class="q" />
      <text x="12" y="17" class="qt">모든 쌍의 거리가</text>
      <text x="12" y="32" class="qt">필요한가</text>
    </g>
    <path class="ed" d="M116 328 L 116 342" marker-end="url(#g-a)" />
    <g transform="translate(16 344)">
      <rect width="200" height="46" rx="5" class="alg" />
      <text x="12" y="19" class="an">플로이드워셜</text>
      <text x="12" y="35" class="cx">O(V³)</text>
    </g>
  </g>

  <!-- 연결 관계 -->
  <g transform="translate(284 146)">
    <rect width="232" height="406" rx="8" class="col" />
    <text x="116" y="24" class="hd" fill="var(--c-accent-3)" text-anchor="middle">연결 관계</text>
    <g transform="translate(16 36)">
      <rect width="200" height="44" rx="5" class="q" />
      <text x="12" y="17" class="qt">이어져 있는지만</text>
      <text x="12" y="32" class="qt">알면 되는가</text>
    </g>
    <path class="ed" d="M116 81 L 116 98" marker-end="url(#g-a)" />
    <g transform="translate(16 100)">
      <rect width="200" height="46" rx="5" class="alg" />
      <text x="12" y="19" class="an">유니온 파인드</text>
      <text x="12" y="35" class="cx">O(α(V))</text>
    </g>
    <g transform="translate(16 160)">
      <rect width="200" height="44" rx="5" class="q" />
      <text x="12" y="17" class="qt">최소 비용으로</text>
      <text x="12" y="32" class="qt">전부 잇는가</text>
    </g>
    <path class="ed" d="M116 205 L 116 222" marker-end="url(#g-a)" />
    <g transform="translate(16 224)">
      <rect width="200" height="46" rx="5" class="alg" />
      <text x="12" y="19" class="an">최소 신장 트리</text>
      <text x="12" y="35" class="cx">O(E log V)</text>
    </g>
    <text x="16" y="302" class="sub">α는 역아커만 함수로,</text>
    <text x="16" y="318" class="sub">사실상 상수로 봅니다.</text>
    <text x="16" y="344" class="sub">크루스칼은 유니온 파인드를</text>
    <text x="16" y="360" class="sub">그대로 씁니다.</text>
  </g>

  <!-- 순서 제약 -->
  <g transform="translate(544 146)">
    <rect width="232" height="406" rx="8" class="col" />
    <text x="116" y="24" class="hd" fill="var(--c-accent-3)" text-anchor="middle">순서 제약</text>
    <g transform="translate(16 36)">
      <rect width="200" height="44" rx="5" class="q" />
      <text x="12" y="17" class="qt">선행 관계를 만족하는</text>
      <text x="12" y="32" class="qt">순서가 필요한가</text>
    </g>
    <path class="ed" d="M116 81 L 116 98" marker-end="url(#g-a)" />
    <g transform="translate(16 100)">
      <rect width="200" height="46" rx="5" class="alg" />
      <text x="12" y="19" class="an">위상정렬</text>
      <text x="12" y="35" class="cx">O(V + E)</text>
    </g>
    <text x="16" y="182" class="sub">사이클이 있으면 순서가</text>
    <text x="16" y="198" class="sub">존재하지 않습니다.</text>
    <text x="16" y="214" class="sub">그래서 사이클 판별에도 씁니다.</text>

    <text x="16" y="262" class="hd" fill="var(--c-muted)">공통 전제</text>
    <text x="16" y="286" class="sub">V는 정점 수, E는 간선 수입니다.</text>
    <text x="16" y="302" class="sub">간선이 빽빽하면 인접 행렬이,</text>
    <text x="16" y="318" class="sub">성기면 인접 리스트가 유리합니다.</text>
  </g>

  <text x="24" y="578" class="sub">먼저 무엇을 묻는지 정하고, 그다음 간선의 성질을 봅니다. 순서가 바뀌면 매번 다익스트라를 꺼내게 됩니다.</text>
</svg>