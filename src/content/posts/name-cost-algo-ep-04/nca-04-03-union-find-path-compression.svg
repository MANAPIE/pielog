<svg viewBox="0 0 800 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-uf">
  <title id="t-uf">유니온 파인드에서 경로 압축 전후의 트리 모양 비교</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #2F7D6E;
        --c-accent-2: #C2703D;
        --c-accent-3: #6366A8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(47, 125, 110, 0.16);
        --c-soft-2: rgba(194, 112, 61, 0.16);
        --c-dim: rgba(107, 114, 128, 0.30);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #6FC3B0;
          --c-accent-2: #E09A6B;
          --c-accent-3: #9598D4;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(111, 195, 176, 0.20);
          --c-soft-2: rgba(224, 154, 107, 0.20);
          --c-dim: rgba(139, 146, 160, 0.34);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .sub {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        fill: var(--c-muted);
      }

      .hd {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .pane {
        fill: none;
        stroke: var(--c-divider);
        stroke-width: 1.2;
      }

      .lg {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        fill: var(--c-fg);
      }

      .cl {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.1;
      }

      .t {
        fill: var(--c-soft);
        stroke: var(--c-accent);
        stroke-width: 1.4;
      }

      .f {
        fill: var(--c-card);
        stroke: var(--c-dim);
        stroke-width: 1.1;
      }

      .st {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 2;
      }

      .n {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .m {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        fill: var(--c-muted);
      }

      .mk {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        font-weight: 700;
      }

      .ed {
        stroke: var(--c-line);
        stroke-width: 1.3;
        fill: none;
        opacity: 0.5;
      }

      .edd {
        stroke: var(--c-dim);
        stroke-width: 1.2;
        fill: none;
        stroke-dasharray: 3 2;
      }

      .kl {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: var(--c-fg);
      }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)" />
    </marker>
  </defs>
  <rect class="bg" width="800" height="336" />
  <text x="24" y="28" class="ttl">루트를 찾는 김에 지나온 노드를 루트에 직접 붙입니다</text>
  <text x="24" y="48" class="sub">4에서 find를 호출했을 때의 트리 변화</text>
  <g transform="translate(24 62)">
    <rect width="366" height="210" rx="8" class="pane" />
    <text x="16" y="24" class="hd" fill="var(--c-accent-2)">압축 전 · 한 줄로 늘어선 트리</text>
    <g transform="translate(0 -10)">
      <line x1="180" y1="72" x2="180" y2="78" class="ed" />
      <line x1="180" y1="106" x2="180" y2="112" class="ed" />
      <line x1="180" y1="140" x2="180" y2="146" class="ed" />
      <circle cx="180" cy="58" r="14" class="cl" /><text x="180" y="62" class="n" text-anchor="middle">1</text>
      <circle cx="180" cy="92" r="14" class="cl" /><text x="180" y="96" class="n" text-anchor="middle">2</text>
      <circle cx="180" cy="126" r="14" class="cl" /><text x="180" y="130" class="n" text-anchor="middle">3</text>
      <circle cx="180" cy="160" r="14" class="st" /><text x="180" y="164" class="n" text-anchor="middle">4</text>
    </g>
    <text x="16" y="192" class="lg">4에서 루트 1까지 세 번 올라가야 합니다</text>
  </g>
  <g transform="translate(410 62)">
    <rect width="366" height="210" rx="8" class="pane" />
    <text x="16" y="24" class="hd" fill="var(--c-accent)">압축 후 · 모두 루트에 직접 연결</text>
    <g transform="translate(0 10)">
      <line x1="170" y1="76" x2="122" y2="106" class="ed" />
      <line x1="180" y1="80" x2="180" y2="102" class="ed" />
      <line x1="190" y1="76" x2="238" y2="106" class="ed" />
      <circle cx="180" cy="62" r="14" class="cl" /><text x="180" y="66" class="n" text-anchor="middle">1</text>
      <circle cx="110" cy="120" r="14" class="cl" /><text x="110" y="124" class="n" text-anchor="middle">2</text>
      <circle cx="180" cy="120" r="14" class="cl" /><text x="180" y="124" class="n" text-anchor="middle">3</text>
      <circle cx="250" cy="120" r="14" class="t" /><text x="250" y="124" class="n" text-anchor="middle">4</text>
    </g>
    <text x="16" y="192" class="lg">다음 find부터는 한 번에 루트에 닿습니다</text>
  </g>
  <text x="24" y="298" class="sub">랭크 기반 합치기는 낮은 트리를 높은 트리 아래에 붙여 처음부터 높이가 커지는 것을 막습니다.</text>
  <text x="24" y="318" class="sub">둘을 함께 쓰면 연산당 비용이 사실상 상수에 가까워집니다.</text>
</svg>