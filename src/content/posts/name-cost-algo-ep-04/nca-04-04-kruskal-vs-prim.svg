<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-mst">
  <title id="t-mst">크루스칼과 프림이 최소 신장 트리를 만드는 간선 선택 순서 비교</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #2F7D6E;
        --c-accent-2: #C2703D;
        --c-accent-3: #6366A8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(47, 125, 110, 0.16);
        --c-soft-2: rgba(194, 112, 61, 0.16);
        --c-dim: rgba(107, 114, 128, 0.30);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #6FC3B0;
          --c-accent-2: #E09A6B;
          --c-accent-3: #9598D4;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(111, 195, 176, 0.20);
          --c-soft-2: rgba(224, 154, 107, 0.20);
          --c-dim: rgba(139, 146, 160, 0.34);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .sub {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        fill: var(--c-muted);
      }

      .hd {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .pane {
        fill: none;
        stroke: var(--c-divider);
        stroke-width: 1.2;
      }

      .lg {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        fill: var(--c-fg);
      }

      .cl {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.1;
      }

      .t {
        fill: var(--c-soft);
        stroke: var(--c-accent);
        stroke-width: 1.4;
      }

      .f {
        fill: var(--c-card);
        stroke: var(--c-dim);
        stroke-width: 1.1;
      }

      .st {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 2;
      }

      .n {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .m {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        fill: var(--c-muted);
      }

      .mk {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        font-weight: 700;
      }

      .ed {
        stroke: var(--c-line);
        stroke-width: 1.3;
        fill: none;
        opacity: 0.5;
      }

      .edd {
        stroke: var(--c-dim);
        stroke-width: 1.2;
        fill: none;
        stroke-dasharray: 3 2;
      }

      .kl {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: var(--c-fg);
      }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)" />
    </marker>
  </defs>
  <rect class="bg" width="800" height="380" />
  <text x="24" y="28" class="ttl">같은 트리에 도달하지만 고르는 순서가 다릅니다</text>
  <text x="24" y="48" class="sub">정점 A B C D · 간선 A-B 1, B-C 2, C-D 3, A-C 4, B-D 6 · 최소 신장 트리 비용은 6</text>
  <g transform="translate(24 62)">
    <rect width="366" height="252" rx="8" class="pane" />
    <text x="16" y="24" class="hd" fill="var(--c-accent)">크루스칼 · 싼 간선부터</text>
    <g transform="translate(30 18)">
      <line x1="70" y1="70" x2="190" y2="70" stroke="var(--c-accent)" stroke-width="2.4" fill="none" />
      <text x="136" y="63" class="m">1</text>
      <line x1="190" y1="70" x2="70" y2="160" stroke="var(--c-accent)" stroke-width="2.4" fill="none" />
      <text x="146" y="121" class="m">2</text>
      <line x1="70" y1="160" x2="190" y2="160" stroke="var(--c-accent-2)" stroke-width="3" fill="none" />
      <text x="136" y="153" class="m">3</text>
      <line x1="70" y1="70" x2="70" y2="160" stroke="var(--c-dim)" stroke-width="1.2" fill="none" />
      <text x="76" y="111" class="m">4</text>
      <line x1="190" y1="70" x2="190" y2="160" stroke="var(--c-dim)" stroke-width="1.2" fill="none" />
      <text x="196" y="111" class="m">6</text>
      <circle cx="70" cy="70" r="15" class="cl" /><text x="70" y="74" class="n" text-anchor="middle">A</text>
      <circle cx="190" cy="70" r="15" class="cl" /><text x="190" y="74" class="n" text-anchor="middle">B</text>
      <circle cx="70" cy="160" r="15" class="cl" /><text x="70" y="164" class="n" text-anchor="middle">C</text>
      <circle cx="190" cy="160" r="15" class="cl" /><text x="190" y="164" class="n" text-anchor="middle">D</text>
      <text x="14" y="216" class="lg">1 → 2 → 3 순서로 고릅니다. A-C 4는 사이클이라 건너뜁니다</text>
    </g>
  </g>
  <g transform="translate(410 62)">
    <rect width="366" height="252" rx="8" class="pane" />
    <text x="16" y="24" class="hd" fill="var(--c-accent-2)">프림 · 한 정점에서 자라기</text>
    <g transform="translate(30 18)">
      <line x1="70" y1="70" x2="190" y2="70" stroke="var(--c-accent)" stroke-width="2.4" fill="none" />
      <text x="136" y="63" class="m">1</text>
      <line x1="190" y1="70" x2="70" y2="160" stroke="var(--c-accent)" stroke-width="2.4" fill="none" />
      <text x="146" y="121" class="m">2</text>
      <line x1="70" y1="160" x2="190" y2="160" stroke="var(--c-accent-2)" stroke-width="3" fill="none" />
      <text x="136" y="153" class="m">3</text>
      <line x1="70" y1="70" x2="70" y2="160" stroke="var(--c-dim)" stroke-width="1.2" fill="none" />
      <text x="76" y="111" class="m">4</text>
      <line x1="190" y1="70" x2="190" y2="160" stroke="var(--c-dim)" stroke-width="1.2" fill="none" />
      <text x="196" y="111" class="m">6</text>
      <circle cx="70" cy="70" r="15" class="cl" /><text x="70" y="74" class="n" text-anchor="middle">A</text>
      <circle cx="190" cy="70" r="15" class="cl" /><text x="190" y="74" class="n" text-anchor="middle">B</text>
      <circle cx="70" cy="160" r="15" class="cl" /><text x="70" y="164" class="n" text-anchor="middle">C</text>
      <circle cx="190" cy="160" r="15" class="cl" /><text x="190" y="164" class="n" text-anchor="middle">D</text>
      <text x="14" y="216" class="lg">A에서 시작해 트리에 붙는 가장 싼 간선을 계속 고릅니다</text>
    </g>
  </g>
  <text x="24" y="340" class="sub">크루스칼은 간선을 전부 정렬해두고 사이클만 피하며 고르고, 프림은 현재 트리에 닿는 간선 중에서만 고릅니다.</text>
  <text x="24" y="360" class="sub">간선이 조밀하면 프림이, 성기면 정렬 비용이 지배하는 크루스칼이 유리합니다. 결과 트리는 같습니다.</text>
</svg>