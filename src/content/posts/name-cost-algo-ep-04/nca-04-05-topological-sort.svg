<svg viewBox="0 0 800 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-topo">
  <title id="t-topo">진입 차수가 0인 정점을 큐로 빼면서 위상정렬 순서를 만드는 과정</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #2F7D6E;
        --c-accent-2: #C2703D;
        --c-accent-3: #6366A8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(47, 125, 110, 0.16);
        --c-soft-2: rgba(194, 112, 61, 0.16);
        --c-dim: rgba(107, 114, 128, 0.30);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #6FC3B0;
          --c-accent-2: #E09A6B;
          --c-accent-3: #9598D4;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(111, 195, 176, 0.20);
          --c-soft-2: rgba(224, 154, 107, 0.20);
          --c-dim: rgba(139, 146, 160, 0.34);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .sub {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        fill: var(--c-muted);
      }

      .hd {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .pane {
        fill: none;
        stroke: var(--c-divider);
        stroke-width: 1.2;
      }

      .lg {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        fill: var(--c-fg);
      }

      .cl {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.1;
      }

      .t {
        fill: var(--c-soft);
        stroke: var(--c-accent);
        stroke-width: 1.4;
      }

      .f {
        fill: var(--c-card);
        stroke: var(--c-dim);
        stroke-width: 1.1;
      }

      .st {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 2;
      }

      .n {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .m {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        fill: var(--c-muted);
      }

      .mk {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        font-weight: 700;
      }

      .ed {
        stroke: var(--c-line);
        stroke-width: 1.3;
        fill: none;
        opacity: 0.5;
      }

      .edd {
        stroke: var(--c-dim);
        stroke-width: 1.2;
        fill: none;
        stroke-dasharray: 3 2;
      }

      .kl {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: var(--c-fg);
      }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)" />
    </marker>
  </defs>
  <rect class="bg" width="800" height="364" />
  <text x="24" y="28" class="ttl">앞에 아무것도 남지 않은 작업부터 꺼냅니다</text>
  <text x="24" y="48" class="sub">A → B, A → C, B → D, C → D 의존 관계 · 숫자는 남은 진입 차수</text>
  <g transform="translate(24 62)">
    <rect width="182" height="216" rx="8" class="pane" />
    <text x="14" y="22" class="hd" fill="var(--c-accent)">STEP 1</text>
    <line x1="55" y1="91" x2="78" y2="75" stroke="var(--c-line)" stroke-width="1.3" opacity="0.8"
      marker-end="url(#ar)" />
    <line x1="55" y1="109" x2="78" y2="125" stroke="var(--c-line)" stroke-width="1.3" opacity="0.8"
      marker-end="url(#ar)" />
    <line x1="104" y1="75" x2="127" y2="91" stroke="var(--c-line)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="104" y1="125" x2="127" y2="109" stroke="var(--c-line)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <circle cx="42" cy="100" r="14" class="st" /><text x="42" y="104" class="n" text-anchor="middle">A</text>
    <text x="24" y="104" class="mk" text-anchor="end" fill="var(--c-accent-2)">0</text>
    <circle cx="91" cy="66" r="14" class="cl" /><text x="91" y="70" class="n" text-anchor="middle">B</text>
    <text x="91" y="46" class="mk" text-anchor="middle" fill="var(--c-accent-2)">1</text>
    <circle cx="91" cy="134" r="14" class="cl" /><text x="91" y="138" class="n" text-anchor="middle">C</text>
    <text x="91" y="160" class="mk" text-anchor="middle" fill="var(--c-accent-2)">1</text>
    <circle cx="140" cy="100" r="14" class="cl" /><text x="140" y="104" class="n" text-anchor="middle">D</text>
    <text x="158" y="104" class="mk" text-anchor="start" fill="var(--c-accent-2)">2</text>
    <text x="14" y="182" class="m">결과: -</text>
    <text x="14" y="198" class="m">차수 0인 A를 꺼냅니다</text>
  </g>
  <g transform="translate(214 62)">
    <rect width="182" height="216" rx="8" class="pane" />
    <text x="14" y="22" class="hd" fill="var(--c-accent)">STEP 2</text>
    <line x1="55" y1="91" x2="78" y2="75" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="55" y1="109" x2="78" y2="125" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="104" y1="75" x2="127" y2="91" stroke="var(--c-line)" stroke-width="1.3" opacity="0.8"
      marker-end="url(#ar)" />
    <line x1="104" y1="125" x2="127" y2="109" stroke="var(--c-line)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <circle cx="42" cy="100" r="14" class="t" /><text x="42" y="104" class="n" text-anchor="middle">A</text>
    <text x="24" y="104" class="mk" text-anchor="end" fill="var(--c-accent-2)">-</text>
    <circle cx="91" cy="66" r="14" class="st" /><text x="91" y="70" class="n" text-anchor="middle">B</text>
    <text x="91" y="46" class="mk" text-anchor="middle" fill="var(--c-accent-2)">0</text>
    <circle cx="91" cy="134" r="14" class="cl" /><text x="91" y="138" class="n" text-anchor="middle">C</text>
    <text x="91" y="160" class="mk" text-anchor="middle" fill="var(--c-accent-2)">0</text>
    <circle cx="140" cy="100" r="14" class="cl" /><text x="140" y="104" class="n" text-anchor="middle">D</text>
    <text x="158" y="104" class="mk" text-anchor="start" fill="var(--c-accent-2)">2</text>
    <text x="14" y="182" class="m">결과: A</text>
    <text x="14" y="198" class="m">B와 C가 0이 됩니다</text>
  </g>
  <g transform="translate(404 62)">
    <rect width="182" height="216" rx="8" class="pane" />
    <text x="14" y="22" class="hd" fill="var(--c-accent)">STEP 3</text>
    <line x1="55" y1="91" x2="78" y2="75" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="55" y1="109" x2="78" y2="125" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="104" y1="75" x2="127" y2="91" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="104" y1="125" x2="127" y2="109" stroke="var(--c-line)" stroke-width="1.3" opacity="0.8"
      marker-end="url(#ar)" />
    <circle cx="42" cy="100" r="14" class="t" /><text x="42" y="104" class="n" text-anchor="middle">A</text>
    <text x="24" y="104" class="mk" text-anchor="end" fill="var(--c-accent-2)">-</text>
    <circle cx="91" cy="66" r="14" class="t" /><text x="91" y="70" class="n" text-anchor="middle">B</text>
    <text x="91" y="46" class="mk" text-anchor="middle" fill="var(--c-accent-2)">-</text>
    <circle cx="91" cy="134" r="14" class="st" /><text x="91" y="138" class="n" text-anchor="middle">C</text>
    <text x="91" y="160" class="mk" text-anchor="middle" fill="var(--c-accent-2)">0</text>
    <circle cx="140" cy="100" r="14" class="cl" /><text x="140" y="104" class="n" text-anchor="middle">D</text>
    <text x="158" y="104" class="mk" text-anchor="start" fill="var(--c-accent-2)">1</text>
    <text x="14" y="182" class="m">결과: A B</text>
    <text x="14" y="198" class="m">C를 꺼냅니다</text>
  </g>
  <g transform="translate(594 62)">
    <rect width="182" height="216" rx="8" class="pane" />
    <text x="14" y="22" class="hd" fill="var(--c-accent)">STEP 4</text>
    <line x1="55" y1="91" x2="78" y2="75" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="55" y1="109" x2="78" y2="125" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="104" y1="75" x2="127" y2="91" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <line x1="104" y1="125" x2="127" y2="109" stroke="var(--c-dim)" stroke-width="1.3" opacity="0.4"
      marker-end="url(#ar)" />
    <circle cx="42" cy="100" r="14" class="t" /><text x="42" y="104" class="n" text-anchor="middle">A</text>
    <text x="24" y="104" class="mk" text-anchor="end" fill="var(--c-accent-2)">-</text>
    <circle cx="91" cy="66" r="14" class="t" /><text x="91" y="70" class="n" text-anchor="middle">B</text>
    <text x="91" y="46" class="mk" text-anchor="middle" fill="var(--c-accent-2)">-</text>
    <circle cx="91" cy="134" r="14" class="t" /><text x="91" y="138" class="n" text-anchor="middle">C</text>
    <text x="91" y="160" class="mk" text-anchor="middle" fill="var(--c-accent-2)">-</text>
    <circle cx="140" cy="100" r="14" class="st" /><text x="140" y="104" class="n" text-anchor="middle">D</text>
    <text x="158" y="104" class="mk" text-anchor="start" fill="var(--c-accent-2)">0</text>
    <text x="14" y="182" class="m">결과: A B C</text>
    <text x="14" y="198" class="m">D까지 넷 모두 나왔습니다</text>
  </g>
  <text x="24" y="304" class="sub">간선을 하나 지울 때마다 도착 정점의 진입 차수가 1씩 줄고, 0이 되는 순간 큐에 들어갑니다.</text>
  <text x="24" y="324" class="sub">B와 C는 순서를 바꿔도 됩니다. 위상정렬의 답은 하나가 아닙니다.</text>
  <text x="24" y="344" class="sub">결과 길이가 정점 수보다 적으면 차수가 0이 되지 못한 정점이 남았다는 뜻이고, 그것이 사이클입니다.</text>
</svg>