<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="두 개의 아키텍처 정의서 시리즈 커버">
  <style>
    :root{
      --c-bg:#f5f4ef; --c-fg:#1f1d14; --c-muted:#6b6553; --c-line:#cfccbf; --c-dot:#1f1d14;
      --c-accent:#C29A1F; --c-accent-2:#5E6E7E; --c-accent-3:#D9C77E; --c-num:#C29A1F;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --c-bg:#14110a; --c-fg:#eae7dd; --c-muted:#a39f8c; --c-line:#38352a; --c-dot:#eae7dd;
        --c-accent:#D6B23A; --c-accent-2:#9AA6B4; --c-accent-3:#6E5F2A; --c-num:#D6B23A;
      }
    }
    .bg{fill:var(--c-bg);}
    .fg{fill:var(--c-fg);}
    .teal{fill:var(--c-accent);}
    .amber{fill:var(--c-accent-2);}
    .ltteal{fill:var(--c-accent-3);}
    .line{stroke:var(--c-line);fill:none;stroke-width:1.5;}
    .num{fill:var(--c-num);}
  </style>

  <defs>
    <pattern id="dots00" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="glowA00" cx="18%" cy="22%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB00" cx="86%" cy="84%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect class="bg" x="0" y="0" width="1200" height="630"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots00)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowA00)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowB00)"/>

  <!-- large achromatic off-canvas strokes -->
  <circle class="line" cx="1090" cy="70" r="260" transform="rotate(8 1090 70)"/>
  <rect class="line" x="-120" y="430" width="420" height="420" rx="46" transform="rotate(-14 90 640)"/>

  <!-- ===== foreground metaphor: living document (teal) vs fossil document (amber) ===== -->

  <!-- fossil document (amber), behind, slightly rotated, layered sediment -->
  <g transform="rotate(7 690 330)">
    <rect x="560" y="150" width="260" height="330" rx="14" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="3"/>
    <!-- sediment strata: fixed horizontal layers -->
    <rect x="560" y="300" width="260" height="22" class="amber" opacity="0.20"/>
    <rect x="560" y="330" width="260" height="30" class="amber" opacity="0.30"/>
    <rect x="560" y="368" width="260" height="40" class="amber" opacity="0.42"/>
    <rect x="560" y="416" width="260" height="64" rx="0" class="amber" opacity="0.55"/>
    <!-- frozen content lines -->
    <rect x="590" y="186" width="150" height="10" rx="5" class="amber" opacity="0.7"/>
    <rect x="590" y="210" width="200" height="8" rx="4" class="amber" opacity="0.45"/>
    <rect x="590" y="228" width="180" height="8" rx="4" class="amber" opacity="0.45"/>
    <rect x="590" y="246" width="120" height="8" rx="4" class="amber" opacity="0.45"/>
    <!-- a small fixed marker (concentric, locked) -->
    <circle cx="700" cy="442" r="20" fill="none" stroke="var(--c-bg)" stroke-width="3"/>
    <circle cx="700" cy="442" r="11" class="bg"/>
    <circle cx="700" cy="442" r="6" fill="var(--c-bg)" opacity="0.0"/>
  </g>

  <!-- living document (teal), front, focus ring, rising pulse -->
  <g transform="rotate(-6 470 330)">
    <!-- dashed focus ring (outer) -->
    <rect x="306" y="156" width="288" height="356" rx="22" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="3 7" opacity="0.7"/>
    <rect x="320" y="170" width="260" height="328" rx="14" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="3"/>
    <!-- fresh content lines -->
    <rect x="350" y="206" width="150" height="10" rx="5" class="teal"/>
    <rect x="350" y="230" width="200" height="8" rx="4" class="teal" opacity="0.5"/>
    <rect x="350" y="248" width="170" height="8" rx="4" class="teal" opacity="0.5"/>
    <!-- rising pulse line (continuously updated) -->
    <polyline class="line" points="350,420 386,420 404,388 432,440 458,360 486,402 520,332 556,372"
      stroke="var(--c-accent)" stroke-width="3"/>
    <!-- mini bars cluster -->
    <rect x="350" y="300" width="14" height="40" rx="3" class="ltteal"/>
    <rect x="370" y="288" width="14" height="52" rx="3" class="teal"/>
    <rect x="390" y="312" width="14" height="28" rx="3" class="ltteal"/>
    <!-- check mark -->
    <polyline points="470,300 484,316 512,284" fill="none" stroke="var(--c-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- small dot cluster -->
    <circle cx="540" cy="300" r="3.5" class="teal"/>
    <circle cx="552" cy="300" r="3.5" class="teal" opacity="0.6"/>
    <circle cx="546" cy="312" r="3.5" class="teal" opacity="0.4"/>
  </g>

  <!-- divergence arrow between the two fates -->
  <g opacity="0.9">
    <path class="line" d="M250 540 q 320 -40 620 30" stroke="var(--c-muted)" stroke-width="1.5" stroke-dasharray="2 8"/>
  </g>

  <!-- rotated small square accent -->
  <rect x="150" y="120" width="34" height="34" rx="6" fill="none" stroke="var(--c-accent-2)" stroke-width="2" transform="rotate(20 167 137)" opacity="0.8"/>
  <!-- concentric circles accent -->
  <circle cx="980" cy="470" r="26" class="line" stroke="var(--c-accent-3)"/>
  <circle cx="980" cy="470" r="14" class="line" stroke="var(--c-accent-3)"/>

  <!-- series number -->
  <text x="1150" y="600" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="232" font-weight="700" class="num" opacity="0.16">00</text>
</svg>
