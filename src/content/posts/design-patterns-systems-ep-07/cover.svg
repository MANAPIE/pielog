<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">상태의 경계와 서버 상태 분리: ep.07 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="26%" cy="30%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="76%" cy="74%" r="48%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <circle cx="80" cy="540" r="240" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="870" y="-120" width="500" height="350" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(9 1120 55)"/>

  <!-- 메타포: 같은 값이 여러 그릇에 -->
  <g transform="translate(600 315)">
    <!-- 중앙 원본 값 -->
    <g>
      <circle r="56" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="3.4"/>
      <circle r="22" fill="var(--c-accent-3)" opacity="0.8"/>
      <circle r="80" fill="none" stroke="var(--c-accent-3)" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.55"/>
    </g>

    <!-- 여섯 개의 그릇 (사본) -->
    <!-- 1 좌상 -->
    <g transform="translate(-280 -170) rotate(-8)">
      <rect x="-64" y="-40" width="128" height="80" rx="6" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="0" cy="-4" r="15" fill="var(--c-accent-3)" opacity="0.7"/>
      <rect x="-40" y="20" width="52" height="7" rx="3.5" fill="var(--c-line)" opacity="0.3"/>
    </g>
    <line x1="-60" y1="-46" x2="-220" y2="-140" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.5"/>

    <!-- 2 상 -->
    <g transform="translate(-40 -215) rotate(5)">
      <rect x="-64" y="-38" width="128" height="76" rx="6" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="0" cy="-4" r="13" fill="var(--c-accent-3)" opacity="0.5"/>
      <rect x="-40" y="18" width="44" height="7" rx="3.5" fill="var(--c-line)" opacity="0.3"/>
    </g>
    <line x1="-24" y1="-52" x2="-38" y2="-172" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.5"/>

    <!-- 3 우상 -->
    <g transform="translate(250 -175) rotate(9)">
      <rect x="-64" y="-40" width="128" height="80" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.6"/>
      <circle cx="0" cy="-4" r="15" fill="var(--c-accent-2)" opacity="0.6"/>
      <rect x="-40" y="20" width="60" height="7" rx="3.5" fill="var(--c-line)" opacity="0.3"/>
      <!-- 어긋남 표시 -->
      <circle cx="46" cy="-26" r="8" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.2"/>
      <line x1="42" y1="-30" x2="50" y2="-22" stroke="var(--c-accent-2)" stroke-width="2"/>
      <line x1="50" y1="-30" x2="42" y2="-22" stroke="var(--c-accent-2)" stroke-width="2"/>
    </g>
    <line x1="48" y1="-40" x2="196" y2="-144" stroke="var(--c-accent-2)" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.6"/>

    <!-- 4 좌하 -->
    <g transform="translate(-290 150) rotate(6)">
      <rect x="-64" y="-38" width="128" height="76" rx="6" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="0" cy="-4" r="13" fill="var(--c-accent-3)" opacity="0.6"/>
      <rect x="-40" y="18" width="50" height="7" rx="3.5" fill="var(--c-line)" opacity="0.3"/>
    </g>
    <line x1="-56" y1="34" x2="-230" y2="126" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.5"/>

    <!-- 5 하 -->
    <g transform="translate(-20 220) rotate(-5)">
      <rect x="-64" y="-38" width="128" height="76" rx="6" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.2"/>
      <circle cx="0" cy="-4" r="13" fill="var(--c-accent-3)" opacity="0.4"/>
      <rect x="-40" y="18" width="38" height="7" rx="3.5" fill="var(--c-line)" opacity="0.3"/>
    </g>
    <line x1="-14" y1="54" x2="-20" y2="178" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.5"/>

    <!-- 6 우하 -->
    <g transform="translate(260 170) rotate(-9)">
      <rect x="-64" y="-38" width="128" height="76" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.4"/>
      <circle cx="0" cy="-4" r="13" fill="var(--c-accent-4)" opacity="0.7"/>
      <rect x="-40" y="18" width="56" height="7" rx="3.5" fill="var(--c-line)" opacity="0.3"/>
    </g>
    <line x1="44" y1="36" x2="204" y2="140" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.5"/>

    <!-- 그릇 사이 동기화 선 (일부) -->
    <g stroke="var(--c-line)" stroke-width="1.1" stroke-dasharray="2 6" opacity="0.3">
      <line x1="-280" y1="-170" x2="-40" y2="-215"/>
      <line x1="-40" y1="-215" x2="250" y2="-175"/>
      <line x1="-290" y1="150" x2="-20" y2="220"/>
      <line x1="-20" y1="220" x2="260" y2="170"/>
      <line x1="-280" y1="-170" x2="-290" y2="150"/>
      <line x1="250" y1="-175" x2="260" y2="170"/>
    </g>
  </g>

  <!-- 디테일 -->
  <g transform="translate(150 120)">
    <circle r="4" fill="var(--c-accent-4)"/>
    <circle cx="16" r="4" fill="var(--c-accent-4)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent-4)" opacity="0.3"/>
  </g>
  <g transform="translate(1050 470) rotate(12)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-2)" stroke-width="1.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">07</text>
</svg>
