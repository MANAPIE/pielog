<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">신뢰 경계와 검증의 위치: ep.10 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="70%" cy="30%" r="48%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="24%" cy="72%" r="46%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <circle cx="1120" cy="560" r="230" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="-150" y="-120" width="490" height="340" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(-8 95 50)"/>

  <!-- 메타포: 관문(gate) 여러 겹 -->
  <g transform="translate(600 315)">
    <!-- 바깥(신뢰 못함) 쪽 요소들 -->
    <g transform="translate(-400 0)">
      <g transform="rotate(-9)">
        <rect x="-56" y="-140" width="112" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.2" stroke-dasharray="5 4"/>
        <rect x="-38" y="-122" width="60" height="8" rx="4" fill="var(--c-accent-2)" opacity="0.5"/>
      </g>
      <g transform="rotate(6)">
        <rect x="-56" y="-24" width="112" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.2" stroke-dasharray="5 4"/>
        <rect x="-38" y="-6" width="76" height="8" rx="4" fill="var(--c-accent-2)" opacity="0.5"/>
      </g>
      <g transform="rotate(-4)">
        <rect x="-56" y="90" width="112" height="52" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.2" stroke-dasharray="5 4"/>
        <rect x="-38" y="108" width="48" height="8" rx="4" fill="var(--c-accent-2)" opacity="0.5"/>
      </g>
      <!-- 점 무리 -->
      <g transform="translate(-30 190)">
        <circle r="5" fill="var(--c-accent-2)" opacity="0.7"/>
        <circle cx="18" r="5" fill="var(--c-accent-2)" opacity="0.45"/>
        <circle cx="36" r="5" fill="var(--c-accent-2)" opacity="0.22"/>
      </g>
    </g>

    <!-- 관문 4겹 -->
    <g transform="translate(-160 0)">
      <line x1="0" y1="-230" x2="6" y2="230" stroke="var(--c-accent)" stroke-width="4.6" stroke-linecap="round"/>
      <circle cx="3" cy="0" r="18" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="3"/>
      <polyline points="-7,0 -1,7 11,-8" fill="none" stroke="var(--c-accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(-50 0)">
      <line x1="0" y1="-210" x2="-5" y2="210" stroke="var(--c-accent)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-2" cy="-60" r="15" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.6"/>
      <circle cx="-2" cy="-60" r="5" fill="var(--c-accent)"/>
    </g>
    <g transform="translate(60 0)">
      <line x1="0" y1="-190" x2="6" y2="190" stroke="var(--c-accent)" stroke-width="3.4" stroke-linecap="round" opacity="0.7"/>
      <circle cx="3" cy="70" r="14" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
      <line x1="-3" y1="70" x2="9" y2="70" stroke="var(--c-accent)" stroke-width="2.6"/>
    </g>
    <g transform="translate(170 0)">
      <line x1="0" y1="-170" x2="-4" y2="170" stroke="var(--c-accent)" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- 통과한 것 (안쪽) -->
    <g transform="translate(340 0)">
      <g transform="rotate(4)">
        <rect x="-64" y="-120" width="128" height="60" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.8"/>
        <polyline points="-24,-94 -12,-82 20,-108" fill="none" stroke="var(--c-accent-4)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(-5)">
        <rect x="-64" y="-20" width="128" height="60" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.8"/>
        <polyline points="-24,6 -12,18 20,-8" fill="none" stroke="var(--c-accent-4)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <rect x="-82" y="-142" width="164" height="204" rx="9" fill="none" stroke="var(--c-accent-4)" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.6"/>
      <!-- 미니 바 -->
      <g transform="translate(-60 84)">
        <rect width="84" height="9" rx="4.5" fill="var(--c-accent-4)" opacity="0.75"/>
        <rect y="18" width="56" height="9" rx="4.5" fill="var(--c-accent-4)" opacity="0.4"/>
      </g>
    </g>

    <!-- 거부되어 튕겨나감 -->
    <g transform="translate(-230 -190) rotate(24)">
      <rect x="-30" y="-30" width="60" height="60" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.8"/>
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="var(--c-accent-2)" stroke-width="3.4"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="var(--c-accent-2)" stroke-width="3.4"/>
    </g>
    <path d="M -176 -100 Q -210 -160 -232 -178" fill="none" stroke="var(--c-accent-2)" stroke-width="1.8" stroke-dasharray="4 4"/>
  </g>

  <!-- 디테일 -->
  <g transform="translate(1050 140)" opacity="0.65">
    <circle r="44" fill="none" stroke="var(--c-accent-4)" stroke-width="1.5"/>
    <circle r="24" fill="none" stroke="var(--c-accent-4)" stroke-width="1.5" opacity="0.6"/>
  </g>
  <g transform="translate(140 520) rotate(15)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">10</text>
</svg>
