<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">Facade와 디자인 시스템 라이브러리 API — ep.06 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="grad1" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- 배경 stroke 도형 -->
  <circle cx="1100" cy="120" r="220" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.13"/>
  <rect x="-80" y="440" width="500" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12" transform="rotate(-7 170 600)"/>

  <!-- 좌측 클라이언트 -->
  <g transform="translate(160 315) rotate(-5)">
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.8"/>
    <line x1="-30" y1="-12" x2="30" y2="-12" stroke="var(--c-line)" stroke-width="2"/>
    <line x1="-30" y1="2" x2="20" y2="2" stroke="var(--c-line)" stroke-width="1.2" opacity="0.5"/>
    <circle cx="-25" cy="18" r="3" fill="var(--c-accent)"/>
    <circle cx="-12" cy="18" r="3" fill="var(--c-accent)" opacity="0.6"/>
  </g>

  <!-- 클라이언트 → Facade 화살표 -->
  <line x1="220" y1="315" x2="450" y2="315" stroke="var(--c-line)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <polygon points="450,310 460,315 450,320" fill="var(--c-line)" opacity="0.7"/>

  <!-- 중앙 Facade (단일 표면, 강조) -->
  <g transform="translate(580 315)">
    <!-- 포커스 링 -->
    <rect x="-100" y="-130" width="200" height="260" rx="9" fill="none" stroke="var(--c-accent-2)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.55"/>
    <!-- 본 박스: 길고 평평한 표면 -->
    <rect x="-90" y="-120" width="180" height="240" rx="6" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.5"/>

    <!-- 단일 입구 표시 (큰 두꺼운 라인) -->
    <line x1="-65" y1="-80" x2="65" y2="-80" stroke="var(--c-line)" stroke-width="3"/>
    <line x1="-65" y1="-55" x2="40" y2="-55" stroke="var(--c-line)" stroke-width="1.5" opacity="0.4"/>
    <line x1="-65" y1="-35" x2="50" y2="-35" stroke="var(--c-line)" stroke-width="1.5" opacity="0.4"/>

    <!-- 중앙 강조 점 (단일 진입점) -->
    <circle cx="0" cy="20" r="14" fill="var(--c-accent-2)"/>
    <circle cx="0" cy="20" r="22" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5" opacity="0.5"/>

    <!-- 하단 미니 바 -->
    <rect x="-65" y="60" width="50" height="6" rx="2" fill="var(--c-accent)" opacity="0.7"/>
    <rect x="-65" y="74" width="30" height="6" rx="2" fill="var(--c-accent)" opacity="0.4"/>
  </g>

  <!-- Facade → 안쪽 서브시스템들로 분기 화살표 -->
  <g opacity="0.6">
    <line x1="670" y1="225" x2="820" y2="170" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="3 4"/>
    <polygon points="820,170 812,170 815,180" fill="var(--c-line)" transform="rotate(-20 820 170)"/>

    <line x1="670" y1="275" x2="850" y2="265" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="3 4"/>
    <polygon points="850,265 842,261 842,269" fill="var(--c-line)"/>

    <line x1="670" y1="315" x2="870" y2="315" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="3 4"/>
    <polygon points="870,315 862,311 862,319" fill="var(--c-line)"/>

    <line x1="670" y1="355" x2="850" y2="365" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="3 4"/>
    <polygon points="850,365 842,361 842,369" fill="var(--c-line)"/>

    <line x1="670" y1="405" x2="820" y2="460" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="3 4"/>
    <polygon points="820,460 812,460 815,450" fill="var(--c-line)" transform="rotate(20 820 460)"/>
  </g>

  <!-- 안쪽 서브시스템 (작은 다섯 박스, 격자) -->
  <g transform="translate(870 160) rotate(-4)">
    <rect x="-30" y="-18" width="60" height="36" rx="3" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.4"/>
    <line x1="-20" y1="-5" x2="15" y2="-5" stroke="var(--c-line)" stroke-width="1.5"/>
    <circle cx="-15" cy="8" r="2" fill="var(--c-accent-3)"/>
  </g>
  <g transform="translate(900 255) rotate(3)">
    <rect x="-30" y="-18" width="60" height="36" rx="3" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.4"/>
    <line x1="-20" y1="-5" x2="15" y2="-5" stroke="var(--c-line)" stroke-width="1.5"/>
    <circle cx="-15" cy="8" r="2" fill="var(--c-accent-3)"/>
  </g>
  <g transform="translate(930 315) rotate(-2)">
    <rect x="-30" y="-18" width="60" height="36" rx="3" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.4"/>
    <line x1="-20" y1="-5" x2="15" y2="-5" stroke="var(--c-line)" stroke-width="1.5"/>
    <circle cx="-15" cy="8" r="2" fill="var(--c-accent-3)"/>
  </g>
  <g transform="translate(900 375) rotate(4)">
    <rect x="-30" y="-18" width="60" height="36" rx="3" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.4"/>
    <line x1="-20" y1="-5" x2="15" y2="-5" stroke="var(--c-line)" stroke-width="1.5"/>
    <circle cx="-15" cy="8" r="2" fill="var(--c-accent-3)"/>
  </g>
  <g transform="translate(870 470) rotate(-3)">
    <rect x="-30" y="-18" width="60" height="36" rx="3" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.4"/>
    <line x1="-20" y1="-5" x2="15" y2="-5" stroke="var(--c-line)" stroke-width="1.5"/>
    <circle cx="-15" cy="8" r="2" fill="var(--c-accent-3)"/>
  </g>

  <!-- 우상단 동심원 -->
  <g transform="translate(1030 140)" opacity="0.7">
    <circle r="45" fill="none" stroke="var(--c-accent)" stroke-width="1.5"/>
    <circle r="26" fill="none" stroke="var(--c-accent)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌상단 작은 점 무리 -->
  <g transform="translate(180 110)">
    <circle r="4" fill="var(--c-accent-3)"/>
    <circle cx="16" r="4" fill="var(--c-accent-3)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent-3)" opacity="0.3"/>
  </g>

  <!-- 좌하단 회전 사각형 -->
  <g transform="translate(150 530) rotate(-15)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
  </g>

  <!-- 우하단 큰 시리즈 번호 -->
  <text x="1130" y="575" class="num" text-anchor="end">06</text>
</svg>
