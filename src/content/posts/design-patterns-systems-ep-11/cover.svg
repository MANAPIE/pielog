<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">배포 경계와 마이크로 프론트엔드: ep.11 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="26%" cy="28%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-4)" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="var(--c-accent-4)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="78%" cy="76%" r="46%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <circle cx="1140" cy="120" r="250" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="-140" y="420" width="500" height="350" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(-10 110 595)"/>

  <!-- 메타포: 하나의 큰 블록이 여러 조각으로 분리되어 각자 궤도를 도는 -->
  <g transform="translate(600 315)">
    <!-- 좌: 하나의 큰 블록 -->
    <g transform="translate(-350 0) rotate(-4)">
      <rect x="-110" y="-150" width="220" height="300" rx="8" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="3"/>
      <!-- 내부 구획들 (붙어 있음) -->
      <line x1="-110" y1="-50" x2="110" y2="-50" stroke="var(--c-line)" stroke-width="1.4" opacity="0.35"/>
      <line x1="-110" y1="50" x2="110" y2="50" stroke="var(--c-line)" stroke-width="1.4" opacity="0.35"/>
      <rect x="-80" y="-120" width="70" height="10" rx="5" fill="var(--c-accent-4)" opacity="0.6"/>
      <rect x="-80" y="-20" width="90" height="10" rx="5" fill="var(--c-accent-4)" opacity="0.45"/>
      <rect x="-80" y="80" width="60" height="10" rx="5" fill="var(--c-accent-4)" opacity="0.3"/>
      <!-- 하나의 배포 화살표 -->
      <g transform="translate(0 190)">
        <line x1="0" y1="-24" x2="0" y2="10" stroke="var(--c-line)" stroke-width="3"/>
        <polygon points="0,10 -9,-2 9,-2" fill="var(--c-line)"/>
      </g>
    </g>

    <!-- 중앙: 분리 경계 -->
    <g transform="translate(-150 0)">
      <line x1="0" y1="-230" x2="8" y2="230" stroke="var(--c-accent-4)" stroke-width="4.6" stroke-linecap="round"/>
      <circle cx="4" cy="0" r="10" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="3"/>
    </g>

    <!-- 우: 세 조각이 각자 궤도 -->
    <!-- 조각 1 -->
    <g transform="translate(60 -140) rotate(6)">
      <rect x="-92" y="-52" width="184" height="104" rx="7" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.8"/>
      <rect x="-68" y="-30" width="70" height="10" rx="5" fill="var(--c-accent-4)" opacity="0.7"/>
      <rect x="-68" y="-12" width="110" height="8" rx="4" fill="var(--c-line)" opacity="0.28"/>
      <circle cx="-58" cy="22" r="5" fill="var(--c-accent-4)"/>
      <circle cx="-42" cy="22" r="5" fill="var(--c-accent-4)" opacity="0.5"/>
      <!-- 개별 배포 화살표 -->
      <g transform="translate(110 0)">
        <line x1="0" y1="-16" x2="0" y2="16" stroke="var(--c-accent-4)" stroke-width="2.6"/>
        <polygon points="0,16 -7,6 7,6" fill="var(--c-accent-4)"/>
      </g>
    </g>

    <!-- 조각 2 -->
    <g transform="translate(140 20) rotate(-5)">
      <rect x="-92" y="-52" width="184" height="104" rx="7" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.8"/>
      <rect x="-68" y="-30" width="86" height="10" rx="5" fill="var(--c-accent)" opacity="0.7"/>
      <rect x="-68" y="-12" width="96" height="8" rx="4" fill="var(--c-line)" opacity="0.28"/>
      <rect x="-68" y="14" width="52" height="8" rx="4" fill="var(--c-line)" opacity="0.18"/>
      <g transform="translate(110 0)">
        <line x1="0" y1="-16" x2="0" y2="16" stroke="var(--c-accent)" stroke-width="2.6"/>
        <polygon points="0,16 -7,6 7,6" fill="var(--c-accent)"/>
      </g>
    </g>

    <!-- 조각 3 -->
    <g transform="translate(50 170) rotate(4)">
      <rect x="-92" y="-52" width="184" height="104" rx="7" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2.8"/>
      <rect x="-68" y="-30" width="60" height="10" rx="5" fill="var(--c-accent-3)" opacity="0.7"/>
      <rect x="-68" y="-12" width="120" height="8" rx="4" fill="var(--c-line)" opacity="0.28"/>
      <polyline points="-64,22 -54,32 -34,10" fill="none" stroke="var(--c-accent-3)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(110 0)">
        <line x1="0" y1="-16" x2="0" y2="16" stroke="var(--c-accent-3)" stroke-width="2.6"/>
        <polygon points="0,16 -7,6 7,6" fill="var(--c-accent-3)"/>
      </g>
    </g>

    <!-- 조각 사이 계약선 (점선) -->
    <g stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.5">
      <line x1="80" y1="-86" x2="128" y2="-32"/>
      <line x1="132" y1="72" x2="70" y2="118"/>
    </g>
    <circle cx="104" cy="-59" r="7" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.2"/>
    <circle cx="101" cy="95" r="7" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.2"/>

    <!-- 우측 포커스 링 -->
    <circle cx="330" cy="-40" r="56" fill="none" stroke="var(--c-accent-4)" stroke-width="1.4" stroke-dasharray="3 6" opacity="0.6"/>
    <circle cx="330" cy="-40" r="32" fill="none" stroke="var(--c-accent-4)" stroke-width="1.6" opacity="0.5"/>
  </g>

  <!-- 디테일 -->
  <g transform="translate(150 110)">
    <circle r="4" fill="var(--c-accent-2)"/>
    <circle cx="16" r="4" fill="var(--c-accent-2)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent-2)" opacity="0.3"/>
  </g>
  <g transform="translate(1030 480) rotate(-16)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">11</text>
</svg>
