<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="웹뷰는 브라우저가 아니다 ep.04 cover">
  <style>
  :root {
    --c-bg: #EEF5F6;
    --c-fg: #10202A;
    --c-muted: #5E7480;
    --c-accent: #0E7490; --c-accent-2: #22B8CF; --c-accent-3: #C98A3B;
    --c-num: rgba(14, 116, 144, 0.14);
    --c-dot: rgba(14, 116, 144, 0.10);
    --c-line: rgba(14, 116, 144, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-bg: #0A161A;
      --c-fg: #DCE8EA;
      --c-muted: #8AA0A8;
      --c-accent: #4DD4EC; --c-accent-2: #0E7490; --c-accent-3: #E0A860;
      --c-num: rgba(77, 212, 236, 0.15);
      --c-dot: rgba(77, 212, 236, 0.10);
      --c-line: rgba(77, 212, 236, 0.20);
    }
  }
  .cover-bg { fill: var(--c-bg); }
  .ep-number {
    font: 900 240px ui-monospace, "SF Mono", Menlo, monospace;
    fill: var(--c-num); letter-spacing: -0.04em;
  }
</style>
  <defs>
    <pattern id="dots-wnb04" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="var(--c-dot)"/>
    </pattern>
    <radialGradient id="halo-wnb04a" cx="0.10" cy="0.80" r="0.58">
      <stop offset="0" stop-color="var(--c-accent)" stop-opacity="0.26"/>
      <stop offset="1" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-wnb04b" cx="0.80" cy="0.12" r="0.6">
      <stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-wnb04)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb04a)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb04b)"/>

  <!-- 배경 무채 stroke 도형 (오프캔버스) -->
  <circle cx="1140" cy="40" r="300" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <circle cx="1140" cy="40" r="212" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <rect x="-240" y="330" width="560" height="560" rx="50" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(12 40 610)"/>

  <!-- 조합 중인 음절 블록: 두 조각은 확정, 마지막 조각은 아직 잠정 -->
  <g transform="translate(400 300) rotate(-7)">
    <!-- 잠정 영역을 감싸는 점선 링 -->
    <rect x="-186" y="-206" width="372" height="412" rx="34" fill="none" stroke="var(--c-accent-3)" stroke-width="2.5" stroke-dasharray="10 9"/>
    <rect x="-160" y="-180" width="320" height="360" rx="24" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>

    <!-- 확정된 조각 1 -->
    <rect x="-136" y="-150" width="272" height="88" rx="12" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.2"/>
    <rect x="-112" y="-130" width="56" height="26" rx="4" fill="var(--c-accent)" opacity="0.6"/>
    <rect x="-48" y="-130" width="56" height="26" rx="4" fill="var(--c-accent)" opacity="0.3"/>
    <rect x="-112" y="-96" width="148" height="9" rx="4.5" fill="var(--c-muted)" opacity="0.42"/>

    <!-- 확정된 조각 2 -->
    <rect x="-136" y="-48" width="272" height="88" rx="12" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="1.8" stroke-opacity="0.6"/>
    <rect x="-112" y="-28" width="56" height="26" rx="4" fill="var(--c-accent)" opacity="0.34"/>
    <rect x="-112" y="6" width="112" height="9" rx="4.5" fill="var(--c-muted)" opacity="0.3"/>

    <!-- 아직 잠정인 조각 -->
    <rect x="-136" y="54" width="272" height="88" rx="12" fill="none" stroke="var(--c-accent-3)" stroke-width="3" stroke-dasharray="9 8"/>
    <circle cx="-96" cy="98" r="7" fill="var(--c-accent-3)"/>
    <circle cx="-66" cy="98" r="6" fill="none" stroke="var(--c-accent-3)" stroke-width="1.8" opacity="0.72"/>
    <circle cx="-38" cy="98" r="5" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6" opacity="0.45"/>
  </g>

  <!-- 잠정에서 확정으로 건너가는 얇은 연결선 -->
  <line x1="572" y1="224" x2="756" y2="262" stroke="var(--c-accent)" stroke-width="1.8" stroke-dasharray="7 7" opacity="0.6"/>
  <circle cx="566" cy="223" r="6" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2"/>
  <circle cx="762" cy="263" r="6" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2"/>

  <!-- 뒤늦게 한 번에 따라잡는 계단 -->
  <line x1="600" y1="486" x2="752" y2="374" stroke="var(--c-accent-2)" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.5"/>
  <path d="M 600 486 H 648 V 428 H 700 V 370 H 742" fill="none" stroke="var(--c-accent-2)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="758,370 736,358 736,382" fill="var(--c-accent-2)"/>

  <!-- 확정 지점: 포커스 링과 커밋된 블록 -->
  <circle cx="880" cy="270" r="116" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="4 9"/>
  <circle cx="880" cy="270" r="82" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5"/>
  <g transform="rotate(8 880 270)">
    <rect x="838" y="228" width="84" height="84" rx="16" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
    <path d="M 858 270 l 14 15 l 27 -30" fill="none" stroke="var(--c-accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 흩어진 디테일 -->
  <rect x="150" y="64" width="84" height="84" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5" transform="rotate(14 192 106)"/>
  <line x1="660" y1="120" x2="642" y2="252" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="6 9" stroke-opacity="0.5"/>
  <g transform="translate(752 152)" opacity="0.6">
    <circle r="42" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6"/>
    <circle r="23" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6" opacity="0.6"/>
  </g>
  <circle cx="1040" cy="120" r="9" fill="none" stroke="var(--c-accent)" stroke-width="2"/>
  <circle cx="1070" cy="142" r="6" fill="var(--c-accent-2)"/>
  <circle cx="1022" cy="152" r="5" fill="var(--c-accent-3)"/>
  <polygon points="126,592 176,592 151,548" fill="none" stroke="var(--c-accent-3)" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="64" y="520" width="54" height="13" rx="5" fill="var(--c-accent-2)" fill-opacity="0.55"/>
  <rect x="92" y="542" width="32" height="8" rx="4" fill="var(--c-accent-3)" fill-opacity="0.7"/>

  <text class="ep-number" x="1164" y="594" text-anchor="end">04</text>
</svg>
