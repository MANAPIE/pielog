<svg viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fb">
  <title id="t-fb">행동이 일어나는 세 조건</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-fb-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="580" />
  <text x="24" y="36" class="ttl">행동이 일어나는 세 조건</text>
  <text x="24" y="54" class="cap">B=MAP. 동기, 능력, 프롬프트가 같은 순간에 함께 있어야 행동이 일어납니다.</text>
  <rect x="24" y="70" width="452" height="58" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
  <text x="40" y="95" class="nm">동기</text>
  <text x="40" y="113" class="lbl" style="fill:var(--c-accent-3)">MOTIVATION</text>
  <text x="150" y="104" class="td">그 행동을 하고 싶은 정도입니다.</text>
  <rect x="24" y="136" width="452" height="58" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
  <text x="40" y="161" class="nm">능력</text>
  <text x="40" y="179" class="lbl" style="fill:var(--c-accent-3)">ABILITY</text>
  <text x="150" y="161" class="td">그 행동을 할 수 있는 정도입니다.</text>
  <text x="150" y="179" class="cap">그 순간 가장 부족한 자원에 따라 정해집니다.</text>
  <rect x="24" y="202" width="452" height="58" rx="8" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.6" />
  <text x="40" y="227" class="nm">프롬프트</text>
  <text x="40" y="245" class="lbl" style="fill:var(--c-accent-3)">PROMPT</text>
  <text x="150" y="227" class="td">지금 행동하라고 알리는 계기입니다.</text>
  <text x="150" y="245" class="cap">버튼, 알림, 안내 문구 등이 있습니다.</text>
  <line x1="250" y1="262" x2="250" y2="284" stroke="var(--c-fg)" stroke-width="1.5" marker-end="url(#a-fb-f)" />
  <rect x="24" y="288" width="452" height="50" rx="8" class="card" stroke="var(--c-fg)" />
  <text x="250" y="309" class="nm" text-anchor="middle">행동(Behavior)</text>
  <text x="250" y="326" class="cap" text-anchor="middle">행동이 일어나지 않았다면 셋 중 적어도 하나가 빠져 있습니다.</text>
  <line x1="24" y1="358" x2="476" y2="358" stroke="var(--c-divider)" stroke-width="1" />
  <text x="24" y="380" class="th">같은 알림 권한 요청, 다른 시점</text>
  <rect x="24" y="392" width="452" height="70" rx="8" class="card" stroke="var(--c-accent-2)" />
  <text x="40" y="412" class="lbl" style="fill:var(--c-accent-2)">피해야 할 시점</text>
  <text x="40" y="432" class="nm">앱을 처음 열자마자 묻는 알림 권한</text>
  <text x="40" y="450" class="cap">알림을 받을 이유를 아직 모를 때 오는 프롬프트입니다.</text>
  <rect x="24" y="470" width="452" height="70" rx="8" class="card" stroke="var(--c-accent)" />
  <text x="40" y="490" class="lbl" style="fill:var(--c-accent)">적절한 시점</text>
  <text x="40" y="510" class="nm">첫 주문을 마친 직후에 묻는 알림 권한</text>
  <text x="40" y="528" class="cap">"배송 상태를 알림으로 받으시겠어요?" 알림을 받을 이유가 생긴 순간에 옵니다.</text>
  <text x="24" y="564" class="cap">출처: Fogg, B. J. Fogg Behavior Model. 알림 권한 예시와 함께 재구성.</text>
</svg>
