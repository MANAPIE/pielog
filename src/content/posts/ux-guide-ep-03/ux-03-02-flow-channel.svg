<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fl">
  <title id="t-fl">플로우 채널</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-fl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-fl-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="420" />
  <line x1="64" y1="340" x2="64" y2="40" stroke="var(--c-fg)" stroke-width="1.5" marker-end="url(#a-fl-f)" />
  <line x1="64" y1="340" x2="470" y2="340" stroke="var(--c-fg)" stroke-width="1.5" marker-end="url(#a-fl-f)" />
  <text x="40" y="190" class="th" transform="rotate(-90 40 190)" text-anchor="middle">도전 수준</text>
  <text x="267" y="364" class="th" text-anchor="middle">능력</text>
  <polygon points="64,340 150,340 450,66 450,40 390,40" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
  <text x="263" y="184" class="nm" text-anchor="middle" transform="rotate(-43.8 263 184)">플로우</text>
  <text x="263" y="202" class="cap" text-anchor="middle" transform="rotate(-43.8 263 202)">명확한 목표 · 즉각적 피드백 · 능력과 도전의 균형</text>
  <g transform="translate(84 56)">
    <text x="0" y="0" class="nm" fill="var(--c-accent-2)" style="fill:var(--c-accent-2)">불안</text>
    <text x="0" y="18" class="cap">도전이 능력보다 높을 때입니다.</text>
    <text x="0" y="36" class="cap">복잡한 양식, 알 수 없는 오류가 그 예입니다.</text>
  </g>
  <g transform="translate(270 296)">
    <text x="0" y="0" class="nm" fill="var(--c-accent-3)" style="fill:var(--c-accent-3)">지루함</text>
    <text x="0" y="18" class="cap">능력이 도전보다 높을 때입니다.</text>
    <text x="0" y="36" class="cap">불필요한 확인 대화상자, 반복 입력이 그 예입니다.</text>
  </g>
  <text x="24" y="404" class="cap">출처: Csikszentmihalyi, M. (1990). Flow. 플로우 채널 모형을 UX 예시와 함께 재구성.</text>
</svg>
