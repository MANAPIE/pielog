<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="IT UX 가이드 ep.03 cover">
  <style>
  :root { --c-bg: #F8F3EE; --c-fg: #1A1F2E; --c-muted: #6B7280; --c-accent: #B4502A; --c-accent-2: #C9A227; --c-accent-3: #6E3A78; --c-num: rgba(180,80,42, 0.14); --c-dot: rgba(180,80,42, 0.12); --c-line: rgba(26, 31, 46, 0.14); }
  @media (prefers-color-scheme: dark) { :root { --c-bg: #17120F; --c-fg: #E8E6E1; --c-muted: #8B92A0; --c-accent: #F0956E; --c-accent-2: #E8C45A; --c-accent-3: #C08FE0; --c-num: rgba(240,149,110, 0.16); --c-dot: rgba(240,149,110, 0.12); --c-line: rgba(232, 230, 225, 0.16); } }
  .cover-bg { fill: var(--c-bg); }
  .ep-number { font: 900 240px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-num); letter-spacing: -0.04em; }
  </style>
  <defs>
    <pattern id="dots-ux03" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.4" fill="var(--c-dot)"/></pattern>
    <radialGradient id="halo-ux03a" cx="0.2" cy="0.2" r="0.6"><stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.26"/><stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-ux03b" cx="0.84" cy="0.84" r="0.55"><stop offset="0" stop-color="var(--c-accent)" stop-opacity="0.24"/><stop offset="1" stop-color="var(--c-accent)" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-ux03)"/>
  <rect width="1200" height="630" fill="url(#halo-ux03a)"/>
  <rect width="1200" height="630" fill="url(#halo-ux03b)"/>
  <circle cx="1080" cy="80" r="320" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <rect x="-140" y="360" width="520" height="420" rx="40" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(12 120 570)"/>

  <!-- 메타포: 용량 막대 위에 쌓인 부하, 넘치는 블록 -->
  <g transform="translate(600 330)">
    <rect x="-150" y="-190" width="300" height="380" rx="24" fill="none" stroke="var(--c-fg)" stroke-width="2.5" opacity="0.6"/>
    <rect x="-126" y="70" width="252" height="96" rx="12" fill="var(--c-accent-3)" fill-opacity="0.35" stroke="var(--c-accent-3)" stroke-width="3"/>
    <rect x="-126" y="-40" width="252" height="96" rx="12" fill="var(--c-accent-2)" fill-opacity="0.45" stroke="var(--c-accent-2)" stroke-width="3" transform="rotate(-3)"/>
    <rect x="-126" y="-150" width="252" height="96" rx="12" fill="var(--c-accent)" fill-opacity="0.35" stroke="var(--c-accent)" stroke-width="3" transform="rotate(4)"/>
    <g transform="translate(60 -262) rotate(14)">
      <rect x="-126" y="0" width="252" height="96" rx="12" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="3" stroke-dasharray="10 10"/>
    </g>
    <line x1="-190" y1="-190" x2="190" y2="-190" stroke="var(--c-accent-2)" stroke-width="3" stroke-dasharray="6 8"/>
  </g>

  <g transform="translate(180 170)">
    <circle r="62" fill="none" stroke="var(--c-accent)" stroke-width="2.5" stroke-dasharray="4 8"/>
    <circle r="38" fill="none" stroke="var(--c-accent)" stroke-width="2"/>
    <circle r="14" fill="var(--c-accent)"/>
  </g>
  <g fill="var(--c-accent-3)"><circle cx="1000" cy="450" r="9"/><circle cx="1028" cy="466" r="6" opacity="0.7"/><circle cx="986" cy="480" r="5" opacity="0.5"/><circle cx="1020" cy="492" r="4" opacity="0.4"/></g>
  <g transform="translate(940 200) rotate(-10)"><rect width="140" height="12" rx="6" fill="var(--c-accent)" fill-opacity="0.7"/><rect y="24" width="90" height="12" rx="6" fill="var(--c-accent-2)" fill-opacity="0.7"/><rect y="48" width="110" height="12" rx="6" fill="var(--c-accent-3)" fill-opacity="0.7"/></g>
  <polygon points="250,470 296,550 204,550" fill="var(--c-accent-2)" fill-opacity="0.5"/>
  <polygon points="250,470 296,550 204,550" fill="none" stroke="var(--c-accent-2)" stroke-width="2"/>
  <line x1="120" y1="330" x2="330" y2="330" stroke="var(--c-accent-3)" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <text class="ep-number" x="1164" y="594" text-anchor="end">03</text>
</svg>
