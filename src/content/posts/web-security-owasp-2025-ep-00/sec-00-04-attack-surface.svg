<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="배포 직후 자동 스캐너가 공격 표면을 스캔하는 모습">
  <style>
    /* sec-theme-vars */
    :root {
      --sec-fg: #0f172a;
      --sec-fg-muted: #64748b;
      --sec-bg: #ffffff;
      --sec-border: #e2e8f0;
      --sec-slate-50: #f8fafc;
      --sec-slate-100: #f1f5f9;
      --sec-slate-200: #e2e8f0;
      --sec-slate-300: #cbd5e1;
      --sec-slate-400: #94a3b8;
      --sec-slate-500: #64748b;
      --sec-slate-700: #334155;
      --sec-blue-50: #eff6ff;
      --sec-blue-200: #bfdbfe;
      --sec-blue-500: #3b82f6;
      --sec-blue-700: #1d4ed8;
      --sec-red-50: #fef2f2;
      --sec-red-100: #fee2e2;
      --sec-red-200: #fecaca;
      --sec-red-500: #ef4444;
      --sec-red-700: #b91c1c;
      --sec-amber-50: #fffbeb;
      --sec-amber-100: #fef3c7;
      --sec-amber-200: #fde68a;
      --sec-amber-500: #f59e0b;
      --sec-amber-700: #b45309;
      --sec-emerald-50: #ecfdf5;
      --sec-emerald-100: #d1fae5;
      --sec-emerald-200: #a7f3d0;
      --sec-emerald-500: #10b981;
      --sec-emerald-700: #047857;
      --sec-violet-50: #f5f3ff;
      --sec-violet-200: #ddd6fe;
      --sec-violet-500: #8b5cf6;
      --sec-violet-700: #6d28d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sec-fg: #e2e8f0;
        --sec-fg-muted: #94a3b8;
        --sec-bg: #0f172a;
        --sec-border: #334155;
        --sec-slate-50: #1e293b;
        --sec-slate-100: #334155;
        --sec-slate-200: #475569;
        --sec-slate-300: #64748b;
        --sec-slate-400: #94a3b8;
        --sec-slate-500: #cbd5e1;
        --sec-slate-700: #e2e8f0;
        --sec-blue-50: #172554;
        --sec-blue-200: #1e40af;
        --sec-blue-500: #60a5fa;
        --sec-blue-700: #93c5fd;
        --sec-red-50: #450a0a;
        --sec-red-100: #7f1d1d;
        --sec-red-200: #991b1b;
        --sec-red-500: #f87171;
        --sec-red-700: #fca5a5;
        --sec-amber-50: #451a03;
        --sec-amber-100: #78350f;
        --sec-amber-200: #92400e;
        --sec-amber-500: #fbbf24;
        --sec-amber-700: #fcd34d;
        --sec-emerald-50: #022c22;
        --sec-emerald-100: #064e3b;
        --sec-emerald-200: #065f46;
        --sec-emerald-500: #34d399;
        --sec-emerald-700: #6ee7b7;
        --sec-violet-50: #2e1065;
        --sec-violet-200: #5b21b6;
        --sec-violet-500: #a78bfa;
        --sec-violet-700: #c4b5fd;
      }
    }

    .title { font: 600 16px system-ui, sans-serif; fill: var(--sec-fg, #0f172a); }
    .caption { font: 400 11px system-ui, sans-serif; fill: var(--sec-fg-muted, #64748b); }
    .server-label { font: 600 13px system-ui, sans-serif; fill: var(--sec-fg, #0f172a); }
    .server-sub { font: 400 11px system-ui, sans-serif; fill: var(--sec-fg-muted, #64748b); }
    .probe { font: 500 11px system-ui, sans-serif; }
    .probe-mono { font: 400 11px "SF Mono", ui-monospace, monospace; }
    .src-label { font: 500 10px system-ui, sans-serif; fill: var(--sec-fg-muted, #64748b); }

    .server-box { fill: var(--sec-blue-50, #eff6ff); stroke: var(--sec-blue-500, #3b82f6); stroke-width: 1.6; }
    .probe-box { fill: var(--sec-red-50, #fef2f2); stroke: var(--sec-red-200, #fecaca); stroke-width: 1; }
    .probe-text { fill: var(--sec-red-700, #b91c1c); }

    .bot { fill: var(--sec-slate-50, #f8fafc); stroke: var(--sec-slate-200, #e2e8f0); stroke-width: 1; }
    .arrow { stroke: var(--sec-red-500, #ef4444); stroke-width: 1.2; fill: none; opacity: 0.6; }
  </style>

  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sec-red-500, #ef4444)" opacity="0.6"/>
    </marker>
  </defs>

  <text x="24" y="36" class="title">배포 직후의 정적. 하지만 로그는 조용하지 않습니다.</text>
  <text x="24" y="56" class="caption">공개된 순간부터 전 세계 스캐너가 공격 표면을 탐색합니다. 표적 공격이 아니라 인터넷의 기본값입니다.</text>

  <!-- 스캐너 봇들 (좌측) -->
  <g>
    <rect x="24" y="96" width="120" height="32" rx="8" class="bot"/>
    <circle cx="44" cy="112" r="6" fill="var(--sec-slate-500, #64748b)"/>
    <text x="58" y="116" class="src-label">Scanner · RU</text>
  </g>
  <g>
    <rect x="24" y="140" width="120" height="32" rx="8" class="bot"/>
    <circle cx="44" cy="156" r="6" fill="var(--sec-slate-500, #64748b)"/>
    <text x="58" y="160" class="src-label">Scanner · CN</text>
  </g>
  <g>
    <rect x="24" y="184" width="120" height="32" rx="8" class="bot"/>
    <circle cx="44" cy="200" r="6" fill="var(--sec-slate-500, #64748b)"/>
    <text x="58" y="204" class="src-label">Botnet · Misc</text>
  </g>
  <g>
    <rect x="24" y="228" width="120" height="32" rx="8" class="bot"/>
    <circle cx="44" cy="244" r="6" fill="var(--sec-slate-500, #64748b)"/>
    <text x="58" y="248" class="src-label">Shodan Crawler</text>
  </g>
  <g>
    <rect x="24" y="272" width="120" height="32" rx="8" class="bot"/>
    <circle cx="44" cy="288" r="6" fill="var(--sec-slate-500, #64748b)"/>
    <text x="58" y="292" class="src-label">Credential Stuff</text>
  </g>

  <!-- Probe requests (가운데 리스트) -->
  <rect x="192" y="96" width="300" height="208" rx="10" fill="var(--sec-red-50, #fef2f2)" stroke="var(--sec-red-200, #fecaca)" stroke-width="1"/>
  <text x="204" y="118" class="probe probe-text">자동 스캐너가 두드리는 대표 경로</text>

  <text x="204" y="142" class="probe-mono probe-text">GET /admin</text>
  <text x="204" y="160" class="probe-mono probe-text">GET /.env</text>
  <text x="204" y="178" class="probe-mono probe-text">GET /.git/config</text>
  <text x="204" y="196" class="probe-mono probe-text">GET /wp-login.php</text>
  <text x="204" y="214" class="probe-mono probe-text">GET /phpmyadmin</text>
  <text x="204" y="232" class="probe-mono probe-text">GET /actuator/env</text>
  <text x="204" y="250" class="probe-mono probe-text">GET /api/v1/users</text>
  <text x="204" y="268" class="probe-mono probe-text">POST /login  × 수백회</text>
  <text x="204" y="286" class="probe-mono probe-text">GET /.aws/credentials</text>

  <!-- 화살표 (scanner → probes) -->
  <line x1="144" y1="112" x2="190" y2="120" class="arrow" marker-end="url(#arrR)"/>
  <line x1="144" y1="156" x2="190" y2="160" class="arrow" marker-end="url(#arrR)"/>
  <line x1="144" y1="200" x2="190" y2="200" class="arrow" marker-end="url(#arrR)"/>
  <line x1="144" y1="244" x2="190" y2="240" class="arrow" marker-end="url(#arrR)"/>
  <line x1="144" y1="288" x2="190" y2="280" class="arrow" marker-end="url(#arrR)"/>

  <!-- 중앙 → 서버 -->
  <line x1="494" y1="200" x2="548" y2="200" class="arrow" marker-end="url(#arrR)"/>

  <!-- 서버 (우측) -->
  <rect x="552" y="140" width="144" height="124" rx="12" class="server-box"/>
  <text x="624" y="180" text-anchor="middle" class="server-label">Your Service</text>
  <text x="624" y="200" text-anchor="middle" class="server-sub">방금 배포한</text>
  <text x="624" y="216" text-anchor="middle" class="server-sub">당신의 서비스</text>

  <!-- 서버 아이콘 이미지 (간단한 서버 모양) -->
  <rect x="592" y="230" width="64" height="6" rx="2" fill="var(--sec-blue-500, #3b82f6)" opacity="0.4"/>
  <rect x="592" y="240" width="64" height="6" rx="2" fill="var(--sec-blue-500, #3b82f6)" opacity="0.3"/>
  <rect x="592" y="250" width="64" height="6" rx="2" fill="var(--sec-blue-500, #3b82f6)" opacity="0.2"/>

  <!-- 하단 문구 -->
  <text x="360" y="336" text-anchor="middle" class="caption">CVE 공개 → 스캐너 모듈 추가까지 보통 며칠 단위.</text>
  <text x="360" y="354" text-anchor="middle" class="caption">Dependabot PR을 한 주 미루면, 그 한 주가 공격자의 기회 윈도우가 됩니다.</text>
</svg>
