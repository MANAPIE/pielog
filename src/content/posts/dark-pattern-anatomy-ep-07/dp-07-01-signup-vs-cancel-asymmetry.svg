<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>가입 vs 해지 여정 비대칭</title>
<desc>가입은 3단계, 해지는 8단계를 거치는 비대칭 구조를 시각적으로 비교한 다이어그램</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #B4B2A9; stroke-width: 0.5; fill: none; }
  .c-teal rect { fill: #E1F5EE; stroke: #5DCAA5; }
  .c-teal text { fill: #085041; }
  .c-coral rect { fill: #FAECE7; stroke: #F0997B; }
  .c-coral text { fill: #4A1B0C; }
  .c-amber rect { fill: #FAEEDA; stroke: #FAC775; }
  .c-amber text { fill: #633806; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #D3D1C7; }
    .ts { fill: #B4B2A9; }
    .arr { stroke: #5F5E5A; }
    .c-teal rect { fill: #04342C; stroke: #0F6E56; }
    .c-teal text { fill: #9FE1CB; }
    .c-coral rect { fill: #3A1A0E; stroke: #A03A1F; }
    .c-coral text { fill: #F8C9B5; }
    .c-amber rect { fill: #412402; stroke: #854F0B; }
    .c-amber text { fill: #FAC775; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Title: 가입 -->
<text class="th" x="170" y="40" text-anchor="middle" dominant-baseline="central">가입 여정</text>
<text class="ts" x="170" y="60" text-anchor="middle" dominant-baseline="central">3단계, 2클릭</text>

<!-- 가입 steps -->
<g class="c-teal"><rect x="90" y="80" width="160" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="170" y="98" text-anchor="middle" dominant-baseline="central">시작하기 클릭</text></g>
<line x1="170" y1="116" x2="170" y2="134" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="90" y="136" width="160" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="170" y="154" text-anchor="middle" dominant-baseline="central">결제 정보 입력</text></g>
<line x1="170" y1="172" x2="170" y2="190" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="90" y="192" width="160" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="170" y="210" text-anchor="middle" dominant-baseline="central">완료</text></g>

<!-- Title: 해지 -->
<text class="th" x="490" y="40" text-anchor="middle" dominant-baseline="central">해지 여정</text>
<text class="ts" x="490" y="60" text-anchor="middle" dominant-baseline="central">8단계, 6클릭</text>

<!-- 해지 steps (compressed) -->
<g class="c-coral"><rect x="410" y="80" width="160" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="490" y="95" text-anchor="middle" dominant-baseline="central">설정 진입</text></g>
<line x1="490" y1="110" x2="490" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="410" y="122" width="160" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="490" y="137" text-anchor="middle" dominant-baseline="central">계정 관리</text></g>
<line x1="490" y1="152" x2="490" y2="162" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="410" y="164" width="160" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="490" y="179" text-anchor="middle" dominant-baseline="central">구독 관리</text></g>
<line x1="490" y1="194" x2="490" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="410" y="206" width="160" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="490" y="221" text-anchor="middle" dominant-baseline="central">해지 사유 선택</text></g>
<line x1="490" y1="236" x2="490" y2="246" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="410" y="248" width="160" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="490" y="263" text-anchor="middle" dominant-baseline="central">할인 제안 (재고)</text></g>
<line x1="490" y1="278" x2="490" y2="288" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="410" y="290" width="160" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="490" y="305" text-anchor="middle" dominant-baseline="central">"그래도 해지" 클릭</text></g>
<line x1="490" y1="320" x2="490" y2="330" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="410" y="332" width="160" height="30" rx="6" stroke-width="0.5"/>
<text class="ts" x="490" y="347" text-anchor="middle" dominant-baseline="central">최종 확인</text></g>

<!-- Comparison arrow -->
<line x1="260" y1="210" x2="400" y2="210" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="330" y="200" text-anchor="middle" dominant-baseline="central">2.7배</text>
</svg>
