<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>가입 vs 해지 단계 수 비대칭 — Roach Motel 구조</title>
  <desc>가입은 2~3단계, 해지는 8단계 이상으로 설계된 비대칭을 시각화한 다이어그램</desc>
  <defs>
    <style>
      .title-text {
        font-size: 14px;
        font-weight: 500;
        fill: #2C2C2A;
      }

      .axis-label {
        font-size: 12px;
        font-weight: 600;
        fill: #888780;
        letter-spacing: 0.04em;
      }

      .step-label {
        font-size: 11px;
        fill: #5F5E5A;
      }

      .step-num {
        font-size: 10px;
        font-weight: 600;
        fill: #FFFFFF;
      }

      .caption {
        font-size: 11px;
        fill: #888780;
      }

      .step-teal {
        fill: #1D9E75;
        stroke: #0F6E56;
        stroke-width: 0.5;
      }

      .step-red {
        fill: #E24B4A;
        stroke: #A32D2D;
        stroke-width: 0.5;
      }

      .step-step-bg {
        fill: #F1EFE8;
        stroke: #D3D1C7;
        stroke-width: 0.5;
      }

      .arrow {
        stroke: #B4B2A9;
        stroke-width: 0.5;
        fill: none;
      }

      .summary-bg {
        fill: #F1EFE8;
        stroke: #D3D1C7;
        stroke-width: 0.5;
      }

      .summary-bg-teal {
        fill: #E1F5EE;
        stroke: #5DCAA5;
        stroke-width: 0.5;
      }

      .summary-bg-red {
        fill: #FCEBEB;
        stroke: #F09595;
        stroke-width: 0.5;
      }

      .summary-text-teal {
        fill: #085041;
      }

      .summary-text-red {
        fill: #791F1F;
      }

      .summary-text {
        fill: #5F5E5A;
      }

      @media (prefers-color-scheme: dark) {
        .title-text {
          fill: #D3D1C7;
        }

        .axis-label {
          fill: #888780;
        }

        .step-label {
          fill: #B4B2A9;
        }

        .caption {
          fill: #888780;
        }

        .step-teal {
          fill: #0F6E56;
          stroke: #1D9E75;
        }

        .step-red {
          fill: #A32D2D;
          stroke: #E24B4A;
        }

        .step-step-bg {
          fill: #2C2C2A;
          stroke: #444441;
        }

        .arrow {
          stroke: #5F5E5A;
        }

        .summary-bg {
          fill: #2C2C2A;
          stroke: #444441;
        }

        .summary-bg-teal {
          fill: #04342C;
          stroke: #0F6E56;
        }

        .summary-bg-red {
          fill: #501313;
          stroke: #A32D2D;
        }

        .summary-text-teal {
          fill: #9FE1CB;
        }

        .summary-text-red {
          fill: #F7C1C1;
        }

        .summary-text {
          fill: #B4B2A9;
        }
      }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
  </defs>

  <text x="40" y="36" class="title-text">가입과 해지의 단계 수 비대칭</text>

  <!-- Signup (top row) - 2 steps -->
  <text x="40" y="84" class="axis-label">가입</text>

  <rect class="step-teal" x="100" y="64" width="120" height="32" rx="6" />
  <text x="160" y="84" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF">시작하기</text>

  <line class="arrow" x1="220" y1="80" x2="246" y2="80" marker-end="url(#arr)" />

  <rect class="step-teal" x="246" y="64" width="120" height="32" rx="6" />
  <text x="306" y="84" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF">결제 정보</text>

  <line class="arrow" x1="366" y1="80" x2="392" y2="80" marker-end="url(#arr)" />

  <rect class="step-teal" x="392" y="64" width="120" height="32" rx="6" />
  <text x="452" y="84" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF">완료</text>

  <text x="540" y="84" class="step-label" font-weight="600">3단계</text>

  <!-- Cancel (multiple rows) -->
  <text x="40" y="148" class="axis-label">해지</text>

  <!-- Row 1 -->
  <rect class="step-red" x="100" y="128" width="100" height="32" rx="6" />
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#FFFFFF">설정</text>
  <line class="arrow" x1="200" y1="144" x2="222" y2="144" marker-end="url(#arr)" />

  <rect class="step-red" x="222" y="128" width="100" height="32" rx="6" />
  <text x="272" y="148" text-anchor="middle" font-size="11" fill="#FFFFFF">계정</text>
  <line class="arrow" x1="322" y1="144" x2="344" y2="144" marker-end="url(#arr)" />

  <rect class="step-red" x="344" y="128" width="100" height="32" rx="6" />
  <text x="394" y="148" text-anchor="middle" font-size="11" fill="#FFFFFF">결제</text>
  <line class="arrow" x1="444" y1="144" x2="466" y2="144" marker-end="url(#arr)" />

  <rect class="step-red" x="466" y="128" width="100" height="32" rx="6" />
  <text x="516" y="148" text-anchor="middle" font-size="11" fill="#FFFFFF">구독 관리</text>

  <line class="arrow" x1="516" y1="160" x2="516" y2="186" marker-end="url(#arr)" />

  <!-- Row 2 (returning right to left) -->
  <rect class="step-red" x="466" y="186" width="100" height="32" rx="6" />
  <text x="516" y="206" text-anchor="middle" font-size="11" fill="#FFFFFF">구독 변경</text>
  <line class="arrow" x1="466" y1="202" x2="444" y2="202" marker-end="url(#arr)" />

  <rect class="step-red" x="344" y="186" width="100" height="32" rx="6" />
  <text x="394" y="206" text-anchor="middle" font-size="11" fill="#FFFFFF">해지하기</text>
  <line class="arrow" x1="344" y1="202" x2="322" y2="202" marker-end="url(#arr)" />

  <rect class="step-red" x="222" y="186" width="100" height="32" rx="6" />
  <text x="272" y="206" text-anchor="middle" font-size="11" fill="#FFFFFF">사유 선택</text>
  <line class="arrow" x1="222" y1="202" x2="200" y2="202" marker-end="url(#arr)" />

  <rect class="step-red" x="100" y="186" width="100" height="32" rx="6" />
  <text x="150" y="206" text-anchor="middle" font-size="11" fill="#FFFFFF">할인 제안</text>

  <line class="arrow" x1="150" y1="218" x2="150" y2="244" marker-end="url(#arr)" />

  <!-- Row 3 -->
  <rect class="step-red" x="100" y="244" width="100" height="32" rx="6" />
  <text x="150" y="264" text-anchor="middle" font-size="11" fill="#FFFFFF">"그래도 해지"</text>
  <line class="arrow" x1="200" y1="260" x2="222" y2="260" marker-end="url(#arr)" />

  <rect class="step-red" x="222" y="244" width="100" height="32" rx="6" />
  <text x="272" y="264" text-anchor="middle" font-size="11" fill="#FFFFFF">최종 확인</text>

  <text x="540" y="264" class="step-label" font-weight="600">9단계</text>

  <!-- Comparison summary box -->
  <rect class="summary-bg-teal" x="40" y="312" width="280" height="116" rx="8" />
  <text x="60" y="338" font-size="13" font-weight="600" class="summary-text-teal">가입</text>
  <text x="60" y="362" font-size="11" class="summary-text-teal">대형 CTA, 단순한 흐름</text>
  <text x="60" y="380" font-size="11" class="summary-text-teal">사용자 마찰을 최소화하는 설계</text>
  <text x="60" y="408" font-size="20" font-weight="700" class="summary-text-teal">3단계</text>

  <rect class="summary-bg-red" x="360" y="312" width="280" height="116" rx="8" />
  <text x="380" y="338" font-size="13" font-weight="600" class="summary-text-red">해지</text>
  <text x="380" y="362" font-size="11" class="summary-text-red">3개 메뉴 깊이 + 다단계 재고</text>
  <text x="380" y="380" font-size="11" class="summary-text-red">의도적 마찰로 이탈을 저지하는 설계</text>
  <text x="380" y="408" font-size="20" font-weight="700" class="summary-text-red">9단계 (3배)</text>
</svg>