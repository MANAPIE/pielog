<svg width="100%" viewBox="0 0 800 480" role="img" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Hard to Cancel — 해지 흐름 Before/After</title>
  <desc>다크패턴: 다단계 재고 흐름 / 정직한 설계: 2단계 해지</desc>
  <defs>
    <style>
      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .title {
        font-size: 13px;
        font-weight: 500;
        fill: #2C2C2A;
      }

      .body {
        font-size: 11px;
        fill: #5F5E5A;
      }

      .annot {
        font-size: 11px;
        fill: #5F5E5A;
      }

      .annot-bold {
        font-size: 11px;
        font-weight: 600;
      }

      .pair-label {
        font-size: 13px;
        fill: #888780;
        font-weight: 500;
      }

      .step-label {
        font-size: 11px;
        fill: #5F5E5A;
      }

      .step-num {
        font-size: 9px;
        font-weight: 600;
        fill: #888780;
        letter-spacing: 0.04em;
      }

      .page-bg {
        fill: #F9F8F4;
      }

      .frame-bg {
        fill: #F1EFE8;
      }

      .red-tag {
        fill: #FCEBEB;
      }

      .red-tag-text {
        fill: #791F1F;
      }

      .teal-tag {
        fill: #E1F5EE;
      }

      .teal-tag-text {
        fill: #085041;
      }

      .red-annot-bg {
        fill: #FCEBEB;
      }

      .red-annot-text {
        fill: #791F1F;
      }

      .teal-annot-bg {
        fill: #E1F5EE;
      }

      .teal-annot-text {
        fill: #085041;
      }

      .step-red {
        fill: #FCEBEB;
        stroke: #F09595;
        stroke-width: 0.5;
      }

      .step-red-text {
        fill: #791F1F;
      }

      .step-teal {
        fill: #E1F5EE;
        stroke: #5DCAA5;
        stroke-width: 0.5;
      }

      .step-teal-text {
        fill: #085041;
      }

      .arrow {
        stroke: #B4B2A9;
        stroke-width: 0.5;
        fill: none;
      }

      .vs-divider {
        stroke: #D3D1C7;
        stroke-width: 0.5;
      }

      .vs-circle {
        fill: #F1EFE8;
      }

      .vs-text {
        fill: #888780;
      }

      @media (prefers-color-scheme: dark) {
        .title {
          fill: #D3D1C7;
        }

        .body {
          fill: #B4B2A9;
        }

        .annot {
          fill: #B4B2A9;
        }

        .pair-label {
          fill: #888780;
        }

        .step-label {
          fill: #B4B2A9;
        }

        .step-num {
          fill: #888780;
        }

        .page-bg {
          fill: #1C1B1A;
        }

        .frame-bg {
          fill: #2C2C2A;
        }

        .red-tag {
          fill: #501313;
        }

        .red-tag-text {
          fill: #F7C1C1;
        }

        .teal-tag {
          fill: #04342C;
        }

        .teal-tag-text {
          fill: #9FE1CB;
        }

        .red-annot-bg {
          fill: #501313;
        }

        .red-annot-text {
          fill: #F7C1C1;
        }

        .teal-annot-bg {
          fill: #04342C;
        }

        .teal-annot-text {
          fill: #9FE1CB;
        }

        .step-red {
          fill: #501313;
          stroke: #A32D2D;
        }

        .step-red-text {
          fill: #F7C1C1;
        }

        .step-teal {
          fill: #04342C;
          stroke: #0F6E56;
        }

        .step-teal-text {
          fill: #9FE1CB;
        }

        .arrow {
          stroke: #5F5E5A;
        }

        .vs-divider {
          stroke: #444441;
        }

        .vs-circle {
          fill: #2C2C2A;
        }

        .vs-text {
          fill: #888780;
        }
      }
    </style>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
  </defs>

  <rect class="page-bg" width="800" height="480" rx="16" />
  <text x="400" y="34" text-anchor="middle" class="pair-label">사례. 구독 해지 흐름</text>

  <!-- LEFT: DARK -->
  <rect class="frame-bg" x="48" y="52" width="320" height="380" rx="12" />
  <rect class="red-tag" x="64" y="68" width="50" height="20" rx="4" />
  <text x="89" y="81" text-anchor="middle" class="label red-tag-text">DARK</text>

  <!-- 8 steps -->
  <g>
    <rect class="step-red" x="80" y="104" width="240" height="28" rx="6" />
    <text x="150" y="121" text-anchor="middle" class="step-num step-red-text">STEP 1</text>
  </g>
  <line class="arrow" x1="200" y1="132" x2="200" y2="138" />
  <text x="208" y="121.5" class="step-label">설정</text>

  <g>
    <rect class="step-red" x="80" y="138" width="240" height="28" rx="6" />
    <text x="150" y="155" text-anchor="middle" class="step-num step-red-text">STEP 2</text>
  </g>
  <line class="arrow" x1="200" y1="166" x2="200" y2="172" />
  <text x="208" y="155.5" class="step-label">계정</text>

  <g>
    <rect class="step-red" x="80" y="172" width="240" height="28" rx="6" />
    <text x="150" y="189" text-anchor="middle" class="step-num step-red-text">STEP 3</text>
  </g>
  <line class="arrow" x1="200" y1="200" x2="200" y2="206" />
  <text x="208" y="189.5" class="step-label">구독 관리</text>

  <g>
    <rect class="step-red" x="80" y="206" width="240" height="28" rx="6" />
    <text x="150" y="223" text-anchor="middle" class="step-num step-red-text">STEP 4</text>
  </g>
  <line class="arrow" x1="200" y1="234" x2="200" y2="240" />
  <text x="208" y="223.5" class="step-label">해지하기 클릭</text>

  <g>
    <rect class="step-red" x="80" y="240" width="240" height="28" rx="6" />
    <text x="150" y="257" text-anchor="middle" class="step-num step-red-text">STEP 5</text>
  </g>
  <line class="arrow" x1="200" y1="268" x2="200" y2="274" />
  <text x="208" y="257.5" class="step-label">사유 선택</text>

  <g>
    <rect class="step-red" x="80" y="274" width="240" height="28" rx="6" />
    <text x="150" y="291" text-anchor="middle" class="step-num step-red-text">STEP 6</text>
  </g>
  <line class="arrow" x1="200" y1="302" x2="200" y2="308" />
  <text x="208" y="291.5" class="step-label">할인 제안 거절</text>

  <g>
    <rect class="step-red" x="80" y="308" width="240" height="28" rx="6" />
    <text x="150" y="325" text-anchor="middle" class="step-num step-red-text">STEP 7</text>
  </g>
  <line class="arrow" x1="200" y1="336" x2="200" y2="342" />
  <text x="208" y="325.5" class="step-label">일시정지 거절</text>

  <g>
    <rect class="step-red" x="80" y="342" width="240" height="28" rx="6" />
    <text x="150" y="359" text-anchor="middle" class="step-num step-red-text">STEP 8</text>
  </g>
  <text x="208" y="359.5" class="step-label">최종 확인</text>

  <rect class="red-annot-bg" x="64" y="386" width="288" height="32" rx="6" />
  <text x="80" y="406" class="annot-bold red-annot-text">8단계 — 다단계 재고 흐름</text>

  <!-- RIGHT: BRIGHT -->
  <rect class="frame-bg" x="432" y="52" width="320" height="380" rx="12" />
  <rect class="teal-tag" x="448" y="68" width="60" height="20" rx="4" />
  <text x="478" y="81" text-anchor="middle" class="label teal-tag-text">BRIGHT</text>

  <g>
    <rect class="step-teal" x="464" y="104" width="240" height="40" rx="6" />
    <text x="584" y="120" text-anchor="middle" class="step-num step-teal-text">STEP 1</text>
    <text x="584" y="134" text-anchor="middle" font-size="11" font-weight="500" class="step-teal-text">"해지하기" 클릭</text>
  </g>
  <line class="arrow" x1="584" y1="144" x2="584" y2="164" marker-end="url(#arr2)" />

  <g>
    <rect class="step-teal" x="464" y="166" width="240" height="40" rx="6" />
    <text x="584" y="182" text-anchor="middle" class="step-num step-teal-text">STEP 2</text>
    <text x="584" y="196" text-anchor="middle" font-size="11" font-weight="500" class="step-teal-text">"해지 확정" 확인</text>
  </g>

  <text x="584" y="246" text-anchor="middle" class="body">사유 입력은 선택 사항</text>
  <text x="584" y="262" text-anchor="middle" class="body">재고 페이지는 1회로 제한</text>
  <text x="584" y="278" text-anchor="middle" class="body">일시 정지·요금제 변경은 진정한 대안만 제시</text>

  <rect class="teal-annot-bg" x="448" y="356" width="288" height="62" rx="6" />
  <text x="464" y="374" class="annot-bold teal-annot-text">2단계 — 가입과 동일한 마찰</text>
  <text x="464" y="390" class="annot teal-annot-text">FTC Click-to-Cancel Rule 및 EU DSA 제25조의</text>
  <text x="464" y="406" class="annot teal-annot-text">대칭성 원칙 충족.</text>

  <line class="vs-divider" x1="400" y1="72" x2="400" y2="432" stroke-dasharray="4 4" />
  <circle class="vs-circle" cx="400" cy="242" r="16" />
  <text x="400" y="247" text-anchor="middle" font-size="11" font-weight="600" class="vs-text">VS</text>
</svg>