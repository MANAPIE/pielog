<svg width="100%" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>영상 접근성 요구사항 등급별 매트릭스</title>
  <desc>자막, 오디오 디스크립션, 수어 통역, 텍스트 대본 네 가지 영상 접근성 요소를 WCAG A·AA·AAA 등급별로 요구 수준을 비교한 표</desc>
  <style>
    .title {
      font: 600 16px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #2C2C2A;
    }

    .col-h {
      font: 600 13px/1 'Pretendard Variable', system-ui, sans-serif;
    }

    .row-t {
      font: 600 13px/1.4 'Pretendard Variable', system-ui, sans-serif;
    }

    .row-en {
      font: 500 11px/1 'JetBrains Mono', monospace;
    }

    .row-d {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
    }

    .cell-h {
      font: 700 12px/1 'Pretendard Variable', system-ui, sans-serif;
    }

    .cell-d {
      font: 400 10px/1 'Pretendard Variable', system-ui, sans-serif;
    }

    .note {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
    }

    .caption {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #6F6E66;
    }

    .teal-card {
      fill: #E1F5EE;
      stroke: #0F664A;
    }

    .teal-t {
      fill: #085041;
    }

    .teal-sub {
      fill: #0F6E56;
    }

    .teal-fill {
      fill: #0F664A;
    }

    .teal-dim {
      fill: #E1F5EE;
      stroke: #0F664A;
    }

    .amber-card {
      fill: #FAEEDA;
      stroke: #8F590F;
    }

    .amber-t {
      fill: #633806;
    }

    .amber-sub {
      fill: #854F0B;
    }

    .amber-fill {
      fill: #8F590F;
    }

    .amber-dim {
      fill: #FAEEDA;
      stroke: #8F590F;
    }

    .rust-card {
      fill: #FAECE7;
      stroke: #993C1D;
    }

    .rust-t {
      fill: #712B13;
    }

    .rust-sub {
      fill: #993C1D;
    }

    .rust-fill {
      fill: #993C1D;
    }

    .rust-dim {
      fill: #FAECE7;
      stroke: #993C1D;
    }

    .blue-card {
      fill: #E6F1FB;
      stroke: #185FA5;
    }

    .blue-t {
      fill: #0C447C;
    }

    .blue-sub {
      fill: #185FA5;
    }

    .blue-fill {
      fill: #185FA5;
    }

    .blue-dim {
      fill: #E6F1FB;
      stroke: #185FA5;
    }

    .empty-cell {
