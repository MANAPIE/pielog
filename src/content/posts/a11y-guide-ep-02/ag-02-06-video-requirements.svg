  <text class="col-h col-h-t" x="472" y="98" text-anchor="middle">Level AA</text>
  <text class="col-h col-h-t" x="568" y="98" text-anchor="middle">Level AAA</text>
  <text class="col-h col-h-t" x="682" y="98" text-anchor="middle">비고</text>

  <!-- Row 1: 자막 -->
  <g transform="translate(40, 116)">
    <rect class="teal-card" x="0" y="0" width="280" height="44" rx="6" stroke-width="0.5" />
    <text class="row-t teal-t" x="14" y="18">자막</text>
    <text class="row-en teal-sub" x="48" y="18">Captions</text>
    <text class="row-d teal-sub" x="14" y="34">사전 녹화 + 실시간 음성·소리</text>

    <rect class="teal-fill" x="296" y="0" width="80" height="44" rx="6" />
    <text class="cell-h on-fill" x="336" y="21" text-anchor="middle">필수</text>
    <text class="cell-d on-fill" x="336" y="35" text-anchor="middle" opacity="0.85">Required</text>

    <rect class="teal-fill" x="392" y="0" width="80" height="44" rx="6" />
    <text class="cell-h on-fill" x="432" y="21" text-anchor="middle">필수</text>
    <text class="cell-d on-fill" x="432" y="35" text-anchor="middle" opacity="0.85">Required</text>

    <rect class="teal-fill" x="488" y="0" width="80" height="44" rx="6" />
    <text class="cell-h on-fill" x="528" y="21" text-anchor="middle">필수</text>
    <text class="cell-d on-fill" x="528" y="35" text-anchor="middle" opacity="0.85">Required</text>

    <text class="note note-t" x="604" y="21">기본 중의 기본</text>
    <text class="note note-t" x="604" y="35">모든 영상의 의무</text>
  </g>

  <!-- Row 2: 오디오 디스크립션 -->
  <g transform="translate(40, 172)">
    <rect class="amber-card" x="0" y="0" width="280" height="44" rx="6" stroke-width="0.5" />
    <text class="row-t amber-t" x="14" y="18">오디오 디스크립션</text>
    <text class="row-en amber-sub" x="146" y="18">Audio Description</text>
    <text class="row-d amber-sub" x="14" y="34">영상의 시각 정보를 음성 해설</text>

    <rect class="amber-dim" x="296" y="0" width="80" height="44" rx="6" stroke-width="0.5" />
    <text class="cell-h amber-t" x="336" y="21" text-anchor="middle">대안</text>
    <text class="cell-d amber-sub" x="336" y="35" text-anchor="middle">Alternative</text>

    <rect class="amber-fill" x="392" y="0" width="80" height="44" rx="6" />
    <text class="cell-h on-fill" x="432" y="21" text-anchor="middle">필수</text>
    <text class="cell-d on-fill" x="432" y="35" text-anchor="middle" opacity="0.85">Required</text>

    <rect class="amber-fill" x="488" y="0" width="80" height="44" rx="6" />
    <text class="cell-h on-fill" x="528" y="21" text-anchor="middle">확장 필수</text>
    <text class="cell-d on-fill" x="528" y="35" text-anchor="middle" opacity="0.85">Extended</text>

    <text class="note note-t" x="604" y="21">시각 정보를</text>
    <text class="note note-t" x="604" y="35">음성으로 변환</text>
  </g>

  <!-- Row 3: 수어 통역 -->
  <g transform="translate(40, 228)">
    <rect class="rust-card" x="0" y="0" width="280" height="44" rx="6" stroke-width="0.5" />
    <text class="row-t rust-t" x="14" y="18">수어 통역</text>
    <text class="row-en rust-sub" x="80" y="18">Sign Language</text>
    <text class="row-d rust-sub" x="14" y="34">사전 녹화 영상에 통역사 삽입</text>

    <rect class="empty-cell" x="296" y="0" width="80" height="44" rx="6" stroke-width="0.5" />
    <text class="cell-h empty-t" x="336" y="25" text-anchor="middle">-</text>

    <rect class="empty-cell" x="392" y="0" width="80" height="44" rx="6" stroke-width="0.5" />
    <text class="cell-h empty-t" x="432" y="25" text-anchor="middle">-</text>

    <rect class="rust-fill" x="488" y="0" width="80" height="44" rx="6" />
    <text class="cell-h on-fill" x="528" y="21" text-anchor="middle">필수</text>
    <text class="cell-d on-fill" x="528" y="35" text-anchor="middle" opacity="0.85">Required</text>

    <text class="note note-t" x="604" y="21">공공 영상에서</text>
    <text class="note note-t" x="604" y="35">권장 수준</text>
  </g>

  <!-- Row 4: 텍스트 대본 -->
  <g transform="translate(40, 284)">
    <rect class="blue-card" x="0" y="0" width="280" height="44" rx="6" stroke-width="0.5" />
    <text class="row-t blue-t" x="14" y="18">텍스트 대본</text>
    <text class="row-en blue-sub" x="96" y="18">Transcript</text>
    <text class="row-d blue-sub" x="14" y="34">전체 내용을 텍스트로 풀어 제공</text>

    <rect class="blue-dim" x="296" y="0" width="80" height="44" rx="6" stroke-width="0.5" />
    <text class="cell-h blue-t" x="336" y="21" text-anchor="middle">대안</text>
    <text class="cell-d blue-sub" x="336" y="35" text-anchor="middle">Alternative</text>

    <rect class="blue-dim" x="392" y="0" width="80" height="44" rx="6" stroke-width="0.5" />
    <text class="cell-h blue-t" x="432" y="21" text-anchor="middle">대안</text>
    <text class="cell-d blue-sub" x="432" y="35" text-anchor="middle">Alternative</text>

    <rect class="blue-fill" x="488" y="0" width="80" height="44" rx="6" />
    <text class="cell-h on-fill" x="528" y="21" text-anchor="middle">필수</text>
    <text class="cell-d on-fill" x="528" y="35" text-anchor="middle" opacity="0.85">Required</text>

    <text class="note note-t" x="604" y="21">SEO에도 유리</text>
    <text class="note note-t" x="604" y="35">검색 색인 가능</text>
  </g>
</svg>