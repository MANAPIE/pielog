<svg width="100%" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>헤딩 계층: 시각적 표현과 스크린리더의 인식 구조 비교</title>
  <desc>쇼핑몰 메인 페이지의 헤딩 계층이 시각적으로는 카드와 섹션으로 보이지만 스크린리더에는 h1-h2-h3 트리 구조로 인식되는 모습을 좌우 비교</desc>
  <style>
    .title {
      font: 600 16px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #2C2C2A;
    }

    .col-h {
      font: 600 13px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #FFFFFF;
    }

    .v-h1 {
      font: 700 16px/1 'Pretendard Variable', system-ui, sans-serif;
    }

    .v-h2 {
      font: 600 13px/1 'Pretendard Variable', system-ui, sans-serif;
    }

    .v-h3 {
      font: 500 11px/1 'Pretendard Variable', system-ui, sans-serif;
    }

    .lvl {
      font: 600 11px/1 'JetBrains Mono', monospace;
    }

    .lbl {
      font: 400 12px/1.4 'Pretendard Variable', system-ui, sans-serif;
    }

    .caption {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #6F6E66;
    }

    .blue-card {
      fill: #E6F1FB;
      stroke: #185FA5;
    }

    .blue-head {
      fill: #185FA5;
    }

    .blue-t {
      fill: #0C447C;
    }

    .blue-sub {
      fill: #185FA5;
    }

    .blue-line {
      stroke: #185FA5;
    }

    .amber-card {
      fill: #FAEEDA;
      stroke: #8F590F;
    }

    .amber-head {
      fill: #8F590F;
    }

    .amber-t {
      fill: #633806;
    }

    .amber-line {
      stroke: #8F590F;
    }

    .neutral-card {
      fill: #FFFFFF;
      stroke: #185FA5;
    }

    .neutral-card-amber {
      fill: #FFFFFF;
      stroke: #8F590F;
    }

    .lbl-t {
      fill: #2C2C2A;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #E8E6DE;
      }

      .caption {
        fill: #B4B2A9;
      }

      .lbl-t {
        fill: #E8E6DE;
      }

      .blue-card {
        fill: #0C2742;
        stroke: #185FA5;
      }

      .blue-head {
        fill: #185FA5;
      }

      .blue-t {
        fill: #B6D5F3;
      }

      .blue-sub {
        fill: #5DA0E1;
      }

      .blue-line {
        stroke: #5DA0E1;
      }

      .amber-card {
        fill: #412402;
        stroke: #854F0B;
      }

      .amber-head {
        fill: #854F0B;
      }

      .amber-t {
        fill: #FAC775;
      }

      .amber-line {
        stroke: #FAC775;
      }

      .neutral-card {
        fill: #1F1F1D;
        stroke: #185FA5;
      }

      .neutral-card-amber {
        fill: #1F1F1D;
        stroke: #854F0B;
      }
    }
  </style>

  <text class="title" x="40" y="32">헤딩 계층: 시각 표현과 스크린리더 구조</text>
  <text class="caption" x="40" y="50">같은 페이지가 두 사용자에게는 다른 형태로 인식됩니다</text>

  <!-- Left: 시각적 표현 -->
  <g>
    <rect class="blue-card" x="40" y="76" width="340" height="290" rx="14" stroke-width="0.5" />
    <rect class="blue-head" x="40" y="76" width="340" height="38" rx="14" />
    <rect class="blue-head" x="40" y="100" width="340" height="14" />
    <text class="col-h" x="60" y="100">시각적 표현</text>

    <!-- 쇼핑몰 메인 카드 -->
    <g transform="translate(60, 130)">
      <rect class="neutral-card" x="0" y="0" width="300" height="36" rx="8" stroke-width="0.5" />
      <text class="v-h1 blue-t" x="14" y="22">🛒 쇼핑몰 메인</text>
    </g>

    <g transform="translate(60, 176)">
      <rect class="neutral-card" x="0" y="0" width="300" height="64" rx="8" stroke-width="0.5" />
      <rect class="blue-head" x="0" y="0" width="4" height="64" />
      <text class="v-h2 blue-t" x="14" y="20">■ 이번 주 인기 상품</text>
      <text class="v-h3 blue-sub" x="26" y="40"> · 전자기기</text>
      <text class="v-h3 blue-sub" x="26" y="56"> · 패션</text>
    </g>

    <g transform="translate(60, 250)">
      <rect class="neutral-card" x="0" y="0" width="300" height="64" rx="8" stroke-width="0.5" />
      <rect class="blue-head" x="0" y="0" width="4" height="64" />
      <text class="v-h2 blue-t" x="14" y="20">■ 기획전</text>
      <text class="v-h3 blue-sub" x="26" y="40"> · 봄맞이 세일</text>
      <text class="v-h3 blue-sub" x="26" y="56"> · 신학기 특가</text>
    </g>

    <g transform="translate(60, 324)">
      <rect class="neutral-card" x="0" y="0" width="300" height="29" rx="8" stroke-width="0.5" />
      <rect class="blue-head" x="0" y="0" width="4" height="29" />
      <text class="v-h2 blue-t" x="14" y="19">■ 고객 후기</text>
    </g>
  </g>

  <!-- Right: 의미 구조 (스크린리더) -->
  <g>
    <rect class="amber-card" x="400" y="76" width="360" height="290" rx="14" stroke-width="0.5" />
    <rect class="amber-head" x="400" y="76" width="360" height="38" rx="14" />
    <rect class="amber-head" x="400" y="100" width="360" height="14" />
    <text class="col-h" x="420" y="100">스크린리더가 인식하는 구조</text>

    <!-- h1 -->
    <g transform="translate(420, 134)">
      <rect class="amber-head" x="0" y="-3" width="40" height="22" rx="4" />
      <text class="lvl" x="20" y="12" text-anchor="middle" fill="#FFFFFF">h1</text>
      <text class="lbl lbl-t" x="52" y="12">쇼핑몰 메인</text>
    </g>

    <!-- h2 #1 -->
    <line class="amber-line" x1="430" y1="156" x2="430" y2="180" stroke-width="1" stroke-dasharray="2 2" />
    <line class="amber-line" x1="430" y1="180" x2="450" y2="180" stroke-width="1" stroke-dasharray="2 2" />
    <g transform="translate(450, 180)">
      <rect class="amber-card" x="0" y="-12" width="40" height="22" rx="4" stroke-width="0.8" />
      <text class="lvl amber-t" x="20" y="3" text-anchor="middle">h2</text>
      <text class="lbl lbl-t" x="52" y="3">이번 주 인기 상품</text>
    </g>

    <!-- h3 -->
    <line class="amber-line" x1="460" y1="194" x2="460" y2="210" stroke-width="1" stroke-dasharray="2 2" />
    <line class="amber-line" x1="460" y1="210" x2="480" y2="210" stroke-width="1" stroke-dasharray="2 2" />
    <g transform="translate(480, 210)">
      <rect class="neutral-card-amber" x="0" y="-12" width="40" height="22" rx="4" stroke-width="0.6" />
      <text class="lvl amber-t" x="20" y="3" text-anchor="middle">h3</text>
      <text class="lbl lbl-t" x="52" y="3">전자기기</text>
    </g>
    <line class="amber-line" x1="460" y1="222" x2="460" y2="236" stroke-width="1" stroke-dasharray="2 2" />
    <line class="amber-line" x1="460" y1="236" x2="480" y2="236" stroke-width="1" stroke-dasharray="2 2" />
    <g transform="translate(480, 236)">
      <rect class="neutral-card-amber" x="0" y="-12" width="40" height="22" rx="4" stroke-width="0.6" />
      <text class="lvl amber-t" x="20" y="3" text-anchor="middle">h3</text>
      <text class="lbl lbl-t" x="52" y="3">패션</text>
    </g>

    <!-- h2 #2 -->
    <line class="amber-line" x1="430" y1="180" x2="430" y2="262" stroke-width="1" stroke-dasharray="2 2" />
    <line class="amber-line" x1="430" y1="262" x2="450" y2="262" stroke-width="1" stroke-dasharray="2 2" />
    <g transform="translate(450, 262)">
      <rect class="amber-card" x="0" y="-12" width="40" height="22" rx="4" stroke-width="0.8" />
      <text class="lvl amber-t" x="20" y="3" text-anchor="middle">h2</text>
      <text class="lbl lbl-t" x="52" y="3">기획전</text>
    </g>
    <line class="amber-line" x1="460" y1="276" x2="460" y2="292" stroke-width="1" stroke-dasharray="2 2" />
    <line class="amber-line" x1="460" y1="292" x2="480" y2="292" stroke-width="1" stroke-dasharray="2 2" />
    <g transform="translate(480, 292)">
      <rect class="neutral-card-amber" x="0" y="-12" width="40" height="22" rx="4" stroke-width="0.6" />
      <text class="lvl amber-t" x="20" y="3" text-anchor="middle">h3</text>
      <text class="lbl lbl-t" x="52" y="3">봄맞이 세일</text>
    </g>

    <!-- h2 #3 -->
    <line class="amber-line" x1="430" y1="262" x2="430" y2="322" stroke-width="1" stroke-dasharray="2 2" />
    <line class="amber-line" x1="430" y1="322" x2="450" y2="322" stroke-width="1" stroke-dasharray="2 2" />
    <g transform="translate(450, 322)">
      <rect class="amber-card" x="0" y="-12" width="40" height="22" rx="4" stroke-width="0.8" />
      <text class="lvl amber-t" x="20" y="3" text-anchor="middle">h2</text>
      <text class="lbl lbl-t" x="52" y="3">고객 후기</text>
    </g>
  </g>
</svg>