<svg viewBox="0 0 800 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cw">
  <title id="t-cw">조직도와 아키텍처의 대응</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft-2: rgba(217,119,87,0.10); --c-soft-4: rgba(61,139,122,0.10);
        --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft-2: rgba(232,147,118,0.14); --c-soft-4: rgba(111,191,168,0.14);
          --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .panel { fill: var(--c-card); stroke: var(--c-divider); stroke-width: 1; }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .th { font-family: 'Inter',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .td { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .warn { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; font-weight: 700; fill: var(--c-accent-2); }
      .code { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .team { fill: var(--c-card); stroke: var(--c-muted); stroke-width: 2; }
      .sys { fill: var(--c-card); stroke: var(--c-line); stroke-width: 2; }
      .quote { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; fill: var(--c-fg); font-style: italic; }
      .diag { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12.5px; font-weight: 700; fill: var(--c-accent-2); }
      .edge { font-family: 'Inter',system-ui,sans-serif; font-size: 9.5px; font-weight: 700; fill: var(--c-muted); }
      .mono { font-family: 'JetBrains Mono','SF Mono',monospace; }
    </style>
    <marker id="a-cw" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--c-muted)"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="584"/>
  <!-- 상단: 조직 -->
  <text x="24" y="36" class="lbl" fill="var(--c-muted)">ORGANIZATION</text>
  <g transform="translate(24 52)">
    <rect width="160" height="74" rx="8" class="team"/>
    <text x="80" y="26" class="nm" text-anchor="middle">프론트엔드팀</text>
    <text x="80" y="44" class="cap" text-anchor="middle">6명</text>
    <text x="80" y="60" class="cap" text-anchor="middle">주 2회 릴리스</text>
  </g>
  <line x1="188" y1="89" x2="232" y2="89" stroke="var(--c-line)" stroke-width="2" opacity="0.6"/>
  <text x="210" y="82" class="edge" text-anchor="middle">소통</text>
  <g transform="translate(236 52)">
    <rect width="160" height="74" rx="8" class="team"/>
    <text x="80" y="26" class="nm" text-anchor="middle">백엔드팀</text>
    <text x="80" y="44" class="cap" text-anchor="middle">8명</text>
    <text x="80" y="60" class="cap" text-anchor="middle">주 1회 릴리스</text>
  </g>
  <line x1="400" y1="89" x2="444" y2="89" stroke="var(--c-line)" stroke-width="2" opacity="0.6"/>
  <text x="422" y="82" class="edge" text-anchor="middle">소통</text>
  <g transform="translate(448 52)">
    <rect width="160" height="74" rx="8" class="team"/>
    <text x="80" y="26" class="nm" text-anchor="middle">데이터팀</text>
    <text x="80" y="44" class="cap" text-anchor="middle">4명</text>
    <text x="80" y="60" class="cap" text-anchor="middle">격주 릴리스</text>
  </g>

  <!-- 우측 설명 -->
  <g transform="translate(624 52)">
    <rect width="152" height="222" rx="8" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.5"/>
    <text x="14" y="24" class="lbl" fill="var(--c-accent-2)">WHY</text>
    <text x="14" y="48" class="cap">경계를 넘는 일은</text>
    <text x="14" y="66" class="cap">소통 비용이 듭니다.</text>
    <text x="14" y="94" class="cap">옆자리 코드는 고치기 쉽고</text>
    <text x="14" y="112" class="cap">다른 팀 코드는 회의부터</text>
    <text x="14" y="130" class="cap">잡아야 합니다.</text>
    <text x="14" y="158" class="cap">그러면 자기 쪽에서</text>
    <text x="14" y="176" class="cap">해결하는 코드가 쌓이고</text>
    <text x="14" y="194" class="cap">경계가 굳어집니다.</text>
  </g>

  <!-- 대응 화살표 -->
  <g stroke="var(--c-muted)" stroke-width="1.6" stroke-dasharray="5 5">
    <line x1="104" y1="130" x2="104" y2="170" marker-end="url(#a-cw)"/>
    <line x1="316" y1="130" x2="316" y2="170" marker-end="url(#a-cw)"/>
    <line x1="528" y1="130" x2="528" y2="170" marker-end="url(#a-cw)"/>
  </g>
  <text x="118" y="154" class="edge">그대로 닮습니다</text>

  <!-- 하단: 아키텍처 -->
  <text x="24" y="190" class="lbl" fill="var(--c-line)">ARCHITECTURE</text>
  <g transform="translate(24 200)">
    <rect width="160" height="74" rx="8" class="sys"/>
    <text x="80" y="30" class="nm" text-anchor="middle">웹 애플리케이션</text>
    <text x="80" y="50" class="cap" text-anchor="middle">Next.js · 독립 배포</text>
  </g>
  <g transform="translate(192 200)">
    <line x1="18" y1="0" x2="22" y2="74" stroke="var(--c-accent-4)" stroke-width="3" stroke-linecap="round"/>
    <text x="20" y="-6" class="edge" text-anchor="middle" fill="var(--c-accent-4)">API</text>
  </g>
  <g transform="translate(236 200)">
    <rect width="160" height="74" rx="8" class="sys"/>
    <text x="80" y="30" class="nm" text-anchor="middle">API 서버</text>
    <text x="80" y="50" class="cap" text-anchor="middle">REST · 독립 배포</text>
  </g>
  <g transform="translate(404 200)">
    <line x1="18" y1="0" x2="22" y2="74" stroke="var(--c-accent-4)" stroke-width="3" stroke-linecap="round"/>
    <text x="20" y="-6" class="edge" text-anchor="middle" fill="var(--c-accent-4)">이벤트</text>
  </g>
  <g transform="translate(448 200)">
    <rect width="160" height="74" rx="8" class="sys"/>
    <text x="80" y="30" class="nm" text-anchor="middle">데이터 파이프라인</text>
    <text x="80" y="50" class="cap" text-anchor="middle">배치 · 독립 배포</text>
  </g>

  <!-- 인용 -->
  <g transform="translate(24 290)">
    <rect width="752" height="70" rx="8" class="panel"/>
    <line x1="20" y1="18" x2="20" y2="54" stroke="var(--c-muted)" stroke-width="3"/>
    <text x="36" y="32" class="quote">시스템을 설계하는 조직은, 그 조직의 소통 구조를 그대로 닮은 설계를 만들어 낸다.</text>
    <text x="36" y="54" class="cap">Melvin Conway, 1968: 격언이 아니라 관찰입니다</text>
  </g>

  <!-- 진단 -->
  <g transform="translate(24 376)">
    <rect width="752" height="84" rx="8" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.6"/>
    <text x="20" y="26" class="diag">자주 함께 바뀌는 것들이 다른 팀에 있다면, 경계가 잘못 그어진 것입니다</text>
    <text x="20" y="50" class="cap">하나의 기능을 내려면 세 팀이 각각 배포해야 한다 → 경계가 기능을 가로지릅니다.</text>
    <text x="20" y="68" class="cap">매 스프린트마다 같은 두 팀이 조율 회의를 한다 → 그 둘은 사실 한 팀이어야 할 수도 있습니다.</text>
  </g>

  <!-- 두 가지 태도 -->
  <g transform="translate(24 476)">
    <rect width="368" height="84" rx="8" fill="var(--c-card)" stroke="var(--c-accent-4)" stroke-width="1.5"/>
    <text x="20" y="26" class="ttl">받아들이기</text>
    <text x="20" y="50" class="cap">조직을 못 바꾼다면 시스템 경계를 맞춥니다.</text>
    <text x="20" y="68" class="cap">억지로 어긋내면 매 작업마다 조율 회의가 생깁니다.</text>
  </g>
  <g transform="translate(408 476)">
    <rect width="368" height="84" rx="8" fill="var(--c-card)" stroke="var(--c-accent)" stroke-width="1.5"/>
    <text x="20" y="26" class="ttl">뒤집기: 역콘웨이 기동</text>
    <text x="20" y="50" class="cap">원하는 아키텍처에 맞게 조직을 재구성합니다.</text>
    <text x="20" y="68" class="cap">강력하지만 비쌉니다. 대개 큰 경계만 조직에 맞춥니다.</text>
  </g>
</svg>
