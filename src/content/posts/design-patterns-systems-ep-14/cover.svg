<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">부록, 조직 경계와 콘웨이의 법칙: ep.14 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="30%" cy="24%" r="52%">
      <stop offset="0%" stop-color="var(--c-muted)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="var(--c-muted)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="74%" cy="80%" r="48%">
      <stop offset="0%" stop-color="var(--c-muted)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--c-muted)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <circle cx="1100" cy="580" r="250" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="-160" y="-130" width="520" height="360" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(-7 100 50)"/>

  <!-- 메타포: 위의 사람 네트워크가 아래 시스템 구조에 그림자를 드리움 -->
  <g transform="translate(600 315)">
    <!-- 상단: 조직 노드 -->
    <g transform="translate(0 -160)">
      <!-- 노드 3그룹 -->
      <g transform="translate(-300 0)">
        <circle r="34" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="3"/>
        <circle cy="-8" r="10" fill="var(--c-muted)" opacity="0.85"/>
        <path d="M -15 16 A 15 15 0 0 1 15 16" fill="var(--c-muted)" opacity="0.85"/>
        <circle cx="-46" cy="34" r="18" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="2.2"/>
        <circle cx="46" cy="34" r="18" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="2.2"/>
        <line x1="-24" y1="22" x2="-38" y2="26" stroke="var(--c-muted)" stroke-width="1.8"/>
        <line x1="24" y1="22" x2="38" y2="26" stroke="var(--c-muted)" stroke-width="1.8"/>
      </g>

      <g transform="translate(0 -20)">
        <circle r="34" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="3"/>
        <circle cy="-8" r="10" fill="var(--c-muted)" opacity="0.85"/>
        <path d="M -15 16 A 15 15 0 0 1 15 16" fill="var(--c-muted)" opacity="0.85"/>
        <circle cx="-46" cy="36" r="18" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="2.2"/>
        <circle cx="46" cy="36" r="18" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="2.2"/>
        <line x1="-24" y1="24" x2="-38" y2="28" stroke="var(--c-muted)" stroke-width="1.8"/>
        <line x1="24" y1="24" x2="38" y2="28" stroke="var(--c-muted)" stroke-width="1.8"/>
      </g>

      <g transform="translate(300 4)">
        <circle r="34" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="3"/>
        <circle cy="-8" r="10" fill="var(--c-muted)" opacity="0.85"/>
        <path d="M -15 16 A 15 15 0 0 1 15 16" fill="var(--c-muted)" opacity="0.85"/>
        <circle cx="-46" cy="34" r="18" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="2.2"/>
        <circle cx="46" cy="34" r="18" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="2.2"/>
        <line x1="-24" y1="22" x2="-38" y2="26" stroke="var(--c-muted)" stroke-width="1.8"/>
        <line x1="24" y1="22" x2="38" y2="26" stroke="var(--c-muted)" stroke-width="1.8"/>
      </g>

      <!-- 팀 간 소통 경로 -->
      <line x1="-266" y1="6" x2="-34" y2="-16" stroke="var(--c-line)" stroke-width="2.4" opacity="0.5"/>
      <line x1="34" y1="-14" x2="266" y2="4" stroke="var(--c-line)" stroke-width="2.4" opacity="0.5"/>
      <path d="M -290 40 Q 0 130 290 44" fill="none" stroke="var(--c-line)" stroke-width="1.6" stroke-dasharray="5 6" opacity="0.35"/>
    </g>

    <!-- 그림자 투사선 -->
    <g stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 6" opacity="0.4">
      <line x1="-300" y1="-116" x2="-300" y2="48"/>
      <line x1="0" y1="-136" x2="0" y2="48"/>
      <line x1="300" y1="-112" x2="300" y2="48"/>
    </g>

    <!-- 하단: 시스템 구조 (조직과 같은 배치) -->
    <g transform="translate(0 130)">
      <g transform="translate(-300 0) rotate(-4)">
        <rect x="-92" y="-56" width="184" height="112" rx="7" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.8"/>
        <rect x="-66" y="-32" width="80" height="10" rx="5" fill="var(--c-line)" opacity="0.4"/>
        <rect x="-66" y="-12" width="110" height="8" rx="4" fill="var(--c-line)" opacity="0.24"/>
        <rect x="-66" y="12" width="60" height="8" rx="4" fill="var(--c-line)" opacity="0.24"/>
      </g>
      <g transform="translate(0 16) rotate(3)">
        <rect x="-92" y="-56" width="184" height="112" rx="7" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.8"/>
        <rect x="-66" y="-32" width="66" height="10" rx="5" fill="var(--c-line)" opacity="0.4"/>
        <rect x="-66" y="-12" width="120" height="8" rx="4" fill="var(--c-line)" opacity="0.24"/>
        <rect x="-66" y="12" width="88" height="8" rx="4" fill="var(--c-line)" opacity="0.24"/>
      </g>
      <g transform="translate(300 -4) rotate(-5)">
        <rect x="-92" y="-56" width="184" height="112" rx="7" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2.8"/>
        <rect x="-66" y="-32" width="94" height="10" rx="5" fill="var(--c-line)" opacity="0.4"/>
        <rect x="-66" y="-12" width="70" height="8" rx="4" fill="var(--c-line)" opacity="0.24"/>
        <rect x="-66" y="12" width="104" height="8" rx="4" fill="var(--c-line)" opacity="0.24"/>
      </g>

      <!-- 시스템 간 계약 경계 -->
      <g transform="translate(-150 8)">
        <line x1="0" y1="-70" x2="4" y2="70" stroke="var(--c-muted)" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="2" cy="0" r="9" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="2.6"/>
      </g>
      <g transform="translate(150 6)">
        <line x1="0" y1="-70" x2="-4" y2="70" stroke="var(--c-muted)" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="-2" cy="0" r="9" fill="var(--c-bg)" stroke="var(--c-muted)" stroke-width="2.6"/>
      </g>
    </g>

    <!-- 좌하단 미니 바 -->
    <g transform="translate(-470 210) rotate(-7)">
      <rect width="86" height="10" rx="5" fill="var(--c-muted)" opacity="0.6"/>
      <rect y="20" width="56" height="10" rx="5" fill="var(--c-muted)" opacity="0.35"/>
    </g>
  </g>

  <!-- 디테일 -->
  <g transform="translate(150 110)">
    <circle r="4" fill="var(--c-muted)"/>
    <circle cx="16" r="4" fill="var(--c-muted)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-muted)" opacity="0.3"/>
  </g>
  <g transform="translate(1040 130) rotate(14)" opacity="0.6">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-muted)" stroke-width="1.8"/>
  </g>
  <g transform="translate(150 520)" opacity="0.5">
    <circle r="44" fill="none" stroke="var(--c-muted)" stroke-width="1.6"/>
    <circle r="24" fill="none" stroke="var(--c-muted)" stroke-width="1.6" opacity="0.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">14</text>
</svg>
