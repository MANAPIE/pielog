<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">Strategy와 다크모드 스위칭: ep.08 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="grad1" cx="18%" cy="40%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="82%" cy="60%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- 배경 stroke 도형 -->
  <circle cx="100" cy="100" r="220" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.13"/>
  <rect x="780" y="430" width="500" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12" transform="rotate(8 1030 600)"/>

  <!-- 중앙 Context 슬롯 -->
  <g transform="translate(600 315)">
    <!-- 외곽 -->
    <rect x="-180" y="-90" width="360" height="180" rx="9" fill="none" stroke="var(--c-line)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.5"/>
    <rect x="-170" y="-80" width="340" height="160" rx="6" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>

    <!-- Context 라벨 영역 -->
    <text x="-150" y="-50" font-family="Inter,system-ui" font-size="11" font-weight="700" fill="var(--c-muted)" letter-spacing="0.08em">CONTEXT</text>
    <line x1="-150" y1="-38" x2="-30" y2="-38" stroke="var(--c-line)" stroke-width="2"/>

    <!-- 슬롯 (Strategy가 들어가는 자리) -->
    <rect x="-90" y="-15" width="180" height="80" rx="5" fill="none" stroke="var(--c-accent-3)" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="0" y="-25" font-family="Inter,system-ui" font-size="11" font-weight="700" fill="var(--c-accent-3)" text-anchor="middle" letter-spacing="0.08em">STRATEGY SLOT</text>
  </g>

  <!-- 좌측 Strategy A (현재 끼워진 것) -->
  <g transform="translate(600 315)">
    <rect x="-75" y="0" width="150" height="50" rx="5" fill="var(--c-accent-3)" opacity="0.95"/>
    <text x="0" y="22" font-family="Inter,system-ui" font-size="13" font-weight="700" fill="var(--c-bg)" text-anchor="middle">light</text>
    <line x1="-50" y1="35" x2="50" y2="35" stroke="var(--c-bg)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌측에 대기 중인 다른 Strategy들 -->
  <g transform="translate(200 270) rotate(-5)">
    <rect x="-70" y="-22" width="140" height="44" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <text x="0" y="6" font-family="Inter,system-ui" font-size="12" font-weight="700" fill="var(--c-fg)" text-anchor="middle">dark</text>
  </g>

  <g transform="translate(200 360) rotate(4)">
    <rect x="-70" y="-22" width="140" height="44" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <text x="0" y="6" font-family="Inter,system-ui" font-size="12" font-weight="700" fill="var(--c-fg)" text-anchor="middle">contrast</text>
  </g>

  <!-- 우측에 대기 중인 Strategy들 -->
  <g transform="translate(1000 290) rotate(5)">
    <rect x="-70" y="-22" width="140" height="44" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <text x="0" y="6" font-family="Inter,system-ui" font-size="12" font-weight="700" fill="var(--c-fg)" text-anchor="middle">sepia</text>
  </g>

  <g transform="translate(1000 380) rotate(-4)">
    <rect x="-70" y="-22" width="140" height="44" rx="5" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <text x="0" y="6" font-family="Inter,system-ui" font-size="12" font-weight="700" fill="var(--c-fg)" text-anchor="middle">custom</text>
  </g>

  <!-- 갈아끼우는 화살표들 (양쪽에서 슬롯으로) -->
  <g opacity="0.6">
    <path d="M 280 285 Q 380 310 500 325" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-dasharray="3 4"/>
    <polygon points="500,325 492,322 492,330" fill="var(--c-line)"/>
    <path d="M 280 360 Q 380 340 500 335" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-dasharray="3 4"/>
    <polygon points="500,335 492,332 492,340" fill="var(--c-line)"/>
    <path d="M 920 295 Q 820 315 700 335" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-dasharray="3 4"/>
    <polygon points="700,335 708,332 708,340" fill="var(--c-line)"/>
    <path d="M 920 375 Q 820 350 700 340" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-dasharray="3 4"/>
    <polygon points="700,340 708,337 708,345" fill="var(--c-line)"/>
  </g>

  <!-- 우상단 동심원 -->
  <g transform="translate(1050 130)" opacity="0.7">
    <circle r="48" fill="none" stroke="var(--c-accent)" stroke-width="1.5"/>
    <circle r="28" fill="none" stroke="var(--c-accent)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌상단 작은 점 무리 -->
  <g transform="translate(220 130)">
    <circle r="4" fill="var(--c-accent-2)"/>
    <circle cx="16" r="4" fill="var(--c-accent-2)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent-2)" opacity="0.3"/>
  </g>

  <!-- 좌하단 회전 사각형 -->
  <g transform="translate(140 540) rotate(-14)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
  </g>

  <!-- 우하단 큰 시리즈 번호 -->
  <text x="1130" y="575" class="num" text-anchor="end">08</text>
</svg>
