  <!-- 설명 -->
  <g transform="translate(24 418)">
    <rect width="752" height="106" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="20" y="28" class="ttl" font-size="13">왜 p × p부터 지워도 되는가</text>
    <text x="20" y="52" class="sub">p보다 작은 소수 q가 있다면, p × q는 q 차례에 이미 지워졌습니다. 그래서 p × p 앞은 볼 필요가 없습니다.</text>
    <text x="20" y="72" class="sub">같은 이유로 p × p가 범위를 넘으면 그 뒤로는 지울 것이 없습니다. 이것이 바깥 반복을 √N에서 멈추는 근거입니다.</text>
    <text x="20" y="92" class="sub">전체 비용은 O(N log log N)입니다. 소수 하나를 판정하는 것과 범위 전체를 거르는 것은 다른 문제입니다.</text>
  </g>
</svg>
