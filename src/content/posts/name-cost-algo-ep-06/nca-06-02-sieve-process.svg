<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sieve">
  <title id="t-sieve">에라토스테네스의 체가 2부터 30까지를 걸러내는 과정</title>
  <defs>
    <style>
