        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-pr: rgba(47,125,110,0.34); --c-pr-b: #2F7D6E;
        --c-out: rgba(107,114,128,0.14); --c-out-t: rgba(107,114,128,0.75);
        --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-pr: rgba(111,195,176,0.34); --c-pr-b: #6FC3B0;
          --c-out: rgba(139,146,160,0.14); --c-out-t: rgba(139,146,160,0.70);
          --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .u { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1; }
      .p { fill: var(--c-pr); stroke: var(--c-pr-b); stroke-width: 1.8; }
      .x { fill: var(--c-out); stroke: none; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; font-weight: 700; fill: var(--c-fg); }
      .nx { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; fill: var(--c-out-t); }
      .np { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; font-weight: 700; fill: var(--c-pr-b); }
      .note { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; fill: var(--c-muted); }
    </style>
  </defs>

  <rect class="bg" width="800" height="580"/>

