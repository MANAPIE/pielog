<svg viewBox="0 0 500 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ext">
  <title id="t-ext">극단적 사용자를 위한 설계의 확장</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ext" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ext-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="292" />
  <text x="24" y="34" class="th">극단적 사용자</text>
  <text x="196" y="34" class="th">설계 결정</text>
  <text x="358" y="34" class="th">모든 사용자</text>
  <line x1="24" y1="42" x2="476" y2="42" stroke="var(--c-divider)" stroke-width="1" />
  <g transform="translate(24 56)">
    <rect width="150" height="56" rx="6" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="12" y="24" class="td">시력이 낮은</text>
    <text x="12" y="42" class="td">사용자</text>
    <line x1="152" y1="28" x2="164" y2="28" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-ext)" />
    <rect x="172" y="0" width="140" height="56" rx="6" class="card" stroke="var(--c-divider)" stroke-width="1" />
    <text x="184" y="24" class="td">큰 글자,</text>
    <text x="184" y="42" class="td">높은 명도 대비</text>
    <line x1="314" y1="28" x2="326" y2="28" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-ext)" />
    <rect x="334" y="0" width="118" height="56" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
    <text x="346" y="24" class="td">햇빛 아래의</text>
    <text x="346" y="42" class="td">모든 사용자</text>
  </g>
  <g transform="translate(24 128)">
    <rect width="150" height="56" rx="6" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="12" y="24" class="td">한 손만 쓸 수 있는</text>
    <text x="12" y="42" class="td">사용자</text>
    <line x1="152" y1="28" x2="164" y2="28" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-ext)" />
    <rect x="172" y="0" width="140" height="56" rx="6" class="card" stroke="var(--c-divider)" stroke-width="1" />
    <text x="184" y="24" class="td">하단 배치,</text>
    <text x="184" y="42" class="td">큰 터치 영역</text>
    <line x1="314" y1="28" x2="326" y2="28" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-ext)" />
    <rect x="334" y="0" width="118" height="56" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
    <text x="346" y="24" class="td">짐을 들거나 아이를</text>
    <text x="346" y="42" class="td">안은 모든 사용자</text>
  </g>
  <g transform="translate(24 200)">
    <rect width="150" height="56" rx="6" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="12" y="24" class="td">시간이 극도로</text>
    <text x="12" y="42" class="td">부족한 사용자</text>
    <line x1="152" y1="28" x2="164" y2="28" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-ext)" />
    <rect x="172" y="0" width="140" height="56" rx="6" class="card" stroke="var(--c-divider)" stroke-width="1" />
    <text x="184" y="24" class="td">3초 안에 끝나는</text>
    <text x="184" y="42" class="td">핵심 경로</text>
    <line x1="314" y1="28" x2="326" y2="28" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-ext)" />
    <rect x="334" y="0" width="118" height="56" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
    <text x="346" y="24" class="td">여유 있는 사용자도</text>
    <text x="346" y="42" class="td">더 빨리 끝냄</text>
  </g>
  <text x="24" y="280" class="cap">출처: Microsoft Inclusive Design Toolkit(2016)의 "solve for one, extend to many".</text>
</svg>
