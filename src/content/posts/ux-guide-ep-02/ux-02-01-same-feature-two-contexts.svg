<svg viewBox="0 0 500 378" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ctx">
  <title id="t-ctx">같은 기능, 두 맥락</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ctx" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ctx-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

  <rect class="bg" width="500" height="378" />
  <g transform="translate(150 24)">
    <rect width="200" height="150" rx="8" class="card" stroke="var(--c-divider)" stroke-width="1" />
    <text x="16" y="24" class="nm">비밀번호 변경</text>
    <rect x="16" y="36" width="168" height="20" rx="4" fill="var(--c-muted-soft)" />
    <text x="24" y="50" class="cap">현재 비밀번호</text>
    <rect x="16" y="62" width="168" height="20" rx="4" fill="var(--c-muted-soft)" />
    <text x="24" y="76" class="cap">새 비밀번호</text>
    <text x="16" y="100" class="cap">대문자 · 특수문자 · 8자 이상</text>
    <rect x="16" y="112" width="168" height="24" rx="4" fill="var(--c-fg)" />
    <text x="100" y="128" class="lbl" fill="var(--c-bg)" text-anchor="middle">변경</text>
  </g>
  <line x1="150" y1="99" x2="128" y2="99" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-ctx)" />
  <line x1="350" y1="99" x2="372" y2="99" stroke="var(--c-muted)" stroke-width="1.5" marker-end="url(#a-ctx)" />

  <g transform="translate(24 198)">
    <rect width="218" height="136" rx="8" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.6" />
    <text x="16" y="24" class="lbl" fill="var(--c-accent)">맥락 A</text>
    <text x="16" y="46" class="nm">3개월 알림을 보고 여유 있게</text>
    <text x="16" y="70" class="cap">시간: 여유 있음</text>
    <text x="16" y="88" class="cap">감정: 평온</text>
    <line x1="16" y1="102" x2="202" y2="102" stroke="var(--c-divider)" stroke-width="1" />
    <text x="16" y="124" class="td">규칙 안내가 친절한 가이드로 읽힙니다.</text>
  </g>
  <g transform="translate(258 198)">
    <rect width="218" height="136" rx="8" fill="var(--c-soft-2)" stroke="var(--c-accent-2)" stroke-width="1.6" />
    <text x="16" y="24" class="lbl" fill="var(--c-accent-2)">맥락 B</text>
    <text x="16" y="46" class="nm">해킹이 의심되어 급히</text>
    <text x="16" y="70" class="cap">시간: 없음</text>
    <text x="16" y="88" class="cap">감정: 불안</text>
    <line x1="16" y1="102" x2="202" y2="102" stroke="var(--c-divider)" stroke-width="1" />
    <text x="16" y="124" class="td">같은 안내가 지금 넘어야 하는 장벽이 됩니다.</text>
  </g>
  <path d="M133 198 V99" fill="none" stroke="var(--c-muted)" stroke-width="1" stroke-dasharray="2 3" />
  <path d="M367 198 V99" fill="none" stroke="var(--c-muted)" stroke-width="1" stroke-dasharray="2 3" />
  <text x="24" y="362" class="cap">기능은 같지만 경험은 맥락이 만듭니다.</text>
</svg>
