<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"
  font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif">
  <style>
    .title {
      fill: #111827;
      font-size: 15px;
      font-weight: 700
    }

    .doc {
      fill: #fafafa;
      stroke: #1f2937;
      stroke-width: 2
    }

    .header-strip {
      fill: #1f2937
    }

    .header-text {
      fill: #fff;
      font-size: 10px;
      font-weight: 600
    }

    .meta-strip {
      fill: #f3f4f6
    }

    .meta-text {
      fill: #4b5563;
      font-size: 10px
    }

    .card {
      fill: #fff;
      stroke: #d1d5db;
      stroke-width: 1
    }

    .placeholder {
      fill: #e5e7eb
    }

    .num {
      fill: #3b82f6
    }

    .num-text {
      fill: #fff;
      font-size: 10px;
      font-weight: 700;
      text-anchor: middle
    }

    .label-line {
      stroke: #3b82f6;
      stroke-width: 1.5;
      fill: none
    }

    .label {
      fill: #1f2937;
      font-size: 11px;
      font-weight: 700
    }

    .label-sub {
      fill: #6b7280;
      font-size: 9.5px
    }

    @media(prefers-color-scheme:dark) {
      .title {
        fill: #f5f5f5
      }

      .doc {
        fill: #1a1a1a;
        stroke: #525252
      }

      .header-strip {
        fill: #404040
      }

      .meta-strip {
        fill: #262626
      }

      .meta-text {
        fill: #a3a3a3
      }

      .card {
        fill: #171717;
        stroke: #404040
      }

      .placeholder {
        fill: #2a2a2a
      }

      .num {
        fill: #3b82f6
      }

      .label-line {
        stroke: #60a5fa
      }

      .label {
        fill: #f5f5f5
      }

      .label-sub {
        fill: #a3a3a3
      }
    }
  </style>
  <text x="400" y="32" text-anchor="middle" class="title">화면설계서 한 장의 9가지 항목</text>

  <!-- Document mockup centered -->
  <rect x="220" y="60" width="360" height="510" class="doc" rx="6" />

  <!-- ① 화면 헤더 -->
  <rect x="220" y="60" width="360" height="36" class="header-strip" rx="6 6 0 0" />
  <text x="240" y="82" class="header-text">PRD-002</text>
  <text x="305" y="82" class="header-text">상품 상세</text>
  <text x="395" y="82" class="header-text">v1.2</text>
  <text x="450" y="82" class="header-text">홍기획</text>
  <text x="510" y="82" class="header-text">2026.05.08</text>

  <rect x="221" y="96" width="358" height="24" class="meta-strip" />
  <text x="240" y="113" class="meta-text">진입경로: 상품 목록, 검색 결과, 딥링크, 찜 목록</text>

  <circle cx="215" cy="78" r="12" class="num" />
  <text x="215" y="82" class="num-text">1</text>
  <line x1="203" y1="78" x2="130" y2="78" class="label-line" />
  <text x="40" y="76" class="label">화면 헤더</text>
  <text x="40" y="89" class="label-sub">ID, 화면명, 진입경로</text>

  <!-- ② 와이어프레임 (left card) -->
  <rect x="240" y="135" width="160" height="270" class="card" rx="4" />
  <rect x="260" y="155" width="120" height="50" class="placeholder" rx="3" />
  <rect x="260" y="220" width="120" height="20" class="placeholder" rx="3" />
  <rect x="260" y="250" width="120" height="20" class="placeholder" rx="3" />
  <rect x="260" y="280" width="120" height="20" class="placeholder" rx="3" />
  <rect x="260" y="320" width="120" height="32" class="num" rx="4" opacity="0.3" />
  <rect x="260" y="365" width="60" height="20" class="placeholder" rx="3" />
  <rect x="320" y="365" width="60" height="20" class="placeholder" rx="3" />

  <circle cx="240" cy="290" r="12" class="num" />
  <text x="240" y="294" class="num-text">2</text>
  <line x1="228" y1="290" x2="130" y2="290" class="label-line" />
  <text x="40" y="288" class="label">와이어프레임</text>
  <text x="40" y="301" class="label-sub">화면 레이아웃</text>

  <!-- ③ 주석 (right card) -->
  <rect x="410" y="135" width="160" height="270" class="card" rx="4" />
  <line x1="420" y1="155" x2="560" y2="155" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="170" x2="540" y2="170" stroke="#e5e7eb" stroke-width="2" />
  <line x1="420" y1="185" x2="555" y2="185" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="200" x2="535" y2="200" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="220" x2="555" y2="220" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="235" x2="540" y2="235" stroke="#e5e7eb" stroke-width="2" />
  <line x1="420" y1="250" x2="555" y2="250" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="270" x2="555" y2="270" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="285" x2="540" y2="285" stroke="#e5e7eb" stroke-width="2" />
  <line x1="420" y1="300" x2="555" y2="300" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="320" x2="555" y2="320" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="340" x2="540" y2="340" stroke="#e5e7eb" stroke-width="2" />
  <line x1="420" y1="355" x2="555" y2="355" stroke="#e5e7eb" stroke-width="1" />
  <line x1="420" y1="370" x2="555" y2="370" stroke="#e5e7eb" stroke-width="1" />

  <circle cx="580" cy="200" r="12" class="num" />
  <text x="580" y="204" class="num-text">3</text>
  <line x1="592" y1="200" x2="650" y2="200" class="label-line" />
  <text x="660" y="198" class="label">주석 (Description)</text>
  <text x="660" y="211" class="label-sub">번호별 동작 설명</text>

  <!-- ④ UI 요소 -->
  <circle cx="240" cy="160" r="12" class="num" />
  <text x="240" y="164" class="num-text">4</text>
  <line x1="228" y1="160" x2="130" y2="160" class="label-line" />
  <text x="40" y="158" class="label">UI 요소</text>
  <text x="40" y="171" class="label-sub">입력/버튼/리스트/모달</text>

  <!-- ⑤ 인터랙션 & 상태 — placed on right top, label like 3/7/9 (no line) -->
  <circle cx="580" cy="160" r="12" class="num" />
  <text x="580" y="164" class="num-text">5</text>
  <line x1="592" y1="160" x2="650" y2="160" class="label-line" />
  <text x="660" y="158" class="label">인터랙션 &amp; 상태</text>
  <text x="660" y="171" class="label-sub">Default/Loading/Empty/Error</text>

  <!-- ⑥ 데이터 정의 -->
  <rect x="240" y="425" width="320" height="60" class="card" rx="4" />
  <text x="252" y="445" class="meta-text" style="font-weight:600">[Data]</text>
  <text x="252" y="460" class="meta-text">- 상품명, 가격: 동적 (서버)</text>
  <text x="252" y="474" class="meta-text">- "배송비 무료": 정적 (고정)</text>

  <circle cx="240" cy="455" r="12" class="num" />
  <text x="240" y="459" class="num-text">6</text>
  <line x1="228" y1="455" x2="130" y2="455" class="label-line" />
  <text x="40" y="453" class="label">데이터 정의</text>
  <text x="40" y="466" class="label-sub">동적/정적 구분</text>

  <!-- ⑦ 권한 -->
  <rect x="240" y="500" width="320" height="22" class="card" rx="4" />
  <text x="252" y="515" class="meta-text">[Permission] 비로그인 / 회원 / 셀러 / 관리자</text>

  <circle cx="580" cy="511" r="12" class="num" />
  <text x="580" y="515" class="num-text">7</text>
  <line x1="592" y1="511" x2="650" y2="511" class="label-line" />
  <text x="660" y="508" class="label">권한 / 정책</text>
  <text x="660" y="521" class="label-sub">유형별 접근 권한</text>

  <!-- ⑧ 예외 처리 -->
  <rect x="240" y="528" width="320" height="22" class="card" rx="4" />
  <text x="252" y="543" class="meta-text">[Edge Case] 빈 입력, 중복 탭, 뒤로가기, 타임아웃</text>

  <circle cx="240" cy="540" r="12" class="num" />
  <text x="240" y="544" class="num-text">8</text>
  <line x1="228" y1="540" x2="130" y2="540" class="label-line" />
  <text x="40" y="538" class="label">예외 처리</text>
  <text x="40" y="551" class="label-sub">엣지 케이스</text>

  <!-- ⑨ 비기능 -->
  <circle cx="580" cy="555" r="12" class="num" />
  <text x="580" y="559" class="num-text">9</text>
  <line x1="592" y1="555" x2="650" y2="555" class="label-line" />
  <text x="660" y="553" class="label">비기능 요구사항</text>
  <text x="660" y="566" class="label-sub">접근성/반응형/성능</text>
</svg>