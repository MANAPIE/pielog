    <rect x="-230" y="-70" width="460" height="52" rx="26" fill="var(--c-accent-3)" fill-opacity="0.65"/>
    <rect x="-140" y="10" width="280" height="52" rx="26" fill="var(--c-accent)" fill-opacity="0.85"/>
    <rect x="-60" y="90" width="120" height="52" rx="26" fill="var(--c-accent-2)"/>
    <g fill="var(--c-accent-2)"><circle cx="300" cy="-60" r="9"/><circle cx="330" cy="-30" r="6" opacity="0.7"/><circle cx="360" cy="0" r="5" opacity="0.5"/><circle cx="385" cy="30" r="4" opacity="0.4"/></g>
    <g fill="var(--c-accent-2)"><circle cx="-300" cy="20" r="9"/><circle cx="-330" cy="50" r="6" opacity="0.7"/><circle cx="-356" cy="80" r="5" opacity="0.5"/></g>
    <path d="M -300 200 L -220 150 L -140 180 L -60 120 L 20 140 L 100 90 L 180 110 L 260 60" fill="none" stroke="var(--c-fg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
  <circle cx="150" cy="150" r="60" fill="none" stroke="var(--c-accent)" stroke-width="3" stroke-dasharray="8 10"/>
