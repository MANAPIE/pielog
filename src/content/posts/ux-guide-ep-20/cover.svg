    <radialGradient id="halo-ux20a" cx="0.2" cy="0.15" r="0.6"><stop offset="0" stop-color="var(--c-accent-2)" stop-opacity="0.26"/><stop offset="1" stop-color="var(--c-accent-2)" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-ux20b" cx="0.85" cy="0.85" r="0.55"><stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.24"/><stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-ux20)"/>
  <rect width="1200" height="630" fill="url(#halo-ux20a)"/>
  <rect width="1200" height="630" fill="url(#halo-ux20b)"/>
  <circle cx="140" cy="560" r="320" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <rect x="820" y="-160" width="520" height="520" rx="48" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(10 1080 100)"/>
