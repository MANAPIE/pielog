<svg viewBox="0 0 500 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ch">
  <title id="t-ch">가입 주차별 코호트의 재방문율</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ch" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ch-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="332" />
  <text x="24" y="36" class="ttl">가입 주차별 코호트의 재방문율</text>
  <text x="173.0" y="66" class="th" text-anchor="middle">0주</text>
  <text x="259.0" y="66" class="th" text-anchor="middle">1주 뒤</text>
  <text x="345.0" y="66" class="th" text-anchor="middle">2주 뒤</text>
  <text x="431.0" y="66" class="th" text-anchor="middle">3주 뒤</text>
  <text x="24" y="102" class="nm">1주차</text>
  <rect x="132" y="78" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="173.0" y="102" class="mid" text-anchor="middle">100%</text>
  <rect x="218" y="78" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="259.0" y="102" class="mid" text-anchor="middle">38%</text>
  <rect x="304" y="78" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="345.0" y="102" class="mid" text-anchor="middle">29%</text>
  <rect x="390" y="78" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="431.0" y="102" class="mid" text-anchor="middle">25%</text>
  <text x="24" y="150" class="nm">2주차</text>
  <rect x="132" y="126" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="173.0" y="150" class="mid" text-anchor="middle">100%</text>
  <rect x="218" y="126" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="259.0" y="150" class="mid" text-anchor="middle">40%</text>
  <rect x="304" y="126" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="345.0" y="150" class="mid" text-anchor="middle">30%</text>
  <rect x="390" y="126" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="431.0" y="150" class="mid" text-anchor="middle">26%</text>
  <text x="24" y="192" class="nm">3주차</text>
  <text x="24" y="208" class="cap" style="fill:var(--c-accent)">온보딩 개선 적용</text>
  <rect x="132" y="174" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="173.0" y="198" class="mid" text-anchor="middle">100%</text>
  <rect x="218" y="174" width="82" height="38" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="259.0" y="198" class="val" text-anchor="middle" style="fill:var(--c-accent)">47%</text>
  <rect x="304" y="174" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="345.0" y="198" class="mid" text-anchor="middle">36%</text>
  <rect x="390" y="174" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="431.0" y="198" class="mid" text-anchor="middle">31%</text>
  <text x="24" y="246" class="nm">4주차</text>
  <rect x="132" y="222" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="173.0" y="246" class="mid" text-anchor="middle">100%</text>
  <rect x="218" y="222" width="82" height="38" rx="6" fill="var(--c-soft)" stroke="var(--c-accent)" stroke-width="1.4" />
  <text x="259.0" y="246" class="val" text-anchor="middle" style="fill:var(--c-accent)">48%</text>
  <rect x="304" y="222" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="345.0" y="246" class="mid" text-anchor="middle">37%</text>
  <rect x="390" y="222" width="82" height="38" rx="6" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="431.0" y="246" class="mid" text-anchor="middle">-</text>
  <text x="24" y="292" class="cap">전체 재방문율로는 보이지 않는 개선 효과가 코호트로 나누면 보입니다.</text>
  <text x="24" y="308" class="cap">3주차부터 1주 뒤 재방문율이 40% 안팎에서 47%, 48%로 올랐습니다.</text>
</svg>
