<svg viewBox="0 0 500 362" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-fn">
  <title id="t-fn">단계별 이탈률로 보는 퍼널</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-fn" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-fn-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="362" />
  <text x="24" y="36" class="ttl">단계별 이탈률로 보는 퍼널</text>
  <text x="24" y="78" class="nm">방문</text>
  <rect x="124" y="60" width="300.0" height="26" rx="4" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.2" />
  <text x="432.0" y="78" class="val" style="fill:var(--c-fg)">100%</text>
  <text x="124" y="104" class="cap" style="fill:var(--c-muted)">↓ 이탈 40%</text>
  <text x="24" y="134" class="nm">상품 조회</text>
  <rect x="124" y="116" width="180.0" height="26" rx="4" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.2" />
  <text x="312.0" y="134" class="val" style="fill:var(--c-fg)">60%</text>
  <text x="124" y="160" class="cap" style="fill:var(--c-accent-2)">↓ 이탈 58%  가장 큰 낙차</text>
  <text x="24" y="190" class="nm">장바구니</text>
  <rect x="124" y="172" width="75.0" height="26" rx="4" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.2" />
  <text x="207.0" y="190" class="val" style="fill:var(--c-fg)">25%</text>
  <text x="124" y="216" class="cap" style="fill:var(--c-muted)">↓ 이탈 40%</text>
  <text x="24" y="246" class="nm">결제 시작</text>
  <rect x="124" y="228" width="45.0" height="26" rx="4" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.2" />
  <text x="177.0" y="246" class="val" style="fill:var(--c-fg)">15%</text>
  <text x="124" y="272" class="cap" style="fill:var(--c-muted)">↓ 이탈 47%</text>
  <text x="24" y="302" class="nm">결제 완료</text>
  <rect x="124" y="284" width="24.0" height="26" rx="4" fill="var(--c-soft-3)" stroke="var(--c-accent-3)" stroke-width="1.2" />
  <text x="156.0" y="302" class="val" style="fill:var(--c-fg)">8%</text>
  <text x="24" y="338" class="cap">전체 전환율 8%가 아니라 단계 사이의 가장 큰 낙차를 찾아야 합니다.</text>
</svg>
