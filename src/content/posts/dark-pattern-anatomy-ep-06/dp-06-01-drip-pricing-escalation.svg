<svg width="100%" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg"
  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>Drip Pricing — 호텔 예약의 단계별 비용 누적</title>
  <desc>1박 80,000원에서 시작해 리조트 수수료, 청소비, 시설 이용료, 세금이 단계별로 추가되어 최종 121,000원이 되는 흐름을 막대그래프로 표현</desc>
  <defs>
    <style>
      .label {
        font-size: 12px;
        font-weight: 500;
        fill: #5F5E5A;
      }

      .price {
        font-size: 12px;
        font-weight: 600;
        fill: #2C2C2A;
      }

      .step-no {
        font-size: 10px;
        font-weight: 600;
        fill: #888780;
        letter-spacing: 0.04em;
      }

      .title-text {
        font-size: 14px;
        font-weight: 500;
        fill: #2C2C2A;
      }

      .caption {
        font-size: 11px;
        fill: #888780;
      }

      .axis {
        stroke: #D3D1C7;
        stroke-width: 0.5;
      }

      .grid {
        stroke: #ECEAE2;
        stroke-width: 0.5;
      }

      .bar-base {
        fill: #B4B2A9;
      }

      .bar-add-1 {
        fill: #FAC775;
      }

      .bar-add-2 {
        fill: #EF9F27;
      }

      .bar-add-3 {
        fill: #BA7517;
      }

      .bar-add-4 {
        fill: #854F0B;
      }

      .delta-text {
        font-size: 10px;
        fill: #633806;
        font-weight: 500;
      }

      .anchor-line {
        stroke: #B4B2A9;
        stroke-dasharray: 3 3;
        stroke-width: 0.5;
      }

      .anchor-label {
        font-size: 10px;
        fill: #888780;
        font-style: italic;
      }

      .final-bg {
        fill: #FCEBEB;
      }

      .final-text {
        fill: #791F1F;
        font-weight: 600;
      }

      @media (prefers-color-scheme: dark) {
        .label {
          fill: #B4B2A9;
        }

        .price {
          fill: #D3D1C7;
        }

        .step-no {
          fill: #888780;
        }

        .title-text {
          fill: #D3D1C7;
        }

        .caption {
          fill: #888780;
        }

        .axis {
          stroke: #5F5E5A;
        }

        .grid {
          stroke: #3A3936;
        }

        .bar-base {
          fill: #5F5E5A;
        }

        .bar-add-1 {
          fill: #854F0B;
        }

        .bar-add-2 {
          fill: #BA7517;
        }

        .bar-add-3 {
          fill: #EF9F27;
        }

        .bar-add-4 {
          fill: #FAC775;
        }

        .delta-text {
          fill: #FFFFFF;
        }

        .anchor-line {
          stroke: #5F5E5A;
        }

        .anchor-label {
          fill: #888780;
        }

        .final-bg {
          fill: #501313;
        }

        .final-text {
          fill: #F7C1C1;
        }
      }
    </style>
  </defs>

  <text x="40" y="16" class="title-text">호텔 예약 — 단계별 가격 누적</text>
  <text x="40" y="36" class="caption">1박 80,000원 → 5단계에 걸쳐 121,000원으로 51% 상승</text>

  <!-- Y axis -->
  <line class="axis" x1="100" y1="80" x2="100" y2="320" />
  <line class="axis" x1="100" y1="320" x2="640" y2="320" />

  <!-- bars (5 steps) -->
  <!-- step 1: 1박 80,000 -->
  <rect class="bar-base" x="130" y="120" width="80" height="200" />
  <text x="170" y="115" text-anchor="middle" class="price">80,000</text>
  <text x="170" y="340" text-anchor="middle" class="label">1박 요금</text>
  <text x="170" y="356" text-anchor="middle" class="step-no">STEP 1</text>

  <!-- step 2: +15,000 = 95,000 -->
  <rect class="bar-base" x="230" y="120" width="80" height="200" />
  <rect class="bar-add-1" x="230" y="83" width="80" height="37" />
  <text x="270" y="78" text-anchor="middle" class="price">95,000</text>
  <text x="270" y="106" text-anchor="middle" class="delta-text">+15,000</text>
  <text x="270" y="340" text-anchor="middle" class="label">+ 리조트 수수료</text>
  <text x="270" y="356" text-anchor="middle" class="step-no">STEP 2</text>

  <!-- step 3: +10,000 = 105,000 -->
  <rect class="bar-base" x="330" y="120" width="80" height="200" />
  <rect class="bar-add-1" x="330" y="83" width="80" height="37" />
  <rect class="bar-add-2" x="330" y="58" width="80" height="25" />
  <text x="370" y="53" text-anchor="middle" class="price">105,000</text>
  <text x="370" y="74" text-anchor="middle" class="delta-text">+10,000</text>
  <text x="370" y="340" text-anchor="middle" class="label">+ 청소비</text>
  <text x="370" y="356" text-anchor="middle" class="step-no">STEP 3</text>

  <!-- step 4: +5,000 = 110,000 -->
  <rect class="bar-base" x="430" y="120" width="80" height="200" />
  <rect class="bar-add-1" x="430" y="83" width="80" height="37" />
  <rect class="bar-add-2" x="430" y="58" width="80" height="25" />
  <rect class="bar-add-3" x="430" y="46" width="80" height="12" />
  <text x="470" y="41" text-anchor="middle" class="price">110,000</text>
  <text x="470" y="56" text-anchor="middle" class="delta-text">+5,000</text>
  <text x="470" y="340" text-anchor="middle" class="label">+ 시설 이용료</text>
  <text x="470" y="356" text-anchor="middle" class="step-no">STEP 4</text>

  <!-- step 5: +11,000 = 121,000 -->
  <rect class="bar-base" x="530" y="120" width="80" height="200" />
  <rect class="bar-add-1" x="530" y="83" width="80" height="37" />
  <rect class="bar-add-2" x="530" y="58" width="80" height="25" />
  <rect class="bar-add-3" x="530" y="46" width="80" height="12" />
  <rect class="bar-add-4" x="530" y="18" width="80" height="28" />
  <rect class="final-bg" x="538" y="0" width="64" height="20" rx="4" />
  <text x="570" y="14" text-anchor="middle" class="price final-text">121,000</text>
  <text x="570" y="36" text-anchor="middle" class="delta-text">+11,000</text>
  <text x="570" y="340" text-anchor="middle" class="label">+ 세금·봉사료</text>
  <text x="570" y="356" text-anchor="middle" class="step-no">STEP 5</text>

  <!-- baseline anchor -->
  <line class="anchor-line" x1="100" y1="120" x2="640" y2="120" />
  <text x="640" y="115" text-anchor="end" class="anchor-label">초기 표시 가격 (앵커)</text>

  <!-- Bottom: takeaway -->
  <rect x="40" y="382" width="600" height="40" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5" />
  <rect x="40" y="382" width="600" height="40" rx="8" fill="none" />
  <text x="60" y="406" class="caption">앵커링: 80,000원이 기준점이 되어, 각 단계의 추가 비용은 "약간 더"로 인식됨. 매몰비용으로 이탈 임계치 상승.</text>

  <style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#F1EFE8"] {
        fill: #2C2C2A;
        stroke: #444441;
      }
    }
  </style>
</svg>