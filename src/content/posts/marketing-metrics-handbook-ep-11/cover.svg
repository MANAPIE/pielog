<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">ep.11 — 트래킹과 데이터 수집</title>
  <style>
    :root {
      --c-bg: #fafaf7;
      --c-fg: #1a1a1a;
      --c-muted: #6b6b6b;
      --c-accent: #c97f4a;
      --c-accent-2: #2d4a3e;
      --c-accent-3: #d9a47e;
      --c-num: #c97f4a;
      --c-dot: #1a1a1a;
      --c-line: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e;
        --c-fg: #ededea;
        --c-muted: #999996;
        --c-accent: #e09a6a;
        --c-accent-2: #7fb09a;
        --c-accent-3: #d4a560;
        --c-num: #e09a6a;
        --c-dot: #ededea;
        --c-line: #4a4a47;
      }
    }
  </style>
  <defs>
    <pattern id="dotgrid11" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="var(--c-dot)" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="rg11a" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg11b" cx="82%" cy="82%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="var(--c-bg)"/>
  <rect width="1200" height="630" fill="url(#dotgrid11)"/>
  <rect width="1200" height="630" fill="url(#rg11a)"/>
  <rect width="1200" height="630" fill="url(#rg11b)"/>

  <!-- 화면 밖 큰 도형 -->
  <circle cx="-80" cy="600" r="280" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="1000" y="-100" width="320" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(8 1160 60)"/>

  <!-- 메인 메타포: 데이터 흐름 다이어그램 - 클라이언트 → 서버 → 다양한 destination -->
  <g transform="translate(85, 54) scale(1.13)">
    <!-- 좌측: 클라이언트 노드 (디바이스) -->
    <g transform="translate(0, 130)">
      <!-- 디바이스 1 -->
      <rect x="0" y="0" width="100" height="60" fill="none" stroke="var(--c-fg)" stroke-width="2" rx="3"/>
      <circle cx="50" cy="30" r="14" fill="var(--c-accent-2)"/>

      <!-- 디바이스 2 -->
      <rect x="0" y="80" width="100" height="60" fill="none" stroke="var(--c-fg)" stroke-width="2" rx="3"/>
      <circle cx="50" cy="110" r="14" fill="var(--c-accent-2)"/>

      <!-- 디바이스 3 -->
      <rect x="0" y="160" width="100" height="60" fill="none" stroke="var(--c-fg)" stroke-width="2" rx="3"/>
      <circle cx="50" cy="190" r="14" fill="var(--c-accent-2)"/>
    </g>

    <!-- 중앙: 서버 (큰 노드) -->
    <g transform="translate(360, 200)">
      <rect x="0" y="0" width="180" height="120" fill="var(--c-accent)" fill-opacity="0.15" stroke="var(--c-accent)" stroke-width="2" rx="3"/>
      <!-- 내부 디테일 (서버 모양) -->
      <line x1="20" y1="30" x2="160" y2="30" stroke="var(--c-accent)" stroke-width="1.5"/>
      <line x1="20" y1="60" x2="160" y2="60" stroke="var(--c-accent)" stroke-width="1.5"/>
      <line x1="20" y1="90" x2="160" y2="90" stroke="var(--c-accent)" stroke-width="1.5"/>
      <circle cx="36" cy="30" r="3" fill="var(--c-accent)"/>
      <circle cx="36" cy="60" r="3" fill="var(--c-accent)"/>
      <circle cx="36" cy="90" r="3" fill="var(--c-accent)"/>
    </g>

    <!-- 우측: 다양한 destination -->
    <g transform="translate(800, 80)">
      <!-- destination 1 (광고 매체) -->
      <rect x="0" y="0" width="100" height="50" fill="var(--c-accent-3)" fill-opacity="0.5" stroke="var(--c-fg)" stroke-width="1.5" rx="3"/>
      <g transform="translate(50, 25)" fill="var(--c-fg)">
        <circle cx="-14" cy="0" r="3"/>
        <circle cx="0" cy="0" r="3"/>
        <circle cx="14" cy="0" r="3"/>
      </g>

      <!-- destination 2 (분석 도구) -->
      <rect x="0" y="80" width="100" height="50" fill="var(--c-accent-3)" fill-opacity="0.5" stroke="var(--c-fg)" stroke-width="1.5" rx="3"/>
      <g transform="translate(20, 96)" fill="var(--c-accent-2)">
        <rect x="0" y="10" width="6" height="14"/>
        <rect x="10" y="4" width="6" height="20"/>
        <rect x="20" y="14" width="6" height="10"/>
        <rect x="30" y="0" width="6" height="24"/>
        <rect x="40" y="6" width="6" height="18"/>
        <rect x="50" y="10" width="6" height="14"/>
      </g>

      <!-- destination 3 (데이터 웨어하우스) -->
      <rect x="0" y="160" width="100" height="50" fill="var(--c-accent-3)" fill-opacity="0.5" stroke="var(--c-fg)" stroke-width="1.5" rx="3"/>
      <g transform="translate(40, 185)">
        <ellipse cx="10" cy="0" rx="20" ry="6" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
        <ellipse cx="10" cy="6" rx="20" ry="6" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
        <ellipse cx="10" cy="12" rx="20" ry="6" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
      </g>

      <!-- destination 4 (BI) -->
      <rect x="0" y="240" width="100" height="50" fill="var(--c-accent-3)" fill-opacity="0.5" stroke="var(--c-fg)" stroke-width="1.5" rx="3"/>
      <g transform="translate(50, 265)">
        <path d="M -20 8 L -10 0 L 0 4 L 10 -6 L 20 -10" fill="none" stroke="var(--c-accent-2)" stroke-width="2"/>
      </g>
    </g>

    <!-- 연결선 (클라이언트 → 서버) -->
    <g stroke="var(--c-fg)" stroke-width="1.5" stroke-opacity="0.5" fill="none">
      <path d="M 100 160 L 360 220" stroke-dasharray="0"/>
      <path d="M 100 240 L 360 260" stroke-dasharray="0"/>
      <path d="M 100 320 L 360 290" stroke-dasharray="0"/>
    </g>

    <!-- 연결선 (서버 → destination) -->
    <g stroke="var(--c-accent)" stroke-width="1.5" stroke-opacity="0.7" fill="none">
      <path d="M 540 220 L 800 100" stroke-dasharray="4 3"/>
      <path d="M 540 240 L 800 180" stroke-dasharray="4 3"/>
      <path d="M 540 280 L 800 260" stroke-dasharray="4 3"/>
      <path d="M 540 300 L 800 340" stroke-dasharray="4 3"/>
    </g>

    <!-- 흐름 표시: 이벤트 도트 (서버 안으로 들어가는) -->
    <g fill="var(--c-accent-2)">
      <circle cx="240" cy="240" r="4"/>
      <circle cx="260" cy="258" r="4"/>
      <circle cx="280" cy="276" r="4"/>
      <circle cx="300" cy="270" r="4"/>
    </g>

    <!-- 흐름 표시: 이벤트 도트 (서버에서 나가는) -->
    <g fill="var(--c-accent)">
      <circle cx="610" cy="180" r="4"/>
      <circle cx="630" cy="200" r="4"/>
      <circle cx="650" cy="230" r="4"/>
      <circle cx="670" cy="290" r="4"/>
    </g>

    <!-- 포커스 링 (서버 강조) -->
    <rect x="350" y="190" width="200" height="140" fill="none" stroke="var(--c-accent)" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>

    <!-- 회전된 사각형 -->
    <rect x="-30" y="60" width="22" height="22" fill="none" stroke="var(--c-accent)" stroke-width="1.5" transform="rotate(15 -19 71)"/>
    <rect x="920" y="380" width="22" height="22" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" transform="rotate(-12 931 391)"/>
  </g>

  <!-- 우하단 시리즈 번호 -->
  <text x="1144" y="600" text-anchor="end"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="220" font-weight="700"
    fill="var(--c-num)" fill-opacity="0.18"
    letter-spacing="-0.04em">11</text>
</svg>
