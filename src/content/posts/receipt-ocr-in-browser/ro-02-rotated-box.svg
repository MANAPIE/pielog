<svg xmlns="http://www.w3.org/2000/svg" width="500" height="538" viewBox="0 0 500 538" role="img" aria-labelledby="t2 d2">
<title id="t2">축 정렬 박스와 회전 박스</title>
<desc id="d2">기울어진 영수증 네 줄(상호 ○○식당, 승인일시 2025-12-08 12:34:56, 승인번호 12345678, 합계 12,000) 중 승인일시 줄을 오려 내는 두 방식 비교. 위: 축 정렬 박스는 화면 가로세로 축에 맞춘 사각형이라 위아래 줄까지 덮어 이웃 줄이 섞이거나 점수 미달로 탈락. 아래: 회전 박스는 줄의 기울기에 맞춘 사각형이라 한 줄만 정확히 들어와 인식 모델이 제대로 읽음. 결과(PaddleOCR, 샘플 26장): 날짜 69%에서 100%, 승인번호 79%에서 98%. OpenCV 없이 JS로 최소 면적 사각형(minAreaRect)을 구해 오려 냄</desc>

<defs><style>
:root{
  --c-bg:#FAFAF7; --c-fg:#1A1F2E; --c-muted:#6B7280; --c-card:#FFFFFF;
  --c-line:#C9CDD6; --c-divider:#E5E7EB;
  --c-accent:#0B7A44; --c-accent-2:#1F63B5;
  --c-soft:#E7F5EE; --c-soft-2:#E8F0FB;
}
@media (prefers-color-scheme: dark){
  :root{
    --c-bg:#0F1419; --c-fg:#E8E6E1; --c-muted:#8B92A0; --c-card:#161B22;
    --c-line:#3A4250; --c-divider:#2A313C;
    --c-accent:#3DBE7A; --c-accent-2:#5EA1F0;
    --c-soft:#12301F; --c-soft-2:#10253A;
  }
}
text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;fill:var(--c-fg)}
.bg{fill:var(--c-bg)}
.card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1}
.soft{fill:var(--c-soft);stroke:var(--c-accent);stroke-width:1}
.soft2{fill:var(--c-soft-2);stroke:var(--c-accent-2);stroke-width:1}
.outer{fill:none;stroke:var(--c-accent);stroke-width:1.5;stroke-dasharray:6 4}
.title{font-size:14px;font-weight:700}
.label{font-size:13px;font-weight:700}
.desc{font-size:12px;fill:var(--c-muted)}
.small{font-size:11px;fill:var(--c-muted)}
.glabel{font-size:12px;font-weight:700;fill:var(--c-accent)}
.glabel2{font-size:12px;font-weight:700;fill:var(--c-accent-2)}
.arrow{stroke:var(--c-muted);stroke-width:1.5;fill:none}
.arrowhead{fill:var(--c-muted)}
.receipt{font-size:13px;fill:var(--c-fg)}
.box-axis{fill:var(--c-accent-2);fill-opacity:.14;stroke:var(--c-accent-2);stroke-width:1.5}
.box-rot{fill:var(--c-accent);fill-opacity:.14;stroke:var(--c-accent);stroke-width:1.5}
.note{fill:var(--c-card);stroke:var(--c-divider);stroke-width:1}
.result{font-size:13px;font-weight:700;fill:var(--c-accent)}
</style></defs>
<rect class="bg" x="0" y="0" width="500" height="538"/>
<text class="title" x="24" y="38">축 정렬 박스와 회전 박스</text>
<text class="desc" x="24" y="60">폰으로 찍은 영수증은 줄이 조금씩 기울어 있습니다. 같은 검출 결과를</text>
<text class="desc" x="24" y="76">두 가지 사각형으로 오려 낼 때의 차이입니다.</text>
<text class="glabel2" x="24" y="102">축 정렬 박스: 화면 가로세로 축에 맞춘 사각형</text>
<rect class="card" x="24" y="112" width="452" height="150" rx="8"/>
<g transform="translate(52 156) rotate(-7.0)">
<text class="receipt" x="0" y="0">상호  ○○식당</text>
<text class="receipt" x="0" y="26">승인일시  2025-12-08  12:34:56  일시불</text>
<text class="receipt" x="0" y="52">승인번호  12345678</text>
<text class="receipt" x="0" y="78">합계  12,000</text>
</g>
<rect class="box-axis" x="49.4" y="140.8" width="219.1" height="48.4" rx="3"/>
<text class="small" x="288" y="224">사각형이 위아래 줄까지 덮음</text>
<text class="small" x="288" y="240">→ 이웃 줄이 섞이거나 점수 미달로 탈락</text>
<text class="glabel" x="24" y="290">회전 박스: 줄의 기울기에 맞춘 사각형</text>
<rect class="card" x="24" y="300" width="452" height="150" rx="8"/>
<g transform="translate(52 344) rotate(-7.0)">
<text class="receipt" x="0" y="0">상호  ○○식당</text>
<text class="receipt" x="0" y="26">승인일시  2025-12-08  12:34:56  일시불</text>
<text class="receipt" x="0" y="52">승인번호  12345678</text>
<text class="receipt" x="0" y="78">합계  12,000</text>
<rect class="box-rot" x="-4" y="11" width="218" height="22" rx="3"/>
</g>
<text class="small" x="288" y="412">한 줄만 정확히 들어옴</text>
<text class="small" x="288" y="428">→ 인식 모델이 줄을 제대로 읽음</text>
<rect class="note" x="24" y="470" width="452" height="44" rx="6"/>
<text class="result" x="36" y="488">결과(PaddleOCR, 샘플 26장): 날짜 69% → 100%, 승인번호 79% → 98%</text>
<text class="small" x="36" y="504">OpenCV 없이 JS로 최소 면적 사각형(minAreaRect)을 구해 오려 냄</text>
</svg>
