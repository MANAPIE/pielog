<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-labelledby="t6 d6">
<title id="t6">승인번호를 잘라 내지 못하는 경우</title>
<desc id="d6">OCR 결과 안에는 승인번호가 98% 들어 있지만 파서는 58~62%만 채움. ① 라벨이 두 글자 깨짐: '승언벋호 12345678'(언·벋이 틀림), 편집 거리 2라서 한 글자 차이만 인정하는 규칙으로는 라벨을 못 찾음. ② 번호 뒤에 다른 숫자가 붙음: '승인번호 1234567800', 10자리 중 어디서 8자리를 끊을지 알 수 없음. ③ 두 글자 차이까지 인정하면: '결제방법 ≈ 결제액', 승인번호와 상관없는 라벨까지 잡는 오탐이 실측됨. 승인번호는 일단 폼에 쓰지 않음. 시도: 한 글자 틀린 라벨 인정, 라벨 표기 확장, '승인' 근처 8자리 폴백으로 55%에서 58~62%</desc>

<defs><style>
:root{
  --c-bg:#FAFAF7; --c-fg:#1A1F2E; --c-muted:#6B7280; --c-card:#FFFFFF;
  --c-line:#C9CDD6; --c-divider:#E5E7EB;
  --c-accent:#0B7A44; --c-accent-2:#1F63B5;
  --c-soft:#E7F5EE; --c-soft-2:#E8F0FB;
}
@media (prefers-color-scheme: dark){
  :root{
    --c-bg:#0F1419; --c-fg:#E8E6E1; --c-muted:#8B92A0; --c-card:#161B22;
    --c-line:#3A4250; --c-divider:#2A313C;
    --c-accent:#3DBE7A; --c-accent-2:#5EA1F0;
    --c-soft:#12301F; --c-soft-2:#10253A;
  }
}
text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;fill:var(--c-fg)}
.bg{fill:var(--c-bg)}
.card{fill:var(--c-card);stroke:var(--c-line);stroke-width:1}
.title{font-size:14px;font-weight:700}
.label{font-size:13px;font-weight:700}
.desc{font-size:12px;fill:var(--c-muted)}
.small{font-size:11px;fill:var(--c-muted)}
.box-axis{fill:var(--c-accent-2);fill-opacity:.14;stroke:var(--c-accent-2);stroke-width:1.5}
.note{fill:var(--c-card);stroke:var(--c-divider);stroke-width:1}
.ocr{font-size:13px;fill:var(--c-fg)}
.miss{font-weight:700;fill:var(--c-accent-2)}
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
</style></defs>
<rect class="bg" x="0" y="0" width="500" height="450"/>
<text class="title" x="24" y="38">승인번호를 잘라 내지 못하는 경우</text>
<text class="desc" x="24" y="60">OCR 결과 안에는 승인번호가 98% 들어 있지만, 파서는 58~62%만 채웁니다.</text>

<rect class="card" x="24" y="76" width="452" height="82" rx="8"/>
<text class="label" x="36" y="100">① 라벨이 두 글자 깨짐</text>
<text class="ocr mono" x="36" y="126">승<tspan class="miss">언벋</tspan>호  12345678</text>
<text class="small" x="36" y="146">편집 거리 2 → 한 글자 차이만 인정하는 규칙으로는 라벨을 못 찾음</text>

<rect class="card" x="24" y="170" width="452" height="82" rx="8"/>
<text class="label" x="36" y="194">② 번호 뒤에 다른 숫자가 붙음</text>
<rect class="box-axis" x="92" y="206" width="80" height="20" rx="3"/>
<text class="ocr mono" x="36" y="220">승인번호  1234567800</text>
<text class="small" x="36" y="240">10자리 중 어디서 8자리를 끊을지 알 수 없음</text>

<rect class="card" x="24" y="264" width="452" height="82" rx="8"/>
<text class="label" x="36" y="288">③ 두 글자 차이까지 인정하면</text>
<text class="ocr mono" x="36" y="314">결제방법 ≈ 결제액</text>
<text class="small" x="36" y="334">승인번호와 상관없는 라벨까지 잡는 오탐이 실측됨</text>

<rect class="note" x="24" y="362" width="452" height="64" rx="6"/>
<text class="label" x="36" y="382">승인번호는 일단 폼에 쓰지 않음</text>
<text class="small" x="36" y="400">시도: 한 글자 틀린 라벨 인정, 라벨 표기 확장,</text>
<text class="small" x="36" y="416">'승인' 근처 8자리 폴백 → 55%에서 58~62%</text>
</svg>
