<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-bm">
  <title id="t-bm">원소 네 개짜리 집합을 4비트 정수로 표현하고 집합 연산을 비트 연산으로 바꾸는 과정</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(47,125,110,0.16); --c-soft-2: rgba(194,112,61,0.16);
        --c-dim: rgba(107,114,128,0.30); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(111,195,176,0.20); --c-soft-2: rgba(224,154,107,0.20);
          --c-dim: rgba(139,146,160,0.34); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .lg { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .cl { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.1; }
      .t { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.4; }
      .f { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.1; }
      .st { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .off { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.1; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nd { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; fill: var(--c-muted); }
      .m { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .mk { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; font-weight: 700; }
      .ed { stroke: var(--c-line); stroke-width: 1.3; fill: none; opacity: 0.5; }
      .edd { stroke: var(--c-dim); stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; }
      .kl { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)"/></marker>
  </defs>
  <rect class="bg" width="800" height="340"/>
  <text x="24" y="28" class="ttl">집합 하나가 정수 하나가 됩니다</text>
  <text x="24" y="48" class="sub">원소 a, b, c, d를 비트 0, 1, 2, 3에 대응 · 왼쪽부터 d c b a</text>
  <g transform="translate(24 62)"><text x="207" y="8" class="m" text-anchor="middle">d</text><text x="245" y="8" class="m" text-anchor="middle">c</text><text x="283" y="8" class="m" text-anchor="middle">b</text><text x="321" y="8" class="m" text-anchor="middle">a</text></g>
  <g transform="translate(24 76)">
    <text x="0" y="22" class="lg">집합 a, c</text>
    <rect x="190" y="6" width="34" height="26" rx="5" class="f"/><text x="207" y="23" class="n" text-anchor="middle">0</text>
    <rect x="228" y="6" width="34" height="26" rx="5" class="t"/><text x="245" y="23" class="n" text-anchor="middle">1</text>
    <rect x="266" y="6" width="34" height="26" rx="5" class="f"/><text x="283" y="23" class="n" text-anchor="middle">0</text>
    <rect x="304" y="6" width="34" height="26" rx="5" class="t"/><text x="321" y="23" class="n" text-anchor="middle">1</text>
    <text x="350" y="22" class="n">= 5</text>
    <text x="420" y="22" class="sub">a는 비트 0, c는 비트 2</text>
  </g>
  <g transform="translate(24 118)">
    <text x="0" y="22" class="lg">집합 b, c, d</text>
    <rect x="190" y="6" width="34" height="26" rx="5" class="t"/><text x="207" y="23" class="n" text-anchor="middle">1</text>
    <rect x="228" y="6" width="34" height="26" rx="5" class="t"/><text x="245" y="23" class="n" text-anchor="middle">1</text>
    <rect x="266" y="6" width="34" height="26" rx="5" class="t"/><text x="283" y="23" class="n" text-anchor="middle">1</text>
    <rect x="304" y="6" width="34" height="26" rx="5" class="f"/><text x="321" y="23" class="n" text-anchor="middle">0</text>
    <text x="350" y="22" class="n">= 14</text>
    <text x="420" y="22" class="sub"></text>
  </g>
  <g transform="translate(24 168)">
    <text x="0" y="22" class="lg">합집합 5 | 14</text>
    <rect x="190" y="6" width="34" height="26" rx="5" class="t"/><text x="207" y="23" class="n" text-anchor="middle">1</text>
    <rect x="228" y="6" width="34" height="26" rx="5" class="t"/><text x="245" y="23" class="n" text-anchor="middle">1</text>
    <rect x="266" y="6" width="34" height="26" rx="5" class="t"/><text x="283" y="23" class="n" text-anchor="middle">1</text>
    <rect x="304" y="6" width="34" height="26" rx="5" class="t"/><text x="321" y="23" class="n" text-anchor="middle">1</text>
    <text x="350" y="22" class="n">= 15</text>
    <text x="420" y="22" class="sub">둘 중 하나라도 있으면 1</text>
  </g>
  <g transform="translate(24 210)">
    <text x="0" y="22" class="lg">교집합 5 &amp; 14</text>
    <rect x="190" y="6" width="34" height="26" rx="5" class="f"/><text x="207" y="23" class="n" text-anchor="middle">0</text>
    <rect x="228" y="6" width="34" height="26" rx="5" class="t"/><text x="245" y="23" class="n" text-anchor="middle">1</text>
    <rect x="266" y="6" width="34" height="26" rx="5" class="f"/><text x="283" y="23" class="n" text-anchor="middle">0</text>
    <rect x="304" y="6" width="34" height="26" rx="5" class="f"/><text x="321" y="23" class="n" text-anchor="middle">0</text>
    <text x="350" y="22" class="n">= 4</text>
    <text x="420" y="22" class="sub">둘 다 있는 c만 남습니다</text>
  </g>
  <g transform="translate(24 252)">
    <text x="0" y="22" class="lg">a, c에 d 추가 5 | (1 &lt;&lt; 3)</text>
    <rect x="190" y="6" width="34" height="26" rx="5" class="t"/><text x="207" y="23" class="n" text-anchor="middle">1</text>
    <rect x="228" y="6" width="34" height="26" rx="5" class="t"/><text x="245" y="23" class="n" text-anchor="middle">1</text>
    <rect x="266" y="6" width="34" height="26" rx="5" class="f"/><text x="283" y="23" class="n" text-anchor="middle">0</text>
    <rect x="304" y="6" width="34" height="26" rx="5" class="t"/><text x="321" y="23" class="n" text-anchor="middle">1</text>
    <text x="350" y="22" class="n">= 13</text>
    <text x="420" y="22" class="sub">비트 3을 켭니다</text>
  </g>
  <text x="24" y="308" class="sub">원소 20개면 정수 하나가 2²⁰, 약 백만 가지 집합을 표현합니다.</text>
  <text x="24" y="326" class="sub">배열이나 Set을 만들지 않고 정수 하나로 방문 상태를 들고 다닐 수 있습니다.</text>
</svg>
