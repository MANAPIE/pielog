<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-para">
  <title id="t-para">파라메트릭 서치: 최적화 문제를 판정 문제로 바꾸기</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-ok: rgba(47,125,110,0.30); --c-ok-b: #2F7D6E;
        --c-no: rgba(194,112,61,0.26); --c-no-b: #C2703D;
        --c-cut: rgba(107,114,128,0.18); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-ok: rgba(111,195,176,0.32); --c-ok-b: #6FC3B0;
          --c-no: rgba(224,154,107,0.28); --c-no-b: #E09A6B;
          --c-cut: rgba(139,146,160,0.18); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .ok { fill: var(--c-ok); stroke: var(--c-ok-b); stroke-width: 1.4; }
      .no { fill: var(--c-no); stroke: var(--c-no-b); stroke-width: 1.4; }
      .cut { fill: var(--c-cut); stroke: var(--c-divider); stroke-width: 1; }
      .m { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; font-weight: 700; fill: var(--c-fg); }
      .mm { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .stp { font-family: 'Inter',system-ui,sans-serif; font-size: 10px; font-weight: 700; fill: var(--c-muted); }
      .lbl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; font-weight: 700; }
      .tick { stroke: var(--c-accent-3); stroke-width: 2; }
      .box { fill: var(--c-card); stroke: var(--c-accent-3); stroke-width: 1.6; }
    </style>
    <marker id="p-a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-3)"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="520"/>

  <text x="24" y="28" class="ttl">"가장 큰 값은?"을 "이 값이 가능한가?"로 바꿉니다</text>
  <text x="24" y="48" class="sub">답을 직접 찾지 않고, 후보를 하나씩 판정해 범위를 반으로 줄입니다</text>

  <!-- 후보 범위 전체 -->
  <g transform="translate(24 66)">
    <text x="36" y="14" class="hd" fill="var(--c-muted)">후보 값의 범위</text>
    <g transform="translate(36 24)">
      <rect width="360" height="34" rx="4" class="ok"/>
      <rect x="360" width="240" height="34" rx="4" class="no"/>
      <text x="8" y="52" class="mm">1</text>
      <text x="592" y="52" class="mm" text-anchor="end">100</text>
      <line x1="360" y1="-8" x2="360" y2="42" class="tick"/>
      <text x="360" y="-14" class="lbl" fill="var(--c-accent-3)" text-anchor="middle">답 · 경계</text>
      <text x="120" y="22" class="lbl" fill="var(--c-ok-b)" text-anchor="middle">가능</text>
      <text x="480" y="22" class="lbl" fill="var(--c-no-b)" text-anchor="middle">불가능</text>
    </g>
    <text x="646" y="46" class="sub">한 번 불가능해지면</text>
    <text x="646" y="64" class="sub">다시 가능해지지 않습니다</text>
  </g>

  <!-- 탐색 과정 -->
  <g transform="translate(24 164)">
    <text x="36" y="0" class="hd" fill="var(--c-muted)">탐색 과정: 매번 절반을 버립니다</text>

    <g transform="translate(36 16)">
      <text x="-12" y="22" class="stp" text-anchor="end">1</text>
      <rect width="300" height="30" rx="4" class="ok"/>
      <rect x="300" width="300" height="30" rx="4" class="cut"/>
      <line x1="300" y1="-6" x2="300" y2="36" class="tick"/>
      <text x="300" y="-12" class="m" text-anchor="middle">mid 50</text>
      <text x="614" y="20" class="mm">불가능 → 오른쪽 버림</text>
    </g>

    <g transform="translate(36 82)">
      <text x="-12" y="22" class="stp" text-anchor="end">2</text>
      <rect width="150" height="30" rx="4" class="cut"/>
      <rect x="150" width="150" height="30" rx="4" class="ok"/>
      <rect x="300" width="300" height="30" rx="4" class="cut"/>
      <line x1="150" y1="-6" x2="150" y2="36" class="tick"/>
      <text x="150" y="-12" class="m" text-anchor="middle">mid 25</text>
      <text x="614" y="20" class="mm">가능 → 왼쪽 버림</text>
    </g>

    <g transform="translate(36 148)">
      <text x="-12" y="22" class="stp" text-anchor="end">3</text>
      <rect width="150" height="30" rx="4" class="cut"/>
      <rect x="150" width="72" height="30" rx="4" class="cut"/>
      <rect x="222" width="78" height="30" rx="4" class="ok"/>
      <rect x="300" width="300" height="30" rx="4" class="cut"/>
      <line x1="222" y1="-6" x2="222" y2="36" class="tick"/>
      <text x="222" y="-12" class="m" text-anchor="middle">mid 37</text>
      <text x="614" y="20" class="mm">범위가 두 칸으로</text>
    </g>

  </g>

  <!-- 전제 조건 -->
  <g transform="translate(24 382)">
    <rect width="752" height="106" rx="8" class="box"/>
    <text x="20" y="28" class="lbl" fill="var(--c-accent-3)">전제: 판정 함수는 단조여야 합니다</text>
    <text x="20" y="52" class="sub">가능 · 가능 · 가능 · 불가능 · 불가능처럼 한 번만 뒤집혀야 이분탐색이 성립합니다.</text>
    <text x="20" y="72" class="sub">중간에 다시 가능해지는 구간이 있으면, 버린 절반에 답이 들어 있을 수 있습니다.</text>
    <text x="20" y="92" class="sub">"최대의 최소" 같은 문제를 만나면 먼저 이 단조성을 확인합니다. 없으면 다른 접근이 필요합니다.</text>
  </g>
</svg>
