    <text x="116" y="10" class="m" text-anchor="middle">0</text>
    <text x="160" y="10" class="m" text-anchor="middle">1</text>
    <text x="204" y="10" class="m" text-anchor="middle">2</text>
    <text x="248" y="10" class="m" text-anchor="middle">3</text>
    <text x="292" y="10" class="m" text-anchor="middle">4</text>
    <text x="336" y="10" class="m" text-anchor="middle">5</text>
    <text x="380" y="10" class="m" text-anchor="middle">6</text>
    <text x="424" y="10" class="m" text-anchor="middle">7</text>
    <text x="116" y="56" class="mk" text-anchor="middle" fill="var(--c-accent)">lo=0</text>
    <text x="454" y="56" class="mk" text-anchor="middle" fill="var(--c-accent-2)">hi=8</text>
    <text x="292" y="-4" class="mk" text-anchor="middle" fill="var(--c-accent-2)">mid=4</text>
    <text x="470" y="31" class="lg">mid=4가 참이라 hi=4. 4도 후보로 남깁니다</text>
  </g>
