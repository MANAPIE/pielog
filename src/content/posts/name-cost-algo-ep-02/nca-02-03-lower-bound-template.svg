  <rect class="bg" width="800" height="360"/>
  <text x="24" y="28" class="ttl">형태를 하나로 고정하면 경계에서 헷갈리지 않습니다</text>
  <text x="24" y="48" class="sub">조건을 만족하는 첫 위치 찾기 · lo는 후보에 포함, hi는 제외하는 반열린 구간</text>
  <g transform="translate(24 78)">
