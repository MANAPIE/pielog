<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-bt">
  <title id="t-bt">4-퀸 문제에서 백트래킹이 충돌하는 가지를 잘라내는 탐색 트리</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(47,125,110,0.16); --c-soft-2: rgba(194,112,61,0.16);
        --c-dim: rgba(107,114,128,0.30); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(111,195,176,0.20); --c-soft-2: rgba(224,154,107,0.20);
          --c-dim: rgba(139,146,160,0.34); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .lg { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .cl { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.1; }
      .t { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.4; }
      .f { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.1; }
      .st { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .off { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.1; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nd { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; fill: var(--c-muted); }
      .m { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .mk { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; font-weight: 700; }
      .ed { stroke: var(--c-line); stroke-width: 1.3; fill: none; opacity: 0.5; }
      .edd { stroke: var(--c-dim); stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; }
      .kl { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)"/></marker>
  </defs>
  <rect class="bg" width="800" height="380"/>
  <text x="24" y="28" class="ttl">가지치기는 답이 될 수 없는 가지를 통째로 버립니다</text>
  <text x="24" y="48" class="sub">4-퀸 문제 · 1행의 퀸을 0열에 둔 뒤 2행과 3행의 선택지</text>
  <text x="24" y="92" class="m">1행</text><text x="24" y="172" class="m">2행</text><text x="24" y="252" class="m">3행</text>
  <rect x="374" y="76" width="52" height="24" rx="6" class="t"/><text x="400" y="92" class="kl" text-anchor="middle">0열</text>
  <line x1="400" y1="100" x2="160" y2="156" class="edd"/>
  <rect x="134" y="156" width="52" height="24" rx="6" class="off"/><text x="160" y="172" class="kl" text-anchor="middle">0열</text>
  <text x="160" y="196" class="m" text-anchor="middle">✕ 같은 열</text>
  <line x1="400" y1="100" x2="320" y2="156" class="edd"/>
  <rect x="294" y="156" width="52" height="24" rx="6" class="off"/><text x="320" y="172" class="kl" text-anchor="middle">1열</text>
  <text x="320" y="196" class="m" text-anchor="middle">✕ 대각선</text>
  <line x1="400" y1="100" x2="480" y2="156" class="ed"/>
  <rect x="454" y="156" width="52" height="24" rx="6" class="t"/><text x="480" y="172" class="kl" text-anchor="middle">2열</text>
  <line x1="400" y1="100" x2="640" y2="156" class="ed"/>
  <rect x="614" y="156" width="52" height="24" rx="6" class="t"/><text x="640" y="172" class="kl" text-anchor="middle">3열</text>
  <line x1="480" y1="180" x2="420" y2="236" class="edd"/>
  <rect x="402" y="236" width="36" height="24" rx="6" class="off"/><text x="420" y="252" class="kl" text-anchor="middle">0열</text>
  <line x1="480" y1="180" x2="460" y2="236" class="edd"/>
  <rect x="442" y="236" width="36" height="24" rx="6" class="off"/><text x="460" y="252" class="kl" text-anchor="middle">1열</text>
  <line x1="480" y1="180" x2="500" y2="236" class="edd"/>
  <rect x="482" y="236" width="36" height="24" rx="6" class="off"/><text x="500" y="252" class="kl" text-anchor="middle">2열</text>
  <line x1="480" y1="180" x2="540" y2="236" class="edd"/>
  <rect x="522" y="236" width="36" height="24" rx="6" class="off"/><text x="540" y="252" class="kl" text-anchor="middle">3열</text>
  <text x="480" y="276" class="m" text-anchor="middle">넷 다 충돌 → 2열은 여기서 되돌아갑니다</text>
  <line x1="640" y1="180" x2="600" y2="236" class="edd"/>
  <rect x="582" y="236" width="36" height="24" rx="6" class="off"/><text x="600" y="252" class="kl" text-anchor="middle">0열</text>
  <line x1="640" y1="180" x2="640" y2="236" class="ed"/>
  <rect x="622" y="236" width="36" height="24" rx="6" class="t"/><text x="640" y="252" class="kl" text-anchor="middle">1열</text>
  <line x1="640" y1="180" x2="680" y2="236" class="edd"/>
  <rect x="662" y="236" width="36" height="24" rx="6" class="off"/><text x="680" y="252" class="kl" text-anchor="middle">2열</text>
  <line x1="640" y1="180" x2="720" y2="236" class="edd"/>
  <rect x="702" y="236" width="36" height="24" rx="6" class="off"/><text x="720" y="252" class="kl" text-anchor="middle">3열</text>
  <text x="660" y="276" class="m" text-anchor="middle">1열만 남아 4행으로 내려갑니다</text>
  <text x="160" y="222" class="m" text-anchor="middle">이 아래 3행·4행의 16가지는</text><text x="160" y="236" class="m" text-anchor="middle">아예 확인하지 않습니다</text>
  <text x="24" y="318" class="lg">선택하고, 내려가고, 충돌하면 되돌립니다. 되돌릴 때 그 아래의 모든 경우가 함께 사라집니다.</text>
  <text x="24" y="336" class="sub">완전탐색이면 4행 × 4열의 배치 256가지를 전부 확인합니다. 가지치기를 하면 충돌한 지점 아래로는 내려가지 않아</text>
  <text x="24" y="352" class="sub">확인하는 노드가 수십 개로 줄어듭니다. 최악의 경우 비용은 완전탐색과 같고, 가지치기는 실제로 걷는 길을 줄입니다.</text>
</svg>
