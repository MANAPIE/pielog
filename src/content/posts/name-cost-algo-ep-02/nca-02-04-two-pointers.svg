<svg viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-tp">
  <title id="t-tp">정렬된 배열에서 양 끝 포인터를 좁혀 합이 15인 두 원소를 찾는 과정</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #2F7D6E; --c-accent-2: #C2703D; --c-accent-3: #6366A8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(47,125,110,0.16); --c-soft-2: rgba(194,112,61,0.16);
        --c-dim: rgba(107,114,128,0.30); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #6FC3B0; --c-accent-2: #E09A6B; --c-accent-3: #9598D4;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(111,195,176,0.20); --c-soft-2: rgba(224,154,107,0.20);
          --c-dim: rgba(139,146,160,0.34); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .ttl { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11.5px; fill: var(--c-muted); }
      .hd { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pane { fill: none; stroke: var(--c-divider); stroke-width: 1.2; }
      .lg { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .cl { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.1; }
      .t { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.4; }
      .f { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.1; }
      .st { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 2; }
      .off { fill: var(--c-card); stroke: var(--c-dim); stroke-width: 1.1; }
      .n { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .nd { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 12px; fill: var(--c-muted); }
      .m { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; fill: var(--c-muted); }
      .mk { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 10px; font-weight: 700; }
      .ed { stroke: var(--c-line); stroke-width: 1.3; fill: none; opacity: 0.5; }
      .edd { stroke: var(--c-dim); stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; }
      .kl { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)"/></marker>
  </defs>
  <rect class="bg" width="800" height="330"/>
  <text x="24" y="28" class="ttl">양 끝에서 좁히면 O(N)입니다</text>
  <text x="24" y="48" class="sub">정렬된 배열 1 2 4 7 11 15에서 합이 15가 되는 두 원소 찾기</text>
  <g transform="translate(24 66)">
    <rect x="40" y="8" width="44" height="26" rx="5" class="t"/><text x="62" y="25" class="n" text-anchor="middle">1</text>
    <rect x="88" y="8" width="44" height="26" rx="5" class="cl"/><text x="110" y="25" class="n" text-anchor="middle">2</text>
    <rect x="136" y="8" width="44" height="26" rx="5" class="cl"/><text x="158" y="25" class="n" text-anchor="middle">4</text>
    <rect x="184" y="8" width="44" height="26" rx="5" class="cl"/><text x="206" y="25" class="n" text-anchor="middle">7</text>
    <rect x="232" y="8" width="44" height="26" rx="5" class="cl"/><text x="254" y="25" class="n" text-anchor="middle">11</text>
    <rect x="280" y="8" width="44" height="26" rx="5" class="st"/><text x="302" y="25" class="n" text-anchor="middle">15</text>
    <text x="62" y="52" class="mk" text-anchor="middle" fill="var(--c-accent)">L</text>
    <text x="302" y="52" class="mk" text-anchor="middle" fill="var(--c-accent-2)">R</text>
    <text x="340" y="25" class="lg">1 + 15 = 16, 목표보다 크니 R을 왼쪽으로</text>
  </g>
  <g transform="translate(24 128)">
    <rect x="40" y="8" width="44" height="26" rx="5" class="t"/><text x="62" y="25" class="n" text-anchor="middle">1</text>
    <rect x="88" y="8" width="44" height="26" rx="5" class="cl"/><text x="110" y="25" class="n" text-anchor="middle">2</text>
    <rect x="136" y="8" width="44" height="26" rx="5" class="cl"/><text x="158" y="25" class="n" text-anchor="middle">4</text>
    <rect x="184" y="8" width="44" height="26" rx="5" class="cl"/><text x="206" y="25" class="n" text-anchor="middle">7</text>
    <rect x="232" y="8" width="44" height="26" rx="5" class="st"/><text x="254" y="25" class="n" text-anchor="middle">11</text>
    <rect x="280" y="8" width="44" height="26" rx="5" class="cl"/><text x="302" y="25" class="n" text-anchor="middle">15</text>
    <text x="62" y="52" class="mk" text-anchor="middle" fill="var(--c-accent)">L</text>
    <text x="254" y="52" class="mk" text-anchor="middle" fill="var(--c-accent-2)">R</text>
    <text x="340" y="25" class="lg">1 + 11 = 12, 목표보다 작으니 L을 오른쪽으로</text>
  </g>
  <g transform="translate(24 190)">
    <rect x="40" y="8" width="44" height="26" rx="5" class="cl"/><text x="62" y="25" class="n" text-anchor="middle">1</text>
    <rect x="88" y="8" width="44" height="26" rx="5" class="t"/><text x="110" y="25" class="n" text-anchor="middle">2</text>
    <rect x="136" y="8" width="44" height="26" rx="5" class="cl"/><text x="158" y="25" class="n" text-anchor="middle">4</text>
    <rect x="184" y="8" width="44" height="26" rx="5" class="cl"/><text x="206" y="25" class="n" text-anchor="middle">7</text>
    <rect x="232" y="8" width="44" height="26" rx="5" class="st"/><text x="254" y="25" class="n" text-anchor="middle">11</text>
    <rect x="280" y="8" width="44" height="26" rx="5" class="cl"/><text x="302" y="25" class="n" text-anchor="middle">15</text>
    <text x="110" y="52" class="mk" text-anchor="middle" fill="var(--c-accent)">L</text>
    <text x="254" y="52" class="mk" text-anchor="middle" fill="var(--c-accent-2)">R</text>
    <text x="340" y="25" class="lg">2 + 11 = 13, 아직 작으니 L을 오른쪽으로</text>
  </g>
  <g transform="translate(24 252)">
    <rect x="40" y="8" width="44" height="26" rx="5" class="cl"/><text x="62" y="25" class="n" text-anchor="middle">1</text>
    <rect x="88" y="8" width="44" height="26" rx="5" class="cl"/><text x="110" y="25" class="n" text-anchor="middle">2</text>
    <rect x="136" y="8" width="44" height="26" rx="5" class="st"/><text x="158" y="25" class="n" text-anchor="middle">4</text>
    <rect x="184" y="8" width="44" height="26" rx="5" class="cl"/><text x="206" y="25" class="n" text-anchor="middle">7</text>
    <rect x="232" y="8" width="44" height="26" rx="5" class="st"/><text x="254" y="25" class="n" text-anchor="middle">11</text>
    <rect x="280" y="8" width="44" height="26" rx="5" class="cl"/><text x="302" y="25" class="n" text-anchor="middle">15</text>
    <text x="158" y="52" class="mk" text-anchor="middle" fill="var(--c-accent)">L</text>
    <text x="254" y="52" class="mk" text-anchor="middle" fill="var(--c-accent-2)">R</text>
    <text x="340" y="25" class="lg">4 + 11 = 15, 찾았습니다</text>
  </g>
  <text x="24" y="320" class="sub">각 포인터는 한 방향으로만 움직이므로 두 포인터의 이동 횟수를 합쳐도 N을 넘지 않습니다. 모든 쌍을 보는 O(N²)이 O(N)이 됩니다.</text>
</svg>
