<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
  <title id="title">MRR Bridge — 한 달의 매출 변동</title>
  <desc id="desc">전월 MRR에서 신규, 확장, 부활, 이탈, 축소를 거쳐 이번 달 MRR이 되는 폭포 차트.</desc>
  <style>
    :root {
      --c-bg: #fafaf7; --c-fg: #1a1a1a; --c-muted: #6b6b6b; --c-faint: #b3b3b0;
      --c-grid: #ede9df; --c-axis: #b3b3b0;
      --c-anchor: #2d4a3e;
      --c-up: #4a7e5e;
      --c-down: #c97f4a;
      --c-connector: #b3b3b0;
      --c-final-bg: #e3ede7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #0f0f0e; --c-fg: #ededea; --c-muted: #999996; --c-faint: #4a4a47;
        --c-grid: #2a2823; --c-axis: #4a4a47;
        --c-anchor: #7fb09a;
        --c-up: #9bc4ad;
        --c-down: #e09a6a;
        --c-connector: #4a4a47;
        --c-final-bg: #1f2a26;
      }
    }
    .bg { fill: var(--c-bg); }
    .title { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: var(--c-fg); }
    .sub { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: var(--c-muted); }
    .axis-line { stroke: var(--c-axis); stroke-width: 1; }
    .axis-label { font: 400 10px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-muted); }
    .grid-line { stroke: var(--c-grid); stroke-width: 0.75; }
    .bar-label { font: 600 11px ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; fill: var(--c-fg); }
    .bar-num { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-fg); }
    .bar-num-white { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; fill: white; }
    .delta-up { font: 600 11px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-up); }
    .delta-down { font: 600 11px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-down); }
    .connector { stroke: var(--c-connector); stroke-width: 1; stroke-dasharray: 3 2; fill: none; }
    .anno { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: var(--c-muted); }
  </style>
  <rect class="bg" width="600" height="500"/>

  <text class="title" x="40" y="36">한 달 MRR의 다섯 가지 움직임</text>
  <text class="sub" x="40" y="54">전월 1억 8,000만에서 시작해 다섯 가지 변동을 거쳐</text>
  <text class="sub" x="40" y="70">1억 9,000만이 된 과정.</text>

  <!-- 차트 영역 · 플롯 폭 506 · 막대 너비 62, 간격 12, pitch 74 -->
  <!-- 스케일: 1억=120px, 0.1억=12px (원본과 동일) -->
  <g transform="translate(54, 116)">
    <!-- 격자 -->
    <line class="grid-line" x1="0" y1="0" x2="506" y2="0"/>
    <line class="grid-line" x1="0" y1="60" x2="506" y2="60"/>
    <line class="grid-line" x1="0" y1="120" x2="506" y2="120"/>
    <line class="grid-line" x1="0" y1="180" x2="506" y2="180"/>
    <line class="grid-line" x1="0" y1="240" x2="506" y2="240"/>

    <text class="axis-label" x="-8" y="3" text-anchor="end">2.0억</text>
    <text class="axis-label" x="-8" y="63" text-anchor="end">1.95</text>
    <text class="axis-label" x="-8" y="123" text-anchor="end">1.9</text>
    <text class="axis-label" x="-8" y="183" text-anchor="end">1.85</text>
    <text class="axis-label" x="-8" y="243" text-anchor="end">1.8억</text>

    <!-- X축 -->
    <line class="axis-line" x1="0" y1="240" x2="506" y2="240"/>

    <!-- 1. 시작 MRR 1.8억 · x=0 -->
    <rect fill="var(--c-anchor)" x="0" y="24" width="62" height="216"/>
    <text class="bar-num-white" x="31" y="140" text-anchor="middle">1.8억</text>
    <text class="bar-label" x="31" y="262" text-anchor="middle">시작 MRR</text>
    <text class="anno" x="31" y="276" text-anchor="middle">전월말</text>

    <line class="connector" x1="62" y1="24" x2="74" y2="24"/>

    <!-- 2. New +12M (=14.4px) · x=74 · top 24-14.4≈10 -->
    <rect fill="var(--c-up)" x="74" y="10" width="62" height="14"/>
    <text class="delta-up" x="105" y="6" text-anchor="middle">+1,200만</text>
    <text class="bar-label" x="105" y="262" text-anchor="middle">New</text>
    <text class="anno" x="105" y="276" text-anchor="middle">신규 가입</text>

    <line class="connector" x1="136" y1="10" x2="148" y2="10"/>

    <!-- 3. Expansion +6M (=7.2px) · x=148 · top 10-7.2≈3 -->
    <rect fill="var(--c-up)" x="148" y="3" width="62" height="7"/>
    <text class="delta-up" x="179" y="-2" text-anchor="middle">+600만</text>
    <text class="bar-label" x="179" y="262" text-anchor="middle">Expansion</text>
    <text class="anno" x="179" y="276" text-anchor="middle">기존 확장</text>

    <line class="connector" x1="210" y1="3" x2="222" y2="3"/>

    <!-- 4. Reactivation +2M (=2.4px) · x=222 · top 3-2.4≈1 -->
    <rect fill="var(--c-up)" x="222" y="1" width="62" height="2"/>
    <text class="delta-up" x="253" y="-2" text-anchor="middle">+200만</text>
    <text class="bar-label" x="253" y="262" text-anchor="middle">Reactivation</text>
    <text class="anno" x="253" y="276" text-anchor="middle">부활</text>

    <line class="connector" x1="284" y1="1" x2="296" y2="1"/>

    <!-- 5. Churn -8M (=9.6px) · x=296 · top 1, height 10 -->
    <rect fill="var(--c-down)" x="296" y="1" width="62" height="10"/>
    <text class="delta-down" x="327" y="-2" text-anchor="middle">−800만</text>
    <text class="bar-label" x="327" y="262" text-anchor="middle">Churn</text>
    <text class="anno" x="327" y="276" text-anchor="middle">이탈</text>

    <line class="connector" x1="358" y1="11" x2="370" y2="11"/>

    <!-- 6. Contraction -2M (=2.4px) · x=370 · top 11, height 2 -->
    <rect fill="var(--c-down)" x="370" y="11" width="62" height="2"/>
    <text class="delta-down" x="401" y="6" text-anchor="middle">−200만</text>
    <text class="bar-label" x="401" y="262" text-anchor="middle">Contraction</text>
    <text class="anno" x="401" y="276" text-anchor="middle">축소</text>

    <line class="connector" x1="432" y1="13" x2="444" y2="13"/>

    <!-- 7. 종료 MRR 1.9억 · x=444 · top 12, height 228 -->
    <rect fill="var(--c-anchor)" x="444" y="12" width="62" height="228"/>
    <text class="bar-num-white" x="475" y="140" text-anchor="middle">1.9억</text>
    <text class="bar-label" x="475" y="262" text-anchor="middle">종료 MRR</text>
    <text class="anno" x="475" y="276" text-anchor="middle">이번달말</text>
  </g>

  <!-- 결론 박스 -->
  <g transform="translate(40, 416)">
    <rect fill="var(--c-final-bg)" stroke="var(--c-anchor)" stroke-width="1" width="520" height="68" rx="2"/>
    <text class="bar-label" x="16" y="22" style="font-size: 12px;">Net New MRR = (1,200 + 600 + 200) − (800 + 200) = <tspan style="font-weight: 700; fill: var(--c-anchor); font-family: ui-monospace, monospace;">+1,000만원</tspan></text>
    <text class="anno" x="16" y="42">Quick Ratio = (1,200 + 600) ÷ (800 + 200) = 1.8 · MoM Growth = 1,000 ÷ 18,000 = 5.6%</text>
    <text class="anno" x="16" y="60">Gross Revenue Churn 5.6%, Expansion 3.3% — Net Revenue Churn 2.3%, NRR 100% 부근 안정.</text>
  </g>
</svg>
