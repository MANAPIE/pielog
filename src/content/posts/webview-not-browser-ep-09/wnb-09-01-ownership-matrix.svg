  <text x="34" y="1078" class="sub">배포와 수명</text>
  <text x="34" y="1096" class="tag">(ep.08)</text>
  <rect x="156" y="1048" width="152" height="84" rx="6" class="cell"/>
  <rect x="156" y="1058" width="3" height="64" fill="var(--c-accent)"/>
