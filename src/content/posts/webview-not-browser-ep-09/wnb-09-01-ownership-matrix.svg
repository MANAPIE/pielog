  <path d="M 700 320 L 700 530 L 544 530 L 544 542" class="link" stroke="var(--c-accent-2)"/>
  <polygon points="544,548 539,539 549,539" fill="var(--c-accent-2)"/>

  <!-- ============ 배치 매트릭스 ============ -->

  <!-- 열 머리 -->
  <rect x="156" y="548" width="152" height="32" rx="6" fill="var(--c-soft)"/>
  <text x="232" y="569" class="head" fill="var(--c-accent)" text-anchor="middle">웹 담당</text>
  <rect x="312" y="548" width="152" height="32" rx="6" fill="var(--c-soft-3)"/>
