  <text x="320" y="129" class="q-txt" text-anchor="middle">재현되는가</text>
  <line x1="202" y1="114" x2="160" y2="114" class="flow"/>
  <polygon points="154,114 163,109 163,119" fill="var(--c-line)"/>
