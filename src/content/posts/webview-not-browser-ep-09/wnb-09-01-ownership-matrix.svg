  <rect x="530" y="366" width="4" height="36" rx="2" fill="var(--c-joint)"/>
  <text x="548" y="389" class="res-txt">공동 담당</text>
  <line x1="320" y1="418" x2="320" y2="432" class="flow"/>
  <polygon points="320,438 315,429 325,429" fill="var(--c-line)"/>
  <text x="332" y="430" class="yn">아니오</text>

  <!-- 양쪽 다 못 고침 -->
  <rect x="202" y="440" width="236" height="56" rx="8" class="res"/>
  <rect x="202" y="440" width="236" height="56" rx="8" fill="url(#hatch09)"/>
  <rect x="202" y="448" width="4" height="40" rx="2" fill="var(--c-muted)"/>
  <text x="220" y="464" class="res-txt">양쪽 다 못 고침</text>
  <text x="220" y="483" class="tag">엔진 구현 또는 엔진 버전 고정</text>

  <!-- 결과 상자 → 매트릭스 열 머리 연결선 -->
  <path d="M 506 230 L 506 510 L 232 510 L 232 542" class="link" stroke="var(--c-accent)"/>
  <polygon points="232,548 227,539 237,539" fill="var(--c-accent)"/>
  <path d="M 536 410 L 536 520 L 388 520 L 388 542" class="link" stroke="var(--c-joint)"/>
