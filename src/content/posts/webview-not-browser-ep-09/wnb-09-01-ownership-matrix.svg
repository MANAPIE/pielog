  <polygon points="320,170 438,204 320,238 202,204" class="dia"/>
  <text x="320" y="200" class="q-txt" text-anchor="middle">웹 코드를 바꾸면</text>
  <text x="320" y="219" class="q-txt" text-anchor="middle">동작이 바뀌는가</text>
  <line x1="438" y1="204" x2="494" y2="204" class="flow"/>
  <polygon points="500,204 491,199 491,209" fill="var(--c-line)"/>
  <text x="466" y="195" class="yn" text-anchor="middle">예</text>
  <rect x="500" y="178" width="160" height="52" rx="8" class="res"/>
  <rect x="500" y="186" width="4" height="36" rx="2" fill="var(--c-accent)"/>
  <text x="518" y="209" class="res-txt">웹 담당</text>
  <line x1="320" y1="238" x2="320" y2="252" class="flow"/>
  <polygon points="320,258 315,249 325,249" fill="var(--c-line)"/>
  <text x="332" y="250" class="yn">아니오</text>

