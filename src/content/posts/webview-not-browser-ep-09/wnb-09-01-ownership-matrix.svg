  <rect x="560" y="276" width="4" height="36" rx="2" fill="var(--c-accent-2)"/>
  <text x="578" y="299" class="res-txt">앱 담당</text>
  <line x1="320" y1="328" x2="320" y2="342" class="flow"/>
  <polygon points="320,348 315,339 325,339" fill="var(--c-line)"/>
  <text x="332" y="340" class="yn">아니오</text>

  <!-- 분기 4 -->
  <polygon points="320,350 438,384 320,418 202,384" class="dia"/>
  <text x="320" y="380" class="q-txt" text-anchor="middle">양쪽을 함께</text>
  <text x="320" y="399" class="q-txt" text-anchor="middle">바꿔야 하는가</text>
  <line x1="438" y1="384" x2="524" y2="384" class="flow"/>
  <polygon points="530,384 521,379 521,389" fill="var(--c-line)"/>
  <text x="481" y="375" class="yn" text-anchor="middle">예</text>
