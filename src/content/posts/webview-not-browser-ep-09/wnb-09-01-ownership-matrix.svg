  <rect x="624" y="680" width="152" height="84" rx="6" fill="url(#hatch09)"/>
  <rect x="624" y="690" width="3" height="64" fill="var(--c-muted)"/>
  <text x="636" y="702" class="item">iOS의 window.print</text>
  <text x="636" y="716" class="item">전달 경로 -</text>
  <text x="636" y="730" class="item">공개 API 미확인</text>

