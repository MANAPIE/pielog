      .bg { fill: var(--c-bg); }
      .start { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.5; }
      .dia { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.5; }
      .res { fill: var(--c-card); stroke: var(--c-divider); stroke-width: 1.2; }
      .cell { fill: var(--c-card); stroke: var(--c-divider); stroke-width: 1; }
      .rowh { fill: none; stroke: var(--c-divider); stroke-width: 1; }
      .flow { stroke: var(--c-line); stroke-width: 1.6; fill: none; }
      .link { fill: none; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .q-txt { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 13px; font-weight: 700; fill: var(--c-fg); }
      .res-txt { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 13px; font-weight: 700; fill: var(--c-fg); }
      .sub { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .head { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; font-weight: 700; }
      .tag { font-family: 'Inter','Pretendard',system-ui,sans-serif; font-size: 11px; fill: var(--c-muted); }
      .item { font-family: 'Inter','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-fg); }
      .yn { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; font-weight: 700; fill: var(--c-muted); }
      .cap { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; fill: var(--c-muted); }
    </style>
    <pattern id="hatch09" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="var(--c-muted)" stroke-width="1" stroke-opacity="0.38"/>
    </pattern>
  </defs>

  <rect class="bg" width="800" height="1210"/>

