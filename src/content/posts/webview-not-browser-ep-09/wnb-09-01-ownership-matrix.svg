  <text x="320" y="309" class="q-txt" text-anchor="middle">동작이 바뀌는가</text>
  <line x1="438" y1="294" x2="554" y2="294" class="flow"/>
  <polygon points="560,294 551,289 551,299" fill="var(--c-line)"/>
  <text x="496" y="285" class="yn" text-anchor="middle">예</text>
