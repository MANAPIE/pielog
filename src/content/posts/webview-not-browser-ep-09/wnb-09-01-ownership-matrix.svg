  <rect x="312" y="588" width="152" height="84" rx="6" class="cell"/>
  <rect x="312" y="598" width="3" height="64" fill="var(--c-joint)"/>
  <text x="324" y="610" class="item">기기별 엔진 버전</text>
  <text x="324" y="624" class="item">특정</text>
  <rect x="468" y="588" width="152" height="84" rx="6" class="cell"/>
  <rect x="468" y="598" width="3" height="64" fill="var(--c-accent-2)"/>
  <text x="480" y="610" class="item">isInspectable,</text>
  <text x="480" y="624" class="item">setWebContents</text>
  <text x="480" y="638" class="item">DebuggingEnabled</text>
