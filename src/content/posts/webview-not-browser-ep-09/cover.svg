<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="웹뷰는 브라우저가 아니다 ep.09 cover">
  <style>
  :root {
    --c-bg: #EEF5F6;
    --c-fg: #10202A;
    --c-muted: #5E7480;
    --c-accent: #0E7490; --c-accent-2: #22B8CF; --c-accent-3: #C98A3B;
    --c-num: rgba(14, 116, 144, 0.14);
    --c-dot: rgba(14, 116, 144, 0.10);
    --c-line: rgba(14, 116, 144, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-bg: #0A161A;
      --c-fg: #DCE8EA;
      --c-muted: #8AA0A8;
      --c-accent: #4DD4EC; --c-accent-2: #0E7490; --c-accent-3: #E0A860;
      --c-num: rgba(77, 212, 236, 0.15);
      --c-dot: rgba(77, 212, 236, 0.10);
      --c-line: rgba(77, 212, 236, 0.20);
    }
  }
  .cover-bg { fill: var(--c-bg); }
  .ep-number {
    font: 900 240px ui-monospace, "SF Mono", Menlo, monospace;
    fill: var(--c-num); letter-spacing: -0.04em;
  }
</style>
  <defs>
    <pattern id="dots-wnb09" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="var(--c-dot)"/>
    </pattern>
    <radialGradient id="halo-wnb09a" cx="0.90" cy="0.20" r="0.58">
      <stop offset="0" stop-color="var(--c-accent)" stop-opacity="0.24"/>
      <stop offset="1" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-wnb09b" cx="0.16" cy="0.90" r="0.56">
      <stop offset="0" stop-color="var(--c-accent-3)" stop-opacity="0.30"/>
      <stop offset="1" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="cover-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots-wnb09)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb09a)"/>
  <rect width="1200" height="630" fill="url(#halo-wnb09b)"/>

  <!-- 배경 무채 stroke 도형 (오프캔버스) -->
  <rect x="-120" y="380" width="520" height="520" rx="46" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(-14 140 640)"/>
  <circle cx="1180" cy="60" r="292" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>
  <circle cx="1180" cy="60" r="204" fill="none" stroke="var(--c-line)" stroke-width="1.5"/>

  <!-- 하나로 들어와 넷으로 갈라지는 분류 레일 -->
  <g transform="translate(560 330) rotate(-5)">

    <!-- 들어오는 레일: 아직 구분되지 않은 제보들 -->
    <rect x="-624" y="-54" width="352" height="56" rx="28" fill="none" stroke="var(--c-line)" stroke-width="1.5" transform="rotate(-4 -448 -26)"/>
    <rect x="-640" y="-28" width="380" height="56" rx="28" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
    <rect x="-604" y="-11" width="44" height="22" rx="11" fill="var(--c-accent)" fill-opacity="0.55"/>
    <rect x="-548" y="-11" width="36" height="22" rx="11" fill="none" stroke="var(--c-accent)" stroke-width="1.6" stroke-opacity="0.75"/>
    <rect x="-500" y="-11" width="50" height="22" rx="11" fill="var(--c-accent)" fill-opacity="0.32"/>
    <rect x="-438" y="-11" width="40" height="22" rx="11" fill="none" stroke="var(--c-accent-2)" stroke-width="1.6"/>

    <!-- 갈라지는 네 갈래 -->
    <line x1="-112" y1="-22" x2="240" y2="-190" stroke="var(--c-accent)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-108" y1="-8" x2="270" y2="-62" stroke="var(--c-accent-2)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-108" y1="8" x2="270" y2="62" stroke="var(--c-accent-3)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-112" y1="22" x2="240" y2="190" stroke="var(--c-accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 14" stroke-opacity="0.5"/>

    <!-- 판정 지점: 회전된 사각형 + 동심 포커스 링 -->
    <circle cx="-190" cy="0" r="94" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="4 9"/>
    <circle cx="-190" cy="0" r="66" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5"/>
    <rect x="-238" y="-48" width="96" height="96" rx="10" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="3.6" transform="rotate(45 -190 0)"/>
    <circle cx="-190" cy="0" r="30" fill="none" stroke="var(--c-accent)" stroke-width="1.6" stroke-opacity="0.55"/>
    <circle cx="-190" cy="0" r="11" fill="var(--c-accent-2)"/>

    <!-- 담당이 갈리는 경계축 -->
    <line x1="214" y1="-268" x2="214" y2="268" stroke="var(--c-accent)" stroke-width="1.6" stroke-dasharray="7 8" stroke-opacity="0.45"/>

    <!-- 담당이 정해진 세 자리 -->
    <rect x="240" y="-236" width="200" height="92" rx="16" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.4"/>
    <rect x="266" y="-206" width="88" height="11" rx="5.5" fill="var(--c-accent)" fill-opacity="0.55"/>
    <rect x="266" y="-186" width="112" height="11" rx="5.5" fill="var(--c-line)" fill-opacity="0.35"/>
    <rect x="266" y="-166" width="76" height="11" rx="5.5" fill="var(--c-accent)" fill-opacity="0.24"/>

    <rect x="270" y="-108" width="200" height="92" rx="16" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="2.8"/>
    <path d="M 306 -62 l 14 14 l 28 -32" fill="none" stroke="var(--c-accent-2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="270" y="16" width="200" height="92" rx="16" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2.4"/>
    <circle cx="312" cy="62" r="11" fill="var(--c-accent-3)" fill-opacity="0.7"/>
    <circle cx="348" cy="62" r="8" fill="none" stroke="var(--c-accent-3)" stroke-width="1.8"/>
    <circle cx="378" cy="62" r="6" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6" stroke-opacity="0.6"/>

    <!-- 아무도 가져가지 못하는 자리 -->
    <rect x="240" y="144" width="200" height="92" rx="16" fill="none" stroke="var(--c-accent)" stroke-width="2.4" stroke-dasharray="12 10"/>
    <circle cx="340" cy="190" r="26" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="3 7"/>
  </g>

  <!-- 흩어진 디테일 -->
  <rect x="126" y="96" width="82" height="82" fill="none" stroke="var(--c-accent-2)" stroke-width="2.5" transform="rotate(13 167 137)"/>
  <line x1="262" y1="192" x2="248" y2="306" stroke="var(--c-accent)" stroke-width="2" stroke-dasharray="6 9" stroke-opacity="0.5"/>
  <g transform="translate(258 508)" opacity="0.6">
    <circle r="40" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5"/>
    <circle r="22" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
  <circle cx="1058" cy="104" r="9" fill="var(--c-accent)"/>
  <circle cx="1088" cy="126" r="6" fill="none" stroke="var(--c-accent-2)" stroke-width="1.8"/>
  <circle cx="1040" cy="136" r="5" fill="var(--c-accent-3)"/>
  <polygon points="146,556 196,556 171,512" fill="none" stroke="var(--c-accent-3)" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="72" y="468" width="54" height="13" rx="5" fill="var(--c-accent-2)" fill-opacity="0.6"/>
  <rect x="100" y="490" width="32" height="8" rx="4" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6"/>

  <text class="ep-number" x="1164" y="594" text-anchor="end">09</text>
</svg>
