<svg width="100%" viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>시맨틱 HTML vs ARIA 결정 흐름도</title>
  <desc>UI 요소 구현 시 네이티브 HTML 요소가 있는지 먼저 확인하고, 없을 때만 ARIA로 보완하는 우선순위 흐름도</desc>
  <style>
    .title {
      font: 600 16px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #2C2C2A;
    }

    .start {
      font: 600 14px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #FFFFFF;
    }

    .q-h {
      font: 600 13px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #FFFFFF;
    }

    .ans {
      font: 600 11px/1 'JetBrains Mono', monospace;
    }

    .out-h {
      font: 600 13px/1.4 'Pretendard Variable', system-ui, sans-serif;
    }

    .out-d {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
    }

    .mono {
      font: 400 11px/1.4 'JetBrains Mono', monospace;
    }

    .caption {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #6F6E66;
    }

    .arr {
      stroke: #6F6E66;
      stroke-width: 1.5;
      fill: none;
    }

    .blue-head {
      fill: #185FA5;
    }

    .purple-head {
      fill: #534AB7;
    }

    .teal-card {
      fill: #E1F5EE;
      stroke: #0F664A;
    }

    .teal-head {
      fill: #0F664A;
    }

    .teal-t {
      fill: #085041;
    }

    .amber-card {
      fill: #FAEEDA;
      stroke: #8F590F;
    }

    .amber-head {
      fill: #8F590F;
    }

    .amber-t {
      fill: #633806;
    }

    .ans-yes {
      fill: #0F664A;
    }

    .ans-no {
      fill: #993C1D;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #E8E6DE;
      }

      .caption {
        fill: #B4B2A9;
      }

      .arr {
        stroke: #B4B2A9;
      }

      .blue-head {
        fill: #185FA5;
      }

      .purple-head {
        fill: #534AB7;
      }

      .teal-card {
        fill: #04342C;
        stroke: #0F6E56;
      }

      .teal-head {
        fill: #0F6E56;
      }

      .teal-t {
        fill: #9FE1CB;
      }

      .amber-card {
        fill: #412402;
        stroke: #854F0B;
      }

      .amber-head {
        fill: #854F0B;
      }

      .amber-t {
        fill: #FAC775;
      }

      .ans-yes {
        fill: #5DCAA5;
      }

      .ans-no {
        fill: #F09595;
      }
    }
  </style>
  <defs>
    <marker id="arr-ep04-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
  </defs>

  <text class="title" x="40" y="32">시맨틱 우선 결정 흐름도</text>
  <text class="caption" x="40" y="50">네이티브 HTML이 있으면 그것을 쓴다. ARIA는 마지막 수단</text>

  <!-- 시작 -->
  <rect class="blue-head" x="320" y="80" width="160" height="44" rx="22" />
  <text class="start" x="400" y="108" text-anchor="middle">구현할 UI 요소</text>
  <line x1="400" y1="124" x2="400" y2="150" class="arr" marker-end="url(#arr-ep04-1)" />

  <!-- Q1 -->
  <rect class="purple-head" x="240" y="158" width="320" height="44" rx="8" />
  <text class="q-h" x="400" y="185" text-anchor="middle">네이티브 HTML 요소가 있는가?</text>

  <!-- YES → left -->
  <line x1="320" y1="202" x2="200" y2="240" class="arr" marker-end="url(#arr-ep04-1)" />
  <text class="ans ans-yes" x="240" y="218">YES ✓</text>

  <!-- NO → right -->
  <line x1="480" y1="202" x2="600" y2="240" class="arr" marker-end="url(#arr-ep04-1)" />
  <text class="ans ans-no" x="552" y="218">NO</text>

  <!-- 왼쪽: 네이티브 사용 -->
  <g>
    <rect class="teal-card" x="40" y="250" width="320" height="175" rx="12" stroke-width="0.5" />
    <rect class="teal-head" x="40" y="250" width="320" height="32" rx="12" />
    <rect class="teal-head" x="40" y="270" width="320" height="12" />
    <text class="q-h" x="58" y="272">네이티브 사용: 비용 최저</text>

    <text class="out-h teal-t" x="60" y="306">예시 매핑</text>
    <text class="mono teal-t" x="60" y="328">button / a / input / select</text>
    <text class="mono teal-t" x="60" y="346">nav / main / header / footer</text>
    <text class="mono teal-t" x="60" y="364">table / dialog / details</text>
    <text class="out-d teal-t" x="60" y="394">키보드·포커스·SR 모두 자동</text>
    <text class="out-d teal-t" x="60" y="410">스타일은 CSS로, 시맨틱은 유지</text>
  </g>

  <!-- 오른쪽: ARIA -->
  <g>
    <rect class="amber-card" x="440" y="250" width="320" height="175" rx="12" stroke-width="0.5" />
    <rect class="amber-head" x="440" y="250" width="320" height="32" rx="12" />
    <rect class="amber-head" x="440" y="270" width="320" height="12" />
    <text class="q-h" x="458" y="272">ARIA 보완: 비용 높음</text>

    <text class="out-h amber-t" x="460" y="306">"의미"만 부여, "동작"은 JS로</text>
    <text class="mono amber-t" x="460" y="328">role="button"</text>
    <text class="mono amber-t" x="460" y="346">tabindex="0"</text>
    <text class="mono amber-t" x="460" y="364">keydown 핸들러</text>
    <text class="out-d amber-t" x="460" y="394">키보드 동작 코드로 직접 구현</text>
    <text class="out-d amber-t" x="460" y="410">매 요소마다 검증 필요</text>
  </g>
</svg>