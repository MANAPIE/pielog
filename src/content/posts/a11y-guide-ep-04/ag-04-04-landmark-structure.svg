<svg width="100%" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>페이지 랜드마크 구조와 스크린리더 점프 탐색</title>
  <desc>일반 쇼핑몰 페이지의 header banner, nav navigation, main, complementary, footer contentinfo 다섯 랜드마크 구조와 스크린리더 로터의 점프 탐색
  </desc>
  <style>
    .title {
      font: 600 16px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #2C2C2A;
    }

    .col-h {
      font: 600 13px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #5F5E5A;
    }

    .land-h {
      font: 600 12px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #FFFFFF;
    }

    .land-d {
      font: 500 11px/1 'JetBrains Mono', monospace;
      fill: #FFFFFF;
      opacity: 0.9;
    }

    .land-c {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #FFFFFF;
      opacity: 0.9;
    }

    .rotor-h {
      font: 600 12px/1 'JetBrains Mono', monospace;
      fill: #FFFFFF;
    }

    .rotor-i {
      font: 400 12px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #E8E6DE;
    }

    .rotor-foot {
      font: 400 10px/1 'Pretendard Variable', system-ui, sans-serif;
      fill: #B4B2A9;
    }

    .caption {
      font: 400 11px/1.4 'Pretendard Variable', system-ui, sans-serif;
      fill: #6F6E66;
    }

    .blue {
      fill: #185FA5;
    }

    .blue-dark {
      fill: #0C447C;
    }

    .teal {
      fill: #0F664A;
    }

    .teal-dark {
      fill: #085041;
    }

    .amber {
      fill: #8F590F;
    }

    .purple {
      fill: #534AB7;
    }

    .rotor-bg {
      fill: #1F1F1D;
      stroke: #444441;
    }

    .rotor-divider {
      stroke: #444441;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #E8E6DE;
      }

      .col-h {
        fill: #B4B2A9;
      }

      .caption {
        fill: #B4B2A9;
      }

      .blue {
        fill: #185FA5;
      }

      .blue-dark {
        fill: #0C447C;
      }

      .teal {
        fill: #0F6E56;
      }

      .teal-dark {
        fill: #04342C;
      }

      .amber {
        fill: #854F0B;
      }

      .purple {
        fill: #534AB7;
      }

      .rotor-bg {
        fill: #131311;
        stroke: #444441;
      }

      .rotor-divider {
        stroke: #444441;
      }
    }
  </style>

  <text class="title" x="40" y="32">페이지 랜드마크 구조</text>
  <text class="caption" x="40" y="50">스크린리더 사용자는 랜드마크 단위로 점프해 빠르게 탐색합니다</text>

  <!-- 왼쪽: 페이지 구조 -->
  <text class="col-h" x="40" y="80">페이지 구조</text>

  <!-- header (banner) -->
  <g transform="translate(40, 90)">
    <rect class="blue" x="0" y="0" width="500" height="46" rx="6" />
    <text class="land-h" x="14" y="20">&lt;header&gt;</text>
    <text class="land-d" x="14" y="36">banner</text>
    <text class="land-c" x="86" y="28">로고 · 검색바</text>

    <!-- nav inside header -->
    <rect class="blue-dark" x="240" y="6" width="252" height="34" rx="4" />
    <text class="land-h" x="252" y="20">&lt;nav&gt;</text>
    <text class="land-d" x="252" y="32">navigation</text>
    <text class="land-c" x="402" y="26">메뉴 항목</text>
  </g>

  <!-- main -->
  <g transform="translate(40, 144)">
    <rect class="teal" x="0" y="0" width="360" height="180" rx="6" />
    <text class="land-h" x="14" y="20">&lt;main&gt;</text>
    <text class="land-d" x="14" y="36">main</text>

    <!-- section inside main -->
    <g transform="translate(0, -4)">
      <rect class="teal-dark" x="14" y="48" width="332" height="60" rx="4" />
      <text class="land-h" x="26" y="66">&lt;section aria-labelledby="..."&gt;</text>
      <text class="land-d" x="26" y="82">region (이름 있을 때)</text>
      <text class="land-c" x="26" y="98">h2: 인기 상품</text>

      <rect class="teal-dark" x="14" y="116" width="332" height="60" rx="4" />
      <text class="land-h" x="26" y="134">&lt;section aria-labelledby="..."&gt;</text>
      <text class="land-d" x="26" y="150">region</text>
      <text class="land-c" x="26" y="166">h2: 기획전</text>
    </g>
  </g>

  <!-- aside (complementary) -->
  <g transform="translate(412, 144)">
    <rect class="amber" x="0" y="0" width="128" height="180" rx="6" />
    <text class="land-h" x="14" y="20">&lt;aside&gt;</text>
    <text class="land-d" x="14" y="36">complementary</text>
    <text class="land-c" x="14" y="60">최근 본 상품</text>
    <text class="land-c" x="14" y="78">추천 상품</text>
  </g>

  <!-- footer -->
  <g transform="translate(40, 332)">
    <rect class="purple" x="0" y="0" width="500" height="46" rx="6" />
    <text class="land-h" x="14" y="20">&lt;footer&gt;</text>
    <text class="land-d" x="14" y="36">contentinfo</text>
    <text class="land-c" x="114" y="28">회사 정보 · 약관 · 저작권</text>
  </g>

  <!-- 오른쪽: 스크린리더 로터 (디바이스 UI: 항상 어두운 톤) -->
  <g transform="translate(580, 90)">
    <rect class="rotor-bg" x="0" y="0" width="180" height="288" rx="12" stroke-width="0.5" />

    <text class="rotor-h" x="14" y="28">VoiceOver 로터</text>

    <line class="rotor-divider" x1="14" y1="46" x2="166" y2="46" stroke-width="0.5" />
    <text class="rotor-i" x="14" y="68">랜드마크 목록</text>

    <g transform="translate(14, 82)">
      <rect class="blue" x="0" y="0" width="16" height="16" rx="3" />
      <text class="rotor-i" x="24" y="12">banner</text>
    </g>
    <g transform="translate(14, 108)">
      <rect class="blue-dark" x="0" y="0" width="16" height="16" rx="3" />
      <text class="rotor-i" x="24" y="12">navigation</text>
    </g>
    <g transform="translate(14, 134)">
      <rect class="teal" x="0" y="0" width="16" height="16" rx="3" />
      <text class="rotor-i" x="24" y="12">main</text>
    </g>
    <g transform="translate(14, 160)">
      <rect class="teal-dark" x="0" y="0" width="16" height="16" rx="3" />
      <text class="rotor-i" x="24" y="12">region · 인기 상품</text>
    </g>
    <g transform="translate(14, 186)">
      <rect class="teal-dark" x="0" y="0" width="16" height="16" rx="3" />
      <text class="rotor-i" x="24" y="12">region · 기획전</text>
    </g>
    <g transform="translate(14, 212)">
      <rect class="amber" x="0" y="0" width="16" height="16" rx="3" />
      <text class="rotor-i" x="24" y="12">complementary</text>
    </g>
    <g transform="translate(14, 238)">
      <rect class="purple" x="0" y="0" width="16" height="16" rx="3" />
      <text class="rotor-i" x="24" y="12">contentinfo</text>
    </g>

    <text class="rotor-foot" x="14" y="274">VO+U로 열기</text>
  </g>

  <text class="caption" x="40" y="410">랜드마크는 페이지의 "지도"입니다. 명시적으로 두면 스크린리더 사용자는 메뉴 전체를 Tab으로 통과하지 않아도 됩니다</text>
  <text class="caption" x="40" y="428">section은 aria-labelledby로 이름을 부여해야 region 랜드마크로 인식됩니다. 그렇지 않으면 평범한 div 취급</text>
</svg>