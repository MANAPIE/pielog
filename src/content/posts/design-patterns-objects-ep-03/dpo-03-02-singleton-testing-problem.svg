<svg viewBox="0 0 1200 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-hidden">
  <title id="title-hidden">Singleton의 숨겨진 의존성과 DI를 통한 노출</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-line: #1A1F2E;
        --c-card: #FFFFFF; --c-soft: rgba(74,95,217,0.08);
        --c-soft-2: rgba(217,119,87,0.10); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-line: #E8E6E1;
          --c-card: #161B22; --c-soft: rgba(141,160,255,0.14);
          --c-soft-2: rgba(232,147,118,0.14); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .pane-bad { fill: var(--c-soft-2); stroke: var(--c-accent-2); stroke-width: 1.2; stroke-dasharray: 4 3; }
      .pane-good { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.2; stroke-dasharray: 4 3; }
      .box { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.3; }
      .box-service { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.6; }
      .box-singleton-bad { fill: var(--c-bg); stroke: var(--c-accent-2); stroke-width: 1.6; stroke-dasharray: 3 3; }
      .box-singleton-good { fill: var(--c-bg); stroke: var(--c-accent); stroke-width: 1.6; }
      .line { stroke: var(--c-line); stroke-width: 1.3; fill: none; }
      .line-hidden { stroke: var(--c-accent-2); stroke-width: 1.3; fill: none; stroke-dasharray: 2 5; opacity: 0.85; }
      .line-explicit { stroke: var(--c-accent); stroke-width: 1.6; fill: none; }
      .pane-label { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; }
      .pane-title { font-family: 'Inter',system-ui,sans-serif; font-size: 17px; font-weight: 700; fill: var(--c-fg); letter-spacing: -0.01em; }
      .pane-cap { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; fill: var(--c-muted); }
      .class-name { font-family: 'Inter',system-ui,sans-serif; font-size: 14px; font-weight: 700; fill: var(--c-fg); }
      .sig { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; fill: var(--c-muted); }
      .sig-strong { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11.5px; fill: var(--c-fg); font-weight: 600; }
      .singleton-name { font-family: 'Inter',system-ui,sans-serif; font-size: 11.5px; font-weight: 700; fill: var(--c-fg); }
      .hide-tag { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; font-weight: 700; fill: var(--c-accent-2); }
      .visible-tag { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; font-weight: 700; fill: var(--c-accent); }
    </style>
    <marker id="ar-h" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)"/>
    </marker>
    <marker id="ar-e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent)"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="580"/>

  <!-- ===== 좌: BAD ===== -->
  <g transform="translate(40 40)">
    <rect class="pane-bad" width="540" height="500" rx="8"/>
    <text x="24" y="32" class="pane-label" fill="var(--c-accent-2)">ANTI-PATTERN</text>
    <text x="24" y="58" class="pane-title">숨겨진 의존성</text>
    <text x="24" y="80" class="pane-cap">시그니처만 봐서는 무엇에 의존하는지 알 수 없습니다</text>

    <!-- OrderService -->
    <g transform="translate(160 110)">
      <rect width="240" height="90" rx="6" class="box-service"/>
      <text x="120" y="28" class="class-name" text-anchor="middle">OrderService</text>
      <line x1="14" y1="40" x2="226" y2="40" stroke="var(--c-divider)" stroke-width="1"/>
      <text x="14" y="62" class="sig-strong">constructor()  ← 인자 없음</text>
      <text x="14" y="76" class="sig">createOrder(items)</text>
    </g>

    <!-- 메서드 안에 숨은 의존들 -->
    <text x="270" y="240" class="hide-tag" text-anchor="middle">↓ 메서드 본문 안에 숨어 있는 의존 ↓</text>

    <g transform="translate(60 270)">
      <rect width="130" height="58" rx="4" class="box-singleton-bad"/>
      <text x="65" y="22" class="singleton-name" text-anchor="middle">Logger</text>
      <text x="65" y="42" class="sig" text-anchor="middle">.getInstance()</text>
    </g>
    <g transform="translate(205 270)">
      <rect width="130" height="58" rx="4" class="box-singleton-bad"/>
      <text x="65" y="22" class="singleton-name" text-anchor="middle">Cache</text>
      <text x="65" y="42" class="sig" text-anchor="middle">.getInstance()</text>
    </g>
    <g transform="translate(350 270)">
      <rect width="130" height="58" rx="4" class="box-singleton-bad"/>
      <text x="65" y="22" class="singleton-name" text-anchor="middle">Analytics</text>
      <text x="65" y="42" class="sig" text-anchor="middle">.getInstance()</text>
    </g>

    <!-- 숨겨진 점선 화살표 -->
    <line x1="125" y1="270" x2="240" y2="200" class="line-hidden" marker-end="url(#ar-h)"/>
    <line x1="270" y1="270" x2="280" y2="200" class="line-hidden" marker-end="url(#ar-h)"/>
    <line x1="415" y1="270" x2="320" y2="200" class="line-hidden" marker-end="url(#ar-h)"/>

    <!-- 테스트 어려움 표시 -->
    <g transform="translate(60 370)">
      <rect width="420" height="100" rx="4" fill="var(--c-bg)" stroke="var(--c-accent-2)" stroke-width="1.4" stroke-dasharray="3 3"/>
      <text x="16" y="24" class="hide-tag">테스트 시점의 문제</text>
      <text x="16" y="46" class="pane-cap">• OrderService만 단독으로 테스트할 수 없습니다</text>
      <text x="16" y="64" class="pane-cap">• 세 Singleton이 실제 외부 시스템에 연결을 시도합니다</text>
      <text x="16" y="82" class="pane-cap">• mock으로 갈아 끼우는 일이 깔끔하지 않습니다</text>
    </g>
  </g>

  <!-- ===== 우: GOOD (DI) ===== -->
  <g transform="translate(620 40)">
    <rect class="pane-good" width="540" height="500" rx="8"/>
    <text x="24" y="32" class="pane-label" fill="var(--c-accent)">DEPENDENCY INJECTION</text>
    <text x="24" y="58" class="pane-title">노출된 의존성</text>
    <text x="24" y="80" class="pane-cap">시그니처에 의존 관계가 그대로 드러납니다</text>

    <!-- OrderService (DI) -->
    <g transform="translate(110 110)">
      <rect width="340" height="110" rx="6" class="box-service"/>
      <text x="170" y="28" class="class-name" text-anchor="middle">OrderService</text>
      <line x1="14" y1="40" x2="326" y2="40" stroke="var(--c-divider)" stroke-width="1"/>
      <text x="14" y="62" class="sig-strong">constructor(</text>
      <text x="14" y="78" class="sig-strong">  logger, cache, analytics</text>
      <text x="14" y="94" class="sig-strong">)</text>
    </g>

    <text x="270" y="260" class="visible-tag" text-anchor="middle">↑ 명시적인 주입 ↑</text>

    <g transform="translate(60 290)">
      <rect width="130" height="58" rx="4" class="box-singleton-good"/>
      <text x="65" y="22" class="singleton-name" text-anchor="middle">Logger</text>
      <text x="65" y="42" class="sig" text-anchor="middle">인스턴스</text>
    </g>
    <g transform="translate(205 290)">
      <rect width="130" height="58" rx="4" class="box-singleton-good"/>
      <text x="65" y="22" class="singleton-name" text-anchor="middle">Cache</text>
      <text x="65" y="42" class="sig" text-anchor="middle">인스턴스</text>
    </g>
    <g transform="translate(350 290)">
      <rect width="130" height="58" rx="4" class="box-singleton-good"/>
      <text x="65" y="22" class="singleton-name" text-anchor="middle">Analytics</text>
      <text x="65" y="42" class="sig" text-anchor="middle">인스턴스</text>
    </g>

    <!-- 명시적 화살표 -->
    <line x1="125" y1="290" x2="200" y2="220" class="line-explicit" marker-end="url(#ar-e)"/>
    <line x1="270" y1="290" x2="270" y2="220" class="line-explicit" marker-end="url(#ar-e)"/>
    <line x1="415" y1="290" x2="340" y2="220" class="line-explicit" marker-end="url(#ar-e)"/>

    <g transform="translate(60 370)">
      <rect width="420" height="100" rx="4" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="1.4"/>
      <text x="16" y="24" class="visible-tag">효과</text>
      <text x="16" y="46" class="pane-cap">• 시그니처를 보면 의존 관계가 한눈에 드러납니다</text>
      <text x="16" y="64" class="pane-cap">• 테스트할 때는 mock 인스턴스를 넘기면 됩니다</text>
      <text x="16" y="82" class="pane-cap">• Singleton 인스턴스를 주입해도 좋습니다: 둘은 배타적이지 않습니다</text>
    </g>
  </g>
</svg>
