<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-tp">
  <title id="title-tp">ThemeProvider: 단일 가정에서 계층적 가정으로의 변화</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft: rgba(74,95,217,0.08); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft: rgba(141,160,255,0.14); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .col-bg { fill: var(--c-card); stroke: var(--c-divider); stroke-width: 1; }
      .app-light { fill: var(--c-soft); stroke: var(--c-accent); stroke-width: 1.4; }
      .app-dark { fill: #1A1F2E; stroke: var(--c-accent); stroke-width: 1.4; }
      .pane-crack { stroke: var(--c-accent-2); stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
      .comp { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1; }
      .comp-dark { fill: #2A2F3E; stroke: var(--c-accent); stroke-width: 1; }
      .pane-comp { fill: var(--c-bg); stroke: var(--c-accent-2); stroke-width: 1.4; }
      .col-num { font-family: 'Inter',system-ui,sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.14em; }
      .col-title { font-family: 'Inter',system-ui,sans-serif; font-size: 17px; font-weight: 700; fill: var(--c-fg); letter-spacing: -0.01em; }
      .col-cap { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 12px; fill: var(--c-muted); }
      .tag { font-family: 'Inter',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-accent); }
      .tag-dark { font-family: 'Inter',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-accent-3); }
      .tag-crack { font-family: 'Inter',system-ui,sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-accent-2); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="540"/>

  <!-- ===== 컬럼 1: 단일 ThemeProvider ===== -->
  <g transform="translate(40 40)">
    <rect class="col-bg" width="360" height="460" rx="6"/>
    <text x="24" y="36" class="col-num">01</text>
    <text x="24" y="62" class="col-title">단일 ThemeProvider</text>
    <text x="24" y="84" class="col-cap">앱 전체가 하나의 테마를 공유</text>

    <!-- App 박스 -->
    <g transform="translate(40 120)">
      <rect width="280" height="320" rx="6" class="app-light"/>
      <text x="16" y="24" class="tag">ThemeProvider: light</text>

      <!-- 컴포넌트들 -->
      <rect x="22" y="50" width="240" height="40" rx="4" class="comp"/>
      <text x="142" y="74" class="col-cap" text-anchor="middle" fill="var(--c-fg)">Header</text>

      <rect x="22" y="104" width="240" height="100" rx="4" class="comp"/>
      <text x="142" y="148" class="col-cap" text-anchor="middle" fill="var(--c-fg)">Content</text>
      <rect x="40" y="160" width="80" height="22" rx="4" fill="var(--c-soft)"/>
      <rect x="130" y="160" width="80" height="22" rx="4" fill="var(--c-soft)"/>

      <rect x="22" y="220" width="115" height="60" rx="4" class="comp"/>
      <text x="80" y="254" class="col-cap" text-anchor="middle" fill="var(--c-fg)">Sidebar</text>

      <rect x="147" y="220" width="115" height="60" rx="4" class="comp"/>
      <text x="204" y="254" class="col-cap" text-anchor="middle" fill="var(--c-fg)">Sidebar</text>
    </g>
  </g>

  <!-- ===== 컬럼 2: 균열 ===== -->
  <g transform="translate(420 40)">
    <rect class="col-bg" width="360" height="460" rx="6"/>
    <text x="24" y="36" class="col-num">02</text>
    <text x="24" y="62" class="col-title">하나라는 가정의 균열</text>
    <text x="24" y="84" class="col-cap">미리보기 패널이 다른 테마를 요구</text>

    <g transform="translate(40 120)">
      <rect width="280" height="320" rx="6" class="app-light"/>
      <text x="16" y="24" class="tag">ThemeProvider: light</text>

      <rect x="22" y="50" width="240" height="40" rx="4" class="comp"/>
      <text x="142" y="74" class="col-cap" text-anchor="middle" fill="var(--c-fg)">Header</text>

      <rect x="22" y="104" width="240" height="100" rx="4" class="comp"/>
      <text x="142" y="124" class="col-cap" text-anchor="middle" fill="var(--c-fg)">Content</text>

      <!-- 균열된 미리보기 패널 (다른 테마를 원함) -->
      <g transform="translate(22 220)">
        <rect width="240" height="60" rx="4" class="pane-comp"/>
        <text x="120" y="22" class="tag-crack" text-anchor="middle">Preview Panel</text>
        <text x="120" y="42" class="col-cap" text-anchor="middle">다크 테마로 보여줘야 함</text>
      </g>
      <!-- 균열 표시 -->
      <path d="M 22 215 L 262 215" class="pane-crack"/>
    </g>
  </g>

  <!-- ===== 컬럼 3: 계층적 ThemeProvider ===== -->
  <g transform="translate(800 40)">
    <rect class="col-bg" width="360" height="460" rx="6"/>
    <text x="24" y="36" class="col-num">03</text>
    <text x="24" y="62" class="col-title">중첩된 ThemeProvider</text>
    <text x="24" y="84" class="col-cap">하나에서 계층적 하나로</text>

    <g transform="translate(40 120)">
      <rect width="280" height="320" rx="6" class="app-light"/>
      <text x="16" y="24" class="tag">ThemeProvider: light</text>

      <rect x="22" y="50" width="240" height="40" rx="4" class="comp"/>
      <text x="142" y="74" class="col-cap" text-anchor="middle" fill="var(--c-fg)">Header</text>

      <rect x="22" y="104" width="240" height="100" rx="4" class="comp"/>
      <text x="142" y="128" class="col-cap" text-anchor="middle" fill="var(--c-fg)">Content</text>

      <!-- 중첩된 dark provider -->
      <g transform="translate(22 220)">
        <rect width="240" height="60" rx="4" class="app-dark"/>
        <text x="120" y="22" class="tag-dark" text-anchor="middle">ThemeProvider: dark</text>
        <rect x="14" y="32" width="212" height="20" rx="2" class="comp-dark"/>
      </g>
    </g>
  </g>
</svg>
