<svg viewBox="0 0 720 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="보안 헤더가 방어하는 공격 종류 지도">
  <style>
    /* sec-theme-vars */
    :root {
      --sec-fg: #0f172a;
      --sec-fg-muted: #64748b;
      --sec-bg: #ffffff;
      --sec-border: #e2e8f0;
      --sec-slate-50: #f8fafc;
      --sec-slate-100: #f1f5f9;
      --sec-slate-200: #e2e8f0;
      --sec-slate-300: #cbd5e1;
      --sec-slate-400: #94a3b8;
      --sec-slate-500: #64748b;
      --sec-slate-700: #334155;
      --sec-blue-50: #eff6ff;
      --sec-blue-200: #bfdbfe;
      --sec-blue-500: #3b82f6;
      --sec-blue-700: #1d4ed8;
      --sec-red-50: #fef2f2;
      --sec-red-100: #fee2e2;
      --sec-red-200: #fecaca;
      --sec-red-500: #ef4444;
      --sec-red-700: #b91c1c;
      --sec-amber-50: #fffbeb;
      --sec-amber-100: #fef3c7;
      --sec-amber-200: #fde68a;
      --sec-amber-500: #f59e0b;
      --sec-amber-700: #b45309;
      --sec-emerald-50: #ecfdf5;
      --sec-emerald-100: #d1fae5;
      --sec-emerald-200: #a7f3d0;
      --sec-emerald-500: #10b981;
      --sec-emerald-700: #047857;
      --sec-violet-50: #f5f3ff;
      --sec-violet-200: #ddd6fe;
      --sec-violet-500: #8b5cf6;
      --sec-violet-700: #6d28d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sec-fg: #e2e8f0;
        --sec-fg-muted: #94a3b8;
        --sec-bg: #0f172a;
        --sec-border: #334155;
        --sec-slate-50: #1e293b;
        --sec-slate-100: #334155;
        --sec-slate-200: #475569;
        --sec-slate-300: #64748b;
        --sec-slate-400: #94a3b8;
        --sec-slate-500: #cbd5e1;
        --sec-slate-700: #e2e8f0;
        --sec-blue-50: #172554;
        --sec-blue-200: #1e40af;
        --sec-blue-500: #60a5fa;
        --sec-blue-700: #93c5fd;
        --sec-red-50: #450a0a;
        --sec-red-100: #7f1d1d;
        --sec-red-200: #991b1b;
        --sec-red-500: #f87171;
        --sec-red-700: #fca5a5;
        --sec-amber-50: #451a03;
        --sec-amber-100: #78350f;
        --sec-amber-200: #92400e;
        --sec-amber-500: #fbbf24;
        --sec-amber-700: #fcd34d;
        --sec-emerald-50: #022c22;
        --sec-emerald-100: #064e3b;
        --sec-emerald-200: #065f46;
        --sec-emerald-500: #34d399;
        --sec-emerald-700: #6ee7b7;
        --sec-violet-50: #2e1065;
        --sec-violet-200: #5b21b6;
        --sec-violet-500: #a78bfa;
        --sec-violet-700: #c4b5fd;
      }
    }

    .title { font: 600 16px system-ui, sans-serif; fill: var(--sec-fg, #0f172a); }
    .caption { font: 400 11px system-ui, sans-serif; fill: var(--sec-fg-muted, #64748b); }
    .header-name { font: 600 12px "SF Mono", ui-monospace, monospace; fill: var(--sec-fg, #0f172a); }
    .header-desc { font: 400 11px system-ui, sans-serif; fill: var(--sec-fg-muted, #64748b); }
    .attack-label { font: 500 10px system-ui, sans-serif; fill: var(--sec-red-700, #b91c1c); }
    .defense-label { font: 600 10px system-ui, sans-serif; letter-spacing: 0.04em; }

    .header-box { fill: var(--sec-emerald-50, #ecfdf5); stroke: var(--sec-emerald-200, #a7f3d0); stroke-width: 1; }
    .attack-box { fill: var(--sec-red-50, #fef2f2); stroke: var(--sec-red-200, #fecaca); stroke-width: 1; }
    .arrow { stroke: var(--sec-slate-500, #64748b); stroke-width: 1.2; fill: none; opacity: 0.5; }
    .tag-green { fill: var(--sec-emerald-700, #047857); }
  </style>

  <defs>
    <marker id="sharr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sec-slate-500, #64748b)" opacity="0.5"/>
    </marker>
  </defs>

  <text x="24" y="36" class="title">보안 헤더가 막는 공격들</text>
  <text x="24" y="56" class="caption">각 헤더는 특정 공격 시나리오에 대응합니다. 왼쪽 헤더가 오른쪽 공격을 막습니다.</text>

  <!-- Column headers -->
  <text x="180" y="92" text-anchor="middle" class="defense-label tag-green">DEFENSE · 보안 헤더</text>
  <text x="540" y="92" text-anchor="middle" class="attack-label">ATTACK · 방어 대상 공격</text>

  <!-- Row 1: HSTS -->
  <rect x="24" y="104" width="312" height="68" rx="8" class="header-box"/>
  <text x="40" y="126" class="header-name">Strict-Transport-Security</text>
  <text x="40" y="146" class="header-desc">HSTS. "앞으로 무조건 HTTPS로만 접속해"</text>
  <text x="40" y="162" class="header-desc">max-age=31536000; includeSubDomains; preload</text>

  <rect x="384" y="104" width="312" height="68" rx="8" class="attack-box"/>
  <text x="400" y="126" class="header-name" fill="var(--sec-red-700, #b91c1c)">SSL Stripping / MITM</text>
  <text x="400" y="146" class="attack-label">HTTP → HTTPS 리다이렉트 순간의</text>
  <text x="400" y="162" class="attack-label">중간자 공격으로 평문 가로채기</text>

  <line x1="336" y1="138" x2="384" y2="138" class="arrow" marker-end="url(#sharr)"/>

  <!-- Row 2: CSP -->
  <rect x="24" y="184" width="312" height="68" rx="8" class="header-box"/>
  <text x="40" y="206" class="header-name">Content-Security-Policy</text>
  <text x="40" y="226" class="header-desc">CSP. "이 출처의 스크립트만 실행 가능"</text>
  <text x="40" y="242" class="header-desc">default-src 'self'; script-src 'self' 'nonce-...'</text>

  <rect x="384" y="184" width="312" height="68" rx="8" class="attack-box"/>
  <text x="400" y="206" class="header-name" fill="var(--sec-red-700, #b91c1c)">XSS (Cross-Site Scripting)</text>
  <text x="400" y="226" class="attack-label">인라인 스크립트·외부 스크립트 실행 차단.</text>
  <text x="400" y="242" class="attack-label">XSS가 발생해도 피해 최소화 (2차 방어선)</text>

  <line x1="336" y1="218" x2="384" y2="218" class="arrow" marker-end="url(#sharr)"/>

  <!-- Row 3: X-Frame-Options -->
  <rect x="24" y="264" width="312" height="68" rx="8" class="header-box"/>
  <text x="40" y="286" class="header-name">X-Frame-Options / frame-ancestors</text>
  <text x="40" y="306" class="header-desc">"내 페이지를 iframe에 넣지 마"</text>
  <text x="40" y="322" class="header-desc">DENY 또는 CSP frame-ancestors 'none'</text>

  <rect x="384" y="264" width="312" height="68" rx="8" class="attack-box"/>
  <text x="400" y="286" class="header-name" fill="var(--sec-red-700, #b91c1c)">Clickjacking</text>
  <text x="400" y="306" class="attack-label">투명 iframe 위에 가짜 버튼을 겹쳐</text>
  <text x="400" y="322" class="attack-label">의도치 않은 클릭 유도 (송금·삭제 등)</text>

  <line x1="336" y1="298" x2="384" y2="298" class="arrow" marker-end="url(#sharr)"/>

  <!-- Row 4: X-Content-Type-Options -->
  <rect x="24" y="344" width="312" height="68" rx="8" class="header-box"/>
  <text x="40" y="366" class="header-name">X-Content-Type-Options</text>
  <text x="40" y="386" class="header-desc">"Content-Type을 추측하지 마"</text>
  <text x="40" y="402" class="header-desc">nosniff</text>

  <rect x="384" y="344" width="312" height="68" rx="8" class="attack-box"/>
  <text x="400" y="366" class="header-name" fill="var(--sec-red-700, #b91c1c)">MIME Sniffing Attack</text>
  <text x="400" y="386" class="attack-label">이미지로 업로드된 HTML 파일이</text>
  <text x="400" y="402" class="attack-label">브라우저 판단으로 스크립트 실행됨</text>

  <line x1="336" y1="378" x2="384" y2="378" class="arrow" marker-end="url(#sharr)"/>

  <!-- Row 5: Referrer-Policy -->
  <rect x="24" y="424" width="312" height="68" rx="8" class="header-box"/>
  <text x="40" y="446" class="header-name">Referrer-Policy</text>
  <text x="40" y="466" class="header-desc">"다른 사이트로 이동 시 URL 내역 숨김"</text>
  <text x="40" y="482" class="header-desc">strict-origin-when-cross-origin</text>

  <rect x="384" y="424" width="312" height="68" rx="8" class="attack-box"/>
  <text x="400" y="446" class="header-name" fill="var(--sec-red-700, #b91c1c)">Token Leak via Referer</text>
  <text x="400" y="466" class="attack-label">쿼리 파라미터의 재설정 토큰·세션 키가</text>
  <text x="400" y="482" class="attack-label">외부 사이트 서버 로그에 그대로 기록됨</text>

  <line x1="336" y1="458" x2="384" y2="458" class="arrow" marker-end="url(#sharr)"/>

  <!-- Row 6: Permissions-Policy -->
  <rect x="24" y="504" width="312" height="68" rx="8" class="header-box"/>
  <text x="40" y="526" class="header-name">Permissions-Policy</text>
  <text x="40" y="546" class="header-desc">"브라우저 기능 접근 제한"</text>
  <text x="40" y="562" class="header-desc">camera=(), microphone=(), geolocation=()</text>

  <rect x="384" y="504" width="312" height="68" rx="8" class="attack-box"/>
  <text x="400" y="526" class="header-name" fill="var(--sec-red-700, #b91c1c)">악성 기능 호출 · 권한 오용</text>
  <text x="400" y="546" class="attack-label">XSS·써드파티 스크립트가 카메라·마이크·</text>
  <text x="400" y="562" class="attack-label">위치정보에 접근하는 것을 원천 차단</text>

  <line x1="336" y1="538" x2="384" y2="538" class="arrow" marker-end="url(#sharr)"/>
</svg>
