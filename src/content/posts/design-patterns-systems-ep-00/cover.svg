<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">시스템의 형태는 경계가 결정한다: ep.00 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #4A5FD9; --c-accent-2: #D97757; --c-accent-3: #8B7AB8; --c-accent-4: #3D8B7A;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #8DA0FF; --c-accent-2: #E89376; --c-accent-3: #B0A0DA; --c-accent-4: #6FBFA8;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="g1" cx="22%" cy="28%" r="52%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="78%" cy="76%" r="52%">
      <stop offset="0%" stop-color="var(--c-accent-4)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--c-accent-4)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- 화면 밖으로 빠지는 큰 stroke 도형 -->
  <circle cx="1140" cy="90" r="250" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12"/>
  <rect x="-140" y="420" width="520" height="360" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.11" transform="rotate(-9 120 600)"/>

  <!-- 중앙 메타포: 하나의 덩어리를 가르는 경계선들 -->
  <g transform="translate(600 315)">
    <!-- 전체 필드 (덩어리) -->
    <rect x="-330" y="-190" width="660" height="380" rx="10" fill="none" stroke="var(--c-line)" stroke-width="2" opacity="0.55"/>

    <!-- 경계선 1: 세로 (굵고 실선) -->
    <line x1="-90" y1="-190" x2="-60" y2="190" stroke="var(--c-accent)" stroke-width="4" stroke-linecap="round"/>
    <!-- 경계선 2: 가로 우측 (대시) -->
    <line x1="-60" y1="10" x2="330" y2="34" stroke="var(--c-accent-2)" stroke-width="3.5" stroke-dasharray="12 7" stroke-linecap="round"/>
    <!-- 경계선 3: 좌측 사선 (점선) -->
    <line x1="-330" y1="-60" x2="-78" y2="-84" stroke="var(--c-accent-3)" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/>
    <!-- 경계선 4: 우상단 짧은 실선 -->
    <line x1="150" y1="-190" x2="164" y2="24" stroke="var(--c-accent-4)" stroke-width="3" stroke-linecap="round"/>

    <!-- 구획 A: 좌상 (점 무리 + 미니 바) -->
    <g transform="translate(-250 -140) rotate(-5)">
      <circle r="4.5" fill="var(--c-line)" opacity="0.75"/>
      <circle cx="18" r="4.5" fill="var(--c-line)" opacity="0.5"/>
      <circle cx="36" r="4.5" fill="var(--c-line)" opacity="0.3"/>
      <rect x="-6" y="22" width="70" height="7" rx="3.5" fill="var(--c-accent)" opacity="0.7"/>
      <rect x="-6" y="36" width="44" height="7" rx="3.5" fill="var(--c-accent)" opacity="0.4"/>
    </g>

    <!-- 구획 B: 좌하 (동심원) -->
    <g transform="translate(-215 90)">
      <circle r="58" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6" opacity="0.6"/>
      <circle r="36" fill="none" stroke="var(--c-accent-3)" stroke-width="1.6" opacity="0.8"/>
      <circle r="13" fill="var(--c-accent-3)" opacity="0.85"/>
    </g>

    <!-- 구획 C: 중상 (회전 사각형 + 포커스 링) -->
    <g transform="translate(30 -110) rotate(11)">
      <rect x="-52" y="-40" width="104" height="80" rx="5" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>
      <line x1="-34" y1="-16" x2="34" y2="-16" stroke="var(--c-line)" stroke-width="2.5"/>
      <line x1="-34" y1="0" x2="16" y2="0" stroke="var(--c-line)" stroke-width="1.3" opacity="0.45"/>
      <circle cx="-26" cy="20" r="3.5" fill="var(--c-accent-2)"/>
      <circle cx="-12" cy="20" r="3.5" fill="var(--c-accent-2)" opacity="0.6"/>
      <rect x="-64" y="-52" width="128" height="104" rx="7" fill="none" stroke="var(--c-accent-2)" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.65"/>
    </g>

    <!-- 구획 D: 중하 (화살표 트라이앵글 묶음) -->
    <g transform="translate(40 110) rotate(-7)">
      <polygon points="-30,-14 -6,0 -30,14" fill="var(--c-line)" opacity="0.7"/>
      <polygon points="0,-14 24,0 0,14" fill="var(--c-line)" opacity="0.45"/>
      <polygon points="30,-14 54,0 30,14" fill="var(--c-line)" opacity="0.22"/>
    </g>

    <!-- 구획 E: 우상 (미니 바 묶음) -->
    <g transform="translate(232 -120) rotate(6)">
      <rect x="0" y="0" width="76" height="9" rx="4.5" fill="var(--c-accent-4)" opacity="0.85"/>
      <rect x="0" y="18" width="54" height="9" rx="4.5" fill="var(--c-accent-4)" opacity="0.55"/>
      <rect x="0" y="36" width="66" height="9" rx="4.5" fill="var(--c-accent-4)" opacity="0.3"/>
    </g>

    <!-- 구획 F: 우하 (체크 + 점선 원) -->
    <g transform="translate(240 110)">
      <circle r="44" fill="none" stroke="var(--c-line)" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.5"/>
      <polyline points="-18,2 -5,16 20,-14" fill="none" stroke="var(--c-accent-2)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 경계 교차점 강조 노드 -->
    <circle cx="-72" cy="-84" r="7" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2.5"/>
    <circle cx="-63" cy="16" r="7" fill="var(--c-bg)" stroke="var(--c-accent)" stroke-width="2.5"/>
    <circle cx="163" cy="26" r="7" fill="var(--c-bg)" stroke="var(--c-accent-4)" stroke-width="2.5"/>
  </g>

  <!-- 좌상단 작은 점 무리 -->
  <g transform="translate(140 96)">
    <circle r="4" fill="var(--c-accent-2)"/>
    <circle cx="16" r="4" fill="var(--c-accent-2)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent-2)" opacity="0.3"/>
  </g>

  <!-- 우상단 동심원 -->
  <g transform="translate(1030 148)" opacity="0.65">
    <circle r="46" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5"/>
    <circle r="26" fill="none" stroke="var(--c-accent-3)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌하단 회전 사각형 -->
  <g transform="translate(120 546) rotate(-13)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent)" stroke-width="1.6"/>
  </g>

  <text x="1130" y="575" class="num" text-anchor="end">00</text>
</svg>
