<svg viewBox="0 0 800 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-cross">
  <title id="t-cross">결제 버튼 클릭이 통과하는 열세 개의 경계</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4A5FD9;
        --c-accent-2: #D97757;
        --c-accent-3: #8B7AB8;
        --c-accent-4: #3D8B7A;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #8DA0FF;
          --c-accent-2: #E89376;
          --c-accent-3: #B0A0DA;
          --c-accent-4: #6FBFA8;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .row {
        fill: var(--c-card);
        stroke: var(--c-divider);
        stroke-width: 1;
      }

      .spine {
        stroke: var(--c-line);
        stroke-width: 2;
        opacity: 0.35;
      }

      .ep {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 11px;
        font-weight: 700;
      }

      .name {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .q {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12.5px;
        fill: var(--c-muted);
      }

      .head {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .tag {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="780" />

  <!-- 시작: 클릭 -->
  <g transform="translate(24 20)">
    <rect width="752" height="48" rx="6" fill="var(--c-card)" stroke="var(--c-line)" stroke-width="1.8" />
    <circle cx="30" cy="24" r="9" fill="var(--c-accent-2)" />
    <text x="52" y="29" class="head">사용자가 결제 버튼을 누릅니다</text>
  </g>

  <!-- 세로 척추 -->
  <line x1="60" y1="68" x2="60" y2="712" class="spine" />

  <!-- 각 경계 행 (13개) -->
  <!-- I군 blue: 01,02,03 -->
  <g transform="translate(24 82)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent)">EP.01</text>
    <text x="118" y="19" class="name">모듈 경계</text>
    <text x="118" y="36" class="q">이 버튼은 왜 그 폴더에 있는가</text>
  </g>
  <g transform="translate(24 132)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent)">EP.02</text>
    <text x="118" y="19" class="name">의존 방향</text>
    <text x="118" y="36" class="q">버튼이 결제 API를 직접 알아야 하는가</text>
  </g>
  <g transform="translate(24 182)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent)">EP.03</text>
    <text x="118" y="19" class="name">계약 경계</text>
    <text x="118" y="36" class="q">응답이 그 모양이라는 보장은 어디에 있는가</text>
  </g>

  <!-- II군 coral: 04,05,06 -->
  <g transform="translate(24 232)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-2)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-2)">EP.04</text>
    <text x="118" y="19" class="name">실행 경계</text>
    <text x="118" y="36" class="q">이 코드는 브라우저와 서버 중 어디에서 도는가</text>
  </g>
  <g transform="translate(24 282)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-2)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-2)">EP.05</text>
    <text x="118" y="19" class="name">네트워크 경계</text>
    <text x="118" y="36" class="q">호출이 실패하면 재시도할 것인가</text>
  </g>
  <g transform="translate(24 332)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-2)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-2)">EP.06</text>
    <text x="118" y="19" class="name">시간의 경계</text>
    <text x="118" y="36" class="q">지금 처리할 것인가, 큐에 넣을 것인가</text>
  </g>

  <!-- III군 purple: 07,08,09,10 -->
  <g transform="translate(24 382)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-3)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-3)">EP.07</text>
    <text x="118" y="19" class="name">상태의 경계</text>
    <text x="118" y="36" class="q">결제 진행 상태의 소유자는 누구인가</text>
  </g>
  <g transform="translate(24 432)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-3)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-3)">EP.08</text>
    <text x="118" y="19" class="name">캐시 경계</text>
    <text x="118" y="36" class="q">이 값의 사본은 몇 개이고 누가 낡았는가</text>
  </g>
  <g transform="translate(24 482)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-3)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-3)">EP.09</text>
    <text x="118" y="19" class="name">일관성 경계</text>
    <text x="118" y="36" class="q">결제와 주문 생성은 하나의 사건인가</text>
  </g>
  <g transform="translate(24 532)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-3)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-3)">EP.10</text>
    <text x="118" y="19" class="name">신뢰 경계</text>
    <text x="118" y="36" class="q">금액은 어디에서 검증되는가</text>
  </g>

  <!-- IV군 teal: 11,12,13 -->
  <g transform="translate(24 582)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-4)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-4)">EP.11</text>
    <text x="118" y="19" class="name">배포 경계</text>
    <text x="118" y="36" class="q">이 버튼은 무엇과 함께 배포되는가</text>
  </g>
  <g transform="translate(24 632)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-4)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-4)">EP.12</text>
    <text x="118" y="19" class="name">변경 경계</text>
    <text x="118" y="36" class="q">이 API의 어느 부분이 약속인가</text>
  </g>
  <g transform="translate(24 682)">
    <rect x="16" width="736" height="44" rx="5" class="row" />
    <circle cx="36" cy="22" r="6" fill="var(--c-accent-4)" />
    <text x="60" y="26" class="ep" fill="var(--c-accent-4)">EP.13</text>
    <text x="118" y="19" class="name">관측 경계</text>
    <text x="118" y="36" class="q">실패했을 때 무슨 일이 있었는지 알 수 있는가</text>
  </g>

  <!-- 하단 정리 -->
  <text x="400" y="758" class="q" text-anchor="middle" font-weight="700" fill="var(--c-fg)">클릭 한 번 · 결정 열세 개</text>
</svg>