<svg viewBox="0 0 800 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-trie">
  <title id="t-trie">cat, car, card를 담은 트라이에서 접두사를 공유하는 구조</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #2F7D6E;
        --c-accent-2: #C2703D;
        --c-accent-3: #6366A8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(47, 125, 110, 0.16);
        --c-soft-2: rgba(194, 112, 61, 0.16);
        --c-dim: rgba(107, 114, 128, 0.30);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #6FC3B0;
          --c-accent-2: #E09A6B;
          --c-accent-3: #9598D4;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(111, 195, 176, 0.20);
          --c-soft-2: rgba(224, 154, 107, 0.20);
          --c-dim: rgba(139, 146, 160, 0.34);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .ttl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .sub {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11.5px;
        fill: var(--c-muted);
      }

      .hd {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .pane {
        fill: none;
        stroke: var(--c-divider);
        stroke-width: 1.2;
      }

      .lg {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 11px;
        fill: var(--c-fg);
      }

      .cl {
        fill: var(--c-card);
        stroke: var(--c-line);
        stroke-width: 1.1;
      }

      .t {
        fill: var(--c-soft);
        stroke: var(--c-accent);
        stroke-width: 1.4;
      }

      .f {
        fill: var(--c-card);
        stroke: var(--c-dim);
        stroke-width: 1.1;
      }

      .st {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 2;
      }

      .n {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .m {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        fill: var(--c-muted);
      }

      .mk {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        font-weight: 700;
      }

      .ed {
        stroke: var(--c-line);
        stroke-width: 1.3;
        fill: none;
        opacity: 0.5;
      }

      .edd {
        stroke: var(--c-dim);
        stroke-width: 1.2;
        fill: none;
        stroke-dasharray: 3 2;
      }

      .kl {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: var(--c-fg);
      }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--c-accent-2)" />
    </marker>
  </defs>
  <rect class="bg" width="800" height="356" />
  <text x="24" y="28" class="ttl">같은 접두사는 노드 하나만 씁니다</text>
  <text x="24" y="48" class="sub">cat, car, card를 넣은 트라이 · 이중 원은 단어가 끝나는 노드</text>
  <g transform="translate(24 62)">
    <rect width="460" height="250" rx="8" class="pane" />
    <line x1="70" y1="62" x2="70" y2="70" class="ed" />
    <line x1="70" y1="106" x2="70" y2="116" class="ed" />
    <line x1="86" y1="142" x2="140" y2="170" class="ed" />
    <line x1="87" y1="138" x2="239" y2="165" class="ed" />
    <line x1="280" y1="178" x2="330" y2="208" class="ed" />
    <circle cx="70" cy="42" r="18" class="cl" /><text x="70" y="46" class="kl" text-anchor="middle">root</text>
    <circle cx="70" cy="88" r="16" class="cl" /><text x="70" y="92" class="n" text-anchor="middle">c</text>
    <circle cx="70" cy="134" r="16" class="cl" /><text x="70" y="138" class="n" text-anchor="middle">a</text>
    <circle cx="160" cy="180" r="16" class="t" />
    <circle cx="160" cy="180" r="20" class="t" fill="none" /><text x="160" y="184" class="n"
      text-anchor="middle">t</text>
    <circle cx="260" cy="170" r="16" class="t" />
    <circle cx="260" cy="170" r="20" class="t" fill="none" /><text x="260" y="174" class="n"
      text-anchor="middle">r</text>
    <circle cx="350" cy="216" r="16" class="t" />
    <circle cx="350" cy="216" r="20" class="t" fill="none" /><text x="350" y="220" class="n"
      text-anchor="middle">d</text>
    <text x="160" y="216" class="m" text-anchor="middle">cat</text>
    <text x="260" y="216" class="m" text-anchor="middle">car</text>
    <text x="378" y="221" class="m">card</text>
    <text x="110" y="120" class="m">c와 a는 세 단어가 공유합니다</text>
  </g>
  <g transform="translate(500 62)">
    <rect width="276" height="250" rx="8" class="pane" />
    <text x="16" y="26" class="hd" fill="var(--c-accent)">비용</text>
    <text x="16" y="64" class="lg">노드 수: 공통 접두사만큼 절약</text>
    <text x="16" y="86" class="m">cat car card = 11글자 → 노드 6개</text>
    <text x="16" y="132" class="lg">조회: 단어 길이에만 비례</text>
    <text x="16" y="154" class="m">저장 단어가 백만 개여도 열 글자면 열 번</text>
    <text x="16" y="200" class="lg">대가: 노드마다 자식 맵</text>
    <text x="16" y="222" class="m">접두사 질의가 없다면 Set이 낫습니다</text>
  </g>
  <text x="24" y="338" class="sub">car까지 왔을 때 자식에 d가 있는지 보면 card로 시작하는 단어가 있는지 바로 알 수 있습니다. 자동완성이 이 구조를 씁니다.</text>
</svg>