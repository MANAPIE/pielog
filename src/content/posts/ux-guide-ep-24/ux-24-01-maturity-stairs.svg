<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-ms">
  <title id="t-ms">UX 성숙도 다섯 단계</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-ms" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-ms-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="400" />
  <text x="24" y="36" class="ttl">UX 성숙도 다섯 단계</text>
  <line x1="69" y1="274" x2="429" y2="114" stroke="var(--c-muted)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a-ms)" />
  <rect x="24" y="290" width="90" height="70" rx="6" fill="var(--c-soft)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="32" y="308" class="nm" style="fill:var(--c-accent)">1 부재</text>
  <text x="32" y="321" class="cap" style="font-size:8.5px">absent</text>
  <text x="32" y="337" class="cap" style="fill:var(--c-fg)">UX가 인식에</text>
  <text x="32" y="351" class="cap" style="fill:var(--c-fg)">없음</text>
  <rect x="114" y="250" width="90" height="110" rx="6" fill="var(--c-soft)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="122" y="268" class="nm" style="fill:var(--c-accent)">2 관심</text>
  <text x="122" y="281" class="cap" style="font-size:8.5px">limited</text>
  <text x="122" y="297" class="cap" style="fill:var(--c-fg)">선언은 있지만</text>
  <text x="122" y="311" class="cap" style="fill:var(--c-fg)">체계 없음</text>
  <rect x="204" y="210" width="90" height="150" rx="6" fill="var(--c-soft)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="212" y="228" class="nm" style="fill:var(--c-accent)">3 실천</text>
  <text x="212" y="241" class="cap" style="font-size:8.5px">emergent</text>
  <text x="212" y="257" class="cap" style="fill:var(--c-fg)">프로세스에 있음</text>
  <text x="212" y="271" class="cap" style="fill:var(--c-fg)">수준은 들쭉날쭉</text>
  <rect x="294" y="170" width="90" height="190" rx="6" fill="var(--c-soft)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="302" y="188" class="nm" style="fill:var(--c-accent)">4 통합</text>
  <text x="302" y="201" class="cap" style="font-size:8.5px">integrated</text>
  <text x="302" y="217" class="cap" style="fill:var(--c-fg)">표준 절차,</text>
  <text x="302" y="231" class="cap" style="fill:var(--c-fg)">지표가 KPI에</text>
  <rect x="384" y="130" width="90" height="230" rx="6" fill="var(--c-soft)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="392" y="148" class="nm" style="fill:var(--c-accent)">5 전략</text>
  <text x="392" y="161" class="cap" style="font-size:8.5px">user-driven</text>
  <text x="392" y="177" class="cap" style="fill:var(--c-fg)">경영진의</text>
  <text x="392" y="191" class="cap" style="fill:var(--c-fg)">결정 기준</text>
  <text x="24" y="388" class="cap">NN/g의 여섯 단계 중 구조화와 통합을 하나로 묶어 다섯 단계로 부릅니다.</text>
</svg>
