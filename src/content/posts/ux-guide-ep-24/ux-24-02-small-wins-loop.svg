<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-sw">
  <title id="t-sw">작은 성공을 다음 프로젝트의 근거로</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #4E7D10;
        --c-accent-2: #A85A14;
        --c-accent-3: #3E6FB0;
        --c-accent-4: #8A4FA8;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(78, 125, 16, 0.10);
        --c-soft-2: rgba(168, 90, 20, 0.10);
        --c-soft-3: rgba(62, 111, 176, 0.10);
        --c-soft-4: rgba(138, 79, 168, 0.10);
        --c-muted-soft: rgba(107, 114, 128, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #A9D65A;
          --c-accent-2: #F0A85A;
          --c-accent-3: #86AEE6;
          --c-accent-4: #C08FE0;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(169, 214, 90, 0.14);
          --c-soft-2: rgba(240, 168, 90, 0.14);
          --c-soft-3: rgba(134, 174, 230, 0.14);
          --c-soft-4: rgba(192, 143, 224, 0.14);
          --c-muted-soft: rgba(139, 146, 160, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg { fill: var(--c-bg); }
      .card { fill: var(--c-card); stroke-width: 1.6; }
      .ttl { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: var(--c-fg); }
      .lbl { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
      .nm { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: var(--c-fg); }
      .cap { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-muted); }
      .mid { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 10.5px; fill: var(--c-fg); }
      .td { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; fill: var(--c-fg); }
      .th { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.08em; }
      .val { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .met { font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: var(--c-fg); letter-spacing: -0.02em; }
      .ep { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10.5px; font-weight: 700; fill: var(--c-fg); }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>
    <marker id="a-sw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-muted)" /></marker>
    <marker id="a-sw-f" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="var(--c-fg)" /></marker>
  </defs>

      <rect class="bg" width="500" height="300" />
  <text x="24" y="36" class="ttl">작은 성공을 다음 프로젝트의 근거로</text>
  <rect x="24" y="60" width="206" height="76" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="36" y="82" class="nm" style="fill:var(--c-accent)">1 작은 성공</text>
  <text x="36" y="102" class="cap" style="fill:var(--c-fg)">한 프로젝트에서 리서치·설계·테스트를</text>
  <text x="36" y="118" class="cap" style="fill:var(--c-fg)">완전히 돌림</text>
  <rect x="270" y="60" width="206" height="76" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="282" y="82" class="nm" style="fill:var(--c-accent)">2 기록</text>
  <text x="282" y="102" class="cap" style="fill:var(--c-fg)">비용, 발견한 문제, 지표 변화를</text>
  <text x="282" y="118" class="cap" style="fill:var(--c-fg)">문서로 남김</text>
  <rect x="270" y="176" width="206" height="76" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="282" y="198" class="nm" style="fill:var(--c-accent)">3 공유</text>
  <text x="282" y="218" class="cap" style="fill:var(--c-fg)">팀과 경영진에 화면 캡처와</text>
  <text x="282" y="234" class="cap" style="fill:var(--c-fg)">숫자로 보여줌</text>
  <rect x="24" y="176" width="206" height="76" rx="8" fill="var(--c-card)" stroke="var(--c-divider)" stroke-width="1" />
  <text x="36" y="198" class="nm" style="fill:var(--c-accent)">4 근거</text>
  <text x="36" y="218" class="cap" style="fill:var(--c-fg)">다음 프로젝트 일정에</text>
  <text x="36" y="234" class="cap" style="fill:var(--c-fg)">리서치와 테스트를 넣음</text>
  <line x1="230" y1="98" x2="270" y2="98" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sw)" />
  <line x1="373" y1="136" x2="373" y2="176" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sw)" />
  <line x1="270" y1="214" x2="230" y2="214" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sw)" />
  <line x1="127" y1="176" x2="127" y2="136" stroke="var(--c-muted)" stroke-width="1.4" marker-end="url(#a-sw)" />
  <text x="24" y="288" class="cap">이 순환이 한 바퀴 돌 때마다 성숙도가 한 단계 가까워집니다.</text>
</svg>
