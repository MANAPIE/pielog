  <!-- ================= 하단 띠 ================= -->
  <rect x="24" y="1334" width="752" height="52" rx="10" class="band" />
  <text x="400" y="1365" class="node" text-anchor="middle">왼쪽 열만 웹의 코드다. 가운데와 오른쪽은 요청하거나 조건을 확인하는 영역이다</text>
</svg>