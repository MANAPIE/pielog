<svg viewBox="0 0 800 1410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-swap">
  <title id="t-swap">폼 컨트롤이 웹뷰에서 네이티브 컴포넌트로 치환되는 경로</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7;
        --c-fg: #1A1F2E;
        --c-muted: #6B7280;
        --c-accent: #0E7490;
        --c-accent-2: #B45309;
        --c-line: #1A1F2E;
        --c-card: #FFFFFF;
        --c-soft: rgba(14, 116, 144, 0.08);
        --c-soft-2: rgba(180, 83, 9, 0.10);
        --c-divider: rgba(26, 31, 46, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419;
          --c-fg: #E8E6E1;
          --c-muted: #8B92A0;
          --c-accent: #4DD4EC;
          --c-accent-2: #E8A876;
          --c-line: #E8E6E1;
          --c-card: #161B22;
          --c-soft: rgba(77, 212, 236, 0.12);
          --c-soft-2: rgba(232, 168, 118, 0.14);
          --c-divider: rgba(232, 230, 225, 0.18);
        }
      }

      .bg {
        fill: var(--c-bg);
      }

      .hdr {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .node {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .code {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .cap {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        fill: var(--c-muted);
      }

      .cap-warn {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-accent-2);
      }

      .cap-acc {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-accent);
      }

      .pathlbl {
        font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-muted);
      }

      .lgd {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: var(--c-fg);
      }

      .web-card {
        fill: var(--c-soft);
        stroke: var(--c-accent);
        stroke-width: 1.5;
      }

      .os-card {
        fill: var(--c-card);
        stroke: var(--c-muted);
        stroke-width: 1.2;
      }

      .app-card {
        fill: var(--c-soft-2);
        stroke: var(--c-accent-2);
        stroke-width: 1.5;
      }

      .flow {
        stroke: var(--c-line);
        stroke-width: 2;
        fill: none;
        stroke-linejoin: round;
      }

      .flow-acc {
        stroke: var(--c-accent);
        stroke-width: 2;
        fill: none;
        stroke-linejoin: round;
      }

      .flow-dash {
        stroke: var(--c-muted);
        stroke-width: 1.8;
        fill: none;
        stroke-dasharray: 5 4;
        stroke-linejoin: round;
      }

      .divider {
        stroke: var(--c-divider);
        stroke-width: 1;
      }

      .band {
        fill: var(--c-soft);
        stroke: var(--c-accent);
        stroke-width: 1.2;
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="1238" />

  <!-- 열 제목 -->
  <text x="24" y="32" class="hdr">웹이 선언한 것</text>
  <text x="250" y="32" class="hdr">웹뷰 경계</text>
  <text x="486" y="32" class="hdr">사용자가 실제로 만나는 것</text>
  <line x1="24" y1="46" x2="776" y2="46" class="divider" />

  <!-- ================= 1행 select ================= -->
  <g>
    <rect x="24" y="62" width="196" height="46" rx="9" class="web-card" />
    <rect x="24" y="71" width="4" height="28" rx="2" fill="var(--c-accent)" />
    <text x="42" y="90" class="code">select 요소 + CSS 규칙</text>

    <line x1="220" y1="85" x2="238" y2="85" class="flow" />
    <polygon points="250,85 238,79 238,91" fill="var(--c-line)" />

    <rect x="250" y="62" width="206" height="46" rx="9" class="os-card" />
    <rect x="250" y="71" width="4" height="28" rx="2" fill="var(--c-muted)" />
    <text x="268" y="81" class="node">엔진이 브라우저 창</text>
    <text x="268" y="99" class="node">밖으로 렌더</text>

    <line x1="456" y1="85" x2="474" y2="85" class="flow" />
    <polygon points="486,85 474,79 474,91" fill="var(--c-line)" />

    <rect x="486" y="62" width="290" height="46" rx="9" class="os-card" />
    <rect x="486" y="71" width="4" height="28" rx="2" fill="var(--c-muted)" />
    <text x="504" y="90" class="node">OS 제공 피커</text>
    <text x="486" y="126" class="cap">앱 개입 없음, 엔진 버전이 결과를 결정</text>

    <!-- 조건 분기 -->
    <path class="flow-acc" d="M 272 108 V 168 Q 272 178 282 178 H 474" />
    <polygon points="486,178 474,172 474,184" fill="var(--c-accent)" />
    <text x="288" y="142" class="cap-acc">appearance base-select</text>
    <text x="288" y="158" class="cap-acc">지원 엔진일 때</text>

    <rect x="486" y="155" width="290" height="46" rx="9" class="web-card" />
    <rect x="486" y="164" width="4" height="28" rx="2" fill="var(--c-accent)" />
    <text x="504" y="183" class="node">웹이 그린 드롭다운, 접근성 유지</text>
  </g>

  <line x1="24" y1="217" x2="776" y2="217" class="divider" />

  <!-- ================= 2행 날짜 입력 ================= -->
  <g>
    <rect x="24" y="264" width="196" height="46" rx="9" class="web-card" />
    <rect x="24" y="273" width="4" height="28" rx="2" fill="var(--c-accent)" />
    <text x="42" y="292" class="code">input type=date</text>

    <line x1="220" y1="287" x2="238" y2="287" class="flow" />
    <polygon points="250,287 238,281 238,293" fill="var(--c-line)" />

    <rect x="250" y="264" width="206" height="46" rx="9" class="os-card" />
    <rect x="250" y="273" width="4" height="28" rx="2" fill="var(--c-muted)" />
    <text x="268" y="292" class="node">엔진이 type을 아는가</text>

    <path class="flow" d="M 456 287 H 468 V 256" />
    <path class="flow" d="M 468 256 H 474" />
    <polygon points="486,256 474,250 474,262" fill="var(--c-line)" />
    <path class="flow" d="M 468 287 V 318 H 474" />
    <polygon points="486,318 474,312 474,324" fill="var(--c-line)" />

    <rect x="486" y="233" width="290" height="46" rx="9" class="os-card" />
    <rect x="486" y="242" width="4" height="28" rx="2" fill="var(--c-muted)" />
    <text x="504" y="261" class="node">OS 날짜 피커, 표시 형식은 로케일</text>

    <rect x="486" y="295" width="290" height="46" rx="9" class="web-card" />
    <rect x="486" y="304" width="4" height="28" rx="2" fill="var(--c-accent)" />
    <text x="504" y="323" class="node">모르면 텍스트 입력 상태로 처리</text>

    <text x="486" y="359" class="cap">value는 어느 쪽이든 항상 yyyy-mm-dd</text>
  </g>

  <line x1="24" y1="379" x2="776" y2="379" class="divider" />

  <!-- ================= 3행 파일 선택 ================= -->
  <g>
    <rect x="24" y="445" width="196" height="46" rx="9" class="web-card" />
    <rect x="24" y="454" width="4" height="28" rx="2" fill="var(--c-accent)" />
    <text x="42" y="464" class="code">input type=file</text>
    <text x="42" y="482" class="code">+ accept</text>

    <line x1="220" y1="468" x2="353" y2="468" class="flow" />
    <circle cx="353" cy="468" r="3.5" fill="var(--c-line)" />
    <line x1="353" y1="418" x2="353" y2="519" class="flow" />

    <line x1="353" y1="418" x2="474" y2="418" class="flow" />
    <polygon points="486,418 474,412 474,424" fill="var(--c-line)" />
