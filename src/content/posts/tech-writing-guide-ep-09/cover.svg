<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="개발자를 위한 기술문서 입문 시리즈 ep.09 부록 커버">
  <style>
    svg {
      --c-bg: #ECEEF6; --c-fg: #15182A; --c-muted: #5E627A;
      --c-accent: #2C3D8E; --c-accent-2: #A88656; --c-accent-3: #9A3B3B;
      --c-num: rgba(44, 61, 142, 0.14);
      --c-dot: rgba(44, 61, 142, 0.30); --c-line: rgba(44, 61, 142, 0.22);
      --c-card: #FBF8F1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-bg: #14162A; --c-fg: #ECEEF6; --c-muted: #9DA1B8;
        --c-accent: #A0B0EC; --c-accent-2: #D6BA82; --c-accent-3: #D87878;
        --c-num: rgba(160, 176, 236, 0.18);
        --c-dot: rgba(160, 176, 236, 0.24); --c-line: rgba(160, 176, 236, 0.22);
        --c-card: #232326;
      }
    }
    .ep-number { font: 900 240px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--c-num); letter-spacing: -0.04em; }
  </style>
  <defs>
    <pattern id="dotGrid09" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="glowA09" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent)" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="var(--c-accent)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB09" cx="80%" cy="85%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-2)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--c-accent-2)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect fill="var(--c-bg)" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dotGrid09)"/>
  <rect width="1200" height="630" fill="url(#glowA09)"/>
  <rect width="1200" height="630" fill="url(#glowB09)"/>

  <!-- 배경 -->
  <rect x="-200" y="350" width="500" height="500" stroke="var(--c-line)" stroke-width="1.5" fill="none" transform="rotate(8 50 600)"/>
  <circle cx="1300" cy="100" r="380" stroke="var(--c-line)" stroke-width="1.5" fill="none"/>

  <!-- 책 더미를 받치는 선반 (희미하게) -->
  <line x1="220" y1="500" x2="980" y2="500" stroke="var(--c-muted)" stroke-width="2" opacity="0.35"/>

  <!-- 메인 메타포: 세 책 등 (User Manual / Design Doc / Security Doc) -->
  <!-- 책 1: User Manual (파란) -->
  <g transform="translate(320 200) rotate(-6)">
    <rect x="0" y="0" width="110" height="300" rx="3" fill="var(--c-accent)" fill-opacity="0.85" stroke="var(--c-accent)" stroke-width="2"/>
    <!-- 책 등 라인 (위/아래 굵은 띠) -->
    <rect x="0" y="14" width="110" height="3" fill="var(--c-bg)" opacity="0.85"/>
    <rect x="0" y="283" width="110" height="3" fill="var(--c-bg)" opacity="0.85"/>
    <!-- 라벨 (모자이크, 세로 방향) -->
    <g fill="var(--c-bg)" opacity="0.85">
      <rect x="51" y="138" width="8" height="14" rx="1"/>
      <rect x="51" y="156" width="8" height="8" rx="1"/>
      <rect x="51" y="168" width="8" height="14" rx="1"/>
      <rect x="51" y="186" width="8" height="6" rx="1" opacity="0.55"/>
      <rect x="51" y="198" width="8" height="14" rx="1"/>
      <rect x="51" y="216" width="8" height="8" rx="1"/>
      <rect x="51" y="228" width="8" height="14" rx="1"/>
      <rect x="51" y="246" width="8" height="14" rx="1"/>
    </g>
    <!-- 작은 아이콘 (사용자 원) -->
    <circle cx="55" cy="60" r="14" fill="none" stroke="var(--c-bg)" stroke-width="2" opacity="0.85"/>
    <circle cx="55" cy="55" r="5" fill="var(--c-bg)" opacity="0.85"/>
    <path d="M 42 70 Q 55 60 68 70 L 68 76 Q 55 80 42 76 Z" fill="var(--c-bg)" opacity="0.85"/>
  </g>

  <!-- 책 2: Design Doc (황토, 가장 큰 가운데) -->
  <g transform="translate(500 170) rotate(3)">
    <rect x="0" y="0" width="120" height="330" rx="3" fill="var(--c-accent-2)" fill-opacity="0.90" stroke="var(--c-accent-2)" stroke-width="2"/>
    <rect x="0" y="14" width="120" height="3" fill="var(--c-bg)" opacity="0.85"/>
    <rect x="0" y="313" width="120" height="3" fill="var(--c-bg)" opacity="0.85"/>
    <!-- 라벨 (모자이크, 세로 방향) -->
    <g fill="var(--c-bg)" opacity="0.85">
      <rect x="56" y="148" width="8" height="14" rx="1"/>
      <rect x="56" y="166" width="8" height="8" rx="1"/>
      <rect x="56" y="178" width="8" height="14" rx="1"/>
      <rect x="56" y="196" width="8" height="14" rx="1"/>
      <rect x="56" y="214" width="8" height="6" rx="1" opacity="0.55"/>
      <rect x="56" y="226" width="8" height="14" rx="1"/>
      <rect x="56" y="244" width="8" height="14" rx="1"/>
      <rect x="56" y="262" width="8" height="14" rx="1"/>
    </g>
    <!-- 작은 아이콘 (사각형) -->
    <rect x="44" y="50" width="32" height="32" rx="3" fill="none" stroke="var(--c-bg)" stroke-width="2" opacity="0.85"/>
    <line x1="50" y1="60" x2="70" y2="60" stroke="var(--c-bg)" stroke-width="1.5" opacity="0.85"/>
    <line x1="50" y1="68" x2="65" y2="68" stroke="var(--c-bg)" stroke-width="1.5" opacity="0.85"/>
    <line x1="50" y1="76" x2="70" y2="76" stroke="var(--c-bg)" stroke-width="1.5" opacity="0.85"/>
  </g>

  <!-- 책 3: Security Doc (적색) -->
  <g transform="translate(700 210) rotate(-4)">
    <rect x="0" y="0" width="110" height="290" rx="3" fill="var(--c-accent-3)" fill-opacity="0.88" stroke="var(--c-accent-3)" stroke-width="2"/>
    <rect x="0" y="14" width="110" height="3" fill="var(--c-bg)" opacity="0.85"/>
    <rect x="0" y="273" width="110" height="3" fill="var(--c-bg)" opacity="0.85"/>
    <!-- 라벨 (모자이크, 세로 방향) -->
    <g fill="var(--c-bg)" opacity="0.85">
      <rect x="51" y="148" width="8" height="14" rx="1"/>
      <rect x="51" y="166" width="8" height="8" rx="1"/>
      <rect x="51" y="178" width="8" height="14" rx="1"/>
      <rect x="51" y="196" width="8" height="14" rx="1"/>
      <rect x="51" y="214" width="8" height="14" rx="1"/>
      <rect x="51" y="232" width="8" height="8" rx="1"/>
      <rect x="51" y="244" width="8" height="14" rx="1"/>
    </g>
    <!-- 작은 아이콘 (삼각형 경고) -->
    <polygon points="55,46 72,76 38,76" fill="none" stroke="var(--c-bg)" stroke-width="2" opacity="0.85"/>
    <rect x="53" y="56" width="4" height="10" rx="1" fill="var(--c-bg)" opacity="0.85"/>
    <circle cx="55" cy="71" r="2" fill="var(--c-bg)" opacity="0.85"/>
  </g>

  <!-- 디테일: 시리즈를 가리키는 작은 책들 (회색, 배경) -->
  <g transform="translate(180 280) rotate(-10)" opacity="0.55">
    <rect x="0" y="0" width="36" height="180" rx="2" stroke="var(--c-line)" stroke-width="1.5" fill="none"/>
    <rect x="44" y="-10" width="36" height="190" rx="2" stroke="var(--c-line)" stroke-width="1.5" fill="none"/>
  </g>

  <g transform="translate(940 290) rotate(8)" opacity="0.55">
    <rect x="0" y="0" width="36" height="170" rx="2" stroke="var(--c-line)" stroke-width="1.5" fill="none"/>
    <rect x="44" y="-12" width="36" height="184" rx="2" stroke="var(--c-line)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- 디테일: 점 무리 -->
  <g transform="translate(140 130)" opacity="0.7">
    <circle cx="0" cy="0" r="3" fill="var(--c-accent)"/>
    <circle cx="12" cy="6" r="2.5" fill="var(--c-accent)" opacity="0.7"/>
    <circle cx="-8" cy="10" r="2" fill="var(--c-accent)" opacity="0.85"/>
  </g>

  <!-- 디테일: 시리즈 마침을 알리는 작은 별표 -->
  <g transform="translate(940 130) rotate(15)">
    <polygon points="0,-16 4,-5 16,-5 7,2 10,14 0,8 -10,14 -7,2 -16,-5 -4,-5"
             fill="var(--c-accent-3)" fill-opacity="0.75"/>
  </g>

  <!-- 라벨: APPENDIX (모자이크) -->
  <g transform="translate(540 74)">
    <rect x="0" y="0" width="14" height="2" rx="1" fill="var(--c-muted)"/>
    <g transform="translate(22 -2)">
      <rect x="0" y="0" width="14" height="6" rx="1" fill="var(--c-muted)"/>
      <rect x="18" y="0" width="6" height="6" rx="1" fill="var(--c-muted)"/>
      <rect x="28" y="0" width="14" height="6" rx="1" fill="var(--c-muted)"/>
      <rect x="46" y="0" width="6" height="6" rx="1" fill="var(--c-muted)"/>
      <rect x="56" y="0" width="22" height="6" rx="1" fill="var(--c-muted)"/>
      <rect x="82" y="0" width="14" height="6" rx="1" fill="var(--c-muted)"/>
    </g>
    <rect x="124" y="0" width="14" height="2" rx="1" fill="var(--c-muted)"/>
  </g>

  <!-- 시리즈 번호 -->
  <text class="ep-number" x="1164" y="594" text-anchor="end">09</text>
</svg>
