<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">State와 폼 상태 머신 — ep.10 커버</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-num: rgba(26,31,46,0.07); --c-dot: #1A1F2E; --c-line: #1A1F2E;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-num: rgba(232,230,225,0.07); --c-dot: #E8E6E1; --c-line: #E8E6E1;
        }
      }
      .bg { fill: var(--c-bg); }
      .num { fill: var(--c-num); font-family: 'Inter',system-ui,sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -0.04em; }
    </style>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--c-dot)" opacity="0.10"/>
    </pattern>
    <radialGradient id="grad1" cx="20%" cy="60%" r="55%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="85%" cy="40%" r="50%">
      <stop offset="0%" stop-color="var(--c-accent-3)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--c-accent-3)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- 배경 stroke 도형 -->
  <circle cx="100" cy="100" r="220" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.13"/>
  <rect x="780" y="430" width="500" height="320" fill="none" stroke="var(--c-line)" stroke-width="1.5" opacity="0.12" transform="rotate(7 1030 600)"/>

  <!-- 5개 상태 노드 (좌→우 흐름) -->
  <!-- 1. idle -->
  <g transform="translate(160 315)">
    <circle r="55" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>
    <circle r="6" cy="0" fill="var(--c-line)" opacity="0.4"/>
  </g>

  <!-- 2. validating -->
  <g transform="translate(360 315)">
    <circle r="55" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="2"/>
    <!-- 회전 점 (in-progress 느낌) -->
    <circle r="6" cx="-8" cy="0" fill="var(--c-accent-3)"/>
    <circle r="6" cx="8" cy="0" fill="var(--c-accent-3)" opacity="0.6"/>
  </g>

  <!-- 3. submitting (강조 — 현재 상태) -->
  <g transform="translate(580 315)">
    <!-- 포커스 링 -->
    <circle r="70" fill="none" stroke="var(--c-accent-3)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.6"/>
    <circle r="60" fill="var(--c-bg)" stroke="var(--c-accent-3)" stroke-width="3"/>
    <!-- 진행 표시 -->
    <circle r="6" cx="-16" cy="0" fill="var(--c-accent-3)"/>
    <circle r="6" cx="0" cy="0" fill="var(--c-accent-3)"/>
    <circle r="6" cx="16" cy="0" fill="var(--c-accent-3)" opacity="0.5"/>
  </g>

  <!-- 4. success -->
  <g transform="translate(820 220)">
    <circle r="55" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>
    <!-- 체크 -->
    <polyline points="-16,0 -5,11 16,-12" fill="none" stroke="var(--c-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 5. error -->
  <g transform="translate(820 420)">
    <circle r="55" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="2"/>
    <!-- X -->
    <line x1="-13" y1="-13" x2="13" y2="13" stroke="var(--c-accent-2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="13" y1="-13" x2="-13" y2="13" stroke="var(--c-accent-2)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 전이 화살표 -->
  <g>
    <!-- idle → validating -->
    <line x1="215" y1="315" x2="305" y2="315" stroke="var(--c-line)" stroke-width="2" opacity="0.7"/>
    <polygon points="305,310 315,315 305,320" fill="var(--c-line)" opacity="0.7"/>

    <!-- validating → submitting -->
    <line x1="415" y1="315" x2="520" y2="315" stroke="var(--c-line)" stroke-width="2" opacity="0.7"/>
    <polygon points="520,310 530,315 520,320" fill="var(--c-line)" opacity="0.7"/>

    <!-- submitting → success (위로) -->
    <path d="M 625 275 Q 700 240 770 230" fill="none" stroke="var(--c-line)" stroke-width="2" opacity="0.7"/>
    <polygon points="770,230 762,228 766,238" fill="var(--c-line)" opacity="0.7" transform="rotate(-15 770 230)"/>

    <!-- submitting → error (아래로) -->
    <path d="M 625 355 Q 700 400 770 410" fill="none" stroke="var(--c-line)" stroke-width="2" opacity="0.7"/>
    <polygon points="770,410 762,408 766,418" fill="var(--c-line)" opacity="0.7" transform="rotate(15 770 410)"/>

    <!-- error → idle (retry, 곡선) -->
    <path d="M 820 475 Q 700 560 200 460 Q 140 420 140 360" fill="none" stroke="var(--c-line)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
    <polygon points="140,360 135,370 145,370" fill="var(--c-line)" opacity="0.5"/>
  </g>

  <!-- 우상단 동심원 -->
  <g transform="translate(1050 130)" opacity="0.7">
    <circle r="48" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
    <circle r="28" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 좌상단 작은 점 무리 -->
  <g transform="translate(220 110)">
    <circle r="4" fill="var(--c-accent)"/>
    <circle cx="16" r="4" fill="var(--c-accent)" opacity="0.6"/>
    <circle cx="32" r="4" fill="var(--c-accent)" opacity="0.3"/>
  </g>

  <!-- 좌하단 회전 사각형 -->
  <g transform="translate(140 540) rotate(-12)" opacity="0.7">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="var(--c-accent-2)" stroke-width="1.5"/>
  </g>

  <!-- 우하단 큰 시리즈 번호 -->
  <text x="1130" y="575" class="num" text-anchor="end">10</text>
</svg>
