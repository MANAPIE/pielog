<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-st">
  <title id="title-st">State 패턴 — Order Context와 다섯 가지 상태 객체</title>
  <defs>
    <style>
      :root {
        --c-bg: #FAFAF7; --c-fg: #1A1F2E; --c-muted: #6B7280;
        --c-accent: #C02D6E; --c-accent-2: #D97757; --c-accent-3: #A65AA8;
        --c-line: #1A1F2E; --c-card: #FFFFFF;
        --c-soft-3: rgba(139,122,184,0.12); --c-divider: rgba(26,31,46,0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #0F1419; --c-fg: #E8E6E1; --c-muted: #8B92A0;
          --c-accent: #EC85B5; --c-accent-2: #E89376; --c-accent-3: #CE9DD2;
          --c-line: #E8E6E1; --c-card: #161B22;
          --c-soft-3: rgba(176,160,218,0.16); --c-divider: rgba(232,230,225,0.18);
        }
      }
      .bg { fill: var(--c-bg); }
      .box { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.4; }
      .box-ctx { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.8; }
      .box-state { fill: var(--c-card); stroke: var(--c-accent-3); stroke-width: 1.6; }
      .box-iface { fill: var(--c-card); stroke: var(--c-line); stroke-width: 1.4; stroke-dasharray: 5 3; }
      .line { stroke: var(--c-line); stroke-width: 1.3; fill: none; }
      .line-dashed { stroke: var(--c-line); stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; }
      .line-trans { stroke: var(--c-accent-3); stroke-width: 1.6; fill: none; }
      .col-label { font-family: 'Inter',system-ui,sans-serif; font-size: 11px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.14em; }
      .stereo { font-family: 'Inter',system-ui,sans-serif; font-size: 10.5px; fill: var(--c-muted); font-style: italic; }
      .cname { font-family: 'Inter',system-ui,sans-serif; font-size: 13px; font-weight: 700; fill: var(--c-fg); }
      .sig { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; fill: var(--c-fg); }
      .sig-mute { font-family: 'JetBrains Mono','SF Mono',monospace; font-size: 11px; fill: var(--c-muted); }
      .annot { font-family: 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; font-size: 11px; fill: var(--c-muted); }
      .trans-label { font-family: 'Inter',system-ui,sans-serif; font-size: 10.5px; fill: var(--c-accent-3); font-weight: 700; }
    </style>
    <marker id="ar-st" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="var(--c-accent-3)"/>
    </marker>
    <marker id="diamond-st" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <polygon points="2,2 12,7 2,12 0,7" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.3"/>
    </marker>
    <marker id="tri-st" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="var(--c-bg)" stroke="var(--c-line)" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="660"/>

  <text x="60" y="36" class="col-label">CONTEXT</text>
  <text x="500" y="36" class="col-label">STATE INTERFACE &amp; CONCRETES</text>

  <!-- Context: Order -->
  <g transform="translate(60 80)">
    <rect width="280" height="152" rx="6" class="box-ctx"/>
    <text x="140" y="28" class="cname" text-anchor="middle">Order</text>
    <line x1="14" y1="42" x2="266" y2="42" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="14" y="62" class="sig-mute">- state: OrderState</text>
    <line x1="14" y1="76" x2="266" y2="76" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="14" y="96" class="sig">+ cancel(): state.cancel(this)</text>
    <text x="14" y="114" class="sig">+ ship(): state.ship(this)</text>
    <text x="14" y="132" class="sig">+ setState(s)</text>
  </g>

  <!-- 컴포지션 -->
  <line x1="340" y1="156" x2="490" y2="156" class="line" marker-start="url(#diamond-st)"/>
  <text x="415" y="148" class="annot" text-anchor="middle">state</text>

  <!-- State 인터페이스 -->
  <g transform="translate(490 100)">
    <rect width="240" height="112" rx="4" class="box-iface"/>
    <text x="120" y="22" class="stereo" text-anchor="middle">«interface»</text>
    <text x="120" y="44" class="cname" text-anchor="middle" font-style="italic">OrderState</text>
    <line x1="14" y1="56" x2="226" y2="56" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="14" y="76" class="sig">+ cancel(order)</text>
    <text x="14" y="92" class="sig">+ ship(order)</text>
  </g>

  <!-- 다섯 State 구현체 -->
  <g transform="translate(60 300)">
    <rect width="200" height="92" rx="5" class="box-state"/>
    <text x="100" y="26" class="cname" text-anchor="middle">DraftState</text>
    <line x1="14" y1="40" x2="186" y2="40" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="14" y="58" class="annot">cancel → Cancelled</text>
    <text x="14" y="72" class="annot">ship → throw</text>
  </g>

  <g transform="translate(280 300)">
    <rect width="200" height="92" rx="5" class="box-state"/>
    <text x="100" y="26" class="cname" text-anchor="middle">SubmittedState</text>
    <line x1="14" y1="40" x2="186" y2="40" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="14" y="58" class="annot">cancel → Cancelled</text>
    <text x="14" y="72" class="annot">ship → throw (unpaid)</text>
  </g>

  <g transform="translate(500 300)">
    <rect width="200" height="92" rx="5" class="box-state"/>
    <text x="100" y="26" class="cname" text-anchor="middle">PaidState</text>
    <line x1="14" y1="40" x2="186" y2="40" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="14" y="58" class="annot">cancel → refund</text>
    <text x="14" y="72" class="annot">ship → Shipped</text>
  </g>

  <g transform="translate(720 300)">
    <rect width="200" height="92" rx="5" class="box-state"/>
    <text x="100" y="26" class="cname" text-anchor="middle">ShippedState</text>
    <line x1="14" y1="40" x2="186" y2="40" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="14" y="58" class="annot">cancel → throw</text>
    <text x="14" y="72" class="annot">ship → throw (done)</text>
  </g>

  <g transform="translate(940 300)">
    <rect width="200" height="92" rx="5" class="box-state"/>
    <text x="100" y="26" class="cname" text-anchor="middle">DeliveredState</text>
    <line x1="14" y1="40" x2="186" y2="40" stroke="var(--c-divider)" stroke-width="1"/>
    <text x="14" y="58" class="annot">cancel → throw</text>
    <text x="14" y="72" class="annot">ship → throw</text>
  </g>

  <!-- 구현 화살표 (점선 + 삼각) -->
  <line x1="160" y1="300" x2="540" y2="212" class="line-dashed" marker-end="url(#tri-st)" opacity="0.5"/>
  <line x1="380" y1="300" x2="580" y2="212" class="line-dashed" marker-end="url(#tri-st)" opacity="0.5"/>
  <line x1="600" y1="300" x2="610" y2="212" class="line-dashed" marker-end="url(#tri-st)" opacity="0.5"/>
  <line x1="820" y1="300" x2="650" y2="212" class="line-dashed" marker-end="url(#tri-st)" opacity="0.5"/>
  <line x1="1040" y1="300" x2="690" y2="212" class="line-dashed" marker-end="url(#tri-st)" opacity="0.5"/>

  <!-- 하단: 전이 흐름 -->
  <g transform="translate(60 450)">
    <text x="0" y="0" class="col-label">STATE TRANSITIONS</text>

    <g transform="translate(0 30)">
      <!-- 5 노드 가로 -->
      <circle cx="60" cy="50" r="32" class="box-state"/>
      <text x="60" y="56" class="cname" text-anchor="middle">draft</text>

      <circle cx="290" cy="50" r="32" class="box-state"/>
      <text x="290" y="56" class="cname" text-anchor="middle">submitted</text>

      <circle cx="520" cy="50" r="32" class="box-state"/>
      <text x="520" y="56" class="cname" text-anchor="middle">paid</text>

      <circle cx="750" cy="50" r="32" class="box-state"/>
      <text x="750" y="56" class="cname" text-anchor="middle">shipped</text>

      <circle cx="980" cy="50" r="32" class="box-state"/>
      <text x="980" y="56" class="cname" text-anchor="middle">delivered</text>

      <!-- 전이 화살표 -->
      <line x1="92" y1="50" x2="258" y2="50" class="line-trans" marker-end="url(#ar-st)"/>
      <text x="175" y="42" class="trans-label" text-anchor="middle">submit</text>

      <line x1="322" y1="50" x2="488" y2="50" class="line-trans" marker-end="url(#ar-st)"/>
      <text x="405" y="42" class="trans-label" text-anchor="middle">pay</text>

      <line x1="552" y1="50" x2="718" y2="50" class="line-trans" marker-end="url(#ar-st)"/>
      <text x="635" y="42" class="trans-label" text-anchor="middle">ship</text>

      <line x1="782" y1="50" x2="948" y2="50" class="line-trans" marker-end="url(#ar-st)"/>
      <text x="865" y="42" class="trans-label" text-anchor="middle">deliver</text>

      <!-- cancel 분기 (paid에서 아래로) -->
      <circle cx="520" cy="130" r="28" fill="var(--c-card)" stroke="var(--c-accent-2)" stroke-width="1.6"/>
      <text x="520" y="135" class="cname" text-anchor="middle" font-size="11">cancelled</text>
      <line x1="520" y1="82" x2="520" y2="102" stroke="var(--c-accent-2)" stroke-width="1.6" marker-end="url(#ar-st)"/>
      <text x="555" y="98" class="trans-label" fill="var(--c-accent-2)">cancel + refund</text>
    </g>
  </g>
</svg>
