<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dark Pattern → Bright Pattern 리디자인 비교 (5쌍)</title>
<desc>다크패턴과 그에 대응하는 브라이트패턴을 Before/After로 나란히 비교한 5개 쌍</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #B4B2A9; stroke-width: 0.5; fill: none; }
  .c-coral rect { fill: #FAECE7; stroke: #F0997B; }
  .c-coral text { fill: #4A1B0C; }
  .c-teal rect { fill: #E1F5EE; stroke: #5DCAA5; }
  .c-teal text { fill: #085041; }
  .c-gray rect { fill: #F1EFE8; stroke: #D3D1C7; }
  .c-gray text { fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #D3D1C7; }
    .ts { fill: #B4B2A9; }
    .arr { stroke: #5F5E5A; }
    .c-coral rect { fill: #3A1A0E; stroke: #A03A1F; }
    .c-coral text { fill: #F8C9B5; }
    .c-teal rect { fill: #04342C; stroke: #0F6E56; }
    .c-teal text { fill: #9FE1CB; }
    .c-gray rect { fill: #2C2C2A; stroke: #444441; }
    .c-gray text { fill: #B4B2A9; }
    .c-gray .th { fill: #D3D1C7; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Header -->
<text class="th" x="200" y="30" text-anchor="middle" dominant-baseline="central">Dark</text>
<text class="th" x="500" y="30" text-anchor="middle" dominant-baseline="central">Bright</text>

<!-- Row 1: Confirmshaming -->
<text class="ts" x="50" y="72" dominant-baseline="central">거절 카피</text>
<g class="c-coral"><rect x="100" y="52" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts" x="200" y="72" text-anchor="middle" dominant-baseline="central">"할인이 필요 없습니다"</text></g>
<line x1="310" y1="72" x2="390" y2="72" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="52" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts" x="500" y="72" text-anchor="middle" dominant-baseline="central">"닫기"</text></g>

<!-- Row 2: Hidden Cost -->
<text class="ts" x="50" y="132" dominant-baseline="central">가격 공개</text>
<g class="c-coral"><rect x="100" y="108" width="200" height="48" rx="6" stroke-width="0.5"/>
<text class="ts" x="200" y="123" text-anchor="middle" dominant-baseline="central">상품가 9,900원</text>
<text class="ts" x="200" y="141" text-anchor="middle" dominant-baseline="central">(수수료는 결제 시)</text></g>
<line x1="310" y1="132" x2="390" y2="132" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="108" width="200" height="48" rx="6" stroke-width="0.5"/>
<text class="ts" x="500" y="123" text-anchor="middle" dominant-baseline="central">총 13,400원</text>
<text class="ts" x="500" y="141" text-anchor="middle" dominant-baseline="central">(상품+배송+수수료)</text></g>

<!-- Row 3: Hard to Cancel -->
<text class="ts" x="50" y="200" dominant-baseline="central">해지 경로</text>
<g class="c-coral"><rect x="100" y="180" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts" x="200" y="200" text-anchor="middle" dominant-baseline="central">8단계, 전화 필요</text></g>
<line x1="310" y1="200" x2="390" y2="200" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="180" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts" x="500" y="200" text-anchor="middle" dominant-baseline="central">2클릭, 온라인 해지</text></g>

<!-- Row 4: Pre-selection -->
<text class="ts" x="50" y="264" dominant-baseline="central">기본값</text>
<g class="c-coral"><rect x="100" y="244" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts" x="200" y="264" text-anchor="middle" dominant-baseline="central">추가 보험 사전 체크</text></g>
<line x1="310" y1="264" x2="390" y2="264" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="244" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts" x="500" y="264" text-anchor="middle" dominant-baseline="central">기본 해제, 선택 유도</text></g>

<!-- Row 5: Nagging -->
<text class="ts" x="50" y="328" dominant-baseline="central">반복 요청</text>
<g class="c-coral"><rect x="100" y="308" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts" x="200" y="328" text-anchor="middle" dominant-baseline="central">매 세션 팝업 반복</text></g>
<line x1="310" y1="328" x2="390" y2="328" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="308" width="200" height="40" rx="6" stroke-width="0.5"/>
<text class="ts" x="500" y="328" text-anchor="middle" dominant-baseline="central">1회 + "다시 안 보기"</text></g>

<!-- 핵심 원칙 -->
<g class="c-gray"><rect x="100" y="380" width="500" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="350" y="400" text-anchor="middle" dominant-baseline="central">핵심: 비즈니스 목표를 포기하지 않는다</text>
<text class="ts" x="350" y="420" text-anchor="middle" dominant-baseline="central">경로만 바꾼다: 기만이 아닌 투명성으로</text></g>

<!-- Legend -->
<g class="c-coral"><rect x="160" y="464" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="178" y="470" dominant-baseline="central">Dark Pattern</text>
<g class="c-teal"><rect x="340" y="464" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="358" y="470" dominant-baseline="central">Bright Pattern</text>
</svg>
