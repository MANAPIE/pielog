<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
<title>다크패턴 교육자료 시리즈: 한 페이지 요약</title>
<desc>5가지 핵심 원칙과 6개 여정 단계별 점검 항목을 요약한 시리즈 종합 인포그래픽</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .c-purple rect { fill: #EEEDFE; stroke: #AFA9EC; }
  .c-purple text { fill: #3C3489; }
  .c-teal rect { fill: #E1F5EE; stroke: #5DCAA5; }
  .c-teal text { fill: #085041; }
  .c-blue rect { fill: #E5EFFA; stroke: #8DB7E0; }
  .c-blue text { fill: #0A2E54; }
  .c-amber rect { fill: #FAEEDA; stroke: #FAC775; }
  .c-amber text { fill: #633806; }
  .c-coral rect { fill: #FAECE7; stroke: #F0997B; }
  .c-coral text { fill: #4A1B0C; }
  .c-red rect { fill: #FCEBEB; stroke: #F09595; }
  .c-red text { fill: #791F1F; }
  .c-gray rect { fill: #F1EFE8; stroke: #D3D1C7; }
  .c-gray text { fill: #5F5E5A; }
  .c-gray .th { fill: #2C2C2A; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #D3D1C7; }
    .ts { fill: #B4B2A9; }
    .c-purple rect { fill: #26215C; stroke: #534AB7; }
    .c-purple text { fill: #CECBF6; }
    .c-teal rect { fill: #04342C; stroke: #0F6E56; }
    .c-teal text { fill: #9FE1CB; }
    .c-blue rect { fill: #0A2E54; stroke: #134B85; }
    .c-blue text { fill: #B0D4F4; }
    .c-amber rect { fill: #412402; stroke: #854F0B; }
    .c-amber text { fill: #FAC775; }
    .c-coral rect { fill: #3A1A0E; stroke: #A03A1F; }
    .c-coral text { fill: #F8C9B5; }
    .c-red rect { fill: #501313; stroke: #A32D2D; }
    .c-red text { fill: #F7C1C1; }
    .c-gray rect { fill: #2C2C2A; stroke: #444441; }
    .c-gray text { fill: #B4B2A9; }
    .c-gray .th { fill: #D3D1C7; }
  }
</style>

<!-- Title -->
<text class="th" x="340" y="30" text-anchor="middle" dominant-baseline="central">다크패턴 방지: 5가지 핵심 원칙</text>

<!-- Principle cards -->
<g class="c-purple"><rect x="40" y="50" width="116" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="98" y="70" text-anchor="middle" dominant-baseline="central">투명성</text>
<text class="ts" x="98" y="90" text-anchor="middle" dominant-baseline="central">이해할 수 있는가</text></g>

<g class="c-teal"><rect x="168" y="50" width="116" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="226" y="70" text-anchor="middle" dominant-baseline="central">대칭성</text>
<text class="ts" x="226" y="90" text-anchor="middle" dominant-baseline="central">들어감 = 나옴</text></g>

<g class="c-blue"><rect x="296" y="50" width="116" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="354" y="70" text-anchor="middle" dominant-baseline="central">기본값</text>
<text class="ts" x="354" y="90" text-anchor="middle" dominant-baseline="central">사용자 이익 우선</text></g>

<g class="c-amber"><rect x="424" y="50" width="116" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="482" y="70" text-anchor="middle" dominant-baseline="central">비례성</text>
<text class="ts" x="482" y="90" text-anchor="middle" dominant-baseline="central">요구 = 가치</text></g>

<g class="c-coral"><rect x="552" y="50" width="116" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="610" y="70" text-anchor="middle" dominant-baseline="central">명료성</text>
<text class="ts" x="610" y="90" text-anchor="middle" dominant-baseline="central">이중 부정 없음</text></g>

<!-- Journey stage checklist -->
<text class="th" x="340" y="146" text-anchor="middle" dominant-baseline="central">여정 단계별 점검</text>

<!-- Row headers and check items -->
<!-- Stage 1: 가입 -->
<g class="c-purple"><rect x="40" y="168" width="110" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="95" y="186" text-anchor="middle" dominant-baseline="central">가입·온보딩</text></g>
<text class="ts" x="166" y="180" dominant-baseline="central">사전체크 없음</text>
<text class="ts" x="166" y="196" dominant-baseline="central">필수/선택 분리, 권한 타이밍</text>

<!-- Stage 2: 결제 -->
<g class="c-teal"><rect x="40" y="216" width="110" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="95" y="234" text-anchor="middle" dominant-baseline="central">결제</text></g>
<text class="ts" x="166" y="228" dominant-baseline="central">총 비용 사전 공개</text>
<text class="ts" x="166" y="244" dominant-baseline="central">장바구니 자동 추가 없음</text>

<!-- Stage 3: 구독·해지 -->
<g class="c-blue"><rect x="40" y="264" width="110" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="95" y="282" text-anchor="middle" dominant-baseline="central">구독·해지</text></g>
<text class="ts" x="166" y="276" dominant-baseline="central">가입 ≒ 해지 단계 수</text>
<text class="ts" x="166" y="292" dominant-baseline="central">자동갱신 사전고지</text>

<!-- Stage 4: UI -->
<g class="c-amber"><rect x="40" y="312" width="110" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="95" y="330" text-anchor="middle" dominant-baseline="central">UI 전반</text></g>
<text class="ts" x="166" y="324" dominant-baseline="central">버튼 대칭, 색상 중립</text>
<text class="ts" x="166" y="340" dominant-baseline="central">광고 명확 구분</text>

<!-- Stage 5: 카피·알림 -->
<g class="c-coral"><rect x="40" y="360" width="110" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="95" y="378" text-anchor="middle" dominant-baseline="central">카피·알림</text></g>
<text class="ts" x="166" y="372" dominant-baseline="central">거절 카피 중립</text>
<text class="ts" x="166" y="388" dominant-baseline="central">반복 제한, 영구 거절 옵션</text>

<!-- Stage 6: 법규 -->
<g class="c-red"><rect x="40" y="408" width="110" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="95" y="426" text-anchor="middle" dominant-baseline="central">법규 준수</text></g>
<text class="ts" x="166" y="420" dominant-baseline="central">공정위 6유형 확인</text>
<text class="ts" x="166" y="436" dominant-baseline="central">EU DSA, FTC/ROSCA 요건</text>

<!-- Bottom quote -->
<g class="c-gray"><rect x="40" y="470" width="630" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="488" text-anchor="middle" dominant-baseline="central">"이 설계가 사용자의 판단을 돕는가, 흐리는가?"</text>
<text class="ts" x="340" y="508" text-anchor="middle" dominant-baseline="central">이 질문을 습관적으로 던지는 것만으로도 대부분의 다크패턴은 방지된다</text></g>
</svg>
