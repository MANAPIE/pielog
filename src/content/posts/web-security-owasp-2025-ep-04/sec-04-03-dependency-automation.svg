<svg viewBox="0 0 720 424" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="의존성 자동화 워크플로우 - Dependabot과 Renovate">
  <style>
    /* sec-theme-vars */
    :root {
      --sec-fg: #0f172a;
      --sec-fg-muted: #64748b;
      --sec-bg: #ffffff;
      --sec-border: #e2e8f0;
      --sec-slate-50: #f8fafc;
      --sec-slate-100: #f1f5f9;
      --sec-slate-200: #e2e8f0;
      --sec-slate-300: #cbd5e1;
      --sec-slate-400: #94a3b8;
      --sec-slate-500: #64748b;
      --sec-slate-700: #334155;
      --sec-blue-50: #eff6ff;
      --sec-blue-200: #bfdbfe;
      --sec-blue-500: #3b82f6;
      --sec-blue-700: #1d4ed8;
      --sec-red-50: #fef2f2;
      --sec-red-100: #fee2e2;
      --sec-red-200: #fecaca;
      --sec-red-500: #ef4444;
      --sec-red-700: #b91c1c;
      --sec-amber-50: #fffbeb;
      --sec-amber-100: #fef3c7;
      --sec-amber-200: #fde68a;
      --sec-amber-500: #f59e0b;
      --sec-amber-700: #b45309;
      --sec-emerald-50: #ecfdf5;
      --sec-emerald-100: #d1fae5;
      --sec-emerald-200: #a7f3d0;
      --sec-emerald-500: #10b981;
      --sec-emerald-700: #047857;
      --sec-violet-50: #f5f3ff;
      --sec-violet-200: #ddd6fe;
      --sec-violet-500: #8b5cf6;
      --sec-violet-700: #6d28d9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --sec-fg: #e2e8f0;
        --sec-fg-muted: #94a3b8;
        --sec-bg: #0f172a;
        --sec-border: #334155;
        --sec-slate-50: #1e293b;
        --sec-slate-100: #334155;
        --sec-slate-200: #475569;
        --sec-slate-300: #64748b;
        --sec-slate-400: #94a3b8;
        --sec-slate-500: #cbd5e1;
        --sec-slate-700: #e2e8f0;
        --sec-blue-50: #172554;
        --sec-blue-200: #1e40af;
        --sec-blue-500: #60a5fa;
        --sec-blue-700: #93c5fd;
        --sec-red-50: #450a0a;
        --sec-red-100: #7f1d1d;
        --sec-red-200: #991b1b;
        --sec-red-500: #f87171;
        --sec-red-700: #fca5a5;
        --sec-amber-50: #451a03;
        --sec-amber-100: #78350f;
        --sec-amber-200: #92400e;
        --sec-amber-500: #fbbf24;
        --sec-amber-700: #fcd34d;
        --sec-emerald-50: #022c22;
        --sec-emerald-100: #064e3b;
        --sec-emerald-200: #065f46;
        --sec-emerald-500: #34d399;
        --sec-emerald-700: #6ee7b7;
        --sec-violet-50: #2e1065;
        --sec-violet-200: #5b21b6;
        --sec-violet-500: #a78bfa;
        --sec-violet-700: #c4b5fd;
      }
    }

    .title {
      font: 600 16px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .caption {
      font: 400 11px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .step-num {
      font: 700 14px system-ui, sans-serif;
      fill: var(--sec-bg, #ffffff);
    }

    .step-title {
      font: 600 13px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .step-desc {
      font: 400 11px system-ui, sans-serif;
      fill: var(--sec-fg-muted, #64748b);
    }

    .label {
      font: 500 11px system-ui, sans-serif;
      fill: var(--sec-fg, #0f172a);
    }

    .label2 {
      font: 500 11px system-ui, sans-serif;
    }

    .mono-sm {
      font: 400 10px "SF Mono", ui-monospace, monospace;
    }

    .step-bg {
      fill: var(--sec-slate-50, #f8fafc);
      stroke: var(--sec-slate-200, #e2e8f0);
    }

    .num-circle {
      fill: var(--sec-blue-500, #3b82f6);
    }

    .num-circle-good {
      fill: var(--sec-emerald-500, #10b981);
    }

    .arrow {
      stroke: var(--sec-slate-500, #64748b);
      stroke-width: 1.4;
      fill: none;
    }

    .branch {
      stroke: var(--sec-slate-400, #94a3b8);
      stroke-width: 1;
      fill: none;
      stroke-dasharray: 3 3;
    }

    .test-pass {
      fill: var(--sec-emerald-100, #d1fae5);
      stroke: var(--sec-emerald-500, #10b981);
    }

    .test-fail {
      fill: var(--sec-red-100, #fee2e2);
      stroke: var(--sec-red-500, #ef4444);
    }
  </style>

  <defs>
    <marker id="renarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sec-slate-500, #64748b)" />
    </marker>
  </defs>

  <text x="24" y="36" class="title">의존성 자동화: 사람 손에서 도구로</text>
  <text x="24" y="56" class="caption">"매주 모두 npm outdated 돌리세요"는 작동하지 않습니다. 자동 PR과 자동 테스트가 기본입니다.</text>

  <!-- Step 1 -->
  <rect x="24" y="88" width="147" height="132" rx="12" class="step-bg" stroke-width="1" />
  <g transform="translate(3, 3)">
    <circle cx="44" cy="108" r="14" class="num-circle" />
    <text x="44" y="113" text-anchor="middle" class="step-num">1</text>
    <text x="64" y="114" class="step-title">감지</text>
    <g transform="translate(-4, 0)">
      <text x="40" y="140" class="step-desc">신규 버전 또는</text>
      <text x="40" y="156" class="step-desc">CVE 발표 자동 감지</text>
      <text x="40" y="184" class="label">도구</text>
      <text x="40" y="200" class="step-desc">Dependabot · Renovate</text>
    </g>
  </g>

  <line x1="171" y1="148" x2="199" y2="148" class="arrow" marker-end="url(#renarr)" />

  <!-- Step 2 -->
  <rect x="199" y="88" width="147" height="132" rx="12" class="step-bg" stroke-width="1" />
  <g transform="translate(3, 3)">
    <circle cx="219" cy="108" r="14" class="num-circle" />
    <text x="219" y="113" text-anchor="middle" class="step-num">2</text>
    <text x="239" y="114" class="step-title">PR 자동 생성</text>
    <g transform="translate(-4, 0)">
      <text x="215" y="140" class="step-desc">변경 사항 + Changelog +</text>
      <text x="215" y="156" class="step-desc">호환성 점수 포함</text>
      <text x="215" y="184" class="label">정보</text>
      <text x="215" y="200" class="step-desc">취약점 ID, 영향 범위</text>
    </g>
  </g>

  <line x1="346" y1="148" x2="374" y2="148" class="arrow" marker-end="url(#renarr)" />

  <!-- Step 3 -->
  <rect x="374" y="88" width="147" height="132" rx="12" class="step-bg" stroke-width="1" />
  <g transform="translate(3, 3)">
    <circle cx="394" cy="108" r="14" class="num-circle" />
    <text x="394" y="113" text-anchor="middle" class="step-num">3</text>
    <text x="414" y="114" class="step-title">자동 테스트</text>
    <g transform="translate(-4, 0)">
      <text x="390" y="140" class="step-desc">CI 파이프라인이</text>
      <text x="390" y="156" class="step-desc">전체 테스트 자동 실행</text>
      <text x="390" y="184" class="label">검증 항목</text>
      <text x="390" y="200" class="step-desc">unit · integration · e2e</text>
    </g>
  </g>

  <line x1="521" y1="148" x2="549" y2="148" class="arrow" marker-end="url(#renarr)" />

  <!-- Step 4 -->
  <rect x="549" y="88" width="147" height="132" rx="12" class="step-bg" stroke-width="1" />
  <g transform="translate(3, 3)">
    <circle cx="569" cy="108" r="14" class="num-circle-good" />
    <text x="569" y="113" text-anchor="middle" class="step-num">4</text>
    <text x="589" y="114" class="step-title">머지</text>
    <g transform="translate(-4, 0)">
      <text x="565" y="140" class="step-desc">Patch 버전은</text>
      <text x="565" y="156" class="step-desc">자동 머지 가능</text>
      <text x="565" y="184" class="label">기본 정책</text>
      <text x="565" y="200" class="step-desc">CI 통과 + 1리뷰</text>
    </g>
  </g>

  <!-- Branch out: test pass/fail -->
  <line x1="448" y1="220" x2="448" y2="246" class="branch" />
  <line x1="380" y1="246" x2="580" y2="246" class="branch" />

  <!-- Test pass branch -->
  <rect x="380" y="256" width="200" height="68" rx="8" class="test-pass" />
  <text x="396" y="278" class="label2" fill="var(--sec-emerald-700, #047857)">테스트 통과 → 머지</text>
  <text x="396" y="296" class="step-desc" fill="var(--sec-emerald-700, #047857)">패치/마이너 자동 머지 권장</text>
  <text x="396" y="312" class="step-desc" fill="var(--sec-emerald-700, #047857)">메이저 변경은 수동 검토</text>

  <!-- Test fail branch -->
  <rect x="380" y="336" width="200" height="68" rx="8" class="test-fail" />
  <text x="396" y="358" class="label2" fill="var(--sec-red-700, #b91c1c)">테스트 실패 → 정밀 검토</text>
  <text x="396" y="376" class="step-desc" fill="var(--sec-red-700, #b91c1c)">Breaking change 가능성</text>
  <text x="396" y="392" class="step-desc" fill="var(--sec-red-700, #b91c1c)">코드 수정 또는 버전 lock</text>

  <!-- Bottom: Why -->
  <rect x="24" y="256" width="324" height="148" rx="12" fill="var(--sec-blue-50, #eff6ff)"
    stroke="var(--sec-blue-200, #bfdbfe)" />
  <text x="40" y="278" class="label2" fill="var(--sec-blue-700, #1d4ed8)">왜 자동화인가</text>
  <g transform="translate(0, 6)">
    <text x="40" y="298" class="step-desc">의존성이 수십·수백 개인 현대 프로젝트에서</text>
    <text x="40" y="314" class="step-desc">사람이 수동으로 추적하는 것은 불가능합니다.</text>
    <text x="40" y="340" class="step-desc">CVE 공개 → 자동 감지 → PR 생성 → CI 검증</text>
    <text x="40" y="356" class="step-desc">까지 30분 이내가 목표.</text>
    <text x="40" y="384" class="step-desc" fill="var(--sec-blue-700, #1d4ed8)" font-weight="600">Mean Time to Patch
      (MTTP)를 측정 지표로.</text>
  </g>
</svg>