<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="title-tw-06-02">
  <title id="title-tw-06-02">ADR의 상태 머신</title>
  <style>
    svg {
      --c-fg: #1A1A1A;
      --c-muted: #6B6862;
      --c-accent: #2D3E78;
      --c-accent-2: #B8924A;
      --c-accent-3: #9A3B3B;
      --c-line: rgba(0, 0, 0, 0.22);
      --c-card-bg: #FBF8F1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-fg: #F5F1E8;
        --c-muted: #A8A39A;
        --c-accent: #8FA3E8;
        --c-accent-2: #E6C98A;
        --c-accent-3: #D87878;
        --c-line: rgba(255, 255, 255, 0.20);
        --c-card-bg: #232326;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: var(--c-fg); }
    .state { fill: var(--c-card-bg); stroke-width: 2; }
    .state-title { font-size: 14px; font-weight: 700; }
    .state-desc { font-size: 11px; fill: var(--c-muted); }
    .trans { stroke: var(--c-muted); fill: none; stroke-width: 1.5; }
    .trans-label { font-size: 10px; fill: var(--c-muted); font-style: italic; }
    .note { font-size: 11px; fill: var(--c-muted); }
  </style>

  <defs>
    <marker id="arr-06" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 0,10 9,5" fill="var(--c-muted)"/>
    </marker>
  </defs>

  <!-- 1. Proposed -->
  <g transform="translate(50 60)">
    <rect class="state" x="0" y="0" width="170" height="80" rx="6" stroke="var(--c-accent-2)"/>
    <text class="state-title" x="20" y="28" fill="var(--c-accent-2)">Proposed</text>
    <text class="state-desc" x="20" y="48">초안 상태.</text>
    <text class="state-desc" x="20" y="62">검토를 기다림.</text>
  </g>

  <!-- 2. Accepted -->
  <g transform="translate(265 60)">
    <rect class="state" x="0" y="0" width="170" height="80" rx="6" stroke="var(--c-accent)"/>
    <text class="state-title" x="20" y="28" fill="var(--c-accent)">Accepted</text>
    <text class="state-desc" x="20" y="48">결정이 확정됨.</text>
    <text class="state-desc" x="20" y="62">기본 상태. 불변.</text>
  </g>

  <!-- 3. Rejected -->
  <g transform="translate(480 60)">
    <rect class="state" x="0" y="0" width="170" height="80" rx="6" stroke="var(--c-accent-3)" stroke-dasharray="5 3"/>
    <text class="state-title" x="20" y="28" fill="var(--c-accent-3)">Rejected</text>
    <text class="state-desc" x="20" y="48">제안되었지만</text>
    <text class="state-desc" x="20" y="62">받아들여지지 않음.</text>
  </g>

  <!-- 4. Deprecated -->
  <g transform="translate(150 230)">
    <rect class="state" x="0" y="0" width="170" height="80" rx="6" stroke="var(--c-muted)"/>
    <text class="state-title" x="20" y="28" fill="var(--c-muted)">Deprecated</text>
    <text class="state-desc" x="20" y="48">더 이상 유효하지 않음.</text>
    <text class="state-desc" x="20" y="62">대체할 ADR 없음.</text>
  </g>

  <!-- 5. Superseded -->
  <g transform="translate(380 230)">
    <rect class="state" x="0" y="0" width="170" height="80" rx="6" stroke="var(--c-muted)"/>
    <text class="state-title" x="20" y="28" fill="var(--c-muted)">Superseded</text>
    <text class="state-desc" x="20" y="48">새 ADR이 대체함.</text>
    <text class="state-desc" x="20" y="62">→ ADR-XXX로 링크.</text>
  </g>

  <!-- 화살표들 -->
  <line class="trans" x1="220" y1="100" x2="265" y2="100" marker-end="url(#arr-06)"/>
  <text class="trans-label" x="242" y="92" text-anchor="middle">승인</text>

  <path class="trans" d="M 220 65 C 290 20, 410 20, 480 65" marker-end="url(#arr-06)" stroke-dasharray="3 3"/>
  <text class="trans-label" x="350" y="22" text-anchor="middle">기각</text>

  <path class="trans" d="M 300 140 Q 250 200 235 230" marker-end="url(#arr-06)"/>
  <text class="trans-label" x="224" y="195">폐기</text>

  <path class="trans" d="M 400 140 Q 440 200 465 230" marker-end="url(#arr-06)"/>
  <text class="trans-label" x="455" y="195">대체됨</text>

  <!-- 핵심 원칙 -->
  <g transform="translate(50 360)">
    <text class="state-title" x="0" y="0" fill="var(--c-accent)">불변의 원칙</text>
    <text class="note" x="0" y="22">한 번 Accepted된 ADR은 <tspan font-weight="700">내용을 수정하지 않는다</tspan>.</text>
    <text class="note" x="0" y="40">상황이 바뀌면 <tspan font-weight="700">새 ADR</tspan>을 쓰고 옛 ADR을 Superseded로 표시한다.</text>
    <text class="note" x="0" y="58">"왜 그때 그렇게 결정했나"가 사라지면 미래의 결정도 흔들린다.</text>
  </g>
</svg>
