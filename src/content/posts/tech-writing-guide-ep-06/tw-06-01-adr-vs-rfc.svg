<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="title-tw-06-01">
  <title id="title-tw-06-01">ADR과 RFC의 위치 차이</title>
  <style>
    svg {
      --c-fg: #1A1A1A;
      --c-muted: #6B6862;
      --c-accent: #2D3E78;
      --c-accent-2: #B8924A;
      --c-accent-3: #9A3B3B;
      --c-line: rgba(0, 0, 0, 0.22);
      --c-card-bg: #FBF8F1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --c-fg: #F5F1E8;
        --c-muted: #A8A39A;
        --c-accent: #8FA3E8;
        --c-accent-2: #E6C98A;
        --c-accent-3: #D87878;
        --c-line: rgba(255, 255, 255, 0.20);
        --c-card-bg: #232326;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: var(--c-fg); }
    .timeline { stroke: var(--c-muted); stroke-width: 1.5; fill: none; }
    .marker { fill: var(--c-card-bg); stroke: var(--c-line); stroke-width: 1; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
    .col-title { font-size: 16px; font-weight: 700; }
    .col-sub { font-size: 11px; fill: var(--c-muted); font-style: italic; }
    .row-label { font-size: 10px; font-weight: 700; fill: var(--c-muted); letter-spacing: 0.5px; }
    .row-value { font-size: 12px; }
    .card { fill: var(--c-card-bg); stroke: var(--c-line); stroke-width: 1; }
  </style>

  <!-- 시간 축 -->
  <text class="row-label" x="30" y="40">의사결정의 시간선</text>
  <line class="timeline" x1="40" y1="60" x2="660" y2="60"/>
  <polygon points="660,60 650,56 650,64" fill="var(--c-muted)"/>

  <!-- 시간 점 -->
  <circle cx="160" cy="60" r="6" fill="var(--c-accent-3)"/>
  <text class="tag" x="160" y="85" text-anchor="middle" fill="var(--c-accent-3)">제안</text>
  <text class="row-label" x="160" y="100" text-anchor="middle">RFC가 사는 자리</text>

  <circle cx="350" cy="60" r="6" fill="var(--c-muted)"/>
  <text class="tag" x="350" y="85" text-anchor="middle" fill="var(--c-muted)">결정</text>

  <circle cx="540" cy="60" r="6" fill="var(--c-accent)"/>
  <text class="tag" x="540" y="85" text-anchor="middle" fill="var(--c-accent)">박제</text>
  <text class="row-label" x="540" y="100" text-anchor="middle">ADR이 사는 자리</text>

  <!-- 두 컬럼 비교 카드 -->
  <!-- RFC -->
  <g transform="translate(30 130)">
    <rect class="card" x="0" y="0" width="310" height="310" rx="6"/>
    <rect x="0" y="0" width="310" height="36" rx="6" fill="var(--c-accent-3)" fill-opacity="0.15"/>
    <text class="col-title" x="20" y="24" fill="var(--c-accent-3)">RFC</text>
    <text class="col-sub" x="60" y="24">Request for Comments</text>

    <g transform="translate(20 56)">
      <text class="row-label" x="0" y="0">시점</text>
      <text class="row-value" x="0" y="18">결정 <tspan font-weight="700">전</tspan>. 아직 안 정해진 일.</text>
    </g>
    <line x1="20" y1="90" x2="290" y2="90" stroke="var(--c-line)" stroke-width="0.5"/>

    <g transform="translate(20 110)">
      <text class="row-label" x="0" y="0">목적</text>
      <text class="row-value" x="0" y="18">동료에게 <tspan font-weight="700">의견</tspan>과 <tspan font-weight="700">동의</tspan>를 구한다.</text>
    </g>
    <line x1="20" y1="144" x2="290" y2="144" stroke="var(--c-line)" stroke-width="0.5"/>

    <g transform="translate(20 164)">
      <text class="row-label" x="0" y="0">톤</text>
      <text class="row-value" x="0" y="18">"제안합니다". 열려 있고, 설득적.</text>
    </g>
    <line x1="20" y1="198" x2="290" y2="198" stroke="var(--c-line)" stroke-width="0.5"/>

    <g transform="translate(20 218)">
      <text class="row-label" x="0" y="0">상태</text>
      <text class="row-value" x="0" y="18">Draft → Reviewing → Accepted/Rejected</text>
    </g>
    <line x1="20" y1="252" x2="290" y2="252" stroke="var(--c-line)" stroke-width="0.5"/>

    <g transform="translate(20 272)">
      <text class="row-label" x="0" y="0">수명</text>
      <text class="row-value" x="0" y="18">결정이 끝나면 <tspan font-weight="700">역할 종료</tspan></text>
    </g>
  </g>

  <!-- ADR -->
  <g transform="translate(360 130)">
    <rect class="card" x="0" y="0" width="310" height="310" rx="6"/>
    <rect x="0" y="0" width="310" height="36" rx="6" fill="var(--c-accent)" fill-opacity="0.15"/>
    <text class="col-title" x="20" y="24" fill="var(--c-accent)">ADR</text>
    <text class="col-sub" x="65" y="24">Architecture Decision Record</text>

    <g transform="translate(20 56)">
      <text class="row-label" x="0" y="0">시점</text>
      <text class="row-value" x="0" y="18">결정 <tspan font-weight="700">후</tspan>. 이미 정해진 일의 기록.</text>
    </g>
    <line x1="20" y1="90" x2="290" y2="90" stroke="var(--c-line)" stroke-width="0.5"/>

    <g transform="translate(20 110)">
      <text class="row-label" x="0" y="0">목적</text>
      <text class="row-value" x="0" y="18"><tspan font-weight="700">왜</tspan>를 미래에게 남긴다.</text>
    </g>
    <line x1="20" y1="144" x2="290" y2="144" stroke="var(--c-line)" stroke-width="0.5"/>

    <g transform="translate(20 164)">
      <text class="row-label" x="0" y="0">톤</text>
      <text class="row-value" x="0" y="18">"결정했습니다". 단정적이고 간결.</text>
    </g>
    <line x1="20" y1="198" x2="290" y2="198" stroke="var(--c-line)" stroke-width="0.5"/>

    <g transform="translate(20 218)">
      <text class="row-label" x="0" y="0">상태</text>
      <text class="row-value" x="0" y="18">Accepted · Deprecated · Superseded</text>
    </g>
    <line x1="20" y1="252" x2="290" y2="252" stroke="var(--c-line)" stroke-width="0.5"/>

    <g transform="translate(20 272)">
      <text class="row-label" x="0" y="0">수명</text>
      <text class="row-value" x="0" y="18">불변. 새 결정이 나오면 <tspan font-weight="700">대체</tspan>만 됨</text>
    </g>
  </g>
</svg>
